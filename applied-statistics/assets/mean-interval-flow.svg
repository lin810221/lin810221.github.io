<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img" aria-labelledby="title desc">
  <title id="title">母體平均數區間估計流程圖</title>
  <desc id="desc">先定義估計目標與觀察單位，確認獨立、配對、群集或時間設計。對適合的獨立模型，依母體標準差是否真正已知，選擇Z或t區間，檢查條件後完整報告。不是以樣本數30作唯一分流。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#91a08f"/></marker></defs>
  <rect x="1" y="1" width="678" height="768" rx="12" fill="#131914" stroke="#394337"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#dbe4d6">
    <text x="340" y="40" font-size="21">母體平均數區間估計</text>
    <text x="340" y="67" font-size="15" fill="#aeb9a8">先看設計與條件，再選公式</text>
    <g fill="#1c241d" stroke="#50604a" stroke-width="1.3">
      <rect x="165" y="94" width="350" height="69" rx="8"/>
      <rect x="165" y="191" width="350" height="84" rx="8"/>
      <rect x="165" y="303" width="350" height="68" rx="8"/>
      <rect x="29" y="422" width="298" height="133" rx="8"/>
      <rect x="353" y="422" width="298" height="133" rx="8"/>
      <rect x="83" y="599" width="514" height="64" rx="8"/>
      <rect x="83" y="692" width="514" height="53" rx="8"/>
    </g>
    <g font-size="18">
      <text x="340" y="122">定義目標母體、平均與觀察單位</text>
      <text x="340" y="147" font-size="15" fill="#aeb9a8">人、訂單、人次不能混用</text>
      <text x="340" y="219">確認抽樣設計與依賴關係</text>
      <text x="340" y="244" font-size="15" fill="#aeb9a8">配對先取差；群集／時間需相符方法</text>
      <text x="340" y="264" font-size="14" fill="#dcc7a3">下列分支針對可用獨立樣本模型的情況</text>
      <text x="340" y="330">母體標準差 σ 是否真正已知？</text>
      <text x="340" y="354" font-size="15" fill="#aeb9a8">同一樣本的 s 不等於已知 σ</text>
      <text x="178" y="451" fill="#dcc7a3">已知 σ → Z 區間</text>
      <text x="178" y="485" font-size="22">x̄ ± z σ / √n</text>
      <text x="178" y="516" font-size="15" fill="#aeb9a8">常態模型精確</text>
      <text x="178" y="538" font-size="15" fill="#aeb9a8">非正常時需合理大樣本近似</text>
      <text x="502" y="451" fill="#9fd3db">未知 σ → t 區間</text>
      <text x="502" y="485" font-size="22">x̄ ± t s / √n</text>
      <text x="502" y="516" font-size="15" fill="#aeb9a8">df = n − 1；常態模型精確</text>
      <text x="502" y="538" font-size="15" fill="#aeb9a8">大樣本仍可使用 t 程序</text>
      <text x="340" y="625">應用前檢查分布、極端值、有效 n 與假設</text>
      <text x="340" y="648" font-size="15" fill="#dcc7a3">若不適用，回到設計／模型；n = 30 不是通用保證</text>
      <text x="340" y="725" font-size="17">報估計值、區間、信賴水準、單位、n、方法與限制</text>
    </g>
  </g>
  <g fill="none" stroke="#91a08f" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M340 163v24"/><path d="M340 275v24"/>
    <path d="M340 371v24H178v23"/><path d="M340 371v24h162v23"/>
    <path d="M178 555v24h162v16"/><path d="M502 555v24H340"/>
    <path d="M340 663v25"/>
  </g>
</svg>
