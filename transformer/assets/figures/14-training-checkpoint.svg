<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf14-title tf14-desc"><title id="tf14-title">訓練、驗證與可恢復checkpoint</title><desc id="tf14-desc">上排訓練資料模型loss回傳梯度，下排驗證資料eval選版本，底部列checkpoint包含權重optimizer RNG設定資料tokenizer版本。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">訓練、驗證與可恢復checkpoint</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">兩個split是不同資料；圖中流程不是把valid資料送進optimizer更新。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">訓練更新權重；驗證選擇版本；checkpoint保存恢復狀態</text><rect x="78" y="213" width="284" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="220.0" y="254.0" font-size="25" fill="#9ee3dc" text-anchor="middle">固定train split</text><rect x="460" y="213" width="284" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="602.0" y="254.0" font-size="25" fill="#efcb8b" text-anchor="middle">模型＋optimizer</text><rect x="842" y="213" width="284" height="66" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="984.0" y="254.0" font-size="25" fill="#cbb7ef" text-anchor="middle">train loss / step</text><path d="M376 246 L446 246" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M435.04 241.11 L446 246 L435.04 250.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M758 246 L828 246" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M817.04 241.11 L828 246 L817.04 250.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M984 292V357H601V292" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M601 317 L601 291" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M596.11 301.96 L601 291 L605.89 301.96" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="797" y="345" font-size="22" fill="#cbb7ef" text-anchor="middle">梯度更新</text><rect x="80" y="424" width="282" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="221.0" y="465.0" font-size="25" fill="#9ee3dc" text-anchor="middle">固定valid split</text><path d="M377 457 L447 457" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M436.04 452.11 L447 457 L436.04 461.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="461" y="424" width="282" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="602.0" y="465.0" font-size="25" fill="#efcb8b" text-anchor="middle">eval＋無梯度</text><path d="M757 457 L827 457" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M816.04 452.11 L827 457 L816.04 461.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="842" y="424" width="282" height="66" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="983.0" y="465.0" font-size="25" fill="#cbb7ef" text-anchor="middle">依valid選版本</text><text x="601" y="580" font-size="22" fill="#9ee3dc" text-anchor="middle">checkpoint：權重、optimizer、step、RNG、設定、資料／tokenizer版本</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">train loss下降不等於valid改善；可恢復訓練與單純保存推論權重有不同需求。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>