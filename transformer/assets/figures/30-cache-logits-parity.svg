<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf30-title tf30-desc"><title id="tf30-title">Cache正確性：對齊logits，不只看文字</title><desc id="tf30-desc">完整前綴0,1,2,3前向與快取0,1,2加新位置3前向，底部以最大logit絕對差和容差比較。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Cache正確性：對齊logits，不只看文字</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖中位置0至3為教學序號；允許浮點容差，不能把不同精度結果要求成逐bit相同。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">同一個eval模型、同一token前綴，先比較logits再比較採樣文字</text><text x="77" y="237" font-size="25" fill="#9ee3dc" text-anchor="start">不使用cache</text><rect x="330" y="198" width="125" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="392.5" y="239.0" font-size="23" fill="#9ee3dc" text-anchor="middle">0</text><rect x="475" y="198" width="125" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="537.5" y="239.0" font-size="23" fill="#9ee3dc" text-anchor="middle">1</text><rect x="620" y="198" width="125" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="682.5" y="239.0" font-size="23" fill="#9ee3dc" text-anchor="middle">2</text><rect x="765" y="198" width="125" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="827.5" y="239.0" font-size="23" fill="#9ee3dc" text-anchor="middle">3</text><path d="M912 231 L1087 231" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1076.04 226.11 L1087 231 L1076.04 235.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1001" y="277" font-size="21" fill="#9ee3dc" text-anchor="middle">完整前綴前向</text><text x="77" y="407" font-size="25" fill="#efcb8b" text-anchor="start">使用cache</text><rect x="330" y="368" width="125" height="66" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="392.5" y="409.0" font-size="22" fill="#b5c7c0" text-anchor="middle">K/V0</text><rect x="475" y="368" width="125" height="66" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="537.5" y="409.0" font-size="22" fill="#b5c7c0" text-anchor="middle">K/V1</text><rect x="620" y="368" width="125" height="66" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="682.5" y="409.0" font-size="22" fill="#b5c7c0" text-anchor="middle">K/V2</text><rect x="765" y="368" width="125" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="827.5" y="409.0" font-size="24" fill="#efcb8b" text-anchor="middle">3</text><path d="M912 401 L1087 401" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1076.04 396.11 L1087 401 L1076.04 405.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1001" y="449" font-size="21" fill="#efcb8b" text-anchor="middle">新增位置前向</text><rect x="250" y="508" width="700" height="72" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="600.0" y="552.0" font-size="23" fill="#cbb7ef" text-anchor="middle">比較同一位置：max |logits_full - logits_cache| &lt;= tolerance</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">記錄dtype與容差；採樣文字不同可能來自RNG，不能取代cache數值一致性測試。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>