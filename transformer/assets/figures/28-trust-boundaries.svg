<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf28-title tf28-desc"><title id="tf28-title">幻覺、提示注入與工具信任邊界</title><desc id="tf28-desc">使用者規則與外部文件分別進入LLM候選輸出，紅虛線標記外部資料不可信，執行前另做權限參數來源檢查。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">幻覺、提示注入與工具信任邊界</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">上游文件可提供答案證據；權限、參數與工具呼叫由應用程式另外驗證。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">文字能包含指令語句；資料來源不因此取得工具權限</text><rect x="82" y="212" width="295" height="70" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="229.5" y="255.0" font-size="24" fill="#9ee3dc" text-anchor="middle">使用者授權／系統規則</text><rect x="822" y="212" width="295" height="70" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="969.5" y="255.0" font-size="24" fill="#efcb8b" text-anchor="middle">外部文件／工具回傳</text><rect x="451" y="336" width="297" height="74" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="599.5" y="381.0" font-size="25" fill="#cbb7ef" text-anchor="middle">LLM候選回答／操作</text><path d="M230 296 L493 320" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M482.53 314.13 L493 320 L481.64 323.88" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M970 296 L708 320" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M719.36 323.87 L708 320 L718.47 314.13" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M786 184V590" stroke="#f2a89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="963" y="351" font-size="23" fill="#f2a89f" text-anchor="middle">不可信內容區</text><text x="832" y="402" font-size="21" fill="#e8efeb" text-anchor="start">「忽略規則」仍是資料</text><text x="832" y="443" font-size="21" fill="#e8efeb" text-anchor="start">不能直接升格為授權</text><path d="M601 426 L601 472" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M605.89 461.04 L601 472 L596.11 461.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="490" width="373" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="600.5" y="532.0" font-size="24" fill="#9ee3dc" text-anchor="middle">權限與參數驗證／來源查核</text><text x="211" y="524" font-size="23" fill="#9ee3dc" text-anchor="middle">執行前檢查</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">幻覺：內容缺乏依據；注入：不可信內容企圖改變行為。兩者需要不同測試與控制。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>