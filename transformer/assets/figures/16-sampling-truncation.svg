<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf16-title tf16-desc"><title id="tf16-title">Temperature、top-k與top-p</title><desc id="tf16-desc">原分布五條機率長條與topk2重正規化0.643 0.357、topp0.8保留前三項重正規化0.529 0.294 0.176並排。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Temperature、top-k與top-p</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">本例示範截斷後機率；top-p與top-k的先後順序若同時使用，必須寫入生成設定。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">原始分布A/B/C/D/E = 0.45 / 0.25 / 0.15 / 0.10 / 0.05</text><text x="83" y="225" font-size="27" fill="#9ee3dc" text-anchor="start">原分布</text><text x="83" y="287" font-size="23" fill="#9ee3dc" text-anchor="start">A</text><rect x="117" y="259" width="135.0" height="35" rx="3" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="327" y="287" font-size="21" fill="#9ee3dc" text-anchor="start">0.450</text><text x="83" y="344" font-size="23" fill="#9ee3dc" text-anchor="start">B</text><rect x="117" y="316" width="75.0" height="35" rx="3" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="327" y="344" font-size="21" fill="#9ee3dc" text-anchor="start">0.250</text><text x="83" y="401" font-size="23" fill="#9ee3dc" text-anchor="start">C</text><rect x="117" y="373" width="45.0" height="35" rx="3" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="327" y="401" font-size="21" fill="#9ee3dc" text-anchor="start">0.150</text><text x="83" y="458" font-size="23" fill="#9ee3dc" text-anchor="start">D</text><rect x="117" y="430" width="30.0" height="35" rx="3" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="327" y="458" font-size="21" fill="#9ee3dc" text-anchor="start">0.100</text><text x="83" y="515" font-size="23" fill="#9ee3dc" text-anchor="start">E</text><rect x="117" y="487" width="15.0" height="35" rx="3" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="327" y="515" font-size="21" fill="#9ee3dc" text-anchor="start">0.050</text><text x="455" y="225" font-size="27" fill="#efcb8b" text-anchor="start">top-k=2</text><text x="455" y="287" font-size="23" fill="#efcb8b" text-anchor="start">A</text><rect x="489" y="259" width="192.87" height="35" rx="3" stroke="#efcb8b" stroke-width="1" fill="#efcb8b"/><text x="699" y="287" font-size="21" fill="#efcb8b" text-anchor="start">0.643</text><text x="455" y="344" font-size="23" fill="#efcb8b" text-anchor="start">B</text><rect x="489" y="316" width="107.13" height="35" rx="3" stroke="#efcb8b" stroke-width="1" fill="#efcb8b"/><text x="699" y="344" font-size="21" fill="#efcb8b" text-anchor="start">0.357</text><text x="455" y="401" font-size="23" fill="#efcb8b" text-anchor="start">C</text><rect x="489" y="373" width="1" height="35" rx="3" stroke="#efcb8b" stroke-width="1" fill="#172524"/><text x="699" y="401" font-size="21" fill="#efcb8b" text-anchor="start">0.000</text><text x="455" y="458" font-size="23" fill="#efcb8b" text-anchor="start">D</text><rect x="489" y="430" width="1" height="35" rx="3" stroke="#efcb8b" stroke-width="1" fill="#172524"/><text x="699" y="458" font-size="21" fill="#efcb8b" text-anchor="start">0.000</text><text x="455" y="515" font-size="23" fill="#efcb8b" text-anchor="start">E</text><rect x="489" y="487" width="1" height="35" rx="3" stroke="#efcb8b" stroke-width="1" fill="#172524"/><text x="699" y="515" font-size="21" fill="#efcb8b" text-anchor="start">0.000</text><text x="827" y="225" font-size="27" fill="#cbb7ef" text-anchor="start">top-p=0.80</text><text x="827" y="287" font-size="23" fill="#cbb7ef" text-anchor="start">A</text><rect x="861" y="259" width="158.82" height="35" rx="3" stroke="#cbb7ef" stroke-width="1" fill="#cbb7ef"/><text x="1071" y="287" font-size="21" fill="#cbb7ef" text-anchor="start">0.529</text><text x="827" y="344" font-size="23" fill="#cbb7ef" text-anchor="start">B</text><rect x="861" y="316" width="88.22999999999999" height="35" rx="3" stroke="#cbb7ef" stroke-width="1" fill="#cbb7ef"/><text x="1071" y="344" font-size="21" fill="#cbb7ef" text-anchor="start">0.294</text><text x="827" y="401" font-size="23" fill="#cbb7ef" text-anchor="start">C</text><rect x="861" y="373" width="52.949999999999996" height="35" rx="3" stroke="#cbb7ef" stroke-width="1" fill="#cbb7ef"/><text x="1071" y="401" font-size="21" fill="#cbb7ef" text-anchor="start">0.176</text><text x="827" y="458" font-size="23" fill="#cbb7ef" text-anchor="start">D</text><rect x="861" y="430" width="1" height="35" rx="3" stroke="#cbb7ef" stroke-width="1" fill="#172524"/><text x="1071" y="458" font-size="21" fill="#cbb7ef" text-anchor="start">0.000</text><text x="827" y="515" font-size="23" fill="#cbb7ef" text-anchor="start">E</text><rect x="861" y="487" width="1" height="35" rx="3" stroke="#cbb7ef" stroke-width="1" fill="#172524"/><text x="1071" y="515" font-size="21" fill="#cbb7ef" text-anchor="start">0.000</text><text x="600" y="596" font-size="22" fill="#b5c7c0" text-anchor="middle">先計softmax(z/T)，再依指定順序截斷與重新正規化；T=0需另定greedy分支。</text><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">top-p保留最小前綴直到累積機率達標；本例0.45+0.25+0.15=0.85才越過0.80。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>