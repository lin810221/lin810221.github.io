<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf22-title tf22-desc"><title id="tf22-title">MoE：活躍參數與常駐參數</title><desc id="tf22-desc">一個token經router只連到E1 E6兩expert，其餘六expert為淡色；共享200M全八expert總1B，兩expert活躍400M。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">MoE：活躍參數與常駐參數</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">token可以路由到不同expert；圖中容量只是教學數值，不是Mixtral或其他模型規格。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">教學MoE：8個expert，每token選2個；共享部分仍會執行</text><rect x="80" y="282" width="207" height="65" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="183.5" y="322.5" font-size="24" fill="#9ee3dc" text-anchor="middle">token hidden</text><path d="M300 315 L351 315" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.04 310.11 L351 315 L340.04 319.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="282" width="180" height="65" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="460.0" y="322.5" font-size="27" fill="#efcb8b" text-anchor="middle">Router</text><rect x="632" y="220" width="94" height="82" rx="5" stroke="#425952" stroke-width="1" fill="#172524"/><text x="679" y="268" font-size="24" fill="#b5c7c0" text-anchor="middle">E0</text><rect x="750" y="220" width="94" height="82" rx="5" stroke="#cbb7ef" stroke-width="3" fill="#3d3450"/><text x="797" y="268" font-size="24" fill="#cbb7ef" text-anchor="middle">E1</text><path d="M564 294H604V194H797V207" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M797 202 L797 210" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.89 199.04 L797 210 L792.11 199.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="868" y="220" width="94" height="82" rx="5" stroke="#425952" stroke-width="1" fill="#172524"/><text x="915" y="268" font-size="24" fill="#b5c7c0" text-anchor="middle">E2</text><rect x="986" y="220" width="94" height="82" rx="5" stroke="#425952" stroke-width="1" fill="#172524"/><text x="1033" y="268" font-size="24" fill="#b5c7c0" text-anchor="middle">E3</text><rect x="632" y="358" width="94" height="82" rx="5" stroke="#425952" stroke-width="1" fill="#172524"/><text x="679" y="406" font-size="24" fill="#b5c7c0" text-anchor="middle">E4</text><rect x="750" y="358" width="94" height="82" rx="5" stroke="#425952" stroke-width="1" fill="#172524"/><text x="797" y="406" font-size="24" fill="#b5c7c0" text-anchor="middle">E5</text><rect x="868" y="358" width="94" height="82" rx="5" stroke="#cbb7ef" stroke-width="3" fill="#3d3450"/><text x="915" y="406" font-size="24" fill="#cbb7ef" text-anchor="middle">E6</text><path d="M564 334H604V469H915V453" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M915 453 L915 449" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M910.11 459.96 L915 449 L919.89 459.96" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="986" y="358" width="94" height="82" rx="5" stroke="#425952" stroke-width="1" fill="#172524"/><text x="1033" y="406" font-size="24" fill="#b5c7c0" text-anchor="middle">E7</text><text x="832" y="527" font-size="23" fill="#cbb7ef" text-anchor="middle">2個expert啟用，其餘權重仍需存放</text><text x="600" y="589" font-size="21" fill="#efcb8b" text-anchor="middle">共享200M + 全部8×100M = 1000M；單token活躍約200M+2×100M = 400M</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">忽略router小量參數的原創算例；活躍參數較少不等於權重記憶體只需400M。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>