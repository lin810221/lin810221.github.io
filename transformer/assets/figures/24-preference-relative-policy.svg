<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf24-title tf24-desc"><title id="tf24-title">偏好、reference與DPO的相對比較</title><desc id="tf24-desc">prompt連到chosen和rejected兩回答，DPO計算policy序列logprob差減reference差，再用負log sigmoid beta delta。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">偏好、reference與DPO的相對比較</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖中logπ表示固定prompt下回答序列的log-prob；遮罩、tokenizer與序列分數定義必須一致。</text><rect x="44" y="142" width="535" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">同一prompt：偏好回答成對保存</text><rect x="623" y="142" width="533" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="645" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">比較相對於reference的log-prob</text><rect x="91" y="212" width="438" height="61" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="310.0" y="250.5" font-size="26" fill="#9ee3dc" text-anchor="middle">prompt x</text><rect x="91" y="319" width="438" height="69" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="310.0" y="361.5" font-size="25" fill="#efcb8b" text-anchor="middle">chosen y+：較受偏好</text><rect x="91" y="434" width="438" height="69" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="310.0" y="476.5" font-size="24" fill="#cbb7ef" text-anchor="middle">rejected y-：較不受偏好</text><text x="310" y="578" font-size="21" fill="#b5c7c0" text-anchor="middle">偏好是資料標籤，不等於絕對真偽</text><text x="661" y="231" font-size="21" fill="#9ee3dc" text-anchor="start">policy差值：logπ(y+) - logπ(y-)</text><text x="661" y="287" font-size="21" fill="#9ee3dc" text-anchor="start">reference差值：logπref(y+) - logπref(y-)</text><path d="M891 338 L891 384" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M895.89 373.04 L891 384 L886.11 373.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="674" y="402" width="430" height="70" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="889.0" y="445.0" font-size="22" fill="#efcb8b" text-anchor="middle">Δ = policy差值 - reference差值</text><text x="889" y="546" font-size="23" fill="#cbb7ef" text-anchor="middle">DPO loss = -log sigmoid(βΔ)</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">reward／KL方法以獎勵與偏離參考policy的成本權衡；DPO可直接用偏好對訓練。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>