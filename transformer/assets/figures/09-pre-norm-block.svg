cap="round" stroke-linejoin="round"/><circle cx="825" cy="475" r="23" stroke="#cbb7ef" stroke-width="3" fill="#172524"/><text x="825" y="483" font-size="29" fill="#cbb7ef" text-anchor="middle">+</text><path d="M825 374H216V475H252" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 475 L254 475" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M243.04 470.11 L254 475 L243.04 479.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M216 475V562H825V512" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M825 524 L825 502" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M820.11 512.96 L825 502 L829.89 512.96" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M860 475 L1058 475" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1047.04 470.11 L1058 475 L1047.04 479.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="995" y="437" font-size="24" fill="#cbb7ef" text-anchor="middle">同形狀輸出</text><text x="50" y="675" font-size="21" fill="#b5c7c0" text-anchor="start">這是pre-norm變體；原始Transformer採post-norm。層順序、Norm種類與MLP形式依架構而定。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>