<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf09-title tf09-desc"><title id="tf09-title">Transformer block的主路徑與殘差</title><desc id="tf09-desc">輸入X經Norm因果注意力與殘差加法，再經Norm MLP第二次殘差加法，整層保持B S D形狀。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Transformer block的主路徑與殘差</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">注意力和MLP會混合不同維度，但每次殘差相加的兩端必須有相同形狀。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">Pre-norm decoder block：每個子層都有殘差相加</text><rect x="85" y="263" width="110" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="140.0" y="304.0" font-size="23" fill="#9ee3dc" text-anchor="middle">X</text><path d="M207 296 L246 296" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.04 291.11 L246 296 L235.04 300.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="267" y="263" width="174" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="354.0" y="304.0" font-size="25" fill="#9ee3dc" text-anchor="middle">Norm</text><path d="M454 296 L494 296" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M483.04 291.11 L494 296 L483.04 300.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="263" width="227" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="627.5" y="304.0" font-size="23" fill="#efcb8b" text-anchor="middle">Causal Attention</text><path d="M754 296 L793 296" stroke="#efcb8b" stroke-widt