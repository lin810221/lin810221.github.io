<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf25-title tf25-desc"><title id="tf25-title">NLL聚合與Perplexity的比較前提</title><desc id="tf25-desc">兩批分別NLL4有效token2和NLL8有效token8，合併平均12除10=1.2 PPL3.3201，不能平均批次loss得1.5。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">NLL聚合與Perplexity的比較前提</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">原創兩批算例，採自然對數；PPL是每有效token平均NLL的指數。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">兩批資料長度不同：先加總有效token的NLL，再除總token數</text><rect x="88" y="220" width="442" height="143" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="309" y="263" font-size="27" fill="#9ee3dc" text-anchor="middle">Batch A：2個目標token</text><text x="309" y="320" font-size="25" fill="#e8efeb" text-anchor="middle">NLL總和=4；平均=2</text><rect x="668" y="220" width="442" height="143" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="889" y="263" font-size="27" fill="#efcb8b" text-anchor="middle">Batch B：8個目標token</text><text x="889" y="320" font-size="25" fill="#e8efeb" text-anchor="middle">NLL總和=8；平均=1</text><path d="M309 380 L511 441" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M501.93 433.15 L511 441 L499.10 442.52" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M889 380 L691 441" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M702.91 442.45 L691 441 L700.03 433.10" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="373" y="462" width="454" height="72" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="600.0" y="506.0" font-size="25" fill="#cbb7ef" text-anchor="middle">正確平均 = (4+8)/(2+8) = 1.2</text><text x="600" y="590" font-size="23" fill="#e8efeb" text-anchor="middle">PPL=exp(1.2)=3.3201；直接平均兩批loss得到1.5會加錯權重。</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">PPL比較需相同tokenizer、語料、截斷／上下文與loss mask；不同token分母不能直接排名。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>