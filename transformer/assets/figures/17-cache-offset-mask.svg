<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf17-title tf17-desc"><title id="tf17-title">KV cache與非正方形因果遮罩</title><desc id="tf17-desc">K與V各有舊位置0,1,2及新位置3,4，本次兩query的5欄允許遮罩分別11110與11111。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">KV cache與非正方形因果遮罩</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">精確案例：past_len=3、new_len=2，query絕對位置3與4；矩陣列為query、欄為key。</text><rect x="44" y="142" width="540" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">過去3個位置；本次新增2個位置</text><rect x="630" y="142" width="526" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="652" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">本次Q只需2列；key共有5欄</text><text x="85" y="229" font-size="24" fill="#9ee3dc" text-anchor="start">K cache</text><rect x="85" y="252" width="76" height="64" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="123.0" y="292.0" font-size="23" fill="#9ee3dc" text-anchor="middle">0</text><rect x="176" y="252" width="76" height="64" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="214.0" y="292.0" font-size="23" fill="#9ee3dc" text-anchor="middle">1</text><rect x="267" y="252" width="76" height="64" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="305.0" y="292.0" font-size="23" fill="#9ee3dc" text-anchor="middle">2</text><rect x="358" y="252" width="76" height="64" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="396.0" y="292.0" font-size="23" fill="#efcb8b" text-anchor="middle">3</text><rect x="449" y="252" width="76" height="64" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="487.0" y="292.0" font-size="23" fill="#efcb8b" text-anchor="middle">4</text><text x="85" y="395" font-size="24" fill="#9ee3dc" text-anchor="start">V cache</text><rect x="85" y="418" width="76" height="64" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="123.0" y="458.0" font-size="23" fill="#9ee3dc" text-anchor="middle">0</text><rect x="176" y="418" width="76" height="64" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="214.0" y="458.0" font-size="23" fill="#9ee3dc" text-anchor="middle">1</text><rect x="267" y="418" width="76" height="64" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="305.0" y="458.0" font-size="23" fill="#9ee3dc" text-anchor="middle">2</text><rect x="358" y="418" width="76" height="64" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="396.0" y="458.0" font-size="23" fill="#efcb8b" text-anchor="middle">3</text><rect x="449" y="418" width="76" height="64" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="487.0" y="458.0" font-size="23" fill="#efcb8b" text-anchor="middle">4</text><path d="M85 341H343" stroke="#9ee3dc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="214" y="380" font-size="22" fill="#9ee3dc" text-anchor="middle">已快取</text><path d="M358 341H526" stroke="#efcb8b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="444" y="380" font-size="22" fill="#efcb8b" text-anchor="middle">新增</text><text x="304" y="575" font-size="21" fill="#b5c7c0" text-anchor="middle">各層保存K與V；Q不需歷史快取</text><rect x="762" y="283" width="64" height="64" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="794.0" y="322.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><rect x="826" y="283" width="64" height="64" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="858.0" y="322.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><rect x="890" y="283" width="64" height="64" rx=