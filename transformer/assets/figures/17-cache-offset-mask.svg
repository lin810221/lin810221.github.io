#b5c7c0" text-anchor="middle">k4</text><text x="892" y="479" font-size="23" fill="#efcb8b" text-anchor="middle">允許條件：key_pos &lt;= query_pos</text><text x="892" y="548" font-size="20" fill="#f2a89f" text-anchor="middle">past_len=3，不能直接套左上2×5三角</text><text x="50" y="676" font-size="23" fill="#b5c7c0" text-anchor="start">SDPA bool True／1=允許；position_id與cache位置規則須協調；padding另處理。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>