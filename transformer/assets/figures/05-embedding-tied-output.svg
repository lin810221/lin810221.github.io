"#9ee3dc" text-anchor="middle">0.4</text><rect x="232" y="496" width="56" height="56" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="260.0" y="531.0" font-size="21" fill="#9ee3dc" text-anchor="middle">0.0</text><rect x="288" y="496" width="56" height="56" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="316.0" y="531.0" font-size="21" fill="#9ee3dc" text-anchor="middle">0.1</text><text x="149" y="250" font-size="21" fill="#b5c7c0" text-anchor="end">0</text><text x="149" y="306" font-size="21" fill="#b5c7c0" text-anchor="end">1</text><text x="149" y="362" font-size="21" fill="#b5c7c0" text-anchor="end">2</text><text x="149" y="418" font-size="21" fill="#b5c7c0" text-anchor="end">3</text><text x="149" y="474" font-size="21" fill="#b5c7c0" text-anchor="end">4</text><text x="149" y="530" font-size="21" fill="#b5c7c0" text-anchor="end">5</text><rect x="176" y="272" width="168" height="56" rx="0" stroke="#9ee3dc" stroke-width="4" fill="none"/><rect x="176" y="440" width="168" height="56" rx="0" stroke="#efcb8b" stroke-width="4" fill="none"/><text x="389" y="301" font-size="24" fill="#9ee3dc" text-anchor="start">ID 1</text><text x="389" y="469" font-size="24" fill="#efcb8b" text-anchor="start">ID 4</text><text x="284" y="592" font-size="20" fill="#b5c7c0" text-anchor="middle">lookup選取資料列；不是one-hot乘法的必要實作</text><rect x="723" y="236" width="367" height="70" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="906.5" y="279.0" font-size="25" fill="#cbb7ef" text-anchor="middle">隱狀態 h：D 維</text><path d="M907 322 L907 369" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M911.89 358.04 L907 369 L902.11 358.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="723" y="386" width="367" height="70" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="906.5" y="429.0" font-size="25" fill="#efcb8b" text-anchor="middle">logits = h × E^T</text><text x="907" y="517" font-size="25" fill="#efcb8b" text-anchor="middle">輸出：V個詞表分數</text><text x="907" y="575" font-size="20" fill="#b5c7c0" text-anchor="middle">tied weights：共用參數，不是複製兩份</text><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">本圖V=6、D=3；共用E需維度一致。Embedding相近不等於兩個token語意完全相同。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>