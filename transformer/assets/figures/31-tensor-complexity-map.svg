<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf31-title tf31-desc"><title id="tf31-title">張量形狀、密集注意力與cache對照</title><desc id="tf31-desc">五列表格將token hidden QKV dense scores cache對應形狀，dense scores平方長度，cache線性長度再乘dtypebytes。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">張量形狀、密集注意力與cache對照</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">以B批次、S序列長度、D隱藏維度、H heads、L層數；忽略投影與MLP等其他成本時才用表中簡式。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">記住符號與物件，再估算時間與空間</text><text x="82" y="240" font-size="23" fill="#9ee3dc" text-anchor="start">Token IDs</text><text x="383" y="240" font-size="23" fill="#e8efeb" text-anchor="start">B × S</text><text x="880" y="240" font-size="21" fill="#b5c7c0" text-anchor="start">整數索引</text><path d="M78 262H1122" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="315" font-size="23" fill="#efcb8b" text-anchor="start">Hidden states</text><text x="383" y="315" font-size="23" fill="#e8efeb" text-anchor="start">B × S × D</text><text x="880" y="315" font-size="21" fill="#b5c7c0" text-anchor="start">每位置表示</text><path d="M78 337H1122" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="390" font-size="23" fill="#cbb7ef" text-anchor="start">Q / K / V</text><text x="383" y="390" font-size="23" fill="#e8efeb" text-anchor="start">B × H × S × Dh</text><text x="880" y="390" font-size="21" fill="#b5c7c0" text-anchor="start">head內投影</text><path d="M78 412H1122" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="465" font-size="23" fill="#9ee3dc" text-anchor="start">Dense scores</text><text x="383" y="465" font-size="23" fill="#e8efeb" text-anchor="start">B × H × S × S</text><text x="880" y="465" font-size="21" fill="#b5c7c0" text-anchor="start">算術約O(B×S²×D)</text><path d="M78 487H1122" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="540" font-size="23" fill="#efcb8b" text-anchor="start">KV cache</text><text x="383" y="540" font-size="23" fill="#e8efeb" text-anchor="start">2 × B × L × S × Hkv × Dh</text><text x="880" y="540" font-size="21" fill="#b5c7c0" text-anchor="start">再乘dtype bytes</text><path d="M78 562H1122" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="676" font-size="21" fill="#b5c7c0" text-anchor="start">圖中Q/K/V列為MHA同head數簡寫；GQA的Q用Hq、K/V用Hkv；生成時query長度可不同。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>