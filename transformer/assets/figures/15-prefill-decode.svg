<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf15-title tf15-desc"><title id="tf15-title">自回歸生成：先讀前綴，再逐字延伸</title><desc id="tf15-desc">prefill我喜歡建立KV，decode第一步新產生貓，第二步把貓接回前綴再產生句點，舊前綴以淡色顯示。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">自回歸生成：先讀前綴，再逐字延伸</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">這裡用中文字作自訂token，只為展示時間順序；真實token可能是片段或bytes。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">Prefill處理整段已知前綴；Decode逐次加入新token</text><text x="79" y="226" font-size="26" fill="#9ee3dc" text-anchor="start">prefill</text><rect x="259" y="187" width="156" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="337.0" y="228.0" font-size="23" fill="#9ee3dc" text-anchor="middle">我</text><rect x="443" y="187" width="156" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="521.0" y="228.0" font-size="23" fill="#9ee3dc" text-anchor="middle">喜</text><rect x="627" y="187" width="156" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="705.0" y="228.0" font-size="23" fill="#9ee3dc" text-anchor="middle">歡</text><path d="M796 221 L1075 221" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1064.04 216.11 L1075 221 L1064.04 225.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="940" y="263" font-size="23" fill="#9ee3dc" text-anchor="middle">先建立前綴KV</text><text x="79" y="377" font-size="24" fill="#efcb8b" text-anchor="start">decode 1</text><rect x="259" y="337" width="129" height="62" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="323.5" y="376.0" font-size="23" fill="#b5c7c0" text-anchor="middle">我</text><rect x="413" y="337" width="129" height="62" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="477.5" y="376.0" font-size="23" fill="#b5c7c0" text-anchor="middle">喜</text><rect x="567" y="337" width="129" height="62" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="631.5" y="376.0" font-size="23" fill="#b5c7c0" text-anchor="middle">歡</text><rect x="721" y="337" width="129" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="785.5" y="376.0" font-size="23" fill="#efcb8b" text-anchor="middle">貓</text><text x="1108" y="377" font-size="23" fill="#efcb8b" text-anchor="middle">新</text><text x="79" y="487" font-size="24" fill="#efcb8b" text-anchor="start">decode 2</text><rect x="259" y="447" width="129" height="62" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="323.5" y="486.0" font-size="23" fill="#b5c7c0" text-anchor="middle">我</text><rect x="413" y="447" width="129" height="62" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="477.5" y="486.0" font-size="23" fill="#b5c7c0" text-anchor="middle">喜</text><rect x="567" y="447" width="129" height="62" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="631.5" y="486.0" font-size="23" fill="#b5c7c0" text-anchor="middle">歡</text><rect x="721" y="447" width="129" height="62" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="785.5" y="486.0" font-size="23" fill="#b5c7c0" text-anchor="middle">貓</text><rect x="875" y="447" width="129" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="939.5" y="486.0" font-size="23" fill="#efcb8b" text-anchor="middle">。</text><text x="1108" y="487" font-size="23" fill="#efcb8b" text-anchor="middle">新</text><text x="601" y="590" font-size="22" fill="#e8efeb" text-anchor="middle">產生一個token後，下一步才把它當作已知輸入；已知前綴可共用KV。</text><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">TTFT常受prefill影響；每token延遲與整段吞吐量還取決於batch、長度與硬體。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>