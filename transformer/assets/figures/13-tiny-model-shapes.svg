<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf13-title tf13-desc"><title id="tf13-title">Tiny GPT的張量流</title><desc id="tf13-desc">2乘4 IDs經embedding和blocks成2乘4乘8，兩個head內QKV各2乘2乘4乘4，輸出logits2乘4乘16。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Tiny GPT的張量流</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">本圖是原創小型設定，不是任何商業模型規格；B批次、S長度、D隱藏維度、V詞表大小。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">教學模型：B=2、S=4、D=8、H=2、head_dim=4、V=16</text><rect x="80" y="226" width="225" height="133" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="192" y="272" font-size="27" fill="#9ee3dc" text-anchor="middle">IDs</text><text x="192" y="321" font-size="25" fill="#e8efeb" text-anchor="middle">2 × 4</text><path d="M315 292 L326 292" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M315.04 287.11 L326 292 L315.04 296.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="334" y="226" width="225" height="133" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="446" y="272" font-size="27" fill="#efcb8b" text-anchor="middle">Embedding</text><text x="446" y="321" font-size="25" fill="#e8efeb" text-anchor="middle">2 × 4 × 8</text><path d="M569 292 L580 292" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M569.04 287.11 L580 292 L569.04 296.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="588" y="226" width="225" height="133" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="700" y="272" font-size="27" fill="#cbb7ef" text-anchor="middle">Blocks</text><text x="700" y="321" font-size="25" fill="#e8efeb" text-anchor="middle">2 × 4 × 8</text><path d="M823 292 L834 292" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M823.04 287.11 L834 292 L823.04 296.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="842" y="226" width="225" height="133" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="954" y="272" font-size="27" fill="#9ee3dc" text-anchor="middle">LM head</text><text x="954" y="321" font-size="25" fill="#e8efeb" text-anchor="middle">2 × 4 × 16</text><text x="102" y="433" font-size="25" fill="#efcb8b" text-anchor="start">Q、K、V：2 × 2 × 4 × 4</text><text x="102" y="487" font-size="25" fill="#cbb7ef" text-anchor="start">attention scores：2 × 2 × 4 × 4</text><text x="102" y="541" font-size="24" fill="#9ee3dc" text-anchor="start">每個位置16個logits；CE前可展平成8 × 16</text><text x="50" y="676" font-size="23" fill="#b5c7c0" text-anchor="start">D=H×head_dim；把head軸展開或合回時，檢查transpose與reshape的順序。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>