<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf04-title tf04-desc"><title id="tf04-title">BPE：從較小片段到子詞</title><desc id="tf04-desc">lower先分l o w e r，按順位合併l加o成lo，再lo加w成low，最後low e r。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">BPE：從較小片段到子詞</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">此為原創字元級合併範例；真實byte-level BPE還包含前切分、byte映射與特殊token處理。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">教學BPE：固定合併順位；此例省略詞界與byte前處理</text><text x="79" y="223" font-size="25" fill="#9ee3dc" text-anchor="start">訓練資料：low × 3、lower × 1</text><rect x="85" y="261" width="135" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="152.5" y="300.0" font-size="23" fill="#9ee3dc" text-anchor="middle">l</text><rect x="246" y="261" width="135" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="313.5" y="300.0" font-size="23" fill="#9ee3dc" text-anchor="middle">o</text><rect x="407" y="261" width="135" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="474.5" y="300.0" font-size="23" fill="#9ee3dc" text-anchor="middle">w</text><rect x="568" y="261" width="135" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="635.5" y="300.0" font-size="23" fill="#9ee3dc" text-anchor="middle">e</text><rect x="729" y="261" width="135" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="796.5" y="300.0" font-size="23" fill="#9ee3dc" text-anchor="middle">r</text><path d="M94 339H371" stroke="#efcb8b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="239" y="381" font-size="24" fill="#efcb8b" text-anchor="middle">先合併 l + o → lo</text><path d="M589 344 L589 413" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M593.89 402.04 L589 413 L584.11 402.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="85" y="432" width="130" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="150.0" y="471.0" font-size="23" fill="#efcb8b" text-anchor="middle">lo</text><rect x="233" y="432" width="130" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="298.0" y="471.0" font-size="23" fill="#efcb8b" text-anchor="middle">w</text><rect x="381" y="432" width="130" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="446.0" y="471.0" font-size="23" fill="#efcb8b" text-anchor="middle">e</text><rect x="529" y="432" width="130" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="594.0" y="471.0" font-size="23" fill="#efcb8b" text-anchor="middle">r</text><path d="M88 516H363" stroke="#cbb7ef" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="558" font-size="24" fill="#cbb7ef" text-anchor="middle">再合併 lo + w → low</text><rect x="809" y="432" width="92" height="62" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="855.0" y="471.0" font-size="23" fill="#cbb7ef" text-anchor="middle">low</text><rect x="913" y="432" width="92" height="62" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="959.0" y="471.0" font-size="23" fill="#cbb7ef" text-anchor="middle">e</text><rect x="1017" y="432" width="92" height="62" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="1063.0" y="471.0" font-size="23" fill="#cbb7ef" text-anchor="middle">r</text><path d="M680 463 L790 463" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M779.04 458.11 L790 463 L779.04 467.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="980" y="362" font-size="23" fill="#cbb7ef" text-anchor="middle">編碼結果</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">合併規則在訓練tokenizer時決定；推論使用已保存的規則，不對每個句子重新學習。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>