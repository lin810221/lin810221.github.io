<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf23-title tf23-desc"><title id="tf23-title">預訓練、SFT與偏好調整</title><desc id="tf23-desc">一般語料下一token、指令示範、同題回答偏好三個階段依序得到base SFT和偏好調整policy。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">預訓練、SFT與偏好調整</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">資料卡片是原理示意；本課不把紙上流程宣稱成已完成大模型訓練。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">每個階段改變學習訊號；模型角色與資料都要記錄</text><rect x="77" y="222" width="298" height="191" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="226" y="269" font-size="29" fill="#9ee3dc" text-anchor="middle">Pretraining</text><text x="226" y="330" font-size="23" fill="#e8efeb" text-anchor="middle">一般語料</text><text x="226" y="373" font-size="23" fill="#e8efeb" text-anchor="middle">下一token目標</text><path d="M385 317 L438 317" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M427.04 312.11 L438 317 L427.04 321.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="451" y="222" width="298" height="191" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="600" y="269" font-size="29" fill="#efcb8b" text-anchor="middle">SFT</text><text x="600" y="330" font-size="23" fill="#e8efeb" text-anchor="middle">指令＋示範回答</text><text x="600" y="373" font-size="23" fill="#e8efeb" text-anchor="middle">監督式目標</text><path d="M759 317 L812 317" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.04 312.11 L812 317 L801.04 321.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="825" y="222" width="298" height="191" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="974" y="269" font-size="29" fill="#cbb7ef" text-anchor="middle">Preference</text><text x="974" y="330" font-size="23" fill="#e8efeb" text-anchor="middle">同題回答比較</text><text x="974" y="373" font-size="23" fill="#e8efeb" text-anchor="middle">偏好訊號</text><rect x="141" y="479" width="268" height="64" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="275.0" y="519.0" font-size="24" fill="#9ee3dc" text-anchor="middle">Base model</text><rect x="481" y="479" width="268" height="64" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="615.0" y="519.0" font-size="24" fill="#efcb8b" text-anchor="middle">SFT policy</text><rect x="821" y="479" width="268" height="64" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="955.0" y="519.0" font-size="24" fill="#cbb7ef" text-anchor="middle">偏好調整policy</text><text x="600" y="588" font-size="22" fill="#b5c7c0" text-anchor="middle">這是常見流程，不表示每個模型都用相同演算法，或偏好調整會保證事實正確。</text><text x="50" y="676" font-size="23" fill="#b5c7c0" text-anchor="start">保存資料版本、角色模板、loss範圍與參考policy；評估仍需獨立測試。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>