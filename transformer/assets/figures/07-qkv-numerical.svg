<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf07-title tf07-desc"><title id="tf07-title">Q、K、V：先找關聯，再聚合內容</title><desc id="tf07-desc">查詢1和兩個key1,0得到分數1,0，softmax為0.7311,0.2689，再用此顯示權重加權V兩列2,0與0,4得到1.4622,1.0756。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Q、K、V：先找關聯，再聚合內容</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">先將softmax四捨五入，再用圖中權重乘V示範；與完整精度計算會有微小差異。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">單head教學例：Q／K為1維，V為2維；不含mask與dropout</text><text x="89" y="226" font-size="26" fill="#9ee3dc" text-anchor="start">q=[1]</text><rect x="93" y="266" width="62" height="62" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="124.0" y="304.0" font-size="21" fill="#9ee3dc" text-anchor="middle">1</text><rect x="93" y="328" width="62" height="62" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="124.0" y="366.0" font-size="21" fill="#9ee3dc" text-anchor="middle">0</text><text x="124" y="445" font-size="26" fill="#9ee3dc" text-anchor="middle">K</text><path d="M176 326 L274 326" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M263.04 321.11 L274 326 L263.04 330.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="295" y="266" width="115" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="352.5" y="305.0" font-size="23" fill="#efcb8b" text-anchor="middle">1</text><rect x="424" y="266" width="115" height="62" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="481.5" y="305.0" font-size="23" fill="#efcb8b" text-anchor="middle">0</text><text x="417" y="445" font-size="23" fill="#efcb8b" text-anchor="middle">qK^T / sqrt(1)</text><path d="M555 326 L624 326" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M613.04 321.11 L624 326 L613.04 330.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="642" y="266" width="141" height="62" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="712.5" y="305.0" font-size="23" fill="#cbb7ef" text-anchor="middle">0.7311</text><rect x="797" y="266" width="141" height="62" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="867.5" y="305.0" font-size="23" fill="#cbb7ef" text-anchor="middle">0.2689</text><text x="791" y="445" font-size="23" fill="#cbb7ef" text-anchor="middle">softmax：和=1</text><rect x="958" y="250" width="59" height="59" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="987.5" y="286.5" font-size="21" fill="#efcb8b" text-anchor="middle">2</text><rect x="1017" y="250" width="59" height="59" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="1046.5" y="286.5" font-size="21" fill="#efcb8b" text-anchor="middle">0</text><rect x="958" y="309" width="59" height="59" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="987.5" y="345.5" font-size="21" fill="#efcb8b" text-anchor="middle">0</text><rect x="1017" y="309" width="59" height="59" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="1046.5" y="345.5" font-size="21" fill="#efcb8b" text-anchor="middle">4</text><text x="1016" y="445" font-size="26" fill="#efcb8b" text-anchor="middle">V</text><text x="599" y="538" font-size="25" fill="#9ee3dc" text-anchor="middle">0.7311 × [2,0] + 0.2689 × [0,4] = [1.4622, 1.0756]</text><text x="50" y="676" font-size="23" fill="#b5c7c0" text-anchor="start">先用Q與K得到位置權重，再加權V；注意力權重不是最終詞表機率。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>