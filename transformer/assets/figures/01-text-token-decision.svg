<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf01-title tf01-desc"><title id="tf01-title">從文字到下一個token</title><desc id="tf01-desc">天氣好先變成12,7,25三個教學token ID，Transformer輸出句點問號驚嘆號機率0.6,0.3,0.1，再由解碼規則選擇。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">從文字到下一個token</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">這張圖使用自訂詞表與虛構分數；token通常不是一個字或一個詞。</text><rect x="44" y="142" width="1112" height="488" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">模型產生詞表分數；解碼規則把分數變成下一個token</text><text x="83" y="223" font-size="25" fill="#9ee3dc" text-anchor="start">輸入文字</text><rect x="79" y="247" width="274" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="216.0" y="288.0" font-size="30" fill="#9ee3dc" text-anchor="middle">天氣好</text><path d="M368 280 L442 280" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M431.04 275.11 L442 280 L431.04 284.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="466" y="247" width="84" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="508.0" y="288.0" font-size="23" fill="#efcb8b" text-anchor="middle">12</text><rect x="560" y="247" width="84" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="602.0" y="288.0" font-size="23" fill="#efcb8b" text-anchor="middle">7</text><rect x="654" y="247" width="84" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="696.0" y="288.0" font-size="23" fill="#efcb8b" text-anchor="middle">25</text><text x="594" y="359" font-size="21" fill="#b5c7c0" text-anchor="middle">教學詞表ID，非真實tokenizer</text><path d="M596 383 L596 424" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M600.89 413.04 L596 424 L591.11 413.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="466" y="445" width="260" height="69" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="596.0" y="487.5" font-size="25" fill="#cbb7ef" text-anchor="middle">Transformer</text><path d="M740 480 L804 480" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M793.04 475.11 L804 480 L793.04 484.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="847" y="455" font-size="26" fill="#9ee3dc" text-anchor="start">。</text><rect x="887" y="429" width="180.0" height="34" rx="3" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><text x="1100" y="455" font-size="23" fill="#9ee3dc" text-anchor="start">0.6</text><text x="847" y="510" font-size="26" fill="#efcb8b" text-anchor="start">嗎</text><rect x="887" y="484" width="90.0" height="34" rx="3" stroke="#efcb8b" stroke-width="0" fill="#efcb8b"/><text x="1100" y="510" font-size="23" fill="#efcb8b" text-anchor="start">0.3</text><text x="847" y="565" font-size="26" fill="#cbb7ef" text-anchor="start">！</text><rect x="887" y="539" width="30.0" height="34" rx="3" stroke="#cbb7ef" stroke-width="0" fill="#cbb7ef"/><text x="1100" y="565" font-size="23" fill="#cbb7ef" text-anchor="start">0.1</text><text x="82" y="495" font-size="24" fill="#efcb8b" text-anchor="start">選擇：greedy／採樣</text><text x="82" y="541" font-size="22" fill="#e8efeb" text-anchor="start">下一步再把新token接回前綴</text><text x="50" y="675" font-size="23" fill="#b5c7c0" text-anchor="start">文字、token ID、logit、機率與最後決策，各有不同的資料型別與意義。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>