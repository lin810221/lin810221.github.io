<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf10-title tf10-desc"><title id="tf10-title">Encoder、Decoder與Cross-Attention</title><desc id="tf10-desc">三列分別把來源序列或目標前綴作為QKV，cross attention則用目標隱狀態作Q而encoder輸出作KV。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Encoder、Decoder與Cross-Attention</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">顯示的是資訊來源，不代表三種注意力必須共用參數；來源與目標長度也可不同。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">Self-Attention與Cross-Attention：Q、K、V從哪裡來</text><text x="77" y="254" font-size="24" fill="#9ee3dc" text-anchor="start">Encoder self</text><rect x="329" y="214" width="253" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="455.5" y="255.0" font-size="23" fill="#9ee3dc" text-anchor="middle">來源序列</text><text x="610" y="256" font-size="25" fill="#9ee3dc" text-anchor="start">Q</text><path d="M588 247 L650 247" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.04 242.11 L650 247 L639.04 251.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="670" y="214" width="211" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="775.5" y="255.0" font-size="24" fill="#9ee3dc" text-anchor="middle">Attention</text><text x="912" y="223" font-size="24" fill="#9ee3dc" text-anchor="start">K、V</text><rect x="906" y="238" width="212" height="54" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="1012.0" y="273.0" font-size="21" fill="#9ee3dc" text-anchor="middle">來源序列</text><path d="M901 264 L888 264" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M898.96 268.89 L888 264 L898.96 259.11" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="394" font-size="24" fill="#efcb8b" text-anchor="start">Decoder self</text><rect x="329" y="354" width="253" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="455.5" y="395.0" font-size="23" fill="#efcb8b" text-anchor="middle">目標前綴</text><text x="610" y="396" font-size="25" fill="#efcb8b" text-anchor="start">Q</text><path d="M588 387 L650 387" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.04 382.11 L650 387 L639.04 391.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="670" y="354" width="211" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="775.5" y="395.0" font-size="24" fill="#efcb8b" text-anchor="middle">Attention</text><text x="912" y="363" font-size="24" fill="#efcb8b" text-anchor="start">K、V</text><rect x="906" y="378" width="212" height="54" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="1012.0" y="413.0" font-size="21" fill="#efcb8b" text-anchor="middle">目標前綴</text><path d="M901 404 L888 404" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M898.96 408.89 L888 404 L898.96 399.11" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="534" font-size="24" fill="#cbb7ef" text-anchor="start">Cross-attention</text><rect x="329" y="494" width="253" height="66" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="455.5" y="535.0" font-size="23" fill="#cbb7ef" text-anchor="middle">目標隱狀態</text><text x="610" y="536" font-size="25" fill="#cbb7ef" text-anchor="start">Q</text><path d="M588 527 L650 527" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.04 522.11 L650 527 L639.04 531.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="670" y="494" width="211" height="66" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="775.5" y="535.0" font-size="24" fill="#cbb7ef" text-anchor="middle">Attention</text><text x="912" y="503" font-size="24" fill="#cbb7ef" text-anchor="start">K、V</text><rect x="906" y="518" width="212" height="54" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="1012.0" y="553.0" font-size="21" fill="#cbb7ef" text-anchor="middle">encoder輸出</text><path d="M901 544 L888 544" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M898.96 548.89 L888 544 L898.96 539.11" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="675" font-size="21" fill="#b5c7c0" text-anchor="start">decoder self-attention通常用因果mask；cross-attention的key來自另一序列，不套同一個下三角。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>