<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf02-title tf02-desc"><title id="tf02-title">條件機率鏈與負對數似然</title><desc id="tf02-desc">BOS我想睡四格序列下有三個條件機率0.5,0.25,0.8，相乘0.1，負對數相加2.3026，三token平均0.7675。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">條件機率鏈與負對數似然</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">三個目標token的機率為原創手算案例；使用自然對數，數值採四位小數。</text><rect x="44" y="142" width="1112" height="488" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">序列機率 = 每個位置的條件機率相乘</text><rect x="85" y="226" width="160" height="65" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="165.0" y="266.5" font-size="23" fill="#9ee3dc" text-anchor="middle">BOS</text><rect x="312" y="226" width="160" height="65" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="392.0" y="266.5" font-size="23" fill="#9ee3dc" text-anchor="middle">我</text><rect x="539" y="226" width="160" height="65" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="619.0" y="266.5" font-size="23" fill="#9ee3dc" text-anchor="middle">想</text><rect x="766" y="226" width="160" height="65" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="846.0" y="266.5" font-size="23" fill="#9ee3dc" text-anchor="middle">睡</text><path d="M257 317 L364 317" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M353.04 312.11 L364 317 L353.04 321.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="363" font-size="25" fill="#efcb8b" text-anchor="middle">p=.50</text><text x="310" y="423" font-size="23" fill="#cbb7ef" text-anchor="middle">-ln p=0.6931</text><path d="M484 317 L591 317" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M580.04 312.11 L591 317 L580.04 321.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="363" font-size="25" fill="#efcb8b" text-anchor="middle">p=.25</text><text x="537" y="423" font-size="23" fill="#cbb7ef" text-anchor="middle">-ln p=1.3863</text><path d="M711 317 L818 317" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M807.04 312.11 L818 317 L807.04 321.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="764" y="363" font-size="25" fill="#efcb8b" text-anchor="middle">p=.80</text><text x="764" y="423" font-size="23" fill="#cbb7ef" text-anchor="middle">-ln p=0.2231</text><path d="M86 466H1106" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="513" font-size="27" fill="#9ee3dc" text-anchor="middle">序列機率 = 0.50 × 0.25 × 0.80 = 0.10</text><text x="600" y="563" font-size="23" fill="#efcb8b" text-anchor="middle">總NLL = 2.3026；3個有效目標token的平均NLL = 0.7675</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">相乘可能下溢，因此訓練通常累加負對數；BOS是條件，不是本例預測目標。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>