<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf03-title tf03-desc"><title id="tf03-title">字、byte與token不是相同單位</title><desc id="tf03-desc">A貓包含兩個Unicode碼點U0041 U8C93，UTF8則是41 E8 B2 93四bytes，再由tokenizer規則映射成不同ID。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">字、byte與token不是相同單位</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">例字「貓」的UTF-8編碼為E8 B2 93；tokenizer層另有自己的詞表和規則。</text><rect x="44" y="142" width="520" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">文字與Unicode碼點</text><rect x="612" y="142" width="544" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="634" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">UTF-8 bytes與tokenizer</text><rect x="119" y="220" width="365" height="78" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="301.5" y="267.0" font-size="40" fill="#9ee3dc" text-anchor="middle">A貓</text><rect x="95" y="365" width="198" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="194.0" y="404.0" font-size="23" fill="#9ee3dc" text-anchor="middle">U+0041</text><rect x="325" y="365" width="198" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="424.0" y="404.0" font-size="23" fill="#9ee3dc" text-anchor="middle">U+8C93</text><text x="304" y="498" font-size="26" fill="#9ee3dc" text-anchor="middle">2個Unicode碼點</text><text x="304" y="555" font-size="21" fill="#b5c7c0" text-anchor="middle">「看見的字」也可能由多個碼點組成</text><rect x="656" y="230" width="96" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="704.0" y="268.0" font-size="23" fill="#efcb8b" text-anchor="middle">41</text><rect x="768" y="230" width="96" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="816.0" y="268.0" font-size="23" fill="#efcb8b" text-anchor="middle">E8</text><rect x="880" y="230" width="96" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="928.0" y="268.0" font-size="23" fill="#efcb8b" text-anchor="middle">B2</text><rect x="992" y="230" width="96" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="1040.0" y="268.0" font-size="23" fill="#efcb8b" text-anchor="middle">93</text><text x="893" y="340" font-size="23" fill="#efcb8b" text-anchor="middle">UTF-8：4 bytes（十六進位）</text><path d="M891 371 L891 419" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M895.89 408.04 L891 419 L886.11 408.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="743" y="441" width="142" height="62" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="814.0" y="480.0" font-size="23" fill="#cbb7ef" text-anchor="middle">id a</text><rect x="899" y="441" width="142" height="62" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="970.0" y="480.0" font-size="23" fill="#cbb7ef" text-anchor="middle">id b</text><text x="893" y="557" font-size="20" fill="#cbb7ef" text-anchor="middle">token數由詞表、合併規則與特殊標記決定</text><text x="50" y="676" font-size="21" fill="#b5c7c0" text-anchor="start">byte、Unicode碼點與token ID不能互換；本圖的id a／b只是示意，不是既有模型輸出。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>