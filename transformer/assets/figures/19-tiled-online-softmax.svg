<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf19-title tf19-desc"><title id="tf19-title">FlashAttention：改變資料搬運與中間儲存</title><desc id="tf19-desc">左側大網格只搬入兩塊到SRAM狀態m l o，右側分數0,1再讀2，最大值改2並重新縮放得到l2=1.5032。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">FlashAttention：改變資料搬運與中間儲存</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">m為每列最大值、l為正規化總量、o為加權累積量；數值是原創一列三分數範例。</text><rect x="44" y="142" width="538" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">分塊讀取K／V，保留每列統計量</text><rect x="630" y="142" width="526" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="652" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">線上softmax：不存完整S × S</text><rect x="91" y="237" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="139" y="237" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="187" y="237" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="235" y="237" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="283" y="237" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="331" y="237" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="91" y="285" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="139" y="285" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="187" y="285" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="235" y="285" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="283" y="285" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="331" y="285" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="91" y="333" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="139" y="333" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="187" y="333" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="235" y="333" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="283" y="333" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="331" y="333" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="91" y="381" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="139" y="381" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="187" y="381" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="235" y="381" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="283" y="381" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="331" y="381" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="91" y="429" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="139" y="429" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="187" y="429" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="235" y="429" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="283" y="429" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="331" y="429" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="91" y="477" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="139" y="477" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="187" y="477" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="235" y="477" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="283" y="477" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="331" y="477" width="48" height="48" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><rect x="91" y="237" width="144" height="96" rx="0" stroke="#9ee3dc" stroke-width="3" fill="#245045"/><rect x="235" y="333" width="144" height="96" rx="0" stroke="#efcb8b" stroke-width="3" fill="#493f2e"/><text x="237" y="581" font-size="21" fill="#9ee3dc" text-anchor="middle">HBM中的K/V分塊搬入SRAM</text><path d="M401 328 L472 328" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M461.04 323.11 L472 328 L461.04 332.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="415" y="369" width="134" height="66" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="482.0" y="410.0" font-size="23" fill="#cbb7ef" text-anchor="middle">m、l、o</text><text x="668" y="225" font-size="22" fill="#9ee3dc" text-anchor="start">第一塊分數：[0, 1]</text><text x="668" y="270" font-size="22" fill="#9ee3dc" text-anchor="start">m_1=1；l_1=1+exp(-1)=1.3679</text><path d="M891 307 L891 350" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M895.89 339.04 L891 350 L886.11 339.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="668" y="396" font-size="21" fill="#efcb8b" text-anchor="start">新塊分數：[2]；新最大m_2=2</text><text x="668" y="444" font-size="21" fill="#efcb8b" text-anchor="start">l_2=exp(1-2)×l_1+1=1.5032</text><text x="668" y="492" font-size="21" fill="#efcb8b" text-anchor="start">o也依新最大值縮放後累加</text><text x="892" y="590" font-size="20" fill="#cbb7ef" text-anchor="middle">減少HBM讀寫；密集attention仍有O(S²)運算</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">這是穩定分塊正規化的原理圖；kernel使用、浮點誤差與硬體速度須另外實測。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>