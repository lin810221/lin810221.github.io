<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf29-title tf29-desc"><title id="tf29-title">從語料到可重現的Tiny LM交付</title><desc id="tf29-desc">原創語料到tokenizer模型訓練checkpoint生成設定評估證據六張卡沿環狀串接，各卡列保存欄位。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">從語料到可重現的Tiny LM交付</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">所有資料與模型規模依課內實作設定；此圖列的是可審查交付物，不是訓練效能聲明。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">Tiny LM專題：讓另一台CPU能重建同一條學習主線</text><rect x="81" y="220" width="276" height="130" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="219" y="264" font-size="27" fill="#9ee3dc" text-anchor="middle">原創語料</text><text x="219" y="315" font-size="21" fill="#e8efeb" text-anchor="middle">來源群組／split</text><rect x="462" y="220" width="276" height="130" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="600" y="264" font-size="27" fill="#efcb8b" text-anchor="middle">Tokenizer</text><text x="600" y="315" font-size="21" fill="#e8efeb" text-anchor="middle">詞表／merge／特殊ID</text><rect x="843" y="220" width="276" height="130" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="981" y="264" font-size="27" fill="#cbb7ef" text-anchor="middle">模型訓練</text><text x="981" y="315" font-size="21" fill="#e8efeb" text-anchor="middle">config／seed／step</text><rect x="843" y="446" width="276" height="130" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="981" y="490" font-size="27" fill="#cbb7ef" text-anchor="middle">Checkpoint</text><text x="981" y="541" font-size="21" fill="#e8efeb" text-anchor="middle">權重／optimizer／RNG</text><rect x="462" y="446" width="276" height="130" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="600" y="490" font-size="27" fill="#efcb8b" text-anchor="middle">生成設定</text><text x="600" y="541" font-size="21" fill="#e8efeb" text-anchor="middle">T／top-k／top-p／EOS</text><rect x="81" y="446" width="276" height="130" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="219" y="490" font-size="27" fill="#9ee3dc" text-anchor="middle">評估證據</text><text x="219" y="541" font-size="21" fill="#e8efeb" text-anchor="middle">NLL分母／樣本／失敗</text><path d="M371 285 L448 285" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M437.04 280.11 L448 285 L437.04 289.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M751 285 L829 285" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M818.04 280.11 L829 285 L818.04 289.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M981 365 L981 432" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M985.89 421.04 L981 432 L976.11 421.04" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 511 L753 511" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M763.96 515.89 L753 511 L763.96 506.11" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 511 L371 511" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M381.96 515.89 L371 511 L381.96 506.11" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">artifact需包含執行指令、版本與測試；小模型能重現機制，不等於大模型能力評測。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>