<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf12-title tf12-desc"><title id="tf12-title">資料管線：文件邊界與token block</title><desc id="tf12-desc">文件先去重並按來源群組分訓練驗證，訓練token流A1A2EOSB1B2B3再打包成兩個block。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">資料管線：文件邊界與token block</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">本圖只畫訓練流；驗證資料保留獨立來源，不參與tokenizer選擇或模型調參的最終測試。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">先按來源去重與切分，再tokenize和packing</text><rect x="76" y="210" width="264" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="208.0" y="251.0" font-size="25" fill="#9ee3dc" text-anchor="middle">文件來源群組</text><path d="M355 244 L424 244" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M413.04 239.11 L424 244 L413.04 248.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="442" y="210" width="292" height="66" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="588.0" y="251.0" font-size="24" fill="#efcb8b" text-anchor="middle">近重複檢查／切分</text><path d="M749 244 L812 244" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.04 239.11 L812 244 L801.04 248.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="828" y="210" width="289" height="66" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="972.5" y="251.0" font-size="24" fill="#cbb7ef" text-anchor="middle">訓練／驗證保留</text><text x="83" y="351" font-size="24" fill="#9ee3dc" text-anchor="start">訓練流</text><rect x="83" y="381" width="124" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="145.0" y="420.0" font-size="23" fill="#9ee3dc" text-anchor="middle">A1</text><rect x="233" y="381" width="124" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="295.0" y="420.0" font-size="23" fill="#9ee3dc" text-anchor="middle">A2</text><rect x="383" y="381" width="124" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="445.0" y="420.0" font-size="23" fill="#9ee3dc" text-anchor="middle">EOS</text><rect x="533" y="381" width="124" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="595.0" y="420.0" font-size="23" fill="#9ee3dc" text-anchor="middle">B1</text><rect x="683" y="381" width="124" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="745.0" y="420.0" font-size="23" fill="#9ee3dc" text-anchor="middle">B2</text><rect x="833" y="381" width="124" height="62" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="895.0" y="420.0" font-size="23" fill="#9ee3dc" text-anchor="middle">B3</text><path d="M83 464H507" stroke="#efcb8b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M533 464H957" stroke="#cbb7ef" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="295" y="515" font-size="24" fill="#efcb8b" text-anchor="middle">packed block 1</text><text x="745" y="515" font-size="24" fill="#cbb7ef" text-anchor="middle">packed block 2</text><text x="600" y="587" font-size="22" fill="#e8efeb" text-anchor="middle">EOS標示邊界；是否允許跨文件attention，必須由mask策略另行定義。</text><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">不能先把同一文件切成很多片再隨機分到訓練與驗證；packing不會自動避免資料洩漏。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>