<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf27-title tf27-desc"><title id="tf27-title">注意力圖與因果檢查是不同的證據</title><desc id="tf27-desc">左側三乘三attention熱圖，右側替換目標詞後比較logit和任務表現，兩者觀察層次不同。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">注意力圖與因果檢查是不同的證據</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">左圖數字為原創權重矩陣；右圖是實驗設計，不宣稱遮蔽一定是有效的因果識別。</text><rect x="44" y="142" width="536" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">Attention heatmap：描述一層的權重</text><rect x="624" y="142" width="532" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="646" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">介入實驗：量測指定輸出的改變</text><rect x="164" y="249" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#7eb5a6"/><text x="204" y="296" font-size="22" fill="#e8efeb" text-anchor="middle">0.8</text><rect x="244" y="249" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#213830"/><text x="284" y="296" font-size="22" fill="#e8efeb" text-anchor="middle">0.1</text><rect x="324" y="249" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#213830"/><text x="364" y="296" font-size="22" fill="#e8efeb" text-anchor="middle">0.1</text><rect x="164" y="329" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#35574c"/><text x="204" y="376" font-size="22" fill="#e8efeb" text-anchor="middle">0.2</text><rect x="244" y="329" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#7eb5a6"/><text x="284" y="376" font-size="22" fill="#e8efeb" text-anchor="middle">0.6</text><rect x="324" y="329" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#35574c"/><text x="364" y="376" font-size="22" fill="#e8efeb" text-anchor="middle">0.2</text><rect x="164" y="409" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#213830"/><text x="204" y="456" font-size="22" fill="#e8efeb" text-anchor="middle">0.1</text><rect x="244" y="409" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#35574c"/><text x="284" y="456" font-size="22" fill="#e8efeb" text-anchor="middle">0.2</text><rect x="324" y="409" width="80" height="80" rx="0" stroke="#425952" stroke-width="1" fill="#7eb5a6"/><text x="364" y="456" font-size="22" fill="#e8efeb" text-anchor="middle">0.7</text><text x="312" y="566" font-size="21" fill="#9ee3dc" text-anchor="middle">權重高，不等於「因果重要性」已被證明</text><rect x="677" y="240" width="128" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="741.0" y="278.0" font-size="23" fill="#efcb8b" text-anchor="middle">前綴</text><rect x="821" y="240" width="128" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="885.0" y="278.0" font-size="23" fill="#efcb8b" text-anchor="middle">目標詞</text><rect x="965" y="240" width="128" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="1029.0" y="278.0" font-size="23" fill="#efcb8b" text-anchor="middle">後文</text><path d="M820 316L948 316" stroke="#f2a89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="886" y="365" font-size="22" fill="#efcb8b" text-anchor="middle">替換／遮蔽／activation patch</text><path d="M889 396 L889 445" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M893.89 434.04 L889 445 L884.11 434.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="686" y="466" width="410" height="68" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="891.0" y="508.0" font-size="23" fill="#cbb7ef" text-anchor="middle">比對logit、任務分數與對照組</text><text x="50" y="676" font-size="21" fill="#b5c7c0" text-anchor="start">先定義目標輸出、層、head與對照；介入也可能改變分布，不把單一圖當成整個模型解釋。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>