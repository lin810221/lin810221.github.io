<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf32-title tf32-desc"><title id="tf32-title">Transformer除錯路線</title><desc id="tf32-desc">問題分成loss不下降生成異常cache不一致三條路，分別檢查shift更新、詞表解碼、位置與矩形遮罩。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Transformer除錯路線</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">這是診斷順序；小批次過擬合、固定seed或字串相同，都不是模型已可靠的充分證據。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">先重建最小可檢查案例，再擴大模型、序列或硬體</text><rect x="440" y="193" width="322" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="601.0" y="235.0" font-size="25" fill="#9ee3dc" text-anchor="middle">問題：loss／生成／cache？</text><path d="M450 277 L237 334" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M248.85 335.89 L237 334 L246.32 326.44" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 279 L600 334" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.89 323.04 L600 334 L595.11 323.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M752 277 L965 334" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M955.68 326.44 L965 334 L953.15 335.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="79" y="351" width="317" height="63" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="237.5" y="390.5" font-size="25" fill="#9ee3dc" text-anchor="middle">loss不下降</text><rect x="442" y="351" width="317" height="63" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="600.5" y="390.5" font-size="25" fill="#efcb8b" text-anchor="middle">生成異常</text><rect x="805" y="351" width="317" height="63" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="963.5" y="390.5" font-size="25" fill="#cbb7ef" text-anchor="middle">cache不一致</text><text x="94" y="471" font-size="22" fill="#e8efeb" text-anchor="start">檢查X/Y shift與ignore</text><text x="94" y="516" font-size="22" fill="#e8efeb" text-anchor="start">小批次能否過擬合</text><text x="94" y="561" font-size="22" fill="#e8efeb" text-anchor="start">梯度與optimizer更新</text><text x="457" y="471" font-size="22" fill="#e8efeb" text-anchor="start">詞表／特殊ID／模板</text><text x="457" y="516" font-size="22" fill="#e8efeb" text-anchor="start">eval與溫度截斷順序</text><text x="457" y="561" font-size="22" fill="#e8efeb" text-anchor="start">EOS／長度／隨機種子</text><text x="820" y="471" font-size="22" fill="#e8efeb" text-anchor="start">position_id與offset</text><text x="820" y="516" font-size="22" fill="#e8efeb" text-anchor="start">矩形mask的列欄方向</text><text x="820" y="561" font-size="22" fill="#e8efeb" text-anchor="start">dtype／dropout／容差</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">保存輸入IDs、mask、形狀、版本與第一個差異位置；每次改一個原因，再跑相同驗收。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>