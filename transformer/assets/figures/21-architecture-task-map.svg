="#efcb8b" stroke-width="2" fill="#172524"/><text x="528.0" y="493.0" font-size="21" fill="#efcb8b" text-anchor="middle">tgt1</text><rect x="592" y="456" width="104" height="58" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="644.0" y="493.0" font-size="21" fill="#efcb8b" text-anchor="middle">tgt2</text><text x="600" y="574" font-size="21" fill="#b5c7c0" text-anchor="middle">來源條件下的目標生成</text><rect x="875" y="244" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="908.0" y="284.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><rect x="941" y="244" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#232b2b"/><text x="974.0" y="284.0" font-size="22" fill="#b5c7c0" text-anchor="middle">0</text><rect x="1007" y="244" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#232b2b"/><text x="1040.0" y="284.0" font-size="22" fill="#b5c7c0" text-anchor="middle">0</text><rect x="875" y="310" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="908.0" y="350.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><rect x="941" y="310" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="974.0" y="350.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><rect x="1007" y="310" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#232b2b"/><text x="1040.0" y="350.0" font-size="22" fill="#b5c7c0" text-anchor="middle">0</text><rect x="875" y="376" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="908.0" y="416.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><rect x="941" y="376" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="974.0" y="416.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><rect x="1007" y="376" width="66" height="66" rx="0" stroke="#425952" stroke-width="1" fill="#255147"/><text x="1040.0" y="416.0" font-size="22" fill="#9ee3dc" text-anchor="middle">1</text><text x="977" y="500" font-size="23" fill="#cbb7ef" text-anchor="middle">因果self-attention</text><text x="977" y="554" font-size="21" fill="#b5c7c0" text-anchor="middle">自回歸續寫／對話等</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">架構家族與訓練任務是不同分類；decoder模型也可經額外設計用於表示或分類。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>