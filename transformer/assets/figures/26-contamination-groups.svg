<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf26-title tf26-desc"><title id="tf26-title">Benchmark污染與來源群組</title><desc id="tf26-desc">原題來源改寫題和答案解析由紅虛線關聯，同來源整組分到train或test，強調hash不同不代表獨立。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Benchmark污染與來源群組</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">文件卡片是原創示意；圖中不宣稱能取得商業模型完整預訓練資料。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">同題、改寫、答案與同來源文件都可能形成污染</text><rect x="84" y="222" width="274" height="147" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="221" y="270" font-size="25" fill="#9ee3dc" text-anchor="middle">原題與來源</text><path d="M114 300h194" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 321h172" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 342h207" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M368 295H454" stroke="#f2a89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="466" y="222" width="274" height="147" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="603" y="270" font-size="25" fill="#efcb8b" text-anchor="middle">近重複／改寫</text><path d="M496 300h194" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M496 321h172" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M496 342h207" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 295H836" stroke="#f2a89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="848" y="222" width="274" height="147" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="985" y="270" font-size="25" fill="#cbb7ef" text-anchor="middle">答案／解析</text><path d="M878 300h194" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M878 321h172" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M878 342h207" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 411H1123" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="111" y="465" width="432" height="75" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="327.0" y="510.5" font-size="24" fill="#9ee3dc" text-anchor="middle">Train：完整來源群組留在同側</text><rect x="661" y="465" width="432" height="75" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="877.0" y="510.5" font-size="24" fill="#efcb8b" text-anchor="middle">Test：保留未參與選擇的群組</text><text x="600" y="603" font-size="21" fill="#b5c7c0" text-anchor="middle">先定版本、來源與近重複規則，再做來源群組切分；文字hash相異仍可能是同題。</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">污染檢查降低可見重複，不能由「沒找到」直接證明模型從未接觸過相關內容。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>