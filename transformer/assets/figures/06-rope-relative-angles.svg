<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf06-title tf06-desc"><title id="tf06-title">RoPE：旋轉如何帶入相對位置</title><desc id="tf06-desc">兩張圓圖中Q60度K20度與Q90度K50度有相同40度角差，說明共同位移不改變相對旋轉。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">RoPE：旋轉如何帶入相對位置</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖示只畫一對維度與一個頻率；不同維度對通常使用不同頻率。</text><rect x="44" y="142" width="532" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">位置m、n：同一組頻率</text><rect x="624" y="142" width="532" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="646" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">兩個位置共同平移：角差不變</text><circle cx="308" cy="380" r="134" stroke="#425952" stroke-width="3" fill="none"/><path d="M154 380H466" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M308 534V222" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M308 380 L433.9188111853117 334.1693007943604" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M421.95 333.32 L433.9188111853117 334.1693007943604 L425.30 342.51" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="445.9188111853117" y="324.1693007943604" font-size="23" fill="#cbb7ef" text-anchor="start">K 20°</text><path d="M308 380 L375.0 263.95259589288526" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M365.28 271.00 L375.0 263.95259589288526 L373.76 275.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="387.0" y="253.95259589288526" font-size="23" fill="#9ee3dc" text-anchor="start">Q 60°</text><path d="M373.78 356.06A70 70 0 0 0 343.00 319.38" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="327" y="435" font-size="24" fill="#efcb8b" text-anchor="start">角差40°</text><circle cx="889" cy="380" r="134" stroke="#425952" stroke-width="3" fill="none"/><path d="M735 380H1047" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M889 534V222" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M889 380 L975.1335396979963 277.35004462205694" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M964.34 282.60 L975.1335396979963 277.35004462205694 L971.84 288.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="987.1335396979963" y="267.35004462205694" font-size="23" fill="#cbb7ef" text-anchor="start">K 50°</text><path d="M889 380 L889.0 246.0" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M884.11 256.96 L889.0 246.0 L893.89 256.96" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="901.0" y="236.0" font-size="23" fill="#efcb8b" text-anchor="start">Q 90°</text><path d="M934.00 326.38A70 70 0 0 0 889.00 310.00" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="908" y="435" font-size="24" fill="#efcb8b" text-anchor="start">角差40°</text><text x="308" y="582" font-size="23" fill="#9ee3dc" text-anchor="middle">mθ=60°；nθ=20°</text><text x="889" y="582" font-size="23" fill="#efcb8b" text-anchor="middle">一起加30°後：90°、50°</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">RoPE在成對維度旋轉Q／K，使內積含相對位置；不是把所有位置只旋轉同一個角。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>