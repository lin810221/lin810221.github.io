<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf11-title tf11-desc"><title id="tf11-title">Next-token訓練：輸入、目標與忽略位置</title><desc id="tf11-desc">輸入BOS我愛貓PAD與目標我愛貓EOS忽略上下對齊，前四格箭頭相連，PAD loss不納入分母。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Next-token訓練：輸入、目標與忽略位置</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖中BOS／EOS／PAD為教學特殊token；實際模型的標記與邊界策略必須查tokenizer設定。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">序列右移一格；模型用前綴預測下一個目標</text><text x="74" y="237" font-size="25" fill="#9ee3dc" text-anchor="start">輸入 X</text><rect x="249" y="194" width="144" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="321.0" y="236.0" font-size="23" fill="#9ee3dc" text-anchor="middle">BOS</text><rect x="419" y="194" width="144" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="491.0" y="236.0" font-size="23" fill="#9ee3dc" text-anchor="middle">我</text><rect x="589" y="194" width="144" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="661.0" y="236.0" font-size="23" fill="#9ee3dc" text-anchor="middle">愛</text><rect x="759" y="194" width="144" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="831.0" y="236.0" font-size="23" fill="#9ee3dc" text-anchor="middle">貓</text><rect x="929" y="194" width="144" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="1001.0" y="236.0" font-size="23" fill="#9ee3dc" text-anchor="middle">PAD</text><text x="74" y="440" font-size="25" fill="#efcb8b" text-anchor="start">目標 Y</text><rect x="249" y="397" width="144" height="68" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="321.0" y="439.0" font-size="23" fill="#efcb8b" text-anchor="middle">我</text><rect x="419" y="397" width="144" height="68" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="491.0" y="439.0" font-size="23" fill="#efcb8b" text-anchor="middle">愛</text><rect x="589" y="397" width="144" height="68" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="661.0" y="439.0" font-size="23" fill="#efcb8b" text-anchor="middle">貓</text><rect x="759" y="397" width="144" height="68" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="831.0" y="439.0" font-size="23" fill="#efcb8b" text-anchor="middle">EOS</text><rect x="929" y="397" width="144" height="68" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="1001.0" y="439.0" font-size="23" fill="#b5c7c0" text-anchor="middle">忽略</text><path d="M321 283 L321 378" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M325.89 367.04 L321 378 L316.11 367.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M491 283 L491 378" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.89 367.04 L491 378 L486.11 367.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M661 283 L661 378" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M665.89 367.04 L661 378 L656.11 367.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M831 283 L831 378" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M835.89 367.04 L831 378 L826.11 367.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="929" y="181" width="163" height="298" rx="5" stroke="#f2a89f" stroke-width="3" fill="none"/><text x="601" y="546" font-size="26" fill="#9ee3dc" text-anchor="middle">有效loss分母=4，不是5；EOS是有效目標</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">padding位置以ignore_index等機制排除；attention mask與loss mask要分別檢查。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>