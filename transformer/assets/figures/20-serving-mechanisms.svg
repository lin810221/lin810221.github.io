<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tf20-title tf20-desc"><title id="tf20-title">批次、分頁KV與推測解碼</title><desc id="tf20-desc">第一列A完成以D填入批次，第二列請求邏輯頁0和1映射實體頁7和2，第三列草稿abcd經目標接受ab並以u替代後續。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">批次、分頁KV與推測解碼</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">三列是獨立機制的原理圖，沒有量測特定框架吞吐；頁碼和token皆為教學代號。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">不同優化處理不同瓶頸：排程、KV配置、驗證步數</text><text x="76" y="232" font-size="23" fill="#9ee3dc" text-anchor="start">Continuous batch</text><rect x="363" y="194" width="86" height="58" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="406.0" y="231.0" font-size="23" fill="#9ee3dc" text-anchor="middle">A</text><rect x="460" y="194" width="86" height="58" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="503.0" y="231.0" font-size="23" fill="#9ee3dc" text-anchor="middle">B</text><rect x="557" y="194" width="86" height="58" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="600.0" y="231.0" font-size="23" fill="#9ee3dc" text-anchor="middle">C</text><path d="M666 223 L724 223" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M713.04 218.11 L724 223 L713.04 227.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="742" y="194" width="86" height="58" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="785.0" y="231.0" font-size="23" fill="#efcb8b" text-anchor="middle">D</text><rect x="839" y="194" width="86" height="58" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="882.0" y="231.0" font-size="23" fill="#efcb8b" text-anchor="middle">B</text><rect x="936" y="194" width="86" height="58" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="979.0" y="231.0" font-size="23" fill="#efcb8b" text-anchor="middle">C</text><text x="1041" y="232" font-size="19" fill="#b5c7c0" text-anchor="start">A完成後補D</text><path d="M79 282H1120" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="350" font-size="25" fill="#efcb8b" text-anchor="start">Paged KV</text><rect x="363" y="316" width="233" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="479.5" y="354.0" font-size="22" fill="#efcb8b" text-anchor="middle">A邏輯頁 0、1</text><path d="M608 345 L679 345" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M668.04 340.11 L679 345 L668.04 349.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="700" y="316" width="127" height="60" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="763.5" y="354.0" font-size="22" fill="#cbb7ef" text-anchor="middle">實體7</text><rect x="839" y="316" width="127" height="60" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="902.5" y="354.0" font-size="22" fill="#cbb7ef" text-anchor="middle">實體2</text><rect x="978" y="316" width="127" height="60" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="1041.5" y="354.0" font-size="22" fill="#cbb7ef" text-anchor="middle">其他</text><path d="M79 410H1120" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="482" font-size="25" fill="#cbb7ef" text-anchor="start">Speculative</text><rect x="363" y="444" width="96" height="59" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="411.0" y="481.5" font-size="23" fill="#9ee3dc" text-anchor="middle">a</text><rect x="474" y="444" width="96" height="59" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="522.0" y="481.5" font-size="23" fill="#9ee3dc" text-anchor="middle">b</text><rect x="585" y="444" width="96" height="59" rx="12" stroke="#f2a89f" stroke-width="2" fill="#172524"/><text x="633.0" y="481.5" font-size="23" fill="#f2a89f" text-anchor="middle">c</text><rect x="696" y="444" width="96" height="59" rx="12" stroke="#b5c7c0" stroke-width="2" fill="#172524"/><text x="744.0" y="481.5" font-size="23" fill="#b5c7c0" text-anchor="middle">d</text><path d="M813 474 L863 474" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M852.04 469.11 L863 474 L852.04 478.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="879" y="444" width="70" height="59" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="914.0" y="481.5" font-size="23" fill="#cbb7ef" text-anchor="middle">a</text><rect x="959" y="444" width="70" height="59" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="994.0" y="481.5" font-size="23" fill="#cbb7ef" text-anchor="middle">b</text><rect x="1039" y="444" width="70" height="59" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="1074.0" y="481.5" font-size="23" fill="#cbb7ef" text-anchor="middle">u</text><text x="750" y="564" font-size="21" fill="#b5c7c0" text-anchor="middle">目標模型接受a、b；拒絕c後依驗證規則產生u，捨棄後續草稿。</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">圖示不是速度保證；speculative要使用相容的接受／拒絕規則，不能直接信任草稿。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>