<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">資料庫與搜尋引擎的取捨</title><desc id="desc">功能、過濾、交易及維運能力需按需求比較；不因能存向量就假設所有搜尋功能相同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#89c9e8"/></marker></defs><rect width="1200" height="800" rx="20" fill="#101812"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="54" y="58" font-size="19" fill="#b8e895" text-anchor="start">SEARCH / 06</text><text x="54" y="115" font-size="34" fill="#e5e9e2" text-anchor="start">資料庫與搜尋引擎的取捨</text><text x="54" y="154" font-size="20" fill="#9aaf9f" text-anchor="start">原創概念圖 · 沿資料、控制與比較關係讀圖</text><rect x="150.0" y="250" width="282.0" height="90" rx="14" fill="#1b251f" stroke="#b8e895"/><text x="291.0" y="302.0" font-size="20" fill="#b8e895" text-anchor="middle">全文引擎</text><path d="M165.0,380 L430.0,380" stroke="#b8e895" stroke-width="4" fill="none"/><text x="150.0" y="425" font-size="19" fill="#e5e9e2" text-anchor="start">條件／輸入</text><rect x="450.0" y="250" width="282.0" height="90" rx="14" fill="#1b251f" stroke="#89c9e8"/><text x="591.0" y="302.0" font-size="20" fill="#89c9e8" text-anchor="middle">向量引擎</text><path d="M465.0,380 L730.0,380" stroke="#89c9e8" stroke-width="4" fill="none"/><text x="450.0" y="425" font-size="19" fill="#e5e9e2" text-anchor="start">行為／計算</text><rect x="750.0" y="250" width="282.0" height="90" rx="14" fill="#1b251f" stroke="#eebc79"/><text x="891.0" y="302.0" font-size="20" fill="#eebc79" text-anchor="middle">關聯資料庫</text><path d="M765.0,380 L1030.0,380" stroke="#eebc79" stroke-width="4" fill="none"/><text x="750.0" y="425" font-size="19" fill="#e5e9e2" text-anchor="start">結果／驗收</text><text x="600" y="500" font-size="22" fill="#89c9e8" text-anchor="middle">依相同任務與條件比較，不由外觀推論等價</text><path d="M54,620 L1146,620" stroke="#405448" stroke-width="2" fill="none"/><text x="60" y="668" font-size="23" fill="#b8e895" text-anchor="start">1. 功能、過濾、交易及維運能力需按需求比較</text><text x="60" y="711" font-size="23" fill="#89c9e8" text-anchor="start">2. 不因能存向量就假設所有搜尋功能相同</text><text x="54" y="766" font-size="17" fill="#9aaf9f" text-anchor="start">Learning Notes · Visual review 2026-11-24</text></g></svg>