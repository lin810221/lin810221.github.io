<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f64-title f64-desc"><title id="f64-title">心壁與心包不是同一層</title><desc id="f64-desc">心內膜、心肌、心外膜構成心壁的常用分層，外側心包囊另有層次及空間關係。此圖非比例。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 64  /  心壁與心包不是同一層</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="72" y="123" width="590" height="55" rx="3" stroke="#9ac8e8" fill="#20343d" stroke-width="2"/><rect x="72" y="181" width="590" height="125" rx="3" stroke="#eda894" fill="#49352c" stroke-width="2"/><rect x="72" y="309" width="590" height="43" rx="3" stroke="#ead68c" fill="#49432e" stroke-width="2"/><path d="M72 382H662" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="99" y="158" font-size="21" fill="#9ac8e8" text-anchor="start">心內膜：心腔側</text><text x="99" y="250" font-size="24" fill="#eda894" text-anchor="start">心肌：主要肌肉層</text><text x="99" y="339" font-size="21" fill="#ead68c" text-anchor="start">心外膜：心壁外側</text><text x="99" y="424" font-size="20" fill="#c1b2ea" text-anchor="start">心包囊等：另有包覆與界面關係</text><text x="696" y="209" font-size="21" fill="#e3e9e2" text-anchor="start">心壁</text><path d="M682 125V351" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>