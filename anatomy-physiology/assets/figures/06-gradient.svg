<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f06-title f06-desc"><title id="f06-title">濃度差與淨移動</title><desc id="f06-desc">左右區室有濃度差，示意溶質順梯度的淨移動；實際水移動需另看有效溶質與膜。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 06  /  濃度差與淨移動</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="70" y="117" width="720" height="260" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><path d="M430 117V377" stroke="#b7e89f" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="152" font-size="20" fill="#e3e9e2" text-anchor="start">較多可移動粒子</text><text x="492" y="152" font-size="20" fill="#e3e9e2" text-anchor="start">較少可移動粒子</text><ellipse cx="110" cy="195" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="165" cy="195" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="220" cy="195" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="275" cy="195" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="330" cy="195" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="110" cy="255" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="165" cy="255" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="220" cy="255" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="275" cy="255" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="330" cy="255" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="110" cy="315" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="165" cy="315" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="220" cy="315" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="275" cy="315" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="330" cy="315" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="495" cy="245" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="543" cy="245" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="591" cy="245" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="639" cy="245" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="687" cy="245" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M340 335L505 335" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 330.7L505 335L496.0 339.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="417" font-size="18" fill="#e3e9e2" text-anchor="start">溶質淨擴散順梯度；水移動還取決於膜可通透性。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>