<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f27-title f27-desc"><title id="f27-title">體神經與自律路徑</title><desc id="f27-desc">體神經運動路徑至骨骼肌；自律路徑經神經節至心肌、平滑肌及腺體，效果依器官及受體而異。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 27  /  體神經與自律路徑</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">體神經運動</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">中樞 → 骨骼肌</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">有自主動作，也有反射</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">交感路徑</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">中樞 → 神經節 → 靶器官</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不是全身所有功能一律開啟</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">副交感路徑</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">中樞 → 神經節 → 靶器官</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不是交感的單純總開關</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">共同原則</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">器官、受體與情境重要</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">呼吸自動不代表膈肌屬自律肌</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>