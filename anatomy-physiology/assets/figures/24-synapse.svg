<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f24-title f24-desc"><title id="f24-title">化學突觸與整合</title><desc id="f24-desc">突觸前釋放傳遞物質跨間隙作用於後膜受體，訊息轉換而非細胞融合；非所有突觸均為化學突觸。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 24  /  化學突觸與整合</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="70" y="115" width="275" height="125" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><ellipse cx="150" cy="190" rx="16" ry="16" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><ellipse cx="225" cy="190" rx="16" ry="16" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><text x="95" y="150" font-size="23" fill="#c1b2ea" text-anchor="start">突觸前末梢</text><path d="M75 245H750M75 298H750" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="155" cy="268" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="227" cy="268" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="302" cy="268" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M190 218L190 286" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.3 277.0L190 286L185.7 277.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="303" width="680" height="107" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="95" y="345" font-size="22" fill="#b7e89f" text-anchor="start">突觸後膜：受體、離子與訊號整合</text><text x="414" y="180" font-size="21" fill="#9ac8e8" text-anchor="start">化學突觸間隙</text><text x="414" y="216" font-size="17" fill="#e3e9e2" text-anchor="start">不是兩個細胞直接融合</text><text x="90" y="446" font-size="18" fill="#e3e9e2" text-anchor="start">興奮或抑制的結果取決於受體、離子與當時條件。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>