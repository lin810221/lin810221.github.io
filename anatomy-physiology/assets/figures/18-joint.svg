<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f18-title f18-desc"><title id="f18-title">滑液關節的邊界與活動</title><desc id="f18-desc">兩骨端覆關節軟骨，中間為含滑液的關節腔，外有囊與支持構造；只顯示簡化截面。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 18  /  滑液關節的邊界與活動</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M240 120V218Q335 271 430 218V120M240 416V317Q335 264 430 317V416" stroke="#ead68c" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M242 218Q335 264 428 218M242 317Q335 269 428 317" stroke="#9ac8e8" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 203Q196 268 228 333M441 202Q475 268 441 333" stroke="#b7e89f" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="174" font-size="19" fill="#9ac8e8" text-anchor="start">關節軟骨：覆蓋骨端</text><text x="535" y="236" font-size="19" fill="#b7e89f" text-anchor="start">關節腔：少量滑液</text><text x="535" y="300" font-size="19" fill="#b7e89f" text-anchor="start">關節囊：包圍與支持</text><text x="100" y="446" font-size="19" fill="#e3e9e2" text-anchor="start">韌帶連骨與骨；肌腱主要連肌肉與骨。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>