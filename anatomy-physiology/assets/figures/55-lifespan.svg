<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f55-title f55-desc"><title id="f55-title">生命階段中的身體變化</title><desc id="f55-desc">成長、成熟與老化改變結構和調節餘裕，群體趨勢不能代替個人功能。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 55  /  生命階段中的身體變化</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">成長</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">細胞增殖、分化與器官成熟</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">兒童不是縮小成人</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">青春期</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">生殖軸與其他系統改變</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">時間與表現有個體差異</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">成人</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">維持、更新與環境互動</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不是成年後器官完全不變</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">高齡</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">調節餘裕可能改變</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不能以年齡一項推定能力</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>