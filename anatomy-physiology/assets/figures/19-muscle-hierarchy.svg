<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f19-title f19-desc"><title id="f19-title">肌肉內部的層級</title><desc id="f19-desc">整塊骨骼肌含肌束，肌束含多個肌纖維，肌纖維內含肌原纖維及重複肌節；肌纖維不是整條肌束。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 19  /  肌肉內部的層級</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="170" cy="238" rx="105" ry="65" stroke="#eda894" fill="#15211d" stroke-width="3"/><path d="M68 236L35 236M274 236H310" stroke="#ead68c" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 190L382 149" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M372.0 148.5L382 149L375.4 156.5" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="390" y="110" width="155" height="100" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="407" y="155" font-size="23" fill="#eda894" text-anchor="start">肌束</text><path d="M548 152L617 152" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M608.0 147.7L617 152L608.0 156.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="625" y="110" width="165" height="100" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="638" y="154" font-size="23" fill="#eda894" text-anchor="start">肌纖維</text><text x="638" y="184" font-size="15" fill="#e3e9e2" text-anchor="start">一個肌肉細胞</text><text x="90" y="346" font-size="22" fill="#e3e9e2" text-anchor="start">肌肉 → 肌束 → 肌纖維 → 肌原纖維 → 肌節</text><text x="90" y="396" font-size="18" fill="#e3e9e2" text-anchor="start">每一層的結締組織、血管與神經也參與功能。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>