<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f58-title f58-desc"><title id="f58-title">圖、量測與診斷不是同一件事</title><desc id="f58-desc">構造示意用於理解、真實影像需專業判讀、量測有方法與誤差、診斷需情境及證據。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 58  /  圖、量測與診斷不是同一件事</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">示意圖</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">省略、非比例、選擇重點</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不是每人構造的精確複本</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">真實影像</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">切面、方法與定位資訊</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不能只憑像不像判診斷</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">量測</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">時間、單位、設備與誤差</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">未知不自動等於0</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">臨床結論</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">症狀、檢查、脈絡和專業</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">教材不替代個別照護</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>