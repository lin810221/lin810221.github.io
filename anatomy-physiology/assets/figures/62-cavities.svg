<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f62-title f62-desc"><title id="f62-title">體腔與膈肌分界</title><desc id="f62-desc">正面概念圖顯示顱腔、沿脊柱的椎管、胸腔、腹腔與骨盆腔。脊柱投影與胸腹器官在不同深度，非同一切面。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 62  /  體腔與膈肌分界</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="340" cy="117" rx="33" ry="43" stroke="#788d7c" fill="#15211d" stroke-width="3"/><path d="M319 160L284 180 258 290M361 160L396 180 422 290M284 180L289 310 314 401M396 180L391 310 366 401M289 310Q340 333 391 310M320 326L314 401M360 326L366 401" stroke="#788d7c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M287 183Q340 157 393 183M305 235H375" stroke="#526756" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="340" cy="117" rx="28" ry="36" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><path d="M340 159V296" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="295" y="182" width="90" height="61" rx="10" stroke="#9ac8e8" fill="#9ac8e815" stroke-width="2"/><path d="M290 250Q340 228 390 250" stroke="#ead68c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="297" y="260" width="86" height="56" rx="8" stroke="#b7e89f" fill="#b7e89f15" stroke-width="2"/><ellipse cx="340" cy="324" rx="38" ry="22" stroke="#eda894" fill="#15211d" stroke-width="3"/><path d="M361 112L500 126" stroke="#c1b2ea" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="131" font-size="17" fill="#e3e9e2" text-anchor="start">顱腔</text><path d="M343 188L500 194" stroke="#c1b2ea" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="199" font-size="17" fill="#e3e9e2" text-anchor="start">椎管：沿脊柱</text><path d="M382 216L500 246" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="251" font-size="17" fill="#e3e9e2" text-anchor="start">胸腔</text><path d="M383 246L500 294" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="299" font-size="17" fill="#e3e9e2" text-anchor="start">膈肌：胸腹分界</text><path d="M383 284L500 347" stroke="#b7e89f" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="352" font-size="17" fill="#e3e9e2" text-anchor="start">腹腔</text><path d="M376 326L500 405" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="410" font-size="17" fill="#e3e9e2" text-anchor="start">骨盆腔</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>