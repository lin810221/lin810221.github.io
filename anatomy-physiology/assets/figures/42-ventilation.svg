<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f42-title f42-desc"><title id="f42-title">吸氣與安靜呼氣對照</title><desc id="f42-desc">安靜吸氣膈肌收縮向下胸腔容積增加，壓差使空氣進入；安靜呼氣主要由彈性回縮促成。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 42  /  吸氣與安靜呼氣對照</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">吸氣</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">膈肌收縮、向下</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">胸腔容積增加，氣體進入</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">壓力關係</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">肺泡壓相對大氣壓較低</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不是所有胸內壓都同一個量</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">安靜呼氣</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">膈肌放鬆、彈性回縮</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不是每次都靠強力腹肌</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">用力呼吸</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">可能募集其他肌肉</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">氣流、灌流、擴散需分開</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>