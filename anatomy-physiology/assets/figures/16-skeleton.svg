<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f16-title f16-desc"><title id="f16-title">中軸與附肢骨架</title><desc id="f16-desc">正面骨架簡化圖：中軸支持保護，附肢連接並參與移動；不以固定骨數判個人正常與否。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 16  /  中軸與附肢骨架</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="340" cy="117" rx="33" ry="43" stroke="#788d7c" fill="#15211d" stroke-width="3"/><path d="M319 160L284 180 258 290M361 160L396 180 422 290M284 180L289 310 314 401M396 180L391 310 366 401M289 310Q340 333 391 310M320 326L314 401M360 326L366 401" stroke="#788d7c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M287 183Q340 157 393 183M305 235H375" stroke="#526756" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 165V309M292 185H388M304 208Q340 236 376 208M300 232Q340 260 380 232M310 258Q340 282 370 258M302 309Q340 285 378 309M292 188L274 272M388 188L406 272M319 327L307 405M361 327L373 405" stroke="#ead68c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="145" font-size="20" fill="#ead68c" text-anchor="start">中軸：頭骨、脊柱、胸廓</text><text x="480" y="201" font-size="20" fill="#b7e89f" text-anchor="start">附肢：肢帶與四肢</text><text x="480" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">成人常見約206塊骨</text><text x="480" y="310" font-size="17" fill="#e3e9e2" text-anchor="start">數量有發展及個體差異</text><text x="70" y="434" font-size="18" fill="#e3e9e2" text-anchor="start">骨架為正面定位示意；省略部分骨與細節。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>