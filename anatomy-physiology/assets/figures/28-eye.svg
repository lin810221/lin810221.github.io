<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f28-title f28-desc"><title id="f28-title">光學路徑與神經路徑</title><desc id="f28-desc">眼球剖面概念：角膜與水晶體折光，視網膜感光，視神經傳訊；瞳孔是虹膜中央開口。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 28  /  光學路徑與神經路徑</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="313" cy="252" rx="190" ry="132" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><ellipse cx="213" cy="252" rx="19" ry="60" stroke="#ead68c" fill="#15211d" stroke-width="3"/><path d="M139 201Q95 252 139 304" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 174Q482 250 450 328" stroke="#eda894" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 258L628 283" stroke="#ead68c" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 251L190 251" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M181.0 246.7L190 251L181.0 255.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234 252L434 252" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M425.0 247.7L434 252L425.0 256.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 218L108 151" stroke="#b7e89f" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="156" font-size="17" fill="#e3e9e2" text-anchor="start">角膜</text><path d="M214 205L268 116" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="209" y="121" font-size="17" fill="#e3e9e2" text-anchor="start">水晶體</text><path d="M461 196L534 145" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="542" y="150" font-size="17" fill="#e3e9e2" text-anchor="start">視網膜</text><path d="M577 276L607 351" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="356" font-size="17" fill="#e3e9e2" text-anchor="start">視神經</text><text x="95" y="426" font-size="18" fill="#e3e9e2" text-anchor="start">光線到視網膜；神經訊號再經視路到腦。瞳孔是開口。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>