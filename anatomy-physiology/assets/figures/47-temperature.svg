<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f47-title f47-desc"><title id="f47-title">產熱、散熱與回饋</title><desc id="f47-desc">體溫受產熱、環境交換及中樞調節影響；37度不是每次測量、部位與時段的固定值。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 47  /  產熱、散熱與回饋</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">產熱</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">基礎代謝、活動及顫抖等</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">熱量持續產生</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">熱交換</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">輻射、傳導、對流與蒸發</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">方向與效果依環境而異</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">整合</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">感受與下視丘等調節</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">皮膚血流、汗腺及行為</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">量測</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">部位、時段與方法影響數字</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不能用單次數字完成診斷</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>