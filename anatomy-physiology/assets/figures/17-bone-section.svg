<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f17-title f17-desc"><title id="f17-title">長骨的構造與活組織</title><desc id="f17-desc">長骨示意含緻密骨、鬆質骨與骨髓空間；外形不是所有骨的共同模板，骨持續改建。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 17  /  長骨的構造與活組織</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M180 160Q130 100 100 160T180 230V345Q120 400 180 415Q225 447 250 400L250 230Q290 170 250 150Q210 105 180 160Z" stroke="#ead68c" stroke-width="4" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><rect x="192" y="218" width="42" height="163" rx="8" stroke="#eda894" fill="#48322d" stroke-width="2"/><path d="M160 167l40 45 45-44m-80 7 70 32m-57 181 55 21m-62-5 65-39" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 282L380 180" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="388" y="185" font-size="17" fill="#e3e9e2" text-anchor="start">緻密骨：外側較緻密</text><path d="M206 294L380 267" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="388" y="272" font-size="17" fill="#e3e9e2" text-anchor="start">骨髓腔／骨髓</text><path d="M170 180L380 355" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="388" y="360" font-size="17" fill="#e3e9e2" text-anchor="start">鬆質骨：骨小梁空間</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>