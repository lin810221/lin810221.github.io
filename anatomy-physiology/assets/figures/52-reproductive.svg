<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f52-title f52-desc"><title id="f52-title">生殖構造與運送路徑</title><desc id="f52-desc">左為精子產生成熟與運送的連通示意，右為卵巢輸卵管子宮子宮頸陰道；不把尿道口與陰道口混用。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 52  /  生殖構造與運送路徑</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="36" y="100" width="380" height="332" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="55" y="130" font-size="21" fill="#9ac8e8" text-anchor="start">精子路徑（連通圖）</text><path d="M135 175Q135 145 225 150V252" stroke="#ead68c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="126" cy="192" rx="25" ry="33" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><text x="57" y="250" font-size="17" fill="#e3e9e2" text-anchor="start">睪丸→副睪</text><path d="M250 178L250 218" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.3 209.0L250 218L245.7 209.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="258" y="188" font-size="17" fill="#e3e9e2" text-anchor="start">輸精管</text><rect x="206" y="264" width="145" height="53" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="216" y="296" font-size="17" fill="#eda894" text-anchor="start">腺體分泌會合</text><path d="M255 321L255 371" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M259.3 362.0L255 371L250.7 362.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="401" font-size="18" fill="#e3e9e2" text-anchor="start">尿道向外</text><rect x="440" y="100" width="384" height="332" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="460" y="130" font-size="20" fill="#c1b2ea" text-anchor="start">卵細胞與子宮（正面）</text><ellipse cx="494" cy="207" rx="22" ry="15" stroke="#ead68c" fill="#15211d" stroke-width="3"/><ellipse cx="770" cy="207" rx="22" ry="15" stroke="#ead68c" fill="#15211d" stroke-width="3"/><path d="M518 207Q553 168 591 206M748 207Q711 168 673 206" stroke="#ead68c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M588 204Q632 185 676 204L665 280Q632 334 599 280Z" stroke="#eda894" stroke-width="5" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><path d="M632 313V385" stroke="#c1b2ea" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="487" y="166" font-size="17" fill="#ead68c" text-anchor="start">卵巢</text><text x="681" y="166" font-size="17" fill="#ead68c" text-anchor="start">輸卵管</text><text x="681" y="269" font-size="18" fill="#eda894" text-anchor="start">子宮</text><text x="681" y="320" font-size="17" fill="#c1b2ea" text-anchor="start">子宮頸</text><text x="681" y="383" font-size="17" fill="#c1b2ea" text-anchor="start">陰道</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>