<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f04-title f04-desc"><title id="f04-title">生理使用的分子</title><desc id="f04-desc">水提供溶劑與熱特性，離子參與電與滲透，蛋白質提供結構及作用，脂質參與膜與能量。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 04  /  生理使用的分子</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">水</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">溶劑、溫度與運輸</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不是所有物質都易溶於水</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">離子</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">Na+、K+、Ca2+、Cl-</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">電荷與濃度分布影響功能</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">蛋白質</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">結構、酵素、通道及受體</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">功能依賴形狀與環境</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">脂質與醣類</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">膜、儲能及代謝原料</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">作用不同，不只「熱量」</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>