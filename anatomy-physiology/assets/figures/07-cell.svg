<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f07-title f07-desc"><title id="f07-title">一般有核細胞</title><desc id="f07-desc">一般化有核細胞的膜、核、細胞質與胞器；不是所有人體細胞都具有圖中全部構造，成熟紅血球為例外。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 07  /  一般有核細胞</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="350" cy="258" rx="235" ry="145" stroke="#b7e89f" fill="#15211d" stroke-width="3"/><ellipse cx="300" cy="248" rx="62" ry="51" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><text x="261" y="253" font-size="19" fill="#c1b2ea" text-anchor="start">細胞核</text><ellipse cx="465" cy="200" rx="41" ry="21" stroke="#ead68c" fill="#15211d" stroke-width="3"/><path d="M436 200l15-9 13 18 15-17 14 8" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 199L615 159" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="623" y="164" font-size="17" fill="#e3e9e2" text-anchor="start">粒線體</text><path d="M373 273q25-25 50 0t50 0M370 299q25-25 50 0t50 0" stroke="#9ac8e8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M472 286L615 286" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="623" y="291" font-size="17" fill="#e3e9e2" text-anchor="start">內質網與運輸</text><path d="M130 238L112 137" stroke="#b7e89f" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="142" font-size="17" fill="#e3e9e2" text-anchor="start">細胞膜</text><path d="M335 350L570 378" stroke="#b7e89f" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="383" font-size="17" fill="#e3e9e2" text-anchor="start">細胞質與胞器</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>