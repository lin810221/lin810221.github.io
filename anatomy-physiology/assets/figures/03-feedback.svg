<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f03-title f03-desc"><title id="f03-title">穩態的負回饋</title><desc id="f03-desc">偏離經感受與整合引發反應，反應減少原本偏離；穩態是動態調節而非數字永遠固定。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 03  /  穩態的負回饋</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="115" width="218" height="72" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="59" y="144" font-size="18" fill="#b7e89f" text-anchor="start">變數偏離</text><text x="59" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">例：體溫上升</text><path d="M271 151L295 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M286.0 146.7L295 151L286.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="115" width="218" height="72" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="324" y="144" font-size="18" fill="#9ac8e8" text-anchor="start">感受與整合</text><text x="324" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">比較身體當時需求</text><path d="M536 151L560 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M551.0 146.7L560 151L551.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="115" width="218" height="72" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="589" y="144" font-size="18" fill="#ead68c" text-anchor="start">效應器</text><text x="589" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">散熱反應改變</text><path d="M680 203V286H145V203" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 219L145 192" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140.7 201.0L145 192L149.3 201.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="274" font-size="18" fill="#9ac8e8" text-anchor="start">反應回頭減少原本偏離：負回饋</text><text x="75" y="351" font-size="21" fill="#e3e9e2" text-anchor="start">受調節的是變數；不是把所有活動都關掉。</text><text x="75" y="389" font-size="18" fill="#e3e9e2" text-anchor="start">正回饋會放大特定過程，仍需要終止條件。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>