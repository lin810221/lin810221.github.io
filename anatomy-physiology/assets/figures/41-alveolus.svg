<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f41-title f41-desc"><title id="f41-title">肺泡與微血管交換</title><desc id="f41-desc">氧從肺泡跨薄屏障進血，二氧化碳反向；兩者沿各自分壓梯度，氣道空氣不直接成為血液。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 41  /  肺泡與微血管交換</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="250" cy="252" rx="135" ry="116" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><path d="M424 131Q560 259 424 375" stroke="#eda894" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="177" y="248" font-size="24" fill="#9ac8e8" text-anchor="start">肺泡氣體</text><text x="525" y="198" font-size="22" fill="#eda894" text-anchor="start">微血管血液</text><path d="M338 206L450 206" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M441.0 201.7L450 206L441.0 210.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="177" font-size="18" fill="#b7e89f" text-anchor="start">O2 → 血液</text><path d="M449 310L336 310" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.0 314.3L336 310L345.0 305.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="349" y="353" font-size="18" fill="#ead68c" text-anchor="start">CO2 → 肺泡</text><text x="100" y="432" font-size="18" fill="#e3e9e2" text-anchor="start">依分壓梯度跨薄屏障擴散；空氣與整股血液不直接混合。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>