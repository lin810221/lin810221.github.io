<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f45-title f45-desc"><title id="f45-title">肝膽胰與十二指腸</title><desc id="f45-desc">肝製膽汁，膽囊儲存濃縮，膽道與胰外分泌導管通往十二指腸；食物不流進肝膽胰。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 45  /  肝膽胰與十二指腸</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M90 140Q180 95 306 145L270 221H95Z" stroke="#ead68c" stroke-width="4" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="174" font-size="24" fill="#ead68c" text-anchor="start">肝臟</text><ellipse cx="255" cy="232" rx="22" ry="30" stroke="#b7e89f" fill="#15211d" stroke-width="3"/><text x="85" y="265" font-size="21" fill="#b7e89f" text-anchor="start">膽囊</text><path d="M440 290Q545 242 660 285L626 315H452Z" stroke="#eda894" stroke-width="4" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><text x="513" y="293" font-size="22" fill="#eda894" text-anchor="start">胰臟</text><path d="M480 191Q359 179 360 290T482 398" stroke="#9ac8e8" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M255 254L327 284H365M480 290H365" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="168" font-size="22" fill="#9ac8e8" text-anchor="start">十二指腸</text><text x="85" y="390" font-size="17" fill="#e3e9e2" text-anchor="start">膽汁由肝製造，膽囊儲存濃縮。</text><text x="85" y="424" font-size="17" fill="#e3e9e2" text-anchor="start">胰外分泌經導管；胰島激素進血，不走這條管。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>