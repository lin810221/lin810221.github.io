<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f25-title f25-desc"><title id="f25-title">腦的主要區域</title><desc id="f25-desc">側面示意大腦、小腦、腦幹及與脊髓的連接；非影像定位圖，不把複雜功能歸成單一小點。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 25  /  腦的主要區域</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M158 294Q89 234 153 153Q224 81 365 127Q476 134 486 258Q485 307 399 324H292Q225 346 158 294Z" stroke="#c1b2ea" stroke-width="4" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 152Q173 215 209 304M285 124Q260 217 290 327M378 145Q353 215 388 318" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="424" cy="340" rx="58" ry="34" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><path d="M359 323L358 410" stroke="#ead68c" stroke-width="17" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M187 167L120 111" stroke="#c1b2ea" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="116" font-size="17" fill="#e3e9e2" text-anchor="start">大腦</text><path d="M460 342L543 349" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="551" y="354" font-size="17" fill="#e3e9e2" text-anchor="start">小腦</text><path d="M359 371L543 414" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="551" y="419" font-size="17" fill="#e3e9e2" text-anchor="start">腦幹連向脊髓</text><text x="547" y="158" font-size="22" fill="#e3e9e2" text-anchor="start">側面區域示意</text><text x="547" y="204" font-size="18" fill="#e3e9e2" text-anchor="start">功能依賴網路協作</text><text x="547" y="244" font-size="18" fill="#e3e9e2" text-anchor="start">不是一區只做一件事</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>