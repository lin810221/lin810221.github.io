<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f10-title f10-desc"><title id="f10-title">四大組織對照</title><desc id="f10-desc">上皮覆蓋與交換、結締組織支持與運輸、肌肉產生張力、神經組織傳遞與整合。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 10  /  四大組織對照</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">上皮組織</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">覆蓋、襯裡、交換及分泌</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">細胞緊密，有頂端與基底面</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">結締組織</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">支持、連接、儲存及運輸</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">細胞外基質是重要部分</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">肌肉組織</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">產生張力及動作</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">骨骼肌、心肌、平滑肌</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">神經組織</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">感受、傳遞及整合訊息</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">神經元與多種膠細胞</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>