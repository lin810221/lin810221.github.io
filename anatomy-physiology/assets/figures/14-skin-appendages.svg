<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f14-title f14-desc"><title id="f14-title">毛囊、皮脂腺與汗腺</title><desc id="f14-desc">毛囊位於皮膚內，皮脂腺與毛囊相關，汗腺有導管通向表面；不是排出所有代謝廢物的主路。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 14  /  毛囊、皮脂腺與汗腺</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="70" y="145" width="720" height="230" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><path d="M95 180H770" stroke="#ead68c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 120L330 337" stroke="#ead68c" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="332" cy="325" rx="21" ry="31" stroke="#eda894" fill="#15211d" stroke-width="3"/><ellipse cx="365" cy="229" rx="25" ry="15" stroke="#ead68c" fill="#15211d" stroke-width="3"/><path d="M340 229H321" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 175V267q-32 8-12 25t-10 26 5 25 25-8-4-25-5-21" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M312 142L150 108" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="113" font-size="17" fill="#e3e9e2" text-anchor="start">毛幹</text><path d="M360 229L375 130" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="383" y="135" font-size="17" fill="#e3e9e2" text-anchor="start">皮脂腺</text><path d="M525 315L570 333" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="338" font-size="17" fill="#e3e9e2" text-anchor="start">汗腺與導管</text><text x="90" y="421" font-size="18" fill="#e3e9e2" text-anchor="start">毛、皮脂與汗各有構造及功能，並非所有皮膚區域相同。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>