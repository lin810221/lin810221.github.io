<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f05-title f05-desc"><title id="f05-title">細胞內外與體液空間</title><desc id="f05-desc">細胞膜分開細胞內外，細胞外液含組織液及血漿，空間之間交換但不是單一水槽。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 05  /  細胞內外與體液空間</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="55" y="110" width="750" height="290" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><rect x="90" y="162" width="360" height="180" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="110" y="197" font-size="24" fill="#b7e89f" text-anchor="start">細胞內液</text><text x="110" y="236" font-size="17" fill="#e3e9e2" text-anchor="start">多數身體水在細胞內</text><text x="490" y="145" font-size="23" fill="#9ac8e8" text-anchor="start">細胞外液</text><rect x="490" y="174" width="280" height="68" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="510" y="215" font-size="22" fill="#9ac8e8" text-anchor="start">組織液</text><rect x="490" y="264" width="280" height="68" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="510" y="305" font-size="21" fill="#eda894" text-anchor="start">血漿（在血管內）</text><path d="M449 214L488 214" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M479.0 209.7L488 214L479.0 218.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 244L630 261" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.3 252.0L630 261L625.7 252.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="372" font-size="18" fill="#e3e9e2" text-anchor="start">水分布示意；不代表每個人的固定比例或飲水處方。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>