<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f13-title f13-desc"><title id="f13-title">皮膚與皮下組織</title><desc id="f13-desc">由表及深：無血管的表皮、有結締組織血管神經的真皮、其下皮下組織；圖不按厚度比例。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 13  /  皮膚與皮下組織</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="75" y="115" width="710" height="65" rx="3" stroke="#ead68c" fill="#514831" stroke-width="2"/><text x="560" y="157" font-size="20" fill="#ead68c" text-anchor="start">表皮：無血管</text><rect x="75" y="183" width="710" height="125" rx="3" stroke="#eda894" fill="#3f302a" stroke-width="2"/><text x="560" y="220" font-size="21" fill="#eda894" text-anchor="start">真皮</text><rect x="75" y="311" width="710" height="95" rx="3" stroke="#9ac8e8" fill="#25383d" stroke-width="2"/><text x="560" y="354" font-size="21" fill="#9ac8e8" text-anchor="start">皮下組織</text><path d="M125 275Q260 228 390 275T520 275" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="442" font-size="19" fill="#e3e9e2" text-anchor="start">皮膚本體通常指表皮＋真皮；皮下組織位於其下。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>