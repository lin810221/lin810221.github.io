<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f11-title f11-desc"><title id="f11-title">上皮的頂端與基底</title><desc id="f11-desc">上皮細胞頂端面朝腔或外界，基底面連接基底膜，下方結締組織可供應營養；不是所有上皮皆為單層柱狀。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 11  /  上皮的頂端與基底</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><text x="80" y="125" font-size="22" fill="#9ac8e8" text-anchor="start">腔面／外界側</text><rect x="80" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="114" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="155" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="189" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="230" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="264" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="305" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="339" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="380" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="414" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="455" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="489" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="530" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="564" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="605" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="639" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><rect x="680" y="157" width="68" height="110" rx="3" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><ellipse cx="714" cy="225" rx="12" ry="17" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><path d="M77 280H755" stroke="#ead68c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="325" font-size="20" fill="#ead68c" text-anchor="start">基底膜</text><path d="M80 361Q200 320 340 361T750 361" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="414" font-size="20" fill="#e3e9e2" text-anchor="start">下方結締組織及血管；上皮本身無血管。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>