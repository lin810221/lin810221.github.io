<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f37-title f37-desc"><title id="f37-title">心臟四腔與房室瓣</title><desc id="f37-desc">右心房到右心室經三尖瓣，左心房到左心室經二尖瓣；患者右心位於圖左，兩側由中隔分隔。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 37  /  心臟四腔與房室瓣</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="80" y="125" width="245" height="72" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="94" y="154" font-size="18" fill="#9ac8e8" text-anchor="start">右心房</text><text x="94" y="180" font-size="14" fill="#e3e9e2" text-anchor="start">接全身靜脈血</text><rect x="80" y="295" width="245" height="72" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="94" y="324" font-size="18" fill="#9ac8e8" text-anchor="start">右心室</text><text x="94" y="350" font-size="14" fill="#e3e9e2" text-anchor="start">經肺動脈向肺</text><rect x="470" y="125" width="245" height="72" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="484" y="154" font-size="18" fill="#eda894" text-anchor="start">左心房</text><text x="484" y="180" font-size="14" fill="#e3e9e2" text-anchor="start">接肺靜脈血</text><rect x="470" y="295" width="245" height="72" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="484" y="324" font-size="18" fill="#eda894" text-anchor="start">左心室</text><text x="484" y="350" font-size="14" fill="#e3e9e2" text-anchor="start">經主動脈向全身</text><path d="M202 202L202 286" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.3 277.0L202 286L197.7 277.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M592 202L592 286" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M596.3 277.0L592 286L587.7 277.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="245" font-size="18" fill="#ead68c" text-anchor="start">三尖瓣</text><text x="620" y="245" font-size="18" fill="#ead68c" text-anchor="start">二尖瓣（僧帽瓣）</text><text x="80" y="414" font-size="18" fill="#e3e9e2" text-anchor="start">患者右心在圖左；方塊為連通關係，不是實際形狀。</text><text x="355" y="270" font-size="20" fill="#e3e9e2" text-anchor="start">中隔</text><path d="M405 112V380" stroke="#778d7d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>