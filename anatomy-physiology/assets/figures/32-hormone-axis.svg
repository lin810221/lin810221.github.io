<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f32-title f32-desc"><title id="f32-title">內分泌軸與例外</title><desc id="f32-desc">代表性下視丘—腦下垂體前葉—周邊腺軸及負回饋；後葉及醛固酮等不能硬套相同控制鏈。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 32  /  內分泌軸與例外</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="115" width="218" height="72" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="59" y="144" font-size="18" fill="#b7e89f" text-anchor="start">下視丘</text><text x="59" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">釋放調節訊號</text><path d="M271 151L295 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M286.0 146.7L295 151L286.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="115" width="218" height="72" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="324" y="144" font-size="18" fill="#9ac8e8" text-anchor="start">腦下垂體前葉</text><text x="324" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">促激素</text><path d="M536 151L560 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M551.0 146.7L560 151L551.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="115" width="218" height="72" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="589" y="144" font-size="18" fill="#ead68c" text-anchor="start">周邊腺體</text><text x="589" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">例如甲狀腺</text><path d="M680 201V300H125V202" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 219L125 192" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.7 201.0L125 192L129.3 201.0" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="291" font-size="20" fill="#c1b2ea" text-anchor="start">部分周邊激素回饋上游</text><text x="90" y="365" font-size="19" fill="#e3e9e2" text-anchor="start">不是所有激素都經同一條軸；ADH由下視丘合成。</text><text x="90" y="405" font-size="19" fill="#e3e9e2" text-anchor="start">後葉釋放ADH；醛固酮另受RAAS與血鉀調節。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>