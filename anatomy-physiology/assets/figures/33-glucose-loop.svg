<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f33-title f33-desc"><title id="f33-title">餐後與空腹的訊號分工</title><desc id="f33-desc">餐後與空腹的血糖調節：胰島訊號透過肝、肌肉及脂肪等改變利用與儲存；不是單一開關。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 33  /  餐後與空腹的訊號分工</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">餐後情境</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">血中營養供應增加</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">β細胞胰島素等訊號參與</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">使用與儲存</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">肝、肌肉、脂肪反應不同</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不是所有細胞攝糖都需胰島素</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">空腹情境</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">腸道供應下降</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">α細胞升糖素等訊號參與</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">維持供應</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">肝臟分解儲存及製造葡萄糖</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不是肌肉把肝醣直接輸出成血糖</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>