<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f12-title f12-desc"><title id="f12-title">不同層次的膜</title><desc id="f12-desc">細胞膜是細胞邊界，黏膜襯通外界管道，漿膜襯體腔及包覆器官，滑膜與關節腔相關。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 12  /  不同層次的膜</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">細胞膜</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">細胞邊界的磷脂雙層</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不是肉眼可見的器官包膜</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">黏膜</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">襯通外界的管道</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">上皮＋下方支持組織</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">漿膜</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">壁層、腔隙與臟層</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">讓部分器官間滑動較順</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">滑膜</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">滑液關節腔的內襯</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不是關節軟骨本身</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>