<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f44-title f44-desc"><title id="f44-title">小腸絨毛的吸收界面</title><desc id="f44-desc">絨毛表面上皮通過後，營養進入微血管或乳糜管等路徑；圖只畫代表性分工，不是所有脂質的唯一規則。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 44  /  小腸絨毛的吸收界面</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M105 350V235Q105 130 190 130Q275 130 275 235V350M275 350V235Q275 130 360 130Q445 130 445 235V350M445 350V235Q445 130 530 130Q615 130 615 235V350" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M153 329V224Q188 168 223 224V329" stroke="#eda894" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 330V200" stroke="#ead68c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M276 208L627 148" stroke="#b7e89f" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="153" font-size="17" fill="#e3e9e2" text-anchor="start">上皮邊界</text><path d="M222 285L627 252" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="257" font-size="17" fill="#e3e9e2" text-anchor="start">微血管路</text><path d="M190 296L627 356" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="361" font-size="17" fill="#e3e9e2" text-anchor="start">乳糜管：淋巴路</text><text x="83" y="419" font-size="18" fill="#e3e9e2" text-anchor="start">水溶性營養與多數長鏈脂質的運送路徑不完全相同。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>