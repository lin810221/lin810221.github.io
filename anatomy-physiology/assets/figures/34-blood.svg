<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f34-title f34-desc"><title id="f34-title">血液的四類重要成分</title><desc id="f34-desc">血漿運輸、紅血球氣體運輸、白血球防禦、血小板止血，並不是每類都是完整有核細胞。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 34  /  血液的四類重要成分</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">血漿</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">水、蛋白質、溶質</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不是所有成分都溶解在血漿</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">紅血球</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">血紅素與氧運輸</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">成熟人類紅血球無細胞核</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">白血球</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">多類細胞的防禦與調節</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不是一種細胞包辦所有免疫</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">血小板</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">細胞碎片，參與止血</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">血小板栓與凝血需協作</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>