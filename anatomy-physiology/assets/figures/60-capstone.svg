<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f60-title f60-desc"><title id="f60-title">跨系統概念圖練習</title><desc id="f60-desc">把一個生活情境連到位置、物質路徑、控制訊號、回饋、時間及不確定性，形成可口述的概念地圖。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 60  /  跨系統概念圖練習</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">先畫位置</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">標器官、區室與邊界</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">人體左右與剖面要說清</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">再追物質</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">食物、氣體、血液、濾液</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不能把不同管路接成一條</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">最後接控制</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">神經、激素、局部調節</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">箭頭是促進、抑制還是運送？</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">回到生活</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">說明功能、條件與未知</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">使用圖解與學習單自評</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>