<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f56-title f56-desc"><title id="f56-title">站起來時的壓力調節</title><desc id="f56-desc">姿勢改變影響回流與血壓，壓力感受與中樞調節可改變心血管反應；並非個人暈眩診斷流程。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 56  /  站起來時的壓力調節</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="115" width="218" height="72" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="59" y="144" font-size="18" fill="#b7e89f" text-anchor="start">由躺到站</text><text x="59" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">重力下血液分布改變</text><path d="M271 151L295 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M286.0 146.7L295 151L286.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="115" width="218" height="72" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="324" y="144" font-size="18" fill="#9ac8e8" text-anchor="start">回心血量變化</text><text x="324" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">心室充填可變</text><path d="M536 151L560 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M551.0 146.7L560 151L551.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="115" width="218" height="72" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="589" y="144" font-size="18" fill="#ead68c" text-anchor="start">壓力感受器</text><text x="589" y="170" font-size="14" fill="#e3e9e2" text-anchor="start">感受血管壁伸展變化</text><path d="M684.0 195V227H154.0V258" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M154.0 250L154.0 263" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M158.3 254.0L154.0 263L149.7 254.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="265" width="218" height="72" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="59" y="294" font-size="18" fill="#c1b2ea" text-anchor="start">中樞整合</text><text x="59" y="320" font-size="14" fill="#e3e9e2" text-anchor="start">調節傳出訊息</text><path d="M271 301L295 301" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M286.0 296.7L295 301L286.0 305.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="265" width="218" height="72" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="324" y="294" font-size="18" fill="#eda894" text-anchor="start">心與血管反應</text><text x="324" y="320" font-size="14" fill="#e3e9e2" text-anchor="start">心率、收縮與血管張力</text><path d="M536 301L560 301" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M551.0 296.7L560 301L551.0 305.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="265" width="218" height="72" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="589" y="294" font-size="18" fill="#b7e89f" text-anchor="start">持續整合</text><text x="589" y="320" font-size="14" fill="#e3e9e2" text-anchor="start">不是只有心臟一個器官</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>