<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f36-title f36-desc"><title id="f36-title">先天與適應性免疫協作</title><desc id="f36-desc">屏障與先天反應、抗原呈現、T/B細胞、抗體及記憶互相協作，並非兩套完全獨立防線。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 36  /  先天與適應性免疫協作</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">屏障與先天辨識</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">皮膚、黏膜、吞噬及補體等</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">和適應性反應互相協作</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">T細胞與B細胞</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">特異性反應與協調</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">抗體不是所有免疫的全部</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">抗原呈現與訊號</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">連接不同細胞反應</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">不是第一關失敗才換第二關</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">記憶與調節</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">後續反應可改變</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">保護有條件，不是越強越好</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>