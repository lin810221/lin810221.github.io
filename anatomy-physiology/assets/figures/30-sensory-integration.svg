<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f30-title f30-desc"><title id="f30-title">感覺是整合，不是單一路徑</title><desc id="f30-desc">視覺、前庭、本體感覺共同支持平衡；風味也整合味覺嗅覺與其他感受。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 30  /  感覺是整合，不是單一路徑</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="45" y="110" width="365" height="130" rx="12" stroke="#b7e89f" fill="#15211d" stroke-width="2"/><text x="63" y="144" font-size="21" fill="#b7e89f" text-anchor="start">視覺</text><text x="63" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">周圍移動與空間線索</text><text x="63" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">不單靠眼睛維持平衡</text><rect x="440" y="110" width="365" height="130" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="458" y="144" font-size="21" fill="#9ac8e8" text-anchor="start">前庭</text><text x="458" y="182" font-size="16" fill="#e3e9e2" text-anchor="start">頭部轉動與線性加速度</text><text x="458" y="213" font-size="16" fill="#e3e9e2" text-anchor="start">半規管與耳石器官分工</text><rect x="45" y="265" width="365" height="130" rx="12" stroke="#ead68c" fill="#15211d" stroke-width="2"/><text x="63" y="299" font-size="21" fill="#ead68c" text-anchor="start">本體感覺</text><text x="63" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">肌肉與關節位置線索</text><text x="63" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">與視覺、前庭一起整合</text><rect x="440" y="265" width="365" height="130" rx="12" stroke="#c1b2ea" fill="#15211d" stroke-width="2"/><text x="458" y="299" font-size="21" fill="#c1b2ea" text-anchor="start">味覺與風味</text><text x="458" y="337" font-size="16" fill="#e3e9e2" text-anchor="start">味覺＋嗅覺＋質地等</text><text x="458" y="368" font-size="16" fill="#e3e9e2" text-anchor="start">沒有互斥的舌頭味覺地圖</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>