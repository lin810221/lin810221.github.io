<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f61-title f61-desc"><title id="f61-title">解剖切面：切的是哪個方向</title><desc id="f61-desc">三種概念切面：矢狀分左右、冠狀分前後、橫斷分上下。斜面為透視符號，不表示影像顯示方向。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 61  /  解剖切面：切的是哪個方向</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="140" cy="162" rx="24" ry="30" stroke="#a4b6a5" fill="#15211d" stroke-width="3"/><path d="M110 199H170L182 325H98Z" stroke="#a4b6a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M108 327L100 393M172 327L180 393" stroke="#a4b6a5" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M141 110V403" stroke="#c1b2ea" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="80" y="428" font-size="20" fill="#c1b2ea" text-anchor="start">矢狀面：分左右</text><ellipse cx="410" cy="162" rx="24" ry="30" stroke="#a4b6a5" fill="#15211d" stroke-width="3"/><path d="M380 199H440L452 325H368Z" stroke="#a4b6a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M378 327L370 393M442 327L450 393" stroke="#a4b6a5" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 119L473 144V381L350 357Z" stroke="#9ac8e8" stroke-width="3" fill="#9ac8e815" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="428" font-size="20" fill="#9ac8e8" text-anchor="start">冠狀面：分前後</text><ellipse cx="680" cy="162" rx="24" ry="30" stroke="#a4b6a5" fill="#15211d" stroke-width="3"/><path d="M650 199H710L722 325H638Z" stroke="#a4b6a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M648 327L640 393M712 327L720 393" stroke="#a4b6a5" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M614 265L732 250 764 279 632 298Z" stroke="#ead68c" stroke-width="2" fill="#ead68c22" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="428" font-size="20" fill="#ead68c" text-anchor="start">橫斷面：分上下</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>