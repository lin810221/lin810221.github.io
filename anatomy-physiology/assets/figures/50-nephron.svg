<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f50-title f50-desc"><title id="f50-title">腎元的濾過、回收與分泌</title><desc id="f50-desc">血漿部分水溶質濾入管腔，小管與血液間回收及分泌，最後排出；示意箭頭表示物質方向，非所有微血管細節。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 50  /  腎元的濾過、回收與分泌</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="159" cy="184" rx="57" ry="48" stroke="#eda894" fill="#15211d" stroke-width="3"/><path d="M123 178q36-44 72 0t-72 0" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 232Q310 227 300 295L301 380Q348 437 383 380V247Q454 217 492 267L538 295V419" stroke="#ead68c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 419H672V160" stroke="#ead68c" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="114" font-size="21" fill="#eda894" text-anchor="start">腎小球</text><text x="358" y="153" font-size="20" fill="#ead68c" text-anchor="start">小管與集尿管（非比例）</text><path d="M157 195L164 239" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M166.9 229.4L164 239L158.3 230.8" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="286" font-size="18" fill="#9ac8e8" text-anchor="start">濾過</text><path d="M306 294L241 294" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250.0 298.3L241 294L250.0 289.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="333" font-size="17" fill="#b7e89f" text-anchor="start">回收→血液側</text><path d="M445 337L538 337" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M529.0 332.7L538 337L529.0 341.3" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="399" y="376" font-size="17" fill="#c1b2ea" text-anchor="start">血液側→分泌</text><text x="601" y="452" font-size="18" fill="#ead68c" text-anchor="start">尿液流向</text><text x="70" y="446" font-size="18" fill="#e3e9e2" text-anchor="start">血路細節省略；濾液不是最終尿液。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>