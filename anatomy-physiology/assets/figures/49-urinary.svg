<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f49-title f49-desc"><title id="f49-title">腎臟與尿路</title><desc id="f49-desc">兩腎形成尿液，輸尿管至膀胱儲存，再由尿道排出；輸尿管與尿道不同，位置不按比例。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 49  /  腎臟與尿路</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M237 139Q139 112 135 234Q138 342 237 307Q191 270 237 235Q267 197 237 139ZM472 139Q570 112 574 234Q571 342 472 307Q518 270 472 235Q442 197 472 139Z" stroke="#eda894" stroke-width="4" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 270L300 365M485 270L408 365" stroke="#ead68c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="354" cy="388" rx="65" ry="42" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><path d="M354 431V453" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 175L105 111" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="116" font-size="17" fill="#e3e9e2" text-anchor="start">腎臟</text><path d="M264 316L122 355" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="360" font-size="17" fill="#e3e9e2" text-anchor="start">輸尿管</text><path d="M416 389L550 387" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="558" y="392" font-size="17" fill="#e3e9e2" text-anchor="start">膀胱</text><text x="565" y="436" font-size="20" fill="#9ac8e8" text-anchor="start">尿道</text><text x="570" y="165" font-size="18" fill="#e3e9e2" text-anchor="start">後腹膜位置概念</text><text x="570" y="213" font-size="18" fill="#e3e9e2" text-anchor="start">腎臟不在骨盆內</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>