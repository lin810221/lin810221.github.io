<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f31-title f31-desc"><title id="f31-title">內分泌器官與血液訊號</title><desc id="f31-desc">主要腺體位置圖：下視丘腦下垂體、甲狀腺副甲狀腺、腎上腺與胰島；只選代表器官，並非完整名錄。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 31  /  內分泌器官與血液訊號</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="340" cy="117" rx="33" ry="43" stroke="#788d7c" fill="#15211d" stroke-width="3"/><path d="M319 160L284 180 258 290M361 160L396 180 422 290M284 180L289 310 314 401M396 180L391 310 366 401M289 310Q340 333 391 310M320 326L314 401M360 326L366 401" stroke="#788d7c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M287 183Q340 157 393 183M305 235H375" stroke="#526756" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="340" cy="136" rx="7" ry="7" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><path d="M342 135L490 132" stroke="#c1b2ea" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="137" font-size="17" fill="#e3e9e2" text-anchor="start">下視丘／腦下垂體</text><ellipse cx="332" cy="175" rx="11" ry="8" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><ellipse cx="348" cy="175" rx="11" ry="8" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><path d="M349 175L490 185" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="190" font-size="17" fill="#e3e9e2" text-anchor="start">甲狀腺；後方副甲狀腺</text><ellipse cx="311" cy="268" rx="10" ry="7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="369" cy="268" rx="10" ry="7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M372 267L490 260" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="265" font-size="17" fill="#e3e9e2" text-anchor="start">腎上腺</text><path d="M317 289Q343 275 367 288" stroke="#eda894" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M359 285L490 319" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="324" font-size="17" fill="#e3e9e2" text-anchor="start">胰島（胰臟內）</text><text x="95" y="431" font-size="17" fill="#e3e9e2" text-anchor="start">正面位置概念；受體與血液連接，不靠一條實體線串完。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>