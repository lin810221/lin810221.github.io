<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f01-title f01-desc"><title id="f01-title">人體系統位置導覽</title><desc id="f01-desc">正面人體概念圖，腦在頭部、肺在胸腔兩側、心臟在兩肺間偏人體左、肝在人體右上腹；不精確比例。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 01  /  人體系統位置導覽</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="340" cy="117" rx="33" ry="43" stroke="#788d7c" fill="#15211d" stroke-width="3"/><path d="M319 160L284 180 258 290M361 160L396 180 422 290M284 180L289 310 314 401M396 180L391 310 366 401M289 310Q340 333 391 310M320 326L314 401M360 326L366 401" stroke="#788d7c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M287 183Q340 157 393 183M305 235H375" stroke="#526756" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="105" font-size="16" fill="#9ac8e8" text-anchor="start">人體右側</text><text x="466" y="105" font-size="16" fill="#eda894" text-anchor="start">人體左側</text><ellipse cx="340" cy="113" rx="22" ry="22" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><path d="M360 108L510 130" stroke="#c1b2ea" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="518" y="135" font-size="17" fill="#e3e9e2" text-anchor="start">腦：訊息整合</text><path d="M335 180Q292 161 291 228Q304 247 329 231ZM346 180Q389 161 389 228Q376 247 351 231Z" stroke="#9ac8e8" stroke-width="2" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><path d="M389 202L510 205" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="518" y="210" font-size="17" fill="#e3e9e2" text-anchor="start">肺：氣體交換</text><ellipse cx="344" cy="222" rx="15" ry="20" stroke="#eda894" fill="#15211d" stroke-width="3"/><path d="M351 226L510 253" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="518" y="258" font-size="17" fill="#e3e9e2" text-anchor="start">心臟：推動血液</text><path d="M298 253Q320 238 351 254L338 270H298Z" stroke="#ead68c" stroke-width="2" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 253L150 250" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="255" font-size="17" fill="#e3e9e2" text-anchor="start">肝臟</text><path d="M353 258Q383 247 376 280Q352 290 348 275" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M378 267L510 297" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="518" y="302" font-size="17" fill="#e3e9e2" text-anchor="start">胃與腸：消化吸收</text><path d="M312 293Q340 273 369 293Q318 287 318 303H364" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="417" font-size="16" fill="#e3e9e2" text-anchor="start">正面示意：圖左是人體右；位置只供系統關係辨識。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>