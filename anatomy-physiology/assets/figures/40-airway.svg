<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f40-title f40-desc"><title id="f40-title">呼吸道與胸腔</title><desc id="f40-desc">氣管分成支氣管，肺內分支通向末端肺泡；肺位於胸腔，膈肌在下方，肺本身不是主動拉開的肌肉。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 40  /  呼吸道與胸腔</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M339 112V217M339 217L256 266M339 217L426 266" stroke="#ead68c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M314 184Q229 153 208 281Q207 350 313 355ZM364 184Q449 153 470 281Q471 350 365 355Z" stroke="#9ac8e8" stroke-width="3" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 265l-19 39m19-39 28 43m143-43-27 40m27-40 22 44" stroke="#ead68c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 392Q339 330 473 392" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 149L548 132" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="137" font-size="17" fill="#e3e9e2" text-anchor="start">氣管</text><path d="M425 266L548 227" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="232" font-size="17" fill="#e3e9e2" text-anchor="start">支氣管與分支</text><path d="M467 322L548 316" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="321" font-size="17" fill="#e3e9e2" text-anchor="start">肺：末端有肺泡</text><path d="M403 363L548 404" stroke="#b7e89f" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="556" y="409" font-size="17" fill="#e3e9e2" text-anchor="start">膈肌</text><text x="60" y="437" font-size="18" fill="#e3e9e2" text-anchor="start">空氣進出氣道；氣體在肺泡與微血管之間交換。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>