<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f43-title f43-desc"><title id="f43-title">消化管的連通路徑</title><desc id="f43-desc">食道到胃、小腸、大腸及肛門相連，分泌消化及吸收有區域分工，並非所有營養在胃吸收。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 43  /  消化管的連通路徑</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M340 103V203" stroke="#ead68c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 200Q427 172 429 246Q422 296 352 273Q333 252 345 200Z" stroke="#eda894" stroke-width="4" fill="#15211d" stroke-linecap="round" stroke-linejoin="round"/><path d="M351 273L307 289" stroke="#ead68c" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="245" y="277" width="203" height="128" rx="21" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><path d="M278 305Q392 284 404 315T282 338 404 365" stroke="#b7e89f" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M339 153L500 131" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="136" font-size="17" fill="#e3e9e2" text-anchor="start">食道</text><path d="M418 232L500 220" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="225" font-size="17" fill="#e3e9e2" text-anchor="start">胃</text><path d="M361 340L500 317" stroke="#b7e89f" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="322" font-size="17" fill="#e3e9e2" text-anchor="start">小腸（內側）</text><path d="M448 300L500 389" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="394" font-size="17" fill="#e3e9e2" text-anchor="start">大腸（外框示意）</text><path d="M340 405V424" stroke="#9ac8e8" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="450" font-size="17" fill="#e3e9e2" text-anchor="start">消化管為連通管道；不是實際腸袢或比例。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>