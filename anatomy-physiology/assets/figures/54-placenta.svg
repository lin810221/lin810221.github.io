<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f54-title f54-desc"><title id="f54-title">胎盤的兩套循環與交換</title><desc id="f54-desc">母體與胎兒血液一般保持分隔，在胎盤跨界交換物質；不是把母體動脈直接接到胎兒靜脈。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 54  /  胎盤的兩套循環與交換</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><rect x="50" y="118" width="300" height="278" rx="12" stroke="#eda894" fill="#15211d" stroke-width="2"/><text x="77" y="158" font-size="23" fill="#eda894" text-anchor="start">母體血液空間</text><rect x="500" y="118" width="300" height="278" rx="12" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><text x="528" y="158" font-size="23" fill="#9ac8e8" text-anchor="start">胎兒微血管</text><path d="M425 119V396" stroke="#ead68c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 226L558 226" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M549.0 221.7L558 226L549.0 230.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="197" font-size="17" fill="#b7e89f" text-anchor="start">O2、營養等</text><path d="M560 312L273 312" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M282.0 316.3L273 312L282.0 307.7" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="325" y="349" font-size="17" fill="#c1b2ea" text-anchor="start">CO2、代謝物等</text><text x="80" y="437" font-size="17" fill="#e3e9e2" text-anchor="start">一般維持兩套循環分隔；跨屏障交換不等於完全阻擋所有物質。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>