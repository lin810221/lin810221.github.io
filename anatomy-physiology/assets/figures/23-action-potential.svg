<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f23-title f23-desc"><title id="f23-title">動作電位的時間順序</title><desc id="f23-desc">示意去極化、再極化與短暫後電位；無實測刻度，不以波峰高低推個人感覺強度。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 23  /  動作電位的時間順序</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M85 120V388H778" stroke="#8c9c8d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 330H250L280 290 315 140 350 225 395 355 450 330H750" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="422" font-size="18" fill="#e3e9e2" text-anchor="start">時間 →（任意示意，非個人神經檢測）</text><text x="95" y="100" font-size="17" fill="#e3e9e2" text-anchor="start">相對膜電位</text><text x="145" y="305" font-size="18" fill="#e3e9e2" text-anchor="start">靜止</text><text x="284" y="121" font-size="18" fill="#b7e89f" text-anchor="start">去極化</text><text x="372" y="196" font-size="18" fill="#9ac8e8" text-anchor="start">再極化</text><text x="418" y="385" font-size="17" fill="#e3e9e2" text-anchor="start">短暫後電位</text><text x="510" y="172" font-size="16" fill="#e3e9e2" text-anchor="start">大小不以刺激越強就無限增加</text><text x="510" y="210" font-size="16" fill="#e3e9e2" text-anchor="start">頻率、募集與路徑可承載資訊</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>