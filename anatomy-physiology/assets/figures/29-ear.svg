<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f29-title f29-desc"><title id="f29-title">外耳、中耳、內耳</title><desc id="f29-desc">聲音經耳道、鼓膜、聽小骨到耳蝸；耳蝸毛細胞轉換訊號，前庭結構參與平衡而非聽覺主路。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 29  /  外耳、中耳、內耳</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M155 146Q79 126 100 250Q84 348 162 329Q117 281 171 247Q194 207 155 180" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M171 247H322" stroke="#ead68c" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M326 198L337 290" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M348 221l39-15 29 26 30-13" stroke="#ead68c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M547 255c-85-103-149 77-37 65 65-7 27-86-6-58-20 18 9 35 21 20" stroke="#c1b2ea" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M549 229Q572 128 637 163Q655 202 586 208M582 202Q583 121 617 114Q665 120 636 183" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 247L253 372" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="211" y="377" font-size="17" fill="#e3e9e2" text-anchor="start">耳道</text><path d="M332 237L341 132" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="349" y="137" font-size="17" fill="#e3e9e2" text-anchor="start">鼓膜</text><path d="M397 220L397 368" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="405" y="373" font-size="17" fill="#e3e9e2" text-anchor="start">聽小骨</text><path d="M516 282L613 326" stroke="#c1b2ea" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="621" y="331" font-size="17" fill="#e3e9e2" text-anchor="start">耳蝸：聽覺</text><text x="520" y="414" font-size="18" fill="#9ac8e8" text-anchor="start">前庭結構：平衡訊息</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>