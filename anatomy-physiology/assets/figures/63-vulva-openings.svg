<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="f63-title f63-desc"><title id="f63-title">外陰與不同開口</title><desc id="f63-desc">外陰外部概念圖，陰蒂相關構造、尿道口與陰道口分開標示；尿液不由陰道口正常排出，非精密比例。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">FIG 63  /  外陰與不同開口</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M290 133Q200 200 231 354Q275 412 346 420Q417 412 461 354Q492 200 402 133" stroke="#eda894" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M317 175Q264 225 283 345M375 175Q428 225 409 345" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="346" cy="182" rx="10" ry="7" stroke="#ead68c" fill="#15211d" stroke-width="3"/><ellipse cx="346" cy="244" rx="7" ry="7" stroke="#9ac8e8" fill="#15211d" stroke-width="3"/><ellipse cx="346" cy="312" rx="15" ry="22" stroke="#eda894" fill="#15211d" stroke-width="3"/><path d="M356 182L550 167" stroke="#ead68c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="558" y="172" font-size="17" fill="#e3e9e2" text-anchor="start">陰蒂相關外部構造</text><path d="M355 244L550 246" stroke="#9ac8e8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="558" y="251" font-size="17" fill="#e3e9e2" text-anchor="start">尿道口：尿液出口</text><path d="M365 310L550 324" stroke="#eda894" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="558" y="329" font-size="17" fill="#e3e9e2" text-anchor="start">陰道口：生殖通道</text><text x="85" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">前側在圖上方；外陰外部示意，省略個體形狀差異與部分構造。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>