name: Build and deploy Learning Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/requirements-ci.txt
            tools/requirements.txt
            langgraph/examples/requirements.txt
            pytorch/examples/requirements.txt
            machine-learning/examples/requirements.txt
            deep-learning/examples/requirements.txt

      - name: Install build and test dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      - name: Install pinned latest-stable PyTorch CPU course baselines
        run: python -m pip install -r pytorch/examples/requirements.txt -r deep-learning/examples/requirements.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned latest-stable machine learning course baseline
        run: python -m pip install -r machine-learning/examples/requirements.txt

      - name: Build course pages and downloads
        run: python tools/build.py --require-prerender

      - name: Verify math boundaries, encoding and all-course illustration coverage
        run: python -m unittest discover -s tools -p 'test_site_*.py' -v

      - name: Verify Markdown and LaTeX parsing regressions
        run: python -m unittest discover -s tools -p test_math_build.py -v

      - name: Verify whole-site mathematical prose and topic definitions
        run: python -m unittest discover -s tools -p test_math_editorial.py -v

      - name: Verify fine-tuning sources, diagrams and portable learning materials
        run: python -m unittest discover -s tools -p test_finetuning_materials.py -v

      - name: Verify Django templates, source correspondence and portable downloads
        run: python -m unittest discover -s tools -p test_django_materials.py -v

      - name: Verify SQL source parity, diagrams and portable learning materials
        run: python -m unittest discover -s tools -p test_sql_materials.py -v

      - name: Verify multimodal sources, fixtures and portable downloads
        run: python -m unittest discover -s tools -p test_multimodal_materials.py -v

      - name: Verify FastAPI sources, diagrams and portable full project
        run: python -m unittest discover -s tools -p test_fastapi_materials.py -v

      - name: Validate pages, links, and offline fonts
        run: python tools/validate.py

      - name: Test LangGraph examples
        run: python -m pytest langgraph/examples/test_examples.py -q

      - name: Test LLM examples without real API requests
        run: python -m unittest discover -s llm/examples -p test_examples.py -v

      - name: Test RAG retrieval, permissions, citations, and offline examples
        run: python -m unittest discover -s rag/examples -p test_examples.py -v

      - name: Test embedding mathematics, learning, adapters, and offline examples
        run: python -m unittest discover -s embedding/examples -p test_examples.py -v

      - name: Test PyTorch CPU training, gradients, checkpoints, resume, and export
        run: python -m unittest discover -s pytorch/examples -p test_examples.py -v

      - name: Test machine learning pipelines, selection, calibration, clustering, and artifacts
        run: python -m unittest discover -s machine-learning/examples -p test_examples.py -v

      - name: Test deep learning gradients, architectures, generation, and complete projects
        run: python -m unittest discover -s deep-learning/examples -p test_examples.py -v

      - name: Verify visual anatomy materials and standalone learning bundle
        run: python -m unittest discover -s tools -p test_anatomy_materials.py -v

      - name: Verify health diagrams, reading tasks and standalone visual bundles
        run: python -m unittest discover -s tools -p test_health_visuals.py -v

      - name: Verify evidence course diagrams, provenance and offline study bundle
        run: python -m unittest discover -s tools -p test_evidence_materials.py -v

      - name: Verify sleep diagrams, time definitions and standalone study bundle
        run: python -m unittest discover -s tools -p test_sleep_materials.py -v

      - name: Verify population denominators, public-health diagrams and standalone study bundle
        run: python -m unittest discover -s tools -p test_public_materials.py -v

      - name: Verify first-aid versions, learning scenarios, diagrams and standalone bundle
        run: python -m unittest discover -s tools -p test_first_aid_materials.py -v

      - name: Verify vision diagrams, source correspondence and portable download bundles
        run: python -m unittest discover -s tools -p test_vision_materials.py -v

      - name: Verify Transformer diagrams and portable code/study artifacts
        run: python -m unittest discover -s tools -p test_transformer_materials.py -v

      - name: Prepare publishable website
        run: python tools/prepare_pages.py --target pages

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent Python for latest statistics baseline
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: applied-statistics/examples/requirements.txt

      - name: Install pinned latest-stable statistics course dependencies
        run: python -m pip install -r applied-statistics/examples/requirements.txt

      - name: Test statistics calculations, models, questionnaires, and report delivery
        run: python -m unittest discover -s applied-statistics/examples -p test_examples.py -v

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent Python for MCP SDK 2.3.0
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mcp/examples/requirements.txt
            mcp/examples/requirements-lock.txt

      - name: Install pinned MCP dependencies
        run: python -m pip install -r mcp/examples/requirements.txt

      - name: Test contracts, identity, transactions, stdio and loopback HTTP
        run: python -m unittest discover -s mcp/examples -p test_examples.py -v

  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent Python for search engine examples
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            search/examples/requirements.txt
            search/examples/requirements-lock.txt

      - name: Install pinned latest-stable search dependencies
        run: python -m pip install -r search/examples/requirements.txt

      - name: Test FTS5, Faiss, Qdrant Local, isolation, replay and restore
        run: python -m unittest discover -s search/examples -p test_examples.py -v

  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up verified latest stable economics runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test economic models, accounting, data vintages and report artifacts
        run: python -m unittest discover -s economics/examples -p test_examples.py -v

  nutrition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up verified latest stable nutrition runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test nutrition units, missing data, reference scope and offline reports
        run: python -m unittest discover -s nutrition/examples -p test_examples.py -v

  exercise_science:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable exercise runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test exercise arithmetic, missing records, model scope and reports
        run: python -m unittest discover -s exercise-science/examples -p test_examples.py -v

  metabolic_health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable metabolic-health runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test metabolic units, missing observations, model scope and reports
        run: python -m unittest discover -s metabolic-health/examples -p test_examples.py -v

  mental_health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable mental-health runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test original diary, missingness, timing, evidence and offline reports
        run: python -m unittest discover -s mental-health/examples -p test_examples.py -v

  ergonomics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable ergonomics runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test task units, RNLE scope, missingness, vibration and reports
        run: python -m unittest discover -s ergonomics/examples -p test_examples.py -v

  image_recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent Python for current vision and ONNX baselines
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            image-recognition/examples/requirements.txt
            image-recognition/examples/requirements-lock.txt

      - name: Install pinned PyTorch CPU wheels
        run: python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install complete pinned vision stack
        run: python -m pip install -r image-recognition/examples/requirements-lock.txt

      - name: Verify image contracts, training, metrics and dynamic ONNX parity offline
        run: python -m unittest discover -s image-recognition/examples -p test_examples.py -v

  transformer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent current Python for Transformer course
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: |
            transformer/examples/requirements.txt
            transformer/examples/requirements-lock.txt

      - name: Install current pip and pinned CPU framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Install complete pinned Transformer stack
        run: python -m pip install -r transformer/examples/requirements-lock.txt

      - name: Verify language model, tokenizer, cache, objectives and offline artifacts
        run: python -m unittest discover -s transformer/examples -p test_examples.py -v

  finetuning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up independent fine-tuning course runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: finetuning/examples/requirements-lock.txt
      - name: Install pinned CPU training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -r finetuning/examples/requirements-lock.txt
      - name: Verify real PEFT, TRL, resume, evaluation and artifact contracts offline
        run: python -m unittest discover -s finetuning/examples -p test_examples.py -v

  django:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up independent Django stable runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: django/examples/requirements-lock.txt
      - name: Install locked Django application dependencies
        run: python -m pip install -r django/examples/requirements-lock.txt
      - name: Verify real models, ownership, CSRF, files, API and current APIs
        run: python -m unittest discover -s django/examples -p test_examples.py -v
      - name: Verify standard Django runner and migration consistency
        run: |
          python django/examples/manage.py test desk --settings=studyhub.testing
          python django/examples/manage.py makemigrations --check --dry-run --settings=studyhub.testing

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      SQL_COURSE_PG_DSN: postgresql://postgres:course@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:19.0
        env:
          POSTGRES_PASSWORD: course
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up SQL course runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: sql/examples/requirements-lock.txt
      - name: Install locked database clients
        run: python -m pip install -r sql/examples/requirements-lock.txt
      - name: Verify real SQL, DataHarbor recovery, DAG and warehouse
        run: python -m unittest discover -s sql/examples -p test_examples.py -v
      - name: Verify actual PostgreSQL 19 isolation, RLS and current syntax
        run: python sql/examples/postgres_lab.py

  multimodal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up supported current-patch document runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: multimodal/examples/requirements-lock.txt
      - name: Install pinned PDF, OCR and contract stack
        run: python -m pip install -r multimodal/examples/requirements-lock.txt
      - name: Verify actual PDF, bundled CPU OCR, evidence and recovery offline
        run: python -m unittest discover -s multimodal/examples -p test_examples.py -v

  fastapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up current stable FastAPI runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: fastapi/examples/requirements-lock.txt
      - name: Install locked ASGI, database and test clients
        run: python -m pip install -r fastapi/examples/requirements-lock.txt
      - name: Verify real ASGI, SQL, auth, jobs, SSE and loopback worker
        run: python -m unittest discover -s fastapi/examples -p test_examples.py -v

  deploy:
    needs: [build, statistics, mcp, search, economics, nutrition, exercise_science, metabolic_health, mental_health, ergonomics, image_recognition, transformer, finetuning, django, sql, multimodal, fastapi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
