name: Build and deploy Learning Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/requirements-ci.txt
            tools/requirements.txt
            langgraph/examples/requirements.txt
            pytorch/examples/requirements.txt
            machine-learning/examples/requirements.txt
            deep-learning/examples/requirements.txt

      - name: Install build and test dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      - name: Install pinned latest-stable PyTorch CPU course baselines
        run: python -m pip install -r pytorch/examples/requirements.txt -r deep-learning/examples/requirements.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned latest-stable machine learning course baseline
        run: python -m pip install -r machine-learning/examples/requirements.txt

      - name: Build course pages and downloads
        run: python tools/build.py

      - name: Validate pages, links, and offline fonts
        run: python tools/validate.py

      - name: Test LangGraph examples
        run: python -m pytest langgraph/examples/test_examples.py -q

      - name: Test LLM examples without real API requests
        run: python -m unittest discover -s llm/examples -p test_examples.py -v

      - name: Test RAG retrieval, permissions, citations, and offline examples
        run: python -m unittest discover -s rag/examples -p test_examples.py -v

      - name: Test embedding mathematics, learning, adapters, and offline examples
        run: python -m unittest discover -s embedding/examples -p test_examples.py -v

      - name: Test PyTorch CPU training, gradients, checkpoints, resume, and export
        run: python -m unittest discover -s pytorch/examples -p test_examples.py -v

      - name: Test machine learning pipelines, selection, calibration, clustering, and artifacts
        run: python -m unittest discover -s machine-learning/examples -p test_examples.py -v

      - name: Test deep learning gradients, architectures, generation, and complete projects
        run: python -m unittest discover -s deep-learning/examples -p test_examples.py -v

      - name: Prepare publishable website
        run: python tools/prepare_pages.py --target pages

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent Python for latest statistics baseline
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: applied-statistics/examples/requirements.txt

      - name: Install pinned latest-stable statistics course dependencies
        run: python -m pip install -r applied-statistics/examples/requirements.txt

      - name: Test statistics calculations, models, questionnaires, and report delivery
        run: python -m unittest discover -s applied-statistics/examples -p test_examples.py -v

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent Python for MCP SDK 2.3.0
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mcp/examples/requirements.txt
            mcp/examples/requirements-lock.txt

      - name: Install pinned MCP dependencies
        run: python -m pip install -r mcp/examples/requirements.txt

      - name: Test contracts, identity, transactions, stdio and loopback HTTP
        run: python -m unittest discover -s mcp/examples -p test_examples.py -v

  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent Python for search engine examples
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            search/examples/requirements.txt
            search/examples/requirements-lock.txt

      - name: Install pinned latest-stable search dependencies
        run: python -m pip install -r search/examples/requirements.txt

      - name: Test FTS5, Faiss, Qdrant Local, isolation, replay and restore
        run: python -m unittest discover -s search/examples -p test_examples.py -v

  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up verified latest stable economics runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test economic models, accounting, data vintages and report artifacts
        run: python -m unittest discover -s economics/examples -p test_examples.py -v

  nutrition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up verified latest stable nutrition runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test nutrition units, missing data, reference scope and offline reports
        run: python -m unittest discover -s nutrition/examples -p test_examples.py -v

  exercise_science:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable exercise runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test exercise arithmetic, missing records, model scope and reports
        run: python -m unittest discover -s exercise-science/examples -p test_examples.py -v

  metabolic_health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable metabolic-health runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test metabolic units, missing observations, model scope and reports
        run: python -m unittest discover -s metabolic-health/examples -p test_examples.py -v

  mental_health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable mental-health runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test original diary, missingness, timing, evidence and offline reports
        run: python -m unittest discover -s mental-health/examples -p test_examples.py -v

  ergonomics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up independent latest stable ergonomics runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"

      - name: Test task units, RNLE scope, missingness, vibration and reports
        run: python -m unittest discover -s ergonomics/examples -p test_examples.py -v

  deploy:
    needs: [build, statistics, mcp, search, economics, nutrition, exercise_science, metabolic_health, mental_health, ergonomics]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
