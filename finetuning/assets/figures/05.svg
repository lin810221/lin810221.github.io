<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">追蹤位移與assistant監督</title><desc id="desc">七個token的序列依次為角色、問題、結束、角色與答案；只監督assistant內容與其結束符。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">追蹤位移與assistant監督</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="70" y="230" width="140" height="70" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="140.0" y="273.0" font-size="23" fill="#89c9e8" text-anchor="middle">user</text><text x="140" y="355" font-size="22" fill="#89c9e8" text-anchor="middle">忽略</text><path d="M140 310L295 415" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="225" y="230" width="140" height="70" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="295.0" y="273.0" font-size="23" fill="#89c9e8" text-anchor="middle">classify</text><text x="295" y="355" font-size="22" fill="#89c9e8" text-anchor="middle">忽略</text><path d="M295 310L450 415" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="230" width="140" height="70" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="450.0" y="273.0" font-size="23" fill="#89c9e8" text-anchor="middle">red</text><text x="450" y="355" font-size="22" fill="#89c9e8" text-anchor="middle">忽略</text><path d="M450 310L605 415" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="230" width="140" height="70" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="605.0" y="273.0" font-size="23" fill="#89c9e8" text-anchor="middle">EOS</text><text x="605" y="355" font-size="22" fill="#89c9e8" text-anchor="middle">忽略</text><path d="M605 310L760 415" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="230" width="140" height="70" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="760.0" y="273.0" font-size="23" fill="#89c9e8" text-anchor="middle">assistant</text><text x="760" y="355" font-size="22" fill="#89c9e8" text-anchor="middle">忽略</text><path d="M760 310L915 415" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="845" y="230" width="140" height="70" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="915.0" y="273.0" font-size="23" fill="#b8e895" text-anchor="middle">warm</text><text x="915" y="355" font-size="22" fill="#b8e895" text-anchor="middle">監督</text><path d="M915 310L1070 415" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1000" y="230" width="140" height="70" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="1070.0" y="273.0" font-size="23" fill="#b8e895" text-anchor="middle">EOS</text><text x="1070" y="355" font-size="22" fill="#b8e895" text-anchor="middle">監督</text><text x="100" y="470" font-size="26" fill="#eebc79" text-anchor="start">位置 t 的logit，對應位置 t+1 的target</text><text x="100" y="530" font-size="24" fill="#a2b1a6" text-anchor="start">loss遮罩不會讓模型看不到user上下文</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">斜箭頭：下一個token的預測對應。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>