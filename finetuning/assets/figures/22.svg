<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">雲端微調工作與評估是兩條狀態線</title><desc id="desc">工作由驗證進入執行，成功只表示服務完成，尚需獨立評估才能部署。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">雲端微調工作與評估是兩條狀態線</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="90" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="205.0" y="338.0" font-size="23" fill="#b8e895" text-anchor="middle">驗證資料</text><path d="M320 330L365 330" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="485.0" y="338.0" font-size="23" fill="#89c9e8" text-anchor="middle">執行訓練</text><path d="M600 330L645 330" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="765.0" y="338.0" font-size="23" fill="#eebc79" text-anchor="middle">成功成品</text><path d="M880 330L925 330" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#ef9eaa" stroke-width="2"/><text x="1045.0" y="338.0" font-size="23" fill="#ef9eaa" text-anchor="middle">獨立評估</text><text x="120" y="490" font-size="24" fill="#eebc79" text-anchor="start">失敗／取消為終止狀態；重試需建立新的可追蹤工作</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">工作成功不等於模型品質合格。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>