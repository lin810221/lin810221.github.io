<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">偏好配對如何建立</title><desc id="desc">同一提示產生兩個候選，經明確標註規則比較；chosen名稱本身不證明內容正確。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">偏好配對如何建立</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="420" y="190" width="350" height="70" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="595.0" y="233.0" font-size="23" fill="#89c9e8" text-anchor="middle">同一提示與上下文</text><path d="M500 260L310 350" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 260L890 350" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="360" width="370" height="90" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="305.0" y="413.0" font-size="23" fill="#b8e895" text-anchor="middle">候選一：規則內較佳</text><rect x="710" y="360" width="370" height="90" rx="8" fill="#19231d" stroke="#ef9eaa" stroke-width="2"/><text x="895.0" y="413.0" font-size="23" fill="#ef9eaa" text-anchor="middle">候選二：規則內較差</text><text x="190" y="535" font-size="25" fill="#eebc79" text-anchor="start">保存來源、分歧、事實核對與配對方向</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">標註偏差會成為模型學習訊號。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>