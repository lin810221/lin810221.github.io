<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">DPO比較policy相對reference的偏好</title><desc id="desc">policy對chosen與rejected的序列log機率差為三，reference為一；差中之差乘beta得到目標logit。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">DPO比較policy相對reference的偏好</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><text x="180" y="240" font-size="23" fill="#e5e9e2" text-anchor="start">policy偏好差</text><rect x="410" y="215" width="450" height="35" fill="#b8e895"/><text x="875" y="240" font-size="22" fill="#e5e9e2" text-anchor="start">3</text><text x="180" y="325" font-size="23" fill="#e5e9e2" text-anchor="start">reference偏好差</text><rect x="410" y="300" width="150" height="35" fill="#89c9e8"/><text x="575" y="325" font-size="22" fill="#e5e9e2" text-anchor="start">1</text><text x="180" y="465" font-size="27" fill="#89c9e8" text-anchor="start">差中之差 = 2；beta = 0.2</text><text x="180" y="530" font-size="28" fill="#b8e895" text-anchor="start">DPO logit = 0.4；loss 約0.513</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">不是只把chosen的機率提高就完整定義DPO。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>