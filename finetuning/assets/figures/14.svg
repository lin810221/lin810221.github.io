<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">可續訓checkpoint與部署成品</title><desc id="desc">完整續訓狀態包含模型最佳化器排程器隨機狀態與資料位置，部署成品只提供推論所需內容。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">可續訓checkpoint與部署成品</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="120" y="215" width="440" height="300" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="340.0" y="373.0" font-size="23" fill="#89c9e8" text-anchor="middle">完整續訓狀態</text><rect x="650" y="215" width="440" height="300" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="870.0" y="373.0" font-size="23" fill="#b8e895" text-anchor="middle">部署：模型與tokenizer</text><text x="150" y="565" font-size="24" fill="#eebc79" text-anchor="start">optimizer、scheduler、RNG、資料位置需另存</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">兩種成品用途不同；adapter不等於完整續訓狀態。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>