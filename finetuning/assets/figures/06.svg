<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">EOS、截斷與packing邊界</title><desc id="desc">兩份文件以EOS串接，後段仍可注意前段；截斷可能移除回答，PAD不應納入監督。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">EOS、截斷與packing邊界</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="100" y="210" width="390" height="90" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="295.0" y="263.0" font-size="23" fill="#89c9e8" text-anchor="middle">文件 A → EOS</text><rect x="650" y="210" width="450" height="90" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="875.0" y="263.0" font-size="23" fill="#b8e895" text-anchor="middle">文件 B → EOS → PAD</text><path d="M490 255L645 255" fill="none" stroke="#ef9eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="150" y="365" font-size="25" fill="#ef9eaa" text-anchor="start">串接後：B仍可注意A；EOS不會形成隔離遮罩</text><path d="M600 390L600 535" fill="none" stroke="#eebc79" stroke-width="2"/><text x="130" y="450" font-size="24" fill="#eebc79" text-anchor="start">截斷在邊界之前</text><text x="130" y="500" font-size="24" fill="#eebc79" text-anchor="start">可能只剩提示，沒有回答</text><text x="700" y="450" font-size="24" fill="#b8e895" text-anchor="start">有效EOS可監督</text><text x="700" y="500" font-size="24" fill="#b8e895" text-anchor="start">PAD不進loss分母</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">紅箭頭：B能讀取前面的A；真正隔離需支援區塊遮罩。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>