<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">資料切分的單位是群組</title><desc id="desc">群組A與B全部放入訓練，群組C保留；群組隔離之外仍檢查複製內容。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">資料切分的單位是群組</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="110" y="210" width="240" height="75" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="230.0" y="255.5" font-size="23" fill="#b8e895" text-anchor="middle">群組 A</text><path d="M350 248L650 248" fill="none" stroke="#b8e895" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="210" width="360" height="75" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="850.0" y="255.5" font-size="23" fill="#b8e895" text-anchor="middle">訓練集</text><rect x="110" y="320" width="240" height="75" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="230.0" y="365.5" font-size="23" fill="#89c9e8" text-anchor="middle">群組 B</text><path d="M350 358L650 358" fill="none" stroke="#89c9e8" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="320" width="360" height="75" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="850.0" y="365.5" font-size="23" fill="#89c9e8" text-anchor="middle">訓練集</text><rect x="110" y="430" width="240" height="75" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="230.0" y="475.5" font-size="23" fill="#eebc79" text-anchor="middle">群組 C</text><path d="M350 468L650 468" fill="none" stroke="#eebc79" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="430" width="360" height="75" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="850.0" y="475.5" font-size="23" fill="#eebc79" text-anchor="middle">最終保留集</text><text x="110" y="575" font-size="24" fill="#ef9eaa" text-anchor="start">同群組整組分配；跨群組還需檢查內容重複</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">不同ID不等於資訊獨立。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>