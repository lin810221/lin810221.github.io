<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">先找問題，再選適應方法</title><desc id="desc">左側為資料更新與檢索，右側為穩定行為與微調，兩者都指向共同評估。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">先找問題，再選適應方法</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><text x="180" y="205" font-size="26" fill="#89c9e8" text-anchor="start">外部資訊經常改變</text><text x="730" y="205" font-size="26" fill="#b8e895" text-anchor="start">行為規則長期穩定</text><rect x="120" y="260" width="400" height="110" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="320.0" y="323.0" font-size="23" fill="#89c9e8" text-anchor="middle">RAG：提供有版本證據</text><rect x="680" y="260" width="400" height="110" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="880.0" y="323.0" font-size="23" fill="#b8e895" text-anchor="middle">微調：更新模型權重</text><rect x="400" y="460" width="400" height="90" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="600.0" y="513.0" font-size="23" fill="#eebc79" text-anchor="middle">共同驗收：品質與錯誤切片</text><path d="M320 370L500 455" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M880 370L700 455" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">方法可組合；資訊更新與權重更新需要各自的版本。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>