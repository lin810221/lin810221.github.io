<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">不同適應方法需要不同資料</title><desc id="desc">持續預訓練使用領域文字，SFT使用示範，蒸餾使用教師訊號；三者目標不能直接互換。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">不同適應方法需要不同資料</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="120" y="205" width="340" height="80" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="290.0" y="253.0" font-size="23" fill="#89c9e8" text-anchor="middle">領域純文字</text><path d="M460 245L700 245" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="720" y="205" width="350" height="80" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="895.0" y="253.0" font-size="23" fill="#89c9e8" text-anchor="middle">持續預訓練</text><rect x="120" y="325" width="340" height="80" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="290.0" y="373.0" font-size="23" fill="#b8e895" text-anchor="middle">正確示範回答</text><path d="M460 365L700 365" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="720" y="325" width="350" height="80" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="895.0" y="373.0" font-size="23" fill="#b8e895" text-anchor="middle">SFT</text><rect x="120" y="445" width="340" height="80" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="290.0" y="493.0" font-size="23" fill="#eebc79" text-anchor="middle">教師軟分布</text><path d="M460 485L700 485" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="720" y="445" width="350" height="80" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="895.0" y="493.0" font-size="23" fill="#eebc79" text-anchor="middle">蒸餾</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">資料可組合，仍需分別定義損失與評估。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>