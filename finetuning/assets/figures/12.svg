<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">QLoRA記憶體不能只算權重</title><desc id="desc">堆疊前的四種獨立成本包括量化基底、adapter與最佳化器、activation暫存及量化metadata。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">QLoRA記憶體不能只算權重</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><text x="180" y="240" font-size="23" fill="#e5e9e2" text-anchor="start">四位元基底</text><rect x="410" y="215" width="455" height="35" fill="#b8e895"/><text x="880" y="240" font-size="22" fill="#e5e9e2" text-anchor="start">65</text><text x="180" y="325" font-size="23" fill="#e5e9e2" text-anchor="start">FP32 adapter狀態</text><rect x="410" y="300" width="84" height="35" fill="#89c9e8"/><text x="509" y="325" font-size="22" fill="#e5e9e2" text-anchor="start">12</text><text x="180" y="410" font-size="23" fill="#e5e9e2" text-anchor="start">activation與暫存</text><rect x="410" y="385" width="245" height="35" fill="#eebc79"/><text x="670" y="410" font-size="22" fill="#e5e9e2" text-anchor="start">35</text><text x="180" y="495" font-size="23" fill="#e5e9e2" text-anchor="start">量化metadata</text><rect x="410" y="470" width="56" height="35" fill="#ef9eaa"/><text x="481" y="495" font-size="22" fill="#e5e9e2" text-anchor="start">8</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">條長為示意，沒有真實容量或固定比例的意義。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>