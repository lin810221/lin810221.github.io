<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">偏好訓練中的兩個模型角色</title><desc id="desc">policy與固定reference對相同chosen及rejected配對評分，reference不接收梯度更新。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">偏好訓練中的兩個模型角色</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="120" y="240" width="350" height="100" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="295.0" y="298.0" font-size="23" fill="#b8e895" text-anchor="middle">Policy：可更新</text><rect x="730" y="240" width="350" height="100" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="905.0" y="298.0" font-size="23" fill="#89c9e8" text-anchor="middle">Reference：固定</text><path d="M470 290L565 440" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 290L635 440" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="450" width="400" height="90" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="600.0" y="503.0" font-size="23" fill="#eebc79" text-anchor="middle">同一配對，計算相對分數</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">reference可預先計分，但來源與版本仍須固定。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>