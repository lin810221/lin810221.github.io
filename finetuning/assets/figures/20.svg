<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">總分可以掩蓋重要切片</title><desc id="desc">虛構評估表中總成功率高於少數類別與長輸入切片；各切片可重疊，須另報樣本數。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">總分可以掩蓋重要切片</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><text x="180" y="240" font-size="23" fill="#e5e9e2" text-anchor="start">全部案例</text><rect x="410" y="215" width="528" height="35" fill="#b8e895"/><text x="953" y="240" font-size="22" fill="#e5e9e2" text-anchor="start">88</text><text x="180" y="325" font-size="23" fill="#e5e9e2" text-anchor="start">少數類別</text><rect x="410" y="300" width="252" height="35" fill="#89c9e8"/><text x="677" y="325" font-size="22" fill="#e5e9e2" text-anchor="start">42</text><text x="180" y="410" font-size="23" fill="#e5e9e2" text-anchor="start">長輸入</text><rect x="410" y="385" width="366" height="35" fill="#eebc79"/><text x="791" y="410" font-size="22" fill="#e5e9e2" text-anchor="start">61</text><text x="180" y="495" font-size="23" fill="#e5e9e2" text-anchor="start">資訊不足</text><rect x="410" y="470" width="330" height="35" fill="#ef9eaa"/><text x="755" y="495" font-size="22" fill="#e5e9e2" text-anchor="start">55</text><text x="180" y="585" font-size="23" fill="#eebc79" text-anchor="start">虛構成功率%；每列另報分母與錯誤類型</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">數字是教學案例；不是任何模型測試結果。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>