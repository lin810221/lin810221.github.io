<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">排錯先分層，再找最小反例</title><desc id="desc">由失敗現象分到資料模板、梯度資源或評估成品，縮成最小實驗再判定原因。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">排錯先分層，再找最小反例</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="420" y="180" width="360" height="80" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="600.0" y="228.0" font-size="23" fill="#b8e895" text-anchor="middle">失敗發生在哪一層？</text><path d="M600 260L250 380" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="390" width="340" height="90" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="250.0" y="443.0" font-size="23" fill="#89c9e8" text-anchor="middle">資料與模板</text><path d="M600 260L640 380" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="390" width="340" height="90" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="640.0" y="443.0" font-size="23" fill="#eebc79" text-anchor="middle">梯度與資源</text><path d="M600 260L1030 380" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="390" width="340" height="90" rx="8" fill="#19231d" stroke="#ef9eaa" stroke-width="2"/><text x="1030.0" y="443.0" font-size="23" fill="#ef9eaa" text-anchor="middle">評估與成品</text><text x="150" y="560" font-size="26" fill="#b8e895" text-anchor="start">先縮成單樣本／單步，再保存可重現證據</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">能重現的錯誤比猜測超參數更能縮短排錯時間。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>