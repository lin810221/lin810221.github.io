<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">碼本的間距可以不同</title><desc id="desc">上列均勻碼本等距，下列非均勻碼本在中心較密；下列僅示意，不是完整NF4常數表。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">碼本的間距可以不同</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><text x="180" y="220" font-size="27" fill="#89c9e8" text-anchor="start">均勻量化：間隔固定</text><text x="180" y="390" font-size="27" fill="#b8e895" text-anchor="start">NF4：非均勻碼本</text><path d="M180 285L1020 285" fill="none" stroke="#a2b1a6" stroke-width="2"/><circle cx="210" cy="285" r="7" fill="#89c9e8"/><circle cx="307.5" cy="285" r="7" fill="#89c9e8"/><circle cx="405.0" cy="285" r="7" fill="#89c9e8"/><circle cx="502.5" cy="285" r="7" fill="#89c9e8"/><circle cx="600" cy="285" r="7" fill="#89c9e8"/><circle cx="697.5" cy="285" r="7" fill="#89c9e8"/><circle cx="795.0" cy="285" r="7" fill="#89c9e8"/><circle cx="892.5" cy="285" r="7" fill="#89c9e8"/><circle cx="990" cy="285" r="7" fill="#89c9e8"/><path d="M180 455L1020 455" fill="none" stroke="#a2b1a6" stroke-width="2"/><circle cx="210" cy="455" r="7" fill="#b8e895"/><circle cx="327.0" cy="455" r="7" fill="#b8e895"/><circle cx="424.5" cy="455" r="7" fill="#b8e895"/><circle cx="502.5" cy="455" r="7" fill="#b8e895"/><circle cx="561.0" cy="455" r="7" fill="#b8e895"/><circle cx="600" cy="455" r="7" fill="#b8e895"/><circle cx="639.0" cy="455" r="7" fill="#b8e895"/><circle cx="697.5" cy="455" r="7" fill="#b8e895"/><circle cx="775.5" cy="455" r="7" fill="#b8e895"/><circle cx="873.0" cy="455" r="7" fill="#b8e895"/><circle cx="990" cy="455" r="7" fill="#b8e895"/><text x="60" y="640" font-size="22" fi