<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">由機制驗收到任務驗收</title><desc id="desc">下層數值契約、中層獨立保留評估與上層部署任務檢查逐層支撐，任何一層不能被另一層取代。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">由機制驗收到任務驗收</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="170" y="220" width="850" height="85" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="595.0" y="270.5" font-size="23" fill="#eebc79" text-anchor="middle">部署任務、生成與人工複核</text><rect x="250" y="335" width="690" height="85" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="595.0" y="385.5" font-size="23" fill="#b8e895" text-anchor="middle">保留集與重要切片</text><rect x="340" y="450" width="510" height="85" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="595.0" y="500.5" font-size="23" fill="#89c9e8" text-anchor="middle">資料、遮罩與數值契約</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">圖層表示檢查範圍，寬度不代表樣本數。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>