<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">零初始化的第一步梯度</title><desc id="desc">B為零而A隨機時，初始輸出保持基底，A首步梯度為零，B通常可更新。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">零初始化的第一步梯度</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="110" y="220" width="340" height="90" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="280.0" y="273.0" font-size="23" fill="#89c9e8" text-anchor="middle">B = 0；A隨機</text><path d="M450 265L690 265" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="220" width="370" height="90" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="895.0" y="273.0" font-size="23" fill="#b8e895" text-anchor="middle">初始更新 BA = 0</text><rect x="110" y="420" width="340" height="90" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="280.0" y="473.0" font-size="23" fill="#eebc79" text-anchor="middle">A的首步梯度為零</text><rect x="710" y="420" width="370" height="90" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="895.0" y="473.0" font-size="23" fill="#b8e895" text-anchor="middle">B通常有首步梯度</text><path d="M280 310L280 410" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M880 310L880 410" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">不能把A首步零梯度直接判為凍結錯誤。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>