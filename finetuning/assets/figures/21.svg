<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Adapter交付的依賴關係</title><desc id="desc">精確基底與tokenizer共同決定adapter能否重現，manifest用身分與雜湊將其連結。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a2b1a6"/></marker></defs><rect width="1200" height="720" fill="#101612"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="60" y="78" font-size="32" fill="#b8e895" text-anchor="start">Adapter交付的依賴關係</text><text x="60" y="125" font-size="21" fill="#a2b1a6" text-anchor="start">原創教學示意 · 箭頭表示本圖標示的資訊或計算方向</text><rect x="90" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#b8e895" stroke-width="2"/><text x="205.0" y="338.0" font-size="23" fill="#b8e895" text-anchor="middle">基底revision</text><path d="M320 330L365 330" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#89c9e8" stroke-width="2"/><text x="485.0" y="338.0" font-size="23" fill="#89c9e8" text-anchor="middle">tokenizer模板</text><path d="M600 330L645 330" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#eebc79" stroke-width="2"/><text x="765.0" y="338.0" font-size="23" fill="#eebc79" text-anchor="middle">adapter設定</text><path d="M880 330L925 330" fill="none" stroke="#a2b1a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="280" width="230" height="100" rx="8" fill="#19231d" stroke="#ef9eaa" stroke-width="2"/><text x="1045.0" y="338.0" font-size="23" fill="#ef9eaa" text-anchor="middle">manifest核對</text><text x="130" y="490" font-size="25" fill="#89c9e8" text-anchor="start">保存 → 回讀 → 固定輸入logits比較 → 任務回歸</text><text x="60" y="640" font-size="22" fill="#eebc79" text-anchor="start">同一模型名稱不保證內容相同。</text><text x="60" y="685" font-size="20" fill="#a2b1a6" text-anchor="start">2026-11-25 · 非大型模型實測；形狀與距離不代表效能比例</text></g></svg>