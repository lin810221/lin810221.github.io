<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">相對成本與貿易的取捨</title><desc id="desc">比較利益看機會成本，不只看絕對生產力；總體收益與分配效果需要分開分析。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#89c9e8"/></marker></defs><rect width="1200" height="800" rx="20" fill="#101812"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="54" y="58" font-size="19" fill="#b8e895" text-anchor="start">ECONOMICS / 13</text><text x="54" y="115" font-size="34" fill="#e5e9e2" text-anchor="start">相對成本與貿易的取捨</text><text x="54" y="154" font-size="20" fill="#9aaf9f" text-anchor="start">原創概念圖 · 沿資料、控制與比較關係讀圖</text><text x="600" y="210" font-size="25" fill="#89c9e8" text-anchor="middle">每投入相同一單位資源的產量（算例）</text><text x="610" y="265" font-size="23" fill="#b8e895" text-anchor="middle">商品 X</text><text x="890" y="265" font-size="23" fill="#89c9e8" text-anchor="middle">商品 Y</text><rect x="165" y="300" width="240" height="75" rx="14" fill="#1b251f" stroke="#b8e895"/><text x="285.0" y="344.5" font-size="20" fill="#b8e895" text-anchor="middle">國家 A</text><rect x="490" y="300" width="240" height="75" rx="14" fill="#1b251f" stroke="#b8e895"/><text x="610.0" y="344.5" font-size="20" fill="#b8e895" text-anchor="middle">6</text><rect x="775" y="300" width="240" height="75" rx="14" fill="#1b251f" stroke="#89c9e8"/><text x="895.0" y="344.5" font-size="20" fill="#89c9e8" text-anchor="middle">3</text><rect x="165" y="400" width="240" height="75" rx="14" fill="#1b251f" stroke="#89c9e8"/><text x="285.0" y="444.5" font-size="20" fill="#89c9e8" text-anchor="middle">國家 B</text><rect x="490" y="400" width="240" height="75" rx="14" fill="#1b251f" stroke="#b8e895"/><text x="610.0" y="444.5" font-size="20" fill="#b8e895" text-anchor="middle">2</text><rect x="775" y="400" width="240" height="75" rx="14" fill="#1b251f" stroke="#89c9e8"/><text x="895.0" y="444.5" font-size="20" fill="#89c9e8" text-anchor="middle">2</text><text x="180" y="550" font-size="23" fill="#eebc79" text-anchor="start">A：1 X 的成本 = 0.5 Y；B：1 X 的成本 = 1 Y</text><text x="180" y="590" font-size="23" fill="#89c9e8" text-anchor="start">A 在 X 有比較利益；B 在 Y 有比較利益</text><path d="M54,620 L1146,620" stroke="#405448" stroke-width="2" fill="none"/><text x="60" y="668" font-size="23" fill="#b8e895" text-anchor="start">1. 比較利益看機會成本，不只看絕對生產力</text><text x="60" y="711" font-size="23" fill="#89c9e8" text-anchor="start">2. 總體收益與分配效果需要分開分析</text><text x="54" y="766" font-size="17" fill="#9aaf9f" text-anchor="start">Learning Notes · Visual review 2026-11-24</text></g></svg>