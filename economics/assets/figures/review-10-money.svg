<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">銀行資產負債與貨幣</title><desc id="desc">資產負債表需保持會計一致；不把簡單乘數算例當所有銀行實際行為。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#89c9e8"/></marker></defs><rect width="1200" height="800" rx="20" fill="#101812"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="54" y="58" font-size="19" fill="#b8e895" text-anchor="start">ECONOMICS / 10</text><text x="54" y="115" font-size="34" fill="#e5e9e2" text-anchor="start">銀行資產負債與貨幣</text><text x="54" y="154" font-size="20" fill="#9aaf9f" text-anchor="start">原創概念圖 · 沿資料、控制與比較關係讀圖</text><text x="340" y="225" font-size="28" fill="#b8e895" text-anchor="middle">資產</text><text x="850" y="225" font-size="28" fill="#89c9e8" text-anchor="middle">負債與權益</text><path d="M600,250 L600,530" stroke="#89c9e8" stroke-width="3" fill="none"/><path d="M140,250 L1080,250" stroke="#89c9e8" stroke-width="3" fill="none"/><rect x="190" y="285" width="340" height="75" rx="14" fill="#1b251f" stroke="#b8e895"/><text x="360.0" y="329.5" font-size="20" fill="#b8e895" text-anchor="middle">準備資產 20</text><rect x="190" y="385" width="340" height="110" rx="14" fill="#1b251f" stroke="#b8e895"/><text x="360.0" y="447.0" font-size="20" fill="#b8e895" text-anchor="middle">貸款 80</text><rect x="680" y="285" width="340" height="110" rx="14" fill="#1b251f" stroke="#89c9e8"/><text x="850.0" y="347.0" font-size="20" fill="#89c9e8" text-anchor="middle">存款負債 90</text><rect x="680" y="420" width="340" height="75" rx="14" fill="#1b251f" stroke="#eebc79"/><text x="850.0" y="464.5" font-size="20" fill="#eebc79" text-anchor="middle">權益 10</text><text x="600" y="580" font-size="24" fill="#eebc79" text-anchor="middle">資產 100 = 負債 90 + 權益 10（任意貨幣單位）</text><path d="M54,620 L1146,620" stroke="#405448" stroke-width="2" fill="none"/><text x="60" y="668" font-size="23" fill="#b8e895" text-anchor="start">1. 資產負債表需保持會計一致</text><text x="60" y="711" font-size="23" fill="#89c9e8" text-anchor="start">2. 不把簡單乘數算例當所有銀行實際行為</text><text x="54" y="766" font-size="17" fill="#9aaf9f" text-anchor="start">Learning Notes · Visual review 2026-11-24</text></g></svg>