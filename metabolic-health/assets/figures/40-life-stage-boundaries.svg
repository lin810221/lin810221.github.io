<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh40-title mh40-desc"><title id="mh40-title">生命階段與適用族群</title><desc id="mh40-desc">人物大小只為辨識情境，不是兒少、成人或長者的能力比例，界線不得直接外推。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 40  /  生命階段與適用族群</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="139" cy="176" rx="20" ry="20" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M139 205V318M96 245H182M139 318L109 385M139 318L169 385" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="433" font-size="20" fill="#9ac8e8" text-anchor="middle">兒少</text><ellipse cx="367" cy="176" rx="31" ry="31" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M367 216V318M324 245H410M367 318L337 385M367 318L397 385" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="367" y="433" font-size="20" fill="#9ac8e8" text-anchor="middle">成人</text><ellipse cx="629" cy="176" rx="28" ry="28" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M629 213V318M586 245H672M629 318L599 385M629 318L659 385" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="629" y="433" font-size="20" fill="#9ac8e8" text-anchor="middle">高齡／特殊情境</text><text x="90" y="117" font-size="18" fill="#e3e9e2" text-anchor="start">指南、定義與模型各有適用族群；不按圖中身高直接外推。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>