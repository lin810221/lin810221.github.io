<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh12-title mh12-desc"><title id="mh12-title">家用、連續與實驗室的不同介面</title><desc id="mh12-desc">裝置圖比較監測與確認的介面，未提供任何裝置讀值、診斷門檻或個人風險。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12  /  家用、連續與實驗室的不同介面</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="75" y="155" width="175" height="160" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="111" y="197" font-size="20" fill="#9ac8e8" text-anchor="start">家用血糖</text><path d="M106 245H218" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="349" y="156" width="143" height="153" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><ellipse cx="420" cy="239" rx="30" ry="30" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="387" y="195" font-size="20" fill="#ead68c" text-anchor="start">CGM</text><rect x="593" y="155" width="175" height="160" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="623" y="197" font-size="20" fill="#c1b2ea" text-anchor="start">實驗室</text><path d="M639 226V284H721V226" stroke="#c1b2ea" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="382" font-size="19" fill="#e3e9e2" text-anchor="start">不同檢體／感測介面與時間，不能把用途視為相同。</text><text x="90" y="428" font-size="19" fill="#e3e9e2" text-anchor="start">監測資訊、確認診斷與連續風險需要分開。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>