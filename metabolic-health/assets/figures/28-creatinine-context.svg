<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh28-title mh28-desc"><title id="mh28-title">肌酸酐：來源、血中濃度與腎臟處理</title><desc id="mh28-desc">示意分開生成來源與清除背景，血中濃度不是實測腎小球流量，也不單獨判慢性。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28  /  肌酸酐：來源、血中濃度與腎臟處理</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M170 184Q113 132 97 216Q100 301 170 278Q132 249 171 217Q191 197 170 184Z" stroke="#eda894" stroke-width="4" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 360H760" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M202 235L202 343" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.3 334.0L202 343L197.7 334.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="128" font-size="22" fill="#eda894" text-anchor="start">腎臟處理</text><ellipse cx="407" cy="234" rx="75" ry="44" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="407" y="240" font-size="21" fill="#ead68c" text-anchor="middle">肌肉等來源</text><path d="M408 283L408 343" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M412.3 334.0L408 343L403.7 334.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="547" y="213" font-size="24" fill="#9ac8e8" text-anchor="start">血中濃度</text><text x="547" y="255" font-size="20" fill="#e3e9e2" text-anchor="start">生成、清除與方法</text><text x="87" y="430" font-size="19" fill="#e3e9e2" text-anchor="start">肌酸酐是線索，不直接等於腎小球的實測流量。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>