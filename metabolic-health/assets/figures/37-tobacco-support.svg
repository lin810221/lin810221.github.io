<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh37-title mh37-desc"><title id="mh37-title">菸草暴露、依賴與照護支持</title><desc id="mh37-desc">符號表示暴露及支持需求，不以圖中色彩判個人風險，也不把反覆戒除視為道德失敗。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37  /  菸草暴露、依賴與照護支持</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M105 274H287M287 258V290M296 258V290" stroke="#ead68c" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M281 223Q251 187 283 154M311 231Q342 186 318 143" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M356 260L479 260" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M470.0 255.7L479 260L470.0 264.3" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="258" rx="112" ry="88" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="625" y="250" font-size="24" fill="#b7e89f" text-anchor="middle">暴露與依賴</text><text x="625" y="292" font-size="19" fill="#e3e9e2" text-anchor="middle">需要支持與照護</text><text x="96" y="413" font-size="18" fill="#e3e9e2" text-anchor="start">暴露、戒除及環境要一起看；反覆需要支持，不是道德評分。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>