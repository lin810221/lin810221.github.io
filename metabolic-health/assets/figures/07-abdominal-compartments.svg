<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh07-title mh07-desc"><title id="mh07-title">體表量測與腹部脂肪區室</title><desc id="mh07-desc">腹部橫斷示意區分皮下及內部區室，體表尺寸不能直接顯示脂肪位置或個人器官狀態。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 07  /  體表量測與腹部脂肪區室</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="294" cy="260" rx="166" ry="135" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="294" cy="260" rx="126" ry="97" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="294" cy="260" rx="79" ry="61" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M438 255L520 159" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="528" y="164" font-size="17" fill="#ead68c" text-anchor="start">皮下脂肪區室</text><path d="M352 252L520 249" stroke="#b7e89f" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="528" y="254" font-size="17" fill="#b7e89f" text-anchor="start">腹腔內部：內臟周圍</text><path d="M295 160L520 340" stroke="#9ac8e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="528" y="345" font-size="17" fill="#9ac8e8" text-anchor="start">體表尺寸不等於直接量脂肪</text><text x="83" y="435" font-size="18" fill="#e3e9e2" text-anchor="start">腹部橫斷概念，非比例；不從外觀估個人脂肪量。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>