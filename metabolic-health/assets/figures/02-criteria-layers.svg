<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh02-title mh02-desc"><title id="mh02-title">同一數字背後的不同用途</title><desc id="mh02-desc">定義、診斷、治療目標、服務資格與預測模型是不同頁面，不可因數字相似便互換。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02  /  同一數字背後的不同用途</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">定義與診斷</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">先看方法、確認與族群</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不是看到一個數字就確診</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">治療與目標</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">結合病史、風險與耐受</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不是通用的個人追求值</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">服務資格</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">制度的入口條件</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不等於照護已全部完成</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">模型與證據</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">終點、期限及適用範圍</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">相關與機制不等於已識別因果</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>