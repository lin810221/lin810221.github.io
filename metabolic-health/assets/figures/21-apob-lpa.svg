<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh21-title mh21-desc"><title id="mh21-title">粒子、apoB與Lp(a)的資訊層次</title><desc id="mh21-desc">蛋白與粒子的示意用於辨識資訊，不表示實際大小；Lp(a)質量與粒子濃度不可固定互換。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21  /  粒子、apoB與Lp(a)的資訊層次</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="225" cy="258" rx="82" ry="82" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="267" cy="190" rx="16" ry="16" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="225" y="392" font-size="22" fill="#9ac8e8" text-anchor="middle">apoB相關粒子</text><ellipse cx="620" cy="258" rx="82" ry="82" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="662" cy="190" rx="16" ry="16" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="620" y="392" font-size="22" fill="#9ac8e8" text-anchor="middle">Lp(a)示意</text><path d="M677 214Q733 152 750 220Q760 260 712 268" stroke="#c1b2ea" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="488" y="136" font-size="19" fill="#c1b2ea" text-anchor="start">附加apo(a)結構關係</text><text x="91" y="446" font-size="17" fill="#e3e9e2" text-anchor="start">粒子數代理、所載膽固醇量與Lp(a)質量／粒子單位不能互換。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>