<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh46-title mh46-desc"><title id="mh46-title">觀察、衍生值與來源狀態</title><desc id="mh46-desc">摘要保留未知欄位及時間，圖不做診斷；版本標示須區分正式、草案與未來生效。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 46  /  觀察、衍生值與來源狀態</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="68" y="119" width="718" height="308" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="94" y="158" font-size="23" fill="#9ac8e8" text-anchor="start">同一時間的觀察摘要（虛構）</text><text x="95" y="214" font-size="20" fill="#e3e9e2" text-anchor="start">血壓</text><path d="M275 205H640" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="676" y="214" font-size="18" fill="#b7e89f" text-anchor="start">已知</text><text x="95" y="265" font-size="20" fill="#e3e9e2" text-anchor="start">檢驗</text><path d="M275 256H640" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="676" y="265" font-size="18" fill="#b7e89f" text-anchor="start">已知</text><text x="95" y="316" font-size="20" fill="#e3e9e2" text-anchor="start">體位</text><path d="M275 307H640" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="676" y="316" font-size="18" fill="#b7e89f" text-anchor="start">已知</text><text x="95" y="367" font-size="20" fill="#e3e9e2" text-anchor="start">症狀背景</text><path d="M275 358H640" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="676" y="367" font-size="18" fill="#c1b2ea" text-anchor="start">?</text><text x="94" y="453" font-size="18" fill="#e3e9e2" text-anchor="start">缺漏單獨標示；圖表整理資訊，不把摘要變成診斷書。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>