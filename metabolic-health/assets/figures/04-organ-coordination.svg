<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh04-title mh04-desc"><title id="mh04-title">器官協作與負回饋</title><desc id="mh04-desc">肝、胰島、肌肉和腎以供應、感受、訊號及回應參與調節，功能關係圖不按器官位置排列，不表示直接管路。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 04  /  器官協作與負回饋</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="268" rx="127" ry="55" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="276" font-size="24" fill="#b7e89f" text-anchor="middle">受調節的變數</text><path d="M76 169Q148 119 236 170L212 216H78Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="248" font-size="20" fill="#ead68c" text-anchor="start">肝：供應與儲存</text><path d="M621 178Q701 137 786 177L760 207H634Z" stroke="#eda894" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="619" y="247" font-size="20" fill="#eda894" text-anchor="start">胰島：內分泌訊號</text><ellipse cx="159" cy="362" rx="85" ry="40" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="159" y="369" font-size="23" fill="#eda894" text-anchor="middle">肌肉</text><path d="M724 321Q665 285 651 358Q653 415 724 399Q694 370 727 350Z" stroke="#9ac8e8" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="731" y="381" font-size="22" fill="#9ac8e8" text-anchor="start">腎</text><path d="M250 191L326 235" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.4 226.7L326 235L316.0 234.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M539 237L612 192" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M602.1 193.0L612 192L606.6 200.4" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M614 269L552 275" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M561.4 278.5L552 275L560.5 269.8" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M306 293L243 339" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M252.8 337.2L243 339L247.7 330.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M645 350L549 301" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 309.0L549 301L559.0 301.2" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="264" y="165" font-size="17" fill="#ead68c" text-anchor="start">供應</text><text x="510" y="172" font-size="17" fill="#b7e89f" text-anchor="start">感受與訊號</text><text x="568" y="311" font-size="17" fill="#eda894" text-anchor="start">回應</text><text x="76" y="445" font-size="18" fill="#e3e9e2" text-anchor="start">功能關係圖，不按器官位置排列；負回饋是減少原偏離。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>