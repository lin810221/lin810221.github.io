<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh10-title mh10-desc"><title id="mh10-title">血糖：濃度單位與確認條件</title><desc id="mh10-desc">同一物質可用質量或物質量濃度表達，換算不取代檢體、時間與確認程序。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 10  /  血糖：濃度單位與確認條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="145" y="145" width="105" height="210" rx="13" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><rect x="152" y="237" width="91" height="110" rx="4" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="196" y="404" font-size="20" fill="#9ac8e8" text-anchor="middle">質量濃度</text><text x="196" y="438" font-size="20" fill="#9ac8e8" text-anchor="middle">mg/dL</text><rect x="555" y="145" width="105" height="210" rx="13" stroke="#ead68c" fill="#111a17" stroke-width="2"/><rect x="562" y="237" width="91" height="110" rx="4" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="606" y="404" font-size="20" fill="#ead68c" text-anchor="middle">物質量濃度</text><text x="606" y="438" font-size="20" fill="#ead68c" text-anchor="middle">mmol/L</text><path d="M310 240L495 240" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M486.0 235.7L495 240L486.0 244.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="306" y="305" font-size="19" fill="#e3e9e2" text-anchor="start">同一物質的換算</text><text x="288" y="347" font-size="18" fill="#e3e9e2" text-anchor="start">不能移用到所有檢驗</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>