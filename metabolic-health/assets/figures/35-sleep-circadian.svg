<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh35-title mh35-desc"><title id="mh35-title">睡眠與晝夜：時間之外還有品質</title><desc id="mh35-desc">時鐘代表節律與時間安排，不是睡眠分期或疾病診斷圖，也不給每人同一需求。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35  /  睡眠與晝夜：時間之外還有品質</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="245" cy="260" rx="117" ry="117" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M245 154V260L313 303" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="344.0" cy="260.0" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="330.7365149746594" cy="309.5" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="294.5" cy="345.7365149746594" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="245.0" cy="359.0" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="195.50000000000003" cy="345.7365149746594" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="159.26348502534057" cy="309.5" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="146.0" cy="260.0" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="159.26348502534057" cy="210.50000000000003" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="195.49999999999994" cy="174.26348502534057" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="244.99999999999997" cy="161.0" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="294.5" cy="174.26348502534057" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="330.73651497465937" cy="210.49999999999994" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="446" y="170" font-size="24" fill="#9ac8e8" text-anchor="start">時間、品質與規律</text><text x="446" y="235" font-size="21" fill="#ead68c" text-anchor="start">光照、輪班與行為</text><text x="446" y="300" font-size="21" fill="#c1b2ea" text-anchor="start">呼吸及其他睡眠問題</text><text x="91" y="436" font-size="18" fill="#e3e9e2" text-anchor="start">時鐘是節律比喻，不以單次裝置分數判睡眠疾病。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>