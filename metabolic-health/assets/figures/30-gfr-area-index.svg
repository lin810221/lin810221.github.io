<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh30-title mh30-desc"><title id="mh30-title">索引與去索引：改變的是分母</title><desc id="mh30-desc">面積方框不表示腎臟大小；換算只改表達，不能跨單位套CKD分層或自行配藥。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30  /  索引與去索引：改變的是分母</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="95" y="167" width="210" height="170" rx="0" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><rect x="495" y="137" width="270" height="220" rx="0" stroke="#ead68c" fill="#111a17" stroke-width="2"/><text x="200" y="254" font-size="21" fill="#9ac8e8" text-anchor="middle">標準面積索引</text><text x="630" y="254" font-size="21" fill="#ead68c" text-anchor="middle">個人體表面積</text><path d="M337 250L455 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M446.0 245.7L455 250L446.0 254.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="83" y="408" font-size="19" fill="#e3e9e2" text-anchor="start">換的是表達與面積分母，不是腎臟突然變大或變好。</text><text x="83" y="449" font-size="19" fill="#e3e9e2" text-anchor="start">不跨單位套分層，也不以此圖自行調整藥物。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>