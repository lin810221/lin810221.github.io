<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh43-title mh43-desc"><title id="mh43-title">篩檢四格：分母不一樣</title><desc id="mh43-desc">四格只表示結果分類，沒有真實檢驗效能或個人診斷；預測值還依族群基線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 43  /  篩檢四格：分母不一樣</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="97" y="119" font-size="20" fill="#e3e9e2" text-anchor="start">固定族群、固定方法下的虛構分類</text><rect x="95" y="173" width="300" height="88" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="245" y="226" font-size="24" fill="#b7e89f" text-anchor="middle">真陽性</text><rect x="435" y="173" width="300" height="88" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="585" y="226" font-size="24" fill="#ead68c" text-anchor="middle">偽陽性</text><rect x="95" y="295" width="300" height="88" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="245" y="348" font-size="24" fill="#c1b2ea" text-anchor="middle">偽陰性</text><rect x="435" y="295" width="300" height="88" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="585" y="348" font-size="24" fill="#9ac8e8" text-anchor="middle">真陰性</text><text x="95" y="441" font-size="18" fill="#e3e9e2" text-anchor="start">PPV看陽性者的分母；敏感度看有目標疾病者的分母。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>