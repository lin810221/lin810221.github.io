<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh34-title mh34-desc"><title id="mh34-title">肌肉活動、供應與代謝訊號</title><desc id="mh34-desc">肌肉圖強調主動工作與多系統供應，箭頭不等於固定耗能，也不提供個人運動處方。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34  /  肌肉活動、供應與代謝訊號</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="230" cy="259" rx="137" ry="73" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M93 259H63M367 259H401" stroke="#ead68c" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="151" y="269" font-size="24" fill="#eda894" text-anchor="start">活動肌肉</text><path d="M422 220L549 220" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540.0 215.7L549 220L540.0 224.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="225" font-size="21" fill="#9ac8e8" text-anchor="start">葡萄糖利用與供應</text><path d="M549 313L425 313" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M434.0 317.3L425 313L434.0 308.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="555" y="318" font-size="20" fill="#ead68c" text-anchor="start">神經、循環與代謝</text><text x="91" y="431" font-size="18" fill="#e3e9e2" text-anchor="start">身體活動不只熱量；肌力、久坐與功能需一起理解。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>