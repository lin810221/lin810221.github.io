<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh31-title mh31-desc"><title id="mh31-title">飲食型態與替代：先說保留什麼</title><desc id="mh31-desc">兩個餐盤只是組合示意，不表示固定比例或個人份量；替代需有清楚比較條件。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 31  /  飲食型態與替代：先說保留什麼</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="220" cy="254" rx="120" ry="120" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M220 135V373M220 254H337" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="419" font-size="22" fill="#b7e89f" text-anchor="middle">原本組合</text><ellipse cx="625" cy="254" rx="120" ry="120" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M625 135V373M625 254H742" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="625" y="419" font-size="22" fill="#9ac8e8" text-anchor="middle">替代後組合</text><path d="M359 254L480 254" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.0 249.7L480 254L471.0 258.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="81" y="119" font-size="20" fill="#e3e9e2" text-anchor="start">先說保留的功能與等能量等假設，再比較替代內容</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>