<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh03-title mh03-desc"><title id="mh03-title">一個數字要帶著時間與未知</title><desc id="mh03-desc">數字來自有時間、方法及缺漏的觀察，未知位置不是零，也不因學習路線完成便可自我確診。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 03  /  一個數字要帶著時間與未知</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 328H790" stroke="#809487" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="100.0" cy="240" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M100.0 252V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">時間1</text><ellipse cx="316.66666666666663" cy="240" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M316.66666666666663 252V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="316.66666666666663" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">時間2</text><rect x="518.3333333333333" y="248" width="30" height="65" rx="5" stroke="#c1b2ea" fill="#111a17" stroke-width="2"/><text x="533.3333333333333" y="289" font-size="24" fill="#c1b2ea" text-anchor="middle">?</text><text x="533.3333333333333" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">未記錄</text><ellipse cx="750.0" cy="240" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M750.0 252V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">時間4</text><text x="90" y="128" font-size="23" fill="#e3e9e2" text-anchor="start">單位＋方法＋時間：三者要同行</text><text x="93" y="424" font-size="18" fill="#e3e9e2" text-anchor="start">? = 沒有資料，不是0；同時保留需要專業回答的問題。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>