<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh33-title mh33-desc"><title id="mh33-title">飲食觀察、未知與可取得資源</title><desc id="mh33-desc">紀錄格與環境共同構成可行性，問號為缺漏而非不努力，圖不對個人飲食打健康分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 33  /  飲食觀察、未知與可取得資源</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="75" y="127" font-size="21" fill="#e3e9e2" text-anchor="start">虛構紀錄：已知、明確零與未知是三種狀態</text><rect x="85" y="190" width="95" height="104" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="132" y="252" font-size="22" fill="#9ac8e8" text-anchor="middle">觀察</text><rect x="203" y="190" width="95" height="104" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="250" y="252" font-size="22" fill="#9ac8e8" text-anchor="middle">明確0</text><rect x="321" y="190" width="95" height="104" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="368" y="252" font-size="22" fill="#c1b2ea" text-anchor="middle">?</text><rect x="439" y="190" width="95" height="104" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="486" y="252" font-size="22" fill="#9ac8e8" text-anchor="middle">觀察</text><rect x="557" y="190" width="95" height="104" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="604" y="252" font-size="22" fill="#c1b2ea" text-anchor="middle">?</text><rect x="675" y="190" width="95" height="104" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="722" y="252" font-size="22" fill="#9ac8e8" text-anchor="middle">觀察</text><text x="94" y="370" font-size="20" fill="#e3e9e2" text-anchor="start">飲食、預算與可取得食物共同影響可行性。</text><text x="94" y="423" font-size="20" fill="#e3e9e2" text-anchor="start">不知道的地方保留未知，不以圖表責備個人。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>