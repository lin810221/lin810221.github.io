<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh42-title mh42-desc"><title id="mh42-title">把病史、時間與問題帶進對話</title><desc id="mh42-desc">摘要是溝通工具，未知不填成沒有；常規回顧與急性問題需分開處理。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 42  /  把病史、時間與問題帶進對話</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="90" y="130" width="305" height="298" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="116" y="174" font-size="24" fill="#9ac8e8" text-anchor="start">照護摘要</text><path d="M115 221H368" stroke="#668171" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="207" font-size="19" fill="#e3e9e2" text-anchor="start">時間與病史</text><path d="M115 276H368" stroke="#668171" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="262" font-size="19" fill="#e3e9e2" text-anchor="start">藥物及相關條件</text><path d="M115 331H368" stroke="#668171" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="317" font-size="19" fill="#e3e9e2" text-anchor="start">觀察與檢驗</text><path d="M115 386H368" stroke="#668171" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="372" font-size="19" fill="#e3e9e2" text-anchor="start">不知道的地方</text><ellipse cx="615" cy="207" rx="42" ry="42" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M547 337Q615 264 683 337" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="489" y="397" font-size="22" fill="#b7e89f" text-anchor="start">帶問題共同討論</text><text x="93" y="456" font-size="17" fill="#e3e9e2" text-anchor="start">常規回顧與急性問題分開，不以網頁判個人緊急程度。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>