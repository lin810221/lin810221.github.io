<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh18-title mh18-desc"><title id="mh18-title">波動、重測與照護回顧</title><desc id="mh18-desc">相對高度為虛構觀察，無正常異常線；重測提供資訊，但不能單由走向選擇個人處方。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18  /  波動、重測與照護回顧</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 328H790" stroke="#809487" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="100.0" cy="170" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M100.0 182V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">初次</text><ellipse cx="316.66666666666663" cy="230" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M316.66666666666663 242V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="316.66666666666663" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">重測</text><ellipse cx="533.3333333333333" cy="190" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M533.3333333333333 202V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="533.3333333333333" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">回顧</text><ellipse cx="750.0" cy="250" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M750.0 262V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">追蹤</text><text x="110" y="128" font-size="21" fill="#e3e9e2" text-anchor="start">虛構相對讀值：不畫正常／異常門檻</text><text x="100" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">重測提供更多資訊，不能單靠走向決定病因或處方。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>