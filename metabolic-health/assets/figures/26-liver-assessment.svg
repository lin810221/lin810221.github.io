<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh26-title mh26-desc"><title id="mh26-title">線索、第一階段與進一步確認</title><desc id="mh26-desc">路徑只顯示評估分層的目的，不放個人門檻或把FIB-4算術畫成確診。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 26  /  線索、第一階段與進一步確認</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="118" width="220" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="59" y="147" font-size="19" fill="#b7e89f" text-anchor="start">採樣與背景</text><text x="59" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">年齡、方法、單位</text><path d="M275 156L299 156" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.0 151.7L299 156L290.0 160.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="118" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="324" y="147" font-size="19" fill="#9ac8e8" text-anchor="start">研究與臨床線索</text><text x="324" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">FIB-4用途限制</text><path d="M540 156L564 156" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 151.7L564 156L555.0 160.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="118" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="589" y="147" font-size="19" fill="#ead68c" text-anchor="start">第一階段評估</text><text x="589" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">適用條件先核對</text><path d="M685 203V236H155V260" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 253L155 268" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.3 259.0L155 268L150.7 259.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="273" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="59" y="302" font-size="19" fill="#c1b2ea" text-anchor="start">需要時進一步檢查</text><text x="59" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">不是每人同一路</text><path d="M275 311L299 311" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.0 306.7L299 311L290.0 315.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="273" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="324" y="302" font-size="19" fill="#eda894" text-anchor="start">整合結果</text><text x="324" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">其他病因與共病</text><path d="M540 311L564 311" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 306.7L564 311L555.0 315.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="273" width="220" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="589" y="302" font-size="19" fill="#b7e89f" text-anchor="start">照護討論</text><text x="589" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">不由網頁自訂追蹤</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>