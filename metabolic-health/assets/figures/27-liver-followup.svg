<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh27-title mh27-desc"><title id="mh27-title">肝臟照護的時間與共同風險</title><desc id="mh27-desc">多時點追蹤代表持續整合資訊，不保證指標單調改善，也不能從趨勢排除其他病因。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27  /  肝臟照護的時間與共同風險</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 328H790" stroke="#809487" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="100.0" cy="240" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M100.0 252V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">原始資料</text><ellipse cx="316.66666666666663" cy="240" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M316.66666666666663 252V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="316.66666666666663" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">共病回顧</text><ellipse cx="533.3333333333333" cy="240" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M533.3333333333333 252V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="533.3333333333333" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">選項討論</text><ellipse cx="750.0" cy="240" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M750.0 252V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">後續觀察</text><text x="83" y="124" font-size="22" fill="#e3e9e2" text-anchor="start">生活、共病及適用治療需一起討論</text><text x="93" y="426" font-size="18" fill="#e3e9e2" text-anchor="start">圓點只標時點，不代表數值走向；一次資料不決定全部。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>