<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh15-title mh15-desc"><title id="mh15-title">家庭、資源與持續回顧</title><desc id="mh15-desc">參與者與家庭、照護資源之間雙向溝通，重新開始是計畫調整的一部分，圖不評個人是否成功。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15  /  家庭、資源與持續回顧</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="145" cy="204" rx="31" ry="34" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M90 329Q145 251 200 329" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="383" font-size="22" fill="#9ac8e8" text-anchor="middle">家庭與同伴</text><ellipse cx="430" cy="204" rx="31" ry="34" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M375 329Q430 251 485 329" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="383" font-size="22" fill="#b7e89f" text-anchor="middle">參與者</text><ellipse cx="715" cy="204" rx="31" ry="34" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M660 329Q715 251 770 329" stroke="#ead68c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="715" y="383" font-size="22" fill="#ead68c" text-anchor="middle">照護與資源</text><path d="M221 256L345 256" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M336.0 251.7L345 256L336.0 260.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 292L221 292" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M230.0 296.3L221 292L230.0 287.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M517 256L636 256" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M627.0 251.7L636 256L627.0 260.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M636 292L517 292" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M526.0 296.3L517 292L526.0 287.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="130" font-size="22" fill="#e3e9e2" text-anchor="start">可持續支持，需要彼此回報與可取得的協助</text><text x="114" y="448" font-size="19" fill="#e3e9e2" text-anchor="start">中斷、回顧與重新安排都能在對話中被處理。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>