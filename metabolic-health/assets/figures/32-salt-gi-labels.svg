<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh32-title mh32-desc"><title id="mh32-title">標示分母與整餐背景</title><desc id="mh32-desc">標示表格與餐食是兩個尺度，鈉和食鹽單位不同，GI也不能單獨評整餐或預測個人血糖。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32  /  標示分母與整餐背景</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="75" y="126" width="305" height="278" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="95" y="164" font-size="21" fill="#9ac8e8" text-anchor="start">每份／每包／每100</text><path d="M95 185H355M95 245H355M95 305H355" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="99" y="225" font-size="20" fill="#e3e9e2" text-anchor="start">鈉 mg</text><text x="99" y="285" font-size="20" fill="#e3e9e2" text-anchor="start">食鹽 g</text><text x="99" y="345" font-size="19" fill="#e3e9e2" text-anchor="start">不是同一物質單位</text><ellipse cx="600" cy="253" rx="119" ry="101" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="600" y="225" font-size="24" fill="#b7e89f" text-anchor="middle">整體餐食</text><text x="600" y="274" font-size="19" fill="#e3e9e2" text-anchor="middle">纖維、糖、來源</text><text x="600" y="312" font-size="19" fill="#e3e9e2" text-anchor="middle">不只GI一個數</text><text x="91" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">分母與定義先對齊；圖不提供個人鹽量或血糖預測。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>