<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh06-title mh06-desc"><title id="mh06-title">脂肪組織與心腎代謝的互相連結</title><desc id="mh06-desc">CKM以心、腎、代謝及共同條件理解，雙向箭頭表示互動，不表示每人都依相同順序發病。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 06  /  脂肪組織與心腎代謝的互相連結</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="425" cy="164" rx="83" ry="49" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="425" y="171" font-size="25" fill="#eda894" text-anchor="middle">心臟</text><ellipse cx="190" cy="354" rx="83" ry="49" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="190" y="361" font-size="25" fill="#9ac8e8" text-anchor="middle">腎臟</text><ellipse cx="665" cy="354" rx="83" ry="49" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="665" y="361" font-size="25" fill="#ead68c" text-anchor="middle">代謝</text><path d="M347 195L234 300" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M243.6 297.1L234 300L237.6 290.7" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 317L365 212" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.4 214.9L365 212L361.3 221.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M504 194L623 301" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M619.2 291.7L623 301L613.4 298.2" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M605 322L484 213" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M487.8 222.3L484 213L493.6 215.8" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M282 350L568 350" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M559.0 345.7L568 350L559.0 354.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M566 374L283 374" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M292.0 378.3L283 374L292.0 369.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="441" font-size="19" fill="#e3e9e2" text-anchor="start">連結代表生理與照護互動，不是三個獨立紅字。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>