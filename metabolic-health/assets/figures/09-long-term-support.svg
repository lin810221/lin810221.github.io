<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh09-title mh09-desc"><title id="mh09-title">維持與重新調整的支持環</title><desc id="mh09-desc">環狀支持圖強調資源和反覆回顧，不畫保證下降的體重曲線，也不把框架分類當個人責備。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09  /  維持與重新調整的支持環</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="420" cy="270" rx="150" ry="105" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="420" y="272" font-size="26" fill="#b7e89f" text-anchor="middle">持續支持</text><text x="130" y="160" font-size="21" fill="#9ac8e8" text-anchor="middle">資源</text><text x="670" y="160" font-size="21" fill="#ead68c" text-anchor="middle">回顧</text><text x="130" y="365" font-size="21" fill="#c1b2ea" text-anchor="middle">可行調整</text><text x="670" y="365" font-size="21" fill="#eda894" text-anchor="middle">重新開始</text><path d="M180 174L276 228" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.3 219.8L276 228L266.0 227.4" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M565 228L644 180" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.0 181.0L644 180L638.6 188.4" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M636 345L566 307" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M571.8 315.1L566 307L576.0 307.5" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 309L185 348" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M195.0 348.2L185 348L191.4 340.3" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="146" y="442" font-size="19" fill="#e3e9e2" text-anchor="start">軌跡因人而異，不畫保證下降的體重曲線。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>