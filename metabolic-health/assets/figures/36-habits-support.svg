<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh36-title mh36-desc"><title id="mh36-title">壓力、習慣與支持一起規劃</title><desc id="mh36-desc">多面向連線表示彼此關聯與資源限制，不宣告單一心理狀態必然造成代謝病。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36  /  壓力、習慣與支持一起規劃</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="260" rx="101" ry="65" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="269" font-size="25" fill="#b7e89f" text-anchor="middle">可行計畫</text><text x="135" y="162" font-size="21" fill="#9ac8e8" text-anchor="middle">需求與壓力</text><path d="M230 162L330 235" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="162" font-size="21" fill="#ead68c" text-anchor="middle">飲食與活動</text><path d="M595 162L530 235" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="372" font-size="21" fill="#c1b2ea" text-anchor="middle">環境與資源</text><path d="M230 372L330 287" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="372" font-size="21" fill="#eda894" text-anchor="middle">睡眠與支持</text><path d="M595 372L530 287" stroke="#eda894" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">連線表示相互關聯，不把責任全部歸給一個人的意志。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>