<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh47-title mh47-desc"><title id="mh47-title">資料表、圖與來源應能互相核對</title><desc id="mh47-desc">三種產物代表資料、視覺與說明，並不表示可重現就已證明臨床真實、因果或個人診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 47  /  資料表、圖與來源應能互相核對</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="70" y="143" width="215" height="229" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="177" y="185" font-size="23" fill="#9ac8e8" text-anchor="middle">資料表</text><path d="M95 217H258" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 255H258" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 293H258" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M144 213V337" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M203 213V337" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="143" width="215" height="229" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="442" y="185" font-size="23" fill="#b7e89f" text-anchor="middle">示意圖</text><path d="M365 332V224M365 332H520" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 309L415 279 450 296 505 244" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="143" width="215" height="229" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="707" y="185" font-size="23" fill="#ead68c" text-anchor="middle">來源摘要</text><text x="627" y="235" font-size="19" fill="#e3e9e2" text-anchor="start">單位、版本</text><text x="627" y="284" font-size="19" fill="#e3e9e2" text-anchor="start">完整與未知</text><text x="627" y="333" font-size="19" fill="#e3e9e2" text-anchor="start">資料來源</text><text x="90" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">可重現表示檔案與算術可核對，不證明臨床真實性或因果。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>