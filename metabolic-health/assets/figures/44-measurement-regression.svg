<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh44-title mh44-desc"><title id="mh44-title">變異、跨線與平均回歸</title><desc id="mh44-desc">相對高度及虛線為假想比較，不是臨床門檻，也不代表第二次較接近一般值必有介入效果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 44  /  變異、跨線與平均回歸</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 328H790" stroke="#809487" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="100.0" cy="170" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M100.0 182V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">第一次</text><ellipse cx="316.66666666666663" cy="228" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M316.66666666666663 240V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="316.66666666666663" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">第二次</text><ellipse cx="533.3333333333333" cy="198" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M533.3333333333333 210V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="533.3333333333333" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">第三次</text><ellipse cx="750.0" cy="245" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M750.0 257V327" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="750.0" y="363" font-size="17" fill="#e3e9e2" text-anchor="middle">第四次</text><path d="M75 238H782" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="95" y="122" font-size="21" fill="#ead68c" text-anchor="start">虛構觀察起伏；虛線只作比較參考</text><text x="91" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">重測較接近一般值可含平均回歸，未必是介入造成。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>