<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh19-title mh19-desc"><title id="mh19-title">脂蛋白粒子與動脈壁</title><desc id="mh19-desc">左側粒子與右側動脈壁示意不同尺度；斑塊是壁內過程，不是油脂把管腔簡單塗滿。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19  /  脂蛋白粒子與動脈壁</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="240" cy="254" rx="105" ry="105" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="240" cy="254" rx="71" ry="71" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="188" y="260" font-size="20" fill="#ead68c" text-anchor="start">脂質核心</text><ellipse cx="345.0" cy="254.0" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="330.93266739736606" cy="306.5" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="292.5" cy="344.93266739736606" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="240.0" cy="359.0" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="187.50000000000003" cy="344.93266739736606" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="149.06733260263394" cy="306.5" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="135.0" cy="254.0" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="149.06733260263394" cy="201.50000000000003" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="187.49999999999994" cy="163.06733260263394" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="239.99999999999997" cy="149.0" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="292.5" cy="163.06733260263394" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="330.932667397366" cy="201.49999999999994" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="600" cy="254" rx="157" ry="124" stroke="#eda894" fill="#332922" stroke-width="3"/><ellipse cx="630" cy="254" rx="105" ry="82" stroke="#9ac8e8" fill="#111a17" stroke-width="3"/><path d="M480 185Q443 254 480 328Q554 300 544 254Q554 209 480 185Z" stroke="#ead68c" stroke-width="3" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><path d="M352 254L434 254" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M425.0 249.7L434 254L425.0 258.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="439" y="119" font-size="18" fill="#eda894" text-anchor="start">動脈橫斷：壁內病變影響管腔</text><text x="451" y="411" font-size="18" fill="#e3e9e2" text-anchor="start">粒子、膽固醇量與血管結果不同</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>