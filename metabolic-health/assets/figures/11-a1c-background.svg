<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh11-title mh11-desc"><title id="mh11-title">紅血球、糖化與HbA1c背景</title><desc id="mh11-desc">紅血球與血紅素糖化提供一段時間的訊息，壽命、變異及方法會影響；圖不畫固定個人平均血糖。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11  /  紅血球、糖化與HbA1c背景</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="265" cy="264" rx="143" ry="92" stroke="#eda894" fill="#17251e" stroke-width="3"/><ellipse cx="265" cy="264" rx="66" ry="34" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="205" y="269" font-size="20" fill="#eda894" text-anchor="start">血紅素</text><ellipse cx="119" cy="217" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="385" cy="241" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="179" cy="337" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M382 244L490 161" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="166" font-size="17" fill="#ead68c" text-anchor="start">糖化相關訊息</text><text x="490" y="238" font-size="20" fill="#e3e9e2" text-anchor="start">血糖暴露、紅血球周轉</text><text x="490" y="285" font-size="20" fill="#e3e9e2" text-anchor="start">與檢驗方法共同影響</text><text x="86" y="421" font-size="17" fill="#e3e9e2" text-anchor="start">HbA1c不是單次指尖血糖換一個單位；中央淡區不是孔洞。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>