<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh14-title mh14-desc"><title id="mh14-title">結構化介入與適合條件下的選項</title><desc id="mh14-desc">並列路徑表示支持可組合，並非生活方式和藥物互相排斥，也不表示每人的效果順序。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14  /  結構化介入與適合條件下的選項</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="70" y="128" font-size="22" fill="#b7e89f" text-anchor="start">共同目標：適用、可持續的預防</text><path d="M100 260Q260 150 420 260T740 260" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 320Q260 425 420 320T740 320" stroke="#ead68c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="199" font-size="20" fill="#9ac8e8" text-anchor="start">結構化生活介入</text><text x="447" y="404" font-size="20" fill="#ead68c" text-anchor="start">適合條件下的藥物選項</text><text x="95" y="449" font-size="18" fill="#e3e9e2" text-anchor="start">路徑可並行；圖不排序個人療效，也不提供用藥處方。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>