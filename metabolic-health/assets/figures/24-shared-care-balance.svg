<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh24-title mh24-desc"><title id="mh24-title">共同決策：效益、負擔與背景</title><desc id="mh24-desc">天平用於提醒需要一起討論的面向，不表示存在可相加的個人醫療總分。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 24  /  共同決策：效益、負擔與背景</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M430 180V376M325 395H535" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 216H660" stroke="#ead68c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 220L185 322H295ZM620 220L565 322H675Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="137" y="371" font-size="20" fill="#9ac8e8" text-anchor="start">效益與不確定</text><text x="539" y="371" font-size="20" fill="#c1b2ea" text-anchor="start">負擔、偏好與資源</text><text x="222" y="132" font-size="21" fill="#e3e9e2" text-anchor="start">共同決策不是單一紅字的自動判決</text><text x="130" y="445" font-size="18" fill="#e3e9e2" text-anchor="start">初次與再次事件背景不同；圖不代替個人照護選擇。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>