<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh25-title mh25-desc"><title id="mh25-title">肝內脂質與纖維化不是同義詞</title><desc id="mh25-desc">肝臟、肝細胞與細胞外基質在不同尺度；示意不按真實比例，也不供個人分期。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 25  /  肝內脂質與纖維化不是同義詞</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M88 185Q192 117 348 185L311 281H91Z" stroke="#ead68c" stroke-width="4" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="157" y="225" font-size="27" fill="#ead68c" text-anchor="start">肝臟</text><ellipse cx="495" cy="210" rx="45" ry="49" stroke="#eda894" fill="#17251e" stroke-width="3"/><ellipse cx="488" cy="204" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="615" cy="210" rx="45" ry="49" stroke="#eda894" fill="#17251e" stroke-width="3"/><ellipse cx="608" cy="204" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="735" cy="210" rx="45" ry="49" stroke="#eda894" fill="#17251e" stroke-width="3"/><ellipse cx="728" cy="204" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M447 296Q555 254 655 305T795 298" stroke="#c1b2ea" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="461" y="355" font-size="20" fill="#ead68c" text-anchor="start">細胞內脂質</text><text x="643" y="355" font-size="20" fill="#c1b2ea" text-anchor="start">纖維化相關基質</text><text x="86" y="424" font-size="19" fill="#e3e9e2" text-anchor="start">脂肪、發炎與纖維化不是同義詞，不由圖判個人階段。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>