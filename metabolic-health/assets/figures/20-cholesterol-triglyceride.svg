<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh20-title mh20-desc"><title id="mh20-title">膽固醇與三酸甘油酯的不同量</title><desc id="mh20-desc">化學形狀只作家族概念，不是精確分子模型；兩類檢驗不能共用一套不明換算。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20  /  膽固醇與三酸甘油酯的不同量</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="66" y="126" font-size="20" fill="#e3e9e2" text-anchor="start">膽固醇與三酸甘油酯：化學結構只畫概念</text><path d="M175 193l25 15v29l-25 15-25-15v-29Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 222l25 15v29l-25 15-25-15v-29Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M269 193l25 15v29l-25 15-25-15v-29Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M315 222l25 15v29l-25 15-25-15v-29Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="159" y="354" font-size="21" fill="#9ac8e8" text-anchor="start">環狀骨架示意</text><path d="M537 176V319M537 194L579 194 602 212 628 194 654 212 680 194M537 247H580L606 265 632 247 658 265 684 247M537 301H580L606 319 632 301 658 319 684 301" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="354" font-size="21" fill="#ead68c" text-anchor="start">甘油＋三條脂肪酸</text><text x="95" y="431" font-size="17" fill="#e3e9e2" text-anchor="start">兩種檢驗不能任意共用單位換算；示意不表示所有分子細節。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>