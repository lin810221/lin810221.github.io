<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh16-title mh16-desc"><title id="mh16-title">居家血壓的支撐與量測條件</title><desc id="mh16-desc">坐姿、背部、手臂與袖帶的關係示意；完整程序、時點和722安排以課文及來源為準。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16  /  居家血壓的支撐與量測條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="275" cy="151" rx="30" ry="35" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M276 190V290L360 298V396M276 242H416M247 211V303H335M235 207V326H333M258 326V404" stroke="#b7e89f" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 416H390" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 252H697V408M679 253V407" stroke="#9ac8e8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="358" y="224" width="41" height="34" rx="7" stroke="#ead68c" fill="#111a17" stroke-width="2"/><path d="M398 243L520 300" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="524" y="292" width="116" height="80" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="540" y="340" font-size="22" fill="#ead68c" text-anchor="start">讀值</text><text x="80" y="122" font-size="19" fill="#e3e9e2" text-anchor="start">坐穩與背部支撐</text><text x="445" y="164" font-size="19" fill="#ead68c" text-anchor="start">手臂支撐、袖帶合適</text><text x="445" y="204" font-size="18" fill="#e3e9e2" text-anchor="start">不交談，依程序休息</text><text x="99" y="456" font-size="18" fill="#e3e9e2" text-anchor="start">構造配置示意，不代表此畫面已涵蓋完整量測步驟。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>