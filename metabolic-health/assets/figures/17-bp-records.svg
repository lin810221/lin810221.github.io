<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh17-title mh17-desc"><title id="mh17-title">排定血壓位置與缺漏</title><desc id="mh17-desc">格子代表排定位置，不是全部有效讀值；問號為未知，不填0，也不以色彩宣告合規或確診。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 17  /  排定血壓位置與缺漏</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="75" y="119" font-size="21" fill="#e3e9e2" text-anchor="start">排定位置不等於每筆皆有效</text><text x="116" y="162" font-size="17" fill="#e3e9e2" text-anchor="middle">日1</text><rect x="80" y="185" width="72" height="34" rx="5" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><text x="116" y="209" font-size="14" fill="#9ac8e8" text-anchor="middle">觀察</text><rect x="80" y="233" width="72" height="34" rx="5" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><text x="116" y="257" font-size="14" fill="#9ac8e8" text-anchor="middle">觀察</text><rect x="80" y="281" width="72" height="34" rx="5" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><text x="116" y="305" font-size="14" fill="#9ac8e8" text-anchor="middle">觀察</text><rect x="80" y="329" width="72" height="34" rx="5" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><text x="116" y="353" font-size="14" fill="#9ac8e8" text-anchor="middle">觀察</text><text x="216" y="162" font-size="17" fill="#e3e9e2" text-anchor="middle">日2</text><rect x="180" y="185" width="72" height="34" rx="5" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><text x="216" y="209" font-size="14" fill="#9ac8e8" text-anchor="middle">觀察</text><rect x="180" y="233" width="72" height="34" rx="5" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><text x="216" y="257" font-size="14" fill="#9ac8e8" text-anchor="middle">觀察</text><rect x="180" y="281" width="72" height="34" rx="5" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><tex