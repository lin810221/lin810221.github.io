<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh38-title mh38-desc"><title id="mh38-title">酒精：容量、濃度與時間型態</title><desc id="mh38-desc">瓶子示意提醒容量不是酒精克數；計算暴露不等於有安全配額，圖不鼓勵開始飲酒。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 38  /  酒精：容量、濃度與時間型態</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M168 132H242V194L274 235V370H137V235L168 194Z" stroke="#ead68c" stroke-width="4" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="157" y="291" font-size="22" fill="#ead68c" text-anchor="start">容量</text><text x="154" y="331" font-size="22" fill="#ead68c" text-anchor="start">ABV</text><text x="352" y="183" font-size="25" fill="#9ac8e8" text-anchor="start">容量 × 濃度比例 × 密度</text><text x="352" y="248" font-size="21" fill="#e3e9e2" text-anchor="start">百分比需先轉成比例</text><text x="352" y="312" font-size="20" fill="#e3e9e2" text-anchor="start">相同總量，時間型態可不同</text><text x="94" y="436" font-size="18" fill="#e3e9e2" text-anchor="start">只說明克數算術，不產生安全飲酒額度或建議開始飲酒。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>