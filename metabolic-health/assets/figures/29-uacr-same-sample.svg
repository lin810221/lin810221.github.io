<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh29-title mh29-desc"><title id="mh29-title">UACR：同一尿液檢體的比值</title><desc id="mh29-desc">兩杯僅示稀釋及成分，不表示病況；白蛋白與尿肌酸酐必須來自同檢體並對齊單位。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 29  /  UACR：同一尿液檢體的比值</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M122 150V350H282V150" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="128" y="235" width="148" height="108" rx="0" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><ellipse cx="142" cy="254" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><ellipse cx="186" cy="254" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><ellipse cx="230" cy="254" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><path d="M162 274l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 274l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 274l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="392" font-size="18" fill="#9ac8e8" text-anchor="middle">同一檢體兩種成分</text><path d="M512 150V350H672V150" stroke="#ead68c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="518" y="235" width="148" height="108" rx="0" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><ellipse cx="532" cy="254" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><ellipse cx="576" cy="254" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><ellipse cx="620" cy="254" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><ellipse cx="532" cy="304" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><ellipse cx="576" cy="304" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><ellipse cx="620" cy="304" rx="6" ry="6" stroke="#eda894" fill="#eda894" stroke-width="3"/><path d="M552 274l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><path d="M596 274l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 274l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><path d="M552 324l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><path d="M596 324l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 324l6 6-6 6-6-6Z" stroke="#c1b2ea" stroke-width="2" fill="#c1b2ea" stroke-linecap="round" stroke-linejoin="round"/><text x="592" y="392" font-size="18" fill="#ead68c" text-anchor="middle">同一檢體兩種成分</text><text x="100" y="126" font-size="21" fill="#e3e9e2" text-anchor="start">白蛋白 ÷ 尿肌酸酐；同檢體、明確單位</text><text x="102" y="427" font-size="17" fill="#e3e9e2" text-anchor="start">圓點＝白蛋白；菱形＝尿肌酸酐；僅示濃度同比例改變。</text><text x="102" y="454" font-size="17" fill="#e3e9e2" text-anchor="start">實際比值仍有採樣與生物變異，不是確診。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>