<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh39-title mh39-desc"><title id="mh39-title">個人選擇外面的環境層</title><desc id="mh39-desc">同心範圍表示資源與制度影響，不代表每層固定權重，也不以平均政策效果推個人結果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 39  /  個人選擇外面的環境層</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="280" rx="310" ry="145" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="430" cy="290" rx="218" ry="96" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="430" cy="305" rx="110" ry="49" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="169" font-size="23" fill="#9ac8e8" text-anchor="middle">制度、場域與公平</text><text x="430" y="239" font-size="22" fill="#ead68c" text-anchor="middle">資源、家庭與社區</text><text x="430" y="312" font-size="24" fill="#b7e89f" text-anchor="middle">個人</text><text x="130" y="453" font-size="19" fill="#e3e9e2" text-anchor="start">外層條件影響可行選擇；不能只要求個人努力。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>