<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh08-title mh08-desc"><title id="mh08-title">體重、身體組成與時間</title><desc id="mh08-desc">兩條等長示例條呈現不同組成，顏色不是正常異常，並未表示特定人的比例或理想體脂。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08  /  體重、身體組成與時間</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="80" y="119" font-size="20" fill="#e3e9e2" text-anchor="start">相同體重，組成可不同（無個人數值）</text><rect x="150" y="178" width="160" height="64" rx="0" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="230.0" y="218" font-size="17" fill="#111a17" text-anchor="middle">脂質</text><rect x="310" y="178" width="230" height="64" rx="0" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="425.0" y="218" font-size="17" fill="#111a17" text-anchor="middle">非脂乾物質</text><rect x="540" y="178" width="150" height="64" rx="0" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="615.0" y="218" font-size="17" fill="#111a17" text-anchor="middle">水</text><text x="75" y="218" font-size="18" fill="#e3e9e2" text-anchor="start">示例1</text><rect x="150" y="303" width="220" height="64" rx="0" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="260.0" y="343" font-size="17" fill="#111a17" text-anchor="middle">脂質</text><rect x="370" y="303" width="190" height="64" rx="0" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="465.0" y="343" font-size="17" fill="#111a17" text-anchor="middle">非脂乾物質</text><rect x="560" y="303" width="130" height="64" rx="0" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="625.0" y="343" font-size="17" fill="#111a17" text-anchor="middle">水</text><text x="75" y="343" font-size="18" fill="#e3e9e2" text-anchor="start">示例2</text><text x="95" y="431" font-size="18" fill="#e3e9e2" text-anchor="start">化學成分的概念分解；不同身體組成測法不能直接互換。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>