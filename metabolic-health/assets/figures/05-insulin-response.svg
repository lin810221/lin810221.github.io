<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh05-title mh05-desc"><title id="mh05-title">胰島訊號與靶細胞反應</title><desc id="mh05-desc">血中訊號、受體與組織回應不是同一個量，分泌可能代償，示意不提供HOMA界線或個人診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 05  /  胰島訊號與靶細胞反應</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="275" rx="205" ry="120" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="350" y="280" font-size="25" fill="#b7e89f" text-anchor="start">靶細胞</text><text x="76" y="133" font-size="19" fill="#9ac8e8" text-anchor="start">血液／組織液</text><ellipse cx="110" cy="191" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="166" cy="240" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="136" cy="301" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><rect x="222" y="245" width="20" height="61" rx="5" stroke="#ead68c" fill="#111a17" stroke-width="2"/><path d="M165 269L211 269" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M202.0 264.7L211 269L202.0 273.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="385" font-size="20" fill="#ead68c" text-anchor="start">胰島素等訊號</text><text x="270" y="423" font-size="19" fill="#e3e9e2" text-anchor="start">訊號、受體與下游反應不是同一項量測</text><path d="M246 276H324" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="520" y="209" font-size="18" fill="#e3e9e2" text-anchor="start">反應依組織與條件</text><text x="521" y="338" font-size="18" fill="#e3e9e2" text-anchor="start">分泌可發生代償</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>