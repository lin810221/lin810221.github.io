<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh48-title mh48-desc"><title id="mh48-title">從資料到可審核的整合概念圖</title><desc id="mh48-desc">專題需交代問題、觀察、算術、來源及未知，圖不以完成度替個人下健康判決。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 48  /  從資料到可審核的整合概念圖</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="118" width="220" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="59" y="147" font-size="19" fill="#b7e89f" text-anchor="start">明確問題</text><text x="59" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">觀察不等於診斷</text><path d="M275 156L299 156" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.0 151.7L299 156L290.0 160.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="118" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="324" y="147" font-size="19" fill="#9ac8e8" text-anchor="start">原始資料</text><text x="324" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">同時保留缺漏</text><path d="M540 156L564 156" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 151.7L564 156L555.0 160.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="118" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="589" y="147" font-size="19" fill="#ead68c" text-anchor="start">合適算術</text><text x="589" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">單位與範圍正確</text><path d="M685 203V236H155V260" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 253L155 268" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.3 259.0L155 268L150.7 259.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="273" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="59" y="302" font-size="19" fill="#c1b2ea" text-anchor="start">圖與摘要</text><text x="59" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">可追溯到來源</text><path d="M275 311L299 311" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.0 306.7L299 311L290.0 315.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="273" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="324" y="302" font-size="19" fill="#eda894" text-anchor="start">限制與問題</text><text x="324" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">不捏造個人背景</text><path d="M540 311L564 311" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 306.7L564 311L555.0 315.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="273" width="220" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="589" y="302" font-size="19" fill="#b7e89f" text-anchor="start">回顧與閱讀</text><text x="589" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">依正式來源深化</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>