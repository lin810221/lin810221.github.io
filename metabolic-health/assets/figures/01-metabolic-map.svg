<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh01-title mh01-desc"><title id="mh01-title">代謝健康：器官與預防的地圖</title><desc id="mh01-desc">用心、肝、胰島、腎與周邊組織建立位置與照護關係，不從器官圖診斷個人。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 01  /  代謝健康：器官與預防的地圖</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="250" cy="142" rx="32" ry="40" stroke="#8b9d90" fill="#17251e" stroke-width="3"/><path d="M232 184L192 210 173 309M268 184L308 210 327 309M192 210L202 331 220 417M308 210L298 331 280 417M202 331Q250 355 298 331" stroke="#8b9d90" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 268Q245 248 272 273L257 292H210Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="275" cy="243" rx="13" ry="19" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M220 307Q250 292 278 307" stroke="#eda894" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M244 272L410 151" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="156" font-size="17" fill="#ead68c" text-anchor="start">肝：供應、儲存與轉換</text><path d="M274 244L410 211" stroke="#eda894" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="216" font-size="17" fill="#eda894" text-anchor="start">心：循環運送</text><path d="M268 307L410 274" stroke="#eda894" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="279" font-size="17" fill="#eda894" text-anchor="start">胰島：內分泌訊號</text><ellipse cx="228" cy="314" rx="9" ry="14" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M220 318L410 336" stroke="#9ac8e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="341" font-size="17" fill="#9ac8e8" text-anchor="start">腎：水鹽、排出與訊號</text><text x="415" y="410" font-size="20" fill="#b7e89f" text-anchor="start">肌肉與脂肪也是主動參與者</text><text x="414" y="116" font-size="16" fill="#9ac8e8" text-anchor="start">正面：圖左為人體右；後方省略</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>