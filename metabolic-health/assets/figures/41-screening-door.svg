<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh41-title mh41-desc"><title id="mh41-title">服務資格、檢查與後續不是同一扇門</title><desc id="mh41-desc">入口圖只表示流程分工，不列新的資格門檻，不能把公費資格等同個人追蹤已完成。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41  /  服務資格、檢查與後續不是同一扇門</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="150" y="166" width="182" height="219" rx="7" stroke="#9ac8e8" fill="#111a17" stroke-width="2"/><path d="M190 166V385" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="296" cy="273" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M381 273L485 273" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M476.0 268.7L485 273L476.0 277.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="506" y="203" font-size="22" fill="#9ac8e8" text-anchor="start">資格是入口條件</text><text x="506" y="265" font-size="22" fill="#ead68c" text-anchor="start">檢查後仍需確認</text><text x="506" y="327" font-size="22" fill="#c1b2ea" text-anchor="start">後續依實際需要</text><text x="95" y="446" font-size="18" fill="#e3e9e2" text-anchor="start">符合公費資格，不表示所有追蹤已完成或風險為零。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>