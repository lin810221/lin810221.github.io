<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh41-title mh41-desc"><title id="mh41-title">生命事件與可用支持</title><desc id="mh41-desc">照顧、孕產、高齡與失落可有不同負擔和資源，沒有用人生階段決定誰必然有困擾。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41  /  生命事件與可用支持</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="420" cy="230" rx="17.0" ry="19.55" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M420 251.25V315.0M390.25 284.4L420 263.15 449.75 284.4M420 315.0L398.75 353.25M420 315.0L441.25 353.25" stroke="#b7e89f" stroke-width="4.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="420" cy="315" rx="65" ry="48" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="382" y="322" font-size="21" fill="#ead68c" text-anchor="start">支持</text><rect x="55" y="115" width="240" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="69" y="144" font-size="19" fill="#9ac8e8" text-anchor="start">照顧與孕產</text><text x="69" y="172" font-size="15" fill="#e3e9e2" text-anchor="start">實務、身體與心理</text><rect x="565" y="115" width="240" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="579" y="144" font-size="19" fill="#c1b2ea" text-anchor="start">高齡與失落</text><text x="579" y="172" font-size="15" fill="#e3e9e2" text-anchor="start">功能、關係與資源</text><path d="M300 190L355 242" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M351.4 232.7L355 242L345.5 239.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 190L485 242" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.9 240.4L485 242L489.9 233.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="445" font-size="19" fill="#e3e9e2" text-anchor="start">需求會變，也能討論支持；困擾不應被當成必然。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>