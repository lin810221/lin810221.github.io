<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh31-title mh31-desc"><title id="mh31-title">情緒、興趣與功能不是同一條尺</title><desc id="mh31-desc">三個獨立觀察區域沒有症狀總分，時間和情境需另記錄，不能從圖直接判憂鬱。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 31  /  情緒、興趣與功能不是同一條尺</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="215" cy="260" rx="107" ry="100" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="430" cy="260" rx="107" ry="100" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="645" cy="260" rx="107" ry="100" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="174" y="267" font-size="25" fill="#9ac8e8" text-anchor="start">情緒</text><text x="389" y="267" font-size="25" fill="#ead68c" text-anchor="start">興趣</text><text x="604" y="267" font-size="25" fill="#c1b2ea" text-anchor="start">功能</text><text x="95" y="420" font-size="20" fill="#e3e9e2" text-anchor="start">另問持續時間、身體條件、情境與當事人的需要。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>