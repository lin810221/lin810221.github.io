<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh45-title mh45-desc"><title id="mh45-title">差異、關聯與因果：問題要分開</title><desc id="mh45-desc">左側代表同一量尺兩個虛構摘要，右側點為任意成對資料，兩者都不自動建立因果或臨床重要性。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 45  /  差異、關聯與因果：問題要分開</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="55" y="120" width="350" height="300" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="157" font-size="21" fill="#9ac8e8" text-anchor="start">差異：先確認相同結果</text><path d="M90 345V210M170 345V255" stroke="#ead68c" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="387" font-size="18" fill="#e3e9e2" text-anchor="start">方向不等於好壞</text><rect x="445" y="120" width="350" height="300" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="470" y="157" font-size="21" fill="#c1b2ea" text-anchor="start">關聯：觀察成對變化</text><ellipse cx="500" cy="330" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="550" cy="280" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="590" cy="295" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="640" cy="220" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="700" cy="190" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="470" y="387" font-size="18" fill="#e3e9e2" text-anchor="start">沒有因果箭頭</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>