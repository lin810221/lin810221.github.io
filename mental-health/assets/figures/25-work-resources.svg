<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh25-title mh25-desc"><title id="mh25-title">工作需求與資源：一起看設計</title><desc id="mh25-desc">兩個平台並列表示需求和可用資源，沒有提供JD-R量表、耗竭診斷或員工承受力分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 25  /  工作需求與資源：一起看設計</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 363H790" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="105" y="165" width="280" height="145" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="133" y="205" font-size="25" fill="#9ac8e8" text-anchor="start">工作需求</text><text x="133" y="252" font-size="17" fill="#e3e9e2" text-anchor="start">工作量、節奏、情緒負擔</text><rect x="475" y="165" width="280" height="145" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="503" y="205" font-size="25" fill="#ead68c" text-anchor="start">工作資源</text><text x="503" y="252" font-size="17" fill="#e3e9e2" text-anchor="start">自主、支持、工具與公平</text><path d="M394 231L463 231" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M454.0 226.7L463 231L454.0 235.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="430" font-size="20" fill="#e3e9e2" text-anchor="start">不是只訓練人承受更多，也要改變工作條件。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>