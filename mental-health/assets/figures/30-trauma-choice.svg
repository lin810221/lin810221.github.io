<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh30-title mh30-desc"><title id="mh30-title">創傷知情與共同決策：選擇保持可用</title><desc id="mh30-desc">多個入口允許當事人選擇談、先看資源、暫停或找專業支持，不強迫回述經驗。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30  /  創傷知情與共同決策：選擇保持可用</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="160" cy="235" rx="20" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M160 260V335M125 299L160 274 195 299M160 335L135 380M160 335L185 380" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="112" width="365" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="384" y="141" font-size="19" fill="#b7e89f" text-anchor="start">先確認意願</text><text x="384" y="169" font-size="15" fill="#e3e9e2" text-anchor="start">可以先不談經驗</text><rect x="370" y="237" width="365" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="384" y="266" font-size="19" fill="#ead68c" text-anchor="start">選擇方式與支持</text><text x="384" y="294" font-size="15" fill="#e3e9e2" text-anchor="start">方法、負擔和偏好一起看</text><rect x="370" y="362" width="365" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="384" y="391" font-size="19" fill="#c1b2ea" text-anchor="start">允許暫停與回顧</text><text x="384" y="419" font-size="15" fill="#e3e9e2" text-anchor="start">不以一次反應判成功失敗</text><path d="M218 279L350 279" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M341.0 274.7L350 279L341.0 283.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>