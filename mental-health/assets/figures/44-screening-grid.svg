<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh44-title mh44-desc"><title id="mh44-title">虛構篩檢四格：先找分母</title><desc id="mh44-desc">假想一萬人例子：目標狀態500人，真陽性400、偽陰性100、偽陽性950、真陰性8550；非真實工具效能。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 44  /  虛構篩檢四格：先找分母</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="70" y="122" font-size="22" fill="#e3e9e2" text-anchor="start">一萬人虛構例：僅用來說明算術</text><rect x="140" y="155" width="270" height="100" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="425" y="155" width="270" height="100" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="140" y="270" width="270" height="100" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="425" y="270" width="270" height="100" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="160" y="199" font-size="23" fill="#9ac8e8" text-anchor="start">真陽性 400</text><text x="445" y="199" font-size="23" fill="#ead68c" text-anchor="start">偽陽性 950</text><text x="160" y="315" font-size="23" fill="#c1b2ea" text-anchor="start">偽陰性 100</text><text x="445" y="315" font-size="23" fill="#b7e89f" text-anchor="start">真陰性 8550</text><text x="85" y="430" font-size="19" fill="#e3e9e2" text-anchor="start">PPV分母：400＋950；不是所有人，也不是有狀態者。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>