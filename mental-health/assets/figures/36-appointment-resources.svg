<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh36-title mh36-desc"><title id="mh36-title">找到入口，準備你希望討論的問題</title><desc id="mh36-desc">地圖為無地址的概念入口：正式資源、預約、需求和問題；實際聯絡方式依原課可查來源。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36  /  找到入口，準備你希望討論的問題</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="70" y="120" width="720" height="300" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M90 335L250 175 430 330 650 180 765 335" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="250" cy="175" rx="12" ry="12" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="250" y="145" font-size="18" fill="#e3e9e2" text-anchor="middle">正式入口</text><ellipse cx="430" cy="330" rx="12" ry="12" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="430" y="372" font-size="18" fill="#e3e9e2" text-anchor="middle">預約與可近性</text><ellipse cx="650" cy="180" rx="12" ry="12" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="650" y="150" font-size="18" fill="#e3e9e2" text-anchor="middle">希望討論的事</text><text x="90" y="452" font-size="18" fill="#e3e9e2" text-anchor="start">不是實體地址或自動轉介；個資可按需要與意願提供。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>