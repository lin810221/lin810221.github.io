<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh02-title mh02-desc"><title id="mh02-title">多層解釋可以同時成立</title><desc id="mh02-desc">一個人位於身體、心理及社會條件的共同脈絡；各層不互相排除，也不由相關直接確定因果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02  /  多層解釋可以同時成立</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="115" width="730" height="310" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="95" y="150" font-size="22" fill="#c1b2ea" text-anchor="start">社會：工作、關係與資源</text><rect x="160" y="185" width="540" height="200" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="190" y="219" font-size="21" fill="#9ac8e8" text-anchor="start">心理：評估、記憶與行動</text><rect x="270" y="253" width="320" height="101" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="290" y="289" font-size="21" fill="#ead68c" text-anchor="start">身體與神經生理</text><ellipse cx="520" cy="288" rx="7.0" ry="8.049999999999999" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M520 296.75V323.0M507.75 310.4L520 301.65 532.25 310.4M520 323.0L511.25 338.75M520 323.0L528.75 338.75" stroke="#b7e89f" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>