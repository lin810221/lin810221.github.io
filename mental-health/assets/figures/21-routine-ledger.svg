<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh21-title mh21-desc"><title id="mh21-title">一天的安排：已知、需要和未知</title><desc id="mh21-desc">三段安排代表虛構工作、照顧與休息機會，問號段未知；不把排程等同生理容量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21  /  一天的安排：已知、需要和未知</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="70" y="128" font-size="22" fill="#e3e9e2" text-anchor="start">可用時間與責任需要一起看</text><rect x="70" y="180" width="210" height="95" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="95" y="237" font-size="22" fill="#9ac8e8" text-anchor="start">工作安排</text><rect x="285" y="180" width="210" height="95" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="310" y="237" font-size="22" fill="#ead68c" text-anchor="start">照顧責任</text><rect x="500" y="180" width="160" height="95" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="525" y="237" font-size="21" fill="#c1b2ea" text-anchor="start">其他需要</text><rect x="665" y="180" width="120" height="95" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="700" y="239" font-size="29" fill="#e3e9e2" text-anchor="start">？</text><path d="M70 305H785" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="371" font-size="21" fill="#e3e9e2" text-anchor="start">缺資料時先協調與補資訊，不補成0分鐘。</text><text x="75" y="424" font-size="20" fill="#e3e9e2" text-anchor="start">沒有一張人人相同的理想日程。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>