<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh16-title mh16-desc"><title id="mh16-title">定向與覺察：有多種可選接點</title><desc id="mh16-desc">人可把注意轉向眼前物件、支撐或環境，也可停止練習；不是強迫閉眼或回述創傷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16  /  定向與覺察：有多種可選接點</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="250" rx="16.0" ry="18.400000000000002" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M430 270.0V330.0M402.0 301.2L430 281.2 458.0 301.2M430 330.0L410.0 366.0M430 330.0L450.0 366.0" stroke="#b7e89f" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="135" width="140" height="105" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="107" y="177" font-size="21" fill="#9ac8e8" text-anchor="start">眼前物件</text><text x="108" y="210" font-size="17" fill="#e3e9e2" text-anchor="start">看得到的</text><path d="M295 411H565" stroke="#ead68c" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="314" y="447" font-size="19" fill="#ead68c" text-anchor="start">可用的支撐</text><ellipse cx="695" cy="190" rx="55" ry="55" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="654" y="196" font-size="18" fill="#c1b2ea" text-anchor="start">環境聲音</text><path d="M245 190L362 238" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.3 230.6L362 238L352.0 238.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M612 220L500 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M509.9 256.5L500 255L507.3 248.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>