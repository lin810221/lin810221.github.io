<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh17-title mh17-desc"><title id="mh17-title">呼吸相位與注意：示意不是指令</title><desc id="mh17-desc">兩段圓弧代表相位先後，沒有目標秒數、憋氣或個人HRV保證，方法應符合舒適與偏好。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 17  /  呼吸相位與注意：示意不是指令</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="300" cy="265" rx="128" ry="128" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M300 137A128 128 0 0 1 428 265" stroke="#ead68c" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M428 265A128 128 0 0 1 300 393" stroke="#c1b2ea" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="234" y="268" font-size="21" fill="#b7e89f" text-anchor="start">自然與舒適</text><text x="225" y="303" font-size="18" fill="#e3e9e2" text-anchor="start">可以隨時停止</text><rect x="515" y="155" width="270" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="529" y="184" font-size="19" fill="#ead68c" text-anchor="start">注意到相位</text><text x="529" y="212" font-size="15" fill="#e3e9e2" text-anchor="start">不追目標節奏</text><rect x="515" y="300" width="270" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="529" y="329" font-size="19" fill="#c1b2ea" text-anchor="start">注意回來</text><text x="529" y="357" font-size="15" fill="#e3e9e2" text-anchor="start">不等於消除所有想法</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>