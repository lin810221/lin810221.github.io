<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh22-title mh22-desc"><title id="mh22-title">連結的品質：不只數有幾個人</title><desc id="mh22-desc">不同連線代表可取得的陪伴、實務協助或專業資源，線長與節點數不是孤獨量表。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 22  /  連結的品質：不只數有幾個人</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="420" cy="246" rx="17.0" ry="19.55" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M420 267.25V331.0M390.25 300.4L420 279.15 449.75 300.4M420 331.0L398.75 369.25M420 331.0L441.25 369.25" stroke="#b7e89f" stroke-width="4.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="140" rx="11.0" ry="12.65" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M150 153.75V195.0M130.75 175.2L150 161.45 169.25 175.2M150 195.0L136.25 219.75M150 195.0L163.75 219.75" stroke="#9ac8e8" stroke-width="2.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 195L420 296" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="690" cy="140" rx="11.0" ry="12.65" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M690 153.75V195.0M670.75 175.2L690 161.45 709.25 175.2M690 195.0L676.25 219.75M690 195.0L703.75 219.75" stroke="#ead68c" stroke-width="2.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 195L420 296" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="340" rx="11.0" ry="12.65" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M150 353.75V395.0M130.75 375.2L150 361.45 169.25 375.2M150 395.0L136.25 419.75M150 395.0L163.75 419.75" stroke="#c1b2ea" stroke-width="2.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 395L420 296" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="690" cy="340" rx="11.0" ry="12.65" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M690 353.75V395.0M670.75 375.2L690 361.45 709.25 375.2M690 395.0L676.25 419.75M690 395.0L703.75 419.75" stroke="#eda894" stroke-width="2.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 395L420 296" stroke="#eda894" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="315" y="126" font-size="23" fill="#b7e89f" text-anchor="start">需要與關係品質</text><text x="285" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">連線是支持方向，不是診斷與排名。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>