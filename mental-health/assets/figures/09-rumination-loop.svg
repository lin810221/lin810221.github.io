<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh09-title mh09-desc"><title id="mh09-title">反覆追問與可以打開的出口</title><desc id="mh09-desc">抽象反覆追問可能維持循環，具體資訊、支持或小步可提供另一方向；不是責怪有困擾的人。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09  /  反覆追問與可以打開的出口</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="266" rx="123" ry="60" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="273" font-size="22" fill="#b7e89f" text-anchor="middle">反覆追問</text><rect x="65" y="120" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="79" y="149" font-size="19" fill="#9ac8e8" text-anchor="start">模糊的疑問</text><text x="79" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><rect x="570" y="120" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="584" y="149" font-size="19" fill="#ead68c" text-anchor="start">再次搜尋保證</text><text x="584" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><rect x="65" y="355" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="79" y="384" font-size="19" fill="#c1b2ea" text-anchor="start">暫時有把握</text><text x="79" y="412" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><rect x="570" y="355" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="584" y="384" font-size="19" fill="#eda894" text-anchor="start">又遇到未知</text><text x="584" y="412" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><path d="M292 158L564 158" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 153.7L564 158L555.0 162.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 203L680 346" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M684.3 337.0L680 346L675.7 337.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M564 392L292 392" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.0 396.3L292 392L301.0 387.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 346L175 204" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.7 213.0L175 204L179.3 213.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M550 267L770 267" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M761.0 262.7L770 267L761.0 271.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="233" font-size="19" fill="#ead68c" text-anchor="start">可選出口</text><text x="580" y="305" font-size="18" fill="#ead68c" text-anchor="start">具體一步／支持</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>