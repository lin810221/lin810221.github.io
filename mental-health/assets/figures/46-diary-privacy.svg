<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh46-title mh46-desc"><title id="mh46-title">日記欄位：先問用途，再決定收多少</title><desc id="mh46-desc">虛構記錄卡保留目的、時間、選擇和缺漏，身份欄不需要填入；不是要求公開日記。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 46  /  日記欄位：先問用途，再決定收多少</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="120" y="115" width="620" height="310" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="148" y="158" font-size="26" fill="#9ac8e8" text-anchor="start">虛構教學記錄</text><path d="M150 225H710" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="212" font-size="18" fill="#ead68c" text-anchor="start">目的／時間窗</text><path d="M150 290H710" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="277" font-size="18" fill="#c1b2ea" text-anchor="start">原創觀察／未知狀態</text><path d="M150 355H710" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="342" font-size="18" fill="#b7e89f" text-anchor="start">只保留必要欄位</text><text x="160" y="402" font-size="19" fill="#e3e9e2" text-anchor="start">不必填姓名、私密內容或提供身體資料。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>