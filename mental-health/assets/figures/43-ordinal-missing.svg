<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh43-title mh43-desc"><title id="mh43-title">原創感受記錄：順序、缺漏與零</title><desc id="mh43-desc">短刻度是原創教學記錄，問號是缺漏，不設正常異常、診斷或安全色帶。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 43  /  原創感受記錄：順序、缺漏與零</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 215H775" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">0</text><path d="M156 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="156" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">1</text><path d="M222 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">2</text><path d="M288 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">3</text><path d="M354 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="354" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">4</text><path d="M420 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">5</text><path d="M486 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="486" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">6</text><path d="M552 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="552" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">7</text><path d="M618 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">8</text><path d="M684 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="684" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">9</text><path d="M750 202V228" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="265" font-size="18" fill="#9ac8e8" text-anchor="middle">10</text><rect x="115" y="330" width="135" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="160" y="374" font-size="26" fill="#b7e89f" text-anchor="start">0</text><rect x="305" y="330" width="135" height="68" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="350" y="374" font-size="26" fill="#c1b2ea" text-anchor="start">？</text><text x="490" y="359" font-size="23" fill="#e3e9e2" text-anchor="start">明確零 ≠ 未記錄</text><text x="490" y="402" font-size="18" fill="#e3e9e2" text-anchor="start">沒有臨床門檻或健康分級</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>