<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh05-title mh05-desc"><title id="mh05-title">反應與時間：沒有一條通用病程曲線</title><desc id="mh05-desc">三段虛構時間線有不同事件與回顧位置，只表示可能的時間結構，不預測症狀或恢復。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 05  /  反應與時間：沒有一條通用病程曲線</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 170H770" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 280H770" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 390H770" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="133" font-size="21" fill="#9ac8e8" text-anchor="start">單次事件</text><text x="90" y="243" font-size="21" fill="#ead68c" text-anchor="start">反覆需求</text><text x="90" y="353" font-size="21" fill="#c1b2ea" text-anchor="start">支持與回顧</text><ellipse cx="210" cy="170" rx="11" ry="11" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="210" cy="280" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="380" cy="280" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="570" cy="280" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="310" cy="390" rx="11" ry="11" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="620" cy="390" rx="11" ry="11" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="90" y="445" font-size="17" fill="#e3e9e2" text-anchor="start">橫向是時間順序；點不是症狀分數，也不代表固定恢復時長。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>