<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh08-title mh08-desc"><title id="mh08-title">同一觀察可以有多個待查解釋</title><desc id="mh08-desc">訊息未回覆的原創案例，分開事實和可能解釋，再保留可選行動；不強迫樂觀。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08  /  同一觀察可以有多個待查解釋</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="120" width="280" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="79" y="149" font-size="19" fill="#9ac8e8" text-anchor="start">觀察：尚未回覆</text><text x="79" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">非緊急訊息</text><path d="M110 196l-15 18 38-18" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 160L475 160" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M466.0 155.7L475 160L466.0 164.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="120" width="280" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="504" y="149" font-size="19" fill="#ead68c" text-anchor="start">可能解釋</text><text x="504" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">忙碌、未讀、需要時間</text><path d="M535 196l-15 18 38-18" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="185" cy="296" rx="14.0" ry="16.099999999999998" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M185 313.5V366.0M160.5 340.8L185 323.3 209.5 340.8M185 366.0L167.5 397.5M185 366.0L202.5 397.5" stroke="#c1b2ea" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="300" width="400" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="384" y="329" font-size="19" fill="#b7e89f" text-anchor="start">可以帶著感受選下一步</text><text x="384" y="357" font-size="15" fill="#e3e9e2" text-anchor="start">確認期限、補資訊或暫停查看</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>