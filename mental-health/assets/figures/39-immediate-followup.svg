<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh39-title mh39-desc"><title id="mh39-title">即時協助與後續支持是不同工作</title><desc id="mh39-desc">即時醫療與後續支持並列，依當下情境連結；無風險評分或保證安全的檢核清單。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 39  /  即時協助與後續支持是不同工作</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="70" y="140" width="300" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="84" y="169" font-size="19" fill="#eda894" text-anchor="start">當下需要即時協助</text><text x="84" y="197" font-size="15" fill="#e3e9e2" text-anchor="start">連結所在地緊急醫療等</text><rect x="490" y="140" width="300" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="504" y="169" font-size="19" fill="#9ac8e8" text-anchor="start">後續支持與回顧</text><text x="504" y="197" font-size="15" fill="#e3e9e2" text-anchor="start">由合適專業共同安排</text><path d="M385 179L475 179" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M466.0 174.7L475 179L466.0 183.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="302" rx="14.0" ry="16.099999999999998" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M220 319.5V372.0M195.5 346.8L220 329.3 244.5 346.8M220 372.0L202.5 403.5M220 372.0L237.5 403.5" stroke="#eda894" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="640" cy="302" rx="14.0" ry="16.099999999999998" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M640 319.5V372.0M615.5 346.8L640 329.3 664.5 346.8M640 372.0L622.5 403.5M640 372.0L657.5 403.5" stroke="#9ac8e8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="447" font-size="20" fill="#e3e9e2" text-anchor="start">不必等日記、分數或課程完成才尋求協助。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>