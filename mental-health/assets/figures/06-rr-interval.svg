<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh06-title mh06-desc"><title id="mh06-title">心搏間隔變化與情境</title><desc id="mh06-desc">兩列節點代表虛構心搏時點，間隔可能不同；不是心電圖、HRV檢測或焦慮診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 06  /  心搏間隔變化與情境</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M85 175H780" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 300H780" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 145V205" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 145V205" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 145V205" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 145V205" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M625 145V205" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 145V205" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 270V330" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 270V330" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 270V330" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 270V330" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 270V330" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 270V330" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="125" font-size="20" fill="#9ac8e8" text-anchor="start">虛構片段A：節點間的時間</text><text x="85" y="250" font-size="20" fill="#c1b2ea" text-anchor="start">虛構片段B：另一組間隔</text><text x="85" y="391" font-size="19" fill="#e3e9e2" text-anchor="start">先確認量測、呼吸、活動、時間與資料品質。</text><text x="85" y="435" font-size="18" fill="#e3e9e2" text-anchor="start">未給實測刻度，不用「越大越好」判個人心理狀態。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>