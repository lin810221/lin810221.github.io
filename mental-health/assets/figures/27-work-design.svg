<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh27-title mh27-desc"><title id="mh27-title">個人、團隊與組織的不同介入位置</title><desc id="mh27-desc">三個嵌套區域表示工作調整需多層支持，個人技能不能代替尚未處理的組織條件。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27  /  個人、團隊與組織的不同介入位置</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="115" width="730" height="310" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="90" y="149" font-size="22" fill="#c1b2ea" text-anchor="start">組織：政策、資源與工作設計</text><rect x="150" y="183" width="560" height="202" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="174" y="219" font-size="22" fill="#9ac8e8" text-anchor="start">團隊：角色、交接與支持</text><rect x="260" y="265" width="340" height="83" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="285" y="314" font-size="20" fill="#b7e89f" text-anchor="start">個人：偏好與可用技能</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>