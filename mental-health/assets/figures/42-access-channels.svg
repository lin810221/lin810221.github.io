<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh42-title mh42-desc"><title id="mh42-title">可近的溝通與有尊嚴的求助</title><desc id="mh42-desc">四種溝通與環境條件並列，沒有把差異畫成缺陷或用單一方法要求所有人。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 42  /  可近的溝通與有尊嚴的求助</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">溝通方式</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">口語、文字或其他可用方式</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">先確認本人偏好</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">感官與節奏</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">資訊量、光線與安排</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">可討論具體調整</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">資源與權益</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">資格、費用與可取得服務</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不以污名阻擋求助</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">文化與自主</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">尊重用詞、選擇和需要</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不以群體標籤代替個人</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>