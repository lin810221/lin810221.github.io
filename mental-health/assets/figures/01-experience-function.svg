<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh01-title mh01-desc"><title id="mh01-title">經驗、功能與生活是不同面向</title><desc id="mh01-desc">三個相交區域表示經驗、生活功能及脈絡互相影響；不是診斷三圈或嚴重度分級。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 01  /  經驗、功能與生活是不同面向</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="320" cy="242" rx="145" ry="108" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="520" cy="242" rx="145" ry="108" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="420" cy="335" rx="145" ry="100" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="220" y="210" font-size="22" fill="#9ac8e8" text-anchor="start">主觀經驗</text><text x="505" y="210" font-size="22" fill="#ead68c" text-anchor="start">生活功能</text><text x="347" y="390" font-size="22" fill="#c1b2ea" text-anchor="start">環境與資源</text><text x="72" y="459" font-size="18" fill="#e3e9e2" text-anchor="start">交集表示關聯；圈大小沒有量尺，不以圖面積判斷需要。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>