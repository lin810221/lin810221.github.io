<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh23-title mh23-desc"><title id="mh23-title">界線和衝突：具體表達可協調部分</title><desc id="mh23-desc">兩個人之間保留各自需要與共享討論區，不把界線當威脅，也不忽略關係安全。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 23  /  界線和衝突：具體表達可協調部分</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="175" cy="260" rx="14.0" ry="16.099999999999998" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M175 277.5V330.0M150.5 304.8L175 287.3 199.5 304.8M175 330.0L157.5 361.5M175 330.0L192.5 361.5" stroke="#9ac8e8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="685" cy="260" rx="14.0" ry="16.099999999999998" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M685 277.5V330.0M660.5 304.8L685 287.3 709.5 304.8M685 330.0L667.5 361.5M685 330.0L702.5 361.5" stroke="#c1b2ea" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="120" width="280" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="59" y="149" font-size="19" fill="#9ac8e8" text-anchor="start">我能提供什麼</text><text x="59" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">時間與限制說清楚</text><path d="M90 196l-15 18 38-18" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="120" width="280" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="489" y="149" font-size="19" fill="#c1b2ea" text-anchor="start">你現在需要什麼</text><text x="489" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">確認可接受的協助</text><path d="M520 196l-15 18 38-18" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="275" width="220" height="115" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="340" y="316" font-size="23" fill="#b7e89f" text-anchor="start">可協調區</text><text x="340" y="355" font-size="17" fill="#e3e9e2" text-anchor="start">具體事項與下一步</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>