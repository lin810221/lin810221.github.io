<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh10-title mh10-desc"><title id="mh10-title">注意與外部工具：把工作移到看得見的地方</title><desc id="mh10-desc">同一人面對多項任務，外部清單可以保存線索；示意不量測工作記憶容量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 10  /  注意與外部工具：把工作移到看得見的地方</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="160" cy="240" rx="20" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M160 265V340M125 304L160 279 195 304M160 340L135 385M160 340L185 385" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="120" width="420" height="290" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="355" y="158" font-size="23" fill="#b7e89f" text-anchor="start">外部工作區</text><rect x="355" y="190" width="365" height="49" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="370" y="221" font-size="18" fill="#ead68c" text-anchor="start">當前任務</text><rect x="355" y="255" width="365" height="49" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="370" y="286" font-size="18" fill="#9ac8e8" text-anchor="start">待辦／時間與背景</text><rect x="355" y="320" width="365" height="49" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="370" y="351" font-size="18" fill="#c1b2ea" text-anchor="start">稍後再處理</text><path d="M210 270L320 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.0 265.7L320 270L311.0 274.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="449" font-size="17" fill="#e3e9e2" text-anchor="start">框不是大腦區域；清單幫助保存，不保證所有切換沒有成本。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>