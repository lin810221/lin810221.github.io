<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh14-title mh14-desc"><title id="mh14-title">小步與機會：讓行動可被辨認</title><desc id="mh14-desc">階梯表示可選的小步而非療效或規定速度，環境和支持影響是否可行。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14  /  小步與機會：讓行動可被辨認</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 390H240V335H385V280H530V225H690" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="165" cy="270" rx="12.0" ry="13.799999999999999" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M165 285.0V330.0M144.0 308.4L165 293.4 186.0 308.4M165 330.0L150.0 357.0M165 330.0L180.0 357.0" stroke="#9ac8e8" stroke-width="3.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="435" font-size="19" fill="#e3e9e2" text-anchor="start">一個可辨認機會</text><text x="260" y="321" font-size="19" fill="#e3e9e2" text-anchor="start">一個可行行動</text><text x="414" y="265" font-size="19" fill="#e3e9e2" text-anchor="start">回顧條件</text><text x="567" y="205" font-size="19" fill="#e3e9e2" text-anchor="start">需要時調整</text><text x="100" y="125" font-size="20" fill="#c1b2ea" text-anchor="start">不是每個人必須照同一階梯、同一速度前進。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>