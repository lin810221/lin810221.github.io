<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh47-title mh47-desc"><title id="mh47-title">圖表與來源：可核對，不代替理解</title><desc id="mh47-desc">同一份虛構資料連到表格、圖與說明，缺漏與來源仍需保留；檔案格式不是療效證據。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 47  /  圖表與來源：可核對，不代替理解</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="55" y="125" width="220" height="250" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="165" font-size="24" fill="#9ac8e8" text-anchor="start">原始記錄</text><path d="M83 205H250" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M83 245H250" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M83 285H250" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M83 325H250" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 235L385 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M376.0 230.7L385 235L376.0 239.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="400" y="125" width="375" height="250" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="425" y="165" font-size="24" fill="#b7e89f" text-anchor="start">可閱讀的交付</text><path d="M445 320V225M505 320V265M565 320V200" stroke="#ead68c" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="625" y="280" font-size="32" fill="#c1b2ea" text-anchor="start">？</text><text x="85" y="443" font-size="20" fill="#e3e9e2" text-anchor="start">檢查來源與未知，不用漂亮圖表代替問題定義。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>