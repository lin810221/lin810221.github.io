<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh37-title mh37-desc"><title id="mh37-title">支持對話：先理解，再確認需要</title><desc id="mh37-desc">兩個人以原創短句互相確認，不急著貼診斷或替對方決定行動。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37  /  支持對話：先理解，再確認需要</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="185" cy="300" rx="14.0" ry="16.099999999999998" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M185 317.5V370.0M160.5 344.8L185 327.3 209.5 344.8M185 370.0L167.5 401.5M185 370.0L202.5 401.5" stroke="#9ac8e8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="650" cy="300" rx="14.0" ry="16.099999999999998" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M650 317.5V370.0M625.5 344.8L650 327.3 674.5 344.8M650 370.0L632.5 401.5M650 370.0L667.5 401.5" stroke="#c1b2ea" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="120" width="280" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="59" y="149" font-size="19" fill="#9ac8e8" text-anchor="start">你希望我怎樣陪你？</text><text x="59" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">先詢問意願</text><path d="M90 196l-15 18 38-18" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="120" width="280" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="489" y="149" font-size="19" fill="#c1b2ea" text-anchor="start">先聽，或一起找資源</text><text x="489" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">需要可以再確認</text><path d="M520 196l-15 18 38-18" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 165L462 165" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M453.0 160.7L462 165L453.0 169.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>