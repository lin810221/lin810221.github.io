<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh28-title mh28-desc"><title id="mh28-title">害怕、預期與功能：分開描述</title><desc id="mh28-desc">當下事件和未來預期可伴隨身體、思想及行動改變，圖不分類診斷，也不依圖排除醫療問題。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28  /  害怕、預期與功能：分開描述</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="55" y="125" width="280" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="69" y="154" font-size="19" fill="#9ac8e8" text-anchor="start">當下的事件</text><text x="69" y="182" font-size="15" fill="#e3e9e2" text-anchor="start">先描述看見什麼</text><path d="M100 201l-15 18 38-18" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="125" width="280" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="489" y="154" font-size="19" fill="#ead68c" text-anchor="start">對未來的預期</text><text x="489" y="182" font-size="15" fill="#e3e9e2" text-anchor="start">哪些仍然不知道</text><path d="M520 201l-15 18 38-18" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="420" cy="276" rx="14.0" ry="16.099999999999998" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M420 293.5V346.0M395.5 320.8L420 303.3 444.5 320.8M420 346.0L402.5 377.5M420 346.0L437.5 377.5" stroke="#c1b2ea" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="420" font-size="21" fill="#e3e9e2" text-anchor="start">身體、感受與行動都需要放回情境與時間。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>