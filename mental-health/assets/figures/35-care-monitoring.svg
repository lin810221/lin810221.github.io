<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh35-title mh35-desc"><title id="mh35-title">方法、醫療與共同監測</title><desc id="mh35-desc">方法原理與具體個人安排不同，目標、偏好、效果與負擔要在照護中持續回顧。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35  /  方法、醫療與共同監測</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">方法與目的</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">不同治療有不同理論與程序</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不把名稱當通用成功保證</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">個人條件</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">功能、偏好及可取得資源</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">方案需要具體討論</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">效果與負擔</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">觀察改善與不舒服的變化</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不是只看一個分數</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">持續回顧</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">與合適專業共同調整</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不自行依圖換藥或停藥</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>