<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh34-title mh34-desc"><title id="mh34-title">求助、角色與合作</title><desc id="mh34-desc">當事人可依需要接觸合適專業，角色與資格要依當地制度確認；圖不替代轉介或診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34  /  求助、角色與合作</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="425" cy="270" rx="15.0" ry="17.25" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M425 288.75V345.0M398.75 318.0L425 299.25 451.25 318.0M425 345.0L406.25 378.75M425 345.0L443.75 378.75" stroke="#b7e89f" stroke-width="3.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="120" width="280" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="69" y="149" font-size="19" fill="#9ac8e8" text-anchor="start">醫療專業</text><text x="69" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">醫療評估與適當照護</text><rect x="515" y="120" width="280" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="529" y="149" font-size="19" fill="#c1b2ea" text-anchor="start">心理專業</text><text x="529" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">合資格心理服務</text><rect x="215" y="360" width="430" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="229" y="389" font-size="19" fill="#ead68c" text-anchor="start">依功能、意願與需要合作</text><text x="229" y="417" font-size="15" fill="#e3e9e2" text-anchor="start">不必先證明自己夠嚴重</text><path d="M350 230L290 200" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.1 207.9L290 200L300.0 200.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 230L570 200" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560.0 199.5L570 200L563.4 207.5" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>