<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh03-title mh03-desc"><title id="mh03-title">學習可以有不同入口</title><desc id="mh03-desc">同一學習者可選閱讀、虛構案例或自願記錄；路徑是選擇，沒有強迫蒐集或必填個人資料。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 03  /  學習可以有不同入口</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="150" cy="225" rx="20" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M150 250V325M115 289L150 264 185 289M150 325L125 370M150 325L175 370" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 270L345 160" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M335.2 162.1L345 160L340.6 169.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 275L345 275" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M336.0 270.7L345 275L336.0 279.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 280L345 390" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.6 381.0L345 390L335.2 387.9" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="115" width="350" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="374" y="144" font-size="19" fill="#b7e89f" text-anchor="start">閱讀與看圖</text><text x="374" y="172" font-size="15" fill="#e3e9e2" text-anchor="start">不需私密資訊</text><rect x="360" y="235" width="350" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="374" y="264" font-size="19" fill="#ead68c" text-anchor="start">虛構案例</text><text x="374" y="292" font-size="15" fill="#e3e9e2" text-anchor="start">照樣能練習概念</text><rect x="360" y="355" width="350" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="374" y="384" font-size="19" fill="#c1b2ea" text-anchor="start">自願記錄</text><text x="374" y="412" font-size="15" fill="#e3e9e2" text-anchor="start">可拒絕、停止與另作選擇</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>