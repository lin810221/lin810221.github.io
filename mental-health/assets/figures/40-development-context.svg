<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh40-title mh40-desc"><title id="mh40-title">兒少與家庭：把需要放在發展和環境中</title><desc id="mh40-desc">不同尺寸人物表示發展與支持需求，並非成熟程度、能力或健康排名。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 40  /  兒少與家庭：把需要放在發展和環境中</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="165" cy="255" rx="12.4" ry="14.26" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M165 270.5V317.0M143.3 294.68L165 279.18 186.7 294.68M165 317.0L149.5 344.9M165 317.0L180.5 344.9" stroke="#9ac8e8" stroke-width="3.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="205" rx="19.0" ry="21.849999999999998" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M430 228.75V300.0M396.75 265.8L430 242.05 463.25 265.8M430 300.0L406.25 342.75M430 300.0L453.75 342.75" stroke="#b7e89f" stroke-width="4.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="690" cy="255" rx="12.4" ry="14.26" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M690 270.5V317.0M668.3 294.68L690 279.18 711.7 294.68M690 317.0L674.5 344.9M690 317.0L705.5 344.9" stroke="#c1b2ea" stroke-width="3.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 310Q430 150 650 310" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="420" font-size="22" fill="#e3e9e2" text-anchor="start">家庭、學校、同儕與生活條件共同影響。</text><text x="100" y="454" font-size="17" fill="#e3e9e2" text-anchor="start">年齡不是唯一解釋，也不以圖替人分類診斷。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>