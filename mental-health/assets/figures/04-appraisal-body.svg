<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh04-title mh04-desc"><title id="mh04-title">壓力評估與兩條反應路徑</title><desc id="mh04-desc">事件評估與資源連到中樞整合，圖分開自律神經與HPA代表路徑；兩者互相調節，不代表固定激素值。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 04  /  壓力評估與兩條反應路徑</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="55" y="115" width="310" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="69" y="144" font-size="19" fill="#9ac8e8" text-anchor="start">事件、評估與資源</text><text x="69" y="172" font-size="15" fill="#e3e9e2" text-anchor="start">身體反應是其中一部分</text><path d="M380 153L475 153" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M466.0 148.7L475 153L466.0 157.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="115" width="310" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="504" y="144" font-size="19" fill="#b7e89f" text-anchor="start">中樞整合與調節</text><text x="504" y="172" font-size="15" fill="#e3e9e2" text-anchor="start">多種訊號，不是只有一條路</text><path d="M600 205L600 250" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.3 241.0L600 250L595.7 241.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 205L245 250" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.6 252.8L245 250L253.2 244.3" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="265" width="320" height="145" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="95" y="303" font-size="23" fill="#c1b2ea" text-anchor="start">自律神經路徑</text><text x="95" y="345" font-size="20" fill="#e3e9e2" text-anchor="start">對靶器官的調節</text><text x="95" y="382" font-size="18" fill="#e3e9e2" text-anchor="start">效應依器官與條件不同</text><rect x="475" y="265" width="325" height="145" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="495" y="297" font-size="23" fill="#ead68c" text-anchor="start">HPA代表路徑</text><text x="495" y="335" font-size="20" fill="#e3e9e2" text-anchor="start">下視丘 → 腦下垂體</text><text x="495" y="371" font-size="20" fill="#e3e9e2" text-anchor="start">→ 腎上腺皮質</text><text x="80" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">路徑互相調節；圖不提供個人激素值或固定反應時間。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>