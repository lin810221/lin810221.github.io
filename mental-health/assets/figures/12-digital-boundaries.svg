<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh12-title mh12-desc"><title id="mh12-title">資訊入口、通知與可調整界線</title><desc id="mh12-desc">裝置、任務與休息界線示意；用途、時點和生活需要比單一總時數更完整。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12  /  資訊入口、通知與可調整界線</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="90" y="120" width="170" height="285" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="110" y="150" width="130" height="205" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="115" y="392" font-size="20" fill="#9ac8e8" text-anchor="start">訊息入口</text><path d="M128 190h90" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 225h90" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 260h90" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 260L420 260" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M411.0 255.7L420 260L411.0 264.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="140" width="310" height="245" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="465" y="183" font-size="23" fill="#c1b2ea" text-anchor="start">先問用途與需要</text><text x="465" y="240" font-size="22" fill="#e3e9e2" text-anchor="start">現在？稍後？</text><text x="465" y="292" font-size="22" fill="#e3e9e2" text-anchor="start">可否協調通知？</text><text x="85" y="451" font-size="18" fill="#e3e9e2" text-anchor="start">不是用總時數診斷；也要看工作、照顧與可近性。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>