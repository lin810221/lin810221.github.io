<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh19-title mh19-desc"><title id="mh19-title">睡眠壓力與節律：兩個不同過程</title><desc id="mh19-desc">上方單調與波動線為任意概念曲線，表示睡眠壓力及節律不同；沒有實測刻度或個人睡眠限制。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19  /  睡眠壓力與節律：兩個不同過程</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 140V380H785" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 350Q390 300 725 170" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 265Q245 110 405 265T725 265" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="120" font-size="20" fill="#e3e9e2" text-anchor="start">概念過程，任意縱軸</text><text x="445" y="166" font-size="20" fill="#ead68c" text-anchor="start">睡眠壓力</text><text x="440" y="320" font-size="20" fill="#c1b2ea" text-anchor="start">節律訊號</text><text x="95" y="434" font-size="18" fill="#e3e9e2" text-anchor="start">時間順序 →；機會、環境與個別需要仍需另外考量。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>