<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh20-title mh20-desc"><title id="mh20-title">活動、飲食、物質與生活支持</title><desc id="mh20-desc">人處在多種日常條件中，圖表示可能互相影響，不用單一成分或行為解釋所有情緒。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20  /  活動、飲食、物質與生活支持</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="263" rx="113" ry="55" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="269" font-size="23" fill="#b7e89f" text-anchor="middle">日常生活</text><rect x="70" y="121" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="84" y="150" font-size="19" fill="#9ac8e8" text-anchor="start">可近的活動</text><text x="84" y="178" font-size="15" fill="#e3e9e2" text-anchor="start">能力、環境與偏好</text><path d="M300 159L320 247" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.2 237.3L320 247L313.8 239.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="121" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="584" y="150" font-size="19" fill="#ead68c" text-anchor="start">飲食與物質</text><text x="584" y="178" font-size="15" fill="#e3e9e2" text-anchor="start">時間、用途與反應</text><path d="M540 247L560 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M553.8 166.8L560 159L562.2 168.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="337" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="84" y="366" font-size="19" fill="#c1b2ea" text-anchor="start">睡眠與機會</text><text x="84" y="394" font-size="15" fill="#e3e9e2" text-anchor="start">班表與照顧需求</text><path d="M300 375L320 278" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M313.9 285.9L320 278L322.4 287.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="337" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="584" y="366" font-size="19" fill="#eda894" text-anchor="start">支持與資源</text><text x="584" y="394" font-size="15" fill="#e3e9e2" text-anchor="start">可調整的條件</text><path d="M540 278L560 375" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M562.4 365.3L560 375L553.9 367.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>