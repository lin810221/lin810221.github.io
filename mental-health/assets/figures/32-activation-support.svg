<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh32-title mh32-desc"><title id="mh32-title">低落、活動與支持的可能循環</title><desc id="mh32-desc">活動減少、機會減少及低落可互相影響，可加入支持和可行小步；不保證人人同一原因。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32  /  低落、活動與支持的可能循環</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="266" rx="123" ry="60" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="273" font-size="22" fill="#b7e89f" text-anchor="middle">生活中的互動</text><rect x="65" y="120" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="79" y="149" font-size="19" fill="#9ac8e8" text-anchor="start">低落或負擔</text><text x="79" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><rect x="570" y="120" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="584" y="149" font-size="19" fill="#ead68c" text-anchor="start">參與減少</text><text x="584" y="177" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><rect x="65" y="355" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="79" y="384" font-size="19" fill="#c1b2ea" text-anchor="start">回饋機會變少</text><text x="79" y="412" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><rect x="570" y="355" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="584" y="384" font-size="19" fill="#eda894" text-anchor="start">需要更多支持</text><text x="584" y="412" font-size="15" fill="#e3e9e2" text-anchor="start">互相影響，非單一原因</text><path d="M292 158L564 158" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 153.7L564 158L555.0 162.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 203L680 346" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M684.3 337.0L680 346L675.7 337.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M564 392L292 392" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.0 396.3L292 392L301.0 387.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 346L175 204" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.7 213.0L175 204L179.3 213.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="275" y="450" font-size="19" fill="#e3e9e2" text-anchor="start">小步要可行，不等於自己扛起全部照護。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>