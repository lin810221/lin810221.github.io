<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh38-title mh38-desc"><title id="mh38-title">支持網絡：不必只剩一個人</title><desc id="mh38-desc">當事人可連到親友、適當專業及即時醫療等支持，沒有把任何人設定為唯一全天候救援者。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 38  /  支持網絡：不必只剩一個人</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M150 160L420 300" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M700 160L420 300" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 390L420 300" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M700 390L420 300" stroke="#eda894" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="420" cy="250" rx="15.0" ry="17.25" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M420 268.75V325.0M393.75 298.0L420 279.25 446.25 298.0M420 325.0L401.25 358.75M420 325.0L438.75 358.75" stroke="#b7e89f" stroke-width="3.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="160" rx="70" ry="44" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="150" y="166" font-size="20" fill="#9ac8e8" text-anchor="middle">可信支持</text><ellipse cx="700" cy="160" rx="70" ry="44" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="700" y="166" font-size="20" fill="#c1b2ea" text-anchor="middle">合適專業</text><ellipse cx="150" cy="390" rx="70" ry="44" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="150" y="396" font-size="20" fill="#ead68c" text-anchor="middle">實務協助</text><ellipse cx="700" cy="390" rx="70" ry="44" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="700" y="396" font-size="20" fill="#eda894" text-anchor="middle">即時醫療</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>