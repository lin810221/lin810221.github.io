<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh18-title mh18-desc"><title id="mh18-title">自我回應與方法偏好</title><desc id="mh18-desc">自責不是唯一回應，技能選擇還要看目的、負擔及當事人偏好；沒有規定每人都喜歡同一方法。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18  /  自我回應與方法偏好</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="60" y="125" width="280" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="74" y="154" font-size="19" fill="#9ac8e8" text-anchor="start">發現現在很困難</text><text x="74" y="182" font-size="15" fill="#e3e9e2" text-anchor="start">可以先承認感受</text><path d="M105 201l-15 18 38-18" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="485" y="125" width="280" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="499" y="154" font-size="19" fill="#c1b2ea" text-anchor="start">我需要哪種支持？</text><text x="499" y="182" font-size="15" fill="#e3e9e2" text-anchor="start">也可以選別的方法</text><path d="M530 201l-15 18 38-18" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="200" cy="302" rx="13.0" ry="14.950000000000001" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M200 318.25V367.0M177.25 343.6L200 327.35 222.75 343.6M200 367.0L183.75 396.25M200 367.0L216.25 396.25" stroke="#9ac8e8" stroke-width="3.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="615" cy="302" rx="13.0" ry="14.950000000000001" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M615 318.25V367.0M592.25 343.6L615 327.35 637.75 343.6M615 367.0L598.75 396.25M615 367.0L631.25 396.25" stroke="#c1b2ea" stroke-width="3.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 163L470 163" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M461.0 158.7L470 163L461.0 167.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>