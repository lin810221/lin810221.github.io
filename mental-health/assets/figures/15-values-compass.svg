<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh15-title mh15-desc"><title id="mh15-title">價值像方向，目標像可回顧的站點</title><desc id="mh15-desc">羅盤方向代表所重視的行動品質，站點是具體目標；不以分數評價一個人的價值。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15  /  價值像方向，目標像可回顧的站點</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="280" cy="270" rx="130" ry="130" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M280 130V410M140 270H420" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 270L355 180" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.9 184.1L355 180L352.6 189.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="115" font-size="22" fill="#c1b2ea" text-anchor="start">方向：想如何行動</text><ellipse cx="490" cy="280" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="590" cy="220" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="720" cy="310" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M430 270L490 280 590 220 720 310" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="382" font-size="21" fill="#9ac8e8" text-anchor="start">站點：可觀察、可回顧</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>