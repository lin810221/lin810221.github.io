<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh11-title mh11-desc"><title id="mh11-title">事實、假設與可查證問題</title><desc id="mh11-desc">三張並列卡區分觀察、解釋與下一個問題，沒有把一種想法直接變成人格標籤。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11  /  事實、假設與可查證問題</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="50" y="135" width="280" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="64" y="164" font-size="19" fill="#9ac8e8" text-anchor="start">看到的事實</text><text x="64" y="192" font-size="15" fill="#e3e9e2" text-anchor="start">一次會議被打斷</text><path d="M95 211l-15 18 38-18" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="135" width="280" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="484" y="164" font-size="19" fill="#c1b2ea" text-anchor="start">腦中的解釋</text><text x="484" y="192" font-size="15" fill="#e3e9e2" text-anchor="start">可能原因尚未確認</text><path d="M515 211l-15 18 38-18" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M352 175L455 175" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M446.0 170.7L455 175L446.0 179.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="220" y="320" width="440" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="234" y="349" font-size="19" fill="#ead68c" text-anchor="start">哪些部分能補資料或協調？</text><text x="234" y="377" font-size="15" fill="#e3e9e2" text-anchor="start">也可以承認目前不知道</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>