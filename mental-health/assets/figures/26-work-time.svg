<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="mh26-title mh26-desc"><title id="mh26-title">時間帳本與工作條件</title><desc id="mh26-desc">已知安排與未知需求並列，時間差額不是心理容量；公平、自主和角色條件不能全縮成分鐘。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 26  /  時間帳本與工作條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="70" y="130" width="710" height="110" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="90" y="169" font-size="24" fill="#9ac8e8" text-anchor="start">已排定的可用時段</text><text x="90" y="207" font-size="18" fill="#e3e9e2" text-anchor="start">需要扣除已知責任與安排</text><rect x="70" y="285" width="450" height="105" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="92" y="329" font-size="23" fill="#ead68c" text-anchor="start">已知任務</text><rect x="540" y="285" width="240" height="105" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="568" y="329" font-size="23" fill="#c1b2ea" text-anchor="start">未知任務 ？</text><text x="85" y="442" font-size="19" fill="#e3e9e2" text-anchor="start">缺漏會傳播；數字齊全也不代表工作條件已公平。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>