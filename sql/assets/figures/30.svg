<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SCD重疊不應由任意挑選掩蓋</title><desc id="desc">追蹤垂直事實時點穿過兩個有效版本，確認候選數為二，應修復歷史而非任選一筆。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">SCD重疊不應由任意挑選掩蓋</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><text x="80" y="185" font-size="27" fill="#ef9eaa" text-anchor="start">同一客戶，兩版區間重疊</text><rect x="130" y="240" width="670" height="75" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><rect x="590" y="370" width="500" height="75" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><rect x="590" y="220" width="210" height="250" rx="8" fill="#41242a" stroke="#ef9eaa" stroke-width="2"/><text x="350" y="285" font-size="26" fill="#89c9e8" text-anchor="middle">舊版</text><text x="930" y="415" font-size="26" fill="#b8e895" text-anchor="middle">新版</text><path d="M690 200L690 515" fill="none" stroke="#eebc79" stroke-width="2" stroke-dasharray="6 5"/><text x="690" y="560" font-size="27" fill="#eebc79" text-anchor="middle">此時點配到2版 → 品質閘門拒絕</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">空窗為零配對，同樣不是可直接發布的成功結果。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>