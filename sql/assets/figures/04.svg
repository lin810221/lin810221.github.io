<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">用約束保護可表達的資料契約</title><desc id="desc">從唯一客戶鍵走向訂單外鍵，再檢查重複鍵、不存在的關聯與非法欄位值會在哪裡被拒絕。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">用約束保護可表達的資料契約</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="90" y="230" width="280" height="130" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="230.0" y="287.5" font-size="22" fill="#89c9e8" text-anchor="middle">customers</text><text x="230.0" y="316.5" font-size="22" fill="#89c9e8" text-anchor="middle">PK customer_id</text><path d="M370 295L620 295" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="230" width="440" height="130" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="870.0" y="287.5" font-size="22" fill="#b8e895" text-anchor="middle">orders</text><text x="870.0" y="316.5" font-size="22" fill="#b8e895" text-anchor="middle">FK customer_id；PK order_id</text><rect x="200" y="420" width="440" height="49" fill="#17221b" stroke="#536458"/><text x="212" y="452" font-size="20" fill="#89c9e8" text-anchor="start">待寫入案例</text><rect x="640" y="420" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="652" y="452" font-size="20" fill="#89c9e8" text-anchor="start">結果</text><rect x="200" y="469" width="440" height="49" fill="#17221b" stroke="#536458"/><text x="212" y="501" font-size="20" fill="#a9b9ae" text-anchor="start">重複order_id</text><rect x="640" y="469" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="652" y="501" font-size="20" fill="#a9b9ae" text-anchor="start">拒絕</text><rect x="200" y="518" width="440" height="49" fill="#17221b" stroke="#536458"/><text x="212" y="550" font-size="20" fill="#a9b9ae" text-anchor="start">不存在的customer_id</text><rect x="640" y="518" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="652" y="550" font-size="20" fill="#a9b9ae" text-anchor="start">拒絕</text><rect x="200" y="567" width="440" height="49" fill="#17221b" stroke="#536458"/><text x="212" y="599" font-size="20" fill="#a9b9ae" text-anchor="start">負金額或必要空值</text><rect x="640" y="567" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="652" y="599" font-size="20" fill="#a9b9ae" text-anchor="start">拒絕</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">CHECK不等於NOT NULL；跨列業務規則仍需另行驗證。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>