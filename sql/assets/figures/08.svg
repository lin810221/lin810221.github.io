<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Fanout是配對乘法，不是隨機重複</title><desc id="desc">數出兩筆明細與兩筆退款形成的四格配對，再說明直接SUM為何重複，及先各自聚合如何修正。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">Fanout是配對乘法，不是隨機重複</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><text x="80" y="195" font-size="27" fill="#eebc79" text-anchor="start">訂單102：2筆商品 × 2筆退款</text><rect x="110" y="245" width="210" height="49" fill="#17221b" stroke="#536458"/><text x="122" y="277" font-size="20" fill="#89c9e8" text-anchor="start">商品金額</text><rect x="320" y="245" width="290" height="49" fill="#17221b" stroke="#536458"/><text x="332" y="277" font-size="20" fill="#89c9e8" text-anchor="start">退款1000</text><rect x="610" y="245" width="290" height="49" fill="#17221b" stroke="#536458"/><text x="622" y="277" font-size="20" fill="#89c9e8" text-anchor="start">退款500</text><rect x="110" y="294" width="210" height="49" fill="#17221b" stroke="#536458"/><text x="122" y="326" font-size="20" fill="#a9b9ae" text-anchor="start">3000</text><rect x="320" y="294" width="290" height="49" fill="#17221b" stroke="#536458"/><text x="332" y="326" font-size="20" fill="#a9b9ae" text-anchor="start">配對1</text><rect x="610" y="294" width="290" height="49" fill="#17221b" stroke="#536458"/><text x="622" y="326" font-size="20" fill="#a9b9ae" text-anchor="start">配對2</text><rect x="110" y="343" width="210" height="49" fill="#17221b" stroke="#536458"/><text x="122" y="375" font-size="20" fill="#a9b9ae" text-anchor="start">2000</text><rect x="320" y="343" width="290" height="49" fill="#17221b" stroke="#536458"/><text x="332" y="375" font-size="20" fill="#a9b9ae" text-anchor="start">配對3</text><rect x="610" y="343" width="290" height="49" fill="#17221b" stroke="#536458"/><text x="622" y="375" font-size="20" fill="#a9b9ae" text-anchor="start">配對4</text><path d="M540 415L540 475" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><text x="150" y="525" font-size="28" fill="#b8e895" text-anchor="start">先分別聚合：商品5000、退款1500、淨額3500</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">SUM DISTINCT金額會刪掉合法同值，不是通用修法。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>