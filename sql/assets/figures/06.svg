<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">分組平均需要回到原始分子分母</title><desc id="desc">獨立教學算例中兩組大小不同，使用總和與筆數重建整體平均，說明不可讓組別取得相同權重。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">分組平均需要回到原始分子分母</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="100" y="195" width="160" height="49" fill="#17221b" stroke="#536458"/><text x="112" y="227" font-size="20" fill="#89c9e8" text-anchor="start">組別</text><rect x="260" y="195" width="150" height="49" fill="#17221b" stroke="#536458"/><text x="272" y="227" font-size="20" fill="#89c9e8" text-anchor="start">筆數</text><rect x="410" y="195" width="220" height="49" fill="#17221b" stroke="#536458"/><text x="422" y="227" font-size="20" fill="#89c9e8" text-anchor="start">平均美分</text><rect x="630" y="195" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="642" y="227" font-size="20" fill="#89c9e8" text-anchor="start">總和</text><rect x="100" y="244" width="160" height="49" fill="#17221b" stroke="#536458"/><text x="112" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">A</text><rect x="260" y="244" width="150" height="49" fill="#17221b" stroke="#536458"/><text x="272" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">2</text><rect x="410" y="244" width="220" height="49" fill="#17221b" stroke="#536458"/><text x="422" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">4000</text><rect x="630" y="244" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="642" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">8000</text><rect x="100" y="293" width="160" height="49" fill="#17221b" stroke="#536458"/><text x="112" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">B</text><rect x="260" y="293" width="150" height="49" fill="#17221b" stroke="#536458"/><text x="272" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">1</text><rect x="410" y="293" width="220" height="49" fill="#17221b" stroke="#536458"/><text x="422" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">1000</text><rect x="630" y="293" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="642" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">1000</text><text x="120" y="430" font-size="27" fill="#ef9eaa" text-anchor="start">錯誤：兩個組平均再平均 → 2500</text><text x="120" y="500" font-size="27" fill="#b8e895" text-anchor="start">正確：總和9000 ÷ 總筆數3 → 3000</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">此圖是獨立算例；不是訂單fixture的平均金額。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>