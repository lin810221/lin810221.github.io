<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL兩種快照的雙連線對照</title><desc id="desc">沿讀取、另一連線提交與再次讀取三個時點，分辨Read Committed和Repeatable Read的可見值。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">PostgreSQL兩種快照的雙連線對照</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><text x="80" y="195" font-size="26" fill="#89c9e8" text-anchor="start">Reader先讀100</text><text x="80" y="370" font-size="26" fill="#eebc79" text-anchor="start">Writer提交200</text><path d="M90 245L1100 245" fill="none" stroke="#89c9e8" stroke-width="2" stroke-dasharray=""/><path d="M90 420L1100 420" fill="none" stroke="#eebc79" stroke-width="2" stroke-dasharray=""/><path d="M430 420L430 260" fill="none" stroke="#eebc79" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="285" font-size="25" fill="#b8e895" text-anchor="start">Read Committed再讀200</text><text x="630" y="470" font-size="25" fill="#b8e895" text-anchor="start">Repeatable Read再讀100</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">相同快照不等於所有跨列業務決策都可序列化。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>