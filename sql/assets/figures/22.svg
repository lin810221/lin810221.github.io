<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">來源版本勝出與衝突拒絕</title><desc id="desc">對每個業務鍵依來源序列選最新版本，另辨認相同版本不同內容的情況，不能用讀取順序冒充權威。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">來源版本勝出與衝突拒絕</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="75" y="190" width="110" height="49" fill="#17221b" stroke="#536458"/><text x="87" y="222" font-size="20" fill="#89c9e8" text-anchor="start">鍵</text><rect x="185" y="190" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="197" y="222" font-size="20" fill="#89c9e8" text-anchor="start">seq</text><rect x="315" y="190" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="327" y="222" font-size="20" fill="#89c9e8" text-anchor="start">值</text><rect x="75" y="239" width="110" height="49" fill="#17221b" stroke="#536458"/><text x="87" y="271" font-size="20" fill="#a9b9ae" text-anchor="start">1</text><rect x="185" y="239" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="197" y="271" font-size="20" fill="#a9b9ae" text-anchor="start">10</text><rect x="315" y="239" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="327" y="271" font-size="20" fill="#a9b9ae" text-anchor="start">old</text><rect x="75" y="288" width="110" height="49" fill="#17221b" stroke="#536458"/><text x="87" y="320" font-size="20" fill="#a9b9ae" text-anchor="start">1</text><rect x="185" y="288" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="197" y="320" font-size="20" fill="#a9b9ae" text-anchor="start">11</text><rect x="315" y="288" width="190" height="49" fill="#17221b" stroke="