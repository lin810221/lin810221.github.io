<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">物件權限與RLS的不同層次</title><desc id="desc">以受限角色追蹤租戶資料列，指出表級SELECT權限不等於可以讀取所有租戶，也不能用superuser代替驗收。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">物件權限與RLS的不同層次</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="75" y="250" width="300" height="100" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="225.0" y="292.5" font-size="22" fill="#89c9e8" text-anchor="middle">受限報表角色</text><text x="225.0" y="321.5" font-size="22" fill="#89c9e8" text-anchor="middle">非superuser</text><path d="M375 300L520 300" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="205" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="567" y="237" font-size="20" fill="#89c9e8" text-anchor="start">tenant</text><rect x="685" y="205" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="697" y="237" font-size="20" fill="#89c9e8" text-anchor="start">id</text><rect x="815" y="205" width="300" height="49" fill="#17221b" stroke="#536458"/><text x="827" y="237" font-size="20" fill="#89c9e8" text-anchor="start">政策結果</text><rect x="555" y="254" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="567" y="286" font-size="20" fill="#a9b9ae" text-anchor="start">10</text><rect x="685" y="254" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="697" y="286" font-size="20" fill="#a9b9ae" text-anchor="start">1</text><rect x="815" y="254" width="300" height="49" fill="#22382b" stroke="#536458"/><text x="827" y="286" font-size="20" fill="#b8e895" text-anchor="start">允許</text><rect x="555" y="303" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="567" y="335" font-size="20" fill="#a9b9ae" text-anchor="start">20</text><rect x="685" y="303" width="130" height="49" fill="#17221b" stroke="#536458"/><text x="697" y="335" font-size="20" fill="#a9b9ae" text-anchor="start">2</text><rect x="815" y="303" width="300" height="49" fill="#17221b" stroke="#536458"/><text x="827" y="335" font-size="20" fill="#ef9eaa" text-anchor="start">不允許</text><text x="120" y="500" font-size="27" fill="#b8e895" text-anchor="start">GRANT決定物件權限；RLS再限制資料列</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">匯出檔案不會自動繼承原資料庫的RLS政策。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>