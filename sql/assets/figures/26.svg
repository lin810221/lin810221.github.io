<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">有限重試的等待預算</title><desc id="desc">從五次嘗試數出只有四個間隔，核對上限退避的等待時間，並把等待與工作耗時分開。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">有限重試的等待預算</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="70" y="235" width="160" height="100" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="150.0" y="277.5" font-size="22" fill="#ef9eaa" text-anchor="middle">嘗試1</text><text x="150.0" y="306.5" font-size="22" fill="#ef9eaa" text-anchor="middle">暫時失敗</text><path d="M230 285L285 285" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><text x="257" y="385" font-size="24" fill="#eebc79" text-anchor="middle">1</text><rect x="295" y="235" width="160" height="100" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="375.0" y="277.5" font-size="22" fill="#ef9eaa" text-anchor="middle">嘗試2</text><text x="375.0" y="306.5" font-size="22" fill="#ef9eaa" text-anchor="middle">暫時失敗</text><path d="M455 285L510 285" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><text x="482" y="385" font-size="24" fill="#eebc79" text-anchor="middle">2</text><rect x="520" y="235" width="160" height="100" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="600.0" y="277.5" font-size="22" fill="#ef9eaa" text-anchor="middle">嘗試3</text><text x="600.0" y="306.5" font-size="22" fill="#ef9eaa" text-anchor="middle">暫時失敗</text><path d="M680 285L735 285" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><text x="707" y="385" font-size="24" fill="#eebc79" text-anchor="middle">4</text><rect x="745" y="235" width="160" height="100" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="825.0" y="277.5" font-size="22" fill="#ef9eaa" text-anchor="middle">嘗試4</text><text x="825.0" y="306.5" font-size="22" fill="#ef9eaa" text-anchor="middle">暫時失敗</text><path d="M905 285L960 285" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><text x="932" y="385" font-size="24" fill="#eebc79" text-anchor="middle">4</text><rect x="970" y="235" width="160" height="100" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="1050.0" y="277.5" font-size="22" fill="#b8e895" text-anchor="middle">嘗試5</text><text x="1050.0" y="306.5" font-size="22" fill="#b8e895" text-anchor="middle">成功</text><text x="130" y="485" font-size="28" fill="#b8e895" text-anchor="start">四次等待：1、2、4、4秒；合計11秒</text><text x="130" y="545" font-size="25" fill="#a9b9ae" text-anchor="start">未包含工作時間與連線超時</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">永久輸入錯誤不應進入同一個重試迴圈。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>