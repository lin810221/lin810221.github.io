<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Raw與typed staging保留不同證據</title><desc id="desc">比較非法文字與來源空值在轉型後都可能變成NULL，必須用原始欄位保留不同失敗原因。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">Raw與typed staging保留不同證據</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="70" y="200" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="82" y="232" font-size="20" fill="#89c9e8" text-anchor="start">原始id</text><rect x="260" y="200" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="272" y="232" font-size="20" fill="#89c9e8" text-anchor="start">原始金額</text><rect x="70" y="249" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="82" y="281" font-size="20" fill="#a9b9ae" text-anchor="start">001</text><rect x="260" y="249" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="272" y="281" font-size="20" fill="#a9b9ae" text-anchor="start">12.50</text><rect x="70" y="298" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="82" y="330" font-size="20" fill="#a9b9ae" text-anchor="start">002</text><rect x="260" y="298" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="272" y="330" font-size="20" fill="#a9b9ae" text-anchor="start">oops</text><rect x="70" y="347" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="82" y="379" font-size="20" fill="#a9b9ae" text-anchor="start">003</text><rect x="260" y="347" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="272" y="379" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><path d="M535 335L665 335" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="200" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="722" y="232" font-size="20" fill="#89c9e8" text-anchor="start">解析值</text><rect x="900" y="200" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="912" y="232" font-size="20" fill="#89c9e8" text-anchor="start">結果</text><rect x="710" y="249" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="722" y="281" font-size="20" fill="#a9b9ae" text-anchor="start">12.50</text><rect x="900" y="249" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="912" y="281" font-size="20" fill="#a9b9ae" text-anchor="start">valid</text><rect x="710" y="298" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="722" y="330" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><rect x="900" y="298" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="912" y="330" font-size="20" fill="#a9b9ae" text-anchor="start">invalid</text><rect x="710" y="347" width="190" height="49" fill="#17221b" stroke="#536458"/><text x="722" y="379" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><rect x="900" y="347" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="912" y="379" font-size="20" fill="#a9b9ae" text-anchor="start">missing</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">轉型成功只是品質的一部分，不能靜默補零。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>