<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Parquet的欄位與列組</title><desc id="desc">找出只需要金額且日期相交的候選區塊，理解投影和列組裁剪是不同維度，並非保證所有查詢只讀一格。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">Parquet的欄位與列組</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><text x="140" y="185" font-size="24" fill="#89c9e8" text-anchor="start">id</text><text x="365" y="185" font-size="24" fill="#89c9e8" text-anchor="start">時間</text><text x="595" y="185" font-size="24" fill="#b8e895" text-anchor="start">金額</text><text x="835" y="185" font-size="24" fill="#89c9e8" text-anchor="start">備註</text><rect x="100" y="220" width="210" height="115" rx="8" fill="#17221b" stroke="#a9b9ae" stroke-width="2"/><text x="205" y="285" font-size="22" fill="#a9b9ae" text-anchor="middle">列組1</text><rect x="335" y="220" width="210" height="115" rx="8" fill="#17221b" stroke="#a9b9ae" stroke-width="2"/><text x="440" y="285" font-size="22" fill="#a9b9ae" text-anchor="middle">列組1</text><rect x="570" y="220" width="210" height="115" rx="8" fill="#23382b" stroke="#b8e895" stroke-width="2"/><text x="675" y="285" font-size="22" fill="#b8e895" text-anchor="middle">列組1</text><rect x="805" y="220" width="210" height="115" rx="8" fill="#17221b" stroke="#a9b9ae" stroke-width="2"/><text x="910" y="285" font-size="22" fill="#a9b9ae" text-anchor="middle">列組1</text><rect x="100" y="370" width="210" height="115" rx="8" fill="#17221b" stroke="#a9b9ae" stroke-width="2"/><text x="205" y="435" font-size="22" fill="#a9b9ae" text-anchor="middle">列組2</text><rect x="335" y="370" width="210" height="115" rx="8" fill="#17221b" stroke="#a9b9ae" stroke-width="2"/><text x="440" y="435" font-size="22" fill="#a9b9ae" text-anchor="middle">列組2</text><rect x="570" y="370" width="210" height="115" rx="8" fill="#17221b" stroke="#a9b9ae" stroke-width="2"/><text x="675" y="435" font-size="22" fill="#a9b9ae" text-anchor="middle">列組2</text><rect x="805" y="370" width="210" height="115" rx="8" fill="#17221b" stroke="#a9b9ae" stroke-width="2"/><text x="910" y="435" font-size="22" fill="#a9b9ae" text-anchor="middle">列組2</text><text x="120" y="565" font-size="25" fill="#eebc79" text-anchor="start">必要欄位 × 相交列組；實際裁剪看metadata與計畫</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">區塊大小是結構示意，不代表真實壓縮或I/O比例。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>