<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">工作依賴與DAG驗證</title><desc id="desc">由兩個來源追蹤到staging及品質發布，辨認紅色回邊會構成循環，圖的合法性不等於資料正確。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">工作依賴與DAG驗證</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="70" y="190" width="250" height="80" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="195.0" y="237.0" font-size="22" fill="#89c9e8" text-anchor="middle">擷取A</text><rect x="70" y="420" width="250" height="80" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="195.0" y="467.0" font-size="22" fill="#89c9e8" text-anchor="middle">擷取B</text><rect x="455" y="305" width="250" height="90" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="580.0" y="357.0" font-size="22" fill="#b8e895" text-anchor="middle">staging</text><rect x="865" y="305" width="260" height="90" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="995.0" y="357.0" font-size="22" fill="#eebc79" text-anchor="middle">品質與發布</text><path d="M320 230L435 330" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 460L435 365" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><path d="M705 350L845 350" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><path d="M980 305L980 170" fill="none" stroke="#ef9eaa" stroke-width="2" stroke-dasharray="7 5"/><path d="M980 170L180 170" fill="none" stroke="#ef9eaa" stroke-width="2" stroke-dasharray="7 5"/><text x="440" y="540" font-size="25" fill="#ef9eaa" text-anchor="start">循環或未知依賴：開始執行前拒絕</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">手動執行器會跑真實工作，但不是排程服務。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>