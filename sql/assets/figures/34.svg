<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">發布邊界與三種故障狀態</title><desc id="desc">以首次發布來源0到4為例，比對提交前、提交後與指標替換後的狀態，說明恢復不能再次套用業務變更。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">發布邊界與三種故障狀態</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="70.0" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="189.375" y="243.5" font-size="22" fill="#89c9e8" text-anchor="middle">DB提交</text><text x="189.375" y="272.5" font-size="22" fill="#89c9e8" text-anchor="middle">含pending</text><path d="M308.75 251L337.75 251" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="343.75" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="463.125" y="243.5" font-size="22" fill="#b8e895" text-anchor="middle">寫Parquet</text><text x="463.125" y="272.5" font-size="22" fill="#b8e895" text-anchor="middle">尚未公開</text><path d="M582.5 251L611.5 251" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="617.5" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="736.875" y="243.5" font-size="22" fill="#eebc79" text-anchor="middle">驗證manifest</text><text x="736.875" y="272.5" font-size="22" fill="#eebc79" text-anchor="middle">不可變版本</text><path d="M856.25 251L885.25 251" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="891.25" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1010.625" y="243.5" font-size="22" fill="#ef9eaa" text-anchor="middle">替換current</text><text x="1010.625" y="272.5" font-size="22" fill="#ef9eaa" text-anchor="middle">再標記完成</text><rect x="120" y="405" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="132" y="437" font-size="20" fill="#89c9e8" text-anchor="start">失敗點</text><rect x="390" y="405" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="402" y="437" font-size="20" fill="#89c9e8" text-anchor="start">DB位置</text><rect x="630" y="405" width="430" height="49" fill="#17221b" stroke="#536458"/><text x="642" y="437" font-size="20" fill="#89c9e8" text-anchor="start">公開版本</text><rect x="120" y="454" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="132" y="486" font-size="20" fill="#a9b9ae" text-anchor="start">提交前</text><rect x="390" y="454" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="402" y="486" font-size="20" fill="#a9b9ae" text-anchor="start">0</text><rect x="630" y="454" width="430" height="49" fill="#17221b" stroke="#536458"/><text x="642" y="486" font-size="20" fill="#a9b9ae" text-anchor="start">無新版本</text><rect x="120" y="503" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="132" y="535" font-size="20" fill="#a9b9ae" text-anchor="start">提交後</text><rect x="390" y="503" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="402" y="535" font-size="20" fill="#a9b9ae" text-anchor="start">4</text><rect x="630" y="503" width="430" height="49" fill="#17221b" stroke="#536458"/><text x="642" y="535" font-size="20" fill="#a9b9ae" text-anchor="start">等待恢復</text><rect x="120" y="552" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="132" y="584" font-size="20" fill="#a9b9ae" text-anchor="start">指標後</text><rect x="390" y="552" width="240" height="49" fill="#17221b" stroke="#536458"/><text x="402" y="584" font-size="20" fill="#a9b9ae" text-anchor="start">4</text><rect x="630" y="552" width="430" height="49" fill="#17221b" stroke="#536458"/><text x="642" y="584" font-size="20" fill="#a9b9ae" text-anchor="start">位置4，可完成標記</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">此圖為首次發布；程序中斷測試不等於所有斷電或分散式故障。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>