<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">逐鍵對帳避免差異互相抵消</title><desc id="desc">在故意修改的反例中找出正負100的兩筆差異，說明只核對全體總額會漏掉個別錯誤。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">逐鍵對帳避免差異互相抵消</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="95" y="190" width="170" height="49" fill="#17221b" stroke="#536458"/><text x="107" y="222" font-size="20" fill="#89c9e8" text-anchor="start">訂單</text><rect x="265" y="190" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="277" y="222" font-size="20" fill="#89c9e8" text-anchor="start">訂單金額</text><rect x="515" y="190" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="527" y="222" font-size="20" fill="#89c9e8" text-anchor="start">明細總額</text><rect x="765" y="190" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="777" y="222" font-size="20" fill="#89c9e8" text-anchor="start">差異</text><rect x="95" y="239" width="170" height="49" fill="#17221b" stroke="#536458"/><text x="107" y="271" font-size="20" fill="#a9b9ae" text-anchor="start">101</text><rect x="265" y="239" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="277" y="271" font-size="20" fill="#a9b9ae" text-anchor="start">3000</text><rect x="515" y="239" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="527" y="271" font-size="20" fill="#a9b9ae" text-anchor="start">3000</text><rect x="765" y="239" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="777" y="271" font-size="20" fill="#a9b9ae" text-anchor="start">0</text><rect x="95" y="288" width="170" height="49" fill="#17221b" stroke="#536458"/><text x="107" y="320" font-size="20" fill="#a9b9ae" text-anchor="start">102</text><rect x="265" y="288" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="277" y="320" font-size="20" fill="#a9b9ae" text-anchor="start">5100</text><rect x="515" y="288" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="527" y="320" font-size="20" fill="#a9b9ae" text-anchor="start">5000</text><rect x="765" y="288" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="777" y="320" font-size="20" fill="#ef9eaa" text-anchor="start">100</text><rect x="95" y="337" width="170" height="49" fill="#17221b" stroke="#536458"/><text x="107" y="369" font-size="20" fill="#a9b9ae" text-anchor="start">103</text><rect x="265" y="337" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="277" y="369" font-size="20" fill="#a9b9ae" text-anchor="start">1900</text><rect x="515" y="337" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="527" y="369" font-size="20" fill="#a9b9ae" text-anchor="start">2000</text><rect x="765" y="337" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="777" y="369" font-size="20" fill="#ef9eaa" text-anchor="start">-100</text><text x="130" y="500" font-size="27" fill="#eebc79" text-anchor="start">故意修改的反例：總差異0，但兩筆訂單仍然錯誤</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">正常fixture每筆差異為零；本圖特別示範失敗資料。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>