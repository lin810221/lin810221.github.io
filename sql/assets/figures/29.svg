<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">星型模型中的鍵與時間角色</title><desc id="desc">找到事實主鍵和歷史維度代理鍵，解釋多個客戶版本不應讓同一筆訂單多配對。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">星型模型中的鍵與時間角色</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="420" y="235" width="350" height="150" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="595.0" y="288.0" font-size="22" fill="#b8e895" text-anchor="middle">fact_order</text><text x="595.0" y="317.0" font-size="22" fill="#b8e895" text-anchor="middle">PK order_id</text><text x="595.0" y="346.0" font-size="22" fill="#b8e895" text-anchor="middle">FK customer_sk</text><rect x="65" y="205" width="270" height="100" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="200.0" y="247.5" font-size="22" fill="#89c9e8" text-anchor="middle">dim_customer</text><text x="200.0" y="276.5" font-size="22" fill="#89c9e8" text-anchor="middle">版本代理鍵</text><path d="M335 255L400 285" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="235" width="245" height="110" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="1012.5" y="282.5" font-size="22" fill="#eebc79" text-anchor="middle">region mart</text><text x="1012.5" y="311.5" font-size="22" fill="#eebc79" text-anchor="middle">口徑與粒度</text><path d="M770 310L870 290" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><text x="200" y="480" font-size="27" fill="#89c9e8" text-anchor="start">同一業務客戶可有多個有效時間版本</text><text x="200" y="540" font-size="27" fill="#b8e895" text-anchor="start">每筆事實仍需恰好配一個歷史版本</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">本課實作保存order_day；日期維度可按任務另行擴充。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>