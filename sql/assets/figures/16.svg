<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SCD2以半開區間唯一配對</title><desc id="desc">共享邊界11月2日屬於南部新版本，追蹤101和102各自配到的歷史版本，不能用目前地區代替。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">SCD2以半開區間唯一配對</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><text x="80" y="195" font-size="27" fill="#b8e895" text-anchor="start">客戶1的有效地區</text><path d="M120 315L1090 315" fill="none" stroke="#a9b9ae" stroke-width="2" stroke-dasharray=""/><rect x="120" y="255" width="460" height="100" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="350" y="315" font-size="30" fill="#89c9e8" text-anchor="middle">north</text><rect x="580" y="255" width="510" height="100" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="835" y="315" font-size="30" fill="#b8e895" text-anchor="middle">south</text><path d="M580 220L580 470" fill="none" stroke="#eebc79" stroke-width="2" stroke-dasharray="7 5"/><text x="580" y="505" font-size="24" fill="#eebc79" text-anchor="middle">11/02 00:00</text><text x="160" y="425" font-size="24" fill="#89c9e8" text-anchor="start">101：11/01 → north</text><text x="690" y="425" font-size="24" fill="#b8e895" text-anchor="start">102：11/02 → south</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">包含valid_from，不包含valid_to；重疊或空窗都需驗收。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>