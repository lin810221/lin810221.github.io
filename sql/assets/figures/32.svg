<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">追溯與恢復都需要可讀回證據</title><desc id="desc">沿來源到manifest再回讀，並在獨立恢復時間算例中區分資料落後和服務恢復時間。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">追溯與恢復都需要可讀回證據</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="70.0" y="210" width="238.75" height="92" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="189.375" y="263.0" font-size="22" fill="#89c9e8" text-anchor="middle">來源版本</text><path d="M308.75 256L337.75 256" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="343.75" y="210" width="238.75" height="92" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="463.125" y="263.0" font-size="22" fill="#b8e895" text-anchor="middle">模型與品質</text><path d="M582.5 256L611.5 256" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="617.5" y="210" width="238.75" height="92" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="736.875" y="263.0" font-size="22" fill="#eebc79" text-anchor="middle">產物manifest</text><path d="M856.25 256L885.25 256" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="891.25" y="210" width="238.75" height="92" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1010.625" y="263.0" font-size="22" fill="#ef9eaa" text-anchor="middle">回讀驗證</text><path d="M110 465L1090 465" fill="none" stroke="#a9b9ae" stroke-width="2" stroke-dasharray=""/><text x="170" y="430" font-size="23" fill="#89c9e8" text-anchor="start">11:55可恢復位置</text><text x="565" y="430" font-size="23" fill="#ef9eaa" text-anchor="start">12:00故障</text><text x="910" y="430" font-size="23" fill="#b8e895" text-anchor="start">12:20恢復</text><text x="200" y="555" font-size="25" fill="#eebc79" text-anchor="start">資料落後5分鐘</text><text x="730" y="555" font-size="25" fill="#eebc79" text-anchor="start">恢復時間20分鐘</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">檔案存在、雜湊一致、資料可用與恢復目標是不同驗收。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>