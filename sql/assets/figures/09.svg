<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">CTE讓中間粒度可以被檢查</title><desc id="desc">沿商品與退款兩條分支觀察粒度先縮成每訂單一列，再連到訂單主表，逐層核對唯一性。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">CTE讓中間粒度可以被檢查</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="90" y="185" width="300" height="80" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="240.0" y="232.0" font-size="22" fill="#89c9e8" text-anchor="middle">items：每明細一列</text><rect x="90" y="405" width="300" height="80" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="240.0" y="452.0" font-size="22" fill="#eebc79" text-anchor="middle">refunds：每退款一列</text><path d="M390 225L520 225" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="545" y="185" width="300" height="80" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="695.0" y="232.0" font-size="22" fill="#b8e895" text-anchor="middle">item_totals：每訂單</text><path d="M390 445L520 445" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="545" y="405" width="300" height="80" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="695.0" y="452.0" font-size="22" fill="#b8e895" text-anchor="middle">refund_totals：每訂單</text><path d="M845 225L960 315" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><path d="M845 445L960 365" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="945" y="285" width="190" height="120" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="1040.0" y="337.5" font-size="22" fill="#89c9e8" text-anchor="middle">orders</text><text x="1040.0" y="366.5" font-size="22" fill="#89c9e8" text-anchor="middle">每訂單一列</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">CTE命名不代表一定物化；物理計畫仍需檢查。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>