eight="49" fill="#17221b" stroke="#536458"/><text x="92" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">2</text><rect x="230" y="293" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="242" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">4 → 8</text><rect x="460" y="293" width="350" height="49" fill="#17221b" stroke="#536458"/><text x="472" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">更正、刪除、新增</text><rect x="810" y="293" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="822" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">11500</text><text x="110" y="435" font-size="27" fill="#b8e895" text-anchor="start">批次識別 + 固定payload + 閉合來源範圍</text><text x="110" y="520" font-size="28" fill="#eebc79" text-anchor="start">舊批重播不倒退最新公開指標</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">這是另一份專題fixture，不與基本SQL商店數字混用。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>