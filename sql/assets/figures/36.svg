<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">升版與交接保留可重新執行的證據</title><desc id="desc">沿四種不同版本追蹤變動，再說明哪一組反例與恢復測試能證明語意在升級後仍成立。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">升版與交接保留可重新執行的證據</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="70.0" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="189.375" y="258.0" font-size="22" fill="#89c9e8" text-anchor="middle">來源契約</text><path d="M308.75 251L337.75 251" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="343.75" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="463.125" y="258.0" font-size="22" fill="#b8e895" text-anchor="middle">schema版本</text><path d="M582.5 251L611.5 251" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="617.5" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="736.875" y="258.0" font-size="22" fill="#eebc79" text-anchor="middle">模型版本</text><path d="M856.25 251L885.25 251" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="891.25" y="205" width="238.75" height="92" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1010.625" y="258.0" font-size="22" fill="#ef9eaa" text-anchor="middle">產物版本</text><rect x="100" y="430" width="430" height="90" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="315.0" y="482.0" font-size="22" fill="#b8e895" text-anchor="middle">最小反例 + 對帳 + 恢復測試</text><path d="M530 475L700 475" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="725" y="430" width="370" height="90" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="910.0" y="482.0" font-size="22" fill="#eebc79" text-anchor="middle">通過才切換；保留回復</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">程式版本回退不會自動還原schema與已改寫資料。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>