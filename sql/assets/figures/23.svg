<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">來源範圍與邊界的包含方式</title><desc id="desc">辨認本課序列範圍不包含after而包含through，再與日期半開區間對照，避免把兩個契約混成同一條件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">來源範圍與邊界的包含方式</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><path d="M110 290L1090 290" fill="none" stroke="#a9b9ae" stroke-width="2" stroke-dasharray=""/><circle cx="280" cy="290" r="14" fill="#101713" stroke="#89c9e8" stroke-width="3"/><circle cx="850" cy="290" r="14" fill="#b8e895"/><text x="280" y="240" font-size="26" fill="#89c9e8" text-anchor="middle">after_seq</text><text x="850" y="240" font-size="26" fill="#b8e895" text-anchor="middle">through_seq</text><text x="570" y="375" font-size="29" fill="#eebc79" text-anchor="middle">來源位置：(after, through]</text><text x="130" y="495" font-size="26" fill="#a9b9ae" text-anchor="start">日期常用：[start, end)；兩種邊界不要混用</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">上界需要來源完整性證據，不只是目前看過的最大時間。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>