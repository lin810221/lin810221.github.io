<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">CDC新增、更正與刪除的位置</title><desc id="desc">追蹤八個合成來源事件，核對第二批不是只有新增，並指出墓碑為何要留下刪除版本證據。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">CDC新增、更正與刪除的位置</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="65" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="126.5" y="277.5" font-size="22" fill="#89c9e8" text-anchor="middle">1</text><text x="126.5" y="306.5" font-size="22" fill="#89c9e8" text-anchor="middle">101新增</text><rect x="205" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="266.5" y="277.5" font-size="22" fill="#89c9e8" text-anchor="middle">2</text><text x="266.5" y="306.5" font-size="22" fill="#89c9e8" text-anchor="middle">102新增</text><rect x="345" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="406.5" y="277.5" font-size="22" fill="#89c9e8" text-anchor="middle">3</text><text x="406.5" y="306.5" font-size="22" fill="#89c9e8" text-anchor="middle">103取消</text><rect x="485" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="546.5" y="277.5" font-size="22" fill="#89c9e8" text-anchor="middle">4</text><text x="546.5" y="306.5" font-size="22" fill="#89c9e8" text-anchor="middle">104新增</text><rect x="625" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="686.5" y="277.5" font-size="22" fill="#b8e895" text-anchor="middle">5</text><text x="686.5" y="306.5" font-size="22" fill="#b8e895" text-anchor="middle">102更正</text><rect x="765" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="826.5" y="277.5" font-size="22" fill="#ef9eaa" text-anchor="middle">6</text><text x="826.5" y="306.5" font-size="22" fill="#ef9eaa" text-anchor="middle">101刪除</text><rect x="905" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="966.5" y="277.5" font-size="22" fill="#b8e895" text-anchor="middle">7</text><text x="966.5" y="306.5" font-size="22" fill="#b8e895" text-anchor="middle">105新增</text><rect x="1045" y="230" width="123" height="110" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="1106.5" y="277.5" font-size="22" fill="#b8e895" text-anchor="middle">8</text><text x="1106.5" y="306.5" font-size="22" fill="#b8e895" text-anchor="middle">103付款</text><path d="M65 390L605 390" fill="none" stroke="#89c9e8" stroke-width="2" stroke-dasharray=""/><path d="M625 390L1165 390" fill="none" stroke="#b8e895" stroke-width="2" stroke-dasharray=""/><text x="320" y="440" font-size="25" fill="#89c9e8" text-anchor="middle">第一批到4</text><text x="890" y="440" font-size="25" fill="#b8e895" text-anchor="middle">第二批到8</text><text x="160" y="530" font-size="26" fill="#eebc79" text-anchor="start">墓碑保留101的來源版本；公開資料排除該列</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">seq是本課單一稠密合成序列，不是PostgreSQL LSN。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>