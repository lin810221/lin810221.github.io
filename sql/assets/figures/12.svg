<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">前後列的順序與NULL政策</title><desc id="desc">讀取三列測量值，對照第三列的前值，並辨認PostgreSQL 19與DuckDB空值選項的語法位置不同。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">前後列的順序與NULL政策</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="100" y="210" width="120" height="49" fill="#17221b" stroke="#536458"/><text x="112" y="242" font-size="20" fill="#89c9e8" text-anchor="start">id</text><rect x="220" y="210" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="232" y="242" font-size="20" fill="#89c9e8" text-anchor="start">value</text><rect x="400" y="210" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="412" y="242" font-size="20" fill="#89c9e8" text-anchor="start">預設前值</text><rect x="670" y="210" width="330" height="49" fill="#17221b" stroke="#536458"/><text x="682" y="242" font-size="20" fill="#89c9e8" text-anchor="start">跳過NULL前值</text><rect x="100" y="259" width="120" height="49" fill="#17221b" stroke="#536458"/><text x="112" y="291" font-size="20" fill="#a9b9ae" text-anchor="start">1</text><rect x="220" y="259" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="232" y="291" font-size="20" fill="#a9b9ae" text-anchor="start">10</text><rect x="400" y="259" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="412" y="291" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><rect x="670" y="259" width="330" height="49" fill="#17221b" stroke="#536458"/><text x="682" y="291" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><rect x="100" y="308" width="120" height="49" fill="#17221b" stroke="#536458"/><text x="112" y="340" font-size="20" fill="#a9b9ae" text-anchor="start">2</text><rect x="220" y="308" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="232" y="340" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><rect x="400" y="308" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="412" y="340" font-size="20" fill="#a9b9ae" text-anchor="start">10</text><rect x="670" y="308" width="330" height="49" fill="#17221b" stroke="#536458"/><text x="682" y="340" font-size="20" fill="#a9b9ae" text-anchor="start">10</text><rect x="100" y="357" width="120" height="49" fill="#17221b" stroke="#536458"/><text x="112" y="389" font-size="20" fill="#a9b9ae" text-anchor="start">3</text><rect x="220" y="357" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="232" y="389" font-size="20" fill="#a9b9ae" text-anchor="start">30</text><rect x="400" y="357" width="270" height="49" fill="#17221b" stroke="#536458"/><text x="412" y="389" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><rect x="670" y="357" width="330" height="49" fill="#22382b" stroke="#536458"/><text x="682" y="389" font-size="20" fill="#b8e895" text-anchor="start">10</text><text x="100" y="500" font-size="25" fill="#89c9e8" text-anchor="start">PostgreSQL 19：LAG(value) IGNORE NULLS</text><text x="100" y="550" font-size="25" fill="#eebc79" text-anchor="start">DuckDB：LAG(value IGNORE NULLS)</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">跳過空值沒有補回缺失測量，仍要保存品質資訊。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>