<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">型別、NULL與聚合分母</title><desc id="desc">逐列比較NULL、零和空字串，辨認一般比較、空值判定和COUNT如何處理它們。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">型別、NULL與聚合分母</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="90" y="195" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="102" y="227" font-size="20" fill="#89c9e8" text-anchor="start">輸入</text><rect x="270" y="195" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="282" y="227" font-size="20" fill="#89c9e8" text-anchor="start">一般等號比較</text><rect x="550" y="195" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="562" y="227" font-size="20" fill="#89c9e8" text-anchor="start">IS NULL</text><rect x="730" y="195" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="742" y="227" font-size="20" fill="#89c9e8" text-anchor="start">COUNT(column)</text><rect x="90" y="244" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="102" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">NULL</text><rect x="270" y="244" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="282" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">unknown</text><rect x="550" y="244" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="562" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">true</text><rect x="730" y="244" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="742" y="276" font-size="20" fill="#a9b9ae" text-anchor="start">不計入</text><rect x="90" y="293" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="102" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">0</text><rect x="270" y="293" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="282" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">可比較</text><rect x="550" y="293" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="562" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">false</text><rect x="730" y="293" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="742" y="325" font-size="20" fill="#a9b9ae" text-anchor="start">計入</text><rect x="90" y="342" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="102" y="374" font-size="20" fill="#a9b9ae" text-anchor="start">空字串</text><rect x="270" y="342" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="282" y="374" font-size="20" fill="#a9b9ae" text-anchor="start">可比較</text><rect x="550" y="342" width="180" height="49" fill="#17221b" stroke="#536458"/><text x="562" y="374" font-size="20" fill="#a9b9ae" text-anchor="start">false</text><rect x="730" y="342" width="280" height="49" fill="#17221b" stroke="#536458"/><text x="742" y="374" font-size="20" fill="#a9b9ae" text-anchor="start">計入</text><text x="120" y="460" font-size="26" fill="#eebc79" text-anchor="start">金額：整數美分或固定小數；未知金額不是零</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">WHERE只保留true；unknown不會自動變成true。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>