<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">資料與處理位置共同提交</title><desc id="desc">在交易邊界內找出四個變更，指出提交前失敗時為何資料與checkpoint都不能前進。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">資料與處理位置共同提交</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><rect x="70" y="185" width="1060" height="300" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="600.0" y="342.0" font-size="22" fill="#89c9e8" text-anchor="middle"></text><text x="100" y="225" font-size="27" fill="#89c9e8" text-anchor="start">同一個資料庫交易</text><rect x="70.0" y="290" width="238.75" height="92" rx="8" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="189.375" y="343.0" font-size="22" fill="#89c9e8" text-anchor="middle">raw事件</text><path d="M308.75 336L337.75 336" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="343.75" y="290" width="238.75" height="92" rx="8" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="463.125" y="343.0" font-size="22" fill="#b8e895" text-anchor="middle">目前狀態</text><path d="M582.5 336L611.5 336" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="617.5" y="290" width="238.75" height="92" rx="8" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="736.875" y="343.0" font-size="22" fill="#eebc79" text-anchor="middle">checkpoint</text><path d="M856.25 336L885.25 336" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="891.25" y="290" width="238.75" height="92" rx="8" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1010.625" y="343.0" font-size="22" fill="#ef9eaa" text-anchor="middle">outbox</text><path d="M600 485L380 550" fill="none" stroke="#ef9eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 485L880 550" fill="none" stroke="#b8e895" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="585" font-size="25" fill="#ef9eaa" text-anchor="start">失敗：全部回滾</text><text x="760" y="585" font-size="25" fill="#b8e895" text-anchor="start">成功：一起提交</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">檔案與外部服務不在這個資料庫交易框內。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>