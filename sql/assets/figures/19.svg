<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">CSV引號與schema必須一起處理</title><desc id="desc">將同一列CSV讀成三個合法欄位，指出引號中的逗號不是分隔，001也不是可任意轉型的整數。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="72" font-size="31" fill="#b8e895" text-anchor="start">CSV引號與schema必須一起處理</text><text x="60" y="119" font-size="20" fill="#a9b9ae" text-anchor="start">原創中文圖解 · 合成資料；依標籤讀取粒度、時間與提交邊界</text><text x="80" y="195" font-size="29" fill="#89c9e8" text-anchor="start">001,12.50,&quot;quoted, comma&quot;</text><rect x="80" y="265" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="92" y="297" font-size="20" fill="#89c9e8" text-anchor="start">外部識別</text><rect x="330" y="265" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="342" y="297" font-size="20" fill="#89c9e8" text-anchor="start">金額</text><rect x="560" y="265" width="470" height="49" fill="#17221b" stroke="#536458"/><text x="572" y="297" font-size="20" fill="#89c9e8" text-anchor="start">備註</text><rect x="80" y="314" width="250" height="49" fill="#17221b" stroke="#536458"/><text x="92" y="346" font-size="20" fill="#a9b9ae" text-anchor="start">001</text><rect x="330" y="314" width="230" height="49" fill="#17221b" stroke="#536458"/><text x="342" y="346" font-size="20" fill="#a9b9ae" text-anchor="start">12.50</text><rect x="560" y="314" width="470" height="49" fill="#17221b" stroke="#536458"/><text x="572" y="346" font-size="20" fill="#a9b9ae" text-anchor="start">quoted, comma</text><text x="90" y="440" font-size="26" fill="#ef9eaa" text-anchor="start">錯誤split：將合法逗號拆成額外欄位</text><text x="90" y="510" font-size="25" fill="#b8e895" text-anchor="start">明確schema：識別保留前導零，金額保留精度</text><text x="60" y="638" font-size="20" fill="#eebc79" text-anchor="start">使用成熟解析器，再對輸入與輸出筆數驗收。</text><text x="60" y="684" font-size="19" fill="#a9b9ae" text-anchor="start">2026-11-27 · SQL與資料工程 · 非實際負載、容量或時間比例</text></g></svg>