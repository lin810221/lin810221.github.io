<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-03-title public-03-desc"><title id="public-03-title">問題、機制、行動與回顧</title><desc id="public-03-desc">四個節點依序連接描述問題、提出機制、評估行動與執行追蹤，回饋線回到問題；中央的分母、族群和公平提醒每一步都需要清楚定義。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 03 / 問題、機制、行動與回顧</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">迴圈表示工作回饋；順序可重疊，不是等研究完才保護健康。</text><rect x="70" y="125" width="285" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="212.5" y="160" font-size="20" fill="#9ac8e8" text-anchor="middle">描述：人、時、地</text><rect x="505" y="125" width="285" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="647.5" y="160" font-size="20" fill="#b7e89f" text-anchor="middle">解釋：機制與比較</text><rect x="505" y="340" width="285" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="647.5" y="375" font-size="20" fill="#ead68c" text-anchor="middle">行動：評估與執行</text><rect x="70" y="340" width="285" height="55" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="212.5" y="375" font-size="20" fill="#c1b2ea" text-anchor="middle">回顧：覆蓋與結果</text><path d="M370 151L490 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M481.0 146.7L490 151L481.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M648 194L648 322" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M652.3 313.0L648 322L643.7 313.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 366L370 366" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M379.0 370.3L370 366L379.0 361.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 322L212 194" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.7 203.0L212 194L216.3 203.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="260" rx="120" ry="60" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="251" font-size="21" fill="#b7e89f" text-anchor="middle">族群・分母</text><text x="430" y="285" font-size="21" fill="#b7e89f" text-anchor="middle">公平與未知</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>