<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-50-title public-50-desc"><title id="public-50-title">落地是否完成，與是否造成改變分開</title><desc id="public-50-desc">左側人員、場地和流程影響服務能否交付；右側虛構比較趨勢提示反事實評估，介入後下降並不自動全是政策效果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 50 / 落地是否完成，與是否造成改變分開</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="70.0" y="117" width="290" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="215" y="152" font-size="19" fill="#9ac8e8" text-anchor="middle">場域、人力與可接受性</text><path d="M215 180L215 220" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M219.3 211.0L215 220L210.7 211.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70.0" y="222" width="290" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="215" y="257" font-size="19" fill="#b7e89f" text-anchor="middle">可行、忠實、適應與覆蓋</text><path d="M215 285L215 325" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M219.3 316.0L215 325L210.7 316.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70.0" y="327" width="290" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="215" y="362" font-size="19" fill="#c1b2ea" text-anchor="middle">執行結果與健康結果</text><path d="M470 365V125M470 365H800" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M485 180L585 195L685 215L790 225" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M485 180L585 195L685 260L790 310" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 135V365" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="620" y="130" font-size="18" fill="#ead68c" text-anchor="start">介入起點</text><text x="505" y="400" font-size="17" fill="#e3e9e2" text-anchor="start">虛線：比較；綠：介入地</text><text x="500" y="440" font-size="17" fill="#e3e9e2" text-anchor="start">平行趨勢等假設仍需查核</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>