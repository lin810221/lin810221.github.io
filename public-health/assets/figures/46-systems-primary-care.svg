<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-46-title public-46-desc"><title id="public-46-title">健康體系是連結，不是六座孤島</title><desc id="public-46-desc">周邊六個構面互相支援，中央是人口與整合服務；下方指出初級衛生保健還包括跨部門行動和社區參與，並非只指基層診間。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 46 / 健康體系是連結，不是六座孤島</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><path d="M275 155L335 218" stroke="#9ac8e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 158V192" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M585 155L525 218" stroke="#c1b2ea" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 360L335 302" stroke="#9ac8e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 365V328" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M585 360L525 302" stroke="#c1b2ea" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="260" rx="125" ry="65" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="255" font-size="24" fill="#b7e89f" text-anchor="middle">人口與需求</text><text x="430" y="285" font-size="18" fill="#b7e89f" text-anchor="middle">整合與持續照護</text><rect x="70.0" y="107" width="210" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="175" y="142" font-size="19" fill="#9ac8e8" text-anchor="middle">治理</text><rect x="325.0" y="97" width="210" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="430" y="132" font-size="19" fill="#ead68c" text-anchor="middle">籌資</text><rect x="585.0" y="107" width="210" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="690" y="142" font-size="19" fill="#c1b2ea" text-anchor="middle">人力</text><rect x="70.0" y="352" width="210" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="175" y="387" font-size="19" fill="#9ac8e8" text-anchor="middle">資訊</text><rect x="325.0" y="367" width="210" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="430" y="402" font-size="19" fill="#ead68c" text-anchor="middle">藥品與科技</text><rect x="585.0" y="352" width="210" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="690" y="387" font-size="19" fill="#c1b2ea" text-anchor="middle">服務提供</text><text x="100" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">初級衛生保健：整合服務＋跨部門政策＋有權能的居民與社區。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>