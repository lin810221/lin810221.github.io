<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-06-title public-06-desc"><title id="public-06-title">健康損失與服務需求的不同問題</title><desc id="public-06-desc">上方兩段條形示意DALY由早逝損失YLL與非致死健康損失YLD相加；下方三個視窗分別對應既有病例、未來新發與人口時間，沒有把所有健康問題縮成一個排名。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 06 / 健康損失與服務需求的不同問題</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">條形長度為概念，非實際DALY或權重；現代YLD採盛行觀點。</text><text x="65" y="135" font-size="21" fill="#9ac8e8" text-anchor="start">DALY：健康損失年（此處只示意構成）</text><rect x="70" y="165" width="400" height="60" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="470" y="165" width="250" height="60" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="270" y="203" font-size="22" fill="#111a17" text-anchor="middle">YLL：早逝</text><text x="595" y="203" font-size="20" fill="#111a17" text-anchor="middle">YLD：非致死損失</text><path d="M70 245H720" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="275" font-size="18" fill="#b7e89f" text-anchor="middle">共同單位才能相加；權重與方法版本需保留</text><rect x="60" y="330" width="220" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="170.0" y="365" font-size="20" fill="#9ac8e8" text-anchor="middle">快照：服務需求</text><rect x="320" y="330" width="220" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430.0" y="365" font-size="20" fill="#b7e89f" text-anchor="middle">新發：疾病出現</text><rect x="580" y="330" width="220" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="690.0" y="365" font-size="20" fill="#ead68c" text-anchor="middle">人時：速度比較</text><text x="65" y="435" font-size="20" fill="#e3e9e2" text-anchor="start">計數、比例、率、健康損失年，分別連到不同決策。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>