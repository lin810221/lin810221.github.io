<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-37-title public-37-desc"><title id="public-37-title">共同條件沿生命歷程累積</title><desc id="public-37-desc">上方從環境、服務和社會條件連到多種風險與健康結果，下方人生時間線以不同窗口示意累積與支持；箭頭非命定，也不是每人相同路徑。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37 / 共同條件沿生命歷程累積</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">人生階段非比例；風險可以改變，不把早年條件解讀成不可逆命運。</text><rect x="45" y="120" width="235" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="162.5" y="156" font-size="20" fill="#9ac8e8" text-anchor="middle">環境、服務與社會條件</text><rect x="355" y="120" width="195" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="452.5" y="156" font-size="20" fill="#ead68c" text-anchor="middle">多種曝露</text><rect x="625" y="120" width="190" height="57" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="720.0" y="156" font-size="20" fill="#c1b2ea" text-anchor="middle">多種結果</text><path d="M290 148L345 148" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M336.0 143.7L345 148L336.0 152.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 148L615 148" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M606.0 143.7L615 148L606.0 152.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 335H790" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="95" cy="335" rx="15" ry="15" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="95" y="390" font-size="18" fill="#b7e89f" text-anchor="middle">孕產</text><ellipse cx="270" cy="335" rx="15" ry="15" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="270" y="390" font-size="18" fill="#9ac8e8" text-anchor="middle">兒少</text><ellipse cx="445" cy="335" rx="15" ry="15" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="445" y="390" font-size="18" fill="#ead68c" text-anchor="middle">成年</text><ellipse cx="620" cy="335" rx="15" ry="15" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="620" y="390" font-size="18" fill="#c1b2ea" text-anchor="middle">高齡</text><path d="M95 265H620" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="245" font-size="21" fill="#b7e89f" text-anchor="start">累積曝露、關鍵窗口與跨代支持</text><text x="95" y="445" font-size="21" fill="#e3e9e2" text-anchor="start">每個階段仍有改善健康與功能的機會。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>