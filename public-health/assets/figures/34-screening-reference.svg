<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-34-title public-34-desc"><title id="public-34-title">從疾病自然史到檢測二乘二表</title><desc id="public-34-desc">上方疾病自然史將可偵測無症狀期與臨床出現分開，下方檢測結果需要和參照狀態比較；篩檢陽性不是確診，陰性也不是永久沒有風險。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34 / 從疾病自然史到檢測二乘二表</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">自然史非比例、不是每種疾病皆有相同窗口；TP等定義依參照標準。</text><path d="M65 170H795" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 150V190" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="225" font-size="18" fill="#9ac8e8" text-anchor="middle">疾病開始</text><path d="M330 150V190" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="225" font-size="18" fill="#b7e89f" text-anchor="middle">可被偵測</text><path d="M610 150V190" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="225" font-size="18" fill="#ead68c" text-anchor="middle">臨床出現</text><path d="M330 130H610" stroke="#c1b2ea" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="115" font-size="19" fill="#c1b2ea" text-anchor="middle">可偵測的無症狀窗口</text><path d="M90 285H770V430H90ZM330 285V430M550 285V430M90 335H770M90 385H770" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="320" font-size="19" fill="#e3e9e2" text-anchor="start">參照狀態</text><text x="390" y="320" font-size="19" fill="#e3e9e2" text-anchor="start">檢測陽性</text><text x="605" y="320" font-size="19" fill="#e3e9e2" text-anchor="start">檢測陰性</text><text x="110" y="370" font-size="19" fill="#e3e9e2" text-anchor="start">有目標疾病</text><text x="420" y="370" font-size="21" fill="#b7e89f" text-anchor="start">TP</text><text x="640" y="370" font-size="21" fill="#ead68c" text-anchor="start">FN</text><text x="110" y="420" font-size="19" fill="#e3e9e2" text-anchor="start">無目標疾病</text><text x="420" y="420" font-size="21" fill="#ead68c" text-anchor="start">FP</text><text x="640" y="420" font-size="21" fill="#b7e89f" text-anchor="start">TN</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>