<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-21-title public-21-desc"><title id="public-21-title">時間零點與剩餘未知</title><desc id="public-21-desc">上方資格、策略指定與追蹤起點對齊同一垂直線；下方若依未來完成療程才定組別，就把必須存活的前段誤歸組別。右方問號格表示未量混雜仍要敏感度評估。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21 / 時間零點與剩餘未知</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">對齊可避免設計自製偏差；資料不足與未量混雜仍不會自動消失。</text><text x="60" y="125" font-size="21" fill="#b7e89f" text-anchor="start">對齊：資格＋策略＋開始追蹤</text><path d="M165 150V415" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 205L550 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M541.0 200.7L550 205L541.0 209.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="187" font-size="18" fill="#b7e89f" text-anchor="start">從時間零點往後觀察</text><path d="M165 335L550 335" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M541.0 330.7L550 335L541.0 339.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="315" font-size="18" fill="#ead68c" text-anchor="start">錯誤：按未來完成者回頭分組</text><path d="M450 285V365" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="395" font-size="17" fill="#ead68c" text-anchor="middle">未來完成</text><rect x="635" y="155" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="657" y="187" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="690" y="155" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="712" y="187" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="745" y="155" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="767" y="187" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="635" y="220" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="657" y="252" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="690" y="220" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="712" y="252" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="745" y="220" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="767" y="252" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="635" y="285" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="657" y="317" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="690" y="285" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="712" y="317" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><rect x="745" y="285" width="45" height="48" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="767" y="317" font-size="23" fill="#c1b2ea" text-anchor="middle">?</text><text x="715" y="410" font-size="18" fill="#c1b2ea" text-anchor="middle">未量的條件</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>