<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-53-title public-53-desc"><title id="public-53-title">IHR修正與大流行協定是不同時間線</title><desc id="public-53-desc">上方IHR的2024修正接到2025多數締約方生效及2026附錄更新；下方協定2025通過，但截至2026年11月PABS仍在協商，不能把提交目標畫成已完成。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 53 / IHR修正與大流行協定是不同時間線</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">虛線為未來目標；查核2026-11-17，不把所有國家適用日期畫成一樣。</text><text x="65" y="125" font-size="20" fill="#9ac8e8" text-anchor="start">IHR：依締約方與適用文本核對</text><path d="M80 205H780" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="140" cy="205" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="140" y="170" font-size="18" fill="#9ac8e8" text-anchor="middle">2024</text><text x="140" y="245" font-size="17" fill="#e3e9e2" text-anchor="middle">修正通過</text><ellipse cx="425" cy="205" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="425" y="170" font-size="18" fill="#9ac8e8" text-anchor="middle">2025/09</text><text x="425" y="245" font-size="17" fill="#e3e9e2" text-anchor="middle">多數締約方生效</text><ellipse cx="710" cy="205" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="710" y="170" font-size="18" fill="#9ac8e8" text-anchor="middle">2026/06</text><text x="710" y="245" font-size="17" fill="#e3e9e2" text-anchor="middle">國別附錄更新</text><text x="65" y="310" font-size="20" fill="#b7e89f" text-anchor="start">大流行協定：採納、附錄、簽署與生效分開</text><path d="M80 385H540" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 385H790" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><ellipse cx="140" cy="385" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="140" y="350" font-size="18" fill="#b7e89f" text-anchor="middle">2025/05</text><text x="140" y="430" font-size="17" fill="#e3e9e2" text-anchor="middle">協定通過</text><ellipse cx="425" cy="385" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="425" y="350" font-size="18" fill="#b7e89f" text-anchor="middle">2026/11</text><text x="425" y="430" font-size="17" fill="#e3e9e2" text-anchor="middle">PABS持續協商</text><ellipse cx="710" cy="385" rx="7" ry="7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="710" y="350" font-size="18" fill="#ead68c" text-anchor="middle">2027/05</text><text x="710" y="430" font-size="17" fill="#e3e9e2" text-anchor="middle">提交審議目標</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>