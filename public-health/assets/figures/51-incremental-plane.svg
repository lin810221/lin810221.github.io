<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-51-title public-51-desc"><title id="public-51-title">ICER之前，先看增量成本與效果的象限</title><desc id="public-51-desc">橫軸為增量效果、縱軸為增量成本，四象限各有不同解釋；右上角示例多花20000成本單位、多10QALY，斜率2000不是通用給付門檻。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 51 / ICER之前，先看增量成本與效果的象限</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">增量坐標為示意；不設支付意願線，不推算臺灣或個人給付決定。</text><path d="M90 275H775M430 430V115" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 275L785 275" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M776.0 270.7L785 275L776.0 279.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 145L430 110" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M425.7 119.0L430 110L434.3 119.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="445" y="130" font-size="19" fill="#9ac8e8" text-anchor="start">Δ成本</text><text x="665" y="305" font-size="19" fill="#b7e89f" text-anchor="start">ΔQALY</text><text x="90" y="165" font-size="19" fill="#eda894" text-anchor="start">較貴、效果較差</text><text x="540" y="165" font-size="19" fill="#ead68c" text-anchor="start">較貴、效果較好</text><text x="90" y="405" font-size="19" fill="#ead68c" text-anchor="start">較省、效果較差</text><text x="540" y="405" font-size="19" fill="#b7e89f" text-anchor="start">較省、效果較好</text><path d="M430 275L675 195" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="675" cy="195" rx="7" ry="7" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="495" y="325" font-size="19" fill="#c1b2ea" text-anchor="start">20000／10＝2000</text><text x="495" y="360" font-size="18" fill="#e3e9e2" text-anchor="start">嚴格支配與取捨分開判斷</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>