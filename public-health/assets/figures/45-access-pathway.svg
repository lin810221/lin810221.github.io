<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-45-title public-45-desc"><title id="public-45-title">能理解，也要能走完服務路徑</title><desc id="public-45-desc">漏斗中的人數為虛構邀請到服務路徑，逐層流失有不同原因；下方回饋箭頭將語言、時間、交通及數位選項接回服務設計。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 45 / 能理解，也要能走完服務路徑</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">數字為教學漏斗；各階段需要自己的分母與原因，不能只稱居民不配合。</text><rect x="70" y="150" width="155" height="180" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="147" y="191" font-size="20" fill="#9ac8e8" text-anchor="middle">收到邀請</text><text x="147" y="242" font-size="24" fill="#9ac8e8" text-anchor="middle">100</text><path d="M233 260L247 260" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M238.0 255.7L247 260L238.0 264.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="255" y="175" width="155" height="155" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="332" y="216" font-size="20" fill="#b7e89f" text-anchor="middle">理解內容</text><text x="332" y="267" font-size="24" fill="#b7e89f" text-anchor="middle">80</text><path d="M418 260L432 260" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M423.0 255.7L432 260L423.0 264.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="200" width="155" height="130" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="517" y="241" font-size="20" fill="#ead68c" text-anchor="middle">能夠預約</text><text x="517" y="292" font-size="24" fill="#ead68c" text-anchor="middle">60</text><path d="M603 260L617 260" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M608.0 255.7L617 260L608.0 264.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="625" y="225" width="155" height="105" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="702" y="266" font-size="20" fill="#c1b2ea" text-anchor="middle">完成服務</text><text x="702" y="317" font-size="24" fill="#c1b2ea" text-anchor="middle">45</text><path d="M705 365V425H145V350" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 365L145 338" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140.7 347.0L145 338L149.3 347.0" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="245" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">共同改善：語言、無障礙、交通、時段與非數位管道</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>