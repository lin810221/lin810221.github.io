<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-36-title public-36-desc"><title id="public-36-title">篩檢是一條需能走完的服務路徑</title><desc id="public-36-desc">六個環節由邀請、檢測、確認到治療、追蹤和結果評估，各處都可能有可近性與品質缺口；以全程結果判斷價值，而非只數發出多少檢測。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36 / 篩檢是一條需能走完的服務路徑</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">箭頭表示服務流程；每段要看資料與公平，不是所有人都必須接受篩檢。</text><rect x="40" y="130" width="220" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="150.0" y="166" font-size="20" fill="#9ac8e8" text-anchor="middle">邀請與知情選擇</text><rect x="320" y="130" width="220" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430.0" y="166" font-size="20" fill="#b7e89f" text-anchor="middle">適切檢測</text><rect x="600" y="130" width="220" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="710.0" y="166" font-size="20" fill="#ead68c" text-anchor="middle">陽性確認</text><path d="M270 159L310 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.0 154.7L310 159L301.0 163.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M550 159L590 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M581.0 154.7L590 159L581.0 163.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M710 200V255H150V285" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="300" width="220" height="57" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="150.0" y="336" font-size="20" fill="#c1b2ea" text-anchor="middle">可取得的照護</text><rect x="320" y="300" width="220" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="430.0" y="336" font-size="20" fill="#9ac8e8" text-anchor="middle">持續追蹤</text><rect x="600" y="300" width="220" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="710.0" y="336" font-size="20" fill="#b7e89f" text-anchor="middle">重要健康結果</text><path d="M270 329L310 329" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.0 324.7L310 329L301.0 333.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M550 329L590 329" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M581.0 324.7L590 329L581.0 333.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="435" font-size="21" fill="#e3e9e2" text-anchor="start">每個環節都問：誰沒有被邀請、無法到達、未完成或未受益？</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>