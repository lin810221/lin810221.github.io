<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-49-title public-49-desc"><title id="public-49-title">行動鏈的每一支箭頭都需要理由</title><desc id="public-49-desc">上方政策討論迴路可回到問題界定；下方投入、活動、產出與結果相連，虛線表示假設及外部脈絡會影響整條鏈。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 49 / 行動鏈的每一支箭頭都需要理由</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="65.0" y="127" width="160" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="145" y="162" font-size="19" fill="#9ac8e8" text-anchor="middle">問題</text><path d="M232 155L246 155" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M237.0 150.7L246 155L237.0 159.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="255.0" y="127" width="160" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="335" y="162" font-size="19" fill="#b7e89f" text-anchor="middle">選項</text><path d="M422 155L436 155" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M427.0 150.7L436 155L427.0 159.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="445.0" y="127" width="160" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="525" y="162" font-size="19" fill="#ead68c" text-anchor="middle">採行</text><path d="M612 155L626 155" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M617.0 150.7L626 155L617.0 159.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="635.0" y="127" width="160" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="715" y="162" font-size="19" fill="#c1b2ea" text-anchor="middle">評估</text><path d="M715 195V225H145V195" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65.0" y="302" width="160" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="145" y="337" font-size="19" fill="#9ac8e8" text-anchor="middle">投入</text><path d="M232 330L246 330" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M237.0 325.7L246 330L237.0 334.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="255.0" y="302" width="160" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="335" y="337" font-size="19" fill="#b7e89f" text-anchor="middle">活動</text><path d="M422 330L436 330" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M427.0 325.7L436 330L427.0 334.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="445.0" y="302" width="160" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="525" y="337" font-size="19" fill="#ead68c" text-anchor="middle">產出</text><path d="M612 330L626 330" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M617.0 325.7L626 330L617.0 334.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="635.0" y="302" width="160" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="715" y="337" font-size="19" fill="#c1b2ea" text-anchor="middle">健康結果</text><path d="M75 265H790M75 395H790" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="90" y="445" font-size="18" fill="#e3e9e2" text-anchor="start">假設、脈絡、公平與意外影響：不是填完方格就證明有效。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>