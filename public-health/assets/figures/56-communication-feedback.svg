<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-56-title public-56-desc"><title id="public-56-title">溝通是回饋迴路，更新需要留下理由</title><desc id="public-56-desc">已知、未知與可行行動分開組成訊息，居民疑問與服務障礙回到調查和修訂；錯誤訊息的更正須提供可核對替代解釋，而非只貼真假標籤。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 56 / 溝通是回饋迴路，更新需要留下理由</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="40.0" y="107" width="270" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="175" y="142" font-size="19" fill="#9ac8e8" text-anchor="middle">已知：來源與時間</text><rect x="40.0" y="202" width="270" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="175" y="237" font-size="19" fill="#c1b2ea" text-anchor="middle">未知：限制與待查</text><rect x="40.0" y="297" width="270" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="175" y="332" font-size="19" fill="#b7e89f" text-anchor="middle">行動：可做與可取得</text><path d="M325 220L400 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M391.0 215.7L400 220L391.0 224.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="430.0" y="192" width="270" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="565" y="227" font-size="19" fill="#b7e89f" text-anchor="middle">可理解、可使用的訊息</text><path d="M565 255L565 315" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M569.3 306.0L565 315L560.7 306.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="430.0" y="327" width="270" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="565" y="362" font-size="19" fill="#ead68c" text-anchor="middle">聆聽：疑問、經驗與障礙</text><path d="M420 355H340V410H175V365" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 380L175 360" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.7 369.0L175 360L179.3 369.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">修訂時保留：前版、變動內容、原因、日期與下一次更新。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>