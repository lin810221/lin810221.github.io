<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-13-title public-13-desc"><title id="public-13-title">同一二乘二表的風險與勝算</title><desc id="public-13-desc">左側固定列為曝露狀態、欄為結果，40、160、20、180合計400人；右側同期間風險20%與10%，RR為2而OR為2.25，兩個量數含義不同。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 13 / 同一二乘二表的風險與勝算</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">表為完整世代資料；若是病例對照抽樣，列比例不代表人口風險。</text><path d="M55 135H445V355H55ZM205 135V355M325 135V355M55 195H445M55 275H445" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="175" font-size="18" fill="#e3e9e2" text-anchor="start">有病</text><text x="350" y="175" font-size="18" fill="#e3e9e2" text-anchor="start">無病</text><text x="70" y="240" font-size="20" fill="#b7e89f" text-anchor="start">曝露</text><text x="70" y="320" font-size="20" fill="#c1b2ea" text-anchor="start">未曝露</text><text x="255" y="242" font-size="23" fill="#b7e89f" text-anchor="middle">40</text><text x="385" y="242" font-size="23" fill="#b7e89f" text-anchor="middle">160</text><text x="255" y="322" font-size="23" fill="#c1b2ea" text-anchor="middle">20</text><text x="385" y="322" font-size="23" fill="#c1b2ea" text-anchor="middle">180</text><rect x="525" y="170" width="240" height="45" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="525" y="270" width="120" height="45" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="525" y="155" font-size="21" fill="#b7e89f" text-anchor="start">40／200＝20%</text><text x="525" y="255" font-size="21" fill="#c1b2ea" text-anchor="start">20／200＝10%</text><text x="525" y="365" font-size="23" fill="#9ac8e8" text-anchor="start">RR＝2；OR＝2.25</text><text x="60" y="425" font-size="20" fill="#e3e9e2" text-anchor="start">同一追蹤期間；差10百分點，非相差10%。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>