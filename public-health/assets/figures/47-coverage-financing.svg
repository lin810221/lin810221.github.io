<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-47-title public-47-desc"><title id="public-47-title">覆蓋兩個面向，籌資三個功能</title><desc id="public-47-desc">左側兩軸是服務與財務保護的概念空間，沒有國家排名；右側資金由籌集進入風險池，再透過購買服務，反向資訊支援問責。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 47 / 覆蓋兩個面向，籌資三個功能</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">框架圖無刻度、不畫真實國家；UHC不是所有服務免費或單純納保率。</text><path d="M75 385V140M75 385H385" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="125" font-size="19" fill="#9ac8e8" text-anchor="start">財務保護 ↑</text><text x="100" y="430" font-size="19" fill="#b7e89f" text-anchor="start">服務可近性與品質 →</text><ellipse cx="290" cy="205" rx="35" ry="35" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="145" y="345" font-size="17" fill="#e3e9e2" text-anchor="start">有保險也要看能否取得服務</text><rect x="465.0" y="127" width="310" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="620" y="162" font-size="19" fill="#9ac8e8" text-anchor="middle">籌集：稅收、保費等</text><path d="M620 190L620 218" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M624.3 209.0L620 218L615.7 209.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="465.0" y="227" width="310" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="620" y="262" font-size="19" fill="#b7e89f" text-anchor="middle">風險分攤：預付與池化</text><path d="M620 290L620 318" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M624.3 309.0L620 318L615.7 309.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="465.0" y="327" width="310" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="620" y="362" font-size="19" fill="#ead68c" text-anchor="middle">購買：向提供者支付</text><text x="470" y="440" font-size="17" fill="#e3e9e2" text-anchor="start">兩面向都要追蹤，不能以單一總分取代。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>