<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-44-title public-44-desc"><title id="public-44-title">差距的兩種尺度，與誰參與解釋</title><desc id="public-44-desc">左側同分母的兩組不利健康比例由40與10變為20與4；絕對差縮小而比值增加。右側雙向連線提醒居民參與指標解釋和行動。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 44 / 差距的兩種尺度，與誰參與解釋</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><text x="65" y="125" font-size="20" fill="#9ac8e8" text-anchor="start">每組100人；不利結果比例</text><path d="M90 360V165M90 360H410" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 180L350 270" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 315L350 342" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="165" font-size="20" fill="#c1b2ea" text-anchor="start">40%</text><text x="325" y="253" font-size="20" fill="#c1b2ea" text-anchor="start">20%</text><text x="110" y="307" font-size="20" fill="#b7e89f" text-anchor="start">10%</text><text x="330" y="328" font-size="20" fill="#b7e89f" text-anchor="start">4%</text><text x="145" y="384" font-size="16" fill="#e3e9e2" text-anchor="middle">基線</text><text x="350" y="384" font-size="16" fill="#e3e9e2" text-anchor="middle">方案後</text><text x="100" y="425" font-size="19" fill="#ead68c" text-anchor="start">差30→16百分點；比4→5</text><ellipse cx="640" cy="230" rx="120" ry="80" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="640" y="235" font-size="21" fill="#b7e89f" text-anchor="middle">社區共同解釋</text><rect x="460.0" y="347" width="160" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="540" y="382" font-size="19" fill="#9ac8e8" text-anchor="middle">資源與需求</text><rect x="655.0" y="347" width="160" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="735" y="382" font-size="19" fill="#c1b2ea" text-anchor="middle">經驗與價值</text><path d="M540 343L585 303" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M575.4 305.7L585 303L581.2 312.2" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M585 303L540 343" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M549.6 340.3L540 343L543.8 333.8" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M735 343L695 303" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M698.3 312.4L695 303L704.4 306.3" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M695 303L735 343" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M731.7 333.6L735 343L725.6 339.7" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="485" y="125" font-size="18" fill="#e3e9e2" text-anchor="start">雙向線表示對話，不是單向宣告</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>