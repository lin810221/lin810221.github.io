<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-28-title public-28-desc"><title id="public-28-title">調查在時間線與資料清單之間前進</title><desc id="public-28-desc">左側十日發病曲線有三十一名已知日期病例，另有三名日期未知；右側調查工作在確認、搜尋、比較與行動間往返，並非等所有研究完成才保護人。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28 / 調查在時間線與資料清單之間前進</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">柱高為逐日已知發病數；未知日期不塞進第十一日，零也不等於疫情結束。</text><path d="M55 355H450M55 355V130" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="355" width="27" height="1" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="102" y="335" width="27" height="20" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="139" y="315" width="27" height="40" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="176" y="255" width="27" height="100" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="213" y="175" width="27" height="180" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="250" y="215" width="27" height="140" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="287" y="275" width="27" height="80" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="324" y="315" width="27" height="40" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="361" y="335" width="27" height="20" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="398" y="355" width="27" height="1" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="78" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">1</text><text x="115" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">2</text><text x="152" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">3</text><text x="189" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">4</text><text x="226" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">5</text><text x="263" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">6</text><text x="300" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">7</text><text x="337" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">8</text><text x="374" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">9</text><text x="411" y="387" font-size="16" fill="#9ac8e8" text-anchor="middle">10</text><text x="55" y="120" font-size="20" fill="#9ac8e8" text-anchor="start">發病人數（虛構）</text><text x="55" y="426" font-size="20" fill="#ead68c" text-anchor="start">日期已知31；未知3另列</text><rect x="505" y="115" width="295" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="652.5" y="151" font-size="20" fill="#9ac8e8" text-anchor="middle">確認／搜尋</text><rect x="505" y="225" width="295" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="652.5" y="261" font-size="20" fill="#b7e89f" text-anchor="middle">描述／比較</text><rect x="505" y="335" width="295" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="652.5" y="371" font-size="20" fill="#ead68c" text-anchor="middle">控制／回顧</text><path d="M650 185L650 212" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.3 203.0L650 212L645.7 203.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 295L650 322" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.3 313.0L650 322L645.7 313.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M805 365H825V145H810" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>