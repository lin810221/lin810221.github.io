<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-12-title public-12-desc"><title id="public-12-title">個人、區域與政策的比較層級</title><desc id="public-12-desc">左側個人點陣向上彙整成地區平均，聚合後的關聯不能直接還原個人關係；右側政策時間線有實施與比較區，評估需先說明未介入時的反事實。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12 / 個人、區域與政策的比較層級</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">圖不提供真實政策效果；需檢查共同趨勢、同時事件與資料變化。</text><ellipse cx="70" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="90" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="110" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="130" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="150" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="170" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="190" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="210" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="230" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="250" cy="135" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="70" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="90" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="110" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="130" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="150" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="170" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="190" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="210" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="230" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="250" cy="155" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="70" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="90" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="110" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="130" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="150" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="170" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="190" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="210" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="230" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="250" cy="175" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><path d="M175 210L175 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M179.3 246.0L175 255L170.7 246.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="275" width="285" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="197.5" y="310" font-size="20" fill="#9ac8e8" text-anchor="middle">區域平均：曝露與結果</text><text x="195" y="390" font-size="20" fill="#9ac8e8" text-anchor="middle">聚合會丟掉個人配對</text><path d="M425 155V365H785" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 325L550 285L650 250L760 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 345L550 305L650 300L760 295" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 135V385" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="620" y="420" font-size="18" fill="#ead68c" text-anchor="middle">政策實施</text><text x="445" y="145" font-size="17" fill="#e3e9e2" text-anchor="start">比較軌跡為任意示意</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>