text><text x="630" y="340" font-size="18" fill="#ead68c" text-anchor="middle">誤記</text><text x="745" y="340" font-size="18" fill="#b7e89f" text-anchor="middle">正確</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>