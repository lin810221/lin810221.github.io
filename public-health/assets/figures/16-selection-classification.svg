<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-16-title public-16-desc"><title id="public-16-title">誰被留下，與誰被量錯</title><desc id="public-16-desc">左方來源人口經就醫與追蹤條件形成分析樣本，選入可同時受曝露與結果影響；右方參照狀態與紀錄狀態有四種配對，錯分方向需看機制。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16 / 誰被留下，與誰被量錯</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">漏斗不代表真實抽樣比例；錯分可能朝不同方向，非固定偏向無效。</text><ellipse cx="65" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="85" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="105" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="125" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="145" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="165" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="185" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="205" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="225" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="245" cy="130" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="65" cy="150" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="85" cy="150" rx="5" ry="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="105" cy="150" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="125" cy="150" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="145" cy="150" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="165" cy="150" rx="5" ry="5" stroke="#668173" fill="#