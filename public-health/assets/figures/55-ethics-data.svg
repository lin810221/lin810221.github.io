<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-55-title public-55-desc"><title id="public-55-title">公共利益與資料權利一起設計</title><desc id="public-55-desc">左側不同強度的行動需依必要性、有效性與替代方案逐步論證；右側資料從蒐集、使用到分享與刪除皆有治理，不能只在蒐集時勾選一次同意。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 55 / 公共利益與資料權利一起設計</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">倫理檢核圖，不代表已判斷任何措施符合特定地區法律。</text><rect x="65" y="150" width="285" height="52" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="183" font-size="18" fill="#9ac8e8" text-anchor="start">目的、證據與合法權責</text><rect x="65" y="227" width="285" height="52" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="80" y="260" font-size="18" fill="#b7e89f" text-anchor="start">必要、比例與替代方案</text><rect x="65" y="304" width="285" height="52" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="80" y="337" font-size="18" fill="#ead68c" text-anchor="start">支持、救濟與定期複核</text><text x="65" y="420" font-size="17" fill="#e3e9e2" text-anchor="start">侵害較少且有效的選項也要比較</text><rect x="480.0" y="107" width="300" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="630" y="142" font-size="19" fill="#9ac8e8" text-anchor="middle">最小必要蒐集</text><path d="M630 170L630 183" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.3 174.0L630 183L625.7 174.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480.0" y="194" width="300" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="630" y="229" font-size="19" fill="#b7e89f" text-anchor="middle">權限與可追溯使用</text><path d="M630 257L630 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.3 261.0L630 270L625.7 261.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480.0" y="281" width="300" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="630" y="316" font-size="19" fill="#ead68c" text-anchor="middle">受控分享與公開彙整</text><path d="M630 344L630 357" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.3 348.0L630 357L625.7 348.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480.0" y="368" width="300" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="630" y="403" font-size="19" fill="#c1b2ea" text-anchor="middle">保存期限、刪除與審查</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>