<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-05-title public-05-desc"><title id="public-05-title">人時與死亡分母各自回答問題</title><desc id="public-05-desc">左側四條風險中追蹤時間示意加入、發病與失訪如何影響人時加總；右側死亡率以人口時間為分母，致死比例以相應病例為分母，兩者不可互換。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 05 / 人時與死亡分母各自回答問題</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">左圖無數值刻度；截尾的統計假設、病因與追蹤終點需另核對。</text><text x="65" y="120" font-size="20" fill="#9ac8e8" text-anchor="start">實際風險中時間 →</text><text x="65" y="175" font-size="18" fill="#e3e9e2" text-anchor="start">A</text><path d="M120 170H410" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="410" cy="170" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="65" y="230" font-size="18" fill="#e3e9e2" text-anchor="start">B</text><path d="M120 225H330" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="330" cy="225" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="65" y="285" font-size="18" fill="#e3e9e2" text-anchor="start">C</text><path d="M120 280H460" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="460" cy="280" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="65" y="340" font-size="18" fill="#e3e9e2" text-anchor="start">D</text><path d="M120 335H270" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="270" cy="335" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="70" y="415" font-size="17" fill="#e3e9e2" text-anchor="start">發病、死亡或失訪會停止相應追蹤</text><rect x="525" y="125" width="270" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="660.0" y="160" font-size="20" fill="#9ac8e8" text-anchor="middle">死亡／人口時間</text><rect x="525" y="270" width="270" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="660.0" y="305" font-size="20" fill="#ead68c" text-anchor="middle">死亡／相應病例</text><text x="660" y="225" font-size="20" fill="#9ac8e8" text-anchor="middle">死亡率：人口負擔</text><text x="660" y="365" font-size="20" fill="#ead68c" text-anchor="middle">致死比例：病例結果</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>