<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-43-title public-43-desc"><title id="public-43-title">健康差異：從生活條件追到可改變的路徑</title><desc id="public-43-desc">左側三層位置表示政策制度、生活資源與健康機會；右側柱高為無刻度概念差異，不能只由差異本身判斷其是否不公平。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 43 / 健康差異：從生活條件追到可改變的路徑</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="70.0" y="122" width="320" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="230" y="157" font-size="19" fill="#c1b2ea" text-anchor="middle">制度、權力與資源分配</text><path d="M230 183L230 217" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.3 208.0L230 217L225.7 208.0" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70.0" y="222" width="320" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="230" y="257" font-size="19" fill="#9ac8e8" text-anchor="middle">住居、勞動、教育與照護</text><path d="M230 283L230 317" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.3 308.0L230 317L225.7 308.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70.0" y="322" width="320" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="230" y="357" font-size="19" fill="#b7e89f" text-anchor="middle">曝露、可近性與健康機會</text><path d="M480 380V130M480 380H800" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="525" y="170" width="42" height="210" rx="4" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="546" y="414" font-size="17" fill="#c1b2ea" text-anchor="middle">甲</text><rect x="610" y="230" width="42" height="150" rx="4" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="631" y="414" font-size="17" fill="#9ac8e8" text-anchor="middle">乙</text><rect x="695" y="285" width="42" height="95" rx="4" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="716" y="414" font-size="17" fill="#b7e89f" text-anchor="middle">丙</text><text x="490" y="120" font-size="18" fill="#e3e9e2" text-anchor="start">健康負擔：任意示意</text><text x="78" y="438" font-size="19" fill="#e3e9e2" text-anchor="start">差異是描述；公平判斷還需脈絡、可避免性與價值。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>