<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-23-title public-23-desc"><title id="public-23-title">定義與回補會改變同一條曲線</title><desc id="public-23-desc">左側同一病例定義版本依人、地、時與臨床檢驗條件選入資料，右側發病週與資料截點形成回補矩陣；較近期間尚未完整。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 23 / 定義與回補會改變同一條曲線</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">矩陣數字為虛構累積資料；無標示的格子不是零病例。</text><rect x="40" y="120" width="325" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="202.5" y="156" font-size="20" fill="#9ac8e8" text-anchor="middle">病例定義：人、地、時</text><rect x="40" y="220" width="325" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="202.5" y="256" font-size="20" fill="#b7e89f" text-anchor="middle">臨床／檢驗／流行病學</text><path d="M200 188L200 208" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M204.3 199.0L200 208L195.7 199.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="330" font-size="23" fill="#ead68c" text-anchor="start">版本A → 版本B</text><text x="55" y="377" font-size="19" fill="#e3e9e2" text-anchor="start">保留生效日與分類差異</text><path d="M420 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="120" font-size="19" fill="#9ac8e8" text-anchor="start">資料截點由左往右 →</text><text x="509" y="145" font-size="13" fill="#9ac8e8" text-anchor="middle">截1</text><text x="579" y="145" font-size="13" fill="#9ac8e8" text-anchor="middle">截2</text><text x="649" y="145" font-size="13" fill="#9ac8e8" text-anchor="middle">截3</text><text x="719" y="145" font-size="13" fill="#9ac8e8" text-anchor="middle">截4</text><text x="465" y="187" font-size="14" fill="#b7e89f" text-anchor="end">週A</text><text x="465" y="251" font-size="14" fill="#9ac8e8" text-anchor="end">週B</text><text x="465" y="315" font-size="14" fill="#ead68c" text-anchor="end">週C</text><rect x="480" y="155" width="58" height="48" rx="4" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="509" y="187" font-size="20" fill="#b7e89f" text-anchor="middle">10</text><rect x="550" y="155" width="58" height="48" rx="4" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="579" y="187" font-size="20" fill="#b7e89f" text-anchor="middle">12</text><rect x="620" y="155" width="58" height="48" rx="4" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="649" y="187" font-size="20" fill="#b7e89f" text-anchor="middle">12</text><rect x="690" y="155" width="58" height="48" rx="4" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="719" y="187" font-size="20" fill="#b7e89f" text-anchor="middle">12</text><rect x="550" y="219" width="58" height="48" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="579" y="251" font-size="20" fill="#9ac8e8" text-anchor="middle">7</text><rect x="620" y="219" width="58" height="48" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="649" y="251" font-size="20" fill="#9ac8e8" text-anchor="middle">10</text><rect x="690" y="219" width="58" height="48" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="719" y="251" font-size="20" fill="#9ac8e8" text-anchor="middle">11</text><rect x="620" y="283" width="58" height="48" rx="4" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="649" y="315" font-size="20" fill="#ead68c" text-anchor="middle">3</text><rect x="690" y="283" width="58" height="48" rx="4" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="719" y="315" font-size="20" fill="#ead68c" text-anchor="middle">6</text><text x="470" y="400" font-size="18" fill="#e3e9e2" text-anchor="start">同一發病週，之後仍可能回補</text><text x="470" y="438" font-size="18" fill="#ead68c" text-anchor="start">空白＝尚無此截點，不填0</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>