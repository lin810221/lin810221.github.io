<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-15-title public-15-desc"><title id="public-15-title">點估計、區間與基準風險</title><desc id="public-15-desc">左側三條任意信賴區間共用RR無效值1的參照線，寬度反映精度而非偏差大小；右側兩組不同基準風險同為RR2，絕對差異卻是10與1百分點。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15 / 點估計、區間與基準風險</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">左側區間為概念位置、不供重算；pp表示百分點，結果有明確時間。</text><path d="M70 390H435" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 120V405" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="215" y="435" font-size="18" fill="#ead68c" text-anchor="middle">RR＝1</text><path d="M155 180H330" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="245" cy="180" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><path d="M250 260H400" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="315" cy="260" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M100 340H410" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="240" cy="340" rx="7" ry="7" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><rect x="505" y="140" width="290" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="650.0" y="175" font-size="20" fill="#b7e89f" text-anchor="middle">20% 對 10%：差10pp</text><rect x="505" y="285" width="290" height="55" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="650.0" y="320" font-size="20" fill="#c1b2ea" text-anchor="middle">2% 對 1%：差1pp</text><text x="650" y="405" font-size="21" fill="#9ac8e8" text-anchor="middle">同RR2，不同絕對影響</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>