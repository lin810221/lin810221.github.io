<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-40-title public-40-desc"><title id="public-40-title">從污染源到人體：危害與曝露不同</title><desc id="public-40-desc">左側源頭、環境、接觸和人體的路徑決定是否形成曝露，右側PM2.5概念圖區分環境濃度與人體吸入；粒子和肺形非比例，不是個人劑量預測。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 40 / 從污染源到人體：危害與曝露不同</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">箭頭是可能曝露路徑；空氣測站濃度不直接等於每人的吸入劑量。</text><rect x="40" y="125" width="195" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="137.5" y="161" font-size="20" fill="#ead68c" text-anchor="middle">源頭</text><rect x="295" y="125" width="195" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="392.5" y="161" font-size="20" fill="#9ac8e8" text-anchor="middle">環境</text><rect x="550" y="125" width="245" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="672.5" y="161" font-size="20" fill="#b7e89f" text-anchor="middle">接觸與吸入</text><path d="M245 154L285 154" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M276.0 149.7L285 154L276.0 158.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 154L540 154" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M531.0 149.7L540 154L531.0 158.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="245" font-size="21" fill="#e3e9e2" text-anchor="start">存在危害 ≠ 已知個人曝露與風險</text><ellipse cx="90" cy="335" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="142" cy="370" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="194" cy="335" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="246" cy="370" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="298" cy="335" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="350" cy="370" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="402" cy="335" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M455 350L535 350" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M526.0 345.7L535 350L526.0 354.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="340" rx="55" ry="80" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="735" cy="340" rx="55" ry="80" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M680 245V310M680 310L625 335M680 310L735 335" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="435" font-size="18" fill="#e3e9e2" text-anchor="start">濃度、時間、路徑與活動影響曝露</text><text x="600" y="455" font-size="17" fill="#9ac8e8" text-anchor="start">概念肺形，非影像</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>