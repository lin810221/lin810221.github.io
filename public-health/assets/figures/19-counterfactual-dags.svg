<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-19-title public-19-desc"><title id="public-19-title">潛在結果與三種因果位置</title><desc id="public-19-desc">左側同一人分到介入與未介入兩個潛在結果分支，但現實只能觀察其中之一；右側三小圖分別呈現共同原因、中介與碰撞點，調整策略因此不同。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19 / 潛在結果與三種因果位置</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">DAG由時間與學科假設建立；總效果、直接效果與選擇問題要先區分。</text><rect x="55" y="215" width="150" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="130.0" y="250" font-size="20" fill="#9ac8e8" text-anchor="middle">同一個人</text><path d="M215 240L290 165" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.6 168.3L290 165L286.7 174.4" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 255L290 335" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M287.0 325.5L290 335L280.7 331.4" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="175" font-size="26" fill="#b7e89f" text-anchor="start">Y(1)</text><text x="300" y="345" font-size="26" fill="#c1b2ea" text-anchor="start">Y(0)</text><text x="200" y="420" font-size="17" fill="#9ac8e8" text-anchor="middle">一個分支可觀察，另一個反事實</text><text x="630" y="125" font-size="20" fill="#9ac8e8" text-anchor="middle">共同原因</text><text x="630" y="165" font-size="24" fill="#9ac8e8" text-anchor="middle">E ← C → Y</text><text x="630" y="235" font-size="20" fill="#b7e89f" text-anchor="middle">中介</text><text x="630" y="275" font-size="24" fill="#b7e89f" text-anchor="middle">E → M → Y</text><text x="630" y="345" font-size="20" fill="#ead68c" text-anchor="middle">碰撞點</text><text x="630" y="385" font-size="24" fill="#ead68c" text-anchor="middle">E → S ← Y</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>