<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-07-title public-07-desc"><title id="public-07-title">人口結構先於粗率比較</title><desc id="public-07-desc">左側人、時、地三個標籤連到有邊界的資料視窗；右側左右兩組人口金字塔條形共用年齡層，提醒人口組成會影響服務量與粗率，條寬為虛構人數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 07 / 人口結構先於粗率比較</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">圖不代表真實地區或性別分布；生命表使用年齡別死亡風險。</text><rect x="55" y="135" width="260" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="185.0" y="170" font-size="20" fill="#b7e89f" text-anchor="middle">人：年齡與社會條件</text><rect x="55" y="235" width="260" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="185.0" y="270" font-size="20" fill="#9ac8e8" text-anchor="middle">時：發病、期間與版本</text><rect x="55" y="335" width="260" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="185.0" y="370" font-size="20" fill="#ead68c" text-anchor="middle">地：居住與曝露場所</text><text x="615" y="125" font-size="21" fill="#c1b2ea" text-anchor="middle">虛構人口結構</text><rect x="535" y="170" width="60" height="26" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="625" y="170" width="54.0" height="26" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="610" y="190" font-size="15" fill="#e3e9e2" text-anchor="middle">老</text><rect x="495" y="213" width="100" height="26" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="625" y="213" width="90.0" height="26" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="610" y="233" font-size="15" fill="#e3e9e2" text-anchor="middle">↑</text><rect x="455" y="256" width="140" height="26" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="625" y="256" width="126.0" height="26" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="610" y="276" font-size="15" fill="#e3e9e2" text-anchor="middle">｜</text><rect x="430" y="299" width="165" height="26" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="625" y="299" width="148.5" height="26" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="610" y="319" font-size="15" fill="#e3e9e2" text-anchor="middle">↓</text><rect x="410" y="342" width="185" height="26" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="625" y="342" width="166.5" height="26" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="610" y="362" font-size="15" fill="#e3e9e2" text-anchor="middle">少</text><text x="610" y="435" font-size="17" fill="#9ac8e8" text-anchor="middle">條寬＝人數；兩側標籤須定義</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>