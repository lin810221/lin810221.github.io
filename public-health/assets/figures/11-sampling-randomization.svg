<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-11-title public-11-desc"><title id="public-11-title">病例對照抽樣與群集隨機</title><desc id="public-11-desc">左方由共同來源人口抽病例與適當對照，再比較先前曝露；右方以學校為群集分派策略，每校學生相依，不能把人數當獨立學校數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11 / 病例對照抽樣與群集隨機</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">病例對照左圖是抽樣邏輯；右圖配色是分派策略，不是個人效果。</text><rect x="60" y="120" width="310" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="215.0" y="155" font-size="20" fill="#9ac8e8" text-anchor="middle">共同來源人口與風險集合</text><path d="M150 190L150 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M154.3 221.0L150 230L145.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 190L290 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M294.3 221.0L290 230L285.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="250" width="135" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="132.5" y="285" font-size="20" fill="#ead68c" text-anchor="middle">病例</text><rect x="235" y="250" width="135" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="302.5" y="285" font-size="20" fill="#b7e89f" text-anchor="middle">對照</text><text x="215" y="365" font-size="22" fill="#9ac8e8" text-anchor="middle">回查先前曝露</text><text x="215" y="410" font-size="17" fill="#e3e9e2" text-anchor="start">對照可在未來成為病例</text><rect x="475" y="125" width="140" height="105" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><ellipse cx="500" cy="165" rx="5" ry="5" stroke="#b7e89f" fil