5" cy="330" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="705" cy="330" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="725" cy="330" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="665" cy="350" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="685" cy="350" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="705" cy="350" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="725" cy="350" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="640" y="425" font-size="17" fill="#9ac8e8" text-anchor="middle">群集分派；分析考慮校內相關</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>