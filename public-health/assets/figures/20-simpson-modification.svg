<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-20-title public-20-desc"><title id="public-20-title">分層後的組成與效應尺度</title><desc id="public-20-desc">左側虛構治療E與U在年輕及年長層的恢復比例各自不同，合併比例受年齡組成影響；右側差與比兩種尺度提醒效果修飾需先指定量數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20 / 分層後的組成與效應尺度</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">左例結果是恢復而非疾病；分層解除組成混合，不自動證明因果。</text><text x="60" y="130" font-size="21" fill="#9ac8e8" text-anchor="start">恢復比例：E／U</text><text x="65" y="190" font-size="23" fill="#b7e89f" text-anchor="start">年輕：90%／95%</text><text x="65" y="245" font-size="23" fill="#c1b2ea" text-anchor="start">年長：60%／70%</text><text x="65" y="315" font-size="21" fill="#ead68c" text-anchor="start">粗合併：84.5%／74.5%</text><text x="65" y="380" font-size="21" fill="#9ac8e8" text-anchor="start">共同50／50：75%／82.5%</text><path d="M460 135V415" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="150" width="290" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="650.0" y="185" font-size="20" fill="#b7e89f" text-anchor="middle">差尺度：風險差</text><rect x="505" y="285" width="290" height="55" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="650.0" y="320" font-size="20" fill="#c1b2ea" text-anchor="middle">比尺度：風險比</text><text x="650" y="405" font-size="18" fill="#9ac8e8" text-anchor="middle">交互作用依尺度與問題改變</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>