<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-41-title public-41-desc"><title id="public-41-title">供水與工作場所都需要多道控制</title><desc id="public-41-desc">左側供水從集水、處理到配送和使用的多重屏障，右側控制層級由消除到個人防護；兩者都強調在共同系統中減少曝露。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41 / 供水與工作場所都需要多道控制</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">屏障不是絕對安全保證；控制層級需依危害、可行性與實際維護判斷。</text><path d="M60 190Q115 130 170 190T280 190T390 190" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="250" width="145" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="127.5" y="286" font-size="20" fill="#9ac8e8" text-anchor="middle">水源保護</text><rect x="260" y="250" width="145" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="332.5" y="286" font-size="20" fill="#b7e89f" text-anchor="middle">處理配送</text><path d="M210 278L250 278" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M241.0 273.7L250 278L241.0 282.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="370" font-size="19" fill="#e3e9e2" text-anchor="start">含2026第三增補的飲水指南</text><text x="55" y="415" font-size="19" fill="#e3e9e2" text-anchor="start">從水源到使用端的風險管理</text><path d="M450 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="510" y="120" width="300" height="45" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="660" y="151" font-size="19" fill="#b7e89f" text-anchor="middle">消除</text><rect x="531" y="182" width="258" height="45" rx="5" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="660" y="213" font-size="19" fill="#9ac8e8" text-anchor="middle">替代</text><rect x="552" y="244" width="216" height="45" rx="5" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="660" y="275" font-size="19" fill="#ead68c" text-anchor="middle">工程控制</text><rect x="573" y="306" width="174" height="45" rx="5" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="660" y="337" font-size="19" fill="#c1b2ea" text-anchor="middle">行政控制</text><rect x="594" y="368" width="132" height="45" rx="5" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="660" y="399" font-size="19" fill="#eda894" text-anchor="middle">個人防護</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>