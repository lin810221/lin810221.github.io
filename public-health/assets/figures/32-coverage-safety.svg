<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-32-title public-32-desc"><title id="public-32-title">群體保護與安全訊號分別查證</title><desc id="public-32-desc">左側連結中的保護分布可能改變傳播路徑，右側接種後事件依時間、背景發生與比較研究作因果評估；顏色不等於百分之百防感染。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32 / 群體保護與安全訊號分別查證</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">護表示概念上的保護狀態；接種後事件不自動等於疫苗造成。</text><path d="M80 160L200 230" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 230L330 150" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 230L120 360" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 230L330 360" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 150L370 260" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 360L370 260" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="80" cy="160" rx="22" ry="22" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="80" y="167" font-size="18" fill="#b7e89f" text-anchor="middle">護</text><ellipse cx="200" cy="230" rx="22" ry="22" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="200" y="237" font-size="18" fill="#b7e89f" text-anchor="middle">護</text><ellipse cx="330" cy="150" rx="22" ry="22" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="330" y="157" font-size="18" fill="#ead68c" text-anchor="middle">易</text><ellipse cx="120" cy="360" rx="22" ry="22" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="120" y="367" font-size="18" fill="#ead68c" text-anchor="middle">易</text><ellipse cx="330" cy="360" rx="22" ry="22" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="330" y="367" font-size="18" fill="#b7e89f" text-anchor="middle">護</text><ellipse cx="370" cy="260" rx="22" ry="22" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="370" y="267" font-size="18" fill="#ead68c" text-anchor="middle">易</text><text x="45" y="435" font-size="17" fill="#e3e9e2" text-anchor="start">分布與接觸不同，平均覆蓋不足以描述。</text><path d="M455 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M505 235H805" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 210V260M725 210V260" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="295" font-size="20" fill="#ead68c" text-anchor="middle">接種</text><text x="725" y="295" font-size="20" fill="#ead68c" text-anchor="middle">事件</text><text x="505" y="160" font-size="20" fill="#e3e9e2" text-anchor="start">時間先後只是查證起點</text><text x="505" y="365" font-size="20" fill="#c1b2ea" text-anchor="start">背景發生？替代原因？</text><text x="505" y="420" font-size="19" fill="#e3e9e2" text-anchor="start">合適比較與完整安全監測</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>