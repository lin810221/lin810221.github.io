<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-48-title public-48-desc"><title id="public-48-title">臺灣制度分工與服務品質的完整路徑</title><desc id="public-48-desc">上方健保、公共衛生與在地服務以並列角色接到共同服務協作，不表示上下從屬；下方結構、過程、結果與公平為四種檢查面向，提醒就診量不等於品質或健康結果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 48 / 臺灣制度分工與服務品質的完整路徑</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="55.0" y="122" width="240" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="175" y="157" font-size="19" fill="#9ac8e8" text-anchor="middle">健保：納保與支付</text><path d="M175 185L175 240" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M179.3 231.0L175 240L170.7 231.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310.0" y="122" width="240" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430" y="157" font-size="19" fill="#b7e89f" text-anchor="middle">公共衛生：預防監測</text><path d="M430 185L430 240" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M434.3 231.0L430 240L425.7 231.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="565.0" y="122" width="240" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="685" y="157" font-size="19" fill="#c1b2ea" text-anchor="middle">在地醫療與社區</text><path d="M685 185L685 240" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M689.3 231.0L685 240L680.7 231.0" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70.0" y="252" width="720" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430" y="287" font-size="19" fill="#b7e89f" text-anchor="middle">共同服務：轉介、追蹤、資源與資訊協作</text><text x="80" y="348" font-size="18" fill="#e3e9e2" text-anchor="start">以下是品質檢查面向，不是機關的治理層級：</text><rect x="60.0" y="377" width="160" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="140" y="412" font-size="19" fill="#9ac8e8" text-anchor="middle">結構與資源</text><rect x="250.0" y="377" width="160" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="330" y="412" font-size="19" fill="#b7e89f" text-anchor="middle">過程與安全</text><rect x="440.0" y="377" width="160" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="520" y="412" font-size="19" fill="#ead68c" text-anchor="middle">健康與經驗</text><rect x="630.0" y="377" width="160" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="710" y="412" font-size="19" fill="#c1b2ea" text-anchor="middle">公平與可近</text><text x="65" y="451" font-size="18" fill="#e3e9e2" text-anchor="start">概念分工與協作；實際權責、給付與辦法查當期官方資料。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>