<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-38-title public-38-desc"><title id="public-38-title">安全系統與政策把保護放進環境</title><desc id="public-38-desc">左側道路以人行空間、穿越和速度管理位置示意安全系統，右側政策影響價格、供應、資訊與服務；不是只要求個人更小心。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 38 / 安全系統與政策把保護放進環境</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">道路為非比例概念；政策圖不提供單一通用法規或稅率。</text><rect x="55" y="145" width="340" height="250" rx="8" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M150 150V390M295 150V390" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 150V390" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 12"/><path d="M160 255H285" stroke="#e3e9e2" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 275H285" stroke="#e3e9e2" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 295H285" stroke="#e3e9e2" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="95" cy="235" rx="16" ry="16" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M95 253V290M95 270L75 285M95 270L115 285M95 290L80 320M95 290L110 320" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="435" font-size="19" fill="#e3e9e2" text-anchor="start">安全速度、道路、車輛與照護</text><path d="M440 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="495" y="120" width="300" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="645.0" y="156" font-size="20" fill="#9ac8e8" text-anchor="middle">價格與供應</text><rect x="495" y="230" width="300" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="645.0" y="266" font-size="20" fill="#b7e89f" text-anchor="middle">環境與資訊</text><rect x="495" y="340" width="300" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="645.0" y="376" font-size="20" fill="#ead68c" text-anchor="middle">服務與執行</text><text x="495" y="435" font-size="18" fill="#e3e9e2" text-anchor="start">效果、可行性與公平一起評估</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>