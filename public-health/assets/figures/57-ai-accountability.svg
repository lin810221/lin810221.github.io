<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-57-title public-57-desc"><title id="public-57-title">AI輸出進入行動前，還需要驗證與問責</title><desc id="public-57-desc">上方資料、模型與服務使用是不同階段，下方偏差監測及人工覆核回到修訂；高準確度不能取代外部驗證、群體公平與實際公共利益評估。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 57 / AI輸出進入行動前，還需要驗證與問責</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="65.0" y="142" width="160" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="145" y="177" font-size="19" fill="#9ac8e8" text-anchor="middle">資料</text><path d="M232 170L246 170" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M237.0 165.7L246 170L237.0 174.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="255.0" y="142" width="160" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="335" y="177" font-size="19" fill="#b7e89f" text-anchor="middle">模型</text><path d="M422 170L436 170" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M427.0 165.7L436 170L427.0 174.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="445.0" y="142" width="160" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="525" y="177" font-size="19" fill="#ead68c" text-anchor="middle">外部驗證</text><path d="M612 170L626 170" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M617.0 165.7L626 170L617.0 174.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="635.0" y="142" width="160" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="715" y="177" font-size="19" fill="#c1b2ea" text-anchor="middle">使用情境</text><rect x="70.0" y="312" width="220" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="180" y="347" font-size="19" fill="#9ac8e8" text-anchor="middle">分層表現與資料漂移</text><rect x="320.0" y="312" width="220" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430" y="347" font-size="19" fill="#b7e89f" text-anchor="middle">人工責任與申訴管道</text><rect x="570.0" y="312" width="220" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="680" y="347" font-size="19" fill="#c1b2ea" text-anchor="middle">版本、監測與停用條件</text><path d="M720 210V260H180V300" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 378V430H335V210" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="452" font-size="18" fill="#e3e9e2" text-anchor="start">透明說明：資料代表誰、漏掉誰、比較什麼、由誰為決策負責。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>