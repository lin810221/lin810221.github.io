<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-09-title public-09-desc"><title id="public-09-title">同一標準人口與同一比較口徑</title><desc id="public-09-desc">左側A與B的年輕及年長層風險各自連到共同80比20權重；標準化後A3.2%與B2.4%。右方斷開的趨勢線提醒定義改版處不能直接接成生物趨勢。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09 / 同一標準人口與同一比較口徑</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">左例為兩個年齡層虛構風險；標準化值是假想共同組成的摘要。</text><text x="60" y="130" font-size="20" fill="#9ac8e8" text-anchor="start">年齡層：年輕／年長</text><text x="65" y="185" font-size="23" fill="#b7e89f" text-anchor="start">A：2%／8%</text><text x="65" y="235" font-size="23" fill="#c1b2ea" text-anchor="start">B：1.5%／6%</text><path d="M300 200L365 200" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M356.0 195.7L365 200L356.0 204.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="155" width="215" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="487.5" y="190" font-size="20" fill="#ead68c" text-anchor="middle">共同權重80／20</text><path d="M487 225L487 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M491.3 256.0L487 265L482.7 256.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="487" y="305" font-size="25" fill="#b7e89f" text-anchor="middle">A：3.2%</text><text x="487" y="350" font-size="25" fill="#c1b2ea" text-anchor="middle">B：2.4%</text><path d="M655 170V365H815" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 330L700 310L725 315" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 250L780 230L805 210" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M738 145V375" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="738" y="415" font-size="18" fill="#ead68c" text-anchor="middle">定義改版</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>