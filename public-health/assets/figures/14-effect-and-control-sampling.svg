<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-14-title public-14-desc"><title id="public-14-title">絕對效應與對照抽樣設計</title><desc id="public-14-desc">左側同兩組風險同時展示相差10百分點與倍數2，效應尺度回答不同問題；右側三個風險集合在不同時間抽對照，同一人可能再次被抽或後來發病。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14 / 絕對效應與對照抽樣設計</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">對照抽樣要與來源病例風險相連；OR詮釋不只有罕見疾病近似。</text><text x="65" y="145" font-size="24" fill="#9ac8e8" text-anchor="start">風險20%與10%</text><path d="M90 220H350" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="90" cy="220" rx="10" ry="10" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="350" cy="220" rx="10" ry="10" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="90" y="265" font-size="20" fill="#c1b2ea" text-anchor="middle">10%</text><text x="350" y="265" font-size="20" fill="#b7e89f" text-anchor="middle">20%</text><text x="65" y="325" font-size="24" fill="#b7e89f" text-anchor="start">差：10百分點</text><text x="65" y="375" font-size="24" fill="#c1b2ea" text-anchor="start">比：2倍</text><path d="M485 160L785 160" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M776.0 155.7L785 160L776.0 164.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="515" cy="245" rx="40" ry="52" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="495" cy="235" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="515" cy="235" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="535" cy="235" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="495" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="515" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="535" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><path d="M515 175V185" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="515" y="332" font-size="18" fill="#b7e89f" text-anchor="middle">抽樣</text><ellipse cx="635" cy="245" rx="40" ry="52" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="615" cy="235" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="635" cy="235" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="655" cy="235" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="615" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="635" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="655" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><path d="M635 175V185" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="332" font-size="18" fill="#ead68c" text-anchor="middle">抽樣</text><ellipse cx="755" cy="245" rx="40" ry="52" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="735" cy="235" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="755" cy="235" rx="5" ry="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="775" cy="235" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="735" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="755" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><ellipse cx="775" cy="255" rx="5" ry="5" stroke="#668173" fill="#17251e" stroke-width="3"/><path d="M755 175V185" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="755" y="332" font-size="18" fill="#c1b2ea" text-anchor="middle">抽樣</text><text x="640" y="405" font-size="20" fill="#9ac8e8" text-anchor="middle">風險集合抽樣可估率比</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>