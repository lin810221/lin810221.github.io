<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-22-title public-22-desc"><title id="public-22-title">監測是把訊號送回行動的循環</title><desc id="public-22-desc">左側從資料蒐集、分析、解釋到行動與回饋形成循環，右側不同監測方式各有取樣與偵測位置；箭頭表示資訊流而非必然因果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 22 / 監測是把訊號送回行動的循環</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">循環為工作流程；右側不是效能排名，各方法可能並用。</text><rect x="55" y="120" width="180" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="145.0" y="156" font-size="20" fill="#9ac8e8" text-anchor="middle">蒐集</text><rect x="300" y="120" width="180" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="390.0" y="156" font-size="20" fill="#b7e89f" text-anchor="middle">分析</text><rect x="300" y="290" width="180" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="390.0" y="326" font-size="20" fill="#ead68c" text-anchor="middle">解釋</text><rect x="55" y="290" width="180" height="57" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="145.0" y="326" font-size="20" fill="#c1b2ea" text-anchor="middle">行動</text><path d="M240 148L290 148" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M281.0 143.7L290 148L281.0 152.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 190L390 275" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M394.3 266.0L390 275L385.7 266.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 318L245 318" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.0 322.3L245 318L254.0 313.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 275L145 190" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140.7 199.0L145 190L149.3 199.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="415" font-size="20" fill="#9ac8e8" text-anchor="start">回饋會改變下一輪蒐集</text><path d="M535 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="575" y="140" font-size="20" fill="#e3e9e2" text-anchor="start">被動：常規通報</text><text x="575" y="210" font-size="20" fill="#e3e9e2" text-anchor="start">主動：主動搜尋</text><text x="575" y="280" font-size="20" fill="#e3e9e2" text-anchor="start">哨點：固定據點</text><text x="575" y="350" font-size="20" fill="#e3e9e2" text-anchor="start">症候群：較早訊號</text><text x="575" y="420" font-size="18" fill="#ead68c" text-anchor="start">誰被看見？誰漏掉？</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>