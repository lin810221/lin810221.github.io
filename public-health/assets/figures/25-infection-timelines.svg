<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-25-title public-25-desc"><title id="public-25-title">傳播路徑與不同的時間起點</title><desc id="public-25-desc">上方感染鏈把來源、離開、環境路徑與易感宿主連接；下方由感染起點分別標出症狀開始和開始具有傳染力，兩個等待區間可以不同。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 25 / 傳播路徑與不同的時間起點</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">箭頭是可能路徑；時間軸非比例，此例存在症狀前傳播窗口。</text><rect x="35" y="120" width="145" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="107.5" y="156" font-size="20" fill="#9ac8e8" text-anchor="middle">來源</text><rect x="240" y="120" width="145" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="312.5" y="156" font-size="20" fill="#ead68c" text-anchor="middle">路徑</text><rect x="445" y="120" width="145" height="57" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="517.5" y="156" font-size="20" fill="#c1b2ea" text-anchor="middle">進入</text><rect x="650" y="120" width="175" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="737.5" y="156" font-size="20" fill="#b7e89f" text-anchor="middle">易感宿主</text><path d="M190 149L230 149" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M221.0 144.7L230 149L221.0 153.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M395 149L435 149" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M426.0 144.7L435 149L426.0 153.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 149L640 149" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M631.0 144.7L640 149L631.0 153.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 310H785" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 280V335M350 280V335M580 280V335" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="370" font-size="20" fill="#ead68c" text-anchor="middle">感染</text><text x="350" y="370" font-size="20" fill="#ead68c" text-anchor="middle">具傳染力</text><text x="580" y="370" font-size="20" fill="#ead68c" text-anchor="middle">有症狀</text><path d="M100 265H350" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 230H580" stroke="#c1b2ea" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="218" font-size="18" fill="#c1b2ea" text-anchor="start">潛伏期：感染 → 症狀</text><text x="105" y="422" font-size="18" fill="#b7e89f" text-anchor="start">潛隱期：感染 → 開始具傳染力</text><text x="450" y="451" font-size="17" fill="#e3e9e2" text-anchor="start">僅示一種先後，非固定時數</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>