<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-52-title public-52-desc"><title id="public-52-title">多種危害，需要共同的應變能力</title><desc id="public-52-desc">左側感染、熱害與停電等事件可產生不同需求；中央協調中心連接現場、醫療與後勤資訊，連線為協作與資源流而非單一機關包辦所有工作。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 52 / 多種危害，需要共同的應變能力</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="52.5" y="117" width="245" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="175" y="152" font-size="19" fill="#9ac8e8" text-anchor="middle">感染群聚</text><path d="M310 145L390 245" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M387.8 235.3L390 245L381.0 240.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="52.5" y="217" width="245" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="175" y="252" font-size="19" fill="#ead68c" text-anchor="middle">極端高溫</text><path d="M310 245L390 245" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M381.0 240.7L390 245L381.0 249.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="52.5" y="317" width="245" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="175" y="352" font-size="19" fill="#c1b2ea" text-anchor="middle">停電與淹水</text><path d="M310 345L390 245" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M381.0 249.3L390 245L387.8 254.7" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="515" cy="245" rx="105" ry="70" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="515" y="243" font-size="23" fill="#b7e89f" text-anchor="middle">共同情勢</text><text x="515" y="273" font-size="19" fill="#b7e89f" text-anchor="middle">協調與決策</text><rect x="650.0" y="112" width="170" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="735" y="147" font-size="19" fill="#9ac8e8" text-anchor="middle">現場</text><path d="M625 245L638 140" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M632.6 148.4L638 140L641.2 149.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="650.0" y="217" width="170" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="735" y="252" font-size="19" fill="#ead68c" text-anchor="middle">醫療</text><path d="M625 245L638 245" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M629.0 240.7L638 245L629.0 249.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="650.0" y="322" width="170" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="735" y="357" font-size="19" fill="#c1b2ea" text-anchor="middle">後勤</text><path d="M625 245L638 350" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M641.2 340.5L638 350L632.6 341.6" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="440" font-size="19" fill="#e3e9e2" text-anchor="start">整備也包括日常服務、人員替補、資料標準與演練。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>