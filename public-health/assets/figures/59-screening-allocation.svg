<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-59-title public-59-desc"><title id="public-59-title">專題：篩檢結果接到追蹤與資源</title><desc id="public-59-desc">低盛行率例中一萬人預期真陽性90、偽陽性495，兩者皆會進入陽性後續路徑；另一側成本效果比較需連同預算、容量與公平，而非看到陽性就等於健康改善。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 59 / 專題：篩檢結果接到追蹤與資源</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">僅為期望人數與決策路徑；不是任何檢驗或篩檢計畫的推薦。</text><rect x="55.0" y="127" width="260" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="185" y="162" font-size="19" fill="#9ac8e8" text-anchor="middle">篩檢10000人</text><path d="M185 190L185 225" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.3 216.0L185 225L180.7 216.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55.0" y="237" width="260" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="185" y="272" font-size="19" fill="#ead68c" text-anchor="middle">陽性585：真90、偽495</text><path d="M330 265L405 265" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M396.0 260.7L405 265L396.0 269.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="420.0" y="237" width="270" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="555" y="272" font-size="19" fill="#b7e89f" text-anchor="middle">確診、說明與後續照護</text><text x="70" y="390" font-size="17" fill="#e3e9e2" text-anchor="start">1%盛行率、敏感度90%、特異度95%</text><text x="455" y="135" font-size="21" fill="#c1b2ea" text-anchor="start">資源與公平的後續問題</text><text x="465" y="365" font-size="18" fill="#e3e9e2" text-anchor="start">誰完成追蹤？需要多少容量？</text><text x="465" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">增量成本／QALY不是預算總額</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>