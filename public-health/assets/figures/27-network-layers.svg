<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-27-title public-27-desc"><title id="public-27-title">接觸異質性與多層防護</title><desc id="public-27-desc">左側網絡中連線數不同，中央節點連結多個群體；右側把來源、環境和宿主作成三個防護位置，不能將節點顏色視為已知感染。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27 / 接觸異質性與多層防護</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">接觸圖非真實社群；防護依病原、場域、可行性與公平條件設計。</text><path d="M80.0 160L146.66666666666666 125" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80.0 160L105.0 290" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M146.66666666666666 125L207.77777777777777 190" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.77777777777777 190L105.0 290" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.77777777777777 190L188.33333333333334 330" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.77777777777777 190L280.0 240" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105.0 290L188.33333333333334 330" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M188.33333333333334 330L280.0 240" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.0 240L368.88888888888886 150" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.0 240L438.3333333333333 205" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280.0 240L393.88888888888886 330" s