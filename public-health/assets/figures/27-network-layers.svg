 fill="#17251e" stroke-width="2"/><text x="670.0" y="156" font-size="20" fill="#ead68c" text-anchor="middle">來源：減少排出</text><rect x="535" y="240" width="270" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="670.0" y="276" font-size="20" fill="#9ac8e8" text-anchor="middle">環境：中斷路徑</text><rect x="535" y="360" width="270" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="670.0" y="396" font-size="20" fill="#b7e89f" text-anchor="middle">宿主：降低易感</text><path d="M670 190L670 225" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M674.3 216.0L670 225L665.7 216.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 310L670 345" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M674.3 336.0L670 345L665.7 336.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>