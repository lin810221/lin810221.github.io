<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-02-title public-02-desc"><title id="public-02-title">生命歷程與人口分布的改變</title><desc id="public-02-desc">上方由出生、成長、工作至高齡的時間帶表示條件可累積並有轉折；下方兩條任意分布示意整體曝露往較低方向移動，高風險尾端仍可另外照護。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02 / 生命歷程與人口分布的改變</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">分布為任意概念曲線；位置改變不代表已量得某政策療效。</text><path d="M80 155L780 155" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M771.0 150.7L780 155L771.0 159.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="100" cy="155" rx="11" ry="11" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="100" y="125" font-size="19" fill="#b7e89f" text-anchor="middle">出生</text><ellipse cx="300" cy="155" rx="11" ry="11" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="300" y="125" font-size="19" fill="#9ac8e8" text-anchor="middle">成長</text><ellipse cx="500" cy="155" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="500" y="125" font-size="19" fill="#ead68c" text-anchor="middle">工作</text><ellipse cx="740" cy="155" rx="11" ry="11" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="740" y="125" font-size="19" fill="#c1b2ea" text-anchor="middle">高齡</text><text x="75" y="200" font-size="18" fill="#e3e9e2" text-anchor="start">住房、教育、工作與支持可在不同時點改變</text><path d="M75 240V410H760" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 405C140 400 150 265 280 265S420 400 510 405" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 405C270 400 280 265 410 265S550 400 640 405" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 245V410" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="600" y="255" font-size="17" fill="#ead68c" text-anchor="start">高曝露尾端</text><path d="M450 310L350 310" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M359.0 314.3L350 310L359.0 305.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="445" font-size="17" fill="#9ac8e8" text-anchor="start">曝露尺度 →（任意單位）</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>