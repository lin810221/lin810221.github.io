<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-29-title public-29-desc"><title id="public-29-title">聚餐比較：每組都有生病與未生病</title><desc id="public-29-desc">固定參與者世代中吃某食物者十八病十二未病，未吃者六病二十四未病；圖示各組三十人，風險為60%與20%，差異本身不證明來源。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 29 / 聚餐比較：每組都有生病與未生病</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">所有數字為原創；比較同一追蹤期間，沒有用人時作分母。</text><text x="65" y="125" font-size="22" fill="#9ac8e8" text-anchor="start">已知參加者的固定世代</text><path d="M65 165H790V355H65ZM345 165V355M565 165V355M65 225H790M65 290H790" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="204" font-size="20" fill="#e3e9e2" text-anchor="start">曝露</text><text x="420" y="204" font-size="20" fill="#e3e9e2" text-anchor="start">生病</text><text x="640" y="204" font-size="20" fill="#e3e9e2" text-anchor="start">未生病</text><text x="85" y="266" font-size="20" fill="#e3e9e2" text-anchor="start">吃過該食物</text><text x="455" y="266" font-size="22" fill="#b7e89f" text-anchor="start">18</text><text x="680" y="266" font-size="22" fill="#e3e9e2" text-anchor="start">12</text><text x="85" y="333" font-size="20" fill="#e3e9e2" text-anchor="start">未吃該食物</text><text x="455" y="333" font-size="22" fill="#ead68c" text-anchor="start">6</text><text x="680" y="333" font-size="22" fill="#e3e9e2" text-anchor="start">24</text><text x="65" y="415" font-size="21" fill="#b7e89f" text-anchor="start">風險：18/30＝60%；6/30＝20%；RR＝3</text><text x="65" y="453" font-size="17" fill="#e3e9e2" text-anchor="start">病例對照取樣時，不能把這種列比例直接當人口風險。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>