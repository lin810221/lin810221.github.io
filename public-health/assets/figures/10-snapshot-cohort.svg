<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-10-title public-10-desc"><title id="public-10-title">橫斷快照與世代追蹤的時間</title><desc id="public-10-desc">上方單一垂直線表示橫斷調查量測當時曝露與健康狀態；下方兩條追蹤線從共同基線出發，到相同結果期間，比較設計需保留抽樣與失訪。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 10 / 橫斷快照與世代追蹤的時間</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">時間方向表示觀察結構，非已證實因果；回溯資料也可建立世代。</text><path d="M85 170L785 170" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M776.0 165.7L785 170L776.0 174.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 115V225" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="110" font-size="22" fill="#ead68c" text-anchor="middle">橫斷量測時點</text><text x="390" y="223" font-size="18" fill="#ead68c" text-anchor="middle">當時的曝露＋結果</text><path d="M140 305L785 305" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M776.0 300.7L785 305L776.0 309.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 395L785 395" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M776.0 390.7L785 395L776.0 399.3" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 270V425" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="270" font-size="19" fill="#9ac8e8" text-anchor="start">共同基線</text><text x="175" y="297" font-size="20" fill="#b7e89f" text-anchor="start">曝露組：追蹤結果</text><text x="175" y="387" font-size="20" fill="#c1b2ea" text-anchor="start">未曝露組：追蹤結果</text><ellipse cx="600" cy="305" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="705" cy="395" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>