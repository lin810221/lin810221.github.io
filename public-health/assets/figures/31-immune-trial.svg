<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-31-title public-31-desc"><title id="public-31-title">免疫記憶與可比較的疫苗終點</title><desc id="public-31-desc">左側抗原接觸、免疫記憶與後續反應為原理示意，右側虛構兩組各千人的同終點風險為2%和8%；抗體量測和臨床保護不是同一結果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 31 / 免疫記憶與可比較的疫苗終點</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">免疫形狀非比例；數字為原創試驗式案例，不是接種時程或個人建議。</text><ellipse cx="120" cy="180" rx="30" ry="30" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M150.0 180.0L165.0 180.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M141.2 201.2L151.8 211.8" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.0 210.0L120.0 225.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M98.8 201.2L88.2 211.8" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90.0 180.0L75.0 180.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M98.8 158.8L88.2 148.2" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.0 150.0L120.0 135.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M141.2 158.8L151.8 148.2" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="260" font-size="20" fill="#ead68c" text-anchor="middle">抗原訊號</text><path d="M175 180L250 180" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M241.0 175.7L250 180L241.0 184.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="315" cy="180" rx="40" ry="40" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="315" y="260" font-size="20" fill="#b7e89f" text-anchor="middle">記憶反應</text><text x="65" y="370" font-size="20" fill="#e3e9e2" text-anchor="start">免疫標記 ≠ 所有健康終點</text><path d="M440 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="135" font-size="22" fill="#9ac8e8" text-anchor="start">同一追蹤與定義</text><text x="490" y="210" font-size="20" fill="#b7e89f" text-anchor="start">接種：20/1000＝2%</text><text x="490" y="290" font-size="20" fill="#ead68c" text-anchor="start">未接種：80/1000＝8%</text><text x="490" y="370" font-size="19" fill="#c1b2ea" text-anchor="start">相對降低75%；絕對6百分點</text><text x="490" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">本例非真實產品性能</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>