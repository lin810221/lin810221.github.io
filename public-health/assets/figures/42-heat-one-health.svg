<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-42-title public-42-desc"><title id="public-42-title">熱風險與One Health共同責任</title><desc id="public-42-desc">左側城市熱曝露與脆弱、調適條件交會，右側人、動物植物與環境以共同監測和行動連接；不把單一氣溫或物種當成完整風險。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 42 / 熱風險與One Health共同責任</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">城市非實測熱地圖；乘號是交會概念，非可相乘的個人風險算式。</text><ellipse cx="130" cy="155" rx="35" ry="35" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M178.0 155.0L195.0 155.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M163.9 188.9L176.0 201.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130.0 203.0L130.0 220.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M96.1 188.9L84.0 201.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M82.0 155.0L65.0 155.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M96.1 121.1L84.0 109.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130.0 107.0L130.0 90.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M163.9 121.1L176.0 109.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="255" width="60" height="100" rx="2" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="145" y="215" width="60" height="140" rx="2" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="225" y="275" width="60" height="80" rx="2" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="305" y="235" width="60" height="120" rx="2" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="55" y="415" font-size="19" fill="#e3e9e2" text-anchor="start">曝露 × 脆弱 × 調適條件</text><path d="M450 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="650" cy="155" rx="75" ry="40" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="540" cy="340" rx="75" ry="40" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="755" cy="340" rx="75" ry="40" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="650" y="163" font-size="23" fill="#b7e89f" text-anchor="middle">人</text><text x="540" y="347" font-size="18" fill="#9ac8e8" text-anchor="middle">動物／植物</text><text x="755" y="347" font-size="22" fill="#c1b2ea" text-anchor="middle">環境</text><path d="M620 198L565 295M680 198L730 295M625 340H670" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="260" font-size="20" fill="#ead68c" text-anchor="middle">協作</text><text x="505" y="440" font-size="19" fill="#e3e9e2" text-anchor="start">原2022–2026計畫延長至2029</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>