<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-58-title public-58-desc"><title id="public-58-title">專題：社區分母與疫情時間不能混用</title><desc id="public-58-desc">左側基線1000人中100人已有疾病，新發45人來自900名無病者，人時另計810；右側發病日已知31人以每日柱狀表示，另3人未知不塞入零病例日。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 58 / 專題：社區分母與疫情時間不能混用</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">兩個獨立虛構案例；柱高對應人數，不是真實疫情或季節預測。</text><rect x="50" y="120" width="350" height="310" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="70" y="155" font-size="22" fill="#9ac8e8" text-anchor="start">基線1000人</text><text x="70" y="208" font-size="20" fill="#e3e9e2" text-anchor="start">已有100／1000＝10%</text><text x="70" y="260" font-size="20" fill="#b7e89f" text-anchor="start">新發45／900＝5%</text><text x="70" y="312" font-size="21" fill="#ead68c" text-anchor="start">45／810人年</text><text x="70" y="362" font-size="20" fill="#ead68c" text-anchor="start">＝5.56／100人年</text><path d="M460 360V135M460 360H805" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="360" width="22" height="1" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="486" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">1</text><rect x="506" y="340" width="22" height="20" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="517" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">2</text><rect x="537" y="320" width="22" height="40" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="548" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">3</text><rect x="568" y="260" width="22" height="100" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="579" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">4</text><rect x="599" y="180" width="22" height="180" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="610" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">5</text><rect x="630" y="220" width="22" height="140" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="641" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">6</text><rect x="661" y="280" width="22" height="80" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="672" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">7</text><rect x="692" y="320" width="22" height="40" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="703" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">8</text><rect x="723" y="340" width="22" height="20" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="734" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">9</text><rect x="754" y="360" width="22" height="1" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="765" y="385" font-size="14" fill="#e3e9e2" text-anchor="middle">10</text><text x="465" y="125" font-size="20" fill="#9ac8e8" text-anchor="start">虛構發病日曲線</text><text x="470" y="425" font-size="18" fill="#c1b2ea" text-anchor="start">已知31；另3例發病日未知</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>