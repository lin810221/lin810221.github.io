<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-08-title public-08-desc"><title id="public-08-title">發病時間與小區域的分母</title><desc id="public-08-desc">左方以發病日繪十天的31名已知病例，另外3名發病日未知保留在圖外；右側兩個地區同有2例，但人口100與1000帶來不同粗比例，小數也更不穩定。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08 / 發病時間與小區域的分母</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">所有人數虛構；柱形不能單憑形狀證明傳播途徑或來源。</text><path d="M60 145V365H450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="365" width="24" height="0" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="114" y="345" width="24" height="20" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="148" y="325" width="24" height="40" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="182" y="265" width="24" height="100" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="216" y="185" width="24" height="180" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="250" y="225" width="24" height="140" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="284" y="285" width="24" height="80" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="318" y="325" width="24" height="40" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="352" y="345" width="24" height="20" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="386" y="365" width="24" height="0" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="250" y="405" font-size="18" fill="#9ac8e8" text-anchor="middle">發病日1 → 10；已知31例</text><text x="250" y="440" font-size="17" fill="#ead68c" text-anchor="middle">另3例日期未知，不補成第11天</text><rect x="520" y="130" width="280" height="115" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="660" y="173" font-size="23" fill="#b7e89f" text-anchor="middle">甲區：2／100</text><text x="660" y="215" font-size="22" fill="#b7e89f" text-anchor="middle">粗比例2%</text><rect x="520" y="285" width="280" height="115" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="660" y="328" font-size="23" fill="#c1b2ea" text-anchor="middle">乙區：2／1000</text><text x="660" y="370" font-size="22" fill="#c1b2ea" text-anchor="middle">粗比例0.2%</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>