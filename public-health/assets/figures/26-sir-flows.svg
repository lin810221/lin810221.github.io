<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-26-title public-26-desc"><title id="public-26-title">SIR：人數流動與再生數的條件</title><desc id="public-26-desc">三個狀態以感染與移出流量連接，封閉人口中S加I加R守恆；下方R0與Rt的關係只限本圖均勻混合、固定參數的玩具模型。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 26 / SIR：人數流動與再生數的條件</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">三格是人數狀態，箭頭標每單位時間流量；無出生、死亡與外來輸入。</text><rect x="50" y="150" width="190" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="145.0" y="186" font-size="20" fill="#9ac8e8" text-anchor="middle">S 易感</text><rect x="335" y="150" width="190" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="430.0" y="186" font-size="20" fill="#ead68c" text-anchor="middle">I 具傳染力</text><rect x="620" y="150" width="190" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="715.0" y="186" font-size="20" fill="#b7e89f" text-anchor="middle">R 已移出</text><path d="M255 179L320 179" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.0 174.7L320 179L311.0 183.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 179L605 179" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M596.0 174.7L605 179L596.0 183.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="133" font-size="19" fill="#9ac8e8" text-anchor="middle">βSI/N</text><text x="570" y="133" font-size="19" fill="#ead68c" text-anchor="middle">γI</text><text x="430" y="270" font-size="26" fill="#b7e89f" text-anchor="middle">S + I + R = 1000</text><text x="85" y="335" font-size="21" fill="#e3e9e2" text-anchor="start">β＝0.3／日；γ＝0.1／日</text><text x="85" y="390" font-size="21" fill="#c1b2ea" text-anchor="start">R0＝3；起始Rt＝3 × 990/1000＝2.97</text><text x="85" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">R是模型移出狀態，不是再生數R0的縮寫。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>