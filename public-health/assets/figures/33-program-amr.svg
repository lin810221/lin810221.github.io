<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-33-title public-33-desc"><title id="public-33-title">免疫服務與抗藥性需要跨系統工作</title><desc id="public-33-desc">左側由服務可近、供應與完成接種構成計畫路徑，右側病原在選擇壓力與傳播間形成抗藥性問題；減少不必要使用與確保必要治療都重要。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 33 / 免疫服務與抗藥性需要跨系統工作</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">病原圓點為選擇與擴散示意，不是人體變得抗藥或真實培養結果。</text><rect x="45" y="125" width="310" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="200.0" y="161" font-size="20" fill="#9ac8e8" text-anchor="middle">找到服務：時間、距離、信任</text><rect x="45" y="245" width="310" height="57" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="200.0" y="281" font-size="20" fill="#b7e89f" text-anchor="middle">供應、冷鏈與品質</text><rect x="45" y="365" width="310" height="57" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="200.0" y="401" font-size="20" fill="#ead68c" text-anchor="middle">完成與持續追蹤</text><path d="M200 195L200 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M204.3 221.0L200 230L195.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 315L200 350" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M204.3 341.0L200 350L195.7 341.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="500" cy="170" rx="12" ry="12" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="555" cy="170" rx="12" ry="12" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="610" cy="170" rx="12" ry="12" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="665" cy="170" rx="12" ry="12" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="720" cy="170" rx="12" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="775" cy="170" rx="12" ry="12" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M640 210L640 270" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M644.3 261.0L640 270L635.7 261.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="510" cy="320" rx="12" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="558" cy="320" rx="12" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="606" cy="320" rx="12" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="654" cy="320" rx="12" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="702" cy="320" rx="12" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="750" cy="320" rx="12" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="470" y="400" font-size="21" fill="#c1b2ea" text-anchor="start">選擇壓力與傳播</text><text x="470" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">人、動物、植物與環境一起看</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>