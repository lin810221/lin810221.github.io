<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-18-title public-18-desc"><title id="public-18-title">集中不等於接近目標</title><desc id="public-18-desc">左側靶心為目標量，兩群重複估計點分別呈現集中但偏移與分散但較居中的概念；右方沿選人、量測、分析三段追蹤可能偏差，不能只看樣本量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18 / 集中不等於接近目標</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">靶圖是概念，不是研究結果的數值分布；未知偏差需列方向條件。</text><ellipse cx="230" cy="260" rx="130" ry="130" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="230" cy="260" rx="75" ry="75" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="230" cy="260" rx="20" ry="20" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="310" cy="190" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="322" cy="182" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="316" cy="198" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="329" cy="194" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="312" cy="179" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="160" cy="220" rx="6" ry="6" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="265" cy="310" rx="6" ry="6" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="215" cy="335" rx="6" ry="6" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="285" cy="210" rx="6" ry="6" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="190" cy="180" rx="6" ry="6" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="230" y="425" font-size="17" fill="#9ac8e8" text-anchor="middle">黃點：精密但偏移；紫點：較分散</text><rect x="490" y="130" width="285" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="632.5" y="165" font-size="20" fill="#ead68c" text-anchor="middle">選人：來源與失訪</text><rect x="490" y="240" width="285" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="632.5" y="275" font-size="20" fill="#9ac8e8" text-anchor="middle">量測：定義與錯分</text><rect x="490" y="350" width="285" height="55" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="632.5" y="385" font-size="20" fill="#c1b2ea" text-anchor="middle">分析：調整與假設</text><path d="M630 195L630 225" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.3 216.0L630 225L625.7 216.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 305L630 335" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M634.3 326.0L630 335L625.7 326.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創教學示意；數字與族群均為虛構。先辨定義、分母、時間與箭頭意義。</text></g></svg>