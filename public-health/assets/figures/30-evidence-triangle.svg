<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-30-title public-30-desc"><title id="public-30-title">疫情證據是互相核對的三條線</title><desc id="public-30-desc">三角形三端分別為流行病學、實驗室和環境調查，中央保留待解問題；右側短枝樹僅示意樣本相近，不證明誰感染誰。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30 / 疫情證據是互相核對的三條線</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">線表示證據整合或相近分枝；無真實序列、比例尺或傳播方向。</text><path d="M100 370L285 135L470 370Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="285" cy="135" rx="45" ry="32" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="100" cy="370" rx="45" ry="32" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="470" cy="370" rx="45" ry="32" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="285" y="205" font-size="21" fill="#b7e89f" text-anchor="middle">流行病學</text><text x="60" y="435" font-size="21" fill="#ead68c" text-anchor="start">實驗室</text><text x="420" y="435" font-size="21" fill="#c1b2ea" text-anchor="start">環境</text><text x="285" y="315" font-size="22" fill="#e3e9e2" text-anchor="middle">共同查證</text><path d="M535 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="130" font-size="19" fill="#ead68c" text-anchor="start">序列相近 ≠ 傳染方向</text><path d="M585 320H635M635 235V365M635 235H685M635 365H685M685 200V270M685 200H785M685 270H785" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="207" font-size="18" fill="#b7e89f" text-anchor="start">甲</text><text x="790" y="277" font-size="18" fill="#b7e89f" text-anchor="start">乙</text><text x="690" y="372" font-size="18" fill="#c1b2ea" text-anchor="start">環境樣本</text><text x="570" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">仍需採樣、接觸與時間</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>