<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-17-title public-17-desc"><title id="public-17-title">未知保留空白，共同原因保留位置</title><desc id="public-17-desc">左側30個欄位中24有值、6未知，完整率80%只描述欄位；右側共同原因C同時指向曝露E和結果Y，後門路徑與缺失問題需分別思考。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 17 / 未知保留空白，共同原因保留位置</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">方格為欄位而非人口；DAG箭頭是假設因果關係，不能由相關矩陣自動證明。</text><text x="60" y="130" font-size="21" fill="#9ac8e8" text-anchor="start">資料完整性：24／30＝80%</text><rect x="70" y="165" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="115" y="165" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="160" y="165" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="205" y="165" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="250" y="165" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="295" y="165" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="70" y="205" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="115" y="205" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="160" y="205" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="205" y="205" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="250" y="205" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="295" y="205" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="70" y="245" width="32" height="28" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-widt