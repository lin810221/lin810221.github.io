<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-39-title public-39-desc"><title id="public-39-title">群體心理支持與慢性病服務的連續性</title><desc id="public-39-desc">左側把生活條件、社會連結和服務支持共同放在人周圍，右側服務漏斗顯示被找到、能到達和持續照護不相同；面積不是實際資料比例。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 39 / 群體心理支持與慢性病服務的連續性</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">圖不計算心理疾病診斷或個人分數；漏斗用來找服務卡點。</text><ellipse cx="225" cy="275" rx="55" ry="60" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="225" y="283" font-size="27" fill="#b7e89f" text-anchor="middle">人</text><rect x="50" y="120" width="350" height="57" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="225.0" y="156" font-size="20" fill="#9ac8e8" text-anchor="middle">生活、工作與居住條件</text><rect x="50" y="360" width="350" height="57" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="225.0" y="396" font-size="20" fill="#c1b2ea" text-anchor="middle">社會連結與可取得服務</text><path d="M225 190L225 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M229.3 196.0L225 205L220.7 196.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 340L225 345" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M229.3 336.0L225 345L220.7 336.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 140H800L770 245H540Z" stroke="#9ac8e8" stroke-width="2" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M545 260H765L740 345H570Z" stroke="#b7e89f" stroke-width="2" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M575 360H735L715 425H595Z" stroke="#ead68c" stroke-width="2" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="655" y="198" font-size="22" fill="#9ac8e8" text-anchor="middle">被辨識</text><text x="655" y="310" font-size="22" fill="#b7e89f" text-anchor="middle">能到達</text><text x="655" y="402" font-size="21" fill="#ead68c" text-anchor="middle">持續照護</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>