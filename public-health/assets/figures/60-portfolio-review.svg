<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-60-title public-60-desc"><title id="public-60-title">交付：可查核、可更新的人口健康提案</title><desc id="public-60-desc">人口、量測、比較與行動四種資訊接到有版本的提案，回饋與新證據再連回修訂；每條連線表示需要說明的依據，未知不能被漂亮的圖遮住。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 60 / 交付：可查核、可更新的人口健康提案</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="50.0" y="107" width="260" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="180" y="142" font-size="19" fill="#9ac8e8" text-anchor="middle">人口與公平</text><path d="M325 135L465 250" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M460.8 240.9L465 250L455.3 247.6" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="195" width="260" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="180" y="230" font-size="19" fill="#b7e89f" text-anchor="middle">定義、時間與分母</text><path d="M325 223L465 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M457.0 244.0L465 250L455.3 252.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="283" width="260" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="180" y="318" font-size="19" fill="#ead68c" text-anchor="middle">比較、因果與限制</text><path d="M325 311L465 250" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M455.0 249.6L465 250L458.5 257.6" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="371" width="260" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="180" y="406" font-size="19" fill="#c1b2ea" text-anchor="middle">行動、資源與監測</text><path d="M325 399L465 250" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M455.7 253.6L465 250L462.0 259.5" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="140" width="305" height="225" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="515" y="185" font-size="24" fill="#b7e89f" text-anchor="start">人口健康行動提案</text><text x="515" y="245" font-size="19" fill="#e3e9e2" text-anchor="start">來源、日期、版本與責任</text><text x="515" y="305" font-size="19" fill="#e3e9e2" text-anchor="start">未知、待查與修訂條件</text><path d="M640 380V435H180V425" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="460" font-size="18" fill="#9ac8e8" text-anchor="start">評估、回饋與重新選擇</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>