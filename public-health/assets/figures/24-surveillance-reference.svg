<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-24-title public-24-desc"><title id="public-24-title">系統表現與公開數字的口徑</title><desc id="public-24-desc">左側以參照狀態和監測報告組成二乘二表，右側公開統計必須附病例分類、日期種類、地區與截點；沒有真實地區病例數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 24 / 系統表現與公開數字的口徑</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">表中用分類名稱而非實際人數；右側欄位需逐資料集核對。</text><text x="45" y="130" font-size="22" fill="#9ac8e8" text-anchor="start">監測報告與參照狀態</text><path d="M45 165H430V350H45ZM200 165V350M315 165V350M45 220H430M45 285H430" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="202" font-size="18" fill="#e3e9e2" text-anchor="start">參照</text><text x="218" y="202" font-size="18" fill="#e3e9e2" text-anchor="start">有報告</text><text x="328" y="202" font-size="18" fill="#e3e9e2" text-anchor="start">無報告</text><text x="65" y="260" font-size="18" fill="#e3e9e2" text-anchor="start">符合病例</text><text x="230" y="260" font-size="18" fill="#b7e89f" text-anchor="start">真陽</text><text x="335" y="260" font-size="18" fill="#ead68c" text-anchor="start">漏報</text><text x="65" y="325" font-size="18" fill="#e3e9e2" text-anchor="start">不符合</text><text x="230" y="325" font-size="18" fill="#ead68c" text-anchor="start">誤報</text><text x="335" y="325" font-size="18" fill="#b7e89f" text-anchor="start">真陰</text><path d="M470 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="515" y="140" font-size="22" fill="#c1b2ea" text-anchor="start">公開資料核對卡</text><text x="515" y="205" font-size="20" fill="#e3e9e2" text-anchor="start">病例定義與分類</text><text x="515" y="265" font-size="20" fill="#e3e9e2" text-anchor="start">發病／通報日期</text><text x="515" y="325" font-size="20" fill="#e3e9e2" text-anchor="start">地區／人口分母</text><text x="515" y="385" font-size="20" fill="#e3e9e2" text-anchor="start">下載截點與版本</text><text x="45" y="425" font-size="19" fill="#e3e9e2" text-anchor="start">沒有有效參照，不能由完整率算出偵測敏感度。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>