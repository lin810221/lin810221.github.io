<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-35-title public-35-desc"><title id="public-35-title">陽性預測值與提早診斷分開解讀</title><desc id="public-35-desc">左側同樣敏感度90%特異度95%且一萬人的案例，盛行率不同造成陽性中的真陽比例改變；右側提早診斷若不延後死亡，存活期仍可能變長。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35 / 陽性預測值與提早診斷分開解讀</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">左側色塊使用相同計數比例；右側僅示前置時間偏差，非真實存活資料。</text><text x="45" y="125" font-size="20" fill="#9ac8e8" text-anchor="start">同規格檢測、一萬人</text><text x="45" y="178" font-size="18" fill="#e3e9e2" text-anchor="start">盛行1%：TP90／FP495</text><rect x="45" y="200" width="30" height="35" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="75" y="200" width="165" height="35" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="45" y="275" font-size="18" fill="#e3e9e2" text-anchor="start">盛行10%：TP900／FP450</text><rect x="45" y="300" width="300" height="35" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="345" y="300" width="150" height="35" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="45" y="395" font-size="18" fill="#e3e9e2" text-anchor="start">綠＝真陽；黃＝偽陽</text><text x="45" y="435" font-size="21" fill="#c1b2ea" text-anchor="start">PPV約15.38% → 66.67%</text><path d="M525 105V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="130" font-size="19" fill="#9ac8e8" text-anchor="start">同一死亡時點（虛構）</text><path d="M560 220H810M560 335H810" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 200V240M790 200V240M605 315V355M790 315V355" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="275" font-size="18" fill="#ead68c" text-anchor="middle">診斷晚</text><text x="605" y="390" font-size="18" fill="#ead68c" text-anchor="middle">診斷早</text><text x="790" y="440" font-size="17" fill="#ead68c" text-anchor="middle">死亡未延後</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；虛構數字不代表真實地區。先看定義、時間、分母與資料來源。</text></g></svg>