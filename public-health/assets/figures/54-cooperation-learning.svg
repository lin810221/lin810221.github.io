<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="public-54-title public-54-desc"><title id="public-54-title">跨境合作與事後檢討都要接回能力</title><desc id="public-54-desc">左側檢測、物資與資訊的雙向路徑呈現合作；右側準備、應變、檢討與改善循環需有負責人及期限，不能在報告出版時終止。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="30" y="39" font-size="22" fill="#b7e89f" text-anchor="start">圖 54 / 跨境合作與事後檢討都要接回能力</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭代表本圖標示的關係，並非已識別的政策因果效果。</text><rect x="45.0" y="147" width="210" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="150" y="182" font-size="19" fill="#9ac8e8" text-anchor="middle">資訊與實驗室</text><rect x="45.0" y="322" width="210" height="56" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="150" y="357" font-size="19" fill="#ead68c" text-anchor="middle">物資與供應鏈</text><rect x="280.0" y="232" width="180" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="370" y="267" font-size="19" fill="#b7e89f" text-anchor="middle">跨境協作</text><path d="M260 185L270 225" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M272.0 215.2L270 225L263.6 217.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 290L260 340" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.0 332.0L260 340L257.5 330.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 340L285 300" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M276.5 305.3L285 300L283.9 309.9" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="540.0" y="117" width="210" height="56" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="645" y="152" font-size="19" fill="#9ac8e8" text-anchor="middle">準備與演練</text><rect x="655.0" y="252" width="180" height="56" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="745" y="287" font-size="19" fill="#b7e89f" text-anchor="middle">應變</text><rect x="530.0" y="377" width="210" height="56" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="635" y="412" font-size="19" fill="#c1b2ea" text-anchor="middle">檢討與改善</text><path d="M700 180L735 238" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M734.1 228.0L735 238L726.6 232.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M725 320L675 367" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M684.5 364.0L675 367L678.6 357.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M525 380H475V165H525" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M515 165L530 165" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M521.0 160.7L530 165L521.0 169.3" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">協作需互惠、信任、制度與可追蹤承諾。</text><text x="30" y="487" font-size="14" fill="#adbcaf" text-anchor="start">原創虛構情境；先核對族群、時間、單位、分母與來源，再解釋圖中的差異。</text></g></svg>