{% extends 'desk/base.html' %}{% block content %}<p class="eyebrow">ORGANIZE YOUR LEARNING</p><h1>管理你的標籤。</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button>新增標籤</button></form><div class="cards">{% for tag in tags %}<article><h2>{{ tag.name }}</h2><a href="{% url 'desk:tag-update' tag.pk %}">修改名稱</a> · <a href="{% url 'desk:tag-delete' tag.pk %}">刪除標籤</a></article>{% empty %}<p>先建立一個主題，讓任務更好整理。</p>{% endfor %}</div><a href="{% url 'desk:list' %}">回到任務</a>{% endblock %}
