<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">模板繼承與資料輸出</title><desc id="desc">共用base模板向三種子模板提供結構，各模板使用context呈現資料並保持自動跳脫。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">模板繼承與資料輸出</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="440" y="185" width="320" height="75" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="600.0" y="230.5" font-size="23" fill="#b8e895" text-anchor="middle">base.html</text><path d="M600 260L245 385" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="395" width="310" height="85" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="245.0" y="445.5" font-size="23" fill="#89c9e8" text-anchor="middle">列表模板</text><path d="M600 260L630 385" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="475" y="395" width="310" height="85" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="630.0" y="445.5" font-size="23" fill="#89c9e8" text-anchor="middle">詳情模板</text><path d="M600 260L1015 385" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="395" width="310" height="85" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="1015.0" y="445.5" font-size="23" fill="#89c9e8" text-anchor="middle">表單模板</text><text x="200" y="555" font-size="25" fill="#eebc79" text-anchor="start">Context提供資料；模板呈現並保持跳脫</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">繼承結構不是把任意Python放進HTML執行。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>