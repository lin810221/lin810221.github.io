<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">CSRF與其他防護不能互相取代</title><desc id="desc">Session寫入需CSRF及資料授權，CORS只處理瀏覽器跨來源讀取條件，CSP亦有不同責任。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">CSRF與其他防護不能互相取代</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="100" y="200" width="440" height="80" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="320.0" y="248.0" font-size="23" fill="#ef9eaa" text-anchor="middle">Session + 缺CSRF</text><path d="M540 240L680 240" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="200" width="400" height="80" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="910.0" y="248.0" font-size="23" fill="#ef9eaa" text-anchor="middle">拒絕寫入</text><rect x="100" y="315" width="440" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="320.0" y="363.0" font-size="23" fill="#b8e895" text-anchor="middle">Session + 有效CSRF</text><path d="M540 355L680 355" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="315" width="400" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="910.0" y="363.0" font-size="23" fill="#b8e895" text-anchor="middle">再驗證資料與權限</text><rect x="100" y="430" width="440" height="80" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="320.0" y="478.0" font-size="23" fill="#eebc79" text-anchor="middle">只允許CORS來源</text><path d="M540 470L680 470" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="430" width="400" height="80" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="910.0" y="478.0" font-size="23" fill="#eebc79" text-anchor="middle">不等於已授權</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">本圖簡化流程；實際還需來源、Cookie及HTTP條件。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>