<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">交易提交、回滾與副作用</title><desc id="desc">atomic中的相關寫入一起提交或回滾，外部副作用透過on_commit延後，仍需另外處理失敗。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">交易提交、回滾與副作用</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="90" y="210" width="220" height="80" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="200.0" y="258.0" font-size="23" fill="#89c9e8" text-anchor="middle">開始atomic</text><path d="M310 250L460 250" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="210" width="250" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="605.0" y="258.0" font-size="23" fill="#b8e895" text-anchor="middle">相關寫入</text><path d="M730 250L900 205" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="165" width="220" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="1030.0" y="213.0" font-size="23" fill="#b8e895" text-anchor="middle">提交</text><path d="M730 250L900 410" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="370" width="220" height="80" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1030.0" y="418.0" font-size="23" fill="#ef9eaa" text-anchor="middle">例外回滾</text><rect x="450" y="480" width="360" height="75" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="630.0" y="525.5" font-size="23" fill="#eebc79" text-anchor="middle">提交後才執行callback</text><path d="M1140 205L1160 205" fill="none" stroke="#b8e895" stroke-width="2"/><path d="M1160 205L1160 575" fill="none" stroke="#b8e895" stroke-width="2"/><path d="M1160 575L630 575" fill="none" stroke="#b8e895" stroke-width="2"/><path d="M630 575L630 555" fill="none" stroke="#b8e895" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">SQLite與PostgreSQL的鎖定語意需分別驗證。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>