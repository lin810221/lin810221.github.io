<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">快取鍵必須包含資料範圍</title><desc id="desc">不同使用者有不同摘要鍵，提交後只清除相應owner；TTL不是唯一失效策略。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">快取鍵必須包含資料範圍</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="110" y="210" width="370" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="295.0" y="258.0" font-size="23" fill="#b8e895" text-anchor="middle">Alice → summary:1</text><rect x="720" y="210" width="370" height="80" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="905.0" y="258.0" font-size="23" fill="#89c9e8" text-anchor="middle">Bob → summary:2</text><rect x="110" y="420" width="370" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="295.0" y="468.0" font-size="23" fill="#b8e895" text-anchor="middle">命中：使用範圍內快取</text><rect x="720" y="420" width="370" height="80" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="905.0" y="468.0" font-size="23" fill="#eebc79" text-anchor="middle">提交：清除對應owner</text><path d="M300 290L300 410" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 290L900 410" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">LocMem每程序獨立，不代表多worker共用快取。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>