<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">二十筆資料的關聯查詢算例</title><desc id="desc">在指定假設下逐列讀取owner需二十一次，批次載入兩次，單值join一次；並非所有關係皆如此。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">二十筆資料的關聯查詢算例</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><text x="130" y="235" font-size="24" fill="#ef9eaa" text-anchor="start">逐列owner查詢</text><rect x="440" y="210" width="546" height="40" fill="#ef9eaa"/><text x="1006" y="235" font-size="24" fill="#ef9eaa" text-anchor="start">21</text><text x="130" y="340" font-size="24" fill="#89c9e8" text-anchor="start">prefetch教學例</text><rect x="440" y="315" width="52" height="40" fill="#89c9e8"/><text x="512" y="340" font-size="24" fill="#89c9e8" text-anchor="start">2</text><text x="130" y="445" font-size="24" fill="#b8e895" text-anchor="start">select_related例</text><rect x="440" y="420" width="26" height="40" fill="#b8e895"/><text x="486" y="445" font-size="24" fill="#b8e895" text-anchor="start">1</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">查詢數是指定算例，不能推論實際耗時比例。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>