<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">一次完整操作經過的邊界</title><desc id="desc">使用者登入後建立任務、上傳附件，最後透過頁面或API更新；每一步重新檢查授權。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">一次完整操作經過的邊界</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="70" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="187.5" y="350.5" font-size="23" fill="#b8e895" text-anchor="middle">登入與session</text><path d="M305 342L348 342" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="472.5" y="350.5" font-size="23" fill="#89c9e8" text-anchor="middle">建立自己的任務</text><path d="M590 342L633 342" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="757.5" y="350.5" font-size="23" fill="#eebc79" text-anchor="middle">私人附件</text><path d="M875 342L918 342" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="925" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1042.5" y="350.5" font-size="23" fill="#ef9eaa" text-anchor="middle">頁面或API更新</text><text x="150" y="490" font-size="25" fill="#eebc79" text-anchor="start">將另一個帳號帶入同樣流程，測出越權反例</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">共用Model不代表每個入口已自動套用相同權限。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">