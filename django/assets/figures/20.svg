-anchor="middle">需驗證</text><rect x="860" y="333" width="200" height="65" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="960.0" y="373.5" font-size="23" fill="#ef9eaa" text-anchor="middle">需驗證</text><text x="120" y="470" font-size="24" fill="#89c9e8" text-anchor="start">Admin</text><rect x="360" y="428" width="200" height="65" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="460.0" y="468.5" font-size="23" fill="#b8e895" text-anchor="middle">需驗證</text><rect x="610" y="428" width="200" height="65" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="710.0" y="468.5" font-size="23" fill="#eebc79" text-anchor="middle">需驗證</text><rect x="860" y="428" width="200" height="65" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="960.0" y="468.5" font-size="23" fill="#ef9eaa" text-anchor="middle">需驗證</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">拒絕回應之外，還要檢查資料沒有被修改。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>