<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">部署時分開管理四種內容</title><desc id="desc">程式、資料庫、靜態資產與私人檔案有不同版本、保存與回復需求，不應只備份原始碼。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">部署時分開管理四種內容</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="100" y="220" width="450" height="110" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="325.0" y="283.0" font-size="23" fill="#b8e895" text-anchor="middle">程式與migration</text><rect x="650" y="220" width="450" height="110" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="875.0" y="283.0" font-size="23" fill="#89c9e8" text-anchor="middle">資料庫與備份</text><rect x="100" y="400" width="450" height="110" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="325.0" y="463.0" font-size="23" fill="#eebc79" text-anchor="middle">Static建置產物</text><rect x="650" y="400" width="450" height="110" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="875.0" y="463.0" font-size="23" fill="#ef9eaa" text-anchor="middle">私人檔案儲存</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">更新前確認資料相容性與可用回復路徑。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>