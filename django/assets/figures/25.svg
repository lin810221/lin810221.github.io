<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">StudyHub專題的交付鏈</title><desc id="desc">從契約與資料模型、介面與API、測試及成品，到部署條件逐步完成同一專題。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">StudyHub專題的交付鏈</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="70" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="187.5" y="350.5" font-size="23" fill="#b8e895" text-anchor="middle">契約與Model</text><path d="M305 342L348 342" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="472.5" y="350.5" font-size="23" fill="#89c9e8" text-anchor="middle">頁面與API</text><path d="M590 342L633 342" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="757.5" y="350.5" font-size="23" fill="#eebc79" text-anchor="middle">測試與成品</text><path d="M875 342L918 342" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="925" y="300" width="235" height="85" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1042.5" y="350.5" font-size="23" fill="#ef9eaa" text-anchor="middle">部署及交接</text><text x="160" y="490" font-size="25" fill="#89c9e8" text-anchor="start">每階段保存可操作結果，不只保留一張截圖</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">所有入口共用資料範圍與明確業務服務。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>