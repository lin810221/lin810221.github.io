<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Middleware的進入與返回</title><desc id="desc">請求依序經安全、session、認證到View，回應反向經過；順序影響可用資訊。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">Middleware的進入與返回</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="70" y="230" width="235" height="85" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="187.5" y="280.5" font-size="23" fill="#b8e895" text-anchor="middle">Security</text><path d="M305 272L348 272" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="230" width="235" height="85" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="472.5" y="280.5" font-size="23" fill="#89c9e8" text-anchor="middle">Session</text><path d="M590 272L633 272" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="230" width="235" height="85" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="757.5" y="280.5" font-size="23" fill="#eebc79" text-anchor="middle">Authentication</text><path d="M875 272L918 272" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="925" y="230" width="235" height="85" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1042.5" y="280.5" font-size="23" fill="#ef9eaa" text-anchor="middle">View</text><path d="M1010 355L145 355" fill="none" stroke="#eebc79" stroke-width="3" marker-end="url(#arrow)"/><text x="200" y="420" font-size="26" fill="#eebc79" text-anchor="start">請求由左向右；回應依相反順序向外</text><text x="200" y="490" font-size="24" fill="#89c9e8" text-anchor="start">提前回應時，後面的層可能不會執行</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">計時分項不可重複；View耗時可能已包含資料庫。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>