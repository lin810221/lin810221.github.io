<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">不同測試層回答不同問題</title><desc id="desc">底層資料與服務、HTTP及API、部署與真實瀏覽器各有範圍，不能互相冒名。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">不同測試層回答不同問題</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="120" y="205" width="960" height="80" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="600.0" y="253.0" font-size="23" fill="#eebc79" text-anchor="middle">部署環境與真正瀏覽器</text><rect x="230" y="325" width="740" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="600.0" y="373.0" font-size="23" fill="#b8e895" text-anchor="middle">HTTP Client與API流程</text><rect x="350" y="445" width="500" height="80" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="600.0" y="493.0" font-size="23" fill="#89c9e8" text-anchor="middle">Model、Form與服務</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">區塊寬度表示範圍示意，不代表測試數量。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>