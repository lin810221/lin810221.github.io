<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">程式資產與私人檔案的邊界</title><desc id="desc">static、頁面HTML與使用者檔案分別有建置、呈現與授權流程，不應全部公開在同一資料夾。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">程式資產與私人檔案的邊界</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="85" y="230" width="290" height="125" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="230.0" y="300.5" font-size="23" fill="#b8e895" text-anchor="middle">Static：程式資產</text><rect x="455" y="230" width="290" height="125" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="600.0" y="300.5" font-size="23" fill="#89c9e8" text-anchor="middle">HTML：頁面內容</text><rect x="825" y="230" width="290" height="125" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="970.0" y="300.5" font-size="23" fill="#eebc79" text-anchor="middle">Media：使用者檔案</text><text x="130" y="465" font-size="25" fill="#b8e895" text-anchor="start">collectstatic</text><text x="520" y="465" font-size="24" fill="#89c9e8" text-anchor="start">View與Template</text><text x="835" y="465" font-size="25" fill="#eebc79" text-anchor="start">授權後下載</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">可及性檢查橫跨頁面：label、焦點、錯誤與對比。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>