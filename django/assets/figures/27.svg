<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">排錯先縮小，再提出原因</title><desc id="desc">由症狀分成環境路由、資料權限與資產部署，使用最小可重現案例判斷。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a9b9ae"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="75" font-size="32" fill="#b8e895" text-anchor="start">排錯先縮小，再提出原因</text><text x="60" y="122" font-size="21" fill="#a9b9ae" text-anchor="start">原創教學示意 · 箭頭表示標示的流程、依賴或資訊傳遞</text><rect x="420" y="180" width="350" height="80" rx="10" fill="#19241d" stroke="#b8e895" stroke-width="2"/><text x="595.0" y="228.0" font-size="23" fill="#b8e895" text-anchor="middle">先確認失敗層次</text><path d="M595 260L245 390" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="405" width="330" height="90" rx="10" fill="#19241d" stroke="#89c9e8" stroke-width="2"/><text x="245.0" y="458.0" font-size="23" fill="#89c9e8" text-anchor="middle">環境與路由</text><path d="M595 260L635 390" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="405" width="330" height="90" rx="10" fill="#19241d" stroke="#eebc79" stroke-width="2"/><text x="635.0" y="458.0" font-size="23" fill="#eebc79" text-anchor="middle">資料與權限</text><path d="M595 260L1025 390" fill="none" stroke="#a9b9ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="860" y="405" width="330" height="90" rx="10" fill="#19241d" stroke="#ef9eaa" stroke-width="2"/><text x="1025.0" y="458.0" font-size="23" fill="#ef9eaa" text-anchor="middle">資產與部署</text><text x="60" y="635" font-size="22" fill="#eebc79" text-anchor="start">保存版本、設定、request ID與完整錯誤，遮蔽秘密。</text><text x="60" y="684" font-size="20" fill="#a9b9ae" text-anchor="start">2026-11-26 · Django 6.1 · 非實際負載與執行時間比例</text></g></svg>