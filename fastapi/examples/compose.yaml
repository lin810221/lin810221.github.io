services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["relay-data:/app/.runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: .
    command: ["python", "manage.py", "work"]
    volumes: ["relay-data:/app/.runtime"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  relay-data:
