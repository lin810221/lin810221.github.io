<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RelayDesk 本機客戶端</title><style>body{color:#e7efeb;background:#101b15;font:17px/1.7 system-ui,sans-serif;max-width:900px;margin:3rem auto;padding:0 1.5rem}label{display:block;margin:1rem 0}input,textarea,button{font:inherit;padding:.65rem;color:inherit;background:#1c2c24;border:1px solid #6e9d81;border-radius:6px}input,textarea{display:block;box-sizing:border-box;width:100%}textarea{min-height:7rem}button{margin:.4rem;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8bd9bd}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:1rem;border:1px solid #496352;max-height:24rem;overflow:auto}small{color:#c3d4c7}</style><script src="sse-client.js" defer></script><script src="client.js" defer></script></head><body><main><h1>RelayDesk 本機客戶端</h1><p>先啟動API與worker，再從 <code>http://localhost:3000/client.html</code> 開啟本頁。這是下載包的操作範例；所有動作都要由你按下按鈕才執行。</p><label for="base">本機API網址<input id="base" value="http://127.0.0.1:8000" spellcheck="false"></label><label for="token">佈建的Bearer token<input id="token" type="password" autocomplete="off" spellcheck="false"></label><small>token只留在目前頁面記憶體；重新整理即清除。請勿使用正式環境秘密。</small><label for="document">合成政策原文<textarea id="document">Warranty lasts 12 months.
