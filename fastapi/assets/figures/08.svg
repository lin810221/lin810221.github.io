<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-08-title fa-08-desc"><title id="fa-08-title">一個總期限涵蓋多次嘗試</title><desc id="fa-08-desc">連線、讀取、退避與重試共用同一總期限。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">一個總期限涵蓋多次嘗試</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><text x="35" y="185" font-size="18" fill="#e7efeb" text-anchor="start">總期限</text><path d="M170 198 H910" stroke="#41564b"/><text x="35" y="265" font-size="18" fill="#e7efeb" text-anchor="start">嘗試一</text><path d="M170 278 H910" stroke="#41564b"/><text x="35" y="345" font-size="18" fill="#e7efeb" text-anchor="start">嘗試二</text><path d="M170 358 H910" stroke="#41564b"/><rect x="170" y="160" width="650" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="180" y="186" font-size="16" fill="#101c15" text-anchor="start">整體 deadline：2 秒</text><rect x="170" y="240" width="210" height="38" rx="5" fill="#9dc7ef" opacity=".85"/><text x="180" y="266" font-size="16" fill="#101c15" text-anchor="start">連線／讀取</text><rect x="400" y="240" width="100" height="38" rx="5" fill="#d5c994" opacity=".85"/><text x="410" y="266" font-size="16" fill="#101c15" text-anchor="start">退避</text><rect x="520" y="320" width="200" height="38" rx="5" fill="#9dc7ef" opacity=".85"/><text x="530" y="346" font-size="16" fill="#101c15" text-anchor="start">剩餘預算</text><text x="42" y="435" font-size="18" fill="#d5c994" text-anchor="start">局部 timeout 不能替代整體 deadline；取消後釋放連線。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
