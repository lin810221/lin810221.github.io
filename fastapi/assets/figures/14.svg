<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-14-title fa-14-desc"><title id="fa-14-title">引用以文件和字元區間核對</title><desc id="fa-14-desc">答案引用原文，起點含、終點不含；區間必須屬授權文件。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">引用以文件和字元區間核對</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="65" y="140" width="820" height="75" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="475.0" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">document 7：前言 ↵ Warranty lasts 12 months.</text><text x="475.0" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">offset 以 Python Unicode 字元索引計算</text><rect x="264" y="245" width="540" height="60" fill="none" stroke="#8bd9bd" stroke-width="3"/><text x="280" y="283" font-size="23" fill="#e7efeb" text-anchor="start">quote = Warranty lasts 12 months.</text><text x="70" y="365" font-size="20" fill="#e7efeb" text-anchor="start">先核對 document_id，再核對 start、end 與完整 quote。</text><text x="70" y="405" font-size="19" fill="#d5c994" text-anchor="start">正確引用仍不自動證明自由改寫的答案符合事實。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
