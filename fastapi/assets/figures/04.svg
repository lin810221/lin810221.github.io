<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-04-title fa-04-desc"><title id="fa-04-title">狀態碼是回應契約</title><desc id="fa-04-desc">401、403、404、409、422與413對應不同邊界。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">狀態碼是回應契約</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="48" y="140" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="180.5" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">401</text><text x="180.5" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">缺少或失效的憑證</text><rect x="348" y="140" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="480.5" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">403</text><text x="480.5" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">已識別但不允許寫入</text><rect x="648" y="140" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="780.5" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">404</text><text x="780.5" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">本租戶找不到資源</text><rect x="48" y="260" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="180.5" y="293" font-size="20" fill="#8bd9bd" text-anchor="middle">409</text><text x="180.5" y="321" font-size="16" fill="#c1d0c8" text-anchor="middle">同一冪等鍵卻不同內容</text><rect x="348" y="260" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="480.5" y="293" font-size="20" fill="#8bd9bd" text-anchor="middle">422</text><text x="480.5" y="321" font-size="16" fill="#c1d0c8" text-anchor="middle">輸入契約不符合</text><rect x="648" y="260" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="780.5" y="293" font-size="20" fill="#8bd9bd" text-anchor="middle">413</text><text x="780.5" y="321" font-size="16" fill="#c1d0c8" text-anchor="middle">實際讀取位元組超限</text><text x="45" y="425" font-size="19" fill="#e7efeb" text-anchor="start">錯誤內容保留位置與類型，不回傳原始秘密輸入。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
