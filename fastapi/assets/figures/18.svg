<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-18-title fa-18-desc"><title id="fa-18-title">租約過期與 fencing</title><desc id="fa-18-desc">A失去租約後，B重新claim取得新token，A不能再發布。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">租約過期與 fencing</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><text x="35" y="185" font-size="18" fill="#e7efeb" text-anchor="start">worker A</text><path d="M170 198 H910" stroke="#41564b"/><text x="35" y="265" font-size="18" fill="#e7efeb" text-anchor="start">worker B</text><path d="M170 278 H910" stroke="#41564b"/><text x="35" y="345" font-size="18" fill="#e7efeb" text-anchor="start">資料庫</text><path d="M170 358 H910" stroke="#41564b"/><rect x="170" y="160" width="215" height="38" rx="5" fill="#9dc7ef" opacity=".85"/><text x="180" y="186" font-size="16" fill="#101c15" text-anchor="start">token A，截止130</text><rect x="480" y="240" width="250" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="490" y="266" font-size="16" fill="#101c15" text-anchor="start">130重領：token B</text><rect x="740" y="320" width="140" height="38" rx="5" fill="#d6a6bb" opacity=".85"/><text x="750" y="346" font-size="16" fill="#101c15" text-anchor="start">拒絕舊token</text><text x="42" y="435" font-size="18" fill="#d5c994" text-anchor="start">t=130可重領；finish必須驗證state、token和未過期。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
