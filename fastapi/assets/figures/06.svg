<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-06-title fa-06-desc"><title id="fa-06-title">yield 依賴的清理時機</title><desc id="fa-06-desc">function scope在串流前關閉，request scope在回應後關閉。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">yield 依賴的清理時機</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><text x="35" y="185" font-size="18" fill="#e7efeb" text-anchor="start">function</text><path d="M170 198 H910" stroke="#41564b"/><text x="35" y="265" font-size="18" fill="#e7efeb" text-anchor="start">request</text><path d="M170 278 H910" stroke="#41564b"/><rect x="170" y="160" width="125" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="180" y="186" font-size="16" fill="#101c15" text-anchor="start">open</text><rect x="320" y="160" width="125" height="38" rx="5" fill="#d5c994" opacity=".85"/><text x="330" y="186" font-size="16" fill="#101c15" text-anchor="start">route</text><rect x="470" y="160" width="125" height="38" rx="5" fill="#d6a6bb" opacity=".85"/><text x="480" y="186" font-size="16" fill="#101c15" text-anchor="start">close</text><rect x="620" y="160" width="210" height="38" rx="5" fill="#9dc7ef" opacity=".85"/><text x="630" y="186" font-size="16" fill="#101c15" text-anchor="start">chunk → end</text><rect x="170" y="240" width="125" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="180" y="266" font-size="16" fill="#101c15" text-anchor="start">open</text><rect x="320" y="240" width="125" height="38" rx="5" fill="#d5c994" opacity=".85"/><text x="330" y="266" font-size="16" fill="#101c15" text-anchor="start">route</text><rect x="470" y="240" width="210" height="38" rx="5" fill="#9dc7ef" opacity=".85"/><text x="480" y="266" font-size="16" fill="#101c15" text-anchor="start">chunk → end</text><rect x="720" y="240" width="125" height="38" rx="5" fill="#d6a6bb" opacity=".85"/><text x="730" y="266" font-size="16" fill="#101c15" text-anchor="start">close</text><text x="42" y="435" font-size="18" fill="#d5c994" text-anchor="start">不能把已關閉的 Session 或 client 留給串流產生器。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
