<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-12-title fa-12-desc"><title id="fa-12-title">外部身分服務與本地 API</title><desc id="fa-12-desc">OIDC登入與API接受的access token有不同用途。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">外部身分服務與本地 API</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="40" y="174" width="195" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="137.5" y="207" font-size="20" fill="#8bd9bd" text-anchor="middle">瀏覽器</text><text x="137.5" y="235" font-size="16" fill="#c1d0c8" text-anchor="middle">導向登入</text><path d="M235 219 L263 219" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="251" y="157" font-size="16" fill="#d5c994" text-anchor="middle">授權碼</text><rect x="268" y="174" width="195" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="365.5" y="207" font-size="20" fill="#8bd9bd" text-anchor="middle">身分提供者</text><text x="365.5" y="235" font-size="16" fill="#c1d0c8" text-anchor="middle">Code + PKCE</text><path d="M463 219 L491 219" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="479" y="157" font-size="16" fill="#d5c994" text-anchor="middle">換取</text><rect x="496" y="174" width="195" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="593.5" y="207" font-size="20" fill="#8bd9bd" text-anchor="middle">API access token</text><text x="593.5" y="235" font-size="16" fill="#c1d0c8" text-anchor="middle">驗證簽章與claims</text><path d="M691 219 L719 219" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="707" y="157" font-size="16" fill="#d5c994" text-anchor="middle">呼叫</text><rect x="724" y="174" width="195" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="821.5" y="207" font-size="20" fill="#8bd9bd" text-anchor="middle">資源伺服器</text><text x="821.5" y="235" font-size="16" fill="#c1d0c8" text-anchor="middle">角色與資源權限</text><text x="42" y="337" font-size="19" fill="#e7efeb" text-anchor="start">ID token 是給客戶端識別登入；不可任意當作本API access token。</text><text x="42" y="380" font-size="17" fill="#aabfb2" text-anchor="start">沿箭頭追蹤資料與責任；邊界外的條件要另行驗收。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
