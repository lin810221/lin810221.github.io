<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-21-title fa-21-desc"><title id="fa-21-title">Token bucket 的速率與突發</title><desc id="fa-21-desc">桶有容量上限，時間補充token，每次接受消耗一個。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">Token bucket 的速率與突發</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><circle cx="100" cy="220" r="23" fill="#8bd9bd" stroke="#8bd9bd"/><circle cx="175" cy="220" r="23" fill="#8bd9bd" stroke="#8bd9bd"/><circle cx="250" cy="220" r="23" fill="#8bd9bd" stroke="#8bd9bd"/><circle cx="325" cy="220" r="23" fill="#263c31" stroke="#8bd9bd"/><circle cx="400" cy="220" r="23" fill="#263c31" stroke="#8bd9bd"/><circle cx="475" cy="220" r="23" fill="#263c31" stroke="#8bd9bd"/><rect x="570" y="160" width="300" height="110" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="720.0" y="193" font-size="20" fill="#8bd9bd" text-anchor="middle">容量6、速率2／秒</text><text x="720.0" y="221" font-size="16" fill="#c1d0c8" text-anchor="middle">3個已用、3個剩餘</text><path d="M70 120 L70 175" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="70.0" y="135.5" font-size="16" fill="#d5c994" text-anchor="middle">隨時間補充</text><text x="65" y="355" font-size="19" fill="#e7efeb" text-anchor="start">容量限制突發；補充率限制長期平均，兩者不是同一參數。</text><text x="65" y="400" font-size="18" fill="#d5c994" text-anchor="start">此為單執行緒教學模型，沒有跨worker共享狀態。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
