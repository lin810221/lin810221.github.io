<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-30-title fa-30-desc"><title id="fa-30-title">多 worker 的獨立資源</title><desc id="fa-30-desc">每個程序有自己的模型、client、semaphore與記憶體。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">多 worker 的獨立資源</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="55" y="155" width="260" height="150" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="185.0" y="188" font-size="20" fill="#8bd9bd" text-anchor="middle">worker 1</text><text x="185.0" y="216" font-size="16" fill="#c1d0c8" text-anchor="middle">client 8條／模型一份</text><rect x="355" y="155" width="260" height="150" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="485.0" y="188" font-size="20" fill="#8bd9bd" text-anchor="middle">worker 2</text><text x="485.0" y="216" font-size="16" fill="#c1d0c8" text-anchor="middle">client 8條／模型一份</text><rect x="655" y="155" width="260" height="150" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="785.0" y="188" font-size="20" fill="#8bd9bd" text-anchor="middle">worker 3</text><text x="785.0" y="216" font-size="16" fill="#c1d0c8" text-anchor="middle">client 8條／模型一份</text><text x="55" y="360" font-size="19" fill="#e7efeb" text-anchor="start">三個worker會建立三份程序狀態；本地限流也會分成三份。</text><text x="55" y="410" font-size="18" fill="#d5c994" text-anchor="start">共享排程、GPU模型服務或Redis需獨立部署與驗收。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
