<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-23-title fa-23-desc"><title id="fa-23-title">測試層次各自證明什麼</title><desc id="fa-23-desc">純函式、ASGI、真實TCP、外部服務與正式環境有不同邊界。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">測試層次各自證明什麼</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="85" y="115" width="770" height="48" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="470.0" y="148" font-size="20" fill="#8bd9bd" text-anchor="middle">純函式：schema、切片、百分位</text><rect x="145" y="175" width="650" height="48" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="470.0" y="208" font-size="20" fill="#8bd9bd" text-anchor="middle">ASGI：依賴、權限、WebSocket</text><rect x="205" y="235" width="530" height="48" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="470.0" y="268" font-size="20" fill="#8bd9bd" text-anchor="middle">本機TCP：Uvicorn、獨立worker</text><rect x="265" y="295" width="410" height="48" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="470.0" y="328" font-size="20" fill="#8bd9bd" text-anchor="middle">正式環境：代理、外部模型、負載</text><text x="55" y="420" font-size="19" fill="#e7efeb" text-anchor="start">TestClient不證明代理沒有緩衝，也不證明雲端模型品質。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
