<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-19-title fa-19-desc"><title id="fa-19-title">SSE 事件不是 TCP 封包</title><desc id="fa-19-desc">id、event、data及空白行形成一個事件，切包位置不固定。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">SSE 事件不是 TCP 封包</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="50" y="130" width="380" height="230" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="240.0" y="163" font-size="20" fill="#8bd9bd" text-anchor="middle">持久化事件</text><text x="240.0" y="191" font-size="16" fill="#c1d0c8" text-anchor="middle">global id=3、6、8</text><text x="75" y="235" font-size="23" fill="#e7efeb" text-anchor="start">id: 6</text><text x="75" y="272" font-size="23" fill="#e7efeb" text-anchor="start">event: running</text><text x="75" y="309" font-size="21" fill="#e7efeb" text-anchor="start">data: {&quot;attempt&quot;:1}</text><path d="M440 240 L520 240" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="480.0" y="228.0" font-size="16" fill="#d5c994" text-anchor="middle">重連</text><rect x="540" y="150" width="345" height="150" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="712.5" y="183" font-size="20" fill="#8bd9bd" text-anchor="middle">Last-Event-ID: 6</text><text x="712.5" y="211" font-size="16" fill="#c1d0c8" text-anchor="middle">只回放 id &gt; 6 的事件</text><text x="60" y="420" font-size="19" fill="#e7efeb" text-anchor="start">呼叫者先通過租戶與工作授權；不能用cursor繞過權限。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
