<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-07-title fa-07-desc"><title id="fa-07-title">等待 I/O 與阻塞事件迴圈</title><desc id="fa-07-desc">非同步等待能交錯，直接sleep會延後其他請求。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">等待 I/O 與阻塞事件迴圈</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><text x="35" y="185" font-size="18" fill="#e7efeb" text-anchor="start">正確 await</text><path d="M170 198 H910" stroke="#41564b"/><text x="35" y="265" font-size="18" fill="#e7efeb" text-anchor="start">另一請求</text><path d="M170 278 H910" stroke="#41564b"/><text x="35" y="345" font-size="18" fill="#e7efeb" text-anchor="start">阻塞呼叫</text><path d="M170 358 H910" stroke="#41564b"/><rect x="170" y="160" width="120" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="180" y="186" font-size="16" fill="#101c15" text-anchor="start">開始</text><rect x="520" y="160" width="130" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="530" y="186" font-size="16" fill="#101c15" text-anchor="start">恢復</text><rect x="300" y="240" width="130" height="38" rx="5" fill="#9dc7ef" opacity=".85"/><text x="310" y="266" font-size="16" fill="#101c15" text-anchor="start">可執行</text><rect x="170" y="320" width="500" height="38" rx="5" fill="#d6a6bb" opacity=".85"/><text x="180" y="346" font-size="16" fill="#101c15" text-anchor="start">time.sleep 佔住事件迴圈</text><text x="42" y="435" font-size="18" fill="#d5c994" text-anchor="start">await 不會自動把 CPU 密集工作變成平行計算。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
