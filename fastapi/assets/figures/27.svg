<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-27-title fa-27-desc"><title id="fa-27-title">靜態教材與後端服務</title><desc id="fa-27-desc">GitHub Pages只提供教材，FastAPI服務在別的執行環境。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">靜態教材與後端服務</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="45" y="140" width="270" height="110" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="180.0" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">GitHub Pages</text><text x="180.0" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">HTML、SVG、ZIP課程</text><rect x="365" y="140" width="240" height="110" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="485.0" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">反向代理／TLS</text><text x="485.0" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">憑證、路由、連線</text><rect x="660" y="140" width="250" height="110" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="785.0" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">FastAPI API</text><text x="785.0" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">程序、資料庫、worker</text><path d="M610 195 L655 195" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="632.5" y="183.0" font-size="16" fill="#d5c994" text-anchor="middle">ASGI</text><text x="45" y="340" font-size="21" fill="#e7efeb" text-anchor="start">教材網站的發布不等於替你部署API、資料庫或模型。</text><text x="45" y="390" font-size="19" fill="#d5c994" text-anchor="start">不要把伺服器API key放進靜態網頁或可公開下載的檔案。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
