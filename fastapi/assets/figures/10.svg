<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-10-title fa-10-desc"><title id="fa-10-title">keyset 依穩定鍵續讀</title><desc id="fa-10-desc">資料列按id排列，以大於上次id取得下一頁。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">keyset 依穩定鍵續讀</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="60" y="170" width="140" height="85" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="130.0" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">id = 2</text><text x="130.0" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">alpha</text><rect x="230" y="170" width="140" height="85" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="300.0" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">id = 5</text><text x="300.0" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">alpha</text><rect x="400" y="170" width="140" height="85" rx="10" fill="#182821" stroke="#d6a6bb"/><text x="470.0" y="203" font-size="20" fill="#d6a6bb" text-anchor="middle">id = 7</text><text x="470.0" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">beta</text><rect x="570" y="170" width="140" height="85" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="640.0" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">id = 11</text><text x="640.0" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">alpha</text><rect x="740" y="170" width="140" height="85" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="810.0" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">id = 13</text><text x="810.0" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">alpha</text><path d="M380 305 L650 305" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="515.0" y="293.0" font-size="16" fill="#d5c994" text-anchor="middle">tenant = alpha 且 id &gt; 5</text><text x="70" y="380" font-size="19" fill="#e7efeb" text-anchor="start">下一頁取得11、13；不能先取全站前兩筆才做租戶篩選。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
