<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-26-title fa-26-desc"><title id="fa-26-title">三個操作視窗</title><desc id="fa-26-desc">API伺服器、worker與客戶端分開執行，共用持久化資料庫。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">三個操作視窗</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="40" y="145" width="230" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="155.0" y="178" font-size="20" fill="#8bd9bd" text-anchor="middle">客戶端視窗</text><text x="155.0" y="206" font-size="16" fill="#c1d0c8" text-anchor="middle">上傳、提交、查詢、回放</text><rect x="355" y="145" width="230" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="470.0" y="178" font-size="20" fill="#8bd9bd" text-anchor="middle">API視窗</text><text x="470.0" y="206" font-size="16" fill="#c1d0c8" text-anchor="middle">uvicorn app:app</text><rect x="355" y="330" width="230" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="470.0" y="363" font-size="20" fill="#8bd9bd" text-anchor="middle">worker視窗</text><text x="470.0" y="391" font-size="16" fill="#c1d0c8" text-anchor="middle">manage.py work</text><rect x="710" y="230" width="210" height="100" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="815.0" y="263" font-size="20" fill="#8bd9bd" text-anchor="middle">同一SQLite檔</text><text x="815.0" y="291" font-size="16" fill="#c1d0c8" text-anchor="middle">文件、工作、事件</text><path d="M275 190 L350 190" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="312.5" y="178.0" font-size="16" fill="#d5c994" text-anchor="middle">HTTP</text><path d="M590 195 L705 260" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="647.5" y="215.5" font-size="16" fill="#d5c994" text-anchor="middle">寫入／查詢</text><path d="M590 375 L705 300" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="647.5" y="325.5" font-size="16" fill="#d5c994" text-anchor="middle">claim／發布</text><text x="45" y="460" font-size="18" fill="#e7efeb" text-anchor="start">API與worker是獨立程序；客戶端透過API取得結果。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
