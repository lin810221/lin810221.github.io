<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-25-title fa-25-desc"><title id="fa-25-title">RelayDesk 資料關係</title><desc id="fa-25-desc">Credential映射租戶，Document與Job帶tenant，Event引用Job。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">RelayDesk 資料關係</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="45" y="135" width="250" height="85" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="170.0" y="168" font-size="20" fill="#8bd9bd" text-anchor="middle">Credential</text><text x="170.0" y="196" font-size="16" fill="#c1d0c8" text-anchor="middle">digest → tenant／role</text><rect x="45" y="290" width="250" height="85" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="170.0" y="323" font-size="20" fill="#8bd9bd" text-anchor="middle">Document</text><text x="170.0" y="351" font-size="16" fill="#c1d0c8" text-anchor="middle">tenant + digest 唯一</text><rect x="395" y="210" width="225" height="100" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="507.5" y="243" font-size="20" fill="#8bd9bd" text-anchor="middle">Job</text><text x="507.5" y="271" font-size="16" fill="#c1d0c8" text-anchor="middle">tenant + key 唯一</text><rect x="710" y="210" width="205" height="100" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="812.5" y="243" font-size="20" fill="#8bd9bd" text-anchor="middle">Event</text><text x="812.5" y="271" font-size="16" fill="#c1d0c8" text-anchor="middle">job_id → Job.id</text><path d="M300 180 L390 230" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="345.0" y="193.0" font-size="16" fill="#d5c994" text-anchor="middle">租戶</text><path d="M300 330 L390 280" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="345.0" y="293.0" font-size="16" fill="#d5c994" text-anchor="middle">授權ID</text><path d="M625 260 L705 260" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="665.0" y="248.0" font-size="16" fill="#d5c994" text-anchor="middle">外鍵</text><text x="50" y="435" font-size="18" fill="#e7efeb" text-anchor="start">request_json保存已驗證的文件ID；實際使用時仍按租戶查詢。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
