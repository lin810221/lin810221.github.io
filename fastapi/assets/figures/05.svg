<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-05-title fa-05-desc"><title id="fa-05-title">依賴圖與單次請求快取</title><desc id="fa-05-desc">Bearer與store是共享子依賴，principal判定身分再傳入editor。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">依賴圖與單次請求快取</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="350" y="120" width="230" height="75" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="465.0" y="153" font-size="20" fill="#8bd9bd" text-anchor="middle">get_store</text><text x="465.0" y="181" font-size="16" fill="#c1d0c8" text-anchor="middle">共用 engine</text><rect x="55" y="120" width="230" height="75" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="170.0" y="153" font-size="20" fill="#8bd9bd" text-anchor="middle">HTTPBearer</text><text x="170.0" y="181" font-size="16" fill="#c1d0c8" text-anchor="middle">只解析憑證</text><rect x="350" y="255" width="230" height="75" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="465.0" y="288" font-size="20" fill="#8bd9bd" text-anchor="middle">principal</text><text x="465.0" y="316" font-size="16" fill="#c1d0c8" text-anchor="middle">租戶與角色</text><rect x="655" y="255" width="230" height="75" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="770.0" y="288" font-size="20" fill="#8bd9bd" text-anchor="middle">editor</text><text x="770.0" y="316" font-size="16" fill="#c1d0c8" text-anchor="middle">寫入權限</text><path d="M170 195 L350 270" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="260.0" y="220.5" font-size="16" fill="#d5c994" text-anchor="middle">token</text><path d="M465 195 L465 250" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="465.0" y="210.5" font-size="16" fill="#d5c994" text-anchor="middle">查憑證</text><path d="M580 290 L650 290" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="615.0" y="278.0" font-size="16" fill="#d5c994" text-anchor="middle">同一身分</text><text x="50" y="410" font-size="19" fill="#e7efeb" text-anchor="start">Depends 的快取只屬本次請求；不是跨使用者資料快取。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
