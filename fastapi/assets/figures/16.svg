<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-16-title fa-16-desc"><title id="fa-16-title">可重試錯誤與副作用</title><desc id="fa-16-desc">暫時性GET錯誤有限重試，模型POST需考慮重複扣費。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">可重試錯誤與副作用</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="50" y="150" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="182.5" y="183" font-size="20" fill="#8bd9bd" text-anchor="middle">401／403</text><text x="182.5" y="211" font-size="16" fill="#c1d0c8" text-anchor="middle">不應盲目重試</text><rect x="350" y="150" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="482.5" y="183" font-size="20" fill="#8bd9bd" text-anchor="middle">429／503</text><text x="482.5" y="211" font-size="16" fill="#c1d0c8" text-anchor="middle">暫時性、需總預算</text><rect x="650" y="150" width="265" height="90" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="782.5" y="183" font-size="20" fill="#8bd9bd" text-anchor="middle">POST 模型呼叫</text><text x="782.5" y="211" font-size="16" fill="#c1d0c8" text-anchor="middle">遠端可能已完成扣費</text><text x="60" y="330" font-size="19" fill="#e7efeb" text-anchor="start">本地工作冪等鍵只能合併本地工作；不保證供應商 exactly-once。</text><text x="60" y="380" font-size="19" fill="#d5c994" text-anchor="start">租約恢復可能再次呼叫模型，必須記錄 attempt 與用量。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
