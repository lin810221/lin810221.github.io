<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-28-title fa-28-desc"><title id="fa-28-title">資料庫先擴充、程式再切換</title><desc id="fa-28-desc">expand-contract讓新舊程式短期共存，之後才移除舊欄位。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">資料庫先擴充、程式再切換</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><text x="35" y="185" font-size="18" fill="#e7efeb" text-anchor="start">Schema</text><path d="M170 198 H910" stroke="#41564b"/><text x="35" y="265" font-size="18" fill="#e7efeb" text-anchor="start">舊版程式</text><path d="M170 278 H910" stroke="#41564b"/><text x="35" y="345" font-size="18" fill="#e7efeb" text-anchor="start">新版程式</text><path d="M170 358 H910" stroke="#41564b"/><rect x="170" y="160" width="180" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="180" y="186" font-size="16" fill="#101c15" text-anchor="start">新增可空欄位</text><rect x="380" y="160" width="210" height="38" rx="5" fill="#d5c994" opacity=".85"/><text x="390" y="186" font-size="16" fill="#101c15" text-anchor="start">回填與驗證</text><rect x="670" y="160" width="190" height="38" rx="5" fill="#d6a6bb" opacity=".85"/><text x="680" y="186" font-size="16" fill="#101c15" text-anchor="start">收縮舊欄位</text><rect x="170" y="240" width="430" height="38" rx="5" fill="#9dc7ef" opacity=".85"/><text x="180" y="266" font-size="16" fill="#101c15" text-anchor="start">舊程式仍可運作</text><rect x="440" y="320" width="420" height="38" rx="5" fill="#8bd9bd" opacity=".85"/><text x="450" y="346" font-size="16" fill="#101c15" text-anchor="start">新版開始讀寫</text><text x="42" y="435" font-size="18" fill="#d5c994" text-anchor="start">回滾程式不代表資料庫可安全降版；備份與恢復要另測。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
