<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-24-title fa-24-desc"><title id="fa-24-title">故障注入與恢復驗收</title><desc id="fa-24-desc">故障點相對commit的位置會決定重試應讀舊結果或重新計算。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">故障注入與恢復驗收</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="40" y="170" width="195" height="95" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="137.5" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">送出前</text><text x="137.5" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">尚未有工作</text><rect x="265" y="170" width="195" height="95" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="362.5" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">工作commit後</text><text x="362.5" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">以冪等鍵找回</text><rect x="490" y="170" width="195" height="95" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="587.5" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">計算後未publish</text><text x="587.5" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">租約到期重領</text><rect x="715" y="170" width="195" height="95" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="812.5" y="203" font-size="20" fill="#8bd9bd" text-anchor="middle">結果commit後</text><text x="812.5" y="231" font-size="16" fill="#c1d0c8" text-anchor="middle">回放持久化事件</text><text x="45" y="365" font-size="19" fill="#e7efeb" text-anchor="start">模擬程序中止只覆蓋選定斷點，不是斷電或分散式一致性證明。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
