<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="fa-22-title fa-22-desc"><title id="fa-22-title">平均並行量與工作行程</title><desc id="fa-22-desc">穩定系統下，抵達速率乘平均停留時間得到平均在途數。原創教學簡化圖，非實際效能量測。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bd9bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#101b15"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="36" y="52" font-size="28" fill="#e7efeb" text-anchor="start">平均並行量與工作行程</text><text x="36" y="87" font-size="14" fill="#8bd9bd" text-anchor="start">FASTAPI · AI BACKEND ENGINEERING</text><rect x="40" y="150" width="255" height="100" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="167.5" y="183" font-size="20" fill="#8bd9bd" text-anchor="middle">每秒20個請求</text><text x="167.5" y="211" font-size="16" fill="#c1d0c8" text-anchor="middle">平均停留0.5秒</text><path d="M300 200 L380 200" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="340.0" y="188.0" font-size="16" fill="#d5c994" text-anchor="middle">平均</text><rect x="390" y="150" width="210" height="100" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="495.0" y="183" font-size="20" fill="#8bd9bd" text-anchor="middle">在途數10</text><text x="495.0" y="211" font-size="16" fill="#c1d0c8" text-anchor="middle">不是安全容量保證</text><path d="M610 200 L670 200" stroke="#8bd9bd" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="640.0" y="188.0" font-size="16" fill="#d5c994" text-anchor="middle">分配</text><rect x="685" y="140" width="220" height="120" rx="10" fill="#182821" stroke="#8bd9bd"/><text x="795.0" y="173" font-size="20" fill="#8bd9bd" text-anchor="middle">每個worker</text><text x="795.0" y="201" font-size="16" fill="#c1d0c8" text-anchor="middle">都有自己的連線池</text><text x="45" y="365" font-size="19" fill="#e7efeb" text-anchor="start">兩個worker、各8條上游連線，上限合計可能16條。</text><text x="45" y="410" font-size="18" fill="#d5c994" text-anchor="start">容量決策還需尾延遲、突發、GPU記憶體與排隊驗證。</text><text x="35" y="476" font-size="14" fill="#97b1a1" text-anchor="start">原創概念圖・固定教學資料・非比例</text></g></svg>
