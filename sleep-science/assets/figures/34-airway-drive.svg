<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-34-title sleep-34-desc"><title id="sleep-34-title">阻塞與中樞：氣流與驅動分開</title><desc id="sleep-34-desc">左側上氣道截面示意通暢與狹窄，右側每組上列呼吸努力、下列氣流；阻塞示意仍有努力，中樞示意努力與氣流一起減少，真實分型需完整訊號與專業評分。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 34 / 阻塞與中樞：氣流與驅動分開</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">箭頭未表示治療；呼吸努力與氣流是不同訊號，示意波形不能替代檢查。</text><text x="65" y="130" font-size="22" fill="#9ac8e8" text-anchor="start">上氣道截面（非比例）</text><ellipse cx="150" cy="250" rx="90" ry="105" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="150" cy="250" rx="55" ry="75" stroke="#b7e89f" fill="#111a17" stroke-width="3"/><ellipse cx="350" cy="250" rx="90" ry="105" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="350" cy="250" rx="12" ry="42" stroke="#ead68c" fill="#111a17" stroke-width="3"/><text x="107" y="399" font-size="21" fill="#b7e89f" text-anchor="start">較通暢</text><text x="307" y="399" font-size="21" fill="#ead68c" text-anchor="start">較狹窄</text><path d="M470 110V450" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="505" y="130" font-size="22" fill="#c1b2ea" text-anchor="start">努力／氣流（概念）</text><text x="505" y="184" font-size="19" fill="#9ac8e8" text-anchor="start">阻塞</text><path d="M590 175Q613.75 163 637.5 175Q661.25 187 685.0 175Q708.75 163 732.5 175Q756.25 187 780.0 175" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 215H780" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="505" y="294" font-size="19" fill="#9ac8e8" text-anchor="start">中樞</text><path d="M590 285H780" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 325H780" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="505" y="385" font-size="18" fill="#e3e9e2" text-anchor="start">每組上列努力、下列氣流</text><text x="505" y="427" font-size="18" fill="#e3e9e2" text-anchor="start">任意波形，不供臨床評分</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>