<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-28-title sleep-28-desc"><title id="sleep-28-title">生活時間窗口與咖啡因消退</title><desc id="sleep-28-desc">左側虛構一天有工作、通勤與照護等限制；右側只示範100mg、半衰期5小時的單次消退模型，0、5、10小時為100、50、25mg。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 28 / 生活時間窗口與咖啡因消退</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">右曲線需依標註讀單次指數模型，無個人吸收、代謝及多次攝取資訊。</text><ellipse cx="215" cy="255" rx="120" ry="120" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="215" y="120" font-size="22" fill="#9ac8e8" text-anchor="middle">24小時的安排</text><path d="M215 255V145M215 255L315 310M215 255L115 320" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">工作、照護、通勤與睡眠機會</text><path d="M465 375V140M465 375H800" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M475.000 160.000L478.100 162.960L481.200 165.879L484.300 168.758L487.400 171.598L490.500 174.398L493.600 177.160L496.700 179.883L499.800 182.570L502.900 185.219L506.000 187.832L509.100 190.408L512.200 192.950L515.300 195.456L518.400 197.928L521.500 200.366L524.600 202.770L527.700 205.141L530.800 207.480L533.900 209.786L537.000 212.060L540.100 214.304L543.200 216.516L546.300 218.698L549.400 220.850L552.500 222.972L555.600 225.065L558.700 227.129L561.800 229.165L564.900 231.173L568.000 233.153L571.100 235.106L574.200 237.032L577.300 238.931L580.400 240.804L583.500 242.652L586.600 244.474L589.700 246.271L592.800 248.043L595.900 249.791L599.000 251.515L602.100 253.215L605.200 254.892L608.300 256.545L611.400 258.176L614.500 259.784L617.600 261.371L620.700 262.935L623.800 264.478L626.900 265.999L630.000 267.500L633.100 268.980L636.200 270.440L639.300 271.879L642.400 273.299L645.500 274.699L648.600 276.080L651.700 277.442L654.800 278.785L657.900 280.109L661.000 281.416L664.100 282.704L667.200 283.975L670.300 285.228L673.400 286.464L676.500 287.683L679.600 288.885L682.700 290.071L685.800 291.240L688.900 292.393L692.000 293.530L695.100 294.652L698.200 295.758L701.300 296.849L704.400 297.925L707.500 298.986L710.600 300.033L713.700 301.065L716.800 302.083L719.900 303.086L723.000 304.076L726.100 305.053L729.200 306.016L732.300 306.966L735.400 307.902L738.500 308.826L741.600 309.737L744.700 310.636L747.800 311.522L750.900 312.396L754.000 313.257L757.100 314.107L760.200 314.946L763.300 315.773L766.400 316.588L769.500 317.392L772.600 318.185L775.700 318.967L778.800 319.739L781.900 320.500L785.000 321.250" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="475" cy="160.0" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="475" y="140.0" font-size="19" fill="#ead68c" text-anchor="middle">100</text><path d="M475 375v8" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="413" font-size="18" fill="#9ac8e8" text-anchor="middle">0時</text><ellipse cx="630" cy="267.5" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="630" y="247.5" font-size="19" fill="#ead68c" text-anchor="middle">50</text><path d="M630 375v8" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="413" font-size="18" fill="#9ac8e8" text-anchor="middle">5時</text><ellipse cx="785" cy="321.25" rx="6" ry="6" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="785" y="301.25" font-size="19" fill="#ead68c" text-anchor="middle">25</text><path d="M785 375v8" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="785" y="413" font-size="18" fill="#9ac8e8" text-anchor="middle">10時</text><text x="480" y="448" font-size="17" fill="#e3e9e2" text-anchor="start">模型含量mg；不是入睡或安全閾值</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>