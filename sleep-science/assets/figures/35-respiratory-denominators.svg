<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-35-title sleep-35-desc"><title id="sleep-35-title">同樣36件事件，不同有效分母</title><desc id="sleep-35-desc">虛構已評分事件36件，PSG睡眠6小時時AHI為6每小時；另一方法有效監測8小時時REI為4.5每小時，兩個指數不直接當同一結果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 35 / 同樣36件事件，不同有效分母</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">事件刻痕只作示意，並未畫出36個可供重新評分的呼吸事件。</text><text x="70" y="126" font-size="25" fill="#b7e89f" text-anchor="start">虛構已評分事件：36件</text><path d="M80 190H780" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M211 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M249 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M368 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M405 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M508 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M571 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M635 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 180V202" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="250" width="525" height="50" rx="0" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="80" y="325" width="700" height="50" rx="0" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="95" y="285" font-size="22" fill="#111a17" text-anchor="start">睡眠6小時 → 36／6 = 6／小時</text><text x="95" y="360" font-size="22" fill="#111a17" text-anchor="start">有效監測8小時 → 36／8 = 4.5／小時</text><text x="80" y="425" font-size="19" fill="#e3e9e2" text-anchor="start">有效監測時間依方法定義，不是總錄製時長一律全算。</text><text x="80" y="454" font-size="18" fill="#e3e9e2" text-anchor="start">數字不含完整分型、症狀與照護資訊，不自動作診斷。</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>