<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-39-title sleep-39-desc"><title id="sleep-39-title">REM肌張力與就醫資料要分開追</title><desc id="sleep-39-desc">左側是REM時運動抑制路徑的概念，不是詳細神經定位；右側將行為、時間、受傷與同伴觀察連成待評估資料。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 39 / REM肌張力與就醫資料要分開追</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="120" width="350" height="305" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="110.0" y="143" width="240" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="230" y="182" font-size="21" fill="#9ac8e8" text-anchor="middle">REM相關腦網絡</text><path d="M230 215L230 245" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.3 236.0L230 245L225.7 236.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110.0" y="253" width="240" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="230" y="292" font-size="21" fill="#c1b2ea" text-anchor="middle">下行抑制與肌張力</text><text x="80" y="385" font-size="19" fill="#e3e9e2" text-anchor="start">夢境動作需檢查其他原因</text><rect x="445" y="120" width="360" height="305" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="475" y="165" font-size="24" fill="#b7e89f" text-anchor="start">評估資料</text><text x="475" y="220" font-size="20" fill="#e3e9e2" text-anchor="start">何時、頻率與變化</text><text x="475" y="272" font-size="20" fill="#e3e9e2" text-anchor="start">看見的行為與受傷</text><text x="475" y="324" font-size="20" fill="#e3e9e2" text-anchor="start">用藥、呼吸與白天功能</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>