<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-53-title sleep-53-desc"><title id="sleep-53-title">專題：時鐘、經過時間與估計分母</title><desc id="sleep-53-desc">左側跨時區算式只處理時鐘標籤，右側睡眠為陽性的判讀表，兩者都需先定義量到什麼再談結論。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 53 / 專題：時鐘、經過時間與估計分母</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="120" width="350" height="305" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="165" font-size="22" fill="#9ac8e8" text-anchor="start">固定UTC偏移示例</text><text x="80" y="225" font-size="22" fill="#e3e9e2" text-anchor="start">出發UTC+8</text><text x="80" y="275" font-size="22" fill="#e3e9e2" text-anchor="start">飛行經過12小時</text><text x="80" y="325" font-size="22" fill="#e3e9e2" text-anchor="start">到達UTC-5</text><text x="80" y="385" font-size="19" fill="#e3e9e2" text-anchor="start">換算不是已消除時差</text><rect x="445" y="120" width="360" height="305" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="470" y="165" font-size="21" fill="#b7e89f" text-anchor="start">睡眠為陽性，30秒一格</text><text x="470" y="225" font-size="24" fill="#e3e9e2" text-anchor="start">TP90　FN10</text><text x="470" y="275" font-size="24" fill="#e3e9e2" text-anchor="start">FP40　TN60</text><text x="470" y="335" font-size="20" fill="#e3e9e2" text-anchor="start">參考睡眠50分鐘</text><text x="470" y="382" font-size="20" fill="#ead68c" text-anchor="start">裝置估計65分鐘</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>