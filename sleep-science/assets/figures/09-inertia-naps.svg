<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-09-title sleep-09-desc"><title id="sleep-09-title">甦醒後的過渡與小睡位置</title><desc id="sleep-09-desc">左側虛構時間曲線示意甦醒後清醒表現逐步變化；右側日程有不同睡眠區塊，小睡可能改變後續壓力，但效果需考慮相位、時長與睡眠不足。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09 / 甦醒後的過渡與小睡位置</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">圖中時間、區塊與曲線未校準個人，不是補眠、警覺或排班處方。</text><path d="M70 360V140M70 360H410" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 325Q170 220 395 180" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="120" font-size="19" fill="#e3e9e2" text-anchor="start">清醒表現，任意示意</text><text x="80" y="410" font-size="20" fill="#e3e9e2" text-anchor="start">甦醒後時間 →</text><text x="90" y="200" font-size="21" fill="#ead68c" text-anchor="start">睡眠慣性</text><path d="M490 280H795" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="210" width="85" height="70" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="635" y="235" width="45" height="45" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="725" y="210" width="60" height="70" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="545" y="180" font-size="18" fill="#c1b2ea" text-anchor="middle">主要睡眠</text><text x="655" y="335" font-size="20" fill="#ead68c" text-anchor="middle">小睡</text><text x="695" y="395" font-size="18" fill="#e3e9e2" text-anchor="start">之後的S與相位另看</text><text x="65" y="457" font-size="18" fill="#e3e9e2" text-anchor="start">曲線不指定恢復分鐘數；小睡也不能保證消除駕駛或工作疲勞。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>