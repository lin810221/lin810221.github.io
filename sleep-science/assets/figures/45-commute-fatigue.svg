<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-45-title sleep-45-desc"><title id="sleep-45-title">當下睏倦與長期疲勞管理是兩個尺度</title><desc id="sleep-45-desc">左側駕駛路線中出現警示，先停止危險曝露；右側組織需用班表、回報與改善循環，不能把全部責任交給個人意志。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 45 / 當下睏倦與長期疲勞管理是兩個尺度</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="120" width="350" height="305" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M95 360L165 175M345 360L275 175" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 350V300M220 265V220" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="125" y="285" width="190" height="70" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="220" y="330" font-size="18" fill="#c1b2ea" text-anchor="middle">安全停駛／替代交通</text><text x="80" y="155" font-size="19" fill="#e3e9e2" text-anchor="start">不是靠開窗或音樂撐住</text><rect x="445" y="120" width="360" height="305" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><rect x="485.0" y="148" width="280" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="625" y="187" font-size="21" fill="#9ac8e8" text-anchor="middle">排班、休息與資源</text><rect x="485.0" y="233" width="280" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="625" y="272" font-size="21" fill="#ead68c" text-anchor="middle">非懲罰性回報與資料</text><rect x="485.0" y="318" width="280" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="625" y="357" font-size="21" fill="#c1b2ea" text-anchor="middle">改善、追蹤與再設計</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>