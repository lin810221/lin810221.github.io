<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-52-title sleep-52-desc"><title id="sleep-52-title">專題：階段路徑與時間分母互相核對</title><desc id="sleep-52-desc">左側是本課480分鐘合成階段路徑，清醒40、睡眠440分鐘；右側是另一晚日誌，八小時機會扣除三種清醒後睡眠390分鐘，不能當成同一晚互證。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 52 / 專題：階段路徑與時間分母互相核對</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="120" width="350" height="310" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="153" font-size="19" fill="#9ac8e8" text-anchor="start">階段合成例，非實際腦波</text><text x="75" y="191" font-size="18" fill="#9ac8e8" text-anchor="start">W</text><path d="M124 185H383" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="75" y="223" font-size="18" fill="#9ac8e8" text-anchor="start">REM</text><path d="M124 217H383" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="75" y="255" font-size="18" fill="#9ac8e8" text-anchor="start">N1</text><path d="M124 249H383" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="75" y="287" font-size="18" fill="#9ac8e8" text-anchor="start">N2</text><path d="M124 281H383" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><text x="75" y="319" font-size="18" fill="#9ac8e8" text-anchor="start">N3</text><path d="M124 313H383" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><path d="M125.00 185H135.75L135.75 249H141.12L141.12 281H157.25L157.25 313H178.75L178.75 281H189.50L189.50 217H200.25L200.25 185H202.94L202.94 249H205.62L205.62 281H221.75L221.75 313H235.19L235.19 281H245.94L245.94 217H262.06L262.06 281H280.88L280.88 313H288.94L288.94 281H299.69L299.69 217H318.50L318.50 185H323.88L323.88 249H326.56L326.56 281H345.38L345.38 217H366.88L366.88 281H374.94L374.94 217H380.31L380.31 185H383.00" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="345" font-size="18" fill="#e3e9e2" text-anchor="start">0</text><text x="383" y="345" font-size="18" fill="#e3e9e2" text-anchor="end">480分</text><text x="80" y="378" font-size="20" fill="#b7e89f" text-anchor="start">W40；睡眠440分鐘</text><text x="80" y="408" font-size="18" fill="#c1b2ea" text-anchor="start">與右側日誌為不同夜晚</text><rect x="445" y="120" width="360" height="310" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="470" y="165" font-size="24" fill="#b7e89f" text-anchor="start">23:00 → 次日07:00</text><text x="470" y="222" font-size="22" fill="#e3e9e2" text-anchor="start">機會480分鐘</text><text x="470" y="273" font-size="22" fill="#e3e9e2" text-anchor="start">清醒：30＋40＋20</text><text x="470" y="326" font-size="22" fill="#ead68c" text-anchor="start">睡眠390；效率81.25%</text><text x="470" y="388" font-size="18" fill="#e3e9e2" text-anchor="start">另一晚；依日誌欄位扣除</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>