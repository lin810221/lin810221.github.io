<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-05-title sleep-05-desc"><title id="sleep-05-title">REM特徵與一夜睡眠圖</title><desc id="sleep-05-desc">左側REM示意分開腦活動、眼動及骨骼肌張力；右側階段圖用時間與類別表示一夜轉換，並非深淺好壞分數或固定九十分鐘循環。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 05 / REM特徵與一夜睡眠圖</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">右側為虛構階段順序；縱軸是類別，不能把線條高度當恢復品質。</text><rect x="45" y="130" width="290" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="190.0" y="169" font-size="21" fill="#9ac8e8" text-anchor="middle">REM：腦活動有特徵</text><rect x="45" y="230" width="290" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="190.0" y="269" font-size="21" fill="#ead68c" text-anchor="middle">快速眼動可間歇出現</text><rect x="45" y="330" width="290" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="190.0" y="369" font-size="21" fill="#c1b2ea" text-anchor="middle">許多骨骼肌張力降低</text><path d="M430 135V395H800" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="417" y="161" font-size="17" fill="#9ac8e8" text-anchor="end">醒</text><text x="417" y="211" font-size="17" fill="#ead68c" text-anchor="end">REM</text><text x="417" y="261" font-size="17" fill="#9ac8e8" text-anchor="end">N1</text><text x="417" y="311" font-size="17" fill="#b7e89f" text-anchor="end">N2</text><text x="417" y="361" font-size="17" fill="#c1b2ea" text-anchor="end">N3</text><path d="M450 155H470V255H480V305H515V355H550V305H580V205H605V305H630V355H650V305H680V205H715V155H725V305H755V205H785V155" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="436" font-size="19" fill="#e3e9e2" text-anchor="start">入睡後的任意時間 →</text><text x="45" y="455" font-size="18" fill="#e3e9e2" text-anchor="start">REM不是所有肌肉停止，也不是唯一會做夢的階段。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>