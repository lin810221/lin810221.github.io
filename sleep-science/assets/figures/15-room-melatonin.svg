<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-15-title sleep-15-desc"><title id="sleep-15-title">睡眠環境與光到激素的多步路徑</title><desc id="sleep-15-desc">左側臥室簡圖分開光、聲音、溫度與安全活動需求；右側光訊號經視網膜、SCN與多突觸神經路徑調節松果體，外源褪黑激素則是另一種介入。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15 / 睡眠環境與光到激素的多步路徑</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">右側省略中繼細節，並非SCN直連松果體；沒有產品劑量或用藥指示。</text><rect x="55" y="120" width="355" height="300" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="85" y="145" width="95" height="100" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M100 145V245M145 145V245" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="85" y="315" width="285" height="55" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><ellipse cx="125" cy="310" rx="28" ry="18" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="205" y="200" font-size="20" fill="#e3e9e2" text-anchor="start">光、聲音</text><text x="205" y="240" font-size="20" fill="#e3e9e2" text-anchor="start">溫度、舒適</text><text x="95" y="398" font-size="18" fill="#e3e9e2" text-anchor="start">也保留起夜與通行安全</text><rect x="475" y="112" width="325" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="637.5" y="151" font-size="21" fill="#9ac8e8" text-anchor="middle">視網膜 → SCN</text><path d="M637 178L637 189" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M641.3 180.0L637 189L632.7 180.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="194" width="325" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="637.5" y="233" font-size="21" fill="#b7e89f" text-anchor="middle">多突觸自主神經路徑</text><path d="M637 260L637 271" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M641.3 262.0L637 271L632.7 262.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="276" width="325" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="637.5" y="315" font-size="21" fill="#ead68c" text-anchor="middle">松果體的激素調節</text><path d="M637 342L637 353" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M641.3 344.0L637 353L632.7 344.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="358" width="325" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="637.5" y="397" font-size="21" fill="#c1b2ea" text-anchor="middle">相位、睡眠與個別條件</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>