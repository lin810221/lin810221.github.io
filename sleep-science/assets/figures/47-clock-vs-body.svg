<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-47-title sleep-47-desc"><title id="sleep-47-title">牆上時間改了，生理相位尚未同步</title><desc id="sleep-47-desc">兩個時鐘代表不同當地標籤，下方生理時間帶沒有立即跳到新位置；東西向是常見概括，大時差和路徑需更仔細定義。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 47 / 牆上時間改了，生理相位尚未同步</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><ellipse cx="190" cy="230" rx="80" ry="80" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M190 162V230L230.0 250.0" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="650" cy="230" rx="80" ry="80" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M650 162V230L690.0 250.0" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="355" font-size="22" fill="#9ac8e8" text-anchor="middle">出發地時鐘</text><text x="650" y="355" font-size="22" fill="#ead68c" text-anchor="middle">到達地時鐘</text><path d="M300 230L535 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M526.0 225.7L535 230L526.0 234.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="190" font-size="20" fill="#b7e89f" text-anchor="middle">時鐘換算</text><path d="M90 410H770" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="450" font-size="20" fill="#c1b2ea" text-anchor="middle">內在節律的調整另需時間與合適訊號</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>