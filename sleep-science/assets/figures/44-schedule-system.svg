<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-44-title sleep-44-desc"><title id="sleep-44-title">班表的空白不是全部可睡時間</title><desc id="sleep-44-desc">兩個連續班別之間包含通勤、家務與恢復，真正可睡機會是其中一部分；下方環境代表家庭與工作支持需共同設計。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 44 / 班表的空白不是全部可睡時間</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="65" y="150" width="140" height="85" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="85" y="200" font-size="23" fill="#ead68c" text-anchor="start">前一班</text><rect x="650" y="150" width="140" height="85" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="670" y="200" font-size="23" fill="#ead68c" text-anchor="start">下一班</text><path d="M215 190H640" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="270" width="130" height="65" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="92" y="310" font-size="19" fill="#9ac8e8" text-anchor="start">通勤</text><rect x="230" y="270" width="140" height="65" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="242" y="310" font-size="19" fill="#c1b2ea" text-anchor="start">生活責任</text><rect x="390" y="270" width="180" height="65" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="402" y="310" font-size="19" fill="#b7e89f" text-anchor="start">可睡機會</text><rect x="590" y="270" width="170" height="65" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="602" y="310" font-size="19" fill="#9ac8e8" text-anchor="start">準備與通勤</text><text x="75" y="410" font-size="21" fill="#e3e9e2" text-anchor="start">日曆上的休息間隔 ≠ 可睡時間 ≠ 實際睡眠。</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>