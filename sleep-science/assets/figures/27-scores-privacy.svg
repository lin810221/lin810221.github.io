<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-27-title sleep-27-desc"><title id="sleep-27-title">同一晚的分數，也有版本與用途</title><desc id="sleep-27-desc">左側相同原始資料經不同演算法版本形成不同分數，右側個人可選保存、分享或不追蹤；圖無最佳階段比例與健康門檻。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 27 / 同一晚的分數，也有版本與用途</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">分數甲乙沒有真實刻度；資料與算法版本需分別記錄，選擇追蹤不強制。</text><rect x="55" y="125" width="280" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="195.0" y="163" font-size="21" fill="#9ac8e8" text-anchor="middle">同一晚原始感測</text><path d="M150 200L95 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M104.0 265.6L95 270L97.1 260.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 200L300 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M297.9 260.2L300 270L291.0 265.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="285" width="150" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="110.0" y="323" font-size="21" fill="#ead68c" text-anchor="middle">版本A</text><rect x="235" y="285" width="150" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="310.0" y="323" font-size="21" fill="#c1b2ea" text-anchor="middle">版本B</text><text x="62" y="395" font-size="23" fill="#ead68c" text-anchor="start">分數甲</text><text x="262" y="395" font-size="23" fill="#c1b2ea" text-anchor="start">分數乙</text><path d="M425 110V455" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="620" cy="175" rx="30" ry="35" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M620 213V290M620 238L575 270M620 238L665 270M620 290L590 340M620 290L650 340" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="481" y="395" font-size="22" fill="#9ac8e8" text-anchor="start">保存／分享／不追蹤</text><text x="481" y="441" font-size="18" fill="#e3e9e2" text-anchor="start">目的、同意、保留與刪除要查</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>