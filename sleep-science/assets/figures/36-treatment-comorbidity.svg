<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-36-title sleep-36-desc"><title id="sleep-36-title">改善氣道，也要回到整體睡眠與功能</title><desc id="sleep-36-desc">左側正壓支撐與下頷位置改變是不同機制概念，右側失眠和呼吸障礙可重疊；照護需兼顧症狀、功能、依從與適用條件。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 36 / 改善氣道，也要回到整體睡眠與功能</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">非比例構造圖，不示範裝置設定、咬合調整或個人治療順序。</text><ellipse cx="160" cy="220" rx="76" ry="90" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="160" cy="220" rx="43" ry="65" stroke="#b7e89f" fill="#111a17" stroke-width="3"/><path d="M65 220L113 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M104.0 215.7L113 220L104.0 224.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="370" font-size="21" fill="#b7e89f" text-anchor="start">正壓支撐概念</text><ellipse cx="355" cy="220" rx="70" ry="90" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M320 258L370 281 402 265" stroke="#ead68c" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 320L395 320" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M386.0 315.7L395 320L386.0 324.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="370" font-size="21" fill="#ead68c" text-anchor="start">下頷位置改變</text><path d="M470 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="620" cy="230" rx="95" ry="75" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="680" cy="310" rx="95" ry="75" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="620" y="225" font-size="22" fill="#ead68c" text-anchor="middle">呼吸問題</text><text x="690" y="332" font-size="22" fill="#c1b2ea" text-anchor="middle">失眠問題</text><text x="510" y="431" font-size="18" fill="#e3e9e2" text-anchor="start">共同評估，不把所有醒來歸同一原因</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>