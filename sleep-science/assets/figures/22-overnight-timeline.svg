<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-22-title sleep-22-desc"><title id="sleep-22-title">跨日的一夜：先把時間點對齊</title><desc id="sleep-22-desc">虛構一夜由當日23:00上床並嘗試，到次日07:00離床；入睡潛伏30分、夜中醒40分、最後醒到離床20分，剩390分為估計睡眠。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 22 / 跨日的一夜：先把時間點對齊</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">同一比例時間軸；午夜切換日期，夜中覺醒位置是方便教學的安排。</text><text x="75" y="122" font-size="21" fill="#e3e9e2" text-anchor="start">虛構記錄：上床與開始嘗試在本例同為23:00</text><path d="M80 205H720" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 193V218" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="247" font-size="18" fill="#9ac8e8" text-anchor="middle">23:00</text><path d="M160 193V218" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="247" font-size="18" fill="#9ac8e8" text-anchor="middle">00:00</text><path d="M400 193V218" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="247" font-size="18" fill="#9ac8e8" text-anchor="middle">03:00</text><path d="M720 193V218" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="247" font-size="18" fill="#9ac8e8" text-anchor="middle">07:00</text><rect x="80" y="280" width="40" height="62" rx="0" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="120" y="280" width="280" height="62" rx="0" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="400" y="280" width="53.333" height="62" rx="0" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="453.333" y="280" width="240" height="62" rx="0" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="693.333" y="280" width="26.667" height="62" rx="0" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="78" y="390" font-size="20" fill="#ead68c" text-anchor="start">SOL 30分</text><text x="293" y="390" font-size="20" fill="#c1b2ea" text-anchor="start">WASO 40分</text><text x="535" y="390" font-size="20" fill="#eda894" text-anchor="start">最後清醒20分</text><text x="78" y="445" font-size="19" fill="#e3e9e2" text-anchor="start">綠色估計睡眠共390分；此圖不是PSG實測階段圖。</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>