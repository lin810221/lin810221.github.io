<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-17-title sleep-17-desc"><title id="sleep-17-title">兒童、青春期與家庭學校時間</title><desc id="sleep-17-desc">兩列虛構睡眠時段和共同上課要求呈現機會與內在相位可能衝突；青春期較晚偏好不是每人相同，也不能只歸於意志力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 17 / 兒童、青春期與家庭學校時間</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">區塊與時點沒有實測鐘點；不以年齡直接診斷或替家庭規定唯一作息。</text><path d="M85 240H785M85 375H785" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="145" font-size="23" fill="#e3e9e2" text-anchor="start">家庭與學校：安排也影響睡眠機會</text><text x="85" y="205" font-size="20" fill="#b7e89f" text-anchor="start">虛構較早睡眠相位</text><rect x="175" y="218" width="355" height="45" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="85" y="337" font-size="20" fill="#c1b2ea" text-anchor="start">虛構較晚睡眠相位</text><rect x="315" y="353" width="355" height="45" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><path d="M590 165V420" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="605" y="190" font-size="19" fill="#ead68c" text-anchor="start">共同社會要求</text><text x="605" y="220" font-size="18" fill="#ead68c" text-anchor="start">不必等於相位</text><text x="90" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">年齡建議多按24小時總睡眠；小睡是否計入要讀來源。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>