<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-03-title sleep-03-desc"><title id="sleep-03-title">把研究線索接回腦與身體</title><desc id="sleep-03-desc">左側分開實驗與觀察比較，右側示意大腦皮質、下視丘與腦幹等參與睡眠清醒調節，器官之間協調而非單一睡眠中心。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 03 / 把研究線索接回腦與身體</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">位置與線條為非比例側面概念；研究設計不能只靠標題判因果。</text><rect x="45" y="125" width="285" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="187.5" y="164" font-size="21" fill="#9ac8e8" text-anchor="middle">實驗：分配條件後比較</text><rect x="45" y="225" width="285" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="187.5" y="264" font-size="21" fill="#ead68c" text-anchor="middle">觀察：先查共同原因</text><path d="M188 195L188 215" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M192.3 206.0L188 215L183.7 206.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="365" font-size="19" fill="#e3e9e2" text-anchor="start">追蹤、量測與結果各自查核</text><path d="M415 115V450" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 230Q470 135 600 125Q748 125 760 245Q747 300 670 310L655 370 615 370 610 315Q530 325 495 230Z" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="260" rx="29" ry="18" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M635 300V375" stroke="#b7e89f" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M700 170L720 115" stroke="#9ac8e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="120" font-size="17" fill="#9ac8e8" text-anchor="start">皮質</text><path d="M625 259L554 385" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="478" y="390" font-size="17" fill="#ead68c" text-anchor="start">下視丘等</text><path d="M636 348L670 400" stroke="#b7e89f" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="405" font-size="17" fill="#b7e89f" text-anchor="start">腦幹</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>