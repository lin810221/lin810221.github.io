<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-54-title sleep-54-desc"><title id="sleep-54-title">交付：機制、時間線與證據相互連接</title><desc id="sleep-54-desc">構造機制、日誌量測與研究來源連到一頁摘要，問號保留未知；好的摘要能被查核與更新，不是自動健康分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 54 / 交付：機制、時間線與證據相互連接</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="50.0" y="128" width="280" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="190" y="167" font-size="21" fill="#9ac8e8" text-anchor="middle">機制與適用條件</text><rect x="50.0" y="243" width="280" height="64" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="190" y="282" font-size="21" fill="#b7e89f" text-anchor="middle">時間、分母與未知</text><rect x="50.0" y="358" width="280" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="190" y="397" font-size="21" fill="#c1b2ea" text-anchor="middle">來源、版本與證據</text><path d="M355 175L480 250" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M474.5 241.6L480 250L470.0 249.1" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M355 275L480 275" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.0 270.7L480 275L471.0 279.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M355 390L480 300" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M470.2 301.7L480 300L475.2 308.8" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="175" width="285" height="225" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="530" y="220" font-size="24" fill="#ead68c" text-anchor="start">可查核的睡眠摘要</text><text x="530" y="277" font-size="21" fill="#e3e9e2" text-anchor="start">理解與下一個問題</text><text x="530" y="330" font-size="23" fill="#c1b2ea" text-anchor="start">待查資料　？</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>