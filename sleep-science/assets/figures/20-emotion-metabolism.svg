<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-20-title sleep-20-desc"><title id="sleep-20-title">睡眠、情緒與代謝有多向連結</title><desc id="sleep-20-desc">中央睡眠連到情緒調節、行為選擇與代謝身體反應，雙向箭頭代表可能互相影響；不把關聯圖當個人病因診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 20 / 睡眠、情緒與代謝有多向連結</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">箭頭是機制與雙向關聯的概念，不代表方向、強度與因果均已量定。</text><ellipse cx="430" cy="260" rx="128" ry="72" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="270" font-size="26" fill="#b7e89f" text-anchor="middle">睡眠與節律</text><ellipse cx="175" cy="170" rx="87" ry="58" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="175" y="177" font-size="22" fill="#9ac8e8" text-anchor="middle">情緒與壓力</text><ellipse cx="685" cy="170" rx="90" ry="58" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="685" y="177" font-size="22" fill="#ead68c" text-anchor="middle">行為與食慾</text><ellipse cx="175" cy="377" rx="87" ry="58" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="175" y="384" font-size="22" fill="#c1b2ea" text-anchor="middle">身體與疼痛</text><ellipse cx="685" cy="377" rx="90" ry="58" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="685" y="384" font-size="22" fill="#eda894" text-anchor="middle">代謝與血管</text><path d="M260 200L312 230" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M306.4 221.7L312 230L302.0 229.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 250L255 225" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M261.4 232.7L255 225L265.0 224.8" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M550 230L602 200" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M592.0 200.7L602 200L596.4 208.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M602 225L550 250" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560.0 250.0L550 250L556.2 242.2" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 351L313 300" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M303.5 303.1L313 300L309.5 309.4" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 321L257 369" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.6 366.2L257 369L260.8 359.7" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M549 300L603 351" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M599.4 341.7L603 351L593.5 348.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M603 373L550 322" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M553.5 331.4L550 322L559.5 325.1" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>