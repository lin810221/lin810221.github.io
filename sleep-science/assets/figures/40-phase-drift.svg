<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-40-title sleep-40-desc"><title id="sleep-40-title">固定偏移與每天漂移不同</title><desc id="sleep-40-desc">三列虛構日誌以同一時鐘表示睡眠時段；固定較晚與逐日漂移是不同模式，畫面本身不構成診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 40 / 固定偏移與每天漂移不同</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><text x="65" y="125" font-size="20" fill="#9ac8e8" text-anchor="start">共同時鐘：每一列為不同日期</text><path d="M170 190H780" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="198" font-size="20" fill="#e3e9e2" text-anchor="start">第1日</text><path d="M170 270H780" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="278" font-size="20" fill="#e3e9e2" text-anchor="start">第2日</text><path d="M170 350H780" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="358" font-size="20" fill="#e3e9e2" text-anchor="start">第3日</text><rect x="250" y="174" width="210" height="35" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="250" y="254" width="210" height="35" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="250" y="334" width="210" height="35" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="485" y="174" width="210" height="35" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="520" y="254" width="210" height="35" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="555" y="334" width="210" height="35" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="240" y="420" font-size="20" fill="#e3e9e2" text-anchor="start">綠：固定位置；紫：逐日較晚，僅為模式示例。</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>