<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-10-title sleep-10-desc"><title id="sleep-10-title">內生節律與視網膜到SCN</title><desc id="sleep-10-desc">左側連續日期的任意活動時點逐日漂移，表示內生週期與24小時可能不同；右側眼睛接收光後經神經訊號到SCN，再協調其他時鐘。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 10 / 內生節律與視網膜到SCN</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">漂移量為虛構，並非所有人相同；SCN位置與路徑均為非比例概念。</text><text x="45" y="146" font-size="18" fill="#e3e9e2" text-anchor="start">日1</text><path d="M105 140H405" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="140" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="45" y="204" font-size="18" fill="#e3e9e2" text-anchor="start">日2</text><path d="M105 198H405" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="174" cy="198" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="45" y="262" font-size="18" fill="#e3e9e2" text-anchor="start">日3</text><path d="M105 256H405" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="198" cy="256" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="45" y="320" font-size="18" fill="#e3e9e2" text-anchor="start">日4</text><path d="M105 314H405" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="222" cy="314" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="45" y="378" font-size="18" fill="#e3e9e2" text-anchor="start">日5</text><path d="M105 372H405" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="246" cy="372" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="105" y="443" font-size="18" fill="#e3e9e2" text-anchor="start">相同鐘面下的時點 →</text><ellipse cx="550" cy="155" rx="45" ry="28" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="550" cy="155" rx="13" ry="13" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M600 155L675 155" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M666.0 150.7L675 155L666.0 159.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="695" y="125" width="120" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="755.0" y="164" font-size="21" fill="#b7e89f" text-anchor="middle">SCN</text><path d="M750 205L750 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M754.3 256.0L750 265L745.7 256.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="290" width="290" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="665.0" y="329" font-size="21" fill="#c1b2ea" text-anchor="middle">協調身體多個時鐘</text><text x="490" y="405" font-size="19" fill="#e3e9e2" text-anchor="start">光訊號經視網膜神經路徑</text><text x="490" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">不是看見亮度的主觀感受而已</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>