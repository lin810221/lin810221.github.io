<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-01-title sleep-01-desc"><title id="sleep-01-title">睡眠是會轉換的調節狀態</title><desc id="sleep-01-desc">同一個人在清醒與睡眠之間轉換，感官反應、腦活動和身體調節不是全部關閉；睡眠的時長、連續性與白天功能需分開觀察。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 01 / 睡眠是會轉換的調節狀態</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">箭頭表示狀態轉換；人物與波形只是概念，不是個人的臨床紀錄。</text><ellipse cx="170" cy="155" rx="20" ry="24" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M170 181V270M170 203L130 238M170 203L210 238M170 270L140 330M170 270L200 330" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="620" cy="230" rx="120" ry="92" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M540 230Q575 195 610 230T690 230" stroke="#c1b2ea" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="398" font-size="22" fill="#9ac8e8" text-anchor="middle">清醒：與環境互動</text><text x="620" y="398" font-size="22" fill="#c1b2ea" text-anchor="middle">睡眠：反應與調節改變</text><path d="M300 185L465 185" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M456.0 180.7L465 185L456.0 189.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 300L300 300" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M309.0 304.3L300 300L309.0 295.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="382" y="158" font-size="21" fill="#b7e89f" text-anchor="middle">可逆轉換</text><text x="380" y="345" font-size="20" fill="#ead68c" text-anchor="middle">不是腦與全身全部停工</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>