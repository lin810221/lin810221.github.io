<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-33-title sleep-33-desc"><title id="sleep-33-title">照護方式與比較問題要分開</title><desc id="sleep-33-desc">上半部當事人可選合適面對面或數位服務並持續回顧；下半部2026合併治療指南的兩種比較方向不同，不能只讀成加藥一定更好。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 33 / 照護方式與比較問題要分開</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">治療圖非個人選藥；2026正式指南處理合併比較，未取代2021行為治療指南。</text><ellipse cx="155" cy="170" rx="28" ry="35" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M155 207V265M155 225L120 252M155 225L190 252" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 200L330 145" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M320.0 144.6L330 145L323.5 152.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 215L330 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.7 248.1L330 255L320.1 256.4" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="115" width="380" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="540.0" y="153" font-size="21" fill="#b7e89f" text-anchor="middle">面對面：受訓服務與合作</text><rect x="350" y="225" width="380" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="540.0" y="263" font-size="21" fill="#c1b2ea" text-anchor="middle">數位：方案證據與適用性</text><path d="M55 320H800" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="360" font-size="21" fill="#b7e89f" text-anchor="start">CBT-I＋藥物　對　藥物單用</text><text x="65" y="402" font-size="21" fill="#ead68c" text-anchor="start">CBT-I＋藥物　對　CBT-I單用</text><text x="65" y="447" font-size="18" fill="#e3e9e2" text-anchor="start">兩個比較不同；均需讀建議方向、低確定性與個別價值。</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>