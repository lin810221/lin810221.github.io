<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-42-title sleep-42-desc"><title id="sleep-42-title">相位、睡眠機會與功能共同決定問題</title><desc id="sleep-42-desc">三條平行時間線把時鐘相位、可睡機會和必須清醒的工作分開；箭頭是比較框架，沒有提供個人的照光或服用時間。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 42 / 相位、睡眠機會與功能共同決定問題</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">時段皆為無刻度示例，不能換成個人的精準相位或治療時程。</text><text x="65" y="150" font-size="21" fill="#c1b2ea" text-anchor="start">生物時鐘的睡眠傾向</text><path d="M65 180H780" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="166" width="250" height="28" rx="4" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="65" y="260" font-size="21" fill="#b7e89f" text-anchor="start">實際可睡的機會</text><path d="M65 290H780" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="276" width="240" height="28" rx="4" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="65" y="370" font-size="21" fill="#ead68c" text-anchor="start">外在必須清醒的需求</text><path d="M65 400H780" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="450" y="386" width="260" height="28" rx="4" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>