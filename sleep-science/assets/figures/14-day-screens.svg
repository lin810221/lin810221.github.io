<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-14-title sleep-14-desc"><title id="sleep-14-title">日夜環境與螢幕的三條路徑</title><desc id="sleep-14-desc">白天與晚間有不同光暗及活動背景；螢幕可能經由光訊息、內容喚起及排擠睡眠時間影響睡眠，不只藍光一個原因。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14 / 日夜環境與螢幕的三條路徑</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">路徑表示可能機制，不以一張圖確定某人失眠的唯一原因。</text><ellipse cx="150" cy="155" rx="36" ry="36" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M198.0 155.0L216.0 155.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M183.94112549695427 188.94112549695427L196.66904755831214 201.66904755831214" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.0 203.0L150.0 221.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.05887450304573 188.94112549695427L103.33095244168787 201.66904755831214" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M102.0 155.0L84.0 155.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.05887450304571 121.05887450304573L103.33095244168786 108.33095244168787" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M150.0 107.0L150.0 89.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M183.94112549695427 121.05887450304571L196.66904755831212 108.33095244168786" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="75" y="290" width="150" height="110" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="150" y="350" font-size="21" fill="#9ac8e8" text-anchor="middle">白天條件</text><rect x="325" y="160" width="115" height="200" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="338" y="176" width="88" height="140" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M455 205L505 150" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.7 153.7L505 150L502.2 159.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 260L505 260" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 255.7L505 260L496.0 264.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 315L505 370" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M502.2 360.4L505 370L495.7 366.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="118" width="285" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="662.5" y="157" font-size="21" fill="#b7e89f" text-anchor="middle">眼部光訊息</text><rect x="520" y="228" width="285" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="662.5" y="267" font-size="21" fill="#ead68c" text-anchor="middle">內容與互動喚起</text><rect x="520" y="338" width="285" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="662.5" y="377" font-size="21" fill="#c1b2ea" text-anchor="middle">時間排擠與延後上床</text><text x="60" y="454" font-size="19" fill="#e3e9e2" text-anchor="start">濾色不會自動處理內容、通知、作息或其他環境條件。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>