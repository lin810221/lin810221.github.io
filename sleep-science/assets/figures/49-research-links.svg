<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-49-title sleep-49-desc"><title id="sleep-49-title">短睡、長睡與健康關聯需要比較</title><desc id="sleep-49-desc">左側隨機介入可支持特定比較，右側共同原因同時連到睡眠與健康；U形關聯不等於每個點都是睡眠造成。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 49 / 短睡、長睡與健康關聯需要比較</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="125" width="350" height="295" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="110.0" y="143" width="240" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="230" y="182" font-size="21" fill="#9ac8e8" text-anchor="middle">明確比較與隨機分配</text><path d="M230 215L230 245" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.3 236.0L230 245L225.7 236.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110.0" y="253" width="240" height="64" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="230" y="292" font-size="21" fill="#b7e89f" text-anchor="middle">結果、區間與執行</text><text x="80" y="390" font-size="18" fill="#e3e9e2" text-anchor="start">研究介入不自動代表所有人</text><rect x="445" y="125" width="360" height="295" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="500.0" y="143" width="250" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="625" y="182" font-size="21" fill="#c1b2ea" text-anchor="middle">疾病、工作與其他條件</text><path d="M570 219L520 285" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M528.9 280.4L520 285L522.0 275.2" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 219L730 285" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M728.0 275.2L730 285L721.1 280.4" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="485" y="325" font-size="23" fill="#9ac8e8" text-anchor="start">睡眠</text><text x="710" y="325" font-size="23" fill="#b7e89f" text-anchor="start">健康</text><text x="475" y="390" font-size="18" fill="#e3e9e2" text-anchor="start">也需檢查健康反過來改睡眠</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>