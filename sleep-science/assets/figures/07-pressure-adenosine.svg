<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-07-title sleep-07-desc"><title id="sleep-07-title">睡眠壓力與咖啡因的不同位置</title><desc id="sleep-07-desc">左側示意睡眠壓力在清醒累積、睡眠消退；右側腺苷訊號與受體、咖啡因拮抗的位置不同，阻擋訊號不等於清除全部壓力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 07 / 睡眠壓力與咖啡因的不同位置</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">S不是血中腺苷讀數；兩者相關但不能直接視為同一個可量測數字。</text><path d="M65 360H430M65 360V130" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 315Q230 165 330 155Q350 280 420 322" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="400" font-size="19" fill="#e3e9e2" text-anchor="start">清醒累積　／　睡眠消退</text><text x="90" y="125" font-size="19" fill="#9ac8e8" text-anchor="start">模型S，任意尺度</text><rect x="520" y="180" width="260" height="130" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="650" y="221" font-size="23" fill="#c1b2ea" text-anchor="middle">受體與訊號</text><ellipse cx="550" cy="140" rx="15" ry="15" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="680" cy="140" rx="15" ry="15" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="510" y="115" font-size="20" fill="#b7e89f" text-anchor="start">腺苷</text><text x="655" y="115" font-size="20" fill="#ead68c" text-anchor="start">咖啡因</text><path d="M550 160L570 176" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M565.7 167.0L570 176L560.3 173.8" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 162L680 178" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M668 177H692" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="365" font-size="19" fill="#e3e9e2" text-anchor="start">受體拮抗不是把睡眠需求歸零</text><text x="70" y="453" font-size="18" fill="#e3e9e2" text-anchor="start">曲線與分子位置均為教學簡化，非濃度量測或用量建議。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>