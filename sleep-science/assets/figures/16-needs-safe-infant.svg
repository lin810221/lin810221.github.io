<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-16-title sleep-16-desc"><title id="sleep-16-title">群體睡眠需求與嬰兒睡眠環境</title><desc id="sleep-16-desc">左側成人建議與個體條件並列，不把某個小時數當健康保證；右側原創嬰兒仰睡示意，硬實平坦水平的獨立睡面只有合身床單，無枕被玩具。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16 / 群體睡眠需求與嬰兒睡眠環境</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">左側為2015群體共識，右側依AAP2022／NICHD現行安全資訊；不是嬰兒訓練表。</text><text x="60" y="140" font-size="21" fill="#9ac8e8" text-anchor="start">18至60歲健康成人共識</text><text x="60" y="190" font-size="25" fill="#b7e89f" text-anchor="start">規律每晚7小時以上</text><text x="60" y="250" font-size="19" fill="#e3e9e2" text-anchor="start">仍看：品質、規律與白天功能</text><text x="60" y="300" font-size="19" fill="#e3e9e2" text-anchor="start">嬰幼兒需求另按年齡及午睡</text><rect x="470" y="135" width="320" height="290" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="495" y="185" width="270" height="205" rx="3" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><ellipse cx="630" cy="240" rx="26" ry="27" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="622" cy="236" rx="2" ry="2" stroke="#e3e9e2" fill="#e3e9e2" stroke-width="3"/><ellipse cx="638" cy="236" rx="2" ry="2" stroke="#e3e9e2" fill="#e3e9e2" stroke-width="3"/><rect x="610" y="275" width="40" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M610 285L585 315M650 285L675 315M620 330L610 355M640 330L650 355" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="170" font-size="20" fill="#ead68c" text-anchor="middle">仰睡：臉朝上</text><text x="60" y="455" font-size="18" fill="#e3e9e2" text-anchor="start">示意不認證產品；成人床、沙發與軟物不當作嬰兒睡面。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>