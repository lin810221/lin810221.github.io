<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-19-title sleep-19-desc"><title id="sleep-19-title">記憶有階段，注意力也會波動</title><desc id="sleep-19-desc">上半部為學習前編碼、離線整合與提取的概念路徑，下半部為虛構反應時間點：少數很慢的反應不由平均值完整呈現。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 19 / 記憶有階段，注意力也會波動</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">上方箭頭表示研究中的處理階段；下方散點僅說明分布與長尾。</text><rect x="55" y="120" width="220" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="165.0" y="158" font-size="21" fill="#9ac8e8" text-anchor="middle">清醒：編碼</text><path d="M285 151L315 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M306.0 146.7L315 151L306.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="325" y="120" width="220" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="435.0" y="158" font-size="21" fill="#b7e89f" text-anchor="middle">睡眠：整合</text><path d="M555 151L585 151" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M576.0 146.7L585 151L576.0 155.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="595" y="120" width="210" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="700.0" y="158" font-size="21" fill="#ead68c" text-anchor="middle">之後：提取</text><text x="70" y="225" font-size="20" fill="#e3e9e2" text-anchor="start">睡眠不是把未學會的內容直接下載進腦。</text><path d="M90 365H775" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="125" cy="330" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="145" cy="341" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="170" cy="352" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="192" cy="330" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="215" cy="341" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="240" cy="352" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="495" cy="348" rx="7" ry="7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="710" cy="342" rx="7" ry="7" stroke="#eda894" fill="#eda894" stroke-width="3"/><text x="95" y="410" font-size="20" fill="#9ac8e8" text-anchor="start">反應較快</text><text x="606" y="410" font-size="20" fill="#eda894" text-anchor="start">反應較慢／停頓</text><text x="92" y="452" font-size="18" fill="#e3e9e2" text-anchor="start">反應時間示意，沒有實測刻度，不是個人功能檢測。</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>