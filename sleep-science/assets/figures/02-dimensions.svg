<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-02-title sleep-02-desc"><title id="sleep-02-title">時數、品質與白天感受不是同一條尺</title><desc id="sleep-02-desc">左側四條資訊軸表示睡眠時長、時間、連續性及規律各有角色；右側睏倦與疲勞為可分開描述的經驗，沒有診斷分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02 / 時數、品質與白天感受不是同一條尺</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">點位為任意例子；右側只示意不同面向，不提供分界或個人診斷。</text><text x="65" y="139" font-size="21" fill="#9ac8e8" text-anchor="start">時數</text><path d="M225 132H445" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="355" cy="132" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="65" y="214" font-size="21" fill="#b7e89f" text-anchor="start">時間</text><path d="M225 207H445" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="285" cy="207" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="65" y="289" font-size="21" fill="#ead68c" text-anchor="start">連續性</text><path d="M225 282H445" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="390" cy="282" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="65" y="364" font-size="21" fill="#c1b2ea" text-anchor="start">規律</text><path d="M225 357H445" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="310" cy="357" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><path d="M520 390H790M555 425V125" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="785" y="430" font-size="20" fill="#9ac8e8" text-anchor="end">睏倦 →</text><text x="575" y="130" font-size="20" fill="#ead68c" text-anchor="start">疲勞</text><ellipse cx="700" cy="210" rx="13" ry="13" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="610" y="290" font-size="18" fill="#e3e9e2" text-anchor="start">可能同時，也可能不同</text><text x="65" y="454" font-size="19" fill="#e3e9e2" text-anchor="start">各軸沒有共用單位，不能加成一個健康總分。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>