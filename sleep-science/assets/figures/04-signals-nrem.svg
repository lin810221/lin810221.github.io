<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-04-title sleep-04-desc"><title id="sleep-04-title">三種訊號與非REM階段</title><desc id="sleep-04-desc">左側三列原創波形分別示意腦電、眼動與肌電來源；右側N1、N2、N3表示不同睡眠狀態，圖未重製任何專業評分閾值或腦波紀錄。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 04 / 三種訊號與非REM階段</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">每列都是原創示意波形；不以單一振幅、圖形或裝置直接判睡眠階段。</text><text x="55" y="139" font-size="20" fill="#9ac8e8" text-anchor="start">EEG</text><path d="M130 160L130 160.0L143 172.77176688738498L156 176.85830177769196L169 169.4806231956541L182 155.65580126554386L195 144.7851809101141L208 144.26115040042856L221 154.44006814721442L234 168.39992696935633L247 176.64755230566539L260 173.57428091459934L273 161.27004093662208L286 148.10213031090979L299 143.02517212990722L312 149.49166909197044L325 163.10418528872927L338 174.60575085256042L351 176.17491350264092L364 166.74458974322044L377 152.7277176102275L390 143.65624263804753L403 145.69907359112804L416 157.46701656115863L429 170.95747365198977L442 176.99647930242537L455 171.47730610597762" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="244" font-size="20" fill="#ead68c" text-anchor="start">EOG</text><path d="M130 265L130 265.0L143 272.20085395656446L156 278.5285714319915L169 283.21588773747436L182 285.6944443297577L195 285.6637048843527L208 283.12739669962633L221 278.3930587448246L234 272.034751153274L247 264.8234478052899L260 257.633552218518L273 251.3368721216315L286 246.69690877931467L299 244.27627897143202L312 244.36849513488903L325 246.96237563804158L338 251.74340060468126L351 258.13184888773543L364 265.3530919101714L377 272.5315209233488L390 278.79671857309455L403 283.38900098545054L416 285.75153291141703L429 285.5978465480284L442 282.9465770698539L455 278.11920302883806" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="349" font-size="20" fill="#c1b2ea" text-anchor="start">EMG</text><path d="M130 370L130 370.0L143 376.3650819877798L156 364.7023825328445L169 368.0440915126075L182 376.92550772636366L195 366.1918522237744L208 366.24398957399694L221 376.9342514898641L234 367.9846767833445L247 364.74308927259824L260 376.3906167550934L273 369.9380408349672L286 363.66095146595364L299 375.3379091533572L312 371.89634051815506L325 363.08377863134996L338 373.85998676869184L351 373.7035788028402L364 363.0575480258982L377 372.0745800509657L390 375.2157921233554L403 363.58434916459055L416 370.1239134757379L429 376.31251843354164L442 364.62221737073435L455 368.1633760240725" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="545" y="125" width="250" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="670.0" y="164" font-size="21" fill="#9ac8e8" text-anchor="middle">N1：入睡過渡</text><rect x="545" y="235" width="250" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="670.0" y="274" font-size="21" fill="#b7e89f" text-anchor="middle">N2：多種特徵</text><rect x="545" y="345" width="250" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="670.0" y="384" font-size="21" fill="#c1b2ea" text-anchor="middle">N3：慢波較突出</text><text x="50" y="454" font-size="18" fill="#e3e9e2" text-anchor="start">時間與振幅均為任意示意；實際評分需完整訊號與規則。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>