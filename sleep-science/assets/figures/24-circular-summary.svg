<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-24-title sleep-24-desc"><title id="sleep-24-title">跨午夜的平均與週摘要</title><desc id="sleep-24-desc">左側二十四小時圓上23:50與00:10靠近，方向平均為00:00；右側兩夜加總效率用總睡眠除總窗口，與各夜百分比直接平均不同。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 24 / 跨午夜的平均與週摘要</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">左圖為鐘面方向；相對點平均方向可未定義，不能硬給一個時間。</text><ellipse cx="240" cy="270" rx="120" ry="120" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="240" y="125" font-size="20" fill="#9ac8e8" text-anchor="middle">00:00</text><text x="387" y="278" font-size="19" fill="#9ac8e8" text-anchor="start">06</text><text x="240" y="423" font-size="19" fill="#9ac8e8" text-anchor="middle">12</text><text x="72" y="278" font-size="19" fill="#9ac8e8" text-anchor="start">18</text><path d="M240 270L234.8 150.1M240 270L245.2 150.1" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="234.8" cy="150.1" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="245.2" cy="150.1" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="65" y="110" font-size="20" fill="#ead68c" text-anchor="start">23:50</text><text x="334" y="110" font-size="20" fill="#b7e89f" text-anchor="start">00:10</text><text x="240" y="280" font-size="21" fill="#b7e89f" text-anchor="middle">方向平均</text><text x="240" y="315" font-size="25" fill="#b7e89f" text-anchor="middle">00:00</text><rect x="460" y="125" width="340" height="290" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="480" y="169" font-size="23" fill="#c1b2ea" text-anchor="start">兩夜虛構資料</text><text x="480" y="222" font-size="21" fill="#e3e9e2" text-anchor="start">390／480；360／420</text><text x="480" y="278" font-size="23" fill="#b7e89f" text-anchor="start">合計：750／900</text><text x="480" y="328" font-size="25" fill="#b7e89f" text-anchor="start">約83.33%</text><text x="480" y="379" font-size="18" fill="#e3e9e2" text-anchor="start">有效夜數與缺失另列</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>