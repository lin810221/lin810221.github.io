<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-08-title sleep-08-desc"><title id="sleep-08-title">S與C共同影響睡醒狀態</title><desc id="sleep-08-desc">左側兩條任意曲線分開睡眠壓力S與晝夜訊號C；右側箭頭表示食慾素支持清醒，平頭線示意網絡抑制，協助理解狀態穩定，不是一個可自行調節的睡眠旋鈕。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08 / S與C共同影響睡醒狀態</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">箭頭表示支持清醒，平頭線表示抑制；非全部路徑，也不是單一腦區控制。</text><path d="M55 365H420M55 365V130" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 325Q220 155 410 150" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 260Q150 135 240 260T410 260" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="113" font-size="18" fill="#e3e9e2" text-anchor="start">兩過程任意尺度；非機率</text><text x="360" y="143" font-size="23" fill="#b7e89f" text-anchor="start">S</text><text x="360" y="300" font-size="23" fill="#c1b2ea" text-anchor="start">C</text><rect x="500" y="125" width="290" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="645.0" y="164" font-size="21" fill="#9ac8e8" text-anchor="middle">清醒相關網絡</text><rect x="500" y="355" width="290" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="645.0" y="394" font-size="21" fill="#c1b2ea" text-anchor="middle">睡眠相關網絡</text><path d="M515 205V345" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M503 345H527" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M780 345V205" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M768 205H792" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="245" width="250" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="645.0" y="284" font-size="21" fill="#ead68c" text-anchor="middle">食慾素：支持清醒穩定</text><path d="M650 237L650 200" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M645.7 209.0L650 200L654.3 209.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="670" y="229" font-size="17" fill="#ead68c" text-anchor="start">支持清醒</text><text x="65" y="430" font-size="19" fill="#e3e9e2" text-anchor="start">模型幫助解釋相互作用，不直接給某人入睡時刻。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>