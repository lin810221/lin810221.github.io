<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-26-title sleep-26-desc"><title id="sleep-26-title">從感測到推論，再看錯分</title><desc id="sleep-26-desc">左側光學脈波與動作特徵經演算法估睡眠；右側虛構200個三十秒區段，以睡眠為陽性，90真睡判睡、10睡判醒、40醒判睡、60真醒判醒。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 26 / 從感測到推論，再看錯分</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">右表是100分鐘的虛構片段；不是整夜資料，也不是任何品牌性能。</text><path d="M50 165Q78.125 147 106.25 165Q134.375 183 162.5 165Q190.625 147 218.75 165Q246.875 183 275.0 165" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="125" font-size="22" fill="#9ac8e8" text-anchor="start">PPG／動作訊號</text><path d="M160 205L160 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M164.3 226.0L160 235L155.7 226.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="250" width="225" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="162.5" y="288" font-size="21" fill="#c1b2ea" text-anchor="middle">特徵＋演算法</text><path d="M160 322L160 350" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M164.3 341.0L160 350L155.7 341.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="396" font-size="24" fill="#b7e89f" text-anchor="start">估計睡／醒</text><rect x="345" y="115" width="460" height="260" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M345 180H805M345 245H805M345 310H805M500 115V375M650 115V375" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="154" font-size="18" fill="#9ac8e8" text-anchor="start">裝置／參考</text><text x="520" y="154" font-size="19" fill="#b7e89f" text-anchor="start">睡100</text><text x="670" y="154" font-size="19" fill="#ead68c" text-anchor="start">醒100</text><text x="365" y="220" font-size="21" fill="#e3e9e2" text-anchor="start">判睡</text><text x="520" y="220" font-size="25" fill="#b7e89f" text-anchor="start">90</text><text x="670" y="220" font-size="25" fill="#eda894" text-anchor="start">40</text><text x="365" y="285" font-size="21" fill="#e3e9e2" text-anchor="start">判醒</text><text x="520" y="285" font-size="25" fill="#c1b2ea" text-anchor="start">10</text><text x="670" y="285" font-size="25" fill="#9ac8e8" text-anchor="start">60</text><text x="365" y="350" font-size="20" fill="#e3e9e2" text-anchor="start">共200區段；每段30秒</text><text x="350" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">睡眠敏感度90%；清醒特異度60%；準確度75%。</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>