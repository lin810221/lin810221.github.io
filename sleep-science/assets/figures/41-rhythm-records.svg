<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-41-title sleep-41-desc"><title id="sleep-41-title">完整節律需要連續資料與多種線索</title><desc id="sleep-41-desc">左側不規則長短區塊表示分散的睡眠片段；右側日誌、活動與相位資訊各提供不同觀察，不把動作安靜直接當睡眠。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 41 / 完整節律需要連續資料與多種線索</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="120" width="350" height="300" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="158" font-size="22" fill="#9ac8e8" text-anchor="start">連續多日的分布</text><rect x="85" y="190" width="80" height="26" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="220" y="190" width="120" height="26" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="135" y="250" width="100" height="26" rx="3" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="270" y="250" width="65" height="26" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="85" y="310" width="45" height="26" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="175" y="310" width="150" height="26" rx="3" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="80" y="388" font-size="18" fill="#e3e9e2" text-anchor="start">零散分布還要看機會與疾病</text><rect x="445" y="120" width="360" height="300" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><rect x="487.5" y="148" width="275" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="625" y="187" font-size="21" fill="#9ac8e8" text-anchor="middle">日誌：經驗與時間</text><rect x="487.5" y="230" width="275" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="625" y="269" font-size="21" fill="#ead68c" text-anchor="middle">活動：動作代理訊號</text><rect x="487.5" y="312" width="275" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="625" y="351" font-size="21" fill="#c1b2ea" text-anchor="middle">相位：受控條件指標</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>