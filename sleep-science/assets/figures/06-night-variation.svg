<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-06-title sleep-06-desc"><title id="sleep-06-title">週期、覺醒與不同夜晚</title><desc id="sleep-06-desc">兩列不同長度的睡眠階段區塊展示夜間轉換與短覺醒，區塊顏色是階段類別；不同夜晚可能改變，比例未設定最佳值。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 06 / 週期、覺醒與不同夜晚</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">各夜皆為虛構區塊；顏色只作辨識，不依紅綠或比例評正常異常。</text><text x="65" y="125" font-size="22" fill="#e3e9e2" text-anchor="start">同一虛構人的兩夜；橫向為各夜時間</text><rect x="70" y="180" width="40" height="70" rx="2" stroke="#eda894" fill="#eda894" stroke-width="2"/><rect x="110" y="180" width="100" height="70" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="210" y="180" width="70" height="70" rx="2" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="280" y="180" width="30" height="70" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="310" y="180" width="120" height="70" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="430" y="180" width="30" height="70" rx="2" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="460" y="180" width="100" height="70" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="560" y="180" width="50" height="70" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="70" y="315" width="35" height="70" rx="2" stroke="#eda894" fill="#eda894" stroke-width="2"/><rect x="105" y="315" width="130" height="70" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="235" y="315" width="50" height="70" rx="2" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="285" y="315" width="50" height="70" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="335" y="315" width="80" height="70" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="415" y="315" width="35" height="70" rx="2" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="450" y="315" width="90" height="70" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="540" y="315" width="70" height="70" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="70" y="163" font-size="19" fill="#e3e9e2" text-anchor="start">夜A</text><text x="70" y="298" font-size="19" fill="#e3e9e2" text-anchor="start">夜B</text><rect x="75" y="420" width="18" height="18" rx="2" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="103" y="436" font-size="18" fill="#9ac8e8" text-anchor="start">清醒</text><rect x="215" y="420" width="18" height="18" rx="2" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="243" y="436" font-size="18" fill="#eda894" text-anchor="start">N1</text><rect x="355" y="420" width="18" height="18" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="383" y="436" font-size="18" fill="#b7e89f" text-anchor="start">N2</text><rect x="495" y="420" width="18" height="18" rx="2" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="523" y="436" font-size="18" fill="#c1b2ea" text-anchor="start">N3</text><rect x="635" y="420" width="18" height="18" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="663" y="436" font-size="18" fill="#ead68c" text-anchor="start">REM</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>