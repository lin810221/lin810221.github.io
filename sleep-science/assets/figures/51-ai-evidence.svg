<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-51-title sleep-51-desc"><title id="sleep-51-title">AI預測、驗證與實際使用不同層</title><desc id="sleep-51-desc">左側模型關聯曲線為任意示意，右側外部驗證與實際使用後的結果分開；睡眠年齡不是個人的壽命倒數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 51 / AI預測、驗證與實際使用不同層</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><path d="M75 350V135M75 350H350M75 350L350 135" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 350Q190 330 350 135" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="390" font-size="19" fill="#9ac8e8" text-anchor="start">預測與觀察；任意示例</text><rect x="445.0" y="148" width="330" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="610" y="187" font-size="21" fill="#c1b2ea" text-anchor="middle">新資料與外部驗證</text><path d="M610 225L610 263" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M614.3 254.0L610 263L605.7 254.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="445.0" y="278" width="330" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="610" y="317" font-size="21" fill="#ead68c" text-anchor="middle">使用後的功能與效益傷害</text><text x="450" y="405" font-size="18" fill="#e3e9e2" text-anchor="start">模型分數不是診斷或因果效果</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>