<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-30-title sleep-30-desc"><title id="sleep-30-title">睡眠努力的循環與可以觀察的條件</title><desc id="sleep-30-desc">左側擔心、監看、喚起與更難入睡可能互相維持，右側原創六日觀察保留共同變化與缺漏；不是靠單次改善證明方法有效。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 30 / 睡眠努力的循環與可以觀察的條件</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">迴圈是可能機制，不把失眠歸咎意志；散點無臨床刻度或因果保證。</text><ellipse cx="220" cy="257" rx="130" ry="95" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="220" y="250" font-size="23" fill="#c1b2ea" text-anchor="middle">擔心、監看</text><text x="220" y="285" font-size="23" fill="#c1b2ea" text-anchor="middle">與睡眠努力</text><path d="M130 160L305 160" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.0 155.7L305 160L296.0 164.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M335 200L335 320" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.3 311.0L335 320L330.7 311.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M305 355L130 355" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M139.0 359.3L130 355L139.0 350.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 320L100 200" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95.7 209.0L100 200L104.3 209.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="425" font-size="18" fill="#e3e9e2" text-anchor="start">喚起、環境與身體都可能參與</text><path d="M425 115V455" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="130" font-size="22" fill="#9ac8e8" text-anchor="start">六日原創觀察</text><path d="M475 370H795" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="490" cy="240" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="547" cy="280" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="604" cy="215" rx="7" ry="7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="661" cy="330" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="718" cy="255" rx="7" ry="7" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="775" cy="235" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="655" y="303" font-size="28" fill="#c1b2ea" text-anchor="start">？</text><text x="475" y="421" font-size="18" fill="#e3e9e2" text-anchor="start">條件、時間、未知與共同事件</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>