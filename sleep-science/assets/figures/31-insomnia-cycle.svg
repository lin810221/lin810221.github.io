<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-31-title sleep-31-desc"><title id="sleep-31-title">失眠：機會、困擾與維持條件</title><desc id="sleep-31-desc">圖中先區分睡眠機會不足和有機會卻持續困難，右側誘發因素、行為與喚起可維持循環；原因不只心理，也可能與其他問題共存。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 31 / 失眠：機會、困擾與維持條件</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">流程是問題整理，不依日誌百分比自動診斷，也不排除身體與其他睡眠問題。</text><rect x="50" y="125" width="320" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="210.0" y="163" font-size="21" fill="#9ac8e8" text-anchor="middle">實際睡眠機會是否足夠</text><path d="M130 200L115 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M121.3 257.2L115 265L112.8 255.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 200L310 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M310.8 255.0L310 265L302.7 258.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="280" width="180" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="120.0" y="318" font-size="21" fill="#ead68c" text-anchor="middle">機會不足</text><rect x="235" y="280" width="180" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="325.0" y="318" font-size="21" fill="#c1b2ea" text-anchor="middle">有機會仍困難</text><text x="65" y="414" font-size="18" fill="#e3e9e2" text-anchor="start">要同時問時間、困擾與白天功能</text><path d="M445 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="650" cy="270" rx="105" ry="95" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="650" y="255" font-size="23" fill="#b7e89f" text-anchor="middle">誘發因素</text><text x="650" y="290" font-size="23" fill="#b7e89f" text-anchor="middle">維持條件</text><path d="M555 160L730 160" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M721.0 155.7L730 160L721.0 164.3" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M760 185L760 350" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M764.3 341.0L760 350L755.7 341.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M730 380L555 380" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M564.0 384.3L555 380L564.0 375.7" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M525 350L525 185" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.7 194.0L525 185L529.3 194.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>