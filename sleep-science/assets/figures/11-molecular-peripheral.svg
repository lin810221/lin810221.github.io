<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-11-title sleep-11-desc"><title id="sleep-11-title">分子負回饋與不同器官的時鐘</title><desc id="sleep-11-desc">左側哺乳類CLOCK/BMAL1促進Per/Cry表達，延遲形成的PER/CRY參與抑制；右側不同組織可有不同相位，受中樞及其他訊號協調。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11 / 分子負回饋與不同器官的時鐘</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">右側是任意相位示意，無濃度刻度；果蠅PER/TIM不直接當作人類全部機制。</text><rect x="50" y="120" width="370" height="300" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="70" y="151" font-size="20" fill="#9ac8e8" text-anchor="start">哺乳類核心迴路（簡化）</text><rect x="75" y="175" width="320" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="235.0" y="214" font-size="21" fill="#b7e89f" text-anchor="middle">CLOCK／BMAL1</text><path d="M240 245L240 275" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M244.3 266.0L240 275L235.7 266.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="75" y="285" width="320" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="235.0" y="324" font-size="21" fill="#c1b2ea" text-anchor="middle">Per／Cry → PER／CRY</text><path d="M80 320H60V205H72" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 192V218" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="397" font-size="18" fill="#e3e9e2" text-anchor="start">延遲、降解與其他迴路也重要</text><text x="470" y="141" font-size="19" fill="#b7e89f" text-anchor="start">SCN等中樞協調</text><path d="M470 170L470 170.0L482 175.31936371990412L494 180.16356452111063L506 184.09988437329469L518 186.77670354741008L530 187.954909758873L542 187.52925735580752L554 185.53776859967974L566 182.15833724992072L578 177.69283784420895L590 172.5401601450776L602 167.16057750542154L614 162.03463202069267L626 157.62020913468848L638 154.31163609655542L650 152.40445788202825L662 152.06903704095487L674 153.33533571810082L686 156.09023922399223L698 160.08766023324253L710 164.97052103241933L722 170.3026502087183L734 175.6077445432408L746 180.4119157589876L758 184.28602154928475L770 186.8839995819453" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="237" font-size="19" fill="#9ac8e8" text-anchor="start">肝等周邊組織</text><path d="M470 266L470 278.9124096361914L482 282.04173248110584L494 283.7380951397923L506 283.8499665881444L518 282.36735368286224L530 279.42269381918095L542 275.2790246927864L554 270.3064879258517L566 264.9492654183036L578 259.6859019015868L590 254.98655796303106L602 251.2710120008406L614 248.8711626699887L626 248.00138136384618L638 248.7393630560635L650 251.01918603996978L662 254.63720051829822L674 259.27022003305575L686 264.50439074928505L698 269.87215978558066L710 274.8940403204949L722 279.1214427222658L734 282.1767457246093L746 283.787028209786L758 283.80844843922085L770 282.2390930076133" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="333" font-size="19" fill="#ead68c" text-anchor="start">其他組織</text><path d="M470 362L470 379.9923248547471L482 379.03340157837346L494 376.5529352687526L506 372.7724985938712L518 368.0297867028063L530 362.7484519237992L542 357.40026016351703L554 352.46294946364713L566 348.3775550844573L578 345.50901313850983L590 344.11356193459767L602 344.315852972762L614 346.0978161970372L626 349.30027413973295L638 353.6371607705524L650 358.72107492310226L662 364.09788568730886L674 369.28729857109875L686 373.8257587769382L698 377.3078591713142L710 379.4225540965667L722 379.9809441531159L734 378.9331500202359L746 376.37276802722283L758 372.5285094720517L770 367.74377052228834" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>