<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-48-title sleep-48-desc"><title id="sleep-48-title">旅行安排要連同停留與來回需求</title><desc id="sleep-48-desc">出發、飛行、到達、停留與返回是連續流程；光、暗、睡眠及工作需求在不同階段改變，不能只看一張抵達時鐘。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 48 / 旅行安排要連同停留與來回需求</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="40.0" y="173" width="140" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="110" y="212" font-size="21" fill="#9ac8e8" text-anchor="middle">出發</text><path d="M184 205L194 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M185.0 200.7L194 205L185.0 209.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="200.0" y="173" width="140" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="270" y="212" font-size="21" fill="#ead68c" text-anchor="middle">途中</text><path d="M344 205L354 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M345.0 200.7L354 205L345.0 209.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="360.0" y="173" width="140" height="64" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430" y="212" font-size="21" fill="#b7e89f" text-anchor="middle">到達</text><path d="M504 205L514 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M505.0 200.7L514 205L505.0 209.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520.0" y="173" width="140" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="590" y="212" font-size="21" fill="#c1b2ea" text-anchor="middle">停留</text><path d="M664 205L674 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M665.0 200.7L674 205L665.0 209.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="680.0" y="173" width="140" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="750" y="212" font-size="21" fill="#9ac8e8" text-anchor="middle">返回</text><text x="90" y="320" font-size="20" fill="#e3e9e2" text-anchor="start">時差方向、停留長短、原本作息與轉機不同。</text><text x="90" y="368" font-size="20" fill="#e3e9e2" text-anchor="start">可用睡眠機會、光暗時機及安全任務要分開。</text><text x="90" y="416" font-size="20" fill="#e3e9e2" text-anchor="start">短住、頻繁往返與跨區工作，不一定追求完全轉時。</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>