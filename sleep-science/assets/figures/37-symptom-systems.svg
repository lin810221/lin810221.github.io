<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-37-title sleep-37-desc"><title id="sleep-37-title">腿部感覺與清醒穩定是不同問題</title><desc id="sleep-37-desc">左側腿部的不適與想活動需要症狀時間脈絡；右側食慾素參與穩定清醒網絡，不把所有想睡或踢腿歸成同一疾病。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 37 / 腿部感覺與清醒穩定是不同問題</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="115" width="350" height="310" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="150" font-size="20" fill="#9ac8e8" text-anchor="start">感覺、休息與活動的關係</text><path d="M190 185V275L155 355M190 275L245 355" stroke="#9ac8e8" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 280q-25 15 0 30m135-30q25 15 0 30" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="395" font-size="19" fill="#e3e9e2" text-anchor="start">先描述出現條件與緩解情況</text><rect x="445" y="115" width="360" height="310" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="500.0" y="153" width="250" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="625" y="192" font-size="21" fill="#c1b2ea" text-anchor="middle">食慾素相關訊號</text><path d="M625 225L625 264" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M629.3 255.0L625 264L620.7 255.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="500.0" y="278" width="250" height="64" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="625" y="317" font-size="21" fill="#b7e89f" text-anchor="middle">清醒與狀態穩定</text><text x="470" y="395" font-size="19" fill="#e3e9e2" text-anchor="start">部分猝睡症與此系統相關</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>