<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-12-title sleep-12-desc"><title id="sleep-12-title">相位標記與晨晚型的時間關係</title><desc id="sleep-12-desc">上側示意昏暗條件下褪黑激素上升與體溫節律標記；下側兩個人可有不同睡眠時間與社會要求，鐘面時間不直接等於內在相位。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12 / 相位標記與晨晚型的時間關係</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">相位標記需要指定量測條件；本圖無診斷閾值或個人褪黑激素用法。</text><path d="M70 260H790" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 235Q260 240 350 170T650 150" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 175Q390 320 760 175" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 125V260" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="360" y="131" font-size="19" fill="#b7e89f" text-anchor="start">DLMO：條件下的起始標記</text><text x="490" y="280" font-size="18" fill="#c1b2ea" text-anchor="start">體溫節律另有相位</text><path d="M70 400H790" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="330" width="280" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><rect x="310" y="405" width="280" height="55" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="150" y="323" font-size="18" fill="#b7e89f" text-anchor="start">虛構較早型</text><text x="595" y="448" font-size="18" fill="#c1b2ea" text-anchor="start">較晚型</text><text x="70" y="303" font-size="18" fill="#e3e9e2" text-anchor="start">時間先後示意，不給固定「正常」鐘點</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>