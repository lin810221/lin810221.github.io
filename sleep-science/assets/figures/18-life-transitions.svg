<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-18-title sleep-18-desc"><title id="sleep-18-title">高齡、孕產與更年期的多個條件</title><desc id="sleep-18-desc">人物周圍的疼痛、呼吸、照護、激素及環境資訊一起影響睡眠；生命階段會改變經驗與節律，但困擾不是理所當然或只能忍受。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18 / 高齡、孕產與更年期的多個條件</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">箭頭為可能互動，無個人病因排序；具體新症狀、功能與需要需另外了解。</text><ellipse cx="430" cy="205" rx="18.0" ry="21.6" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M430 228.4V308.5M430 248.2L394.0 279.7M430 248.2L466.0 279.7M430 308.5L403.0 362.5M430 308.5L457.0 362.5" stroke="#b7e89f" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="130" width="255" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="182.5" y="169" font-size="21" fill="#9ac8e8" text-anchor="middle">疼痛、呼吸與其他狀況</text><rect x="550" y="130" width="255" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="677.5" y="169" font-size="21" fill="#ead68c" text-anchor="middle">照護、工作與環境</text><rect x="55" y="355" width="255" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="182.5" y="394" font-size="21" fill="#c1b2ea" text-anchor="middle">激素與身體變化</text><rect x="550" y="355" width="255" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="677.5" y="394" font-size="21" fill="#b7e89f" text-anchor="middle">規律、光訊號與支持</text><path d="M320 180L365 240" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M363.1 230.2L365 240L356.1 235.4" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 180L495 240" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M503.9 235.4L495 240L496.9 230.2" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 370L365 320" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.7 323.8L365 320L362.2 329.6" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 370L495 320" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.8 329.6L495 320L504.3 323.8" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="455" font-size="19" fill="#e3e9e2" text-anchor="start">高齡不是不再需要睡眠；孕產與更年期也不只一個原因。</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>