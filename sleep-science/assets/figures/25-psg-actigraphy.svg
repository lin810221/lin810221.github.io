<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-25-title sleep-25-desc"><title id="sleep-25-title">多訊號檢查與活動估計的差別</title><desc id="sleep-25-desc">左側人形連到腦波、眼動、下頷肌電及呼吸等感測；右側安靜不動可對應睡眠或安靜清醒，活動紀錄不能直接替代腦波分期。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 25 / 多訊號檢查與活動估計的差別</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">構造位置簡化；不呈現可供臨床評分的原始訊號或電極安裝指令。</text><ellipse cx="190" cy="163" rx="45" ry="55" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M190 220V343M190 256L115 325M190 256L265 325M190 343L147 430M190 343L233 430" stroke="#9ac8e8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M164 139L80 115M219 163L325 145M203 207L330 215M201 280L328 293" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="105" font-size="19" fill="#b7e89f" text-anchor="start">EEG</text><text x="330" y="150" font-size="19" fill="#b7e89f" text-anchor="start">EOG</text><text x="335" y="221" font-size="19" fill="#b7e89f" text-anchor="start">EMG</text><text x="334" y="299" font-size="19" fill="#b7e89f" text-anchor="start">呼吸等</text><path d="M435 110V450" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="125" width="270" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="640.0" y="163" font-size="21" fill="#ead68c" text-anchor="middle">活動少／不動</text><path d="M575 200L530 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M538.7 260.1L530 265L531.5 255.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M705 200L750 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M748.5 255.1L750 265L741.3 260.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="465" y="280" width="140" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="535.0" y="318" font-size="21" fill="#b7e89f" text-anchor="middle">睡眠</text><rect x="650" y="280" width="170" height="62" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="735.0" y="318" font-size="21" fill="#c1b2ea" text-anchor="middle">安靜清醒</text><text x="485" y="408" font-size="19" fill="#e3e9e2" text-anchor="start">需算法、日誌及用途驗證</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>