<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-23-title sleep-23-desc"><title id="sleep-23-title">一個分母，四種時間成分</title><desc id="sleep-23-desc">上半部將480分鐘床上窗口拆成入睡前30、睡眠390、夜中醒40與最後清醒20；下半部用問號表示尚未取得時間，不把未知改成0。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 23 / 一個分母，四種時間成分</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">分段為虛構日誌估計；WASO不含最後醒到離床，以免重複扣除。</text><text x="65" y="125" font-size="20" fill="#e3e9e2" text-anchor="start">TIB 480 = SOL 30 + TST 390 + WASO 40 + 最後清醒20</text><rect x="65" y="160" width="43.125" height="65" rx="0" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="108.125" y="160" width="560.625" height="65" rx="0" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="668.75" y="160" width="57.5" height="65" rx="0" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><rect x="726.25" y="160" width="28.75" height="65" rx="0" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="70" y="270" font-size="24" fill="#b7e89f" text-anchor="start">睡眠效率 = 390 / 480 = 81.25%</text><rect x="65" y="325" width="300" height="92" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="85" y="361" font-size="21" fill="#9ac8e8" text-anchor="start">明確觀察：醒0分鐘</text><text x="85" y="393" font-size="18" fill="#e3e9e2" text-anchor="start">零是已觀察值</text><rect x="440" y="325" width="315" height="92" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="460" y="361" font-size="23" fill="#c1b2ea" text-anchor="start">記不清楚：？</text><text x="460" y="393" font-size="18" fill="#e3e9e2" text-anchor="start">未知時先保留缺失</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>