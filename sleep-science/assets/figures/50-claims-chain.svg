<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-50-title sleep-50-desc"><title id="sleep-50-title">機制、產品與臨床效果不能直接跳接</title><desc id="sleep-50-desc">左側原理與右側產品宣稱之間，仍需產品品質、具體族群、對照與重要結果；圖沒有建議任何口呼吸貼或服用方式。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 50 / 機制、產品與臨床效果不能直接跳接</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="50.0" y="153" width="220" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="160" y="192" font-size="21" fill="#9ac8e8" text-anchor="middle">生理機制</text><path d="M285 185L315 185" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M306.0 180.7L315 185L306.0 189.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="330.0" y="153" width="230" height="64" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="445" y="192" font-size="21" fill="#b7e89f" text-anchor="middle">特定研究與產品</text><path d="M575 185L605 185" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M596.0 180.7L605 185L596.0 189.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="640.0" y="153" width="190" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="735" y="192" font-size="21" fill="#ead68c" text-anchor="middle">健康宣稱</text><text x="85" y="300" font-size="20" fill="#e3e9e2" text-anchor="start">材料、含量與使用方式：是否與研究相同？</text><text x="85" y="348" font-size="20" fill="#e3e9e2" text-anchor="start">族群、對照、追蹤、效益與傷害：是否完整？</text><text x="85" y="396" font-size="20" fill="#e3e9e2" text-anchor="start">有機制不代表所有人都適合，也不保證長期安全。</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>