<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-38-title sleep-38-desc"><title id="sleep-38-title">白天嗜睡與夜間行為各有時間線</title><desc id="sleep-38-desc">左側標準化評估需先核對前夜、作息及條件；右側非REM異睡症是不同狀態特徵混合的概念，不由一段行為或一個入睡值確診。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 38 / 白天嗜睡與夜間行為各有時間線</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="55" y="115" width="350" height="310" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="151" font-size="22" fill="#9ac8e8" text-anchor="start">白天檢查之前</text><rect x="100.0" y="183" width="260" height="64" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="230" y="222" font-size="21" fill="#b7e89f" text-anchor="middle">前夜、用藥與規律</text><path d="M230 255L230 277" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.3 268.0L230 277L225.7 268.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="100.0" y="288" width="260" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="230" y="327" font-size="21" fill="#ead68c" text-anchor="middle">標準化睡眠機會</text><text x="80" y="400" font-size="19" fill="#e3e9e2" text-anchor="start">MSLT不等同手機自測</text><rect x="445" y="115" width="360" height="310" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="470" y="151" font-size="22" fill="#c1b2ea" text-anchor="start">夜間狀態與行為</text><ellipse cx="570" cy="265" rx="85" ry="70" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="680" cy="265" rx="85" ry="70" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="540" y="272" font-size="23" fill="#9ac8e8" text-anchor="start">睡眠</text><text x="665" y="272" font-size="23" fill="#ead68c" text-anchor="start">動作</text><text x="470" y="400" font-size="19" fill="#e3e9e2" text-anchor="start">記錄時點、反應與旁人觀察</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>