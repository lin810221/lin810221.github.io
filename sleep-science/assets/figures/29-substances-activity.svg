<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-29-title sleep-29-desc"><title id="sleep-29-title">物質效應與時間條件分開看</title><desc id="sleep-29-desc">上方酒精的短期鎮靜不等於整夜結構與呼吸改善；下方活動、進食與體溫只是可能相互影響的條件，沒有人人共用的禁做時間線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 29 / 物質效應與時間條件分開看</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">時間和波形為概念；不預測個人睡眠，不用固定小時規則概括所有人。</text><text x="65" y="125" font-size="23" fill="#ead68c" text-anchor="start">酒精：主觀想睡 ≠ 持續且恢復的睡眠</text><path d="M80 230H780" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 195Q126.25 177 157.5 195Q188.75 213 220.0 195Q251.25 177 282.5 195Q313.75 213 345.0 195" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 175V245" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M550 175V245" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 175V245" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M720 175V245" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="283" font-size="20" fill="#b7e89f" text-anchor="start">前段鎮靜可能存在</text><text x="475" y="283" font-size="19" fill="#eda894" text-anchor="start">後續可能覺醒／呼吸問題</text><path d="M60 325H800" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="180" cy="390" rx="80" ry="45" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="180" y="397" font-size="23" fill="#9ac8e8" text-anchor="middle">活動</text><ellipse cx="430" cy="390" rx="80" ry="45" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="430" y="397" font-size="23" fill="#ead68c" text-anchor="middle">進食</text><ellipse cx="680" cy="390" rx="90" ry="45" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="680" y="397" font-size="21" fill="#c1b2ea" text-anchor="middle">體溫與節律</text><path d="M275 390L335 390" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M326.0 385.7L335 390L326.0 394.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M525 390L575 390" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M566.0 385.7L575 390L566.0 394.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>