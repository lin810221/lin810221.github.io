<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-46-title sleep-46-desc"><title id="sleep-46-title">同一瞬間的時鐘標籤可以不同</title><desc id="sleep-46-desc">出發地UTC加八先換成UTC，再加十二小時經過時間，最後換到UTC減五；例中當地日期沒有前進，實際已過十二小時。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 46 / 同一瞬間的時鐘標籤可以不同</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><rect x="37.5" y="163" width="235" height="64" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="155" y="202" font-size="21" fill="#9ac8e8" text-anchor="middle">出發 11/10 22:00</text><rect x="312.5" y="163" width="235" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="430" y="202" font-size="21" fill="#ead68c" text-anchor="middle">UTC 11/10 14:00</text><rect x="587.5" y="163" width="235" height="64" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="705" y="202" font-size="21" fill="#c1b2ea" text-anchor="middle">到達UTC 11/11 02:00</text><path d="M285 195L300 195" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M291.0 190.7L300 195L291.0 199.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 195L575 195" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M566.0 190.7L575 195L566.0 199.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="285" font-size="20" fill="#9ac8e8" text-anchor="start">先減8小時</text><text x="405" y="285" font-size="20" fill="#ead68c" text-anchor="start">經過12小時</text><rect x="387.5" y="343" width="365" height="64" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="570" y="382" font-size="21" fill="#b7e89f" text-anchor="middle">到達地 11/10 21:00（UTC-5）</text><path d="M705 240L650 330" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M658.4 324.6L650 330L651.0 320.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">固定偏移教學例；未查航班、夏令時間或個人節律。</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>