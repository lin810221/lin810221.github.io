<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-13-title sleep-13-desc"><title id="sleep-13-title">光訊息的多個維度與相位反應</title><desc id="sleep-13-desc">左側光的時間、強度、光譜及持續共同影響眼部輸入；右側原創相位反應曲線分開延遲與提前方向，橫軸是生物相位而非每人相同的鐘點。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 13 / 光訊息的多個維度與相位反應</text><text x="30" y="76" font-size="15" fill="#adbdaf" text-anchor="start">曲線只教反應方向；未校準個人，也不能照圖選光療時間或劑量。</text><text x="60" y="145" font-size="20" fill="#b7e89f" text-anchor="start">時間／生物相位</text><path d="M260 139L345 245" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M342.8 235.3L345 245L336.0 240.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="210" font-size="20" fill="#9ac8e8" text-anchor="start">強度與眼部位置</text><path d="M260 204L345 245" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M338.8 237.2L345 245L335.0 245.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="275" font-size="20" fill="#ead68c" text-anchor="start">光譜與持續時間</text><path d="M260 269L345 245" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M335.2 243.3L345 245L337.5 251.6" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="340" font-size="20" fill="#c1b2ea" text-anchor="start">先前光照史</text><path d="M260 334L345 245" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M335.6 248.5L345 245L341.9 254.5" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="375" cy="245" rx="24" ry="40" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M470 265H805M470 135V400" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 267Q540 390 610 300Q680 130 795 230" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="126" font-size="20" fill="#b7e89f" text-anchor="start">提前 ↑</text><text x="490" y="420" font-size="20" fill="#ead68c" text-anchor="start">延遲 ↓</text><text x="520" y="451" font-size="18" fill="#e3e9e2" text-anchor="start">生物相位 →；無鐘點刻度</text><text x="30" y="492" font-size="14" fill="#adbdaf" text-anchor="start">原創概念圖，非比例；數字與案例為虛構。先看圖例、時間、條件，再回課文。</text></g></svg>