<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-21-title sleep-21-desc"><title id="sleep-21-title">身體恢復與腦部清除要分層判讀</title><desc id="sleep-21-desc">左側睡眠、免疫與疼痛可形成雙向關係；右側動物示蹤、人體流體影像與健康終點是不同證據層，不由一層直接推到另一層。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 21 / 身體恢復與腦部清除要分層判讀</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">右側箭頭表示需要補證據的步驟，不是已完成的排毒或失智預防證明。</text><ellipse cx="200" cy="195" rx="115" ry="54" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="200" y="203" font-size="23" fill="#9ac8e8" text-anchor="middle">睡眠與恢復</text><ellipse cx="200" cy="360" rx="115" ry="54" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="200" y="368" font-size="23" fill="#c1b2ea" text-anchor="middle">免疫與疼痛</text><path d="M155 255L155 298" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.3 289.0L155 298L150.7 289.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 298L245 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240.7 264.0L245 255L249.3 264.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="455" y="115" width="330" height="62" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="620.0" y="153" font-size="21" fill="#ead68c" text-anchor="middle">動物：示蹤與操作</text><path d="M620 189L620 217" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M624.3 208.0L620 217L615.7 208.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="455" y="230" width="330" height="62" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="620.0" y="268" font-size="21" fill="#9ac8e8" text-anchor="middle">人體：訊號與流體</text><path d="M620 304L620 332" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M624.3 323.0L620 332L615.7 323.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="455" y="345" width="330" height="62" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="620.0" y="383" font-size="21" fill="#b7e89f" text-anchor="middle">臨床：重要健康結果</text><text x="74" y="452" font-size="18" fill="#e3e9e2" text-anchor="start">機制可提出問題，仍需量測與比較。</text><text x="32" y="490" font-size="15" fill="#afbdaf" text-anchor="start">原創教學示意；數值情境為虛構。先讀定義、分母與時間，再回課文核對條件。</text></g></svg>