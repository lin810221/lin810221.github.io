<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="sleep-43-title sleep-43-desc"><title id="sleep-43-title">夜班：工作、睡眠機會與時鐘可能衝突</title><desc id="sleep-43-desc">24小時概念帶把工作與白天睡眠機會放在不同位置；時鐘訊號不是跟著排班立即翻轉，照護需考慮成人SWD的具體問題。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 43 / 夜班：工作、睡眠機會與時鐘可能衝突</text><text x="32" y="78" font-size="15" fill="#adbcaf" text-anchor="start">原創概念示意；非比例、非個人診斷，顏色協助辨認而非風險分級。</text><text x="70" y="125" font-size="21" fill="#9ac8e8" text-anchor="start">共同一天，區塊不是安全認證</text><text x="65" y="210" font-size="20" fill="#ead68c" text-anchor="start">外在夜班</text><path d="M250 200H790" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="510" y="182" width="230" height="38" rx="4" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="65" y="295" font-size="20" fill="#b7e89f" text-anchor="start">白天可睡</text><path d="M250 285H790" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="267" width="165" height="38" rx="4" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="65" y="380" font-size="20" fill="#c1b2ea" text-anchor="start">內在節律</text><path d="M250 370H790" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="352" width="180" height="38" rx="4" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="70" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">換班可以很快；睡眠機會與生理適應不能直接畫上等號。</text><text x="32" y="492" font-size="15" fill="#adbcaf" text-anchor="start">先認訊號、時間與分母，再說明機制、證據與仍未知的條件。</text></g></svg>