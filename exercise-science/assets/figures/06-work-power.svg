<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex06-title ex06-desc"><title id="ex06-title">位移、外功與時間</title><desc id="ex06-desc">兩個箱子位置示意外力沿位移作功，完成相同外功所需時間影響平均外功率；不估人體代謝效率。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 06  /  位移、外功與時間</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="135" y="236" width="92" height="77" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M239 272L407 272" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M398.0 267.7L407 272L398.0 276.3" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 335H745" stroke="#788c7d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="550" y="236" width="92" height="77" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M190 367L596 367" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M587.0 362.7L596 367L587.0 371.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="316" y="405" font-size="21" fill="#b7e89f" text-anchor="start">沿指定方向的位移</text><text x="260" y="235" font-size="21" fill="#eda894" text-anchor="start">指定外力</text><text x="94" y="154" font-size="21" fill="#e3e9e2" text-anchor="start">同一外功，可在不同時間完成 → 平均外功率不同</text><text x="94" y="447" font-size="18" fill="#e3e9e2" text-anchor="start">外部機械功，不等於全部代謝耗能。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>