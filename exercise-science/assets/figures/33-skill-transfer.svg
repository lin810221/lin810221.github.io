<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex33-title ex33-desc"><title id="ex33-title">訓練與目標任務之間的遷移</title><desc id="ex33-desc">兩個不同情境由待驗證箭頭連接，圖不表示任何體能進步必然完整轉移到專項結果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 33  /  訓練與目標任務之間的遷移</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="230" cy="256" rx="110" ry="83" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="615" cy="256" rx="110" ry="83" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="230" y="247" font-size="24" fill="#b7e89f" text-anchor="middle">訓練任務</text><text x="230" y="285" font-size="18" fill="#b7e89f" text-anchor="middle">器材與條件</text><text x="615" y="247" font-size="24" fill="#9ac8e8" text-anchor="middle">目標任務</text><text x="615" y="285" font-size="18" fill="#9ac8e8" text-anchor="middle">實際情境</text><path d="M360 256L480 256" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.0 251.7L480 256L471.0 260.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="334" y="190" font-size="22" fill="#ead68c" text-anchor="start">遷移需驗證</text><text x="110" y="407" font-size="19" fill="#e3e9e2" text-anchor="start">共同需求有哪些？不同之處是什麼？結果用什麼方法觀察？</text><text x="110" y="444" font-size="17" fill="#e3e9e2" text-anchor="start">有限時間須排優先，不能假設任何變強都完整轉移。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>