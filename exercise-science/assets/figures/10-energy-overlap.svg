<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex10-title ex10-desc"><title id="ex10-title">三種供能路徑重疊參與</title><desc id="ex10-desc">三條曲線只表共同參與及相對角色可改變，不是各路徑的實測百分比，沒有固定秒數切換線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 10  /  三種供能路徑重疊參與</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">相對參與示意</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">任務進行 →（無固定秒數）</text><path d="M110 160Q180 180 290 280T740 350" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#ead68c" text-anchor="start">磷酸原：概念相對角色</text><path d="M110 335Q280 130 480 260T740 330" stroke="#eda894" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="405" font-size="15" fill="#eda894" text-anchor="start">醣解：概念相對角色</text><path d="M110 352Q300 300 480 196T740 155" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="405" font-size="15" fill="#9ac8e8" text-anchor="start">氧化：概念相對角色</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">三路徑共同工作；不是到某一秒就切換到另一套。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>