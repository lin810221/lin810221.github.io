<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex02-title ex02-desc"><title id="ex02-title">指南日期與證據範圍</title><desc id="ex02-desc">時間線標正式指南發布年份，查核日不把舊指南改名；不同來源回答不同族群與任務問題。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02  /  指南日期與證據範圍</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M110 300H750" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="200" cy="300" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="640" cy="300" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="135" y="210" font-size="23" fill="#9ac8e8" text-anchor="start">WHO正式指南</text><text x="173" y="250" font-size="24" fill="#9ac8e8" text-anchor="start">2020</text><text x="515" y="210" font-size="23" fill="#ead68c" text-anchor="start">ACSM阻力聲明</text><text x="609" y="250" font-size="24" fill="#ead68c" text-anchor="start">2026</text><text x="117" y="366" font-size="19" fill="#e3e9e2" text-anchor="start">查核日期、正式發布、文獻搜尋終點要分開記錄。</text><text x="117" y="411" font-size="18" fill="#e3e9e2" text-anchor="start">平均研究結果仍需看族群、任務、比較及實際結果。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>