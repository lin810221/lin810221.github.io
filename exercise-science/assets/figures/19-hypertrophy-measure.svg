<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex19-title ex19-desc"><title id="ex19-title">組織截面與短期表現分開</title><desc id="ex19-desc">兩個不同大小的假想截面表示測量問題，不是某項訓練造成的實測增長或個人效果百分比。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19  /  組織截面與短期表現分開</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="236" cy="253" rx="76" ry="76" stroke="#eda894" fill="#17251e" stroke-width="3"/><ellipse cx="590" cy="253" rx="112" ry="112" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="151" y="382" font-size="22" fill="#eda894" text-anchor="start">假想組織截面A</text><text x="487" y="402" font-size="22" fill="#9ac8e8" text-anchor="start">假想組織截面B</text><text x="87" y="139" font-size="22" fill="#e3e9e2" text-anchor="start">概念：長期組織改變，需要相應測量與時間。</text><text x="89" y="444" font-size="17" fill="#e3e9e2" text-anchor="start">不是一次訓練前後實測；水分、泵感及量測也可能改變圍度。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>