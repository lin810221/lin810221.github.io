<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex29-title ex29-desc"><title id="ex29-title">雙重漸進與回顧節點</title><desc id="ex29-desc">假想階梯含維持平台及回顧節點，沒有給固定個人加重規則；變化需可比較觀察。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 29  /  雙重漸進與回顧節點</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">指定任務表現</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">多次可比較觀察 →</text><path d="M120 341H240V295H360V295H480V244H600V214H735" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#b7e89f" text-anchor="start">假想進度的階梯</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">有平台與回顧，不以每天直線上升當必要條件。</text><ellipse cx="480" cy="244" rx="12" ry="12" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="501" y="324" font-size="20" fill="#ead68c" text-anchor="start">回顧條件</text><text x="501" y="354" font-size="18" fill="#ead68c" text-anchor="start">再討論調整</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>