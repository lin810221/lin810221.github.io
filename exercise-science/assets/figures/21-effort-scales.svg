<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex21-title ex21-desc"><title id="ex21-title">RIR、RPE與計畫回顧</title><desc id="ex21-desc">兩條沒有數字的不同量尺強調方法需先定義，不表示任意RIR和RPE點位可以直接互換。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21  /  RIR、RPE與計畫回顧</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M120 190H740M120 319H740" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="139" font-size="23" fill="#b7e89f" text-anchor="start">RIR：還可能完成幾次的估計</text><text x="115" y="270" font-size="23" fill="#ead68c" text-anchor="start">RPE：必須說明是哪一種量表</text><path d="M130 178V202" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 307V331" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 178V202" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 307V331" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 178V202" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 307V331" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 178V202" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 307V331" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M730 178V202" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M730 307V331" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="385" font-size="22" fill="#e3e9e2" text-anchor="start">上排與下排不是可任意對齊的同一把尺。</text><text x="105" y="436" font-size="17" fill="#e3e9e2" text-anchor="start">判讀還需動作、熟悉化、觀察和實際進度；沒有自動轉換公式。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>