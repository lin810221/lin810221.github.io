<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex15-title ex15-desc"><title id="ex15-title">基線、方向與未知觀察</title><desc id="ex15-desc">時間線含一段缺漏並以虛線提示連接是假想，不當作實測；數值升降需依測試方向解讀。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15  /  基線、方向與未知觀察</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">量測值（任意尺度）</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">虛構觀察時序 →</text><path d="M120 319L230 286 340 300 450 252" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#b7e89f" text-anchor="start">可用觀察</text><path d="M570 226L690 211" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="405" font-size="15" fill="#b7e89f" text-anchor="start">後段可用觀察</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">空缺不是0；不同測試的改善方向可能相反。</text><path d="M450 252L570 226" stroke="#889687" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8"/><text x="468" y="350" font-size="18" fill="#ead68c" text-anchor="start">未知一段</text><text x="470" y="382" font-size="18" fill="#ead68c" text-anchor="start">不補最佳值</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>