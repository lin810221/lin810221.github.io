<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex08-title ex08-desc"><title id="ex08-title">神經元到多個肌纖維</title><desc id="ex08-desc">一個運動神經元分支支配多個肌纖維，構成運動單位；圖中數量為示意，不是實際肌肉的固定纖維數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08  /  神經元到多個肌纖維</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="150" cy="237" rx="45" ry="35" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M194 237H360M360 237L430 157M360 237L430 237M360 237L430 317" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="142" width="307" height="43" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="452" y="170" font-size="18" fill="#eda894" text-anchor="start">肌纖維</text><rect x="432" y="222" width="307" height="43" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="452" y="250" font-size="18" fill="#eda894" text-anchor="start">肌纖維</text><rect x="432" y="302" width="307" height="43" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="452" y="330" font-size="18" fill="#eda894" text-anchor="start">肌纖維</text><text x="83" y="151" font-size="21" fill="#c1b2ea" text-anchor="start">一個運動神經元</text><text x="86" y="399" font-size="21" fill="#e3e9e2" text-anchor="start">一個神經元＋它支配的肌纖維＝一個運動單位</text><text x="86" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">圖不表示實際纖維數；整塊肌肉含多個運動單位。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>