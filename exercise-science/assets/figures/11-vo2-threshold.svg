<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex11-title ex11-desc"><title id="ex11-title">氧攝取曲線與方法條件</title><desc id="ex11-desc">假想逐步測試曲線示意觀察VO2peak或VO2max所需方法背景，虛線不代表實測個人閾值或訓練區。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11  /  氧攝取曲線與方法條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">相對氧攝取示意</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">逐步增加的測試需求 →</text><path d="M110 347L235 295 345 250 450 192 552 164 667 151 742 151" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#b7e89f" text-anchor="start">假想逐步測試反應</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">有無平台、測試方法和停止原因都需記錄；無個人區間分界。</text><path d="M450 133V379" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="467" y="332" font-size="18" fill="#ead68c" text-anchor="start">不同閾值方法</text><text x="467" y="361" font-size="18" fill="#ead68c" text-anchor="start">不能隨意互換</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>