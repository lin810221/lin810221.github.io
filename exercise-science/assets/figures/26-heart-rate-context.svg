<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex26-title ex26-desc"><title id="ex26-title">心率分母、保留量與觀察</title><desc id="ex26-desc">平行線示意靜息與最大心率背景，未提供數字或個人區間；保留量不是任何方法下相同的百分比。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 26  /  心率分母、保留量與觀察</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M145 155V370H745" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="147" y="133" font-size="22" fill="#e3e9e2" text-anchor="start">心率相關量：同一分鐘也有不同定義</text><path d="M185 320H700" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M185 211H700" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="306" font-size="18" fill="#9ac8e8" text-anchor="start">靜息量測條件</text><text x="200" y="196" font-size="18" fill="#ead68c" text-anchor="start">最大值或估計的來源</text><path d="M519 217V315" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="543" y="267" font-size="19" fill="#b7e89f" text-anchor="start">保留差額</text><text x="119" y="437" font-size="17" fill="#e3e9e2" text-anchor="start">HRmax、HRR與實測或估計必須說清；日常累積活動還要另記。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>