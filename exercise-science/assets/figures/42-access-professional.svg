<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex42-title ex42-desc"><title id="ex42-title">可及性、慢性病與專業合作</title><desc id="ex42-desc">入口與任務間的箭頭表示需消除參與障礙，非評估通過；疾病和藥物等條件仍需適當專業。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 42  /  可及性、慢性病與專業合作</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="75" y="160" width="205" height="190" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="95" y="202" font-size="23" fill="#9ac8e8" text-anchor="start">進入與取得</text><path d="M113 249H240M113 284H240" stroke="#9ac8e8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 255L418 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M409.0 250.7L418 255L409.0 259.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="160" width="330" height="190" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="465" y="202" font-size="23" fill="#b7e89f" text-anchor="start">可參與的任務</text><text x="465" y="254" font-size="18" fill="#e3e9e2" text-anchor="start">設備、動線、資訊與協助</text><text x="465" y="300" font-size="18" fill="#e3e9e2" text-anchor="start">必要專業與替代安排</text><text x="92" y="422" font-size="18" fill="#e3e9e2" text-anchor="start">先看需求與障礙，不以疾病或障礙名稱替所有人決定能力。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>