<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex01-title ex01-desc"><title id="ex01-title">健康、能力與表現的交集</title><desc id="ex01-desc">三個重疊區表示健康、能力、表現可相關但不能完全互換；沒有把圓面積當實測效果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 01  /  健康、能力與表現的交集</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="275" cy="250" rx="146" ry="110" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="445" cy="250" rx="146" ry="110" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="360" cy="325" rx="146" ry="85" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="182" y="226" font-size="26" fill="#b7e89f" text-anchor="start">健康</text><text x="447" y="226" font-size="26" fill="#9ac8e8" text-anchor="start">能力</text><text x="320" y="366" font-size="26" fill="#ead68c" text-anchor="start">表現</text><text x="100" y="439" font-size="18" fill="#e3e9e2" text-anchor="start">重疊不等於同一目標；先選具體問題，再選測量與安排。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>