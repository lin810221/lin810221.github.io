<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex14-title ex14-desc"><title id="ex14-title">實測、估計與結果來源</title><desc id="ex14-desc">左為完成任務的觀察，右為公式或裝置估計；框內曲線只是模型符號，不表示裝置已量得同一生理量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14  /  實測、估計與結果來源</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="80" y="130" width="335" height="245" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="445" y="130" width="335" height="245" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="113" y="173" font-size="23" fill="#9ac8e8" text-anchor="start">實際完成任務</text><text x="477" y="173" font-size="23" fill="#ead68c" text-anchor="start">公式或裝置估值</text><ellipse cx="245" cy="220" rx="11.4" ry="13.799999999999999" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M245.0 234.4V283.0M245.0 247.0L221.0 277.0M245.0 247.0L269.0 277.0M245.0 283.0L230.0 325.0M245.0 283.0L260.0 325.0" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 293H733M510 216V293" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 279L555 253 590 265 630 230 713 214" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="113" y="350" font-size="18" fill="#e3e9e2" text-anchor="start">重量、次數、條件</text><text x="477" y="350" font-size="18" fill="#e3e9e2" text-anchor="start">模型、輸入、適用範圍</text><text x="88" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">不同資料來源不能只換標題就變成同一種實測。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>