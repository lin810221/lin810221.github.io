<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex16-title ex16-desc"><title id="ex16-title">阻力訓練的不同維度</title><desc id="ex16-desc">兩排卡帶分開外部阻力、次數組數、努力與動作選擇；長度只是版面安排，不代表等效劑量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16  /  阻力訓練的不同維度</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="55" y="171" font-size="20" fill="#e3e9e2" text-anchor="start">負荷</text><rect x="225" y="142" width="160" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="305.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">外部阻力</text><rect x="393" y="142" width="170" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="478.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">次數與組</text><rect x="571" y="142" width="160" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="651.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">努力程度</text><text x="55" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">動作</text><rect x="225" y="242" width="160" height="53" rx="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="305.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">目標肌群</text><rect x="393" y="242" width="170" height="53" rx="5" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="478.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">模式與器材</text><rect x="571" y="242" width="160" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="651.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">可行條件</text><text x="55" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">變數是不同維度；相同總時鐘不等於相同肌群刺激。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>