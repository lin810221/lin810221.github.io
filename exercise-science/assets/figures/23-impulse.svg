<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex23-title ex23-desc"><title id="ex23-title">力—時間曲線與衝量</title><desc id="ex23-desc">任意力時間圖以陰影示意同一方向的積分概念，不是測力板資料，未計完整人體運動或落地條件。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 23  /  力—時間曲線與衝量</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M110 130V375H750" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 375L220 260 325 187 430 250 560 375Z" stroke="#b7e89f" stroke-width="3" fill="#b7e89f22" stroke-linecap="round" stroke-linejoin="round"/><text x="109" y="110" font-size="21" fill="#9ac8e8" text-anchor="start">指定方向的力</text><text x="282" y="423" font-size="22" fill="#e3e9e2" text-anchor="start">時間 →</text><text x="249" y="309" font-size="21" fill="#b7e89f" text-anchor="start">曲線下面積</text><text x="601" y="230" font-size="23" fill="#b7e89f" text-anchor="start">衝量</text><text x="575" y="273" font-size="18" fill="#e3e9e2" text-anchor="start">與時間有關</text><text x="105" y="451" font-size="17" fill="#e3e9e2" text-anchor="start">未提供體重、方向及其他力；不據此預測跳高或安全落地。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>