<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex35-title ex35-desc"><title id="ex35-title">支持面、感覺訊息與軀幹控制</title><desc id="ex35-desc">簡化人形與支持面強調感覺、肢體和軀幹協調，虛線不是個人實測重心或平衡風險界線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35  /  支持面、感覺訊息與軀幹控制</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="420" cy="142" rx="19" ry="23" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M420.0 166.0V247M420.0 187.0L380.0 237.0M420.0 187.0L460.0 237.0M420.0 247.0L395.0 317.0M420.0 247.0L445.0 317.0" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M328 361H512" stroke="#ead68c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 175V361" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M249 220L335 247" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M327.7 240.2L335 247L325.1 248.5" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="194" font-size="20" fill="#c1b2ea" text-anchor="start">視覺／前庭</text><text x="90" y="236" font-size="20" fill="#c1b2ea" text-anchor="start">本體感覺</text><text x="574" y="205" font-size="20" fill="#e3e9e2" text-anchor="start">軀幹與肢體協調</text><text x="574" y="246" font-size="20" fill="#e3e9e2" text-anchor="start">任務及支持條件</text><text x="574" y="287" font-size="20" fill="#e3e9e2" text-anchor="start">不只一條肌肉</text><text x="94" y="441" font-size="18" fill="#e3e9e2" text-anchor="start">只看支撐和訊息；不做閉眼、單腳或極限平衡挑戰。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>