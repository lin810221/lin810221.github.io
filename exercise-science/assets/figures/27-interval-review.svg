<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex27-title ex27-desc"><title id="ex27-title">間歇總時鐘與整週核對</title><desc id="ex27-desc">上排分工作恢復，下排分計畫完成未知；圖只整理時序，未將所有段落自動歸為同一強度。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27  /  間歇總時鐘與整週核對</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="55" y="171" font-size="20" fill="#e3e9e2" text-anchor="start">課內時鐘</text><rect x="225" y="142" width="100" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="275.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">工作</text><rect x="333" y="142" width="80" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="373.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">恢復</text><rect x="421" y="142" width="100" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="471.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">工作</text><rect x="529" y="142" width="80" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="569.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">恢復</text><rect x="617" y="142" width="100" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="667.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">工作</text><text x="55" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">週內紀錄</text><rect x="225" y="242" width="150" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="300.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">計畫</text><rect x="383" y="242" width="150" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="458.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">完成</text><rect x="541" y="242" width="150" height="53" rx="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="616.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">未知</text><text x="55" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">恢復段心率尚高，不代表這一段自動全算費力有氧分鐘。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>