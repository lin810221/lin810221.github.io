<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex18-title ex18-desc"><title id="ex18-title">組、休息與實際完成的時鐘</title><desc id="ex18-desc">訓練時鐘分暖身、工作組、休息及紀錄；計畫、完成與未知分開，區塊長度為版面示意。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18  /  組、休息與實際完成的時鐘</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="55" y="171" font-size="20" fill="#e3e9e2" text-anchor="start">一堂課</text><rect x="225" y="142" width="90" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="270.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">暖身</text><rect x="323" y="142" width="110" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="378.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">組1</text><rect x="441" y="142" width="55" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="468.5" y="174" font-size="16" fill="#111a17" text-anchor="middle">休</text><rect x="504" y="142" width="110" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="559.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">組2</text><rect x="622" y="142" width="55" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="649.5" y="174" font-size="16" fill="#111a17" text-anchor="middle">休</text><rect x="685" y="142" width="55" height="53" rx="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="712.5" y="174" font-size="16" fill="#111a17" text-anchor="middle">紀錄</text><text x="55" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">計畫後</text><rect x="225" y="242" width="140" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="295.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">實際完成</text><rect x="373" y="242" width="140" height="53" rx="5" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="443.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">未完成</text><rect x="521" y="242" width="140" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="591.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">未知</text><text x="55" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">示例時鐘與狀態；不以色帶長度宣告訓練劑量或恢復充分。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>