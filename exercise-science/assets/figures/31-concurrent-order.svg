<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex31-title ex31-desc"><title id="ex31-title">並行訓練與順序的比較條件</title><desc id="ex31-desc">兩排顛倒順序的虛構安排呈現比較問題，間隔及區塊寬度不是通用建議，也不宣稱一定相互抵銷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 31  /  並行訓練與順序的比較條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="55" y="171" font-size="20" fill="#e3e9e2" text-anchor="start">安排A</text><rect x="225" y="142" width="160" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="305.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">阻力</text><rect x="393" y="142" width="100" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="443.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">間隔</text><rect x="501" y="142" width="160" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="581.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">有氧</text><text x="55" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">安排B</text><rect x="225" y="242" width="160" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="305.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">有氧</text><rect x="393" y="242" width="100" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="443.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">間隔</text><rect x="501" y="242" width="160" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="581.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">阻力</text><text x="55" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">相同版面不是劑量等效；先核對目標、模式、強度及實際間隔。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>