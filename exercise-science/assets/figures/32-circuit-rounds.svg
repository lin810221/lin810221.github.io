<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex32-title ex32-desc"><title id="ex32-title">循環站與反覆回合的時序</title><desc id="ex32-desc">虛構站次與回合分出工作及轉換，沒有以總時鐘判有氧、肌力或專項劑量等效。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32  /  循環站與反覆回合的時序</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="55" y="171" font-size="20" fill="#e3e9e2" text-anchor="start">循環課</text><rect x="225" y="142" width="90" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="270.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">站1</text><rect x="323" y="142" width="40" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="343.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">換</text><rect x="371" y="142" width="90" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="416.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">站2</text><rect x="469" y="142" width="40" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="489.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">換</text><rect x="517" y="142" width="90" height="53" rx="5" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="562.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">站3</text><rect x="615" y="142" width="40" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="635.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">換</text><text x="55" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">反覆回合</text><rect x="225" y="242" width="100" height="53" rx="5" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="275.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">任務</text><rect x="333" y="242" width="65" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="365.5" y="274" font-size="16" fill="#111a17" text-anchor="middle">間隔</text><rect x="406" y="242" width="100" height="53" rx="5" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="456.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">任務</text><rect x="514" y="242" width="65" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="546.5" y="274" font-size="16" fill="#111a17" text-anchor="middle">間隔</text><rect x="587" y="242" width="100" height="53" rx="5" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="637.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">任務</text><text x="55" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">站名、回合與總分鐘不能代替實際施力、動作或專項需求。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>