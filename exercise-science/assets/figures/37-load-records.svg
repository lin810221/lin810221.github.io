<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex37-title ex37-desc"><title id="ex37-title">內外負荷與完整紀錄</title><desc id="ex37-desc">任務與反應分兩邊，箭頭只代表需一起理解，不提供生理轉換係數；紀錄狀態保留未知。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37  /  內外負荷與完整紀錄</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="135" width="345" height="245" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><rect x="450" y="135" width="345" height="245" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="90" y="179" font-size="25" fill="#b7e89f" text-anchor="start">外部任務</text><text x="476" y="179" font-size="25" fill="#9ac8e8" text-anchor="start">內在反應</text><text x="90" y="237" font-size="18" fill="#e3e9e2" text-anchor="start">重量、距離、次數、時間</text><text x="476" y="237" font-size="18" fill="#e3e9e2" text-anchor="start">指定量表、心率等觀察</text><text x="90" y="292" font-size="18" fill="#e3e9e2" text-anchor="start">完成／休息／未知</text><text x="476" y="292" font-size="18" fill="#e3e9e2" text-anchor="start">量法、時點與脈絡</text><path d="M418 260L441 260" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M432.0 255.7L441 260L432.0 264.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="436" font-size="19" fill="#e3e9e2" text-anchor="start">兩側不能任意合併成個人能力或傷害分數。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>