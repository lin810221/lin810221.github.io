<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex17-title ex17-desc"><title id="ex17-title">蹲與髖主導：先描述可觀察差異</title><desc id="ex17-desc">兩個簡化人形比較動作模式，沒有精密角度、外力及個人安全判定；不是跟做指令。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 17  /  蹲與髖主導：先描述可觀察差異</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="215" cy="160" rx="19" ry="23" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M215.0 184.0L235.0 250.0 200.0 290.0 243.0 335.0M220.0 205.0L167.0 240.0M235.0 250.0L277.0 286.0 279.0 335.0" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="560" cy="160" rx="19" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M560.0 184.0L612.0 233.0 596.0 284.0 610.0 335.0M576.0 204.0L572.0 270.0M612.0 233.0L640.0 284.0 638.0 335.0" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="391" font-size="21" fill="#b7e89f" text-anchor="start">屈髖屈膝的例子</text><text x="493" y="391" font-size="21" fill="#9ac8e8" text-anchor="start">髖主導的例子</text><text x="86" y="443" font-size="17" fill="#e3e9e2" text-anchor="start">只看模式與可觀察位置，不是每個人的理想姿勢或動作處方。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>