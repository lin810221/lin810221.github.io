<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex12-title ex12-desc"><title id="ex12-title">總支出、基準與淨量</title><desc id="ex12-desc">以三塊示意區分gross總支出、基準及net差額，圖塊面積不是實際比例；估值依基準和任務而變。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12  /  總支出、基準與淨量</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="130" y="170" width="210" height="170" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="160" y="210" font-size="23" fill="#9ac8e8" text-anchor="start">gross總支出</text><rect x="385" y="170" width="105" height="170" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="389" y="212" font-size="20" fill="#ead68c" text-anchor="start">基準</text><text x="355" y="263" font-size="28" fill="#e3e9e2" text-anchor="start">−</text><text x="516" y="263" font-size="28" fill="#e3e9e2" text-anchor="start">＝</text><rect x="565" y="170" width="190" height="170" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="600" y="213" font-size="23" fill="#b7e89f" text-anchor="start">net淨量</text><text x="90" y="411" font-size="18" fill="#e3e9e2" text-anchor="start">概念分解：需同一時間、單位與基準；未校準個人耗能。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>