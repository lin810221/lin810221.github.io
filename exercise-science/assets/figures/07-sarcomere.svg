<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="ex07-title ex07-desc"><title id="ex07-title">肌節與肌絲滑動</title><desc id="ex07-desc">Z線之間是肌節，細肌絲連向Z線、粗肌絲居中；滑動改變重疊，不是肌絲消失或自身縮短。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">圖 07 /  肌節與肌絲滑動</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><path d="M130 145V342M700 145V342" stroke="#ead68c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="119" font-size="18" fill="#ead68c" text-anchor="start">Z線</text><text x="681" y="119" font-size="18" fill="#ead68c" text-anchor="start">Z線</text><path d="M135 181H340M695 181H490" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 224H340M695 224H490" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 268H340M695 268H490" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 311H340M695 311H490" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 202H555" stroke="#eda894" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 245H555" stroke="#eda894" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 289H555" stroke="#eda894" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 385L335 385" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M326.0 380.7L335 385L326.0 389.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M635 385L495 385" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.0 389.3L495 385L504.0 380.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="436" font-size="19" fill="#e3e9e2" text-anchor="start">滑動使重疊改變；粗細肌絲本身不靠縮短完成。</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>