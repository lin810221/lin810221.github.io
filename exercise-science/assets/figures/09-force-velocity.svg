<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex09-title ex09-desc"><title id="ex09-title">力量、速度與輸出的關係</title><desc id="ex09-desc">兩條任意形狀曲線區分力與功率概念，不具實測刻度或個人適用參數，也不把疲勞簡化為單一曲線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09  /  力量、速度與輸出的關係</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">任意尺度，不是實測</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">相對速度 →</text><path d="M112 160Q315 205 475 312T738 358" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#b7e89f" text-anchor="start">示意向心力—速度</text><path d="M112 355Q265 220 412 250T738 375" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="405" font-size="15" fill="#9ac8e8" text-anchor="start">示意功率形狀</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">曲線僅教變數關係，不能代入個人的負荷或疲勞預測。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>