<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex03-title ex03-desc"><title id="ex03-title">完成、休息與未知分三種</title><desc id="ex03-desc">原創紀錄表將已完成、明確休息與未記錄分開，未記錄不等於零；沒有把資料整理當運動許可。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 03  /  完成、休息與未知分三種</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="90" y="130" width="675" height="245" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="122" y="170" font-size="18" fill="#e3e9e2" text-anchor="start">日期</text><text x="275" y="170" font-size="18" fill="#e3e9e2" text-anchor="start">完成狀態</text><text x="490" y="170" font-size="18" fill="#e3e9e2" text-anchor="start">任務／單位</text><path d="M100 191H752M242 140V358M450 140V358" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="230" font-size="18" fill="#e3e9e2" text-anchor="start">虛構日</text><text x="275" y="230" font-size="18" fill="#b7e89f" text-anchor="start">已完成</text><text x="123" y="288" font-size="18" fill="#e3e9e2" text-anchor="start">虛構日</text><text x="275" y="288" font-size="18" fill="#b7e89f" text-anchor="start">明確休息</text><text x="123" y="346" font-size="18" fill="#e3e9e2" text-anchor="start">虛構日</text><text x="275" y="346" font-size="18" fill="#ead68c" text-anchor="start">未記錄</text><text x="490" y="230" font-size="18" fill="#e3e9e2" text-anchor="start">有明確量值</text><text x="490" y="288" font-size="18" fill="#e3e9e2" text-anchor="start">不是缺漏</text><text x="490" y="346" font-size="18" fill="#ead68c" text-anchor="start">保持未知</text><text x="94" y="436" font-size="18" fill="#e3e9e2" text-anchor="start">資料整理不等於篩檢通過；缺資訊不能變成醫療許可。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>