<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex40-title ex40-desc"><title id="ex40-title">同一活動建議，要帶上族群與情境</title><desc id="ex40-desc">四個脈絡卡分年齡、目標、發展與支持；沒有以成人數字縮比例套用所有人。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 40  /  同一活動建議，要帶上族群與情境</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">年齡與生命階段</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">兒少、成人、高齡</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">先看正式適用範圍</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">訓練經驗</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">初學、中斷後與熟悉</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">能力不能只依外表推</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">實際功能</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">完成、耐受與偏好</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">群體平均不替代個人</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">支持與環境</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">器材、監督及資源</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">能參與也是設計問題</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>