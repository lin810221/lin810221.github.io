<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex47-title ex47-desc"><title id="ex47-title">從原始紀錄追到可用摘要</title><desc id="ex47-desc">三欄將資料、摘要與解讀範圍分開，箭頭代表可追溯來源而非生理因果；沒有以未知當零。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 47  /  從原始紀錄追到可用摘要</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="132" width="210" height="245" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><rect x="325" y="132" width="210" height="245" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="585" y="132" width="210" height="245" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="90" y="174" font-size="23" fill="#b7e89f" text-anchor="start">原始紀錄</text><text x="349" y="174" font-size="23" fill="#9ac8e8" text-anchor="start">可用摘要</text><text x="609" y="174" font-size="23" fill="#ead68c" text-anchor="start">解讀範圍</text><text x="90" y="237" font-size="19" fill="#e3e9e2" text-anchor="start">完成與缺漏</text><text x="90" y="288" font-size="19" fill="#e3e9e2" text-anchor="start">單位及來源</text><text x="349" y="237" font-size="19" fill="#e3e9e2" text-anchor="start">已知分母</text><text x="349" y="288" font-size="19" fill="#e3e9e2" text-anchor="start">未知保留</text><text x="609" y="237" font-size="19" fill="#e3e9e2" text-anchor="start">不是全員全週</text><text x="609" y="288" font-size="19" fill="#e3e9e2" text-anchor="start">不是傷害預測</text><path d="M282 255L317 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M308.0 250.7L317 255L308.0 259.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M543 255L577 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M568.0 250.7L577 255L568.0 259.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">先查資料與定義，再查算術；小數位不能補上缺漏。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>