<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex36-title ex36-desc"><title id="ex36-title">練習表現、保留與遷移</title><desc id="ex36-desc">假想練習曲線與隔段再測分開，不把當下進步直接叫長期學習，也不把不同任務數值混成同尺度。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36  /  練習表現、保留與遷移</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">指定任務的任意表現</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">練習 → 間隔 → 再測</text><path d="M120 340L220 285 320 235 420 205" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#b7e89f" text-anchor="start">練習期表現</text><path d="M590 240L715 225" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="405" font-size="15" fill="#9ac8e8" text-anchor="start">保留／新情境觀察</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">練習當下改善，不等於保留或遷移已證明。</text><path d="M470 150V375" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><text x="460" y="405" font-size="18" fill="#ead68c" text-anchor="start">間隔</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>