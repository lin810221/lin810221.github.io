<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex28-title ex28-desc"><title id="ex28-title">FITT連接目標，而非四個孤立數字</title><desc id="ex28-desc">中心目標與頻率、強度、時間、模式相連，線代表規劃關係，不表示生理因果係數或個人課表。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28  /  FITT連接目標，而非四個孤立數字</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="266" rx="91" ry="55" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="273" font-size="24" fill="#b7e89f" text-anchor="middle">明確目標</text><ellipse cx="155" cy="150" rx="73" ry="42" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="155" y="157" font-size="23" fill="#9ac8e8" text-anchor="middle">頻率</text><path d="M215 150L350 245" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="150" rx="73" ry="42" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="625" y="157" font-size="23" fill="#ead68c" text-anchor="middle">強度</text><path d="M565 150L510 245" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="155" cy="355" rx="73" ry="42" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="155" y="362" font-size="23" fill="#c1b2ea" text-anchor="middle">時間</text><path d="M215 355L350 287" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="355" rx="73" ry="42" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="625" y="362" font-size="23" fill="#eda894" text-anchor="middle">模式</text><path d="M565 355L510 287" stroke="#eda894" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">一個維度改變，其他條件及可恢復性也要回顧。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>