<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex24-title ex24-desc"><title id="ex24-title">預定變向與反應式敏捷</title><desc id="ex24-desc">兩條示意路線區分預先知道方向與看線索後反應，不表示指定跑法、速度或個人可安全完成。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 24  /  預定變向與反應式敏捷</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M130 349L360 349 550 159 730 159" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 349L537 172" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M527.6 175.3L537 172L533.7 181.4" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 349L360 349 550 349" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="90" y="142" font-size="21" fill="#b7e89f" text-anchor="start">預先知道路線</text><text x="525" y="409" font-size="21" fill="#9ac8e8" text-anchor="start">看到線索才選方向</text><path d="M118 365L130 335 142 365Z" stroke="#ead68c" stroke-width="2" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><path d="M348 365L360 335 372 365Z" stroke="#ead68c" stroke-width="2" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><path d="M538 175L550 145 562 175Z" stroke="#ead68c" stroke-width="2" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><path d="M718 175L730 145 742 175Z" stroke="#ead68c" stroke-width="2" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><path d="M538 365L550 335 562 365Z" stroke="#ead68c" stroke-width="2" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="451" font-size="17" fill="#e3e9e2" text-anchor="start">路線僅為概念；速度、轉向與反應需求必須分開描述。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>