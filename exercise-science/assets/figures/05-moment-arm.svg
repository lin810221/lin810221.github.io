<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex05-title ex05-desc"><title id="ex05-title">力、支點與垂直力臂</title><desc id="ex05-desc">外力作用點到轉軸的幾何及垂直距離決定簡化力矩；此圖不計個人關節、肌肉或肌腱內力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 05  /  力、支點與垂直力臂</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M110 330H730" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 334L136 376H184Z" stroke="#ead68c" stroke-width="3" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="330" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M540 185L540 317" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M544.3 308.0L540 317L535.7 308.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 260H540" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="267" y="241" font-size="21" fill="#9ac8e8" text-anchor="start">垂直力臂</text><text x="555" y="200" font-size="22" fill="#eda894" text-anchor="start">外力</text><text x="90" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">簡化支點／外力模型；未計其他力與人體內部結構。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>