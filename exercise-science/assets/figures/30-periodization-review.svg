<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex30-title ex30-desc"><title id="ex30-title">區塊、維持與回顧</title><desc id="ex30-desc">兩排虛構區塊表示優先目標及維持可以不同，不宣稱固定區塊長度、減量幅度或每人必需週期化。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30  /  區塊、維持與回顧</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="55" y="171" font-size="20" fill="#e3e9e2" text-anchor="start">區塊A</text><rect x="225" y="142" width="145" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="297.5" y="174" font-size="16" fill="#111a17" text-anchor="middle">目標A</text><rect x="378" y="142" width="145" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="450.5" y="174" font-size="16" fill="#111a17" text-anchor="middle">目標A</text><rect x="531" y="142" width="145" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="603.5" y="174" font-size="16" fill="#111a17" text-anchor="middle">回顧</text><text x="55" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">區塊B</text><rect x="225" y="242" width="145" height="53" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="297.5" y="274" font-size="16" fill="#111a17" text-anchor="middle">目標B</text><rect x="378" y="242" width="145" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="450.5" y="274" font-size="16" fill="#111a17" text-anchor="middle">維持A</text><rect x="531" y="242" width="145" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="603.5" y="274" font-size="16" fill="#111a17" text-anchor="middle">回顧</text><text x="55" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">區塊不是通用週數處方；是否需要複雜安排取決於問題。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>