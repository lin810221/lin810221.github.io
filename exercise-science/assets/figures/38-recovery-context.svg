<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex38-title ex38-desc"><title id="ex38-title">恢復受到任務與生活共同影響</title><desc id="ex38-desc">睡眠、工作壓力、任務及支持與恢復討論相連，不把線條長短當影響量，也不由酸痛推療效。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 38  /  恢復受到任務與生活共同影響</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="425" cy="260" rx="91" ry="65" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="425" y="267" font-size="23" fill="#b7e89f" text-anchor="middle">恢復脈絡</text><ellipse cx="115" cy="150" rx="85" ry="39" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="115" y="157" font-size="22" fill="#9ac8e8" text-anchor="middle">睡眠</text><path d="M191 150L344 240" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="695" cy="150" rx="85" ry="39" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="695" y="157" font-size="22" fill="#ead68c" text-anchor="middle">工作壓力</text><path d="M619 150L508 240" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="115" cy="367" rx="85" ry="39" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="115" y="374" font-size="22" fill="#c1b2ea" text-anchor="middle">任務需求</text><path d="M191 367L344 282" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="695" cy="367" rx="85" ry="39" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="695" y="374" font-size="22" fill="#eda894" text-anchor="middle">生活支持</text><path d="M619 367L508 282" stroke="#eda894" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="445" font-size="18" fill="#e3e9e2" text-anchor="start">DOMS、疲勞與表現各是線索，不是單一恢復完成指標。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>