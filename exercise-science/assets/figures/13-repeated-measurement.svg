<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex13-title ex13-desc"><title id="ex13-title">重複量測：集中、誤差與標準化</title><desc id="ex13-desc">兩群虛構點呈現測量分散程度，集中不等於量到正確概念；位置無實際量測單位或臨床判定線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 13  /  重複量測：集中、誤差與標準化</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M95 340H765M95 135V340" stroke="#7c9180" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="118" font-size="20" fill="#e3e9e2" text-anchor="start">重複測量的虛構位置</text><text x="305" y="406" font-size="20" fill="#e3e9e2" text-anchor="start">同任務與單位，仍可能有波動</text><ellipse cx="175" cy="230" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="195" cy="220" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="215" cy="237" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="480" cy="223" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="560" cy="170" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="640" cy="280" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="140" y="315" font-size="20" fill="#b7e89f" text-anchor="start">較集中</text><text x="515" y="315" font-size="20" fill="#9ac8e8" text-anchor="start">較分散</text><text x="105" y="446" font-size="17" fill="#e3e9e2" text-anchor="start">集中不自動等於準確；量具可能每次都偏同一方向。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>