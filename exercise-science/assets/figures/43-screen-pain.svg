<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex43-title ex43-desc"><title id="ex43-title">資料、感受與專業評估的界線</title><desc id="ex43-desc">四張資訊卡把資料不足、個人感受、功能和必要評估分開，不以紅綠燈或單一疼痛分數發運動許可。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 43  /  資料、感受與專業評估的界線</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">目前資料</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">病史、任務、變化與未知</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">空白不能預設沒有問題</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">人的感受</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">疼痛是真實個人經驗</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不等於精確損傷刻度</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">功能與情境</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">時間、支持與變化</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不由一個姿勢判病因</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">適當協作</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">需要時連接健康專業</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">教材不提供安全認證</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>