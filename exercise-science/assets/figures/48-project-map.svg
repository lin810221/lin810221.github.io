<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex48-title ex48-desc"><title id="ex48-title">完整專題：把任務、資料與限制連起來</title><desc id="ex48-desc">四個專題面向互相核對：問題、資料、方法和交付；完成教學專題不等於個人訓練處方或醫療證明。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 48  /  完整專題：把任務、資料與限制連起來</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">問題與目標</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">先描述虛構任務</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不要事後換成另一個問題</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">資料與條件</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">完成、缺漏、單位及來源</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不填真實個人敏感資料</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">算術與解釋</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">可重跑與可審核</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">模型不能越界成個人診斷</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">交付與複習</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">結果、未知、限制與下一步</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">用圖口述，再對照原文答案</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>