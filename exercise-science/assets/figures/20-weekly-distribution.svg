<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex20-title ex20-desc"><title id="ex20-title">週頻率與總量是兩個問題</title><desc id="ex20-desc">兩排虛構日曆顯示頻率可不同，但未提供每次組數與負荷，不能直接宣稱週總量相等。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20  /  週頻率與總量是兩個問題</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="180" y="132" font-size="18" fill="#e3e9e2" text-anchor="start">一</text><text x="263" y="132" font-size="18" fill="#e3e9e2" text-anchor="start">二</text><text x="346" y="132" font-size="18" fill="#e3e9e2" text-anchor="start">三</text><text x="429" y="132" font-size="18" fill="#e3e9e2" text-anchor="start">四</text><text x="512" y="132" font-size="18" fill="#e3e9e2" text-anchor="start">五</text><text x="595" y="132" font-size="18" fill="#e3e9e2" text-anchor="start">六</text><text x="678" y="132" font-size="18" fill="#e3e9e2" text-anchor="start">日</text><text x="45" y="213" font-size="19" fill="#e3e9e2" text-anchor="start">分配A</text><rect x="153" y="174" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="189" y="216" font-size="17" fill="#b7e89f" text-anchor="middle">工作</text><rect x="236" y="174" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="272" y="216" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><rect x="319" y="174" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="355" y="216" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><rect x="402" y="174" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="438" y="216" font-size="17" fill="#b7e89f" text-anchor="middle">工作</text><rect x="485" y="174" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="521" y="216" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><rect x="568" y="174" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="604" y="216" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><rect x="651" y="174" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="687" y="216" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><text x="45" y="318" font-size="19" fill="#e3e9e2" text-anchor="start">分配B</text><rect x="153" y="279" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="189" y="321" font-size="17" fill="#b7e89f" text-anchor="middle">工作</text><rect x="236" y="279" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="272" y="321" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><rect x="319" y="279" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="355" y="321" font-size="17" fill="#b7e89f" text-anchor="middle">工作</text><rect x="402" y="279" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="438" y="321" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><rect x="485" y="279" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="521" y="321" font-size="17" fill="#b7e89f" text-anchor="middle">工作</text><rect x="568" y="279" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="604" y="321" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><rect x="651" y="279" width="71" height="68" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="687" y="321" font-size="17" fill="#b7e89f" text-anchor="middle">—</text><text x="65" y="439" font-size="17" fill="#e3e9e2" text-anchor="start">僅比較虛構安排；不是建議每個人照此訓練。</text><text x="109" y="403" font-size="20" fill="#e3e9e2" text-anchor="start">先核對週總量與動作，才能討論分配。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>