<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex41-title ex41-desc"><title id="ex41-title">生命階段與身體條件</title><desc id="ex41-desc">三個非比例人形代表不同階段需要實際評估，不將大小畫成能力排序，也不給兒少、高齡或孕產固定負荷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41  /  生命階段與身體條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="185" cy="191" rx="12.920000000000002" ry="15.64" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M185.0 207.3V262.4M185.0 221.6L157.8 255.6M185.0 221.6L212.2 255.6M185.0 262.4L168.0 310.0M185.0 262.4L202.0 310.0" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="425" cy="145" rx="19" ry="23" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M425.0 169.0V250M425.0 190.0L385.0 240.0M425.0 190.0L465.0 240.0M425.0 250.0L400.0 320.0M425.0 250.0L450.0 320.0" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="665" cy="173" rx="15.200000000000001" ry="18.400000000000002" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M665.0 192.2V257.0M665.0 209.0L633.0 249.0M665.0 209.0L697.0 249.0M665.0 257.0L645.0 313.0M665.0 257.0L685.0 313.0" stroke="#ead68c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 390H765" stroke="#718b76" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="419" font-size="19" fill="#9ac8e8" text-anchor="start">成長與監督</text><text x="356" y="419" font-size="19" fill="#b7e89f" text-anchor="start">多種個體條件</text><text x="585" y="419" font-size="19" fill="#ead68c" text-anchor="start">功能及調整</text><text x="108" y="119" font-size="21" fill="#e3e9e2" text-anchor="start">尺寸、發展和功能都不同；不是只將成人模板縮放。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>