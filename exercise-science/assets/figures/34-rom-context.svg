<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex34-title ex34-desc"><title id="ex34-title">活動範圍與伸展方法的參考點</title><desc id="ex34-desc">同一肢段的兩個示意位置及未標數字的弧線，提示ROM需明確量法；圖不給安全角度或動作處方。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34  /  活動範圍與伸展方法的參考點</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="230" cy="145" rx="19" ry="23" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M230.0 169.0V250M230.0 190.0L190.0 240.0M230.0 190.0L270.0 240.0M230.0 250.0L205.0 320.0M230.0 250.0L255.0 320.0" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 193L371 163" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 193L341 294" stroke="#ead68c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 176Q335 215 301 258" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="450" y="176" font-size="24" fill="#9ac8e8" text-anchor="start">活動範圍</text><text x="450" y="227" font-size="20" fill="#e3e9e2" text-anchor="start">參考點與量法要一致</text><text x="450" y="278" font-size="20" fill="#e3e9e2" text-anchor="start">不以弧線宣告安全角度</text><text x="110" y="432" font-size="18" fill="#e3e9e2" text-anchor="start">示意肢段與兩個位置；不是伸展跟做或個人活動限制。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>