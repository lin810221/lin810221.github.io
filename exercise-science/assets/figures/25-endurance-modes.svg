<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex25-title ex25-desc"><title id="ex25-title">持續與間歇：方式和強度分開</title><desc id="ex25-desc">兩排虛構時鐘區分持續與交替安排，區塊長度不表示健康效益或實際生理劑量等效。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 25  /  持續與間歇：方式和強度分開</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="55" y="171" font-size="20" fill="#e3e9e2" text-anchor="start">持續</text><rect x="225" y="142" width="480" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="465.0" y="174" font-size="16" fill="#111a17" text-anchor="middle">持續工作</text><text x="55" y="271" font-size="20" fill="#e3e9e2" text-anchor="start">間歇</text><rect x="225" y="242" width="90" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="270.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">工作</text><rect x="323" y="242" width="60" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="353.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">恢復</text><rect x="391" y="242" width="90" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="436.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">工作</text><rect x="489" y="242" width="60" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="519.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">恢復</text><rect x="557" y="242" width="90" height="53" rx="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="602.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">工作</text><rect x="655" y="242" width="60" height="53" rx="5" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="685.0" y="274" font-size="16" fill="#111a17" text-anchor="middle">恢復</text><text x="55" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">比較方式示意；沒有指定個人強度或最佳工作／恢復比例。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>