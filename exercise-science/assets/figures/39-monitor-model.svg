<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex39-title ex39-desc"><title id="ex39-title">描述模型、觀察與下一步</title><desc id="ex39-desc">三條未校準曲線採同一任意基準，綠線為藍線減黃線的示例；不是實測疲勞、適應或傷害機率，決策需先核對資料。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 39  /  描述模型、觀察與下一步</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">未校準的模型輸出</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">任意時間步 →</text><path d="M120 290.000L220 245.000L320 200.000L420 200.000L520 209.000L620 222.500L720 236.000" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#9ac8e8" text-anchor="start">任意慢變成分</text><path d="M120 290.000L220 155.000L320 200.000L420 236.000L520 258.500L620 272.000L720 281.000" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="405" font-size="15" fill="#ead68c" text-anchor="start">任意快變成分</text><path d="M120 290.000L220 380.000L320 290.000L420 254.000L520 240.500L620 240.500L720 245.000" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="405" font-size="15" fill="#b7e89f" text-anchor="start">兩成分之差</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">零基準相同，綠線＝藍線−黃線；不是個人傷害或最佳決策。</text><path d="M110 290H750" stroke="#697c6b" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>