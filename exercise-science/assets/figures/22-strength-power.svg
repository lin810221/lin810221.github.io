<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ex22-title ex22-desc"><title id="ex22-title">最大肌力與快速施力的任務差異</title><desc id="ex22-desc">任意曲線提示力、速度與功率有不同問題定義，沒有固定通用最佳負荷或個人1RM推定值。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 22  /  最大肌力與快速施力的任務差異</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 115V384H765" stroke="#8ca08c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="104" font-size="18" fill="#9ac8e8" text-anchor="start">任意示意，不是通用曲線</text><text x="270" y="434" font-size="19" fill="#e3e9e2" text-anchor="start">指定任務的速度條件 →</text><path d="M120 170Q310 230 520 315T735 362" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="405" font-size="15" fill="#b7e89f" text-anchor="start">力量條件的示意</text><path d="M120 355Q350 198 520 278T735 372" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="405" font-size="15" fill="#9ac8e8" text-anchor="start">功率條件的示意</text><text x="115" y="458" font-size="16" fill="#e3e9e2" text-anchor="start">先明確定義任務；不是從圖挑出所有人的最佳負荷。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>