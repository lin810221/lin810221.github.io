<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu26-title nu26-desc"><title id="nu26-title">營養密度的分母與整體飲食</title><desc id="nu26-desc">同一食物以每100克、每份及每100千卡比較可有不同排序，整體飲食型態需看多種食物與時間而非單一分母。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 26  /  營養密度的分母與整體飲食</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M135 242V197" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="116" cy="188" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="154" cy="188" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="135" cy="174" rx="22" ry="19" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M98 356Q135 409 172 356Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 356H176" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="111" cy="347" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="120" cy="347" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="129" cy="347" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="138" cy="347" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="147" cy="347" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="156" cy="347" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><rect x="286" y="128" width="485" height="273" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="311" y="170" font-size="24" fill="#9ac8e8" text-anchor="start">同一食物，三種分母</text><text x="312" y="234" font-size="22" fill="#e3e9e2" text-anchor="start">每100 g：重量基準</text><text x="312" y="293" font-size="22" fill="#e3e9e2" text-anchor="start">每份：實際使用量</text><text x="312" y="352" font-size="22" fill="#e3e9e2" text-anchor="start">每100 kcal：能量基準</text><text x="75" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">不同基準回答不同問題；飲食型態還看食物組合與長期。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>