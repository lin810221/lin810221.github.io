<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu45-title nu45-desc"><title id="nu45-title">保存日期與冷鏈歷史</title><desc id="nu45-desc">從製備運送保存到食用的時間軸，任何未取得條件都保留未知；日期、開封及特定族群情境不可互相代替。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 45  /  保存日期與冷鏈歷史</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 330H785" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M777 330L800 330" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M791.0 325.7L800 330L791.0 334.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="124" cy="330" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="124" y="177" font-size="23" fill="#9ac8e8" text-anchor="middle">製備</text><text x="124" y="231" font-size="18" fill="#9ac8e8" text-anchor="middle">條件已知？</text><path d="M124 255V317" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="339" cy="330" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="339" y="177" font-size="23" fill="#9ac8e8" text-anchor="middle">運送</text><text x="339" y="231" font-size="18" fill="#9ac8e8" text-anchor="middle">曾離冷藏？</text><path d="M339 255V317" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="554" cy="330" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="554" y="177" font-size="23" fill="#9ac8e8" text-anchor="middle">保存</text><text x="554" y="231" font-size="18" fill="#9ac8e8" text-anchor="middle">開封與日期</text><path d="M554 255V317" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="744" cy="330" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="744" y="177" font-size="23" fill="#9ac8e8" text-anchor="middle">食用</text><text x="744" y="231" font-size="18" fill="#9ac8e8" text-anchor="middle">族群與情境</text><path d="M744 255V317" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="403" font-size="18" fill="#e3e9e2" text-anchor="start">時間軸有未知，就不能用一次量測或日期把整段補成安全。</text><text x="80" y="446" font-size="18" fill="#e3e9e2" text-anchor="start">依食物與當地正式資訊處理；不安排試吃來判安全。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>