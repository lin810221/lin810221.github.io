<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu28-title nu28-desc"><title id="nu28-title">一份、一包與每100的關係</title><desc id="nu28-desc">包裝與標示並列，先找每份大小與包裝份數，再核對每100基準及地區規則，不把不同制度視為相同門檻。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28  /  一份、一包與每100的關係</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="121" width="202" height="299" rx="20" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="166" y="174" font-size="27" fill="#ead68c" text-anchor="middle">一整包</text><path d="M85 201H246" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="251" font-size="23" fill="#ead68c" text-anchor="middle">可能多份</text><text x="166" y="322" font-size="19" fill="#ead68c" text-anchor="middle">不是自動一份</text><path d="M292 265L385 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M376.0 260.7L385 265L376.0 269.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="121" width="341" height="299" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="450" y="157" font-size="20" fill="#9ac8e8" text-anchor="start">營養標示的三個層次</text><text x="452" y="206" font-size="22" fill="#e3e9e2" text-anchor="start">每份定義</text><text x="452" y="257" font-size="22" fill="#e3e9e2" text-anchor="start">本包裝份數</text><text x="452" y="308" font-size="20" fill="#e3e9e2" text-anchor="start">每100基準及地區規則</text><text x="75" y="449" font-size="17" fill="#e3e9e2" text-anchor="start">同一包裝也要核對實際吃的量、原始單位與適用地區。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>