<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu07-title nu07-desc"><title id="nu07-title">能量係數與支出不是同一張表</title><desc id="nu07-desc">常用4、4、9係數估算三大營養素來源能量；不同成分、制度與人體支出有各自條件，不能直接當個人需要量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 07  /  能量係數與支出不是同一張表</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="75" y="165" width="180" height="180" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="340" y="165" width="180" height="180" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="605" y="165" width="180" height="180" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="165" y="216" font-size="26" fill="#ead68c" text-anchor="middle">醣類</text><text x="430" y="216" font-size="26" fill="#9ac8e8" text-anchor="middle">蛋白質</text><text x="695" y="216" font-size="26" fill="#eda894" text-anchor="middle">脂肪</text><text x="165" y="278" font-size="48" fill="#ead68c" text-anchor="middle">4</text><text x="430" y="278" font-size="48" fill="#9ac8e8" text-anchor="middle">4</text><text x="695" y="278" font-size="48" fill="#eda894" text-anchor="middle">9</text><text x="165" y="320" font-size="20" fill="#ead68c" text-anchor="middle">kcal / g</text><text x="430" y="320" font-size="20" fill="#9ac8e8" text-anchor="middle">kcal / g</text><text x="695" y="320" font-size="20" fill="#eda894" text-anchor="middle">kcal / g</text><text x="75" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">常用教學係數；標示制度、其他成分與實際支出另看條件。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>