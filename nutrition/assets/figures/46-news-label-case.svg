<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu46-title nu46-desc"><title id="nu46-title">營養新聞與產品標示互相核對</title><desc id="nu46-desc">新聞或廣告的主張和實際產品標示並列，追分母、對象、時間與來源，不因產品名字相同就外推原料或研究效果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 46  /  營養新聞與產品標示互相核對</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="58" y="124" width="271" height="284" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="76" y="160" font-size="20" fill="#9ac8e8" text-anchor="start">新聞／廣告主張</text><text x="82" y="205" font-size="20" fill="#e3e9e2" text-anchor="start">宣稱什麼效果？</text><text x="82" y="258" font-size="20" fill="#e3e9e2" text-anchor="start">用誰、比什麼？</text><text x="82" y="311" font-size="19" fill="#e3e9e2" text-anchor="start">數字分母和時間？</text><path d="M351 269L439 269" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M430.0 264.7L439 269L430.0 273.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="483" y="124" width="300" height="284" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="506" y="169" font-size="22" fill="#ead68c" text-anchor="start">產品標示核對</text><text x="506" y="224" font-size="20" fill="#e3e9e2" text-anchor="start">每份、份數與來源</text><text x="506" y="279" font-size="20" fill="#e3e9e2" text-anchor="start">成分和法規範圍</text><text x="506" y="335" font-size="19" fill="#e3e9e2" text-anchor="start">研究與實物是否相符</text><text x="75" y="443" font-size="18" fill="#e3e9e2" text-anchor="start">先把主張與實際產品對上，再評證據及未知。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>