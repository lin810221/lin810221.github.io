<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu37-title nu37-desc"><title id="nu37-title">生命階段：需求與餵食情境會改變</title><desc id="nu37-desc">成人餐盤與發展情境並列，孕哺與嬰幼兒有不同需求及照護條件，圖不提供個人補充劑量或餵食處方。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37  /  生命階段：需求與餵食情境會改變</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="225" cy="248" rx="115" ry="115" stroke="#637f6a" fill="#17251e" stroke-width="3"/><ellipse cx="225" cy="248" rx="98" ry="98" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M225 150V346M127 248H323" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 217.6V192.85" stroke="#b7e89f" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="157.55" cy="187.9" rx="11.55" ry="9.9" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="178.45" cy="187.9" rx="11.55" ry="9.9" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="168" cy="180.2" rx="12.100000000000001" ry="10.450000000000001" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M257.65 200Q278 229.15 298.35 200Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M255.45 200H300.55" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="264.8" cy="195.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="269.75" cy="195.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="274.7" cy="195.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="279.65" cy="195.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="284.6" cy="195.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="289.55" cy="195.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="168" cy="306" rx="15.950000000000001" ry="17.05" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M168 288.95L171.3 280.7" stroke="#b7e89f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="176.8" cy="284.55" rx="7.15" ry="3.3000000000000003" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="278" cy="306" rx="19.25" ry="11.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M296.7 306L309.35 293.9V318.1Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="269.2" cy="304.35" rx="1.6500000000000001" ry="1.6500000000000001" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M356 247L439 247" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M430.0 242.7L439 247L430.0 251.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="627" cy="217" rx="38" ry="44" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M593 264Q627 299 661 264L685 362H569Z" stroke="#c1b2ea" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="402" font-size="20" fill="#c1b2ea" text-anchor="start">不同發展與照護情境</text><text x="75" y="437" font-size="18" fill="#e3e9e2" text-anchor="start">生命階段改變需求；成人餐盤不能直接縮小套用嬰幼兒。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>