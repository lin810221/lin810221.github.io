<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu15-title nu15-desc"><title id="nu15-title">油脂混合與標示零的讀法</title><desc id="nu15-desc">同一油脂可含多類脂肪酸，圖例不表示真實百分比；標示零也要回到制度修整及份量，不能推完全不存在。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15  /  油脂混合與標示零的讀法</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="123" y="183" width="70" height="20" rx="4" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="113" y="205" width="90" height="117" rx="14" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="158" y="263" font-size="18" fill="#ead68c" text-anchor="middle">油</text><rect x="321" y="142" width="199" height="221" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="420" y="184" font-size="22" fill="#b7e89f" text-anchor="middle">混合成分</text><rect x="344" y="211" width="21" height="24" rx="3" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="379" y="231" font-size="18" fill="#ead68c" text-anchor="start">飽和</text><rect x="344" y="257" width="21" height="24" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="379" y="277" font-size="18" fill="#9ac8e8" text-anchor="start">單元不飽和</text><rect x="344" y="303" width="21" height="24" rx="3" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="379" y="323" font-size="18" fill="#c1b2ea" text-anchor="start">多元不飽和</text><rect x="590" y="142" width="197" height="221" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="608" y="178" font-size="20" fill="#9ac8e8" text-anchor="start">標示 0</text><text x="610" y="221" font-size="17" fill="#e3e9e2" text-anchor="start">需查修整規則</text><text x="610" y="270" font-size="17" fill="#e3e9e2" text-anchor="start">不能推絕對無</text><text x="75" y="436" font-size="18" fill="#e3e9e2" text-anchor="start">顏色為分類圖例，不畫成某種油的真實固定比例。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>