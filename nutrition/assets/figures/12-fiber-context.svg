<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu12-title nu12-desc"><title id="nu12-title">纖維、腸道與耐受的關係</title><desc id="nu12-desc">腸腔內不同纖維與菌相、含水及個體條件互動；線段不代表單一纖維化學式，也不保證固定效果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12  /  纖維、腸道與耐受的關係</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M100 180Q175 128 230 190T352 188V352Q273 405 205 350T100 355Z" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="151" font-size="20" fill="#b7e89f" text-anchor="start">腸腔示意</text><path d="M135 215l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M187 215l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M239 215l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M291 215l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 257l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M187 257l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M239 257l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M291 257l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 299l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M187 299l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M239 299l17 10-9 19" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M377 265L453 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M444.0 260.7L453 265L444.0 269.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="621" cy="255" rx="120" ry="87" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="621" y="231" font-size="23" fill="#9ac8e8" text-anchor="middle">纖維特性</text><text x="621" y="275" font-size="23" fill="#9ac8e8" text-anchor="middle">菌相與耐受</text><text x="75" y="436" font-size="18" fill="#e3e9e2" text-anchor="start">種類、用量與時間不同，不是所有纖維的作用都相同。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>