<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu43-title nu43-desc"><title id="nu43-title">廚房動線與交叉污染</title><desc id="nu43-desc">生食處理與即食清潔區以虛線分開，手器具汁液可造成污染；圖是流程設計概念，不代表區域顏色能保證安全。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 43  /  廚房動線與交叉污染</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="55" y="135" width="335" height="258" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><rect x="472" y="135" width="335" height="258" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="222" y="178" font-size="24" fill="#eda894" text-anchor="middle">生食處理區</text><text x="640" y="178" font-size="24" fill="#b7e89f" text-anchor="middle">即食／清潔區</text><ellipse cx="210" cy="262" rx="38.5" ry="22.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M247.4 262L272.7 237.8V286.2Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="192.4" cy="258.7" rx="3.3000000000000003" ry="3.3000000000000003" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M640 297.2V247.7" stroke="#b7e89f" stroke-width="8.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="619.1" cy="237.8" rx="23.1" ry="19.8" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="660.9" cy="237.8" rx="23.1" ry="19.8" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="640" cy="222.4" rx="24.200000000000003" ry="20.900000000000002" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M425 120V413" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="90" y="364" font-size="20" fill="#eda894" text-anchor="start">器具、手與汁液</text><text x="506" y="364" font-size="20" fill="#b7e89f" text-anchor="start">避免交叉污染</text><text x="75" y="443" font-size="17" fill="#e3e9e2" text-anchor="start">區域是流程概念；清潔、生熟分離、烹調與冷藏需要共同落實。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>