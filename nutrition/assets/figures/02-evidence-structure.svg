<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu02-title nu02-desc"><title id="nu02-title">觀察到關係，還要找替代解釋</title><desc id="nu02-desc">飲食和結果之間有觀察關係，其他因素可能同時影響兩者；箭頭表示待檢驗的可能路徑，不宣告因果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02  /  觀察到關係，還要找替代解釋</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="220" cy="210" rx="65" ry="42" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="620" cy="210" rx="65" ry="42" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="220" y="216" font-size="25" fill="#b7e89f" text-anchor="middle">飲食</text><text x="620" y="216" font-size="25" fill="#9ac8e8" text-anchor="middle">結果</text><path d="M300 210L535 210" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M526.0 205.7L535 210L526.0 214.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="351" y="180" font-size="18" fill="#e3e9e2" text-anchor="start">觀察關係</text><ellipse cx="420" cy="347" rx="86" ry="41" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="420" y="354" font-size="22" fill="#c1b2ea" text-anchor="middle">其他因素</text><path d="M352 322L252 253" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M256.9 261.7L252 253L261.9 254.5" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M489 322L588 253" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M578.1 254.6L588 253L583.1 261.7" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="432" font-size="18" fill="#e3e9e2" text-anchor="start">另一條可能路徑、反向關係或選樣，也需要資料檢驗。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>