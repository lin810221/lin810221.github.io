<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu35-title nu35-desc"><title id="nu35-title">等能量份量與日常選擇情境</title><desc id="nu35-desc">大小不同的食物作能量密度概念，不提供真實等量換算；等能量只固定一個維度，習慣還受環境與機會影響。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35  /  等能量份量與日常選擇情境</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="212" cy="218" rx="52.2" ry="55.800000000000004" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M212 162.2L222.8 135.2" stroke="#b7e89f" stroke-width="7.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="240.8" cy="147.8" rx="23.400000000000002" ry="10.8" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="585.4" cy="218.0" rx="8.8" ry="15.200000000000001" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="603.0" cy="209.2" rx="8.8" ry="15.200000000000001" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="620.6" cy="218.8" rx="8.8" ry="15.200000000000001" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="603.0" cy="231.6" rx="8.8" ry="15.200000000000001" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M125 345H690" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="302" font-size="22" fill="#eda894" text-anchor="middle">示意食物A</text><text x="603" y="302" font-size="22" fill="#ead68c" text-anchor="middle">示意食物B</text><text x="432" y="386" font-size="20" fill="#9ac8e8" text-anchor="middle">固定相同能量，不代表體積、飽足與營養相同</text><text x="75" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">沒有真實份量或能量數據；日常行為還需情境與可行性。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>