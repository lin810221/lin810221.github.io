<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu16-title nu16-desc"><title id="nu16-title">蛋白質、消化率與限制胺基酸</title><desc id="nu16-desc">不同胺基酸串聯作蛋白質概念，消化及參考模式影響品質評估；相對不足不是零，也不是成品或個人結果的直接分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16  /  蛋白質、消化率與限制胺基酸</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="85" cy="193" rx="20" ry="20" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M104 193L139 216" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="158" cy="216" rx="20" ry="20" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M177 216L212 193" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="231" cy="193" rx="20" ry="20" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M250 193L285 216" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="304" cy="216" rx="20" ry="20" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M323 216L358 193" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="377" cy="193" rx="20" ry="20" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M396 193L431 216" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="450" cy="216" rx="20" ry="20" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M469 216L504 193" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="523" cy="193" rx="20" ry="20" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M542 193L577 216" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="596" cy="216" rx="20" ry="20" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="80" y="135" font-size="23" fill="#b7e89f" text-anchor="start">胺基酸的種類、排列與供應</text><path d="M408 257L408 304" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M412.3 295.0L408 304L403.7 295.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="351" font-size="23" fill="#9ac8e8" text-anchor="start">消化率</text><text x="353" y="351" font-size="23" fill="#ead68c" text-anchor="start">參考模式</text><text x="576" y="351" font-size="23" fill="#c1b2ea" text-anchor="start">限制胺基酸</text><text x="75" y="434" font-size="18" fill="#e3e9e2" text-anchor="start">相對限制不等於不存在；品質評分也不是肌肉增加量。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>