<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu19-title nu19-desc"><title id="nu19-title">脂溶性維生素與吸收條件</title><desc id="nu19-desc">脂質相關聚集體作吸收環境概念，維生素來源及原始單位仍需辨識，圖不計算個人可利用率或補充量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19  /  脂溶性維生素與吸收條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="259" cy="249" rx="112" ry="112" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="368.0" cy="249.0" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="353.3967690125038" cy="303.5" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="313.5" cy="343.3967690125038" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="259.0" cy="358.0" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="204.50000000000003" cy="343.3967690125038" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="164.60323098749618" cy="303.5" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="150.0" cy="249.0" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="164.6032309874962" cy="194.5" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="204.49999999999994" cy="154.6032309874962" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="259.0" cy="140.0" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="313.5" cy="154.6032309874962" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="353.3967690125038" cy="194.49999999999994" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="259" y="244" font-size="23" fill="#ead68c" text-anchor="middle">脂質與</text><text x="259" y="280" font-size="23" fill="#ead68c" text-anchor="middle">脂溶性成分</text><path d="M400 250L490 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M481.0 245.7L490 250L481.0 254.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="525" y="177" font-size="23" fill="#9ac8e8" text-anchor="start">吸收條件</text><text x="525" y="238" font-size="20" fill="#e3e9e2" text-anchor="start">來源與原始單位</text><text x="525" y="296" font-size="20" fill="#e3e9e2" text-anchor="start">保存與處理</text><text x="525" y="354" font-size="20" fill="#e3e9e2" text-anchor="start">補充需看情境</text><text x="75" y="437" font-size="18" fill="#e3e9e2" text-anchor="start">概念聚集體示意，非比例；不能由一張圖給個人吸收率。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>