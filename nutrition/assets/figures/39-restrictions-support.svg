<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu39-title nu39-desc"><title id="nu39-title">飲食限制、替代與專業合作</title><desc id="nu39-desc">同一餐可能有過敏、強化、質地及臨床限制，需求不等於單純刪除某類；示意不要求所有人採相同限制。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 39  /  飲食限制、替代與專業合作</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="131" y="179" width="48" height="71" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M131 179L143 162H171L179 179" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="222" font-size="20" fill="#9ac8e8" text-anchor="middle">乳</text><path d="M336 189Q372 172 387 211Q376 247 347 233Q365 216 336 189" stroke="#c1b2ea" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M518 211Q555 264 592 211Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M514 211H596" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="531" cy="202" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="540" cy="202" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="549" cy="202" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="558" cy="202" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="567" cy="202" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="576" cy="202" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M750 243V198" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="731" cy="189" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="769" cy="189" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="750" cy="175" rx="22" ry="19" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="155" y="310" font-size="20" fill="#eda894" text-anchor="middle">過敏限制</text><text x="359" y="310" font-size="20" fill="#c1b2ea" text-anchor="middle">強化資訊</text><text x="555" y="310" font-size="20" fill="#ead68c" text-anchor="middle">質地與吞嚥</text><text x="750" y="310" font-size="20" fill="#9ac8e8" text-anchor="middle">疾病情境</text><path d="M88 361H779" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="413" font-size="19" fill="#e3e9e2" text-anchor="start">先辨需要保留的功能，再和適當專業確認調整與缺口。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>