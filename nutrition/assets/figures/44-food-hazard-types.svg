<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu44-title nu44-desc"><title id="nu44-title">過敏、耐受與烹調問題分開</title><desc id="nu44-desc">一盤料理需同時辨識配方接觸、時間溫度與耐受等不同問題，圖不暗示烹調能通用去除所有過敏原。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 44  /  過敏、耐受與烹調問題分開</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="266" cy="259" rx="115" ry="115" stroke="#637f6a" fill="#17251e" stroke-width="3"/><ellipse cx="266" cy="259" rx="98" ry="98" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M266 161V357M168 259H364" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M209 228.6V203.85" stroke="#b7e89f" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="198.55" cy="198.9" rx="11.55" ry="9.9" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="219.45" cy="198.9" rx="11.55" ry="9.9" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="209" cy="191.2" rx="12.100000000000001" ry="10.450000000000001" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M298.65 211Q319 240.15 339.35 211Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.45 211H341.55" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="305.8" cy="206.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="310.75" cy="206.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="315.7" cy="206.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="320.65" cy="206.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="325.6" cy="206.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="330.55" cy="206.05" rx="3.8500000000000005" ry="1.6500000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="209" cy="317" rx="15.950000000000001" ry="17.05" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M209 299.95L212.3 291.7" stroke="#b7e89f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="217.8" cy="295.55" rx="7.15" ry="3.3000000000000003" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="319" cy="317" rx="19.25" ry="11.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M337.7 317L350.35 304.9V329.1Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="310.2" cy="315.35" rx="1.6500000000000001" ry="1.6500000000000001" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><rect x="496" y="134" width="274" height="260" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="520" y="177" font-size="22" fill="#9ac8e8" text-anchor="start">同一料理，不同問題</text><text x="520" y="237" font-size="19" fill="#e3e9e2" text-anchor="start">過敏原：配方與接觸</text><text x="520" y="294" font-size="19" fill="#e3e9e2" text-anchor="start">微生物：時間與溫度</text><text x="520" y="351" font-size="19" fill="#e3e9e2" text-anchor="start">耐受：不同生理機制</text><text x="75" y="442" font-size="18" fill="#e3e9e2" text-anchor="start">去除過敏原、充分烹調和個人耐受不是同一件事。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>