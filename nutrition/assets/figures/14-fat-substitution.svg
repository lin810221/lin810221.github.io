<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu14-title nu14-desc"><title id="nu14-title">替代需要保留比較條件</title><desc id="nu14-desc">油、堅果與魚作替代來源示意，等能量不保證其他營養與作用相同；Omega-3成員也需分開，箭頭不是通用食譜。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14  /  替代需要保留比較條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="134" y="180" width="32" height="22" rx="3" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="124" y="202" width="52" height="65" rx="8" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M132 234H168" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 224L328 224" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M319.0 219.7L328 224L319.0 228.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="408" cy="224" rx="11" ry="19" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="430" cy="213" rx="11" ry="19" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="452" cy="225" rx="11" ry="19" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="430" cy="241" rx="11" ry="19" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M515 224L602 224" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M593.0 219.7L602 224L593.0 228.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="706" cy="224" rx="35" ry="20" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M740 224L763 202V246Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="690" cy="221" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="150" y="329" font-size="22" fill="#ead68c" text-anchor="middle">原來源</text><text x="430" y="329" font-size="22" fill="#b7e89f" text-anchor="middle">替代來源</text><text x="706" y="329" font-size="22" fill="#9ac8e8" text-anchor="middle">另一類來源</text><path d="M90 385H765" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="432" font-size="17" fill="#e3e9e2" text-anchor="start">等能量只固定一個維度；ALA、EPA、DHA也不是同一種分子。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>