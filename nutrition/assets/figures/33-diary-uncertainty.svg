<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu33-title nu33-desc"><title id="nu33-title">日誌完整性與不確定範圍</title><desc id="nu33-desc">日曆有紀錄與未知格，份量和資料來源誤差需另列；缺漏不是零，也不能以小數位消除未量到的資訊。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 33  /  日誌完整性與不確定範圍</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="128" width="478" height="280" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="90" y="166" font-size="24" fill="#9ac8e8" text-anchor="start">部分飲食紀錄</text><rect x="90" y="194" width="66" height="43" rx="6" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="123" y="223" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="174" y="194" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="207" y="223" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="258" y="194" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="291" y="223" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="342" y="194" width="66" height="43" rx="6" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="375" y="223" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="426" y="194" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="459" y="223" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="90" y="256" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="123" y="285" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="174" y="256" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="207" y="285" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="258" y="256" width="66" height="43" rx="6" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="291" y="285" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="342" y="256" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="375" y="285" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="426" y="256" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="459" y="285" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="90" y="318" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="123" y="347" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="174" y="318" width="66" height="43" rx="6" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="207" y="347" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="258" y="318" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="291" y="347" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="342" y="318" width="66" height="43" rx="6" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="375" y="347" font-size="18" fill="#b7e89f" text-anchor="middle">有記</text><rect x="426" y="318" width="66" height="43" rx="6" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="459" y="347" font-size="18" fill="#ead68c" text-anchor="middle">?</text><text x="593" y="180" font-size="22" fill="#e3e9e2" text-anchor="start">份量範圍</text><text x="593" y="243" font-size="22" fill="#e3e9e2" text-anchor="start">來源差異</text><text x="593" y="306" font-size="22" fill="#e3e9e2" text-anchor="start">已知分母</text><text x="593" y="369" font-size="22" fill="#e3e9e2" text-anchor="start">缺漏另列</text><text x="75" y="446" font-size="18" fill="#e3e9e2" text-anchor="start">? 是未記錄；不能用已知平均假裝全部都已實測。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>