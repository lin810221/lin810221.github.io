<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu05-title nu05-desc"><title id="nu05-title">吸收後的血液與淋巴分路</title><desc id="nu05-desc">跨腸上皮後，物質依特性進入血路或淋巴等路徑，門脈連到肝；肝參與代謝，不是所有物質先同一方式處理。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 05  /  吸收後的血液與淋巴分路</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M95 147V298Q140 228 180 298T266 298" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="126" font-size="21" fill="#b7e89f" text-anchor="start">腸腔 → 上皮</text><path d="M196 265L338 209" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M328.0 208.3L338 209L331.2 216.3" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 307L338 354" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.8 347.0L338 354L328.1 355.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 160Q476 126 550 174L511 231H390Z" stroke="#eda894" stroke-width="4" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="446" y="197" font-size="25" fill="#eda894" text-anchor="middle">肝</text><text x="591" y="189" font-size="21" fill="#eda894" text-anchor="start">門脈血路</text><text x="357" y="316" font-size="20" fill="#ead68c" text-anchor="start">部分脂質的淋巴路</text><path d="M514 224L673 272" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M665.6 265.2L673 272L663.1 273.6" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M356 354L675 354" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M666.0 349.7L675 354L666.0 358.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="672" y="315" font-size="20" fill="#e3e9e2" text-anchor="start">全身運送</text><text x="85" y="434" font-size="18" fill="#e3e9e2" text-anchor="start">兩路是代表性分工；不表示所有脂質都完全同路。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>