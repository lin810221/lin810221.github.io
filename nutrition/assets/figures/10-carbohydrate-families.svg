<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu10-title nu10-desc"><title id="nu10-title">醣類結構與糖來源的兩個問題</title><desc id="nu10-desc">鏈狀單位代表醣類結構概念，水果與糖罐提醒總糖、添加糖和自由糖需依來源及規範定義，不能由總糖一欄倒推出。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 10  /  醣類結構與糖來源的兩個問題</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="70" y="130" font-size="21" fill="#b7e89f" text-anchor="start">同一分子單位可形成不同長度與連接</text><ellipse cx="105" cy="215" rx="17" ry="17" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M123 215H135" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="155" cy="215" rx="17" ry="17" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M173 215H185" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="205" cy="215" rx="17" ry="17" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M223 215H235" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="255" cy="215" rx="17" ry="17" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M273 215H285" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="305" cy="215" rx="17" ry="17" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M323 215H335" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="355" cy="215" rx="17" ry="17" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M373 215H385" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="267" font-size="17" fill="#e3e9e2" text-anchor="start">示意鏈，不代表所有醣類同一結構</text><ellipse cx="538" cy="210" rx="29" ry="31" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M538 179L544 164" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="554" cy="171" rx="13" ry="6" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><rect x="655" y="160" width="70" height="20" rx="4" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="645" y="182" width="90" height="117" rx="14" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="690" y="240" font-size="18" fill="#ead68c" text-anchor="middle">糖</text><text x="505" y="321" font-size="20" fill="#eda894" text-anchor="start">食物中的總糖</text><text x="505" y="364" font-size="18" fill="#e3e9e2" text-anchor="start">添加／自由糖需看來源定義</text><text x="75" y="433" font-size="18" fill="#e3e9e2" text-anchor="start">糖、澱粉與纖維的分類，不等於把食物只按甜味分組。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>