<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu01-title nu01-desc"><title id="nu01-title">從食物看營養成分</title><desc id="nu01-desc">食物圖示和營養成分並列，提醒食物是多種成分及基質的組合，不是一種食物只提供一種營養素。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 01  /  從食物看營養成分</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M91 206Q128 259 165 206Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M87 206H169" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="104" cy="197" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="113" cy="197" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="122" cy="197" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="131" cy="197" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="140" cy="197" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="149" cy="197" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="128" cy="346" rx="35" ry="20" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M162 346L185 324V368Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="112" cy="343" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M395 238V193" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="376" cy="184" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="414" cy="184" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="395" cy="170" rx="22" ry="19" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><rect x="371" y="314" width="48" height="71" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M371 314L383 297H411L419 314" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="357" font-size="20" fill="#9ac8e8" text-anchor="middle">乳</text><text x="73" y="148" font-size="22" fill="#b7e89f" text-anchor="start">食物是組合</text><path d="M470 151V388" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M483 260L550 260" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M541.0 255.7L550 260L541.0 264.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="486" y="240" font-size="17" fill="#b7e89f" text-anchor="start">組成</text><text x="575" y="163" font-size="22" fill="#ead68c" text-anchor="start">醣類與脂質</text><text x="575" y="221" font-size="22" fill="#9ac8e8" text-anchor="start">蛋白質</text><text x="575" y="279" font-size="22" fill="#c1b2ea" text-anchor="start">維生素、礦物質</text><text x="575" y="337" font-size="22" fill="#b7e89f" text-anchor="start">水與其他成分</text><text x="75" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">分類便於理解；一種食物可同時含多種營養成分。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>