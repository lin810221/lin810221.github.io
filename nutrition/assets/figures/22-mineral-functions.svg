<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu22-title nu22-desc"><title id="nu22-title">骨、血液與礦物質的多重角色</title><desc id="nu22-desc">骨與紅血球作鈣磷鎂和鐵的代表性關係，吸收運送儲存及評估分開；不把骨密度或血紅素當全部營養狀態。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 22  /  骨、血液與礦物質的多重角色</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M191 151Q162 118 144 156Q124 190 172 204V337Q133 365 165 391Q197 417 215 379L218 203Q250 161 219 145Z" stroke="#ead68c" stroke-width="4" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="435" font-size="21" fill="#ead68c" text-anchor="start">骨與其他功能</text><ellipse cx="469" cy="248" rx="50" ry="36" stroke="#eda894" fill="#17251e" stroke-width="3"/><ellipse cx="469" cy="248" rx="26" ry="17" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="424" y="320" font-size="20" fill="#eda894" text-anchor="start">血紅素等</text><text x="600" y="153" font-size="21" fill="#9ac8e8" text-anchor="start">吸收、運送</text><text x="600" y="213" font-size="21" fill="#9ac8e8" text-anchor="start">儲存、利用</text><text x="600" y="273" font-size="21" fill="#9ac8e8" text-anchor="start">調節與回收</text><text x="600" y="333" font-size="21" fill="#9ac8e8" text-anchor="start">檢驗需脈絡</text><text x="75" y="113" font-size="19" fill="#e3e9e2" text-anchor="start">鈣與鐵：不同分子角色，不以同一個指標概括</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>