<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu36-title nu36-desc"><title id="nu36-title">活動、飲食供應與恢復支持</title><desc id="nu36-desc">食物供應與活動需求、恢復及生活支持相連，圖不計算個人低能量可用性或用單一症狀判定病況。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36  /  活動、飲食供應與恢復支持</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M108 255Q145 308 182 255Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 255H186" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="121" cy="246" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="130" cy="246" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="139" cy="246" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="148" cy="246" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="157" cy="246" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="166" cy="246" rx="7" ry="3" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="145" cy="380" rx="35" ry="20" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M179 380L202 358V402Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="129" cy="377" rx="3" ry="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M215 275L323 275" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M314.0 270.7L323 275L314.0 279.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="446" cy="245" rx="91" ry="71" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M355 245H537" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="446" y="253" font-size="24" fill="#eda894" text-anchor="middle">活動需求</text><path d="M550 275L648 275" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.0 270.7L648 275L639.0 279.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="670" y="186" font-size="24" fill="#9ac8e8" text-anchor="start">供應</text><text x="670" y="249" font-size="24" fill="#b7e89f" text-anchor="start">恢復</text><text x="670" y="312" font-size="24" fill="#ead68c" text-anchor="start">生活支持</text><text x="75" y="128" font-size="23" fill="#e3e9e2" text-anchor="start">飲食、任務、恢復與身體條件一起看</text><text x="75" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">不由簡圖計算個人能量可用性、訓練量或轉介門檻。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>