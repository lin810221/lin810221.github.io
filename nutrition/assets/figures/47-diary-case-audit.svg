<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu47-title nu47-desc"><title id="nu47-title">飲食報告從原始紀錄核對</title><desc id="nu47-desc">原始紀錄連到資料核對，缺漏、零值與定義要分開；審核的目的是確認可支持什麼，不強迫所有欄位都有結論。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 47  /  飲食報告從原始紀錄核對</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="127" width="300" height="280" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="83" y="163" font-size="20" fill="#9ac8e8" text-anchor="start">三天部分紀錄</text><text x="88" y="202" font-size="19" fill="#e3e9e2" text-anchor="start">日期、食物、狀態</text><text x="88" y="254" font-size="19" fill="#e3e9e2" text-anchor="start">重量、來源、單位</text><text x="88" y="306" font-size="19" fill="#e3e9e2" text-anchor="start">? 未知，0另有意義</text><path d="M390 264L465 264" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M456.0 259.7L465 264L456.0 268.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="627" cy="244" rx="120" ry="94" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="627" y="216" font-size="23" fill="#9ac8e8" text-anchor="middle">對照原始記錄</text><text x="627" y="260" font-size="21" fill="#9ac8e8" text-anchor="middle">檢查定義與分母</text><text x="627" y="306" font-size="20" fill="#9ac8e8" text-anchor="middle">留下未解問題</text><text x="75" y="443" font-size="18" fill="#e3e9e2" text-anchor="start">算得出數字不代表輸入完整，也不代表問題定義正確。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>