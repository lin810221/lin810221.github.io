<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu21-title nu21-desc"><title id="nu21-title">維生素來源、當量與評估</title><desc id="nu21-desc">天然食物、強化和補充來源並列，提醒當量換算與上限的來源範圍不同；食物處理及狀態評估需另有資料。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21  /  維生素來源、當量與評估</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M150 258.4V204.4" stroke="#b7e89f" stroke-width="9.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="127.2" cy="193.6" rx="25.2" ry="21.599999999999998" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="172.8" cy="193.6" rx="25.2" ry="21.599999999999998" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="150" cy="176.8" rx="26.4" ry="22.8" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><rect x="315" y="165" width="70" height="20" rx="4" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="305" y="187" width="90" height="117" rx="14" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="350" y="245" font-size="18" fill="#c1b2ea" text-anchor="middle">強化</text><rect x="525" y="165" width="70" height="20" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="515" y="187" width="90" height="117" rx="14" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="560" y="245" font-size="18" fill="#9ac8e8" text-anchor="middle">補充</text><ellipse cx="742" cy="220" rx="29" ry="31" stroke="#eda894" fill="#17251e" stroke-width="3"/><path d="M742 189L748 174" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="758" cy="181" rx="13" ry="6" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="150" y="322" font-size="20" fill="#b7e89f" text-anchor="middle">食物來源</text><text x="350" y="322" font-size="20" fill="#c1b2ea" text-anchor="middle">原始含量</text><text x="560" y="322" font-size="20" fill="#9ac8e8" text-anchor="middle">指定形式</text><text x="740" y="322" font-size="20" fill="#eda894" text-anchor="middle">處理條件</text><text x="75" y="390" font-size="18" fill="#e3e9e2" text-anchor="start">DFE換算和來源限定上限，要用不同問題的正確分母。</text><text x="75" y="434" font-size="18" fill="#e3e9e2" text-anchor="start">來源、製備與身體狀態不可由食品名稱直接確定。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>