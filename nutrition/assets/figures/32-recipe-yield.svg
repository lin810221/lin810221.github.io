<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu32-title nu32-desc"><title id="nu32-title">生熟重量、產率與採買</title><desc id="nu32-desc">原料進鍋後水分及重量可改變，產率與營養保留率不同，規劃還需成本及可取得條件；示意碗量不是實測比例。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32  /  生熟重量、產率與採買</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M100.6 220Q145 283.6 189.4 220Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M95.80000000000001 220H194.2" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="116.2" cy="209.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="127.0" cy="209.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="137.8" cy="209.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="148.6" cy="209.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="159.4" cy="209.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="170.2" cy="209.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M228 220L337 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M328.0 215.7L337 220L328.0 224.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="357" y="180" width="172" height="95" rx="25" stroke="#eda894" fill="#17251e" stroke-width="2"/><path d="M370 171H516M527 219H587" stroke="#eda894" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="445" y="327" font-size="22" fill="#eda894" text-anchor="middle">烹調與水分變化</text><path d="M601 220L659 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M650.0 215.7L659 220L650.0 224.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M716.25 220Q744 259.75 771.75 220Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M713.25 220H774.75" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="726.0" cy="213.25" rx="5.25" ry="2.25" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="732.75" cy="213.25" rx="5.25" ry="2.25" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="739.5" cy="213.25" rx="5.25" ry="2.25" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="746.25" cy="213.25" rx="5.25" ry="2.25" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="753.0" cy="213.25" rx="5.25" ry="2.25" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="759.75" cy="213.25" rx="5.25" ry="2.25" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="75" y="391" font-size="20" fill="#e3e9e2" text-anchor="start">先記原料與產出，再分重量、營養與成本。</text><text x="75" y="437" font-size="18" fill="#e3e9e2" text-anchor="start">生熟重量改變不表示營養憑空增加；保留率和產率不同。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>