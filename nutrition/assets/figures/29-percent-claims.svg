<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu29-title nu29-desc"><title id="nu29-title">每日參考值百分比與宣稱</title><desc id="nu29-desc">產品量除通用參考分母得到百分比，與個人需要及產品健康宣稱的證據是不同問題，不設健康評分或推薦。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 29  /  每日參考值百分比與宣稱</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="70" y="137" width="270" height="246" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="94" y="181" font-size="24" fill="#9ac8e8" text-anchor="start">產品提供量</text><path d="M95 237H313" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="286" font-size="23" fill="#9ac8e8" text-anchor="start">通用參考分母</text><text x="94" y="345" font-size="22" fill="#9ac8e8" text-anchor="start">再乘100%</text><path d="M366 254L460 254" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.0 249.7L460 254L451.0 258.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="507" y="137" width="287" height="246" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="525" y="173" font-size="20" fill="#9ac8e8" text-anchor="start">宣稱還需核對</text><text x="527" y="214" font-size="19" fill="#e3e9e2" text-anchor="start">數字、成分與規則</text><text x="527" y="264" font-size="19" fill="#e3e9e2" text-anchor="start">證據與核准範圍</text><text x="527" y="316" font-size="19" fill="#e3e9e2" text-anchor="start">不是個人需要量</text><text x="75" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">百分比是特定分母的比較，廣告文字不會自動增加證據。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>