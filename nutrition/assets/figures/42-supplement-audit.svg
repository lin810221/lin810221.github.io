<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu42-title nu42-desc"><title id="nu42-title">補充品與一頁證據地圖</title><desc id="nu42-desc">產品經查證對照身份含量、族群結果及成本限制，放大鏡代表證據核對不是認證標章，也不推個人推薦。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 42  /  補充品與一頁證據地圖</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="142" y="178" width="70" height="20" rx="4" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="132" y="200" width="90" height="117" rx="14" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="177" y="258" font-size="18" fill="#ead68c" text-anchor="middle">產品</text><ellipse cx="432" cy="232" rx="71" ry="71" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M482 282L532 332" stroke="#9ac8e8" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="432" y="240" font-size="24" fill="#9ac8e8" text-anchor="middle">查證</text><rect x="583" y="132" width="209" height="270" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="601" y="168" font-size="20" fill="#9ac8e8" text-anchor="start">證據地圖</text><text x="604" y="206" font-size="19" fill="#e3e9e2" text-anchor="start">身份、含量</text><text x="604" y="257" font-size="19" fill="#e3e9e2" text-anchor="start">族群、結果</text><text x="604" y="308" font-size="19" fill="#e3e9e2" text-anchor="start">成本、限制</text><text x="75" y="431" font-size="18" fill="#e3e9e2" text-anchor="start">能畫出機制不等於人體有效；查核要回到具體主張與來源。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>