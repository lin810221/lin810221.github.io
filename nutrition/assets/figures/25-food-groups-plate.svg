t x="708" y="262" font-size="20" fill="#ead68c" text-anchor="middle">堅果種子</text><text x="500" y="331" font-size="19" fill="#e3e9e2" text-anchor="start">盤內：穀、菜、果、豆魚蛋肉</text><text x="500" y="377" font-size="19" fill="#e3e9e2" text-anchor="start">分類與份量是不同問題</text><text x="76" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">原創六類食物觀察圖；不是官方比例複製或每人固定餐盤。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>