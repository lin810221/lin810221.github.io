<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu34-title nu34-desc"><title id="nu34-title">食慾訊號與身體組成</title><desc id="nu34-desc">腸道、中樞和環境共同影響食慾，體重變化還含不同組成與測量條件，不把所有結果都歸個人意志。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34  /  食慾訊號與身體組成</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M144 201Q207 171 219 229Q211 279 155 262Z" stroke="#eda894" stroke-width="4" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="415" cy="182" rx="67" ry="48" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M405 137Q423 118 442 140" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 220L332 185" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.0 184.3L332 185L325.3 192.4" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M328 210L245 244" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M255.0 244.6L245 244L251.7 236.6" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 185L578 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M571.0 212.9L578 220L568.1 221.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M578 246L480 211" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M487.0 218.1L480 211L489.9 209.9" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="173" width="180" height="101" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="690" y="211" font-size="22" fill="#9ac8e8" text-anchor="middle">環境與經驗</text><text x="690" y="245" font-size="18" fill="#9ac8e8" text-anchor="middle">也影響行為</text><text x="80" y="338" font-size="22" fill="#e3e9e2" text-anchor="start">腸道、身體狀態與中樞訊息互動</text><text x="80" y="387" font-size="20" fill="#e3e9e2" text-anchor="start">體重組成還分脂肪、肌肉、水分等不同量</text><text x="80" y="433" font-size="18" fill="#e3e9e2" text-anchor="start">一個體重或食慾感受，不能直接定位全部調節原因。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>