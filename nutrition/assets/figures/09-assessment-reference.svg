<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu09-title nu09-desc"><title id="nu09-title">飲食觀察與參考值用途</title><desc id="nu09-desc">日曆的已知與未知觀察對照不同參考值用途，未記錄不是零；需要量評估、規劃及上限不可共用同一門檻。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09  /  飲食觀察與參考值用途</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="70" y="125" width="390" height="279" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="93" y="162" font-size="23" fill="#9ac8e8" text-anchor="start">觀察窗與飲食紀錄</text><rect x="95" y="192" width="49" height="42" rx="5" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="119" y="219" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="162" y="192" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="186" y="219" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="229" y="192" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="253" y="219" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="296" y="192" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="320" y="219" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="363" y="192" width="49" height="42" rx="5" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="387" y="219" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="95" y="253" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="119" y="280" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="162" y="253" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="186" y="280" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="229" y="253" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="253" y="280" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="296" y="253" width="49" height="42" rx="5" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="320" y="280" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="363" y="253" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="387" y="280" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="95" y="314" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="119" y="341" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="162" y="314" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="186" y="341" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="229" y="314" width="49" height="42" rx="5" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="253" y="341" font-size="18" fill="#ead68c" text-anchor="middle">?</text><rect x="296" y="314" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="320" y="341" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><rect x="363" y="314" width="49" height="42" rx="5" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="387" y="341" font-size="18" fill="#b7e89f" text-anchor="middle">記</text><text x="526" y="168" font-size="23" fill="#ead68c" text-anchor="start">參考值的用途</text><text x="526" y="225" font-size="19" fill="#e3e9e2" text-anchor="start">需要分布的評估</text><text x="526" y="276" font-size="19" fill="#e3e9e2" text-anchor="start">規劃方向</text><text x="526" y="327" font-size="19" fill="#e3e9e2" text-anchor="start">不同來源的上限</text><text x="526" y="378" font-size="19" fill="#e3e9e2" text-anchor="start">不是同一條合格線</text><text x="75" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">? 是未取得資料，不是沒有吃；參考值也不能混用。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>