<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu04-title nu04-desc"><title id="nu04-title">食物走的管，與分泌走的路</title><desc id="nu04-desc">食物流經食道胃小腸大腸，消化酵素與其他分泌參與處理；肝膽胰不是食物依序流入的管腔。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 04  /  食物走的管，與分泌走的路</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M272 119V207" stroke="#ead68c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M274 205Q360 167 362 251Q348 287 288 268Z" stroke="#eda894" stroke-width="4" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M289 271L239 296" stroke="#ead68c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="186" y="287" width="208" height="130" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M216 315Q340 297 354 331T221 355 352 385" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M272 157L465 144" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="149" font-size="17" fill="#ead68c" text-anchor="start">食道</text><path d="M349 234L465 220" stroke="#eda894" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="225" font-size="17" fill="#eda894" text-anchor="start">胃：混合與處理</text><path d="M330 349L465 302" stroke="#b7e89f" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="307" font-size="17" fill="#b7e89f" text-anchor="start">小腸：重要吸收界面</text><path d="M392 316L465 380" stroke="#9ac8e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="385" font-size="17" fill="#9ac8e8" text-anchor="start">大腸：水鹽與內容物</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>