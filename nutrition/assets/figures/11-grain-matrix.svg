<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu11-title nu11-desc"><title id="nu11-title">穀粒結構與加工：GI之外的資訊</title><desc id="nu11-desc">穀粒的麩皮胚乳胚芽概念剖面，配合加工與餐食條件理解，不把全穀或某個GI值直接換成個人血糖曲線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11  /  穀粒結構與加工：GI之外的資訊</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="252" cy="256" rx="107" ry="133" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="252" cy="256" rx="81" ry="109" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><ellipse cx="264" cy="250" rx="61" ry="88" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="222" cy="328" rx="24" ry="26" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M148 223L108 143" stroke="#c1b2ea" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="148" font-size="17" fill="#c1b2ea" text-anchor="start">麩皮</text><path d="M274 230L465 173" stroke="#ead68c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="178" font-size="17" fill="#ead68c" text-anchor="start">胚乳</text><path d="M224 325L465 330" stroke="#b7e89f" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="335" font-size="17" fill="#b7e89f" text-anchor="start">胚芽</text><text x="466" y="230" font-size="19" fill="#e3e9e2" text-anchor="start">加工可改結構與成分</text><text x="466" y="276" font-size="19" fill="#e3e9e2" text-anchor="start">GI不是所有人的預測器</text><text x="75" y="432" font-size="18" fill="#e3e9e2" text-anchor="start">穀粒概念剖面；加工程度、份量、搭配和個體都要保留。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>