<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu23-title nu23-desc"><title id="nu23-title">元素、化合物與單位別混用</title><desc id="nu23-desc">NaCl提醒鈉與食鹽不是相同質量，微量元素仍有來源需要及上限條件；圖不提供個人補充或法規門檻。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 23  /  元素、化合物與單位別混用</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="147" width="228" height="220" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="179" y="191" font-size="37" fill="#9ac8e8" text-anchor="middle">NaCl</text><text x="179" y="246" font-size="25" fill="#9ac8e8" text-anchor="middle">鈉 ≠ 食鹽</text><text x="179" y="312" font-size="18" fill="#9ac8e8" text-anchor="middle">先看原始單位</text><path d="M372 146V377" stroke="#647b6a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="516" cy="244" rx="70" ry="53" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="516" y="250" font-size="22" fill="#c1b2ea" text-anchor="middle">微量元素</text><text x="628" y="168" font-size="21" fill="#e3e9e2" text-anchor="start">碘、鋅、硒等</text><text x="628" y="226" font-size="20" fill="#e3e9e2" text-anchor="start">來源與需要</text><text x="628" y="284" font-size="20" fill="#e3e9e2" text-anchor="start">上限有範圍</text><text x="628" y="342" font-size="20" fill="#e3e9e2" text-anchor="start">少量也需調節</text><text x="75" y="433" font-size="18" fill="#e3e9e2" text-anchor="start">化學名稱、元素量和制度規則，不可只憑數字大小混換。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>