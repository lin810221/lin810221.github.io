<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu30-title nu30-desc"><title id="nu30-title">從食品狀態到能量重建</title><desc id="nu30-desc">食物資料的生熟與版本連到能量重建，係數、其他成分和修整可影響差異，圖不將差異直接判成錯誤。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30  /  從食品狀態到能量重建</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="70" y="125" width="280" height="280" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="88" y="161" font-size="20" fill="#9ac8e8" text-anchor="start">原始成分與狀態</text><path d="M181.1 257Q207 294.1 232.9 257Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M178.3 257H235.7" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="190.2" cy="250.7" rx="4.8999999999999995" ry="2.0999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="196.5" cy="250.7" rx="4.8999999999999995" ry="2.0999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="202.8" cy="250.7" rx="4.8999999999999995" ry="2.0999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="209.1" cy="250.7" rx="4.8999999999999995" ry="2.0999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="215.4" cy="250.7" rx="4.8999999999999995" ry="2.0999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="221.7" cy="250.7" rx="4.8999999999999995" ry="2.0999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="91" y="366" font-size="18" fill="#e3e9e2" text-anchor="start">生／熟、每份、版本</text><path d="M373 260L468 260" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M459.0 255.7L468 260L459.0 264.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="125" width="282" height="280" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="525" y="168" font-size="22" fill="#ead68c" text-anchor="start">重建能量與核對</text><text x="525" y="224" font-size="20" fill="#e3e9e2" text-anchor="start">使用哪組係數？</text><text x="525" y="277" font-size="20" fill="#e3e9e2" text-anchor="start">是否有其他成分？</text><text x="525" y="330" font-size="20" fill="#e3e9e2" text-anchor="start">修整與資料來源？</text><text x="75" y="438" font-size="17" fill="#e3e9e2" text-anchor="start">數字不完全相等先查定義，不把差異直接當食品或標示造假。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>