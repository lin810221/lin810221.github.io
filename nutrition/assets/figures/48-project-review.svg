<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu48-title nu48-desc"><title id="nu48-title">資料、圖與解釋一起交付</title><desc id="nu48-desc">資料表、觀察圖和說明來源三份成果相互核對，保留假設與未知；圖柱為任意示意，不表示真實營養量或疾病機率。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 48  /  資料、圖與解釋一起交付</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="135" width="210" height="254" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="83" y="171" font-size="20" fill="#9ac8e8" text-anchor="start">資料表</text><rect x="326" y="135" width="210" height="254" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="344" y="171" font-size="20" fill="#9ac8e8" text-anchor="start">觀察圖</text><rect x="588" y="135" width="210" height="254" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="606" y="171" font-size="20" fill="#9ac8e8" text-anchor="start">說明與來源</text><path d="M86 224H250M86 274H250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M351 316V219M393 316V259M437 316V191M480 316V285" stroke="#9ac8e8" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="227" font-size="20" fill="#e3e9e2" text-anchor="start">假設與未知</text><text x="610" y="282" font-size="20" fill="#e3e9e2" text-anchor="start">版本與範圍</text><text x="610" y="337" font-size="20" fill="#e3e9e2" text-anchor="start">下一步</text><text x="75" y="442" font-size="18" fill="#e3e9e2" text-anchor="start">三份產物彼此一致才能追溯；可重現不等於個人健康認證。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>