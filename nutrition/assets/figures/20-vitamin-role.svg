<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu20-title nu20-desc"><title id="nu20-title">維生素D轉換與代謝輔因子</title><desc id="nu20-desc">日照皮膚來源及肝腎轉換作維生素D正常生理示意，B群的代謝參與和能量本身分開；不提供日照時間或個人劑量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20  /  維生素D轉換與代謝輔因子</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="102" cy="190" rx="33" ry="33" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M102 137V118M102 242V263M49 190H30M155 190H174" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="309" font-size="19" fill="#ead68c" text-anchor="start">皮膚來源</text><path d="M185 205L275 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.0 200.7L275 205L266.0 209.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 156Q357 130 428 167L400 235H291Z" stroke="#eda894" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="198" font-size="24" fill="#eda894" text-anchor="middle">肝</text><path d="M444 204L530 204" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M521.0 199.7L530 204L521.0 208.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M595 151Q536 144 545 219Q558 266 604 234Q566 213 606 193Z" stroke="#9ac8e8" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="205" font-size="20" fill="#9ac8e8" text-anchor="start">腎等處理</text><text x="75" y="361" font-size="21" fill="#e3e9e2" text-anchor="start">維生素D：來源 → 代謝轉換 → 作用</text><text x="75" y="411" font-size="18" fill="#e3e9e2" text-anchor="start">B群參與代謝作用，不等於本身直接提供食物能量。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>