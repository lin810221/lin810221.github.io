<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu08-title nu08-desc"><title id="nu08-title">份量的範圍，比假精準更有用</title><desc id="nu08-desc">三個不同碗量代表估計的不確定範圍，不是測得的熱量或體重預測；長時間變化還有身體調節及資料條件。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08  /  份量的範圍，比假精準更有用</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M151.7 203Q185 250.7 218.3 203Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M148.1 203H221.9" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="163.4" cy="194.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="171.5" cy="194.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="179.6" cy="194.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="187.7" cy="194.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="195.8" cy="194.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="203.9" cy="194.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M383.75 203Q430 269.25 476.25 203Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M378.75 203H481.25" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="400.0" cy="191.75" rx="8.75" ry="3.75" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="411.25" cy="191.75" rx="8.75" ry="3.75" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="422.5" cy="191.75" rx="8.75" ry="3.75" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="433.75" cy="191.75" rx="8.75" ry="3.75" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="445.0" cy="191.75" rx="8.75" ry="3.75" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="456.25" cy="191.75" rx="8.75" ry="3.75" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M623.8 203Q683 287.8 742.2 203Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M617.4 203H748.6" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="644.6" cy="188.6" rx="11.200000000000001" ry="4.800000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="659.0" cy="188.6" rx="11.200000000000001" ry="4.800000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="673.4" cy="188.6" rx="11.200000000000001" ry="4.800000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="687.8" cy="188.6" rx="11.200000000000001" ry="4.800000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="702.2" cy="188.6" rx="11.200000000000001" ry="4.800000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="716.6" cy="188.6" rx="11.200000000000001" ry="4.800000000000001" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="185" y="295" font-size="21" fill="#b7e89f" text-anchor="middle">較小份量</text><text x="430" y="295" font-size="21" fill="#9ac8e8" text-anchor="middle">估計份量</text><text x="683" y="295" font-size="21" fill="#ead68c" text-anchor="middle">較大份量</text><path d="M152 358H707" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 345V371M707 345V371" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="400" font-size="19" fill="#9ac8e8" text-anchor="middle">先保留範圍，再考慮長時間累積與身體調節</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>