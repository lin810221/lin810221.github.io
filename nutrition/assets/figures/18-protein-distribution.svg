<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu18-title nu18-desc"><title id="nu18-title">一日分布與整體供應</title><desc id="nu18-desc">三個餐次及其食物示意協助對照總量、分布、來源與缺漏；不是固定餐次或每餐蛋白質目標，也不診斷植物飲食不足。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18  /  一日分布與整體供應</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M129.3 198.2Q161.7 182.9 175.2 218Q165.3 250.4 139.2 237.8Q155.4 222.5 129.3 198.2" stroke="#c1b2ea" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="314" font-size="23" fill="#b7e89f" text-anchor="middle">早餐</text><path d="M80 348H220" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="218" rx="31.5" ry="18.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M460.6 218L481.3 198.2V237.8Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="415.6" cy="215.3" rx="2.7" ry="2.7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="430" y="314" font-size="23" fill="#b7e89f" text-anchor="middle">午餐</text><path d="M360 348H500" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M676.7 218Q710 265.7 743.3 218Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M673.1 218H746.9" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="688.4" cy="209.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="696.5" cy="209.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="704.6" cy="209.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="712.7" cy="209.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="720.8" cy="209.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="728.9" cy="209.9" rx="6.3" ry="2.7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="710" y="314" font-size="23" fill="#b7e89f" text-anchor="middle">晚餐</text><path d="M640 348H780" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="410" font-size="19" fill="#e3e9e2" text-anchor="start">先看一日總量與資料完整，再看分布及來源組合。</text><text x="75" y="444" font-size="17" fill="#e3e9e2" text-anchor="start">三餐僅為虛構排列，不代表每人固定餐數或蛋白質處方。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>