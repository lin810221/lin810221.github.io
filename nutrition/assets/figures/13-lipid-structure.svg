<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu13-title nu13-desc"><title id="nu13-title">三酸甘油酯與脂肪酸特徵</title><desc id="nu13-desc">一條甘油主幹接三條脂肪酸作結構概念，右側分清雙鍵數量與幾何，並不代表每條脂肪酸具有圖中相同構造。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 13  /  三酸甘油酯與脂肪酸特徵</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M167 145V340" stroke="#ead68c" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M177 171H295L330 155 365 171 401 155 438 171" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M177 242H295L330 226 365 242 401 226 438 242" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M177 313H295L330 297 365 313 401 297 438 313" stroke="#eda894" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="393" font-size="22" fill="#ead68c" text-anchor="start">甘油＋三條脂肪酸</text><text x="511" y="152" font-size="23" fill="#eda894" text-anchor="start">脂肪酸特徵</text><text x="511" y="209" font-size="21" fill="#e3e9e2" text-anchor="start">碳鏈與雙鍵</text><text x="511" y="266" font-size="21" fill="#e3e9e2" text-anchor="start">cis／trans 幾何</text><text x="511" y="323" font-size="21" fill="#e3e9e2" text-anchor="start">油脂通常是混合物</text><text x="75" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">結構概念圖；膽固醇不是脂肪酸，不能只看總脂肪。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>