<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu27-title nu27-desc"><title id="nu27-title">食物替代先看要保留的功能</title><desc id="nu27-desc">乳品和植物來源示意替代比較，需查蛋白質、鈣、強化及限制，圖不宣告所有植物飲等同乳品或所有素食相同。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27  /  食物替代先看要保留的功能</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="140.6" y="184.8" width="52.800000000000004" height="78.10000000000001" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M140.6 184.8L153.8 166.1H184.6L193.4 184.8" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="167" y="232.1" font-size="22" fill="#9ac8e8" text-anchor="middle">乳</text><path d="M241 220L339 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.0 215.7L339 220L330.0 224.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M404.7 195.8Q444.3 177.1 460.8 220Q448.7 259.6 416.8 244.2Q436.6 225.5 404.7 195.8" stroke="#c1b2ea" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="330" font-size="22" fill="#9ac8e8" text-anchor="middle">原本的功能</text><text x="430" y="330" font-size="22" fill="#c1b2ea" text-anchor="middle">替代品提供什麼</text><rect x="590" y="129" width="214" height="269" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="608" y="165" font-size="20" fill="#9ac8e8" text-anchor="start">查標示與來源</text><text x="610" y="208" font-size="18" fill="#e3e9e2" text-anchor="start">蛋白質、鈣等</text><text x="610" y="255" font-size="18" fill="#e3e9e2" text-anchor="start">是否強化</text><text x="610" y="303" font-size="18" fill="#e3e9e2" text-anchor="start">過敏與分類</text><text x="75" y="438" font-size="18" fill="#e3e9e2" text-anchor="start">顏色或名稱相似，不表示營養、用途及限制都相同。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>