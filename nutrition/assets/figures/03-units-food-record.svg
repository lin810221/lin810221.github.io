<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu03-title nu03-desc"><title id="nu03-title">先把食物與分母連起來</title><desc id="nu03-desc">可食重量接到帶有每100克或每份定義的食品資料，單位與版本需要同時保存，圖不預測吸收或需要量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 03  /  先把食物與分母連起來</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M127.6 228Q172 291.6 216.4 228Z" stroke="#ead68c" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><path d="M122.80000000000001 228H221.2" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="143.2" cy="217.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="154.0" cy="217.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="164.8" cy="217.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="175.6" cy="217.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="186.4" cy="217.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="197.2" cy="217.2" rx="8.4" ry="3.5999999999999996" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><rect x="85" y="325" width="185" height="64" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="177" y="367" font-size="22" fill="#ead68c" text-anchor="middle">可食重量 g</text><path d="M295 245L405 245" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M396.0 240.7L405 245L396.0 249.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="462" y="125" width="300" height="285" rx="6" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="480" y="161" font-size="20" fill="#9ac8e8" text-anchor="start">同一筆食品資料</text><text x="482" y="201" font-size="18" fill="#e3e9e2" text-anchor="start">每100 g：共同分母</text><text x="482" y="241" font-size="18" fill="#e3e9e2" text-anchor="start">每份：份量有定義</text><text x="482" y="282" font-size="18" fill="#e3e9e2" text-anchor="start">單位：g、mg、kcal</text><text x="482" y="322" font-size="18" fill="#e3e9e2" text-anchor="start">版本與食品狀態</text><text x="75" y="439" font-size="18" fill="#e3e9e2" text-anchor="start">重量、成分濃度、攝取量和需要量是不同問題。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>