<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu41-title nu41-desc"><title id="nu41-title">來源限定的上限與交互作用</title><desc id="nu41-desc">食物、補充品和藥物並列，來源形式及交互作用各需核對；上限不是把名稱相似的所有數字相加，無個人劑量建議。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41  /  來源限定的上限與交互作用</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M150 260V215" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="131" cy="206" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="169" cy="206" rx="21" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="150" cy="192" rx="22" ry="19" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><rect x="311" y="173" width="70" height="20" rx="4" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="301" y="195" width="90" height="117" rx="14" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="346" y="253" font-size="18" fill="#ead68c" text-anchor="middle">補充</text><rect x="516" y="177" width="106" height="142" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M526 219H613" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="271" font-size="20" fill="#9ac8e8" text-anchor="middle">藥物</text><text x="718" y="193" font-size="23" fill="#c1b2ea" text-anchor="middle">來源</text><text x="718" y="247" font-size="23" fill="#c1b2ea" text-anchor="middle">形式</text><text x="718" y="301" font-size="21" fill="#c1b2ea" text-anchor="middle">交互作用</text><path d="M86 377H787" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="430" font-size="17" fill="#e3e9e2" text-anchor="start">上限要看適用來源；不同分子、單位和藥物條件不可直接相加。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>