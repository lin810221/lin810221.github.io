<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu17-title nu17-desc"><title id="nu17-title">需要量與食物來源的連接</title><desc id="nu17-desc">不同蛋白質食物來源並列，營養組成及需要量情境不同，圖不把每種食物畫成同體積等蛋白或固定個人劑量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 17  /  需要量與食物來源的連接</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M107.4 199.6Q150.6 179.2 168.6 226Q155.4 269.2 120.6 252.4Q142.2 232.0 107.4 199.6" stroke="#c1b2ea" stroke-width="3" fill="#17251e" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="337" cy="226" rx="38.5" ry="22.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M374.4 226L399.7 201.8V250.2Z" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="319.4" cy="222.7" rx="3.3000000000000003" ry="3.3000000000000003" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><rect x="513.6" y="190.8" width="52.800000000000004" height="78.10000000000001" rx="4" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M513.6 190.8L526.8 172.1H557.6L566.4 190.8" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="238.1" font-size="22" fill="#9ac8e8" text-anchor="middle">乳</text><ellipse cx="710.8" cy="226.0" rx="12.100000000000001" ry="20.900000000000002" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="735.0" cy="213.9" rx="12.100000000000001" ry="20.900000000000002" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="759.2" cy="227.1" rx="12.100000000000001" ry="20.900000000000002" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="735.0" cy="244.7" rx="12.100000000000001" ry="20.900000000000002" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="135" y="328" font-size="22" fill="#c1b2ea" text-anchor="middle">豆類</text><text x="337" y="328" font-size="22" fill="#9ac8e8" text-anchor="middle">魚等來源</text><text x="540" y="328" font-size="22" fill="#9ac8e8" text-anchor="middle">乳品</text><text x="735" y="328" font-size="22" fill="#ead68c" text-anchor="middle">堅果等</text><text x="75" y="400" font-size="20" fill="#e3e9e2" text-anchor="start">需要量：基準、活動、年齡與臨床情境</text><text x="75" y="440" font-size="17" fill="#e3e9e2" text-anchor="start">來源多樣不表示同體積、同克數、同營養；不提供個人處方。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>