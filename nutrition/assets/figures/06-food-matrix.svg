<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu06-title nu06-desc"><title id="nu06-title">食物基質與腸道條件</title><desc id="nu06-desc">營養成分被包在食物結構中，加工搭配及腸道條件影響釋出與利用；不把所有吸收效率設成固定比例。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 06  /  食物基質與腸道條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="127" width="310" height="261" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="90" y="165" font-size="22" fill="#b7e89f" text-anchor="start">完整食物基質</text><path d="M95 203V351" stroke="#547760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M133 203V351" stroke="#547760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M171 203V351" stroke="#547760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M209 203V351" stroke="#547760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M247 203V351" stroke="#547760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 203V351" stroke="#547760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M323 203V351" stroke="#547760" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="108" cy="223" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="174" cy="223" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="240" cy="223" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="306" cy="223" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="108" cy="268" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="174" cy="268" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="240" cy="268" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="306" cy="268" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="108" cy="313" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="174" cy="313" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="240" cy="313" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="306" cy="313" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M400 264L470 264" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M461.0 259.7L470 264L461.0 268.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="256" rx="113" ry="85" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="625" y="233" font-size="23" fill="#9ac8e8" text-anchor="middle">加工、搭配</text><text x="625" y="274" font-size="23" fill="#9ac8e8" text-anchor="middle">腸道與個體</text><text x="75" y="434" font-size="18" fill="#e3e9e2" text-anchor="start">分子相同，食物結構、可及性與耐受仍可能不同。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>