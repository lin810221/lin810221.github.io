<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="nu24-title nu24-desc"><title id="nu24-title">水分區室與整合礦物質評估</title><desc id="nu24-desc">細胞內外水與離子區室連到攝取流失及調節，區室比例為概念而非個人固定值，完整評估需來源與背景。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 24  /  水分區室與整合礦物質評估</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="250" cy="240" rx="126" ry="125" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><rect x="185" y="183" width="127" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="250" y="229" font-size="22" fill="#b7e89f" text-anchor="middle">細胞內</text><text x="250" y="274" font-size="20" fill="#b7e89f" text-anchor="middle">水與離子</text><text x="250" y="393" font-size="18" fill="#9ac8e8" text-anchor="middle">細胞外另有血漿與組織液</text><path d="M395 235L491 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M482.0 230.7L491 235L482.0 239.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="159" font-size="22" fill="#9ac8e8" text-anchor="start">攝取與流失</text><text x="520" y="219" font-size="22" fill="#9ac8e8" text-anchor="start">腎臟與激素</text><text x="520" y="279" font-size="22" fill="#9ac8e8" text-anchor="start">食物及飲料</text><text x="520" y="339" font-size="22" fill="#9ac8e8" text-anchor="start">資料與條件</text><text x="75" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">區室非比例；飲水杯數不是全部體液與礦物質評估。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>