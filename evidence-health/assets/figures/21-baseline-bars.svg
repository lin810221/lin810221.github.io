<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-21-title ebh-21-desc"><title id="ebh-21-title">基線風險與效果的時間框架</title><desc id="ebh-21-desc">四條共同人數及共同時間的長條，高基線對照400介入300、低基線對照40介入30，皆每10000人一年內事件數；RR可外推是教學假設。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21 / 基線風險與效果的時間框架</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="72" y="120" font-size="20" fill="#e3e9e2" text-anchor="start">各10000人、一年不良事件；假定RR均可外推為0.75</text><text x="72" y="176" font-size="19" fill="#ead68c" text-anchor="start">高基線／對照</text><rect x="260" y="151" width="459.99999999999994" height="34" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="745" y="176" font-size="19" fill="#ead68c" text-anchor="start">400</text><text x="72" y="238" font-size="19" fill="#b7e89f" text-anchor="start">高基線／介入</text><rect x="260" y="213" width="345.0" height="34" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="745" y="238" font-size="19" fill="#b7e89f" text-anchor="start">300</text><text x="72" y="300" font-size="19" fill="#ead68c" text-anchor="start">低基線／對照</text><rect x="260" y="275" width="46.0" height="34" rx="2" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="745" y="300" font-size="19" fill="#ead68c" text-anchor="start">40</text><text x="72" y="362" font-size="19" fill="#b7e89f" text-anchor="start">低基線／介入</text><rect x="260" y="337" width="34.5" height="34" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="745" y="362" font-size="19" fill="#b7e89f" text-anchor="start">30</text><path d="M260 405H720" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="434" font-size="18" fill="#9ac8e8" text-anchor="middle">0</text><text x="375" y="434" font-size="18" fill="#9ac8e8" text-anchor="middle">100</text><text x="490" y="434" font-size="18" fill="#9ac8e8" text-anchor="middle">200</text><text x="605" y="434" font-size="18" fill="#9ac8e8" text-anchor="middle">300</text><text x="720" y="434" font-size="18" fill="#9ac8e8" text-anchor="middle">400</text><text x="72" y="461" font-size="18" fill="#e3e9e2" text-anchor="start">同相對效果，絕對少100人或10人；時間不能任意外推。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>