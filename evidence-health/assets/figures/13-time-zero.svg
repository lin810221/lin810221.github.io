<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-13-title ebh-13-desc"><title id="ebh-13-title">時間零點：不能讓未來資格偷渡</title><desc id="ebh-13-desc">錯誤示例把起點到開始介入的存活時間歸給未來使用者，正確設計需對齊資格、策略及追蹤起點，而非任意刪除早期事件。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 13 / 時間零點：不能讓未來資格偷渡</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">黃色段為錯誤歸類的等待時間；不表示介入具有保護作用。</text><path d="M95 205H780" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 355H780" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="177" width="290" height="57" rx="12" stroke="#ead68c" fill="#ead68c30" stroke-width="2"/><text x="105" y="152" font-size="21" fill="#ead68c" text-anchor="start">錯誤：用未來開始介入決定基線組別</text><text x="100" y="272" font-size="19" fill="#e3e9e2" text-anchor="start">起點</text><text x="390" y="272" font-size="19" fill="#e3e9e2" text-anchor="start">後來開始</text><text x="590" y="272" font-size="19" fill="#e3e9e2" text-anchor="start">追蹤事件</text><path d="M390 185V225" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="325" font-size="21" fill="#b7e89f" text-anchor="start">修正：資格、策略及追蹤起點需對齊</text><path d="M390 338V372" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="410" font-size="18" fill="#e3e9e2" text-anchor="start">共同起點另有設計條件；不是換標籤即消除混雜。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>