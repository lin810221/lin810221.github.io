<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-11-title ebh-11-desc"><title id="ebh-11-title">介入後事件與缺失結果要分開</title><desc id="ebh-11-desc">每人先有分配，之後可能繼續、停用或轉換；停用後結果仍可能被量到，問號才表示結果未知。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 11 / 介入後事件與缺失結果要分開</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">分支是可能的路徑；停用是事件，資料缺失是未觀察到結果，概念不同。</text><rect x="70.0" y="241" width="160" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="150" y="277" font-size="21" fill="#9ac8e8" text-anchor="middle">分配A</text><path d="M250 270L365 158" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.5 161.2L365 158L361.6 167.4" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 270L365 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M356.0 265.7L365 270L356.0 274.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 270L365 382" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M361.6 372.6L365 382L355.5 378.8" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="365.0" y="129" width="210" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="470" y="165" font-size="21" fill="#b7e89f" text-anchor="middle">繼續原介入</text><rect x="365.0" y="241" width="210" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="470" y="277" font-size="21" fill="#ead68c" text-anchor="middle">停用／轉換</text><rect x="365.0" y="353" width="210" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="470" y="389" font-size="21" fill="#c1b2ea" text-anchor="middle">無後續量測</text><path d="M590 158L670 158" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.0 153.7L670 158L661.0 162.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 270L670 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.0 265.7L670 270L661.0 274.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="705" y="166" font-size="20" fill="#b7e89f" text-anchor="start">結果已量到</text><text x="705" y="278" font-size="19" fill="#ead68c" text-anchor="start">結果也可量到</text><text x="725" y="390" font-size="35" fill="#c1b2ea" text-anchor="start">？</text><text x="70" y="457" font-size="19" fill="#e3e9e2" text-anchor="start">先定義要估什麼，再選分析；ITT不會讓未知結果自動出現。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>