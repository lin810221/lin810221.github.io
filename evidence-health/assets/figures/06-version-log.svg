<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-06-title ebh-06-desc"><title id="ebh-06-title">來源版本與搜尋紀錄</title><desc id="ebh-06-desc">一項研究可能有計畫、預印本、正式報告、更正與多篇追蹤報告；搜尋紀錄保留查詢和去重關係，不把多報告當多研究。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 06 / 來源版本與搜尋紀錄</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">這是可能的版本關係；DOI與同行審查都不是結論永久有效的印章。</text><path d="M95 180H755" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="105" cy="180" rx="9" ry="9" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="105" y="142" font-size="20" fill="#b7e89f" text-anchor="middle">計畫</text><ellipse cx="315" cy="180" rx="9" ry="9" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="315" y="142" font-size="20" fill="#9ac8e8" text-anchor="middle">預印本</text><ellipse cx="535" cy="180" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="535" y="142" font-size="20" fill="#ead68c" text-anchor="middle">正式報告</text><ellipse cx="750" cy="180" rx="9" ry="9" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="750" y="142" font-size="20" fill="#c1b2ea" text-anchor="middle">更正</text><path d="M535 205L535 260" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M539.3 251.0L535 260L530.7 251.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="95" y="285" width="660" height="135" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="125" y="325" font-size="22" fill="#b7e89f" text-anchor="start">搜尋紀錄：平台＋完整查詢＋日期＋命中數</text><text x="125" y="374" font-size="20" fill="#e3e9e2" text-anchor="start">研究ID連接多份報告；留下納入與排除理由。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>