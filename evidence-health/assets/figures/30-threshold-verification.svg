<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-30-title ebh-30-desc"><title id="ebh-30-title">閾值取捨與沒有完成的驗證</title><desc id="ebh-30-desc">左側ROC以假陽性比例對敏感度，A敏感90%特異95%、B98%和80%，曲線僅連接示意；右側900位指標陰性中100參考未知，不可直接算真陰。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30 / 閾值取捨與沒有完成的驗證</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><rect x="45" y="115" width="355" height="325" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="65" y="155" font-size="20" fill="#9ac8e8" text-anchor="start">左：不同閾值的ROC點</text><path d="M100 365H355M100 365V185" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 365L113 203 151 189 355 185" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="113" cy="203" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="151" cy="189" rx="7" ry="7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="132" y="245" font-size="18" fill="#b7e89f" text-anchor="start">A：90%／95%</text><text x="132" y="283" font-size="18" fill="#ead68c" text-anchor="start">B：98%／80%</text><text x="80" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">橫軸：假陽性比例 →</text><text x="65" y="181" font-size="18" fill="#e3e9e2" text-anchor="start">敏感度</text><text x="100" y="390" font-size="18" fill="#9ac8e8" text-anchor="middle">0</text><text x="355" y="390" font-size="18" fill="#9ac8e8" text-anchor="middle">1</text><text x="88" y="200" font-size="18" fill="#9ac8e8" text-anchor="end">1</text><rect x="430" y="115" width="385" height="325" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="450" y="155" font-size="20" fill="#c1b2ea" text-anchor="start">右：驗證流程不可漏人</text><rect x="460" y="185" width="325" height="55" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="480" y="220" font-size="21" fill="#9ac8e8" text-anchor="start">900位指標陰性</text><path d="M550 250L525 293" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M533.3 287.4L525 293L525.8 283.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 250L715 293" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M714.2 283.0L715 293L706.7 287.4" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="455" y="330" font-size="21" fill="#b7e89f" text-anchor="start">800完成</text><text x="665" y="330" font-size="21" fill="#ead68c" text-anchor="start">100未知</text><text x="450" y="385" font-size="21" fill="#e3e9e2" text-anchor="start">未知不自動歸真陰。</text><text x="450" y="421" font-size="18" fill="#e3e9e2" text-anchor="start">流程、病例譜、盲判仍需查。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>