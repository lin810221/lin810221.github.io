<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-27-title ebh-27-desc"><title id="ebh-27-title">亞組差異與等效不是星號遊戲</title><desc id="ebh-27-desc">左半相同RR點估計但區間寬度不同，不代表有交互作用；右半差量區間跨零卻不一定落在事前等效範圍，所有界值僅為任意教學尺度。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27 / 亞組差異與等效不是星號遊戲</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><rect x="45" y="115" width="355" height="325" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="65" y="155" font-size="21" fill="#9ac8e8" text-anchor="start">左：點都RR0.75</text><path d="M244 180V355" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M141 225H229" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="180" cy="225" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="65" y="205" font-size="19" fill="#b7e89f" text-anchor="start">甲：較精確</text><path d="M90 310H347" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="180" cy="310" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="65" y="286" font-size="19" fill="#ead68c" text-anchor="start">乙：較不精確</text><text x="244" y="385" font-size="18" fill="#c1b2ea" text-anchor="middle">1</text><text x="65" y="417" font-size="18" fill="#e3e9e2" text-anchor="start">星號不同不是效果差的檢定。</text><rect x="430" y="115" width="385" height="325" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="450" y="155" font-size="20" fill="#c1b2ea" text-anchor="start">右：等效要看事前界值</text><rect x="590" y="185" width="75" height="185" rx="2" stroke="#b7e89f" fill="#b7e89f0a" stroke-width="2"/><path d="M627 185V375" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M490 235H765" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="627" cy="235" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M608 330H646" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="627" cy="330" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="590" y="400" font-size="18" fill="#b7e89f" text-anchor="middle">-2</text><text x="627" y="400" font-size="18" fill="#9ac8e8" text-anchor="middle">0</text><text x="665" y="400" font-size="18" fill="#b7e89f" text-anchor="middle">+2</text><text x="450" y="427" font-size="17" fill="#e3e9e2" text-anchor="start">任意差量；較寬區間不在界內。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>