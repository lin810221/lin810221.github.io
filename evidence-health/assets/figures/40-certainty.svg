<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-40-title ebh-40-desc"><title id="ebh-40-title">同一比較，不同結果的確定性</title><desc id="ebh-40-desc">每一列是獨立結果及其證據體，問號表示仍需理由與資料。圖未替任何結果分級，也沒有把五領域加成一個數字。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 40 / 同一比較，不同結果的確定性</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><text x="80" y="127" font-size="22" fill="#9ac8e8" text-anchor="start">結果</text><text x="345" y="127" font-size="22" fill="#9ac8e8" text-anchor="start">資料與偏差</text><text x="635" y="127" font-size="22" fill="#9ac8e8" text-anchor="start">確定性理由</text><path d="M80 220H785" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="195" font-size="22" fill="#e3e9e2" text-anchor="start">疾病事件</text><text x="350" y="195" font-size="20" fill="#e3e9e2" text-anchor="start">研究與評估紀錄</text><text x="690" y="195" font-size="28" fill="#ead68c" text-anchor="start">？</text><path d="M80 300H785" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="275" font-size="22" fill="#e3e9e2" text-anchor="start">生活品質</text><text x="350" y="275" font-size="20" fill="#e3e9e2" text-anchor="start">研究與評估紀錄</text><text x="690" y="275" font-size="28" fill="#ead68c" text-anchor="start">？</text><path d="M80 380H785" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="355" font-size="22" fill="#e3e9e2" text-anchor="start">嚴重傷害</text><text x="350" y="355" font-size="20" fill="#e3e9e2" text-anchor="start">研究與評估紀錄</text><text x="690" y="355" font-size="28" fill="#ead68c" text-anchor="start">？</text><text x="85" y="436" font-size="19" fill="#e3e9e2" text-anchor="start">分級附理由；不是為產品、期刊或整篇回顧貼永久等級。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>