<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-46-title ebh-46-desc"><title id="ebh-46-title">平均效果如何到達不同情境</title><desc id="ebh-46-desc">左側研究族群連到右側兩個不同條件的人群；線條表示需評估的外推，不是已測得的個人效果；基線、照護與追蹤時間須對齊。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 46 / 平均效果如何到達不同情境</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><rect x="75" y="145" width="230" height="235" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="110" y="188" font-size="21" fill="#9ac8e8" text-anchor="start">研究中的參與者</text><ellipse cx="115" cy="245" rx="12" ry="12" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="115" cy="300" rx="12" ry="12" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="170" cy="245" rx="12" ry="12" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="170" cy="300" rx="12" ry="12" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="225" cy="245" rx="12" ry="12" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="225" cy="300" rx="12" ry="12" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M320 240L475 180" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M465.0 179.2L475 180L468.2 187.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 270L475 345" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M468.8 337.2L475 345L465.0 345.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="495" y="130" width="300" height="115" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="520" y="169" font-size="23" fill="#b7e89f" text-anchor="start">情境A</text><text x="520" y="207" font-size="18" fill="#e3e9e2" text-anchor="start">基線、可取得照護與偏好</text><rect x="495" y="300" width="300" height="115" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="520" y="339" font-size="23" fill="#c1b2ea" text-anchor="start">情境B</text><text x="520" y="377" font-size="18" fill="#e3e9e2" text-anchor="start">共病、時間與不同負擔</text><text x="80" y="454" font-size="19" fill="#e3e9e2" text-anchor="start">外推須說明依據；相似身分或年齡不保證相同效果。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>