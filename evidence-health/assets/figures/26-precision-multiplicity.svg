<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-26-title ebh-26-desc"><title id="ebh-26-title">有效資訊與多次比較各有條件</title><desc id="ebh-26-desc">左圖在獨立同變異假設下比較100與400樣本的相對區間寬；右圖20個分析機會中高亮一個被選結果，並非觀察到的真假研究。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 26 / 有效資訊與多次比較各有條件</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><rect x="45" y="115" width="355" height="325" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="65" y="155" font-size="20" fill="#9ac8e8" text-anchor="start">左：同條件下的精確度</text><path d="M90 235H350" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="235" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="90" y="210" font-size="20" fill="#b7e89f" text-anchor="start">n=100，SE約1</text><path d="M155 330H285" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="330" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="90" y="304" font-size="20" fill="#ead68c" text-anchor="start">n=400，SE約0.5</text><text x="65" y="407" font-size="18" fill="#e3e9e2" text-anchor="start">獨立資料、相同變異的簡式。</text><rect x="430" y="115" width="385" height="325" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="450" y="155" font-size="20" fill="#c1b2ea" text-anchor="start">右：多次尋找過線結果</text><ellipse cx="475" cy="207" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="537" cy="207" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="599" cy="207" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="661" cy="207" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="723" cy="207" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="475" cy="252" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="537" cy="252" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="599" cy="252" rx="13" ry="13" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="661" cy="252" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="723" cy="252" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="475" cy="297" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="537" cy="297" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="599" cy="297" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="661" cy="297" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="723" cy="297" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="475" cy="342" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="537" cy="342" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="599" cy="342" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="661" cy="342" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="723" cy="342" rx="13" ry="13" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="450" y="407" font-size="20" fill="#e3e9e2" text-anchor="start">20次機會 ≠ 一次事前檢定</text><text x="65" y="465" font-size="18" fill="#e3e9e2" text-anchor="start">右圖亮點只表示被挑出的結果；不呈現真實研究真假。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>