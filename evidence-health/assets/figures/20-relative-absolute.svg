<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-20-title ebh-20-desc"><title id="ebh-20-title">相對與絕對：兩種不同分母</title><desc id="ebh-20-desc">共同零點與相同比例軸的風險長條顯示介入3%對照4%，相對風險0.75、絕對差1個百分點；NNT100僅為點估計。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20 / 相對與絕對：兩種不同分母</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><path d="M220 115V290M220 290H740" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 290V298" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="321" font-size="18" fill="#9ac8e8" text-anchor="middle">0%</text><path d="M320 290V298" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="321" font-size="18" fill="#9ac8e8" text-anchor="middle">1%</text><path d="M420 290V298" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="321" font-size="18" fill="#9ac8e8" text-anchor="middle">2%</text><path d="M520 290V298" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="321" font-size="18" fill="#9ac8e8" text-anchor="middle">3%</text><path d="M620 290V298" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="321" font-size="18" fill="#9ac8e8" text-anchor="middle">4%</text><path d="M720 290V298" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="321" font-size="18" fill="#9ac8e8" text-anchor="middle">5%</text><text x="75" y="171" font-size="22" fill="#b7e89f" text-anchor="start">介入</text><rect x="220" y="140" width="300" height="44" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="540" y="170" font-size="19" fill="#b7e89f" text-anchor="start">3% = 30／1000</text><text x="75" y="245" font-size="22" fill="#ead68c" text-anchor="start">對照</text><rect x="220" y="215" width="400" height="44" rx="3" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="640" y="245" font-size="20" fill="#ead68c" text-anchor="start">4%</text><text x="85" y="375" font-size="22" fill="#e3e9e2" text-anchor="start">RR = 0.03／0.04 = 0.75</text><text x="85" y="414" font-size="21" fill="#e3e9e2" text-anchor="start">ARR = 1個百分點；NNT點估計 = 100</text><text x="85" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">同一結果、一年期間；點差不等於已確立的效益。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>