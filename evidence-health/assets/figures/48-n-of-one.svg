<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-48-title ebh-48-desc"><title id="ebh-48-title">一個人的比較，也要有設計與紀錄</title><desc id="ebh-48-desc">六個觀察期以A與B交替示意，問號為缺漏；色塊不是任何藥物建議，時間、順序、殘留與安全需先規劃，日記不自動成試驗。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 48 / 一個人的比較，也要有設計與紀錄</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><text x="75" y="125" font-size="22" fill="#9ac8e8" text-anchor="start">虛構方法比較；A與B不是治療指示</text><rect x="75" y="175" width="100" height="100" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="125" y="239" font-size="30" fill="#9ac8e8" text-anchor="middle">A</text><rect x="195" y="175" width="100" height="100" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="245" y="239" font-size="30" fill="#b7e89f" text-anchor="middle">B</text><rect x="315" y="175" width="100" height="100" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="365" y="239" font-size="30" fill="#b7e89f" text-anchor="middle">B</text><rect x="435" y="175" width="100" height="100" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="485" y="239" font-size="30" fill="#9ac8e8" text-anchor="middle">A</text><rect x="555" y="175" width="100" height="100" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="605" y="239" font-size="30" fill="#ead68c" text-anchor="middle">？</text><rect x="675" y="175" width="100" height="100" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="725" y="239" font-size="30" fill="#b7e89f" text-anchor="middle">B</text><path d="M90 375H770" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="125" cy="335" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="245" cy="315" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="365" cy="350" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="485" cy="325" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><ellipse cx="725" cy="330" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="95" y="430" font-size="20" fill="#e3e9e2" text-anchor="start">同一結果、固定記錄窗；順序與殘留需另行處理。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>