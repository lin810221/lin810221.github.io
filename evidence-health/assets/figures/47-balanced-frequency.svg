<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-47-title ebh-47-desc"><title id="ebh-47-title">同一千人的效益與傷害要分開說</title><desc id="ebh-47-desc">虛構每千人比較：對照疾病事件40、介入30，嚴重傷害對照2、介入4；兩種結果分開呈現，不能把人數相減作淨效益分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 47 / 同一千人的效益與傷害要分開說</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><text x="70" y="126" font-size="22" fill="#9ac8e8" text-anchor="start">同一追蹤期；每1000人，虛構資料</text><text x="70" y="187" font-size="22" fill="#e3e9e2" text-anchor="start">疾病事件</text><rect x="270" y="155" width="320" height="30" rx="2" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="270" y="203" width="240" height="30" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="615" y="180" font-size="21" fill="#e3e9e2" text-anchor="start">40 → 30</text><text x="615" y="228" font-size="21" fill="#b7e89f" text-anchor="start">少10</text><text x="70" y="330" font-size="22" fill="#e3e9e2" text-anchor="start">嚴重傷害</text><rect x="270" y="298" width="16" height="30" rx="2" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="270" y="346" width="32" height="30" rx="2" stroke="#eda894" fill="#eda894" stroke-width="2"/><text x="350" y="323" font-size="21" fill="#e3e9e2" text-anchor="start">2 → 4</text><text x="350" y="371" font-size="21" fill="#eda894" text-anchor="start">多2</text><text x="75" y="441" font-size="18" fill="#e3e9e2" text-anchor="start">結果嚴重度、可能重疊與人的價值不同；不合成「淨少8人」。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>