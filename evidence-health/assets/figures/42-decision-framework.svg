<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-42-title ebh-42-desc"><title id="ebh-42-title">確定性、可行性與人的價值</title><desc id="ebh-42-desc">中央的決策由證據、負擔、價值與資源共同構成；節點距離和箭頭沒有量尺，不是可自動給建議強度的演算法。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 42 / 確定性、可行性與人的價值</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><ellipse cx="430" cy="263" rx="113" ry="55" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="269" font-size="23" fill="#b7e89f" text-anchor="middle">共同決策</text><rect x="70" y="121" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="84" y="150" font-size="19" fill="#9ac8e8" text-anchor="start">效果與確定性</text><text x="84" y="178" font-size="15" fill="#e3e9e2" text-anchor="start">結果、區間及偏差</text><path d="M300 159L320 247" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.2 237.3L320 247L313.8 239.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="121" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="584" y="150" font-size="19" fill="#ead68c" text-anchor="start">價值與偏好</text><text x="584" y="178" font-size="15" fill="#e3e9e2" text-anchor="start">什麼結果最重要</text><path d="M540 247L560 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M553.8 166.8L560 159L562.2 168.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="337" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="84" y="366" font-size="19" fill="#c1b2ea" text-anchor="start">成本與可行性</text><text x="84" y="394" font-size="15" fill="#e3e9e2" text-anchor="start">資源、時間及支持</text><path d="M300 375L320 278" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M313.9 285.9L320 278L322.4 287.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="337" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="584" y="366" font-size="19" fill="#eda894" text-anchor="start">公平與適用性</text><text x="584" y="394" font-size="15" fill="#e3e9e2" text-anchor="start">誰能取得與承受</text><path d="M540 278L560 375" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M562.4 365.3L560 375L553.9 367.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="456" font-size="18" fill="#e3e9e2" text-anchor="start">證據確定性與建議強度不同；仍要公開判斷過程。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>