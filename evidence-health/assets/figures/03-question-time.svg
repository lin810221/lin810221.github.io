<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-03-title ebh-03-desc"><title id="ebh-03-title">問題、族群與追蹤時間</title><desc id="ebh-03-desc">同一介入的研究問題可使用不同起點與結果時間；五步判讀以提出問題、找到研究、評估、應用及回顧形成可更新循環。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 03 / 問題、族群與追蹤時間</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">橫向代表時間順序，不是發病、存活或療效的實測曲線。</text><path d="M75 205H780" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 191V219" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="258" font-size="19" fill="#9ac8e8" text-anchor="middle">符合資格／起點</text><path d="M380 191V219" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="258" font-size="19" fill="#9ac8e8" text-anchor="middle">短期結果</text><path d="M700 191V219" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="258" font-size="19" fill="#9ac8e8" text-anchor="middle">長期結果</text><path d="M100 140L700 140" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M691.0 135.7L700 140L691.0 144.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="125" font-size="22" fill="#ead68c" text-anchor="middle">同一結果仍要說明追蹤窗</text><rect x="35.0" y="331" width="140" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="105" y="367" font-size="21" fill="#9ac8e8" text-anchor="middle">問問題</text><path d="M180 360L184 360" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M175.0 355.7L184 360L175.0 364.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="197.0" y="331" width="140" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="267" y="367" font-size="21" fill="#b7e89f" text-anchor="middle">找證據</text><path d="M342 360L346 360" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M337.0 355.7L346 360L337.0 364.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="359.0" y="331" width="140" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="429" y="367" font-size="21" fill="#ead68c" text-anchor="middle">評可信</text><path d="M504 360L508 360" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M499.0 355.7L508 360L499.0 364.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="521.0" y="331" width="140" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="591" y="367" font-size="21" fill="#c1b2ea" text-anchor="middle">看適用</text><path d="M666 360L670 360" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M661.0 355.7L670 360L661.0 364.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="683.0" y="331" width="140" height="58" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="753" y="367" font-size="21" fill="#eda894" text-anchor="middle">再回顧</text><text x="85" y="440" font-size="19" fill="#e3e9e2" text-anchor="start">追蹤窗、事件定義與比較條件不同，不能只比最後百分比。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>