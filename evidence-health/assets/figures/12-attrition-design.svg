<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-12-title ebh-12-desc"><title id="ebh-12-title">失訪分母與特殊設計</title><desc id="ebh-12-desc">虛構試驗每組100人，觀察到80與90人，事件8與9，未知20與10；失訪者結果不能補零，特殊設計還需確認分析單位。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 12 / 失訪分母與特殊設計</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">矩形長度只表示這個虛構分母；沒有替未知者指定事件或非事件。</text><text x="70" y="137" font-size="24" fill="#b7e89f" text-anchor="start">原分配：A組100人；B組100人</text><rect x="80" y="180" width="480" height="65" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="560" y="180" width="120" height="65" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="95" y="220" font-size="22" fill="#9ac8e8" text-anchor="start">A：已觀察80人，事件8</text><text x="572" y="220" font-size="20" fill="#c1b2ea" text-anchor="start">未知20</text><rect x="80" y="290" width="540" height="65" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="620" y="290" width="60" height="65" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="95" y="330" font-size="22" fill="#ead68c" text-anchor="start">B：已觀察90人，事件9</text><text x="690" y="330" font-size="20" fill="#c1b2ea" text-anchor="start">未知10</text><text x="80" y="421" font-size="19" fill="#e3e9e2" text-anchor="start">群集要看群集數與相關；交叉要看時期與殘留。</text><text x="80" y="455" font-size="18" fill="#e3e9e2" text-anchor="start">非劣性另需事前界值與相容區間，不能用P＞0.05代替。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>