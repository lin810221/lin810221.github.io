<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-45-title ebh-45-desc"><title id="ebh-45-title">資料到報告：保持可追查的版本鏈</title><desc id="ebh-45-desc">三個文件節點對應原始狀態、可重現處理及報告，更正以回連表示；鎖頭提醒分享需經授權，雜湊一致只證明檔案一致。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 45 / 資料到報告：保持可追查的版本鏈</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><rect x="70" y="155" width="190" height="190" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="335" y="155" width="190" height="190" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><rect x="600" y="155" width="190" height="190" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="165" y="203" font-size="23" fill="#9ac8e8" text-anchor="middle">資料契約</text><text x="430" y="203" font-size="23" fill="#b7e89f" text-anchor="middle">分析版本</text><text x="695" y="203" font-size="23" fill="#ead68c" text-anchor="middle">報告版本</text><path d="M100 245H225M100 285H225" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 245H490M365 285H490" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 245H755M630 285H755" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 250L322 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M313.0 245.7L322 250L313.0 254.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M535 250L587 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M578.0 245.7L587 250L578.0 254.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M695 360V400H430V365" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="505" y="436" font-size="20" fill="#c1b2ea" text-anchor="start">更正與舊版保留</text><rect x="88" y="115" width="42" height="30" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><path d="M98 115V105Q109 87 120 105V115" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>