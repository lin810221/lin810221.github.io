<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-29-title ebh-29-desc"><title id="ebh-29-title">自然頻率：沿分支找正確分母</title><desc id="ebh-29-desc">10000人先依1%目標狀況比例分成100與9900，再以90%敏感度及95%特異度拆四格；把90真陽與495假陽合為585陽性後計算PPV15.38%。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 29 / 自然頻率：沿分支找正確分母</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><rect x="295" y="110" width="270" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430" y="145" font-size="21" fill="#b7e89f" text-anchor="middle">10000人，盛行率1%</text><path d="M350 173L225 210" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.9 211.6L225 210L232.4 203.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 173L640 210" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M632.5 203.4L640 210L630.1 211.7" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="85" y="220" width="270" height="60" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="220" y="258" font-size="23" fill="#9ac8e8" text-anchor="middle">有狀況100人</text><rect x="505" y="220" width="270" height="60" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="640" y="258" font-size="23" fill="#c1b2ea" text-anchor="middle">無狀況9900人</text><path d="M165 290L135 333" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M143.7 328.1L135 333L136.6 323.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 290L315 333" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M313.4 323.1L315 333L306.3 328.1" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M585 290L555 333" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M563.7 328.1L555 333L556.6 323.1" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M705 290L735 333" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M733.4 323.1L735 333L726.3 328.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="370" font-size="20" fill="#b7e89f" text-anchor="middle">真陽90</text><text x="315" y="370" font-size="20" fill="#ead68c" text-anchor="middle">假陰10</text><text x="555" y="370" font-size="20" fill="#ead68c" text-anchor="middle">假陽495</text><text x="735" y="370" font-size="20" fill="#b7e89f" text-anchor="middle">真陰9405</text><path d="M135 382V405H555V382" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="436" font-size="20" fill="#9ac8e8" text-anchor="middle">所有陽性585人；PPV=90／585約15.38%</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>