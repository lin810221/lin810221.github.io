<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-50-title ebh-50-desc"><title id="ebh-50-title">同一差異與不同圖軸，讀法可能被改變</title><desc id="ebh-50-desc">兩個長條圖均為虛構30與40，但左側從0、右側從25開始；兩種畫法須清楚揭露刻度。下方對照來源與AI摘要，摘要不代替原研究。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 50 / 同一差異與不同圖軸，讀法可能被改變</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><path d="M90 355V135M90 355H365M480 355V135M480 355H765" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="205" width="65" height="150" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="255" y="155" width="65" height="200" rx="1" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="535" y="280" width="65" height="75" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="650" y="130" width="65" height="225" rx="1" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="95" y="390" font-size="21" fill="#9ac8e8" text-anchor="start">0起點：30 與 40</text><text x="475" y="390" font-size="21" fill="#9ac8e8" text-anchor="start">25起點：30 與 40</text><text x="95" y="432" font-size="19" fill="#e3e9e2" text-anchor="start">核對圖軸、原表、研究版本與摘要中的每一個主張。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>