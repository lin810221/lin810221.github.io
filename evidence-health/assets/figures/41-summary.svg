<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-41-title ebh-41-desc"><title id="ebh-41-title">相對效果要連回基線風險</title><desc id="ebh-41-desc">同一虛構相對風險0.75分別作用在每千人40與每千人4的基線情境，得到10與1的絕對差；需假設相對效果可適用且時間相同。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41 / 相對效果要連回基線風險</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><text x="80" y="127" font-size="22" fill="#9ac8e8" text-anchor="start">同一虛構RR=0.75；同一明定追蹤期</text><text x="80" y="188" font-size="20" fill="#e3e9e2" text-anchor="start">基線40／1000</text><rect x="315" y="158" width="320" height="35" rx="2" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="315" y="208" width="240" height="35" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="660" y="184" font-size="20" fill="#e3e9e2" text-anchor="start">40 → 30</text><text x="660" y="234" font-size="18" fill="#e3e9e2" text-anchor="start">少10／1000</text><text x="80" y="318" font-size="20" fill="#e3e9e2" text-anchor="start">基線4／1000</text><rect x="315" y="288" width="32" height="35" rx="2" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><rect x="315" y="338" width="24" height="35" rx="2" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="410" y="314" font-size="20" fill="#e3e9e2" text-anchor="start">4 → 3</text><text x="410" y="364" font-size="18" fill="#e3e9e2" text-anchor="start">少1／1000</text><text x="85" y="436" font-size="19" fill="#e3e9e2" text-anchor="start">長度使用同一尺度；基線與相對效果的可信度都要交代。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>