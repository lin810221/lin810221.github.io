<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-16-title ebh-16-desc"><title id="ebh-16-title">反事實與可檢查的因果假設</title><desc id="ebh-16-desc">同一個人在同一比較窗只能觀察某一策略下的結果；另一策略結果為反事實。DAG用方向明確的箭頭記錄假設而非資料自動生成真相。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 16 / 反事實與可檢查的因果假設</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">兩分支不是把一個人真的複製；反事實圖不提供個人的確定治療反應。</text><rect x="270.0" y="111" width="320" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="430" y="147" font-size="21" fill="#9ac8e8" text-anchor="middle">同一人、同一起點</text><path d="M350 185L230 245" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240.0 244.9L230 245L236.1 237.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 185L630 245" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M623.9 237.1L630 245L620.0 244.9" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110.0" y="261" width="240" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="230" y="297" font-size="21" fill="#b7e89f" text-anchor="middle">策略1：Y(1)</text><rect x="510.0" y="261" width="240" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="630" y="297" font-size="21" fill="#c1b2ea" text-anchor="middle">策略0：Y(0)</text><rect x="105" y="345" width="250" height="75" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="125" y="389" font-size="20" fill="#b7e89f" text-anchor="start">其中一條可以被觀察</text><rect x="505" y="345" width="250" height="75" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="525" y="389" font-size="20" fill="#c1b2ea" text-anchor="start">另一條不能同時觀察</text><text x="90" y="461" font-size="18" fill="#e3e9e2" text-anchor="start">比較群體需可交換性、正值性、一致性及適當干擾假設。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>