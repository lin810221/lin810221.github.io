<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-07-title ebh-07-desc"><title id="ebh-07-title">設計先看方向，橫斷先看同時</title><desc id="ebh-07-desc">研究設計依分配、起點與量測順序區分；橫斷研究在同一時點測暴露與結果，圖中的關係線不是因果方向。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 07 / 設計先看方向，橫斷先看同時</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">分類不是品質排名；設計仍須配合問題及實際執行條件。</text><text x="70" y="138" font-size="24" fill="#9ac8e8" text-anchor="start">是否由研究者分配介入？</text><path d="M305 162L160 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.0 220.7L160 220L166.7 212.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 162L625 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M617.1 213.8L625 220L615.3 222.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55.0" y="231" width="230" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="170" y="267" font-size="21" fill="#b7e89f" text-anchor="middle">介入性研究</text><rect x="505.0" y="231" width="230" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="620" y="267" font-size="21" fill="#ead68c" text-anchor="middle">觀察性研究</text><path d="M95 400H770" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="390" y="325" width="90" height="125" rx="12" stroke="#c1b2ea" fill="#c1b2ea20" stroke-width="2"/><text x="435" y="366" font-size="18" fill="#c1b2ea" text-anchor="middle">同一時點</text><text x="435" y="415" font-size="18" fill="#c1b2ea" text-anchor="middle">暴露＋結果</text><text x="100" y="447" font-size="18" fill="#e3e9e2" text-anchor="start">橫斷切片：不能由同時出現決定誰先誰後。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>