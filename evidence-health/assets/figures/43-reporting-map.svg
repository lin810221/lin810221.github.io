<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-43-title ebh-43-desc"><title id="ebh-43-title">用對報告規範，另做可信度判斷</title><desc id="ebh-43-desc">五份文件依研究用途排列：試驗計畫、試驗結果、觀察、診斷與回顧。每一份只提示可追查資訊，沒有計分、背書或重製原工具清單。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 43 / 用對報告規範，另做可信度判斷</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><rect x="50" y="150" width="140" height="210" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="120" y="191" font-size="19" fill="#9ac8e8" text-anchor="middle">SPIRIT</text><path d="M72 230H168M72 265H168M72 300H168" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="392" font-size="18" fill="#9ac8e8" text-anchor="middle">計畫</text><rect x="210" y="150" width="140" height="210" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="280" y="191" font-size="19" fill="#b7e89f" text-anchor="middle">CONSORT</text><path d="M232 230H328M232 265H328M232 300H328" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="392" font-size="18" fill="#b7e89f" text-anchor="middle">試驗報告</text><rect x="370" y="150" width="140" height="210" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="440" y="191" font-size="19" fill="#ead68c" text-anchor="middle">STROBE</text><path d="M392 230H488M392 265H488M392 300H488" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="392" font-size="18" fill="#ead68c" text-anchor="middle">觀察研究</text><rect x="530" y="150" width="140" height="210" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="600" y="191" font-size="19" fill="#c1b2ea" text-anchor="middle">STARD</text><path d="M552 230H648M552 265H648M552 300H648" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="392" font-size="18" fill="#c1b2ea" text-anchor="middle">診斷研究</text><rect x="690" y="150" width="140" height="210" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="760" y="191" font-size="19" fill="#eda894" text-anchor="middle">PRISMA</text><path d="M712 230H808M712 265H808M712 300H808" stroke="#eda894" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="392" font-size="18" fill="#eda894" text-anchor="middle">系統回顧</text><text x="95" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">報得完整，才有資訊可判讀；不等於設計、分析或結論已正確。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>