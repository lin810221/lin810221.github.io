<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-35-title ebh-35-desc"><title id="ebh-35-title">紀錄、報告、研究：逐層核對</title><desc id="ebh-35-desc">虛構200紀錄去重50後150初篩，排130後欲取20報告，2未取得，18評估排10後留8份，實際來自3研究；箭頭顯示資訊追溯不是獨立樣本倍增。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35 / 紀錄、報告、研究：逐層核對</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="50" y="122" font-size="21" fill="#e3e9e2" text-anchor="start">原創數量流程：條目去重與研究連結是兩件事。</text><rect x="45" y="150" width="170" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="130" y="182" font-size="23" fill="#9ac8e8" text-anchor="middle">200筆</text><text x="130" y="211" font-size="18" fill="#e3e9e2" text-anchor="middle">取得紀錄</text><rect x="245" y="150" width="170" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="330" y="182" font-size="23" fill="#b7e89f" text-anchor="middle">150筆</text><text x="330" y="211" font-size="18" fill="#e3e9e2" text-anchor="middle">去重後初篩</text><rect x="445" y="150" width="170" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="530" y="182" font-size="23" fill="#ead68c" text-anchor="middle">20份</text><text x="530" y="211" font-size="18" fill="#e3e9e2" text-anchor="middle">欲取得報告</text><rect x="645" y="150" width="170" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="730" y="182" font-size="23" fill="#c1b2ea" text-anchor="middle">18份</text><text x="730" y="211" font-size="18" fill="#e3e9e2" text-anchor="middle">完整評估</text><path d="M218 187L238 187" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M229.0 182.7L238 187L229.0 191.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M418 187L438 187" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M429.0 182.7L438 187L429.0 191.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M618 187L638 187" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M629.0 182.7L638 187L629.0 191.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="229" y="270" font-size="18" fill="#9ac8e8" text-anchor="middle">去重50</text><text x="430" y="270" font-size="18" fill="#b7e89f" text-anchor="middle">初篩排130</text><text x="630" y="270" font-size="18" fill="#ead68c" text-anchor="middle">未取得2</text><path d="M730 236V304H560" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 304L560 325" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M564.3 316.0L560 325L555.7 316.0" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="770" y="296" font-size="18" fill="#c1b2ea" text-anchor="middle">排除10</text><rect x="475" y="335" width="170" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="560" y="369" font-size="23" fill="#b7e89f" text-anchor="middle">8份報告</text><text x="560" y="398" font-size="18" fill="#e3e9e2" text-anchor="middle">納入資訊來源</text><path d="M458 373L408 373" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M417.0 377.3L408 373L417.0 368.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="220" y="335" width="170" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="305" y="369" font-size="23" fill="#9ac8e8" text-anchor="middle">3個研究</text><text x="305" y="398" font-size="18" fill="#e3e9e2" text-anchor="middle">辨認重疊樣本</text><text x="50" y="454" font-size="19" fill="#e3e9e2" text-anchor="start">8份報告可屬3個研究；不得把同一批人重複當獨立資訊。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>