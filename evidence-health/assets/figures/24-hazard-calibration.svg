<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-24-title ebh-24-desc"><title id="ebh-24-title">時間效果與預測不能互相代替</title><desc id="ebh-24-desc">左側任意時間曲線提醒早晚效果可變，單一HR需模型假設；右側校準示意以觀察對預測機率，綠線偏離理想參考線，不代表個人診斷。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 24 / 時間效果與預測不能互相代替</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><rect x="45" y="115" width="355" height="320" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="65" y="155" font-size="20" fill="#9ac8e8" text-anchor="start">左：危險率 ≠ 累積風險</text><path d="M80 310H370M80 310V195" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 220Q210 255 360 265" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 275Q210 225 360 220" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="352" font-size="19" fill="#e3e9e2" text-anchor="start">HR需模型與時間假設</text><text x="75" y="391" font-size="18" fill="#e3e9e2" text-anchor="start">不直接等於某年RR或壽命比</text><rect x="430" y="115" width="385" height="320" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="450" y="155" font-size="21" fill="#c1b2ea" text-anchor="start">右：預測的校準</text><path d="M495 355H770M495 355V185" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 355L750 195" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M520 347L565 330 635 310 730 275" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="404" font-size="19" fill="#e3e9e2" text-anchor="start">預測機率 →</text><text x="450" y="182" font-size="18" fill="#e3e9e2" text-anchor="start">觀察%</text><text x="455" y="429" font-size="18" fill="#e3e9e2" text-anchor="start">虛構曲線；排序好不等於機率準。</text><text x="495" y="379" font-size="18" fill="#9ac8e8" text-anchor="middle">0</text><text x="622.5" y="379" font-size="18" fill="#9ac8e8" text-anchor="middle">50</text><text x="750" y="379" font-size="18" fill="#9ac8e8" text-anchor="middle">100%</text><text x="484" y="361" font-size="18" fill="#9ac8e8" text-anchor="end">0</text><text x="484" y="281" font-size="18" fill="#9ac8e8" text-anchor="end">50</text><text x="484" y="201" font-size="18" fill="#9ac8e8" text-anchor="end">100</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>