<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-32-title ebh-32-desc"><title id="ebh-32-title">被篩中的窗口與被命名的狀況</title><desc id="ebh-32-desc">上半同一組定期篩檢時點穿過長短可偵測窗口，長窗口較易被碰到；下半區分參考標準下無狀況的假陽與有狀況但未篩檢終生不致傷害的過度診斷。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32 / 被篩中的窗口與被命名的狀況</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="70" y="122" font-size="20" fill="#e3e9e2" text-anchor="start">上：定期篩檢更容易遇到長的無症狀可偵測窗口</text><path d="M250 143V304" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="250" y="335" font-size="18" fill="#c1b2ea" text-anchor="middle">篩檢</text><path d="M400 143V304" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="400" y="335" font-size="18" fill="#c1b2ea" text-anchor="middle">篩檢</text><path d="M550 143V304" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="550" y="335" font-size="18" fill="#c1b2ea" text-anchor="middle">篩檢</text><path d="M700 143V304" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="700" y="335" font-size="18" fill="#c1b2ea" text-anchor="middle">篩檢</text><rect x="180" y="170" width="460" height="38" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="65" y="198" font-size="20" fill="#b7e89f" text-anchor="start">長窗口</text><rect x="470" y="258" width="40" height="38" rx="3" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="2"/><text x="65" y="286" font-size="20" fill="#9ac8e8" text-anchor="start">短窗口</text><rect x="55" y="365" width="355" height="82" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="75" y="396" font-size="19" fill="#9ac8e8" text-anchor="start">假陽：參考確認無目標狀況</text><text x="75" y="426" font-size="18" fill="#e3e9e2" text-anchor="start">關於當下的錯誤分類。</text><rect x="440" y="365" width="365" height="82" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="460" y="396" font-size="19" fill="#ead68c" text-anchor="start">過度診斷：有狀況但未致傷害</text><text x="460" y="426" font-size="18" fill="#e3e9e2" text-anchor="start">需要未篩檢的病程反事實。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>