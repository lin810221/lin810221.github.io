<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-10-title ebh-10-desc"><title id="ebh-10-title">分配前隱藏，分配後分角色看盲法</title><desc id="ebh-10-desc">時間線以收案及分配為界，分配隱藏防止選人，盲法檢查參與者、照護者與評估者是否知組別，兩者不能互換。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 10 / 分配前隱藏，分配後分角色看盲法</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">時間線是概念；不可由報告寫隨機或雙盲就推定程序完全成功。</text><path d="M80 215H785" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="420" cy="215" rx="10" ry="10" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="420" y="165" font-size="23" fill="#ead68c" text-anchor="middle">確認納入與分配</text><rect x="75" y="285" width="285" height="120" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="100" y="326" font-size="22" fill="#b7e89f" text-anchor="start">分配前：下一組保密</text><text x="100" y="370" font-size="20" fill="#e3e9e2" text-anchor="start">不能預知再挑選人</text><rect x="450" y="285" width="335" height="120" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="475" y="326" font-size="22" fill="#c1b2ea" text-anchor="start">分配後：誰知道組別？</text><text x="475" y="370" font-size="19" fill="#e3e9e2" text-anchor="start">參與者／照護者／評估者</text><text x="80" y="455" font-size="19" fill="#e3e9e2" text-anchor="start">「雙盲」一詞不夠；要讀誰、如何、何時與哪些結果。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>