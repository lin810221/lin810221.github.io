<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-36-title ebh-36-desc"><title id="ebh-36-title">結果層級偏差與缺失證據</title><desc id="ebh-36-desc">左半同一試驗的死亡與自陳功能需分別評估偏差；右半虛構漏斗點和待查問號提醒不對稱可有多種原因，不能由留白推定被隱藏結果。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36 / 結果層級偏差與缺失證據</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><rect x="45" y="115" width="355" height="325" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="65" y="155" font-size="20" fill="#9ac8e8" text-anchor="start">左：同試驗，結果分開評估</text><text x="220" y="208" font-size="22" fill="#b7e89f" text-anchor="middle">同一隨機試驗</text><path d="M180 222L130 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M139.7 262.4L130 265L134.0 255.8" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 222L310 265" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M306.0 255.8L310 265L300.3 262.4" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="278" width="145" height="72" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="137" y="309" font-size="20" fill="#b7e89f" text-anchor="middle">死亡結果</text><text x="137" y="337" font-size="18" fill="#e3e9e2" text-anchor="middle">追蹤較完整</text><rect x="230" y="278" width="145" height="72" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="302" y="309" font-size="20" fill="#ead68c" text-anchor="middle">自陳功能</text><text x="302" y="337" font-size="18" fill="#e3e9e2" text-anchor="middle">失訪與盲判</text><text x="65" y="402" font-size="18" fill="#e3e9e2" text-anchor="start">使用合適工具版本並附理由。</text><rect x="430" y="115" width="385" height="325" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="450" y="155" font-size="20" fill="#c1b2ea" text-anchor="start">右：可見證據不一定完整</text><path d="M470 374H780M625 374V185" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M625 190L490 374M625 190L760 374" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="450" y="186" font-size="18" fill="#9ac8e8" text-anchor="start">較精確 ↑</text><ellipse cx="626" cy="205" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="605" cy="245" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="650" cy="265" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="555" cy="325" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="608" cy="350" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="710" cy="365" rx="6" ry="6" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="755" y="292" font-size="27" fill="#ead68c" text-anchor="middle">？</text><text x="750" y="398" font-size="18" fill="#9ac8e8" text-anchor="middle">效果 →</text><text x="450" y="425" font-size="18" fill="#e3e9e2" text-anchor="start">不對稱有多種可能原因。</text><text x="450" y="459" font-size="18" fill="#e3e9e2" text-anchor="start">先查登錄與未報結果，不補假資料。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>