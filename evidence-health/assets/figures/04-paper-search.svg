<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-04-title ebh-04-desc"><title id="ebh-04-title">把論文拆成能核對的層次</title><desc id="ebh-04-desc">左側原創論文輪廓分成摘要、方法、結果與討論，右側多個同義詞先取聯集再交集，不把檢索排序當證據評分。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 04 / 把論文拆成能核對的層次</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">頁面與集合為概念示意；摘要和搜尋命中均不等於品質保證。</text><rect x="70" y="115" width="300" height="330" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="95" y="155" font-size="22" fill="#9ac8e8" text-anchor="start">摘要：先看地圖</text><path d="M95 175H345" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="232" font-size="22" fill="#b7e89f" text-anchor="start">方法：如何比較</text><path d="M95 252H345" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="309" font-size="22" fill="#ead68c" text-anchor="start">結果：完整數字</text><path d="M95 329H345" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="386" font-size="22" fill="#c1b2ea" text-anchor="start">討論：推論邊界</text><path d="M95 406H345" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="570" cy="215" rx="100" ry="82" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="680" cy="215" rx="100" ry="82" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="540" y="220" font-size="21" fill="#9ac8e8" text-anchor="start">同義詞</text><text x="675" y="220" font-size="22" fill="#ead68c" text-anchor="start">OR</text><text x="590" y="337" font-size="23" fill="#b7e89f" text-anchor="middle">與另一概念 AND</text><path d="M600 308L600 370" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.3 361.0L600 370L595.7 361.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="460" y="418" font-size="20" fill="#e3e9e2" text-anchor="start">查詢式、平台與日期一起記錄</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>