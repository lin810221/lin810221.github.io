<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-08-title ebh-08-desc"><title id="ebh-08-title">世代與病例對照：從哪裡抽樣</title><desc id="ebh-08-desc">上方世代研究從符合資格人群及暴露分類追蹤事件，下方病例對照依結果狀態抽樣再比較暴露；回溯抽資料不等於病例對照。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 08 / 世代與病例對照：從哪裡抽樣</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">箭頭表示研究比較與資料方向，不是證明暴露造成事件。</text><rect x="55.0" y="131" width="230" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="170" y="167" font-size="21" fill="#9ac8e8" text-anchor="middle">暴露／未暴露</text><path d="M310 160L525 160" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M516.0 155.7L525 160L516.0 164.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="565.0" y="131" width="210" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="670" y="167" font-size="21" fill="#b7e89f" text-anchor="middle">後續事件</text><text x="425" y="130" font-size="19" fill="#9ac8e8" text-anchor="middle">世代：向前定義風險窗</text><path d="M70 260H790" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55.0" y="321" width="230" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="170" y="357" font-size="21" fill="#ead68c" text-anchor="middle">過去暴露資料</text><path d="M525 350L310 350" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M319.0 354.3L310 350L319.0 345.7" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="535.0" y="321" width="270" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="670" y="357" font-size="21" fill="#c1b2ea" text-anchor="middle">病例／來源對照</text><text x="425" y="420" font-size="20" fill="#c1b2ea" text-anchor="middle">病例對照：依結果抽樣，再查暴露</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>