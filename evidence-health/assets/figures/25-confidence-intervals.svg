<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-25-title ebh-25-desc"><title id="ebh-25-title">點估計、區間與無差異線</title><desc id="ebh-25-desc">三個虛構差量估計及95%區間，A負2且負4至0、B負2且負2.5至負1.5、C零且負3至3；無差異值為0，展示精確度與方向。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 25 / 點估計、區間與無差異線</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><path d="M430 125V370" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="446" y="138" font-size="19" fill="#c1b2ea" text-anchor="start">無差異0</text><text x="70" y="192" font-size="22" fill="#b7e89f" text-anchor="start">A</text><path d="M142 185H430" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="286" cy="185" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><path d="M142 176V194" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 176V194" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="272" font-size="22" fill="#9ac8e8" text-anchor="start">B</text><path d="M250.0 265H322.0" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="286" cy="265" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M250.0 256V274" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.0 256V274" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="352" font-size="22" fill="#ead68c" text-anchor="start">C</text><path d="M214 345H646" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="345" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M214 336V354" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M646 336V354" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 389H730" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="420" font-size="18" fill="#9ac8e8" text-anchor="middle">-4</text><text x="286" y="420" font-size="18" fill="#9ac8e8" text-anchor="middle">-2</text><text x="430" y="420" font-size="18" fill="#9ac8e8" text-anchor="middle">0</text><text x="574" y="420" font-size="18" fill="#9ac8e8" text-anchor="middle">2</text><text x="718" y="420" font-size="18" fill="#9ac8e8" text-anchor="middle">4</text><text x="70" y="457" font-size="19" fill="#e3e9e2" text-anchor="start">任意差量單位；區間與P值都不能單獨證明重要或無偏。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>