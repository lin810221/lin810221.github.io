<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-49-title ebh-49-desc"><title id="ebh-49-title">機制、人體結果與新聞是不同層次</title><desc id="ebh-49-desc">左側分子符號、中央人體樣本與右側新聞文件由箭頭相連；每一箭頭都是待核對的證據步驟，不能由機制直接跳到有效或安全。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 49 / 機制、人體結果與新聞是不同層次</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><ellipse cx="100" cy="225" rx="18" ry="18" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="155" cy="175" rx="18" ry="18" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="200" cy="240" rx="18" ry="18" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M115 210L142 185M167 193L189 223M119 228L182 238" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="326" font-size="22" fill="#9ac8e8" text-anchor="start">機制或細胞</text><path d="M235 230L330 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.0 225.7L330 230L321.0 234.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="155" width="185" height="160" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><ellipse cx="385" cy="210" rx="10" ry="10" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="385" cy="257" rx="10" ry="10" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="440" cy="210" rx="10" ry="10" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="440" cy="257" rx="10" ry="10" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="362" y="355" font-size="21" fill="#b7e89f" text-anchor="start">人體研究與結果</text><path d="M550 230L620 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M611.0 225.7L620 230L611.0 234.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="640" y="145" width="160" height="190" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="660" y="195" font-size="23" fill="#ead68c" text-anchor="start">健康標題</text><path d="M661 230H780M661 270H780" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="441" font-size="20" fill="#e3e9e2" text-anchor="start">材料、劑量、對照、終點與研究設計，逐步核對。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>