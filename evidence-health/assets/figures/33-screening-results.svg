<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-33-title ebh-33-desc"><title id="ebh-33-title">把整個計畫放回共同分母</title><desc id="ebh-33-desc">虛構同期間各10000人比較，目標疾病死亡對照50邀請40，其他死亡950和952，總死亡1000和992；點差與未知區間分開，還需後續負擔資料。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 33 / 把整個計畫放回共同分母</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="105" y="120" font-size="22" fill="#9ac8e8" text-anchor="start">同期間、每組10000人：僅列點估計，區間待查</text><rect x="105" y="140" width="650" height="240" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M105 200H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 260H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 320H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.66666666666663 140V380" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M538.3333333333333 140V380" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120.0" y="179" font-size="20" fill="#b7e89f" text-anchor="start">結果</text><text x="336.66666666666663" y="179" font-size="20" fill="#b7e89f" text-anchor="start">對照</text><text x="553.3333333333333" y="179" font-size="20" fill="#b7e89f" text-anchor="start">邀請組</text><text x="120.0" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">目標疾病死亡</text><text x="336.66666666666663" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">50</text><text x="553.3333333333333" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">40</text><text x="120.0" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">其他死亡</text><text x="336.66666666666663" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">950</text><text x="553.3333333333333" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">952</text><text x="120.0" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">總死亡</text><text x="336.66666666666663" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">1000</text><text x="553.3333333333333" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">992</text><text x="105" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">另列確認、併發症、過度診斷與生活品質；未報不算0。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>