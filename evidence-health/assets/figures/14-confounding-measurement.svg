<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-14-title ebh-14-desc"><title id="ebh-14-title">共同原因與量測是不同問題</title><desc id="ebh-14-desc">共同原因C同時影響介入A與結果Y，形成後門路徑；另一側同一狀態經不同量測方式變成不同紀錄，調整不會修復所有錯分。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 14 / 共同原因與量測是不同問題</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">DAG箭頭是因果假設；右側是量測流程，非同一種統計偏差。</text><rect x="125.0" y="126" width="210" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="230" y="162" font-size="21" fill="#ead68c" text-anchor="middle">共同原因C</text><rect x="30.0" y="321" width="160" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="110" y="357" font-size="21" fill="#9ac8e8" text-anchor="middle">介入A</text><rect x="310.0" y="321" width="160" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="390" y="357" font-size="21" fill="#b7e89f" text-anchor="middle">結果Y</text><path d="M180 195L122 310" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M129.9 303.9L122 310L122.2 300.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 195L378 310" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M375.5 300.3L378 310L368.8 306.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 350L290 350" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M281.0 345.7L290 350L281.0 354.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 110V440" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="145" font-size="23" fill="#c1b2ea" text-anchor="start">同一實際狀態</text><path d="M650 180L650 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.3 221.0L650 230L645.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520.0" y="241" width="260" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="650" y="277" font-size="21" fill="#c1b2ea" text-anchor="middle">不同量具／回憶</text><path d="M650 310L650 360" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.3 351.0L650 360L645.7 351.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="405" font-size="23" fill="#eda894" text-anchor="start">不同觀察紀錄</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>