<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-31-title ebh-31-desc"><title id="ebh-31-title">共同時間線：更早知道不自動延壽</title><desc id="ebh-31-desc">兩條原創時間線共同從第0年起算，症狀發現於第6年、篩檢發現於第2年，皆第9年死亡；診斷後存活從3變7年但生命長度未改。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 31 / 共同時間線：更早知道不自動延壽</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="60" y="120" font-size="19" fill="#e3e9e2" text-anchor="start">此圖只示範診斷提早；完整篩檢計畫仍需追後續效益與傷害。</text><text x="30" y="207" font-size="21" fill="#9ac8e8" text-anchor="start">症狀發現</text><path d="M150 200H690" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="510" cy="200" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="690" cy="200" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="510" y="173" font-size="19" fill="#9ac8e8" text-anchor="middle">診斷：第6年</text><text x="690" y="173" font-size="19" fill="#ead68c" text-anchor="middle">死亡：第9年</text><text x="600.0" y="243" font-size="21" fill="#9ac8e8" text-anchor="middle">診斷後3年</text><text x="30" y="327" font-size="21" fill="#b7e89f" text-anchor="start">篩檢發現</text><path d="M150 320H690" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="270" cy="320" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="690" cy="320" rx="9" ry="9" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="270" y="293" font-size="19" fill="#b7e89f" text-anchor="middle">診斷：第2年</text><text x="690" y="293" font-size="19" fill="#ead68c" text-anchor="middle">死亡：第9年</text><text x="480.0" y="363" font-size="21" fill="#b7e89f" text-anchor="middle">診斷後7年</text><path d="M150 404H750" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="434" font-size="18" fill="#c1b2ea" text-anchor="middle">0</text><text x="270" y="434" font-size="18" fill="#c1b2ea" text-anchor="middle">2</text><text x="390" y="434" font-size="18" fill="#c1b2ea" text-anchor="middle">4</text><text x="510" y="434" font-size="18" fill="#c1b2ea" text-anchor="middle">6</text><text x="630" y="434" font-size="18" fill="#c1b2ea" text-anchor="middle">8</text><text x="750" y="434" font-size="18" fill="#c1b2ea" text-anchor="middle">10</text><text x="60" y="465" font-size="19" fill="#e3e9e2" text-anchor="start">橫軸：從共同起點的年數；死亡時間沒有改變。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>