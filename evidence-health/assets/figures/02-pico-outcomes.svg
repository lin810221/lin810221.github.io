<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-02-title ebh-02-desc"><title id="ebh-02-title">從PICO走到重要結果</title><desc id="ebh-02-desc">P族群、I介入或E暴露、C比較及O結果共同限定問題；右側區分機制、替代指標與病人重要結果，箭頭非療效保證。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 02 / 從PICO走到重要結果</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">箭頭是待檢查的證據鏈；機制成立不保證重要健康結果改善。</text><rect x="55" y="118" width="300" height="61" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="75" y="156" font-size="21" fill="#9ac8e8" text-anchor="start">P：對誰</text><rect x="55" y="195" width="300" height="61" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="75" y="233" font-size="21" fill="#b7e89f" text-anchor="start">I／E：做什麼或接觸什麼</text><rect x="55" y="272" width="300" height="61" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="75" y="310" font-size="21" fill="#ead68c" text-anchor="start">C：與什麼相比</text><rect x="55" y="349" width="300" height="61" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="75" y="387" font-size="21" fill="#c1b2ea" text-anchor="start">O：看哪個結果</text><path d="M380 261L460 261" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.0 256.7L460 261L451.0 265.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="540.0" y="121" width="220" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="650" y="157" font-size="21" fill="#9ac8e8" text-anchor="middle">作用機制</text><path d="M650 190L650 221" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.3 212.0L650 221L645.7 212.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="540.0" y="231" width="220" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="650" y="267" font-size="21" fill="#ead68c" text-anchor="middle">替代指標</text><path d="M650 300L650 331" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M654.3 322.0L650 331L645.7 322.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520.0" y="341" width="260" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="650" y="377" font-size="21" fill="#c1b2ea" text-anchor="middle">生活與健康結果</text><text x="440" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">每一段都需要證據，不可直接跳接。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>