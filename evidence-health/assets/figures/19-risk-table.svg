<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-19-title ebh-19-desc"><title id="ebh-19-title">從共同人數重建二乘二表</title><desc id="ebh-19-desc">表中兩組各1000人，介入30人事件970人未事件，對照40人事件960人未事件；所有人都完整追蹤一年，事件是不理想結果。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19 / 從共同人數重建二乘二表</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="105" y="120" font-size="22" fill="#9ac8e8" text-anchor="start">一年內至少一次不良事件：完整追蹤的虛構人數</text><rect x="105" y="140" width="650" height="240" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M105 200H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 260H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 320H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.66666666666663 140V380" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M538.3333333333333 140V380" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120.0" y="179" font-size="20" fill="#b7e89f" text-anchor="start">分組／分母</text><text x="336.66666666666663" y="179" font-size="20" fill="#b7e89f" text-anchor="start">事件</text><text x="553.3333333333333" y="179" font-size="20" fill="#b7e89f" text-anchor="start">未事件</text><text x="120.0" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">介入／1000</text><text x="336.66666666666663" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">30</text><text x="553.3333333333333" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">970</text><text x="120.0" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">對照／1000</text><text x="336.66666666666663" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">40</text><text x="553.3333333333333" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">960</text><text x="120.0" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">合計／2000</text><text x="336.66666666666663" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">70</text><text x="553.3333333333333" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">1930</text><text x="105" y="431" font-size="19" fill="#e3e9e2" text-anchor="start">風險用人數；發生率另需在險人時，本圖未提供。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>