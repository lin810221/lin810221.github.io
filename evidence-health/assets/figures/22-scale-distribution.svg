<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-22-title ebh-22-desc"><title id="ebh-22-title">量尺、平均與分散各說一件事</title><desc id="ebh-22-desc">同一功能量尺下，A組48、50、52與B組20、50、80皆平均50，點的位置保留個人分散；不同分析目標不能只看平均判斷。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 22 / 量尺、平均與分散各說一件事</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="70" y="125" font-size="21" fill="#e3e9e2" text-anchor="start">同一原創功能量尺：0至100，越高越佳</text><path d="M140 290H740" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 283V297" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="325" font-size="18" fill="#9ac8e8" text-anchor="middle">0</text><path d="M260 283V297" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="325" font-size="18" fill="#9ac8e8" text-anchor="middle">20</text><path d="M380 283V297" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="325" font-size="18" fill="#9ac8e8" text-anchor="middle">40</text><path d="M500 283V297" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="325" font-size="18" fill="#9ac8e8" text-anchor="middle">60</text><path d="M620 283V297" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="325" font-size="18" fill="#9ac8e8" text-anchor="middle">80</text><path d="M740 283V297" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="325" font-size="18" fill="#9ac8e8" text-anchor="middle">100</text><text x="70" y="172" font-size="20" fill="#b7e89f" text-anchor="start">A：平均50</text><ellipse cx="428" cy="190" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="440" cy="190" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="452" cy="190" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="70" y="227" font-size="20" fill="#ead68c" text-anchor="start">B：平均50</text><ellipse cx="260" cy="245" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="440" cy="245" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="620" cy="245" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="70" y="384" font-size="21" fill="#e3e9e2" text-anchor="start">相同平均，分散不同；SD與SE不能互換。</text><text x="70" y="427" font-size="19" fill="#e3e9e2" text-anchor="start">結束差、改變差、基線調整：先確認分析目標。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>