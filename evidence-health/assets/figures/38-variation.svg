<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-38-title ebh-38-desc"><title id="ebh-38-title">研究內誤差與研究間差異</title><desc id="ebh-38-desc">上層三條線為不同研究的示例區間，下層長帶提醒平均效果與新情境效果不同；長度為概念示意，並非估計出的預測區間。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 38 / 研究內誤差與研究間差異</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">概念圖，橫軸任意效果尺度；不是實測數值或可讀取的區間。</text><text x="75" y="125" font-size="22" fill="#9ac8e8" text-anchor="start">研究內的不確定性</text><path d="M145 190H390M350 250H610M250 310H525" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="265" cy="190" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="470" cy="250" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="385" cy="310" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="665" y="195" font-size="20" fill="#e3e9e2" text-anchor="start">研究A</text><text x="665" y="255" font-size="20" fill="#e3e9e2" text-anchor="start">研究B</text><text x="665" y="315" font-size="20" fill="#e3e9e2" text-anchor="start">研究C</text><path d="M100 410H720" stroke="#ead68c" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="453" font-size="18" fill="#e3e9e2" text-anchor="start">研究間差異另有假設；不能只把區間加寬就當解決偏差。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>