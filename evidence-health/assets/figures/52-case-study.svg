<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-52-title ebh-52-desc"><title id="ebh-52-title">專題：先核分母，再檢查設計與因果</title><desc id="ebh-52-desc">左側是虛構隨機比較30／1000對40／1000；右側觀察研究保留未量測混雜與時間零點的問號。兩邊資料不能混成同一因果結論。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 52 / 專題：先核分母，再檢查設計與因果</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><rect x="65" y="130" width="350" height="290" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="90" y="172" font-size="25" fill="#9ac8e8" text-anchor="start">虛構試驗</text><text x="90" y="230" font-size="24" fill="#b7e89f" text-anchor="start">介入：30／1000</text><text x="90" y="285" font-size="24" fill="#ead68c" text-anchor="start">對照：40／1000</text><text x="90" y="360" font-size="20" fill="#e3e9e2" text-anchor="start">分配、缺失、區間仍要查</text><rect x="445" y="130" width="350" height="290" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="470" y="172" font-size="25" fill="#c1b2ea" text-anchor="start">虛構觀察研究</text><text x="470" y="230" font-size="24" fill="#e3e9e2" text-anchor="start">時間零點 ？</text><text x="470" y="285" font-size="24" fill="#e3e9e2" text-anchor="start">混雜與選擇 ？</text><text x="470" y="360" font-size="20" fill="#e3e9e2" text-anchor="start">調整後數值不是因果保證</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>