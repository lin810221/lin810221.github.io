<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-15-title ebh-15-desc"><title id="ebh-15-title">選中誰與加權後的比較</title><desc id="ebh-15-desc">原始母群經參與及追蹤流程只留下部分人；傾向分數權重改變分析中的代表程度，不能創造原本不存在的比較資料。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 15 / 選中誰與加權後的比較</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">點大小僅代表示意權重，不代表個人價值；選擇可能產生也可能沒有偏差。</text><ellipse cx="100" cy="145" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="142" cy="145" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="184" cy="145" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="226" cy="145" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="268" cy="145" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="100" cy="200" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="142" cy="200" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="184" cy="200" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="226" cy="200" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="268" cy="200" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="100" cy="255" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="142" cy="255" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="184" cy="255" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="226" cy="255" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><ellipse cx="268" cy="255" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><path d="M330 205L430 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M421.0 200.7L430 205L421.0 209.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="485" cy="155" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="535" cy="155" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="585" cy="155" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="485" cy="215" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="535" cy="215" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="585" cy="215" rx="11" ry="11" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="72" y="360" font-size="22" fill="#9ac8e8" text-anchor="start">來源人群</text><text x="460" y="360" font-size="22" fill="#ead68c" text-anchor="start">參與／留下者</text><path d="M665 125V345" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="740" cy="175" rx="14" ry="14" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="740" cy="285" rx="28" ry="28" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="675" y="406" font-size="19" fill="#b7e89f" text-anchor="start">權重非新資料</text><text x="80" y="455" font-size="18" fill="#e3e9e2" text-anchor="start">未測混雜、未重疊族群與選擇機制，不能只靠模型名稱略過。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>