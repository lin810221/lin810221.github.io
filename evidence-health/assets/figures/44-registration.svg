<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-44-title ebh-44-desc"><title id="ebh-44-title">沿時間比對預先計畫與實際結果</title><desc id="ebh-44-desc">登錄、收案、資料鎖定及發表以先後排列；上方計畫線與下方結果線分開，差異需說明理由與時間，不把任何修訂自動判成不當行為。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 44 / 沿時間比對預先計畫與實際結果</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><path d="M90 190H775" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="120" cy="190" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="120" y="155" font-size="21" fill="#9ac8e8" text-anchor="middle">事前登錄</text><ellipse cx="320" cy="190" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="320" y="155" font-size="21" fill="#9ac8e8" text-anchor="middle">開始收案</text><ellipse cx="540" cy="190" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="540" y="155" font-size="21" fill="#9ac8e8" text-anchor="middle">資料鎖定</text><ellipse cx="740" cy="190" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="740" y="155" font-size="21" fill="#9ac8e8" text-anchor="middle">公開報告</text><path d="M120 270H740" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="309" font-size="20" fill="#b7e89f" text-anchor="start">計畫：結果、時間點、分析集</text><path d="M120 355H740" stroke="#ead68c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="396" font-size="20" fill="#ead68c" text-anchor="start">報告：原訂、修訂與新增分開</text><text x="90" y="451" font-size="19" fill="#e3e9e2" text-anchor="start">經費、資料存取與分析責任，另查完整揭露。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>