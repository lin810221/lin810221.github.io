<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-39-title ebh-39-desc"><title id="ebh-39-title">直接、間接與持續更新的證據</title><desc id="ebh-39-desc">三個介入節點有直接比較連線；虛線是待檢查的間接資訊，不表示因果DAG。下方時間點表示搜尋更新，而非看到新結果才決定是否納入。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 39 / 直接、間接與持續更新的證據</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><path d="M195 220L435 125 680 220" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 220H680" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><ellipse cx="195" cy="220" rx="48" ry="48" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="435" cy="125" rx="48" ry="48" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="680" cy="220" rx="48" ry="48" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="195" y="227" font-size="26" fill="#b7e89f" text-anchor="middle">A</text><text x="435" y="132" font-size="26" fill="#b7e89f" text-anchor="middle">B</text><text x="680" y="227" font-size="26" fill="#b7e89f" text-anchor="middle">C</text><text x="330" y="265" font-size="18" fill="#ead68c" text-anchor="start">間接比較需可轉移性</text><path d="M100 365H755" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="170" cy="365" rx="9" ry="9" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="170" y="405" font-size="18" fill="#c1b2ea" text-anchor="middle">初版</text><ellipse cx="390" cy="365" rx="9" ry="9" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="390" y="405" font-size="18" fill="#c1b2ea" text-anchor="middle">新證據</text><ellipse cx="620" cy="365" rx="9" ry="9" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="620" y="405" font-size="18" fill="#c1b2ea" text-anchor="middle">更新判讀</text><text x="100" y="450" font-size="19" fill="#e3e9e2" text-anchor="start">同一套納入、偏差與版本紀錄，仍須持續維護。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>