<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-34-title ebh-34-desc"><title id="ebh-34-title">回顧計畫與多來源搜尋</title><desc id="ebh-34-desc">左側先寫問題、納入與追蹤規則並留下變更日期，右側原創搜尋示意連到文獻資料庫、研究登錄與其他報告引用；不是只依免費全文決定納入。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34 / 回顧計畫與多來源搜尋</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="60" y="121" font-size="21" fill="#e3e9e2" text-anchor="start">問題與納入規則在前；來源與搜尋語法可以回查。</text><rect x="60" y="165" width="245" height="235" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="85" y="207" font-size="25" fill="#9ac8e8" text-anchor="start">事前計畫</text><text x="85" y="254" font-size="20" fill="#e3e9e2" text-anchor="start">對象、比較、結果</text><text x="85" y="294" font-size="20" fill="#e3e9e2" text-anchor="start">設計與追蹤範圍</text><text x="85" y="354" font-size="19" fill="#ead68c" text-anchor="start">變更：日期與理由</text><path d="M320 280L380 280" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M371.0 275.7L380 280L371.0 284.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="430" cy="260" rx="42" ry="42" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M460 291L488 319" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M485 260L550 199" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540.5 202.0L550 199L546.4 208.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="565" y="175" width="235" height="55" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="585" y="210" font-size="21" fill="#b7e89f" text-anchor="start">文獻資料庫</text><path d="M485 260L550 289" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M543.5 281.4L550 289L540.0 289.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="565" y="265" width="235" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="585" y="300" font-size="21" fill="#ead68c" text-anchor="start">研究登錄</text><path d="M485 260L550 379" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M549.5 369.0L550 379L541.9 373.2" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="565" y="355" width="235" height="55" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="585" y="390" font-size="21" fill="#c1b2ea" text-anchor="start">其他報告／引用</text><text x="60" y="450" font-size="19" fill="#e3e9e2" text-anchor="start">多來源找研究；只取得某篇報告，不代表已取得所有結果。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>