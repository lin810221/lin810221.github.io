<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-28-title ebh-28-desc"><title id="ebh-28-title">診斷四格：先認參考狀況</title><desc id="ebh-28-desc">虛構10000人皆完成參考判定，100人有目標狀況、9900人沒有；指標陽性包含90位真陽和495位假陽，陰性包含10位假陰和9405位真陰。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28 / 診斷四格：先認參考狀況</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><text x="105" y="120" font-size="22" fill="#9ac8e8" text-anchor="start">同一批10000人；有／無依參考標準判定</text><rect x="105" y="140" width="650" height="240" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M105 200H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 260H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 320H755" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.66666666666663 140V380" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M538.3333333333333 140V380" stroke="#9ac8e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120.0" y="179" font-size="20" fill="#b7e89f" text-anchor="start">指標結果</text><text x="336.66666666666663" y="179" font-size="20" fill="#b7e89f" text-anchor="start">有狀況／100</text><text x="553.3333333333333" y="179" font-size="20" fill="#b7e89f" text-anchor="start">無狀況／9900</text><text x="120.0" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">陽性</text><text x="336.66666666666663" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">TP 90</text><text x="553.3333333333333" y="239" font-size="20" fill="#e3e9e2" text-anchor="start">FP 495</text><text x="120.0" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">陰性</text><text x="336.66666666666663" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">FN 10</text><text x="553.3333333333333" y="299" font-size="20" fill="#e3e9e2" text-anchor="start">TN 9405</text><text x="120.0" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">欄合計</text><text x="336.66666666666663" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">100</text><text x="553.3333333333333" y="359" font-size="20" fill="#e3e9e2" text-anchor="start">9900</text><text x="105" y="431" font-size="18" fill="#e3e9e2" text-anchor="start">敏感度90%；特異度95%；不可直接平均成個人正確率。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>