<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-18-title ebh-18-desc"><title id="ebh-18-title">時間順序、反向因果與多種檢查</title><desc id="ebh-18-desc">上方疾病早期變化可能先改變行為，再被記成暴露與後來診斷相關；下方不同敏感度及對照問題檢查假設，不會自動把觀察變隨機。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 18 / 時間順序、反向因果與多種檢查</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">方向為特定假說；不同檢查提供相互補充的資訊，不是投票決定因果。</text><rect x="40.0" y="141" width="280" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="180" y="177" font-size="21" fill="#ead68c" text-anchor="middle">未察覺的早期變化</text><path d="M335 170L515 170" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M506.0 165.7L515 170L506.0 174.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="530.0" y="141" width="280" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="670" y="177" font-size="21" fill="#9ac8e8" text-anchor="middle">較早量到的行為</text><path d="M280 215L515 260" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M507.0 254.0L515 260L505.3 262.6" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="530.0" y="246" width="280" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="670" y="282" font-size="21" fill="#b7e89f" text-anchor="middle">後來的正式診斷</text><text x="70" y="310" font-size="20" fill="#e3e9e2" text-anchor="start">量到較早，不等於真正原因較早。</text><rect x="65.0" y="361" width="220" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="175" y="397" font-size="21" fill="#9ac8e8" text-anchor="middle">改假設再估</text><rect x="320.0" y="361" width="220" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="430" y="397" font-size="21" fill="#ead68c" text-anchor="middle">負向對照</text><rect x="575.0" y="361" width="220" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="685" y="397" font-size="21" fill="#c1b2ea" text-anchor="middle">不同資料與方法</text><text x="80" y="456" font-size="19" fill="#e3e9e2" text-anchor="start">檢查需說明預期機制；一致也不保證沒有共同錯誤。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>