<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-53-title ebh-53-desc"><title id="ebh-53-title">專題：不要把兩種分母混成結論</title><desc id="ebh-53-desc">左側自然頻率示意為虛構一萬人，陽性90真陽與495假陽；右側森林圖提醒獨立結果、異質性及證據確定性需另評估。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 53 / 專題：不要把兩種分母混成結論</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><rect x="65" y="130" width="350" height="290" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="85" y="170" font-size="23" fill="#9ac8e8" text-anchor="start">虛構檢測：一萬人</text><text x="85" y="232" font-size="25" fill="#b7e89f" text-anchor="start">90 真陽性</text><text x="85" y="287" font-size="25" fill="#ead68c" text-anchor="start">495 假陽性</text><text x="85" y="357" font-size="21" fill="#e3e9e2" text-anchor="start">陽性預測值約15.4%</text><path d="M475 190H710M530 260H755M490 330H735" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 150V380" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><ellipse cx="575" cy="190" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="680" cy="260" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><ellipse cx="605" cy="330" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="470" y="423" font-size="18" fill="#e3e9e2" text-anchor="start">右側概念區間，不能直接讀數</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>