<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-17-title ebh-17-desc"><title id="ebh-17-title">碰撞點與中介：調整會改問題</title><desc id="ebh-17-desc">左側碰撞點C同受A與Y影響，限制C可能打開本來關閉的路徑；右側中介M位於A到Y路徑，調整M不再是同一總效果問題。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 17 / 碰撞點與中介：調整會改問題</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">C與M的角色取決於指定DAG和估計目標，不是變數永遠固定的標籤。</text><rect x="80.0" y="121" width="90" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="125" y="157" font-size="21" fill="#9ac8e8" text-anchor="middle">A</text><rect x="280.0" y="121" width="90" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="325" y="157" font-size="21" fill="#b7e89f" text-anchor="middle">Y</text><rect x="110.0" y="281" width="230" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="225" y="317" font-size="21" fill="#ead68c" text-anchor="middle">C：碰撞點</text><path d="M155 193L205 270" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M203.7 260.1L205 270L196.4 264.8" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M295 193L245 270" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M253.6 264.8L245 270L246.3 260.1" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="410" font-size="22" fill="#ead68c" text-anchor="start">限制C可能引進關聯</text><path d="M430 110V450" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475.0" y="121" width="90" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="520" y="157" font-size="21" fill="#9ac8e8" text-anchor="middle">A</text><rect x="585.0" y="241" width="90" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="630" y="277" font-size="21" fill="#c1b2ea" text-anchor="middle">M</text><rect x="695.0" y="361" width="90" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="740" y="397" font-size="21" fill="#b7e89f" text-anchor="middle">Y</text><path d="M545 189L604 232" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M599.3 223.2L604 232L594.2 230.2" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M653 309L715 351" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M710.0 342.3L715 351L705.1 349.6" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="442" font-size="20" fill="#c1b2ea" text-anchor="start">調整M改變效果目標</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>