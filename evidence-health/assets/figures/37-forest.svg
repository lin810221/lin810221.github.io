<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-37-title ebh-37-desc"><title id="ebh-37-title">森林圖：點、區間與權重</title><desc id="ebh-37-desc">三個虛構研究的RR與log標準誤轉成95%區間；方塊面積依反變異數，菱形表示共同效果近似區間，橫軸採對數刻度。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37 / 森林圖：點、區間與權重</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><text x="62" y="119" font-size="19" fill="#9ac8e8" text-anchor="start">虛構研究</text><text x="705" y="119" font-size="18" fill="#9ac8e8" text-anchor="start">RR及95%區間</text><path d="M300 410H660" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 130V405" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="64" y="170" font-size="20" fill="#e3e9e2" text-anchor="start">研究A</text><path d="M371.15466187771216 164H472.9512239628374" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="411.0529429202748" y="153.0" width="22.0" height="22.0" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="706" y="170" font-size="16" fill="#e3e9e2" text-anchor="start">0.80 [0.66,0.97]</text><text x="64" y="244" font-size="20" fill="#e3e9e2" text-anchor="start">研究B</text><path d="M378.2034379148747 238H581.7965620851253" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="474.5" y="232.5" width="11.0" height="11.0" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="706" y="244" font-size="16" fill="#e3e9e2" text-anchor="start">1.00 [0.68,1.48]</text><text x="64" y="318" font-size="20" fill="#e3e9e2" text-anchor="start">研究C</text><path d="M450.998771486239 312H603.6936146139268" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520.0128597167495" y="304.6666666666667" width="14.666666666666668" height="14.666666666666668" rx="1" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><text x="706" y="318" font-size="16" fill="#e3e9e2" text-anchor="start">1.20 [0.89,1.61]</text><text x="64" y="381" font-size="20" fill="#ead68c" text-anchor="start">共同效果</text><path d="M419.1192678004907 375L458.22041039231505 361 497.3215529841394 375 458.22041039231505 389Z" stroke="#ead68c" stroke-width="2" fill="#ead68c" stroke-linecap="round" stroke-linejoin="round"/><text x="706" y="381" font-size="18" fill="#ead68c" text-anchor="start">0.92</text><text x="300.0" y="439" font-size="18" fill="#9ac8e8" text-anchor="middle">0.5</text><text x="480.0" y="439" font-size="18" fill="#9ac8e8" text-anchor="middle">1</text><text x="660.0" y="439" font-size="18" fill="#9ac8e8" text-anchor="middle">2</text><text x="500" y="459" font-size="17" fill="#ead68c" text-anchor="middle">RR對數座標；無效線=1</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>