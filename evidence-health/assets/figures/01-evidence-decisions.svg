<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-01-title ebh-01-desc"><title id="ebh-01-title">證據、專業與人的選擇</title><desc id="ebh-01-desc">三個相互連結的面向圍繞具體決策；研究提供比較資訊，專業判適用，當事人的目標與負擔參與選擇。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 01 / 證據、專業與人的選擇</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">連線表示共同參與決策，不表示三者有固定權重或分數。</text><path d="M235 205L625 205 430 370Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="235" cy="205" rx="112" ry="64" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="235" y="212" font-size="25" fill="#9ac8e8" text-anchor="middle">研究證據</text><ellipse cx="625" cy="205" rx="112" ry="64" stroke="#ead68c" fill="#17251e" stroke-width="3"/><text x="625" y="212" font-size="23" fill="#ead68c" text-anchor="middle">專業與情境</text><ellipse cx="430" cy="370" rx="140" ry="65" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="430" y="377" font-size="23" fill="#c1b2ea" text-anchor="middle">目標、價值與負擔</text><text x="430" y="290" font-size="23" fill="#b7e89f" text-anchor="middle">具體問題與比較</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>