<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-51-title ebh-51-desc"><title id="ebh-51-title">模型分數、外部驗證與臨床影響分開</title><desc id="ebh-51-desc">左側示例預測曲線與右側不同場域代表驗證；最下方結果框另問使用模型後的效益與傷害。曲線任意，不是特定醫療產品性能。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 51 / 模型分數、外部驗證與臨床影響分開</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">左圖為任意預測與觀察關係示意，沒有實測刻度。</text><path d="M80 330V135M80 330H350M80 330L350 135" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 330Q200 310 350 135" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="373" font-size="20" fill="#9ac8e8" text-anchor="start">校準：預測與觀察</text><rect x="450" y="130" width="325" height="125" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="475" y="171" font-size="23" fill="#c1b2ea" text-anchor="start">新時間與新場域</text><text x="475" y="217" font-size="20" fill="#e3e9e2" text-anchor="start">外部驗證與資料完整性</text><path d="M610 270L610 320" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M614.3 311.0L610 320L605.7 311.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="450" y="335" width="325" height="90" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="475" y="370" font-size="20" fill="#ead68c" text-anchor="start">實際使用後的效益／傷害</text><text x="475" y="402" font-size="18" fill="#e3e9e2" text-anchor="start">不能只看AUC或準確率</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>