<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-23-title ebh-23-desc"><title id="ebh-23-title">標準化分母與存活的在險集合</title><desc id="ebh-23-desc">左半顯示相同平均差2分除以SD10或5得到0.2或0.4；右半五人追蹤在第2月事件、第3月截尾、第5月再事件，階梯降到約0.533。</desc><rect width="860" height="520" rx="14" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 23 / 標準化分母與存活的在險集合</text><text x="32" y="77" font-size="16" fill="#aab8ac" text-anchor="start">原創教學圖；數字與情境均為虛構，不是醫療建議。</text><rect x="45" y="115" width="355" height="320" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="65" y="151" font-size="21" fill="#9ac8e8" text-anchor="start">左：同原差2分</text><path d="M90 335H355" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="95" y="230" width="80" height="80" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="240" y="150" width="80" height="160" rx="3" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="135" y="365" font-size="20" fill="#b7e89f" text-anchor="middle">SD10</text><text x="280" y="365" font-size="20" fill="#ead68c" text-anchor="middle">SD5</text><text x="135" y="405" font-size="20" fill="#b7e89f" text-anchor="middle">SMD0.2</text><text x="280" y="405" font-size="20" fill="#ead68c" text-anchor="middle">SMD0.4</text><rect x="430" y="115" width="385" height="320" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="450" y="151" font-size="21" fill="#c1b2ea" text-anchor="start">右：五人首次事件追蹤</text><path d="M475 365H780M475 365V180" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M475 190H559V225H685V272H780" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M601 216V234" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="559" y="394" font-size="18" fill="#9ac8e8" text-anchor="middle">2月</text><text x="601" y="394" font-size="18" fill="#ead68c" text-anchor="middle">3月</text><text x="685" y="394" font-size="18" fill="#9ac8e8" text-anchor="middle">5月</text><text x="470" y="196" font-size="18" fill="#e3e9e2" text-anchor="end">1</text><text x="470" y="231" font-size="18" fill="#e3e9e2" text-anchor="end">0.8</text><text x="470" y="278" font-size="18" fill="#e3e9e2" text-anchor="end">0.53</text><text x="470" y="371" font-size="18" fill="#e3e9e2" text-anchor="end">0</text><text x="455" y="425" font-size="18" fill="#e3e9e2" text-anchor="start">3月截尾；5月在險3人。</text><text x="32" y="486" font-size="16" fill="#aab8ac" text-anchor="start">讀圖先核分母、時間與圖例，再說明能支持及尚未支持的結論。</text></g></svg>