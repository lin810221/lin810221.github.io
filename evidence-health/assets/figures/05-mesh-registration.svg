<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-05-title ebh-05-desc"><title id="ebh-05-title">搜尋詞與登錄的兩條線索</title><desc id="ebh-05-desc">搜尋詞以主題詞與自由詞相互補充，登錄資料的時間戳先於收案或結果分析才支持事前規劃，兩者不是同一種索引。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 05 / 搜尋詞與登錄的兩條線索</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">登錄需查實際時間與歷史；有登錄編號不代表一定為事前登錄。</text><rect x="95.0" y="125" width="250" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="220" y="161" font-size="21" fill="#9ac8e8" text-anchor="middle">MeSH主題詞</text><rect x="95.0" y="233" width="250" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="220" y="269" font-size="21" fill="#b7e89f" text-anchor="middle">自由文字</text><path d="M220 197L220 222" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.3 213.0L220 222L215.7 213.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="357" font-size="19" fill="#e3e9e2" text-anchor="start">索引延遲、同義詞與欄位皆要查</text><path d="M440 120V435" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 290H790" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="510" cy="290" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="510" y="345" font-size="18" fill="#ead68c" text-anchor="middle">初次登錄</text><ellipse cx="645" cy="290" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="645" y="345" font-size="18" fill="#ead68c" text-anchor="middle">開始收案</text><ellipse cx="770" cy="290" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="770" y="345" font-size="18" fill="#ead68c" text-anchor="middle">結果分析</text><text x="500" y="170" font-size="23" fill="#ead68c" text-anchor="start">版本歷史與時間戳</text><text x="480" y="402" font-size="18" fill="#e3e9e2" text-anchor="start">示例順序；真實研究逐筆核對</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>