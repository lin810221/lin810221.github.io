<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-54-title ebh-54-desc"><title id="ebh-54-title">交付一頁摘要：主張與根據逐項相連</title><desc id="ebh-54-desc">左側來源文件連到中央提取資料與右側摘要；問號保留未知及更新觸發條件。對照線表示證據追溯，不能用漂亮版面補齊未知。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 54 / 交付一頁摘要：主張與根據逐項相連</text><text x="34" y="75" font-size="16" fill="#adbcaf" text-anchor="start">原創教學示意；非真實研究或醫療建議。</text><rect x="60" y="130" width="190" height="270" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="80" y="173" font-size="24" fill="#9ac8e8" text-anchor="start">原始來源</text><path d="M85 215H225" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 255H225" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 295H225" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 335H225" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M265 255L320 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.0 250.7L320 255L311.0 259.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="130" width="190" height="270" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="355" y="173" font-size="24" fill="#b7e89f" text-anchor="start">提取與判讀</text><text x="355" y="235" font-size="20" fill="#e3e9e2" text-anchor="start">數字＋分母</text><text x="355" y="285" font-size="20" fill="#e3e9e2" text-anchor="start">條件＋偏差</text><text x="355" y="335" font-size="20" fill="#e3e9e2" text-anchor="start">日期＋版本</text><path d="M540 255L592 255" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M583.0 250.7L592 255L583.0 259.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="605" y="130" width="195" height="270" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="625" y="173" font-size="24" fill="#ead68c" text-anchor="start">證據摘要</text><text x="625" y="245" font-size="20" fill="#e3e9e2" text-anchor="start">可支持什麼</text><text x="625" y="295" font-size="20" fill="#e3e9e2" text-anchor="start">仍未知什麼</text><text x="625" y="355" font-size="30" fill="#c1b2ea" text-anchor="start">？</text><text x="85" y="450" font-size="19" fill="#e3e9e2" text-anchor="start">用一段可核對的話，保留限制、來源與下一次更新的理由。</text><text x="34" y="487" font-size="16" fill="#adbcaf" text-anchor="start">先看研究問題、分母與時間，再辨認圖的假設及尚未知道的部分。</text></g></svg>