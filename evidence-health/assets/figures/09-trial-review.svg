<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="ebh-09-title ebh-09-desc"><title id="ebh-09-title">試驗分配與回顧整合不同層次</title><desc id="ebh-09-desc">上方研究者隨機分派後追蹤兩組，下方多份報告需先辨識是否屬於不同研究；回顧有明確篩選與評估，不只是把數字加總。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Segoe UI,sans-serif"><text x="32" y="40" font-size="23" fill="#b7e89f" text-anchor="start">圖 09 / 試驗分配與回顧整合不同層次</text><text x="32" y="77" font-size="15" fill="#afbdaf" text-anchor="start">隨機分派支持比較的起點；回顧的名稱與合併大小不自動保證可信。</text><rect x="70.0" y="141" width="220" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="180" y="177" font-size="21" fill="#9ac8e8" text-anchor="middle">符合資格者</text><path d="M305 170L395 130" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M385.0 129.7L395 130L388.5 137.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M305 170L395 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M389.2 211.8L395 220L385.0 219.4" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="450.0" y="101" width="220" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="560" y="137" font-size="21" fill="#b7e89f" text-anchor="middle">隨機分配A</text><rect x="450.0" y="191" width="220" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="560" y="227" font-size="21" fill="#ead68c" text-anchor="middle">隨機分配B</text><text x="705" y="185" font-size="19" fill="#e3e9e2" text-anchor="start">同窗追蹤</text><path d="M65 295H795" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="85" y="335" width="135" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="100" y="380" font-size="19" fill="#9ac8e8" text-anchor="start">報告1</text><rect x="260" y="335" width="135" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="275" y="380" font-size="19" fill="#b7e89f" text-anchor="start">報告2</text><rect x="435" y="335" width="135" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="450" y="380" font-size="19" fill="#ead68c" text-anchor="start">報告3</text><path d="M595 373L645 373" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M636.0 368.7L645 373L636.0 377.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="665.0" y="344" width="140" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="735" y="380" font-size="21" fill="#c1b2ea" text-anchor="middle">先去重</text><text x="90" y="454" font-size="19" fill="#e3e9e2" text-anchor="start">報告數 ≠ 研究數；回顧類型不同，回答的問題也不同。</text><text x="32" y="492" font-size="15" fill="#afbdaf" text-anchor="start">原創教學圖；案例皆為虛構。讀圖後回課文核對假設、分母、時間與限制。</text></g></svg>