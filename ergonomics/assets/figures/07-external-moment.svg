<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er07-title er07-desc"><title id="er07-title">外力、轉軸與垂直力臂</title><desc id="er07-desc">圖只顯示平面單一外力與力矩參考，其他外力、內力和三維動作省略，不能推傷害機率。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 07  /  外力、轉軸與垂直力臂</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M100 320H720" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="320" rx="13" ry="13" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M620 150L620 310" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M624.3 301.0L620 310L615.7 301.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 380L620 380" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M611.0 375.7L620 380L611.0 384.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="337" y="415" font-size="20" fill="#b7e89f" text-anchor="start">力臂（垂直距離）</text><text x="635" y="199" font-size="21" fill="#eda894" text-anchor="start">外力</text><text x="105" y="267" font-size="19" fill="#ead68c" text-anchor="start">轉軸</text><text x="75" y="445" font-size="18" fill="#e3e9e2" text-anchor="start">示意單一外力；不等於人體內力或個人傷害機率。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>