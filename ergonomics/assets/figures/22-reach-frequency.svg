<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er22-title er22-desc"><title id="er22-title">伸取與資訊配置：先看常用任務</title><desc id="er22-desc">俯視工作區比較較近與較遠物件，距離只是部分條件，頻率、視覺、支撐及身體需求仍需確認。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 22  /  伸取與資訊配置：先看常用任務</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="75" y="120" width="710" height="300" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><ellipse cx="330" cy="320" rx="36" ry="60" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><rect x="280" y="170" width="100" height="45" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="445" y="190" width="100" height="45" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M332 310L330 215M365 310L488 235" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="155" font-size="21" fill="#9ac8e8" text-anchor="start">俯視：位置與頻率一起看</text><text x="195" y="267" font-size="18" fill="#ead68c" text-anchor="start">常用區</text><text x="510" y="300" font-size="18" fill="#b7e89f" text-anchor="start">較遠位置</text><text x="100" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">位置示意，非每人共用的可達範圍或百分位。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>