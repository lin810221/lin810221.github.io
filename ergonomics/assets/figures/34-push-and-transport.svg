<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er34-title er34-desc"><title id="er34-title">推拉、路線與協作是整個任務</title><desc id="er34-desc">箭頭是虛構推車路線，啟動、持續、坡度與設備需要另觀察；不是由外功算安全限力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34  /  推拉、路線與協作是整個任務</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="120" width="730" height="300" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="260" y="145" width="110" height="175" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="520" y="255" width="160" height="135" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><path d="M120 350L180 350 180 130 415 130 415 230 730 230 730 370 750 370" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="310" width="55" height="40" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><ellipse cx="128" cy="360" rx="8" ry="8" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="165" cy="360" rx="8" ry="8" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="153" font-size="19" fill="#e3e9e2" text-anchor="start">路徑、輪具、坡度與視線</text><text x="90" y="450" font-size="18" fill="#e3e9e2" text-anchor="start">整趟路徑需觀察；不是推拉合規或限力圖。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>