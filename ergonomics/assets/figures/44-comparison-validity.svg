<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er44-title er44-desc"><title id="er44-title">比較條件、工具一致性與效度</title><desc id="er44-desc">同一資料可能有多種解釋，重現、有效測量、適用範圍與因果是不同要求，不平均序位分數當機率。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 44  /  比較條件、工具一致性與效度</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">前後比較</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">任務、時段及方法是否匹配</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不只挑一個漂亮變化</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">一致性</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">重複或不同觀察者是否接近</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">量錯也可能很一致</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">效度與適用</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">是否支持想回答的問題</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">改權重不自動保留證據</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">其他結果</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">新需求、功能與不確定</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">單一分數不能概括全部</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>