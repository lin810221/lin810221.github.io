<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er41-title er41-desc"><title id="er41-title">共用與生命階段：調整要能交接</title><desc id="er41-desc">一套設備可有不同使用者和調整需求，不能把成人公式或一次設定套所有兒少、孕期及照顧情境。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41  /  共用與生命階段：調整要能交接</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="190" cy="150" rx="22" ry="27" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M185 181L175 305 305 305 310 395H355M190 205L225 260H340" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 275H715M460 280V425M690 280V425" stroke="#ead68c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 210V320H235M175 320V426" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="525" y="120" width="150" height="95" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M600 215V266M562 267H638" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M303 400H380" stroke="#b7e89f" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="442" font-size="18" fill="#e3e9e2" text-anchor="start">足部、座面及背部支撐：依任務與個別需求一起調整。</text><rect x="655" y="310" width="145" height="65" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="668" y="337" font-size="17" fill="#c1b2ea" text-anchor="start">設定與交接</text><text x="668" y="361" font-size="15" fill="#e3e9e2" text-anchor="start">另留回顧</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>