<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er40-title er40-desc"><title id="er40-title">不同身體與功能：不只用平均尺寸</title><desc id="er40-desc">不同可達與淨空條件是有限的幾何需求，還需功能、骨關節條件及使用者回饋；不以年齡判能力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 40  /  不同身體與功能：不只用平均尺寸</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="230" cy="175" rx="25" ry="30" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M230 208V330M230 245L355 225M230 330L200 415M230 330L260 415" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="560" cy="205" rx="25" ry="30" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M560 238V330M560 265L665 245M560 330L530 415M560 330L590 415" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="125" font-size="23" fill="#e3e9e2" text-anchor="start">身體與功能有差異</text><text x="100" y="451" font-size="18" fill="#e3e9e2" text-anchor="start">群體趨勢與個人需求分開，不用同一模板要求所有人。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>