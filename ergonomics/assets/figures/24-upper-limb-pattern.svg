<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er24-title er24-desc"><title id="er24-title">重複上肢工作與後續觀察</title><desc id="er24-desc">不同時間片段可能有不同力、位置與恢復，觀察卡把任務與感受脈絡連接，不給疾病風險總分。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 24  /  重複上肢工作與後續觀察</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="70" y="130" font-size="20" fill="#e3e9e2" text-anchor="start">時間順序 →；區塊不代表疾病或安全分級</text><rect x="80" y="180" width="210" height="120" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="105" y="250" font-size="24" fill="#9ac8e8" text-anchor="start">動作片段</text><rect x="320" y="180" width="210" height="120" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="345" y="250" font-size="24" fill="#ead68c" text-anchor="start">任務轉換</text><rect x="560" y="180" width="210" height="120" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="585" y="250" font-size="24" fill="#c1b2ea" text-anchor="start">尚未觀察</text><text x="80" y="389" font-size="21" fill="#e3e9e2" text-anchor="start">先確認實際需求、觀察時間與資料狀態。</text><text x="80" y="435" font-size="18" fill="#e3e9e2" text-anchor="start">不同名稱的工作，不保證不同部位得到恢復。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>