<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er33-title er33-desc"><title id="er33-title">按問題選方法，不是讓方法替人診斷</title><desc id="er33-desc">DSE、上肢重複、人工搬運與推拉有不同方法入口；重疊範圍仍需正式文件和完整現場資料。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 33  /  按問題選方法，不是讓方法替人診斷</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">鍵鼠與螢幕</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">DSE工作站問題</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">ART不評鍵鼠手指頻率</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">上肢重複</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">ART等合適方法</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不是所有重複工作都適用</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">搬抬攜行</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">RNLE／MAC等依條件選</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不能直接套人員移位</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">全身推拉</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">RAPP等合適問題</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">仍要看力、路徑與設備</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>