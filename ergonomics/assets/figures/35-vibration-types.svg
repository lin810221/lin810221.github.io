<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er35-title er35-desc"><title id="er35-title">HAV與WBV：同單位也不是同方法</title><desc id="er35-desc">左側手工具接觸，右側乘坐設備接觸；輸入、軸向權重與時間方法不同，不能直接混算。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35  /  HAV與WBV：同單位也不是同方法</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="100" y="190" width="190" height="100" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M82 230L180 230M193 290V365" stroke="#9ac8e8" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="145" font-size="23" fill="#ead68c" text-anchor="start">手－手臂振動</text><rect x="525" y="190" width="185" height="100" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><path d="M540 290V365M685 290V365" stroke="#c1b2ea" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="522" y="145" font-size="23" fill="#c1b2ea" text-anchor="start">全身振動</text><text x="80" y="416" font-size="18" fill="#e3e9e2" text-anchor="start">已加權三軸合成＋實際觸發時間，不是原始手機加速度。</text><text x="80" y="449" font-size="18" fill="#e3e9e2" text-anchor="start">本圖無疾病機率或本地合規界線。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>