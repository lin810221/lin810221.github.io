<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er19-title er19-desc"><title id="er19-title">筆電綁定與多種資訊位置</title><desc id="er19-desc">左側筆電將螢幕輸入綁定，右側外接輸入可分開調整；只是配置選項，不保證任務與小空間皆適用。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19  /  筆電綁定與多種資訊位置</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="80" y="135" width="240" height="145" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M95 290H345L310 325H70Z" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="375" font-size="22" fill="#9ac8e8" text-anchor="start">螢幕與輸入綁定</text><rect x="515" y="120" width="240" height="145" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><rect x="490" y="322" width="265" height="32" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M635 275L635 310" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.3 301.0L635 310L630.7 301.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="399" font-size="22" fill="#b7e89f" text-anchor="start">有條件地分離調整</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>