<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er36-title er36-desc"><title id="er36-title">物理環境與流程：把任務走完</title><desc id="er36-desc">工作流程可能跨取料、組裝和運送，照明、地面、維護及空間都需確認，不能由新設備名字推適配。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36  /  物理環境與流程：把任務走完</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="130" width="190" height="170" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="90" y="175" font-size="25" fill="#9ac8e8" text-anchor="start">取料</text><rect x="335" y="130" width="190" height="170" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="360" y="175" font-size="25" fill="#ead68c" text-anchor="start">組裝</text><rect x="605" y="130" width="190" height="170" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="630" y="175" font-size="25" fill="#c1b2ea" text-anchor="start">運送</text><path d="M270 235L320 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.0 230.7L320 235L311.0 239.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 235L590 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M581.0 230.7L590 235L581.0 239.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 355H770" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="414" font-size="19" fill="#e3e9e2" text-anchor="start">各段都看光線、通道、地面、維護與工作者回饋。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>