<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" role="img" aria-labelledby="er06-title er06-desc"><title id="er06-title">神經元不是一整條神經</title><desc id="er06-desc">一般神經元含樹突、細胞體、軸突與末梢，部分軸突有髓鞘；神經是多軸突及支持組織的集合。</desc><rect width="860" height="510" rx="16" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="38" font-size="22" fill="#b7e89f" text-anchor="start">圖 06 /  神經元不是一整條神經</text><text x="34" y="70" font-size="14" fill="#a8b8aa" text-anchor="start">原創概念示意，非比例；箭頭意義依圖內文字。</text><ellipse cx="225" cy="249" rx="65" ry="53" stroke="#c1b2ea" fill="#15211d" stroke-width="3"/><ellipse cx="225" cy="250" rx="18" ry="16" stroke="#ead68c" fill="#15211d" stroke-width="3"/><path d="M177 213L119 173 83 183M165 245L88 243M175 282L108 328M282 250H700" stroke="#c1b2ea" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="229" width="70" height="42" rx="18" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><rect x="430" y="229" width="70" height="42" rx="18" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><rect x="530" y="229" width="70" height="42" rx="18" stroke="#9ac8e8" fill="#15211d" stroke-width="2"/><path d="M700 250L744 214M700 250L744 286" stroke="#c1b2ea" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 326L634 326" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M625.0 321.7L634 326L625.0 330.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="342" y="362" font-size="18" fill="#b7e89f" text-anchor="start">簡化訊息方向</text><text x="55" y="128" font-size="19" fill="#c1b2ea" text-anchor="start">樹突／輸入區</text><text x="172" y="403" font-size="20" fill="#c1b2ea" text-anchor="start">細胞體</text><text x="360" y="188" font-size="20" fill="#9ac8e8" text-anchor="start">軸突與髓鞘</text><text x="664" y="396" font-size="20" fill="#c1b2ea" text-anchor="start">末梢</text><text x="34" y="478" font-size="14" fill="#a8b8aa" text-anchor="start">圖解讀法：先辨識構造與邊界，再沿標示的箭頭追蹤；不作影像定位或診斷。</text></g></svg>