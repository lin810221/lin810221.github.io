<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er28-title er28-desc"><title id="er28-title">RNLE：先辨參考點，再談公式</title><desc id="er28-desc">H由兩內踝中點至雙手握點中點地面投影；V是手部離地高度；A是負重位置相對正中矢狀面的角，不是脊柱扭轉角。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28  /  RNLE：先辨參考點，再談公式</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="115" width="360" height="325" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="65" y="148" font-size="21" fill="#9ac8e8" text-anchor="start">側視參考：H、V</text><path d="M70 395H385" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="155" cy="195" rx="18" ry="22" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M153 220V310L142 388M153 310L177 388M156 250L300 275" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="159" cy="395" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><rect x="280" y="250" width="70" height="52" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M315 276V395" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M159 420L315 420" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M306.0 415.7L315 420L306.0 424.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="409" font-size="19" fill="#b7e89f" text-anchor="start">H</text><path d="M370 394L370 277" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M365.7 286.0L370 277L374.3 286.0" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="340" font-size="19" fill="#c1b2ea" text-anchor="start">V</text><rect x="440" y="115" width="375" height="325" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="460" y="148" font-size="21" fill="#c1b2ea" text-anchor="start">俯視參考：A</text><ellipse cx="566" cy="350" rx="17" ry="29" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="666" cy="350" rx="17" ry="29" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="616" cy="350" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M616 350V180" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M616 350L733 219" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="705" y="183" width="65" height="55" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M616 268Q650 268 670 290" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="641" y="264" font-size="22" fill="#c1b2ea" text-anchor="start">A</text><text x="470" y="412" font-size="17" fill="#e3e9e2" text-anchor="start">內踝中點是參考，不從腰量。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>