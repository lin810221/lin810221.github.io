<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er27-title er27-desc"><title id="er27-title">活動變化與照顧任務的差異</title><desc id="er27-desc">任務名稱不同不保證充分恢復，搬物與搬人的可變性也不同；需合適設備、協作與方法。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27  /  活動變化與照顧任務的差異</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">活動變化</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">部位、施力與時間是否不同</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不是換個站名就算恢復</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">日常物件</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">位置、重量與操作條件</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不要直接變個人限重</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">協助移位</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">人的能力、反應與照顧需求</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不是穩定箱子的搬抬</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">支持條件</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">設備、受訓協作及動線</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">需要適合任務的完整方法</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>