<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er37-title er37-desc"><title id="er37-title">來源改善與工程驗收</title><desc id="er37-desc">工作可從取消不必要轉運、設計支撐及組織條件改善；工程試用要確認使用者與新風險。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37  /  來源改善與工程驗收</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="80" y="160" width="270" height="180" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="480" y="160" width="270" height="180" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M120 210H310M120 270H310" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 250H710" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M370 250L460 250" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.0 245.7L460 250L451.0 254.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="137" font-size="23" fill="#9ac8e8" text-anchor="start">多一次中轉</text><text x="500" y="137" font-size="23" fill="#b7e89f" text-anchor="start">重新安排來源</text><text x="95" y="408" font-size="21" fill="#e3e9e2" text-anchor="start">先看流程是否必要，再看位置、支撐與設備。</text><text x="95" y="449" font-size="18" fill="#e3e9e2" text-anchor="start">驗收是實際可用，不只是規格寫「可調」。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>