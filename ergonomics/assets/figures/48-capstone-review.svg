<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er48-title er48-desc"><title id="er48-title">從觀察到改善：留下可審核的下一步</title><desc id="er48-desc">工作、資料、方法與回顧形成概念圖，要求說明條件與未知，不以最後一個總分取代參與和現場驗證。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 48  /  從觀察到改善：留下可審核的下一步</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="430" cy="263" rx="113" ry="55" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="430" y="269" font-size="23" fill="#b7e89f" text-anchor="middle">改善提案</text><rect x="70" y="121" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="84" y="150" font-size="19" fill="#9ac8e8" text-anchor="start">實際任務</text><text x="84" y="178" font-size="15" fill="#e3e9e2" text-anchor="start">人、環境與流程</text><path d="M300 159L320 247" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.2 237.3L320 247L313.8 239.2" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="121" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="584" y="150" font-size="19" fill="#ead68c" text-anchor="start">可用證據</text><text x="584" y="178" font-size="15" fill="#e3e9e2" text-anchor="start">來源、單位及未知</text><path d="M540 247L560 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M553.8 166.8L560 159L562.2 168.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="337" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="84" y="366" font-size="19" fill="#c1b2ea" text-anchor="start">方法與限制</text><text x="84" y="394" font-size="15" fill="#e3e9e2" text-anchor="start">適用，不亂合分數</text><path d="M300 375L320 278" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M313.9 285.9L320 278L322.4 287.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="337" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="584" y="366" font-size="19" fill="#eda894" text-anchor="start">行動與回顧</text><text x="584" y="394" font-size="15" fill="#e3e9e2" text-anchor="start">參與、資源與新問題</text><path d="M540 278L560 375" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M562.4 365.3L560 375L553.9 367.1" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>