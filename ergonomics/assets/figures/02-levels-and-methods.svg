<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er02-title er02-desc"><title id="er02-title">危害到行動：工具不等於結論</title><desc id="er02-desc">危害、暴露、感受與疾病為不同層次；選方法還要確認問題、地區和用途，不把分數當診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02  /  危害到行動：工具不等於結論</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="118" width="220" height="76" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="59" y="147" font-size="19" fill="#b7e89f" text-anchor="start">危害來源</text><text x="59" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">先描述工作條件</text><path d="M275 156L299 156" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.0 151.7L299 156L290.0 160.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="118" width="220" height="76" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="324" y="147" font-size="19" fill="#9ac8e8" text-anchor="start">實際暴露</text><text x="324" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">位置、力與時間</text><path d="M540 156L564 156" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 151.7L564 156L555.0 160.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="575" y="118" width="220" height="76" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="589" y="147" font-size="19" fill="#ead68c" text-anchor="start">感受與功能</text><text x="589" y="175" font-size="15" fill="#e3e9e2" text-anchor="start">是需理解的資訊</text><path d="M685 203V236H155V260" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 253L155 268" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.3 259.0L155 268L150.7 259.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="273" width="220" height="76" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="59" y="302" font-size="19" fill="#c1b2ea" text-anchor="start">合適方法</text><text x="59" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">確認範圍及版本</text><path d="M275 311L299 311" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M290.0 306.7L299 311L290.0 315.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="273" width="220" height="76" rx="12" stroke="#eda894" fill="#17251e" stroke-width="2"/><text x="324" y="302" font-size="19" fill="#eda894" text-anchor="start">改善與回顧</text><text x="324" y="330" font-size="15" fill="#e3e9e2" text-anchor="start">不只留下總分</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>