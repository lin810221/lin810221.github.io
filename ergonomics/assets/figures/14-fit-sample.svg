<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er14-title er14-desc"><title id="er14-title">兩條適配條件要同時確認</title><desc id="er14-desc">虛構樣本同時看伸取與淨空，符合兩條只是部分幾何適配；缺漏與族群代表性仍需說明。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14  /  兩條適配條件要同時確認</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="85" y="135" width="300" height="245" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="115" y="177" font-size="24" fill="#9ac8e8" text-anchor="start">伸取能力</text><path d="M140 305L325 213" stroke="#9ac8e8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="135" width="300" height="245" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="505" y="177" font-size="24" fill="#ead68c" text-anchor="start">淨空需求</text><rect x="520" y="215" width="190" height="115" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="80" y="440" font-size="18" fill="#e3e9e2" text-anchor="start">兩條都已知才比較；不是一個平均尺寸就代表完整的人。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>