<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er38-title er38-desc"><title id="er38-title">改善前後：先看條件是不是同一個</title><desc id="er38-desc">兩個外力作用位置示意，改距離可能改模型結果，但不是傷害風險等比例下降；其他條件需列明。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 38  /  改善前後：先看條件是不是同一個</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 315H380M475 315H790" stroke="#9ac8e8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="100" cy="315" rx="11" ry="11" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="495" cy="315" rx="11" ry="11" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M350 155L350 305" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M354.3 296.0L350 305L345.7 296.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 155L610 305" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M614.3 296.0L610 305L605.7 296.0" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="130" font-size="23" fill="#9ac8e8" text-anchor="start">情境A：較遠</text><text x="475" y="130" font-size="23" fill="#b7e89f" text-anchor="start">情境B：較近</text><text x="95" y="412" font-size="20" fill="#e3e9e2" text-anchor="start">相同力的假設，仍未代表全部現場條件相同。</text><text x="95" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">輪調也需確認實際改變暴露，不只改名稱。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>