<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er46-title er46-desc"><title id="er46-title">原創資料與契約：一列代表什麼</title><desc id="er46-desc">虛構記錄包含排定時間、已觀察數據、狀態及來源；不是員工健康病歷或完整現場評分。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 46  /  原創資料與契約：一列代表什麼</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="95" y="120" width="670" height="295" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="120" y="160" font-size="26" fill="#9ac8e8" text-anchor="start">原創任務觀察</text><path d="M125 230H730" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="215" font-size="19" fill="#ead68c" text-anchor="start">任務、時間窗、來源</text><path d="M125 295H730" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="280" font-size="19" fill="#c1b2ea" text-anchor="start">已知、未知與使用者回饋</text><path d="M125 360H730" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="345" font-size="19" fill="#b7e89f" text-anchor="start">下一步、負責人與回顧</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>