<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er09-title er09-desc"><title id="er09-title">時間變化模型不等於人體恢復</title><desc id="er09-desc">任意曲線僅示時間相關行為，沒有組織、年齡、症狀或傷害校準，不當成治療或癒合時程。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09  /  時間變化模型不等於人體恢復</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M90 390H770M90 390V125" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 200Q310 360 740 335" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="125" font-size="19" fill="#e3e9e2" text-anchor="start">任意模型輸出</text><text x="120" y="437" font-size="18" fill="#e3e9e2" text-anchor="start">任意時間 →；曲線未校準人體，不預測癒合或疲勞。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>