<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er47-title er47-desc"><title id="er47-title">報告圖、數字與來源一起核對</title><desc id="er47-desc">同一虛構觀察可產表格、圖與說明，問號仍為未知；來源雜湊只核檔案一致，不核真實性或工作安全。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 47  /  報告圖、數字與來源一起核對</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="65" y="130" width="240" height="260" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="90" y="171" font-size="24" fill="#9ac8e8" text-anchor="start">來源與觀察</text><path d="M95 220H275" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 270H275" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 320H275" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 250L425 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M416.0 245.7L425 250L416.0 254.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="445" y="130" width="350" height="260" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="470" y="171" font-size="24" fill="#b7e89f" text-anchor="start">可核對摘要</text><path d="M485 330V245M555 330V215M625 330V270" stroke="#ead68c" stroke-width="27" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="291" font-size="35" fill="#c1b2ea" text-anchor="start">？</text><text x="90" y="446" font-size="19" fill="#e3e9e2" text-anchor="start">先核單位、分母與未知，不為了圖完整改原始資料。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>