<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er45-title er45-desc"><title id="er45-title">版本與AI姿勢宣稱：先問證據是哪一層</title><desc id="er45-desc">影像點位、測量、暴露與健康結論不同，日期也有正式修訂及入口更新之分，不用精密外觀替代驗證。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 45  /  版本與AI姿勢宣稱：先問證據是哪一層</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="80" y="130" width="300" height="280" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><ellipse cx="220" cy="185" rx="20" ry="24" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M220 210L205 300 170 375M205 300L265 375M220 238L310 255" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="220" cy="210" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="205" cy="300" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="310" cy="255" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="110" y="446" font-size="21" fill="#9ac8e8" text-anchor="start">估計點位</text><rect x="470" y="130" width="310" height="280" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="495" y="180" font-size="25" fill="#c1b2ea" text-anchor="start">還需要驗證</text><text x="495" y="240" font-size="20" fill="#e3e9e2" text-anchor="start">方法、族群與誤差</text><text x="495" y="295" font-size="20" fill="#e3e9e2" text-anchor="start">範圍、版本與隱私</text><text x="495" y="350" font-size="19" fill="#e3e9e2" text-anchor="start">不直接推病因或健康</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>