<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er30-title er30-desc"><title id="er30-title">公式有邊界，改善要回到任務</title><desc id="er30-desc">同一搬運流程包含不同工作段，方法適用、未知和改善需分開，不把任意倍率補成1完成報告。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30  /  公式有邊界，改善要回到任務</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">符合的單一搬抬</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">雙手、負載與環境等需確認</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不是只輸入公斤數</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">其他工作段</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">推拉、搬人、單手等</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">可能需要其他方法</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">資料未知</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">頻率、耦合或適用未確認</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">保留未知，不填最佳值</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">重新設計</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">減少轉運、調整位置與設備</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">還要追新需求與回饋</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>