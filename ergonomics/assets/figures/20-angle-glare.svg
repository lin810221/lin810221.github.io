<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er20-title er20-desc"><title id="er20-title">可讀性：尺寸、距離與反光都要看</title><desc id="er20-desc">兩個視覺三角形表示不同距離與字高的關係，亮面反光是另一問題；圖不是視力或字級處方。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20  /  可讀性：尺寸、距離與反光都要看</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="105" cy="260" rx="22" ry="15" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M130 260L355 210V310Z" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 260L690 195V325Z" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="370" font-size="20" fill="#9ac8e8" text-anchor="start">較近的文字</text><text x="570" y="370" font-size="20" fill="#ead68c" text-anchor="start">較遠的文字</text><text x="100" y="135" font-size="23" fill="#e3e9e2" text-anchor="start">視角取決於字高與距離</text><text x="100" y="439" font-size="17" fill="#e3e9e2" text-anchor="start">再確認對比、反光與個人視覺需求，不用角度單獨判健康。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>