<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er11-title er11-desc"><title id="er11-title">影像、任務與功能各回答一部分</title><desc id="er11-desc">三張不同資料卡可互補，但任何單一卡都不能唯一決定症狀原因或個人活動範圍。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11  /  影像、任務與功能各回答一部分</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="75" y="125" width="210" height="260" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="325" y="125" width="210" height="260" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="575" y="125" width="210" height="260" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="108" y="173" font-size="24" fill="#9ac8e8" text-anchor="start">構造影像</text><text x="360" y="173" font-size="24" fill="#ead68c" text-anchor="start">實際任務</text><text x="608" y="173" font-size="24" fill="#c1b2ea" text-anchor="start">功能需要</text><path d="M178 205V330" stroke="#9ac8e8" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="362" y="228" width="130" height="90" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M650 215V326M620 251H695" stroke="#c1b2ea" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="444" font-size="19" fill="#e3e9e2" text-anchor="start">資料互補，不把某一張卡當成完整病因或能力判定。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>