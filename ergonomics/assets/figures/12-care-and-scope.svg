<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er12-title er12-desc"><title id="er12-title">照護訊號與來源範圍分開看</title><desc id="er12-desc">情境需要適當評估，來源需核日期與適用範圍；不是自動風險分級或排除所有急症的清單。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12  /  照護訊號與來源範圍分開看</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="45" y="112" width="365" height="136" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="63" y="145" font-size="21" fill="#b7e89f" text-anchor="start">急性或進展變化</text><text x="63" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">依當下狀況及時尋求評估</text><text x="63" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">不等網頁分數才行動</text><rect x="440" y="112" width="365" height="136" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="458" y="145" font-size="21" fill="#9ac8e8" text-anchor="start">功能與脈絡</text><text x="458" y="189" font-size="17" fill="#e3e9e2" text-anchor="start">說清任務和變化</text><text x="458" y="223" font-size="16" fill="#e3e9e2" text-anchor="start">例子不是完整自我診斷表</text><rect x="45" y="272" width="365" height="136" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="63" y="305" font-size="21" fill="#ead68c" text-anchor="start">正式來源</text><text x="63" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">正式方法與網頁更新分開</text><text x="63" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">不是看到新日期就改公式</text><rect x="440" y="272" width="365" height="136" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="458" y="305" font-size="21" fill="#c1b2ea" text-anchor="start">工作與臨床</text><text x="458" y="349" font-size="17" fill="#e3e9e2" text-anchor="start">用途、族群及地區要對準</text><text x="458" y="383" font-size="16" fill="#e3e9e2" text-anchor="start">一套指南不代表所有問題</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>