<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er08-title er08-desc"><title id="er08-title">接觸面積和平均壓力</title><desc id="er08-desc">同力不同接觸面積的均勻模型，壓力與材料截面應力的問題不同，沒有人體損傷界線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08  /  接觸面積和平均壓力</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="100" y="245" width="190" height="65" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="470" y="245" width="275" height="65" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><path d="M195 130L195 235" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M199.3 226.0L195 235L190.7 226.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M605 130L605 235" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M609.3 226.0L605 235L600.7 226.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="350" font-size="22" fill="#9ac8e8" text-anchor="start">較小接觸面積</text><text x="490" y="350" font-size="22" fill="#c1b2ea" text-anchor="start">較大接觸面積</text><text x="90" y="414" font-size="20" fill="#e3e9e2" text-anchor="start">同一外力＋均勻模型：平均壓力與面積相關。</text><text x="90" y="447" font-size="18" fill="#e3e9e2" text-anchor="start">不是局部峰值、材料應力或組織損傷門檻。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>