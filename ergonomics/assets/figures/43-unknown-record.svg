<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er43-title er43-desc"><title id="er43-title">原創感受與缺漏：不是臨床分級</title><desc id="er43-desc">兩種記錄卡區分明確零與未知，主觀資料仍需時間與功能背景，不設疾病門檻或個人排行。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 43  /  原創感受與缺漏：不是臨床分級</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="85" y="145" width="300" height="205" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="115" y="190" font-size="24" fill="#9ac8e8" text-anchor="start">已明確觀察</text><text x="215" y="285" font-size="56" fill="#9ac8e8" text-anchor="start">0</text><rect x="475" y="145" width="300" height="205" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="505" y="190" font-size="24" fill="#c1b2ea" text-anchor="start">尚未觀察</text><text x="600" y="285" font-size="56" fill="#c1b2ea" text-anchor="start">？</text><text x="90" y="423" font-size="19" fill="#e3e9e2" text-anchor="start">零不是未知；感受是真實資訊，量尺仍有用途限制。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>