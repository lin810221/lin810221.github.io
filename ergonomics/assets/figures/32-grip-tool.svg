<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er32-title er32-desc"><title id="er32-title">握柄、手套和任務：一起試用</title><desc id="er32-desc">兩種假想握持接觸表示幾何不同，未標健康門檻；力、摩擦、尺寸及工作條件需與使用者核對。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32  /  握柄、手套和任務：一起試用</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><rect x="180" y="140" width="55" height="245" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M95 235Q200 180 280 235M95 267Q200 215 280 267M95 300Q200 250 280 300" stroke="#9ac8e8" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="140" width="110" height="245" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><path d="M470 235Q600 170 735 235M470 270Q600 205 735 270M470 305Q600 240 735 305" stroke="#b7e89f" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="432" font-size="18" fill="#e3e9e2" text-anchor="start">圖不是所有人的建議握徑；還需力、材質、手套與任務。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>