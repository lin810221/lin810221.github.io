<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er18-title er18-desc"><title id="er18-title">常用輸入區與調整回顧</title><desc id="er18-desc">鍵盤與滑鼠在同一工作區示意，位置和任務需要一起試用；沒有裝置能單靠名稱保證所有人適合。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18  /  常用輸入區與調整回顧</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="190" cy="150" rx="22" ry="27" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M185 181L175 305 305 305 310 395H355M190 205L225 260H340" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 275H715M460 280V425M690 280V425" stroke="#ead68c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 210V320H235M175 320V426" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="525" y="120" width="150" height="95" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M600 215V266M562 267H638" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="255" width="95" height="15" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><ellipse cx="435" cy="263" rx="14" ry="9" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="360" y="365" font-size="20" fill="#e3e9e2" text-anchor="start">鍵盤與滑鼠同時可用</text><text x="70" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">桌面位置改變後，仍需回看支撐、淨空與任務。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>