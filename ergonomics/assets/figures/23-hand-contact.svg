<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er23-title er23-desc"><title id="er23-title">手腕、接觸與輸入選擇</title><desc id="er23-desc">前臂、接觸邊緣與手持設備的簡化關係，角度不是唯一條件；位置、施力和時間需要一起觀察。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 23  /  手腕、接觸與輸入選擇</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M80 245H380L470 275H655" stroke="#9ac8e8" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="345" y="285" width="130" height="65" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="90" y="170" font-size="23" fill="#9ac8e8" text-anchor="start">前臂與手部</text><text x="350" y="390" font-size="22" fill="#ead68c" text-anchor="start">接觸邊緣</text><rect x="650" y="140" width="105" height="190" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="80" y="441" font-size="18" fill="#e3e9e2" text-anchor="start">另看施力、精細操作與持續時間；不畫人體損傷角度門檻。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>