<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er21-title er21-desc"><title id="er21-title">坐、站、走動與可行空間</title><desc id="er21-desc">三個不同姿勢角色代表可選工作變化，不規定固定比例，也不因換站立就宣告所有問題已解決。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21  /  坐、站、走動與可行空間</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="160" cy="170" rx="22" ry="27" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M155 201L145 325 275 325 280 415H325M160 225L195 280H310" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="465" cy="150" rx="22" ry="27" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M465 180V320M465 215L420 260M465 215L510 260M465 320L440 410M465 320L490 410" stroke="#ead68c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="680" cy="150" rx="22" ry="27" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M680 180L660 300M675 215L725 265M660 300L610 400M660 300L715 375" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="450" font-size="20" fill="#9ac8e8" text-anchor="start">坐姿選項</text><text x="420" y="450" font-size="20" fill="#ead68c" text-anchor="start">站姿選項</text><text x="620" y="450" font-size="20" fill="#c1b2ea" text-anchor="start">活動變化</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>