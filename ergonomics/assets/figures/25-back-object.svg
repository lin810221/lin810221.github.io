<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er25-title er25-desc"><title id="er25-title">身體、物件和選項：距離之外還有條件</title><desc id="er25-desc">簡化手部和箱子位置顯示外在需求可改，未畫完整人體力學，不指定人人相同的彎腰方式。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 25  /  身體、物件和選項：距離之外還有條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="210" cy="152" rx="24" ry="28" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M205 185L235 280 160 395M235 280L290 395M220 220L370 272" stroke="#9ac8e8" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="365" y="265" width="130" height="95" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M240 414L430 414" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M421.0 409.7L430 414L421.0 418.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="448" font-size="20" fill="#b7e89f" text-anchor="start">位置與任務一起看</text><text x="540" y="169" font-size="21" fill="#e3e9e2" text-anchor="start">重量、時間與支持</text><text x="540" y="215" font-size="21" fill="#e3e9e2" text-anchor="start">彎腰、蹲跪與轉向</text><text x="540" y="261" font-size="21" fill="#e3e9e2" text-anchor="start">身體條件與可行性</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>