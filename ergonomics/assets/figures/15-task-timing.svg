<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er15-title er15-desc"><title id="er15-title">同平均，時間分布仍可不同</title><desc id="er15-desc">區塊顯示不同任務時間或未知狀態，不給正式評分；平均次數無法取代完整循環與優先需求。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15  /  同平均，時間分布仍可不同</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><text x="70" y="130" font-size="20" fill="#e3e9e2" text-anchor="start">時間順序 →；區塊不代表疾病或安全分級</text><rect x="80" y="180" width="210" height="120" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="105" y="250" font-size="24" fill="#9ac8e8" text-anchor="start">工作A</text><rect x="320" y="180" width="210" height="120" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="345" y="250" font-size="24" fill="#ead68c" text-anchor="start">工作B</text><rect x="560" y="180" width="210" height="120" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="585" y="250" font-size="24" fill="#c1b2ea" text-anchor="start">未知</text><text x="80" y="389" font-size="21" fill="#e3e9e2" text-anchor="start">先確認實際需求、觀察時間與資料狀態。</text><text x="80" y="435" font-size="18" fill="#e3e9e2" text-anchor="start">不同名稱的工作，不保證不同部位得到恢復。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>