<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er01-title er01-desc"><title id="er01-title">人、任務與環境的適配</title><desc id="er01-desc">三區相交表示工作設計要同時考慮人、任務和環境；面積無量尺，不用來評人能力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 01  /  人、任務與環境的適配</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="320" cy="235" rx="150" ry="115" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="520" cy="235" rx="150" ry="115" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="420" cy="345" rx="150" ry="90" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="215" y="210" font-size="23" fill="#9ac8e8" text-anchor="start">人的需要</text><text x="525" y="210" font-size="23" fill="#ead68c" text-anchor="start">任務需求</text><text x="353" y="390" font-size="22" fill="#c1b2ea" text-anchor="start">環境與資源</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>