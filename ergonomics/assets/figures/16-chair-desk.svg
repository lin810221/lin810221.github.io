<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er16-title er16-desc"><title id="er16-title">支撐、桌面與腿部空間一起調整</title><desc id="er16-desc">側面工作站是相對位置示意，支撐、桌面和腿部空間互相關聯，不是一張所有人相同的姿勢處方。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16  /  支撐、桌面與腿部空間一起調整</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><ellipse cx="190" cy="150" rx="22" ry="27" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M185 181L175 305 305 305 310 395H355M190 205L225 260H340" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 275H715M460 280V425M690 280V425" stroke="#ead68c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 210V320H235M175 320V426" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="525" y="120" width="150" height="95" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M600 215V266M562 267H638" stroke="#b7e89f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="288" width="270" height="115" rx="12" stroke="#b7e89f" fill="#b7e89f09" stroke-width="2"/><text x="375" y="375" font-size="21" fill="#b7e89f" text-anchor="start">腿部淨空</text><text x="70" y="448" font-size="18" fill="#e3e9e2" text-anchor="start">陰影是要確認的空間，不是固定尺寸或適用認證。</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>