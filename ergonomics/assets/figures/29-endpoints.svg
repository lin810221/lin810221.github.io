<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="er29-title er29-desc"><title id="er29-title">起點、目的地與工時條件</title><desc id="er29-desc">兩個手部位置有不同幾何與控制需求，頻率、抓握和恢復需另按正式方法確認，不平均LI當CLI。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Noto Sans TC,Microsoft JhengHei,Arial,sans-serif"><text x="34" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 29  /  起點、目的地與工時條件</text><text x="34" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意，非比例；顏色輔助辨識，不代表正常異常。</text><path d="M70 410H785" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="300" width="130" height="90" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="520" y="145" width="130" height="90" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M290 334L490 193" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.1 194.6L490 193L485.1 201.7" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 320H90M585 165H90M100 170V315" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><ellipse cx="205" cy="320" rx="5" ry="5" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="585" cy="165" rx="5" ry="5" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="112" y="246" font-size="17" fill="#9ac8e8" text-anchor="start">D：兩手高的差</text><text x="150" y="436" font-size="20" fill="#ead68c" text-anchor="start">起點</text><text x="530" y="273" font-size="20" fill="#b7e89f" text-anchor="start">目的地</text><text x="475" y="368" font-size="18" fill="#e3e9e2" text-anchor="start">FM、CM與恢復需另確認</text><text x="34" y="487" font-size="14" fill="#adbcaf" text-anchor="start">讀圖：先認構造、邊界與圖例，再追物質、訊號或時間；細節以對應課文為準。</text></g></svg>