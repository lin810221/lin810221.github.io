<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">HostClient與Server的責任</title><desc id="desc">MCP提供工具與資料整合契約，不取代模型本身；模型提出使用需求，Host管理執行與信任。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#89c9e8"/></marker></defs><rect width="1200" height="800" rx="20" fill="#101812"/><g font-family="Microsoft JhengHei,Noto Sans CJK TC,sans-serif"><text x="54" y="58" font-size="19" fill="#b8e895" text-anchor="start">MCP / 01</text><text x="54" y="115" font-size="34" fill="#e5e9e2" text-anchor="start">HostClient與Server的責任</text><text x="54" y="154" font-size="20" fill="#9aaf9f" text-anchor="start">原創概念圖 · 沿資料、控制與比較關係讀圖</text><rect x="100.0" y="290" width="174.0" height="90" rx="14" fill="#1b251f" stroke="#b8e895"/><text x="187.0" y="342.0" font-size="20" fill="#b8e895" text-anchor="middle">Host應用</text><text x="100.0" y="260" font-size="20" fill="#b8e895" text-anchor="start">01</text><path d="M280.0,335 L296.0,335" stroke="#b8e895" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="300.0" y="290" width="174.0" height="90" rx="14" fill="#1b251f" stroke="#89c9e8"/><text x="387.0" y="342.0" font-size="20" fill="#89c9e8" text-anchor="middle">MCP Client</text><text x="300.0" y="260" font-size="20" fill="#89c9e8" text-anchor="start">02</text><path d="M480.0,335 L496.0,335" stroke="#b8e895" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="500.0" y="290" width="174.0" height="90" rx="14" fill="#1b251f" stroke="#eebc79"/><text x="587.0" y="342.0" font-size="20" fill="#eebc79" text-anchor="middle">協定訊息</text><text x="500.0" y="260" font-size="20" fill="#eebc79" text-anchor="start">03</text><path d="M680.0,335 L696.0,335" stroke="#b8e895" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="700.0" y="290" width="174.0" height="90" rx="14" fill="#1b251f" stroke="#c3a6ed"/><text x="787.0" y="342.0" font-size="20" fill="#c3a6ed" text-anchor="middle">MCP Server</text><text x="700.0" y="260" font-size="20" fill="#c3a6ed" text-anchor="start">04</text><path d="M880.0,335 L896.0,335" stroke="#b8e895" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="900.0" y="290" width="174.0" height="90" rx="14" fill="#1b251f" stroke="#ef9eaa"/><text x="987.0" y="342.0" font-size="20" fill="#ef9eaa" text-anchor="middle">外部系統</text><text x="900.0" y="260" font-size="20" fill="#ef9eaa" text-anchor="start">05</text><text x="600" y="485" font-size="22" fill="#89c9e8" text-anchor="middle">沿箭頭追蹤：每一步用了哪些輸入、產生哪些輸出？</text><path d="M54,620 L1146,620" stroke="#405448" stroke-width="2" fill="none"/><text x="60" y="668" font-size="23" fill="#b8e895" text-anchor="start">1. MCP提供工具與資料整合契約，不取代模型本身</text><text x="60" y="711" font-size="23" fill="#89c9e8" text-anchor="start">2. 模型提出使用需求，Host管理執行與信任</text><text x="54" y="766" font-size="17" fill="#9aaf9f" text-anchor="start">Learning Notes · Visual review 2026-11-24</text></g></svg>