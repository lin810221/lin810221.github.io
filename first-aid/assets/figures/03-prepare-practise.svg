<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-03-title aid-03-desc"><title id="aid-03-title">預防與技能回饋讓行動更可靠</title><desc id="aid-03-desc">左側用移除環境危害、知道設備與聯絡方法表示事前準備；右側人體模型和回饋循環分開知識與真正動作能力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 03 / 預防與技能回饋讓行動更可靠</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">模型圖不是對真人練按壓；胸外按壓、推壓等技能應在安全訓練中學。</text><rect x="45" y="130" width="310" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="200.0" y="166.0" font-size="20" fill="#9ac8e8" text-anchor="middle">事前：減少危害</text><rect x="45" y="230" width="310" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="200.0" y="266.0" font-size="20" fill="#b7e89f" text-anchor="middle">找得到：電話、出口、AED</text><rect x="45" y="330" width="310" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="200.0" y="366.0" font-size="20" fill="#ead68c" text-anchor="middle">遇事：辨識與立即行動</text><path d="M200 195L200 217" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M204.3 208.0L200 217L195.7 208.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 295L200 317" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M204.3 308.0L200 317L195.7 308.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="175.75" rx="16.900000000000002" ry="19.5" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M608.75 198.5Q566.5 208.25 569.75 270.0L589.25 328.5H660.75L680.25 270.0Q683.5 208.25 641.25 198.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M625 221.25V276.5" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="625" cy="255" rx="25" ry="12" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="625" y="390" font-size="21" fill="#b7e89f" text-anchor="middle">人體模型＋講師回饋</text><text x="625" y="430" font-size="18" fill="#e3e9e2" text-anchor="middle">閱讀、自測與實作互補</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>