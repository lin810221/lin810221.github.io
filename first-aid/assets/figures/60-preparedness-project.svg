<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-60-title aid-60-desc"><title id="aid-60-title">交付一張能使用、能更新的準備圖</title><desc id="aid-60-desc">人員需要、用品與AED、通訊和安全動線連到準備計畫，再透過演練與來源查核更新；這張交付圖是學習成果，不代表取得急救資格或讓現場跳過專業求援。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 60 / 交付一張能使用、能更新的準備圖</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="45" y="125" width="270" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="180.0" y="161" font-size="19" fill="#9ac8e8" text-anchor="middle">人的需要與協助方式</text><rect x="45" y="235" width="270" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="180.0" y="271" font-size="19" fill="#b7e89f" text-anchor="middle">用品／AED／安全動線</text><rect x="45" y="345" width="270" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="180.0" y="381" font-size="19" fill="#ead68c" text-anchor="middle">通訊／集合／替代安排</text><path d="M330 155L475 250" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M469.9 241.4L475 250L465.1 248.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 265L475 265" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M466.0 260.7L475 265L466.0 269.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 375L475 280" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M465.1 281.3L475 280L469.9 288.6" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="495" y="175" width="310" height="185" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="650" y="218" font-size="24" fill="#c1b2ea" text-anchor="middle">可用的急救準備圖</text><text x="650" y="270" font-size="20" fill="#e3e9e2" text-anchor="middle">演練觀察與改進</text><text x="650" y="315" font-size="20" fill="#e3e9e2" text-anchor="middle">正式來源、版本與複習</text><path d="M650 375V425H180V415" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>