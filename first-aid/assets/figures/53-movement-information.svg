<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-53-title aid-53-desc"><title id="aid-53-title">移動與資訊分享都要有明確目的</title><desc id="aid-53-desc">左側只在持續危害、氣道或CPR等必要情況評估移動，並保留能力和路徑條件；右側將必要資訊送給119與救護，個人影像不因事件發生便可任意公開。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 53 / 移動與資訊分享都要有明確目的</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="45" y="130" width="350" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="220.0" y="166" font-size="19" fill="#ead68c" text-anchor="middle">目前位置有立即危險嗎？</text><path d="M220 200L220 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.3 221.0L220 230L215.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="245" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="220.0" y="281" font-size="19" fill="#b7e89f" text-anchor="middle">氣道／CPR是否需要調整？</text><text x="55" y="360" font-size="19" fill="#e3e9e2" text-anchor="start">結合人力、能力與安全路徑</text><text x="55" y="410" font-size="19" fill="#e3e9e2" text-anchor="start">不是看見倒地就先搬走。</text><path d="M440 110V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="130" width="330" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="645.0" y="166" font-size="19" fill="#9ac8e8" text-anchor="middle">必要且可確認的事實</text><path d="M645 200L645 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.3 226.0L645 235L640.7 226.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="250" width="330" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="645.0" y="286" font-size="19" fill="#b7e89f" text-anchor="middle">119／救護人員</text><text x="480" y="375" font-size="19" fill="#c1b2ea" text-anchor="start">不直播、不轉傳身分與傷口</text><text x="480" y="420" font-size="19" fill="#e3e9e2" text-anchor="start">未知與來源也要說清楚</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>