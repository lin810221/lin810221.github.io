<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-16-title aid-16-desc"><title id="aid-16-title">有效咳嗽與嚴重哽塞先分清</title><desc id="aid-16-desc">上方把能有效咳嗽說話與無法有效咳嗽發聲分開，嚴重而有反應的成人兒童走向5次拍背再5次腹部推壓。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 16 / 有效咳嗽與嚴重哽塞先分清</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">5＋5為仍有反應的嚴重阻塞；嬰兒、孕晚期與無法環抱者另見配對圖。</text><rect x="45" y="125" width="350" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="220.0" y="161.0" font-size="20" fill="#9ac8e8" text-anchor="middle">有效咳嗽、可說話：鼓勵咳嗽</text><rect x="465" y="125" width="350" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="640.0" y="161.0" font-size="20" fill="#ead68c" text-anchor="middle">無法有效咳嗽／說話：嚴重</text><path d="M635 200L635 235" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.3 226.0L635 235L630.7 226.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="465" y="250" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="640.0" y="286.0" font-size="20" fill="#b7e89f" text-anchor="middle">119＋5次拍背</text><rect x="465" y="355" width="350" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="640.0" y="391.0" font-size="20" fill="#c1b2ea" text-anchor="middle">再5次腹部推壓</text><path d="M635 320L635 340" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M639.3 331.0L635 340L630.7 331.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="280" font-size="20" fill="#e3e9e2" text-anchor="start">觀察是否惡化，不催喝水。</text><text x="50" y="345" font-size="21" fill="#ead68c" text-anchor="start">失去反應就改CPR。</text><text x="50" y="410" font-size="18" fill="#e3e9e2" text-anchor="start">成人與≥1歲兒童主線</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>