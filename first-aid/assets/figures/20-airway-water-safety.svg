<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-20-title aid-20-desc"><title id="aid-20-title">氣道操作需練習，水域救援先自保</title><desc id="aid-20-desc">左側氣道、密合與胸起為呼吸訓練的檢查點；右側岸際救援先求援、伸拋漂浮物，未受訓者不下水或自行操作船艇。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 20 / 氣道操作需練習，水域救援先自保</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">氣道圖為非比例概念，不能代替人體模型呼吸練習與水域救生訓練。</text><ellipse cx="160" cy="230" rx="55" ry="42" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M210 235Q275 220 330 255" stroke="#b7e89f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 160L150 195" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M143.9 187.1L150 195L140.0 194.9" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="330" font-size="19" fill="#e3e9e2" text-anchor="start">開氣道、密合、每口看胸起</text><text x="60" y="390" font-size="18" fill="#e3e9e2" text-anchor="start">不過度吹氣，不為找器材延誤</text><path d="M430 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 325Q490 305 520 325T575 325T630 325T685 325T795 325" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M465 260H800" stroke="#c1b2ea" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 225L675 280" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M667.8 273.0L675 280L665.1 281.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="115" width="330" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="635.0" y="151.0" font-size="20" fill="#b7e89f" text-anchor="middle">岸邊穩固：呼救、119、伸與拋</text><text x="470" y="400" font-size="18" fill="#e3e9e2" text-anchor="start">划行與入水需適當受訓及裝備。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>