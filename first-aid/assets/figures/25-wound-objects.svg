<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-25-title aid-25-desc"><title id="aid-25-title">清潔表面傷口，嵌入物則避免任意取出</title><desc id="aid-25-desc">左側淺表傷口的清潔水流向外，右側嵌入物留在原位並在周圍支撐；眼球穿刺不照一般傷口直接加壓。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 25 / 清潔表面傷口，嵌入物則避免任意取出</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">水流只示清潔方向；嵌入物與眼傷須按不同條件處理。</text><path d="M80 190H350" stroke="#9ac8e8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 205L125 275" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M126.7 265.1L125 275L118.3 267.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 205L195 275" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M196.7 265.1L195 275L188.3 267.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 205L265 275" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.7 265.1L265 275L258.3 267.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="85" y="300" width="280" height="65" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="80" y="410" font-size="19" fill="#e3e9e2" text-anchor="start">可處理淺表傷口：清潔、覆蓋</text><rect x="490" y="285" width="280" height="80" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M620 160L655 305" stroke="#c1b2ea" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="550" y="250" width="58" height="48" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><rect x="675" y="250" width="58" height="48" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="485" y="410" font-size="19" fill="#e3e9e2" text-anchor="start">嵌入物：不拔、周圍支持、求援</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>