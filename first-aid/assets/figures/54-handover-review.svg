<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-54-title aid-54-desc"><title id="aid-54-title">接手需要連得起來的時間與行動</title><desc id="aid-54-desc">觀察、求援、施作與變化沿時間排列，交接說明已知與未知，救護人員確認接手才有序轉換；事件後以流程回顧尋找改進，不把案例中的結果當作某人的責任分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 54 / 接手需要連得起來的時間與行動</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><path d="M70 185H785" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="110" cy="185" rx="8" ry="8" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="110" y="140" font-size="18" fill="#9ac8e8" text-anchor="middle">看到什麼</text><ellipse cx="320" cy="185" rx="8" ry="8" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="320" y="140" font-size="18" fill="#b7e89f" text-anchor="middle">何時求援</text><ellipse cx="530" cy="185" rx="8" ry="8" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="530" y="140" font-size="18" fill="#ead68c" text-anchor="middle">已做什麼</text><ellipse cx="745" cy="185" rx="8" ry="8" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="745" y="140" font-size="18" fill="#c1b2ea" text-anchor="middle">有何變化</text><rect x="75" y="265" width="710" height="125" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430" y="310" font-size="24" fill="#b7e89f" text-anchor="middle">地點、狀況、時間、行動、反應、未知</text><text x="430" y="355" font-size="19" fill="#e3e9e2" text-anchor="middle">確認救護接手；回顧設備、角色與資訊斷點</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>