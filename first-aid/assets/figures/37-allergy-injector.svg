<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-37-title aid-37-desc"><title id="aid-37-title">嚴重過敏是全身急症，自動注射器依本人計畫</title><desc id="aid-37-desc">左側皮膚、呼吸與循環為不同面向，右側示意自動注射器常見大腿外側位置；求援、適當腎上腺素及觀察並行。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 37 / 嚴重過敏是全身急症，自動注射器依本人計畫</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">注射器為無藥訓練器概念；不同產品操作與再次使用條件不能由本圖推定。</text><ellipse cx="160" cy="125" rx="23" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M160 151V255M160 185L118 220M160 185L202 220M160 255L124 320M160 255L196 320" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="160" cy="205" rx="35" ry="18" stroke="#ead68c" fill="#17251e" stroke-width="3"/><ellipse cx="185" cy="260" rx="28" ry="25" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="55" y="389" font-size="18" fill="#e3e9e2" text-anchor="start">皮膚不一定全部出現</text><text x="55" y="425" font-size="19" fill="#e3e9e2" text-anchor="start">呼吸或循環變差，立即119</text><rect x="500" y="175" width="115" height="200" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M685 245L615 270" stroke="#b7e89f" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="130" font-size="20" fill="#b7e89f" text-anchor="start">大腿外側：產品指定位置</text><text x="465" y="415" font-size="17" fill="#e3e9e2" text-anchor="start">依本人處方、標示、受訓與119指導</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>