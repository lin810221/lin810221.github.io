<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-28-title aid-28-desc"><title id="aid-28-title">局部冷卻與全身保溫可以同時進行</title><desc id="aid-28-desc">水流朝受傷部位而非全身淋冷，另一人同時119；冷卻後以合適覆蓋保護，嚴重燒傷不等候固定分鐘數才求援。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 28 / 局部冷卻與全身保溫可以同時進行</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">IFRC2025：至少10分鐘、理想20分鐘；個別狀況、失溫與救護優先，不是等待門檻。</text><path d="M80 145H250V180" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 190L185 260" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M188.0 250.5L185 260L179.4 251.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 190L220 260" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M223.0 250.5L220 260L214.4 251.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 190L255 260" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M258.0 250.5L255 260L249.4 251.7" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="115" y="285" width="275" height="70" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="75" y="405" font-size="19" fill="#e3e9e2" text-anchor="start">清潔冷流水，安全時目標20分鐘</text><ellipse cx="560" cy="155" rx="23" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M560 181V285M560 215L518 250M560 215L602 250M560 285L524 350M560 285L596 350" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="515" y="205" width="90" height="105" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="550" y="410" font-size="18" fill="#e3e9e2" text-anchor="middle">保護其餘身體、避免失溫</text><rect x="650" y="145" width="160" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="730.0" y="181" font-size="20" fill="#ead68c" text-anchor="middle">119</text><text x="650" y="270" font-size="17" fill="#e3e9e2" text-anchor="start">嚴重傷害</text><text x="650" y="305" font-size="17" fill="#e3e9e2" text-anchor="start">與降溫並行</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>