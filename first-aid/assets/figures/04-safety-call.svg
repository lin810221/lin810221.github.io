<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-04-title aid-04-desc"><title id="aid-04-title">先停在安全邊界，再把119接進來</title><desc id="aid-04-desc">現場危害與救援者之間畫出邊界，右側電話資訊以位置、發生什麼與人員狀況協助調度，手機擴音讓照護與求援並行。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 04 / 先停在安全邊界，再把119接進來</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">距離任意，不表示各危害都有相同安全距離；依現場與消防指示。</text><ellipse cx="185" cy="245" rx="120" ry="115" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="185" y="205" font-size="23" fill="#eda894" text-anchor="middle">火煙／車流</text><text x="185" y="260" font-size="23" fill="#eda894" text-anchor="middle">電力／急流</text><text x="185" y="310" font-size="18" fill="#eda894" text-anchor="middle">危害未排除</text><path d="M350 115V445" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="350" y="100" font-size="18" fill="#ead68c" text-anchor="middle">安全邊界</text><rect x="430" y="130" width="365" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="612.5" y="166.0" font-size="20" fill="#9ac8e8" text-anchor="middle">119：先說位置</text><rect x="430" y="230" width="365" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="612.5" y="266.0" font-size="20" fill="#b7e89f" text-anchor="middle">狀況、傷者、反應與呼吸</text><rect x="430" y="330" width="365" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="612.5" y="366.0" font-size="20" fill="#c1b2ea" text-anchor="middle">擴音、回答問題、依指導行動</text><text x="40" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">不進入危害，不靠近斷電線或冒險下水。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>