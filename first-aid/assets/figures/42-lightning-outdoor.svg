<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-42-title aid-42-desc"><title id="aid-42-title">雷擊者不帶電，現場仍可能再受雷擊</title><desc id="aid-42-desc">左側封閉建築或合適硬頂車輛是避雷方向，右側行程、天氣與通訊事先安排；安全後按民眾CPR原則評估反應與正常呼吸。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 42 / 雷擊者不帶電，現場仍可能再受雷擊</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">此圖不畫固定安全半徑；雷擊不殘留電荷不等於雷暴場地已安全。</text><path d="M50 200L175 120L300 200V350H50Z" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="240" width="70" height="110" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M350 120L315 185H355L325 245" stroke="#ead68c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">安全避難；不躲孤立樹或開放棚</text><path d="M435 110V450" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="125" width="325" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="642.5" y="161" font-size="20" fill="#b7e89f" text-anchor="middle">天氣、路線、返回與撤離</text><rect x="480" y="240" width="325" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="642.5" y="276" font-size="20" fill="#9ac8e8" text-anchor="middle">手機、備援通訊與119位置資訊</text><rect x="480" y="355" width="325" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="642.5" y="391" font-size="20" fill="#ead68c" text-anchor="middle">安全後：反應、呼吸、CPR／AED</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>