<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-47-title aid-47-desc"><title id="aid-47-title">直接對人說話，讓協助符合真正需要</title><desc id="aid-47-desc">兒童、照顧者、身心障礙者與協助者可共同提供資訊，但應直接對當事人溝通並尊重其方式；圖中不同通道與可近動線是可調整條件，不是能力或病情的分數。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 47 / 直接對人說話，讓協助符合真正需要</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><ellipse cx="100" cy="170" rx="15" ry="15" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M100 187V237M100 203L76 218M100 203L124 218M100 237L78 270M100 237L122 270" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="310" font-size="21" fill="#9ac8e8" text-anchor="middle">當事人</text><ellipse cx="330" cy="150" rx="15" ry="15" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M330 167V217M330 183L306 198M330 183L354 198M330 217L308 250M330 217L352 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="290" font-size="21" fill="#b7e89f" text-anchor="middle">協助者</text><path d="M150 210L275 210" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.0 205.7L275 210L266.0 214.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 240L150 240" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M159.0 244.3L150 240L159.0 235.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="385" font-size="20" fill="#e3e9e2" text-anchor="start">短句、示意、等待回應</text><rect x="460" y="120" width="350" height="285" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="485" y="160" font-size="23" fill="#c1b2ea" text-anchor="start">可選擇的支持</text><text x="485" y="220" font-size="19" fill="#e3e9e2" text-anchor="start">照顧者提供基線與計畫</text><text x="485" y="270" font-size="19" fill="#e3e9e2" text-anchor="start">文字、手語或溝通板</text><text x="485" y="320" font-size="19" fill="#e3e9e2" text-anchor="start">輪椅、輔具與通行空間</text><text x="485" y="370" font-size="19" fill="#e3e9e2" text-anchor="start">先問怎麼幫，不先假定</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>