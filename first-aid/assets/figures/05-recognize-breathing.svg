<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-05-title aid-05-desc"><title id="aid-05-title">反應與呼吸決定最急迫的行動</title><desc id="aid-05-desc">上方無反應後分開正常呼吸與無正常呼吸，瀕死喘息歸入異常；下方重大出血提醒多人可同步求援、CPR與出血控制。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 05 / 反應與呼吸決定最急迫的行動</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">此圖是辨識原則，不是自動診斷；正常與不正常呼吸須在實體課練辨。</text><rect x="300" y="110" width="260" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="430.0" y="146.0" font-size="20" fill="#9ac8e8" text-anchor="middle">無反應</text><path d="M350 180L225 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.0 230.7L225 230L231.7 222.6" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M515 180L635 230" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M628.4 222.5L635 230L625.0 230.6" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="245" width="345" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="217.5" y="281.0" font-size="20" fill="#9ac8e8" text-anchor="middle">有正常呼吸：氣道與監測</text><rect x="465" y="245" width="345" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="637.5" y="281.0" font-size="20" fill="#ead68c" text-anchor="middle">無正常呼吸／喘息：CPR</text><text x="465" y="335" font-size="18" fill="#e3e9e2" text-anchor="start">立刻119、取得AED；民眾不摸脈等待。</text><text x="45" y="395" font-size="20" fill="#b7e89f" text-anchor="start">重大出血另外辨識：請旁人直接加壓與求援。</text><text x="45" y="435" font-size="19" fill="#e3e9e2" text-anchor="start">優先行動可以同時分工，不先花時間找病名。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>