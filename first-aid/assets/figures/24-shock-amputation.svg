<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-24-title aid-24-desc"><title id="aid-24-title">循環與人的照護優先，組織隔袋降溫</title><desc id="aid-24-desc">左側把血量、循環灌流與反應改變連起來；右側組織包妥密封，再用外層容器降溫，避免直接碰冰或浸水。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 24 / 循環與人的照護優先，組織隔袋降溫</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">組織形狀非比例、非血腥示意；圖不提供可保證再接的時間。</text><ellipse cx="190" cy="180" rx="80" ry="38" stroke="#eda894" fill="#17251e" stroke-width="3"/><text x="190" y="187" font-size="23" fill="#eda894" text-anchor="middle">循環灌流</text><path d="M190 230L190 273" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.3 264.0L190 273L185.7 264.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="290" width="270" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="190.0" y="326" font-size="20" fill="#9ac8e8" text-anchor="middle">反應、呼吸與皮膚變化</text><text x="55" y="398" font-size="19" fill="#e3e9e2" text-anchor="start">先止血、119、保溫與監測</text><rect x="490" y="140" width="280" height="240" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><rect x="540" y="185" width="180" height="110" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><ellipse cx="630" cy="237" rx="35" ry="19" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="630" y="335" font-size="18" fill="#b7e89f" text-anchor="middle">密封袋／包妥組織</text><text x="480" y="419" font-size="17" fill="#e3e9e2" text-anchor="start">冰在袋外；人的急救不被尋找組織拖延</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>