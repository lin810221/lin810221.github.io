<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-58-title aid-58-desc"><title id="aid-58-title">兩個獨立案例：無反應與嚴重哽塞</title><desc id="aid-58-desc">左側成人無反應且只有喘息，需立即119、CPR與AED；右側有反應嬰兒嚴重哽塞用拍背與胸部推壓，若失去反應轉入CPR。兩欄不是同一病人的時間順序。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 58 / 兩個獨立案例：無反應與嚴重哽塞</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><text x="50" y="130" font-size="21" fill="#9ac8e8" text-anchor="start">成人：無反應＋只有喘息</text><rect x="45" y="175" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="220.0" y="211" font-size="19" fill="#b7e89f" text-anchor="middle">119擴音＋CPR＋取得AED</text><path d="M220 245L220 280" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.3 271.0L220 280L215.7 271.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="295" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="220.0" y="331" font-size="19" fill="#b7e89f" text-anchor="middle">無需電擊仍無正常呼吸</text><text x="65" y="405" font-size="21" fill="#b7e89f" text-anchor="start">依提示立即恢復CPR。</text><path d="M440 110V445" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="130" font-size="20" fill="#ead68c" text-anchor="start">嬰兒：有反應、嚴重哽塞</text><text x="485" y="157" font-size="16" fill="#9ac8e8" text-anchor="start">嚴重阻塞即119，處理並行</text><rect x="480" y="175" width="330" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="645.0" y="211" font-size="19" fill="#ead68c" text-anchor="middle">5次拍背＋5次胸部推壓</text><text x="485" y="275" font-size="19" fill="#e3e9e2" text-anchor="start">不做腹部推壓、不盲挖</text><path d="M645 300L645 330" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M649.3 321.0L645 330L640.7 321.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="345" width="330" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="645.0" y="381" font-size="19" fill="#b7e89f" text-anchor="middle">無反應→CPR、119</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>