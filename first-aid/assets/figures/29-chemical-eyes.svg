<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-29-title aid-29-desc"><title id="aid-29-title">去污染與眼部沖洗，方向也要保護他人</title><desc id="aid-29-desc">左側防護後先去除乾粉或污染衣物再大量沖洗；右側患眼較低、由內向外的水流避免污染另一眼，持續沖洗與求援並行。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 29 / 去污染與眼部沖洗，方向也要保護他人</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">水流為概念，不是眼球穿刺的處理方式；化學品另依標示與專業指示。</text><rect x="45" y="125" width="335" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="212.5" y="161" font-size="20" fill="#9ac8e8" text-anchor="middle">保護救援者、辨識污染物</text><rect x="45" y="235" width="335" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="212.5" y="271" font-size="20" fill="#ead68c" text-anchor="middle">安全去除乾粉與污染衣物</text><rect x="45" y="345" width="335" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="212.5" y="381" font-size="20" fill="#b7e89f" text-anchor="middle">大量清水沖洗、119與產品資訊</text><ellipse cx="600" cy="245" rx="115" ry="100" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="560" cy="220" rx="20" ry="12" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><ellipse cx="650" cy="250" rx="20" ry="12" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M628 215L700 290" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M696.9 280.5L700 290L690.6 286.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="391" font-size="18" fill="#e3e9e2" text-anchor="start">患眼朝低處，水流不帶向另一眼</text><text x="465" y="430" font-size="16" fill="#e3e9e2" text-anchor="start">不自行用酸鹼中和；接觸鏡不拖延沖洗</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>