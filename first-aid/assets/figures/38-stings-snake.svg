<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-38-title aid-38-desc"><title id="aid-38-title">局部咬螫先看全身變化，蛇咬則盡快少動就醫</title><desc id="aid-38-desc">左側局部皮膚與全身反應分開，右側蛇形只示意安全辨識；不捕蛇、不切吸傷口、不冰敷或使用止血帶。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 38 / 局部咬螫先看全身變化，蛇咬則盡快少動就醫</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">蛇種、毒液與包紮方法有地區差異；不能把重大出血止血帶搬到蛇咬傷。</text><ellipse cx="170" cy="225" rx="105" ry="70" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="170" cy="225" rx="18" ry="18" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M290 225L380 225" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M371.0 220.7L380 225L371.0 229.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="358" font-size="18" fill="#e3e9e2" text-anchor="start">局部紅腫 ≠ 已排除嚴重過敏</text><text x="55" y="405" font-size="19" fill="#e3e9e2" text-anchor="start">呼吸、聲音、暈厥變化：119</text><path d="M515 200Q570 130 615 200T750 200Q770 250 715 265" stroke="#c1b2ea" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="340" font-size="18" fill="#e3e9e2" text-anchor="start">離開蛇、減少活動、去除飾物</text><text x="480" y="388" font-size="18" fill="#e3e9e2" text-anchor="start">記特徵但不追捕，119與盡快醫療</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>