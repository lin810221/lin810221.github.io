<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-31-title aid-31-desc"><title id="aid-31-title">先求援與減少負擔，用藥另有明確條件</title><desc id="aid-31-desc">胸痛、呼吸困難或不適出汗應促成119與休息；右側本人處方與專業指導是另一組條件，不以照片或症狀表自動給藥。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 31 / 先求援與減少負擔，用藥另有明確條件</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">此圖不判斷胸痛原因、不列所有禁忌；阿斯匹靈不是所有胸痛或中風通用藥。</text><ellipse cx="145" cy="155" rx="23" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M145 181V285M145 215L103 250M145 215L187 250M145 285L109 350M145 285L181 350" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="165" cy="245" rx="28" ry="25" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M240 220L320 220" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.0 215.7L320 220L311.0 224.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="155" width="180" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="425.0" y="191" font-size="20" fill="#b7e89f" text-anchor="middle">119與休息</text><text x="70" y="420" font-size="19" fill="#e3e9e2" text-anchor="start">不自行開車；觀察反應與呼吸</text><path d="M550 115V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="585" y="135" width="225" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="697.5" y="171" font-size="20" fill="#c1b2ea" text-anchor="middle">本人藥物與計畫</text><rect x="585" y="250" width="225" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="697.5" y="286" font-size="20" fill="#ead68c" text-anchor="middle">清醒、產品及禁忌</text><rect x="585" y="365" width="225" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="697.5" y="401" font-size="20" fill="#b7e89f" text-anchor="middle">119或醫療指導</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>