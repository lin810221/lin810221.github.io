<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-09-title aid-09-desc"><title id="aid-09-title">呼吸方式與救援分工需要各自清楚</title><desc id="aid-09-desc">左側分開受訓能做呼吸時的30比2與無法人工呼吸時持續胸外按壓；右側以救援者分工與短暫輪替維持照護。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 09 / 呼吸方式與救援分工需要各自清楚</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">成人兩人仍可30比2；兒童受訓雙救援者15比2另見兒童章。</text><rect x="40" y="125" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="215.0" y="161.0" font-size="20" fill="#b7e89f" text-anchor="middle">受訓、能且願意：30次按壓＋2口氣</text><rect x="40" y="235" width="350" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="215.0" y="271.0" font-size="20" fill="#9ac8e8" text-anchor="middle">無法人工呼吸：仍立即按壓</text><text x="50" y="355" font-size="19" fill="#e3e9e2" text-anchor="start">兒童、嬰兒與溺水更強調呼吸。</text><text x="50" y="405" font-size="18" fill="#e3e9e2" text-anchor="start">不要為找器材、爭論比例而停止救援。</text><path d="M430 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="120" width="330" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="640.0" y="156.0" font-size="20" fill="#b7e89f" text-anchor="middle">甲：按壓與品質回饋</text><rect x="475" y="220" width="330" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="640.0" y="256.0" font-size="20" fill="#ead68c" text-anchor="middle">乙：119、AED與呼吸</text><rect x="475" y="320" width="330" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="640.0" y="356.0" font-size="20" fill="#c1b2ea" text-anchor="middle">約2分鐘輪替，盡量不停壓</text><text x="475" y="425" font-size="17" fill="#e3e9e2" text-anchor="start">只換按壓者，不等於每2分鐘停下摸脈。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>