<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-19-title aid-19-desc"><title id="aid-19-title">呼吸困難先看整個人，不只聽哮鳴</title><desc id="aid-19-desc">左側以舒適坐姿及空氣通路表示呼吸負擔，右側協助有氣喘者使用本人已處方吸入器，嚴重或惡化時119並行。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 19 / 呼吸困難先看整個人，不只聽哮鳴</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">坐姿只是常見舒適選擇；無反應或異常呼吸時改依復甦原則。</text><ellipse cx="170" cy="160" rx="27" ry="30" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M170 195V275L250 275L280 355M170 230L245 230" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 365H320" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="420" font-size="19" fill="#e3e9e2" text-anchor="start">清醒時容許舒適呼吸姿勢</text><rect x="430" y="120" width="375" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="617.5" y="156.0" font-size="20" fill="#9ac8e8" text-anchor="middle">看說話、用力程度、反應與膚色</text><rect x="430" y="225" width="375" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="617.5" y="261.0" font-size="20" fill="#b7e89f" text-anchor="middle">已知氣喘：協助本人處方吸入器</text><rect x="430" y="330" width="375" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="617.5" y="366.0" font-size="20" fill="#ead68c" text-anchor="middle">危急／惡化：立即119</text><text x="435" y="430" font-size="17" fill="#e3e9e2" text-anchor="start">不能用別人的藥或用「沒有哨音」認定安全。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>