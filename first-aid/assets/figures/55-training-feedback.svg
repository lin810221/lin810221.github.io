<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-55-title aid-55-desc"><title id="aid-55-title">知道、練習、回饋與重做是不同階段</title><desc id="aid-55-desc">圖中人體模型與訓練AED代表安全實作，回饋包含速率、深度與回彈等不同面向；網頁答對或單一裝置燈號不能代替合格教學評估，也不保證真實救援結果。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 55 / 知道、練習、回饋與重做是不同階段</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="45" y="130" width="210" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="150.0" y="166" font-size="19" fill="#9ac8e8" text-anchor="middle">看懂與說明</text><path d="M265 159L305 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.0 154.7L305 159L296.0 163.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="130" width="210" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="425.0" y="166" font-size="19" fill="#b7e89f" text-anchor="middle">模型與訓練AED</text><path d="M540 159L580 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M571.0 154.7L580 159L571.0 163.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="595" y="130" width="220" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="705.0" y="166" font-size="19" fill="#ead68c" text-anchor="middle">回饋與重做</text><ellipse cx="230" cy="280" rx="28" ry="28" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><rect x="170" y="315" width="120" height="65" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="230" y="410" font-size="20" fill="#9ac8e8" text-anchor="middle">人體模型</text><rect x="420" y="265" width="350" height="145" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="445" y="310" font-size="21" fill="#c1b2ea" text-anchor="start">速率／深度／回彈／中斷</text><text x="445" y="360" font-size="19" fill="#e3e9e2" text-anchor="start">分項檢查，而非只看總分</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>