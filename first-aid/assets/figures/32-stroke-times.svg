<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-32-title aid-32-desc"><title id="aid-32-title">辨識突然異常，保留三個不同時間</title><desc id="aid-32-desc">左側臉、雙臂與說話是FAST提示並非全部症狀，右側08:00最後正常、08:40發現、08:50求援為已有延誤的原創紀錄；08:40本應立即119，不自行計治療截止。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 32 / 辨識突然異常，保留三個不同時間</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">三時點是既有紀錄並非等待流程；08:40發現即應119，不自算治療截止。</text><ellipse cx="150" cy="180" rx="45" ry="45" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M130 190Q152 215 175 193" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 285H210M95 285L70 330M210 285L235 310" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="383" font-size="22" fill="#b7e89f" text-anchor="start">臉、手臂、說話</text><text x="75" y="425" font-size="19" fill="#e3e9e2" text-anchor="start">任一突然異常，立即119</text><ellipse cx="470" cy="185" rx="38" ry="38" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M470 162V185L492 195" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="257" font-size="20" fill="#9ac8e8" text-anchor="middle">08:00</text><ellipse cx="625" cy="185" rx="38" ry="38" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M625 162V185L647 195" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="625" y="257" font-size="20" fill="#ead68c" text-anchor="middle">08:40</text><ellipse cx="780" cy="185" rx="38" ry="38" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M780 162V185L802 195" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="780" y="257" font-size="20" fill="#b7e89f" text-anchor="middle">08:50</text><text x="470" y="320" font-size="18" fill="#9ac8e8" text-anchor="middle">最後正常</text><text x="625" y="320" font-size="18" fill="#ead68c" text-anchor="middle">發現異常</text><text x="780" y="320" font-size="18" fill="#b7e89f" text-anchor="middle">已求援</text><text x="435" y="385" font-size="17" fill="#e3e9e2" text-anchor="start">時間未知就說未知，不倒推成發作時間</text><text x="435" y="425" font-size="18" fill="#ead68c" text-anchor="start">08:40本應立即119</text><text x="435" y="455" font-size="16" fill="#e3e9e2" text-anchor="start">08:50僅為既有延誤紀錄</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>