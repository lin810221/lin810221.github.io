<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-07-title aid-07-desc"><title id="aid-07-title">成人倒下的辨識與按壓位置</title><desc id="aid-07-desc">左側顯示無反應與異常喘息後接到119、按壓和AED；右側正面人體標出胸骨下半部和避開劍突的概念位置。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 07 / 成人倒下的辨識與按壓位置</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">位置與人體比例僅供辨識；實際掌根位置需由講師在人體模型確認。</text><rect x="35" y="125" width="340" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="205.0" y="161.0" font-size="20" fill="#ead68c" text-anchor="middle">無反應＋無正常呼吸</text><rect x="35" y="225" width="340" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="205.0" y="261.0" font-size="20" fill="#b7e89f" text-anchor="middle">119擴音＋立即CPR</text><rect x="35" y="325" width="340" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="205.0" y="361.0" font-size="20" fill="#9ac8e8" text-anchor="middle">請人帶AED、持續照護</text><path d="M205 195L205 212" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M209.3 203.0L205 212L200.7 203.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 295L205 312" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M209.3 303.0L205 312L200.7 303.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="620" cy="154.5" rx="23.400000000000002" ry="27.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M597.5 186.0Q539.0 199.5 543.5 285.0L570.5 366.0H669.5L696.5 285.0Q701.0 199.5 642.5 186.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 217.5V294.0" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="620" cy="265" rx="24" ry="15" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="620" y="420" font-size="17" fill="#e3e9e2" text-anchor="middle">胸骨下半部；避開劍突、肋緣與腹部</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>