<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-21-title aid-21-desc"><title id="aid-21-title">離水後的呼吸照護與持續評估</title><desc id="aid-21-desc">溺水離水後無反應無正常呼吸時，受訓能做者給含呼吸的CPR並優先開始，不等AED；正常呼吸者仍需觀察、保溫與醫療評估。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 21 / 離水後的呼吸照護與持續評估</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">不以倒掛、壓腹「排水」替代復甦；水中人工呼吸只限適當受訓者與安全情境。</text><rect x="40" y="120" width="350" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="215.0" y="156.0" font-size="20" fill="#ead68c" text-anchor="middle">無反應＋無正常呼吸</text><rect x="40" y="245" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="215.0" y="281.0" font-size="20" fill="#b7e89f" text-anchor="middle">能做者：含呼吸的CPR</text><path d="M210 195L210 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M214.3 221.0L210 230L205.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="355" font-size="18" fill="#e3e9e2" text-anchor="start">受訓者可先呼吸；不等器材才救。</text><text x="45" y="410" font-size="17" fill="#e3e9e2" text-anchor="start">無法呼吸仍做按壓，119與AED並行。</text><path d="M430 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="120" width="345" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="642.5" y="156.0" font-size="20" fill="#9ac8e8" text-anchor="middle">有正常呼吸：持續觀察</text><rect x="470" y="245" width="345" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="642.5" y="281.0" font-size="20" fill="#b7e89f" text-anchor="middle">保溫與及早醫療評估</text><rect x="470" y="370" width="345" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="642.5" y="406.0" font-size="20" fill="#c1b2ea" text-anchor="middle">惡化時立即重新辨識</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>