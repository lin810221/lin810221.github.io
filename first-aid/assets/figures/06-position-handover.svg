<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-06-title aid-06-desc"><title id="aid-06-title">側臥不是結束照護，紀錄也不能拖延行動</title><desc id="aid-06-desc">左側非創傷、正常呼吸但警醒下降的側臥人體示意；右側以何時發現、反應呼吸變化與已做措施連接現場交接。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 06 / 側臥不是結束照護，紀錄也不能拖延行動</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">姿勢非比例；疑似脊椎／骨盆傷害、異常呼吸或需CPR時另有優先考量。</text><ellipse cx="145" cy="250" rx="35" ry="31" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M180 253Q260 205 330 260L305 305L230 290L190 300" stroke="#9ac8e8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 260L160 285M250 285L320 350L365 345" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 360H390" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="405" font-size="17" fill="#9ac8e8" text-anchor="start">非創傷＋正常呼吸：合適側臥、持續看呼吸</text><path d="M430 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="125" width="325" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="637.5" y="161.0" font-size="20" fill="#b7e89f" text-anchor="middle">發現與最後正常時間</text><rect x="475" y="225" width="325" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="637.5" y="261.0" font-size="20" fill="#ead68c" text-anchor="middle">反應、呼吸與症狀變化</text><rect x="475" y="325" width="325" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="637.5" y="361.0" font-size="20" fill="#c1b2ea" text-anchor="middle">已做措施、時間與現場風險</text><text x="475" y="430" font-size="17" fill="#e3e9e2" text-anchor="start">變成無正常呼吸：立即改CPR，不留在側臥。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>