<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-15-title aid-15-desc"><title id="aid-15-title">手機與旁人讓求援和CPR並行</title><desc id="aid-15-desc">左側民眾主線以擴音119與立即CPR並行，右側分開無手機且必須離開傷者的受訓者情境，不能將專業摸脈要求套入民眾。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 15 / 手機與旁人讓求援和CPR並行</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">左側為民眾主線；右側需對照完整受訓演算法與情境，不是另一種延遲門檻。</text><rect x="40" y="130" width="350" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="215.0" y="166.0" font-size="20" fill="#9ac8e8" text-anchor="middle">有人／有手機：立即連線119</text><rect x="40" y="250" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="215.0" y="286.0" font-size="20" fill="#b7e89f" text-anchor="middle">無正常呼吸：立即CPR與呼吸</text><path d="M210 200L210 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M214.3 226.0L210 235L205.7 226.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="375" font-size="19" fill="#e3e9e2" text-anchor="start">請旁人帶AED；裝置到場就用。</text><path d="M430 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="130" width="345" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="642.5" y="166.0" font-size="20" fill="#ead68c" text-anchor="middle">無手機、獨自且必須離開</text><text x="475" y="245" font-size="18" fill="#e3e9e2" text-anchor="start">受訓者另看目擊突倒與非目擊分支</text><text x="475" y="305" font-size="18" fill="#e3e9e2" text-anchor="start">不能把「先約2分鐘」套成所有情境</text><text x="475" y="365" font-size="18" fill="#c1b2ea" text-anchor="start">不用摸脈決定民眾是否開始CPR</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>