<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-41-title aid-41-desc"><title id="aid-41-title">全身低體溫與局部凍傷要分開處理</title><desc id="aid-41-desc">左側乾燥、隔地與核心保溫優先，右側局部冷傷不搓揉或靠高熱，是否回溫需看再次凍結與撤離條件。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 41 / 全身低體溫與局部凍傷要分開處理</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">身體覆蓋位置只是核心保溫概念；不將熱源直接貼皮膚或套固定回溫處方。</text><ellipse cx="180" cy="130" rx="23" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M180 156V260M180 190L138 225M180 190L222 225M180 260L144 325M180 260L216 325" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="125" y="175" width="110" height="145" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M65 350H345" stroke="#c1b2ea" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="410" font-size="18" fill="#e3e9e2" text-anchor="start">溫和搬動、乾燥保溫、隔離地面</text><path d="M420 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="590" cy="215" rx="95" ry="50" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><text x="470" y="130" font-size="21" fill="#c1b2ea" text-anchor="start">局部凍傷：保護與醫療</text><text x="470" y="325" font-size="19" fill="#e3e9e2" text-anchor="start">不搓揉、不直接烤火或熱敷</text><text x="470" y="375" font-size="19" fill="#e3e9e2" text-anchor="start">避免回溫後再凍結</text><text x="470" y="425" font-size="18" fill="#e3e9e2" text-anchor="start">全身低體溫優先，119與撤離</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>