<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-12-title aid-12-desc"><title id="aid-12-title">無需電擊不等於不需要按壓</title><desc id="aid-12-desc">兩條分析結果都返回CPR，右下另列貼片接觸、胸部乾燥和特殊裝置注意事項；恢復正常呼吸時須重新觀察與交接。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 12 / 無需電擊不等於不需要按壓</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">此圖假設傷者仍無反應且無正常呼吸；裝置提示與實際變化需持續核對。</text><rect x="285" y="115" width="290" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="430.0" y="151.0" font-size="20" fill="#9ac8e8" text-anchor="middle">AED分析：所有人不碰</text><path d="M320 185L180 230" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.9 231.4L180 230L187.2 223.1" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 185L680 230" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M672.8 223.1L680 230L670.1 231.4" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="245" width="310" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="195.0" y="281.0" font-size="20" fill="#ead68c" text-anchor="middle">建議電擊：依提示電擊</text><rect x="510" y="245" width="310" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="665.0" y="281.0" font-size="20" fill="#c1b2ea" text-anchor="middle">不建議電擊</text><path d="M195 315L330 360" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.8 353.0L330 360L320.1 361.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M665 315L530 360" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M539.9 361.3L530 360L537.2 353.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="285" y="375" width="290" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430.0" y="411.0" font-size="20" fill="#b7e89f" text-anchor="middle">立即恢復CPR</text><text x="35" y="445" font-size="17" fill="#e3e9e2" text-anchor="start">未正常呼吸不等於康復；胸部擦乾、貼片避開植入裝置及藥物貼片。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>