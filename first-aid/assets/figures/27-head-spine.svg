<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-27-title aid-27-desc"><title id="aid-27-title">減少不必要移動，但氣道與CPR仍優先</title><desc id="aid-27-desc">左側頭、頸與軀幹只示相對連續，右側時間線表示受傷後症狀可能延遲；不能靠清醒、行走或網頁分數排除危險。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 27 / 減少不必要移動，但氣道與CPR仍優先</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">人體為非比例側面概念；不是脊椎影像、正式頸圈或運動返場工具。</text><ellipse cx="150" cy="210" rx="42" ry="42" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><rect x="192" y="193" width="60" height="35" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="252" y="165" width="170" height="90" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><path d="M115 285H435" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="355" font-size="20" fill="#e3e9e2" text-anchor="start">不扭轉、不強行矯正</text><text x="60" y="398" font-size="17" fill="#e3e9e2" text-anchor="start">危害、嘔吐或需CPR時另作必要處理</text><path d="M495 180H795" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="525" cy="180" rx="38" ry="38" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M525 157V180L547 190" stroke="#b7e89f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="525" y="252" font-size="20" fill="#b7e89f" text-anchor="middle">受傷</text><ellipse cx="730" cy="180" rx="38" ry="38" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M730 157V180L752 190" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="252" font-size="20" fill="#ead68c" text-anchor="middle">之後變化</text><text x="490" y="355" font-size="18" fill="#e3e9e2" text-anchor="start">反覆嘔吐、嗜睡加劇、局部無力</text><text x="490" y="399" font-size="18" fill="#e3e9e2" text-anchor="start">119與醫療評估，不讓其重返運動</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>