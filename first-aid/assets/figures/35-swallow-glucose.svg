<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-35-title aid-35-desc"><title id="aid-35-title">口服糖的前提是清醒與安全吞嚥</title><desc id="aid-35-desc">左側清醒能配合與吞嚥能力共同成立才討論本人既有低血糖計畫，右側無法安全吞嚥直接轉119與氣道照護，不塞糖或灌飲。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 35 / 口服糖的前提是清醒與安全吞嚥</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">此圖不以症狀確診低血糖、不教兒童套成人劑量；不可作即時病人分類工具。</text><rect x="45" y="125" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="220.0" y="161" font-size="20" fill="#b7e89f" text-anchor="middle">清醒、能配合、可安全吞嚥</text><path d="M220 192L220 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.3 221.0L220 230L215.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="255" width="350" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="220.0" y="291" font-size="20" fill="#9ac8e8" text-anchor="middle">按既有計畫或指導口服葡萄糖</text><text x="50" y="407" font-size="18" fill="#e3e9e2" text-anchor="start">觀察改善；未改善或惡化即求援</text><path d="M430 110V450" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="125" width="335" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="642.5" y="161" font-size="20" fill="#ead68c" text-anchor="middle">無法吞嚥、抽搐或反應下降</text><path d="M640 192L640 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M644.3 221.0L640 230L635.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="255" width="335" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="642.5" y="291" font-size="20" fill="#b7e89f" text-anchor="middle">119、氣道與反應呼吸評估</text><text x="480" y="407" font-size="18" fill="#e3e9e2" text-anchor="start">不灌飲、不塞食物、不自行注射</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>