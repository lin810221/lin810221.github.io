<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-01-title aid-01-desc"><title id="aid-01-title">急救把身邊的行動接到專業照護</title><desc id="aid-01-desc">由安全、求援、立即照護到交接的路徑說明民眾能做的事；下方三種角色各有訓練與責任，不是能力高低排名。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 01 / 急救把身邊的行動接到專業照護</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">箭頭是照護銜接，可由多人同時執行；不是等待上一格完成才求援。</text><rect x="35" y="135" width="165" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="117.5" y="171.0" font-size="20" fill="#9ac8e8" text-anchor="middle">確認安全</text><rect x="240" y="135" width="165" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="322.5" y="171.0" font-size="20" fill="#ead68c" text-anchor="middle">119求援</text><rect x="445" y="135" width="165" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="527.5" y="171.0" font-size="20" fill="#b7e89f" text-anchor="middle">立即照護</text><rect x="650" y="135" width="165" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="732.5" y="171.0" font-size="20" fill="#c1b2ea" text-anchor="middle">清楚交接</text><path d="M205 164L235 164" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M226.0 159.7L235 164L226.0 168.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 164L440 164" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M431.0 159.7L440 164L431.0 168.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M615 164L645 164" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M636.0 159.7L645 164L636.0 168.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="255" font-size="22" fill="#e3e9e2" text-anchor="middle">不需先猜出完整診斷，先處理可辨識的危急。</text><rect x="50" y="325" width="235" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="167.5" y="361.0" font-size="20" fill="#9ac8e8" text-anchor="middle">一般民眾：辨識與求援</text><rect x="313" y="325" width="235" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430.5" y="361.0" font-size="20" fill="#b7e89f" text-anchor="middle">受訓者：可靠技能</text><rect x="576" y="325" width="235" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="693.5" y="361.0" font-size="20" fill="#c1b2ea" text-anchor="middle">專業人員：進階照護</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>