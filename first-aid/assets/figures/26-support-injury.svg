<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-26-title aid-26-desc"><title id="aid-26-title">支持受傷部位，固定前後都要看末梢</title><desc id="aid-26-desc">左側骨與軟組織為非比例概念，夾板在上下支持且不強行拉直；右側末梢顏色、感覺與變化需反覆觀察。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 26 / 支持受傷部位，固定前後都要看末梢</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">示意不是夾板綁法認證；繃帶不能過緊，固定與搬運須依受訓和現場條件。</text><rect x="55" y="205" width="340" height="90" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M85 248H210L225 263L240 242H365" stroke="#c1b2ea" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="315" width="320" height="22" rx="3" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><path d="M125 205V334M330 205V334" stroke="#b7e89f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="398" font-size="20" fill="#e3e9e2" text-anchor="start">支持原位；不自行復位</text><rect x="460" y="125" width="325" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="622.5" y="161" font-size="20" fill="#b7e89f" text-anchor="middle">活動停止、保護與支持</text><rect x="460" y="235" width="325" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="622.5" y="271" font-size="20" fill="#9ac8e8" text-anchor="middle">顏色、溫度、感覺及疼痛</text><rect x="460" y="345" width="325" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="622.5" y="381" font-size="20" fill="#ead68c" text-anchor="middle">變差、畸形或無法承重：就醫</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>