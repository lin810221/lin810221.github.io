<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-39-title aid-39-desc"><title id="aid-39-title">咬傷清洗後，感染與暴露評估仍要接續</title><desc id="aid-39-desc">左側清水與肥皂清潔後覆蓋的路徑，右側傷口、動物、時間與既有免疫資訊供醫療評估；不自行決定是否需要疫苗或藥物。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 39 / 咬傷清洗後，感染與暴露評估仍要接續</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">圖不是狂犬病風險分數；不自行密封或縫合疑似暴露傷口，依醫療指示。</text><rect x="45" y="125" width="330" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="210.0" y="161" font-size="20" fill="#ead68c" text-anchor="middle">重大出血先控制與119</text><rect x="45" y="240" width="330" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="210.0" y="276" font-size="20" fill="#9ac8e8" text-anchor="middle">清潔水與肥皂充分洗傷口</text><rect x="45" y="355" width="330" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="210.0" y="391" font-size="20" fill="#b7e89f" text-anchor="middle">保護方式依傷口與醫療指示</text><path d="M435 110V450" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="485" y="155" font-size="24" fill="#b7e89f" text-anchor="start">提供資訊</text><text x="485" y="225" font-size="19" fill="#e3e9e2" text-anchor="start">動物種類、接觸方式與時間</text><text x="485" y="285" font-size="19" fill="#e3e9e2" text-anchor="start">傷口位置、深度與感染徵象</text><text x="485" y="345" font-size="18" fill="#e3e9e2" text-anchor="start">既有病史與破傷風／疫苗紀錄</text><text x="485" y="415" font-size="17" fill="#e3e9e2" text-anchor="start">安全觀察，不追捕或自行處理動物</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>