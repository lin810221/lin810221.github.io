<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-22-title aid-22-desc"><title id="aid-22-title">加壓控制出血，求援與分工同時進行</title><desc id="aid-22-desc">左側敷料與加壓箭頭朝向示意傷口，右側119、引導與持續觀察並行；不以圖中血量估計是否已休克。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 22 / 加壓控制出血，求援與分工同時進行</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">箭頭表示施力與工作方向；身體及傷口非比例，並非真實出血影像。</text><rect x="60" y="215" width="350" height="90" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M90 260H380" stroke="#eda894" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="210" y="195" width="70" height="36" rx="3" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><path d="M245 130L245 185" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M249.3 176.0L245 185L240.7 176.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="350" font-size="20" fill="#e3e9e2" text-anchor="start">敷料直接覆蓋，穩定持續施壓</text><text x="70" y="393" font-size="17" fill="#e3e9e2" text-anchor="start">傷口與手形為概念，非力道教具</text><rect x="490" y="125" width="300" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="640.0" y="161" font-size="20" fill="#ead68c" text-anchor="middle">119與擴音</text><rect x="490" y="235" width="300" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="640.0" y="271" font-size="20" fill="#9ac8e8" text-anchor="middle">拿裝備、引導救護車</text><rect x="490" y="345" width="300" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="640.0" y="381" font-size="20" fill="#c1b2ea" text-anchor="middle">看出血、反應與呼吸</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>