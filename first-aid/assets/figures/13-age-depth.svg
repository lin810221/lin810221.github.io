<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-13-title aid-13-desc"><title id="aid-13-title">年齡界線與胸廓深度各有用途</title><desc id="aid-13-desc">上方區分嬰兒、兒童與有青春期徵象起的成人流程，出生當下另列；下方兩個胸廓示意用前後徑約三分之一理解兒童與嬰兒深度。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 13 / 年齡界線與胸廓深度各有用途</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">非比例；年齡只是指南分類，不用固定成人深度壓所有體型。</text><rect x="35" y="120" width="240" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="155.0" y="156.0" font-size="20" fill="#9ac8e8" text-anchor="middle">嬰兒：未滿1歲</text><rect x="310" y="120" width="240" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430.0" y="156.0" font-size="20" fill="#b7e89f" text-anchor="middle">兒童：1歲至青春期前</text><rect x="585" y="120" width="240" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="705.0" y="156.0" font-size="20" fill="#ead68c" text-anchor="middle">有青春期徵象：成人</text><text x="50" y="225" font-size="20" fill="#e3e9e2" text-anchor="start">出生轉換期的新生兒復甦另有專業流程。</text><ellipse cx="250" cy="335" rx="130" ry="65" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="620" cy="335" rx="95" ry="48" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M250 260L250 315" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.3 306.0L250 315L245.7 306.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 275L620 320" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M624.3 311.0L620 320L615.7 311.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="430" font-size="17" fill="#9ac8e8" text-anchor="middle">兒童：約胸廓前後徑1/3，約5公分</text><text x="620" y="430" font-size="17" fill="#b7e89f" text-anchor="middle">嬰兒：約1/3，約4公分</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>