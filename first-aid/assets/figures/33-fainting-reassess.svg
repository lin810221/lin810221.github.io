<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-33-title aid-33-desc"><title id="aid-33-title">倒下前後都要重看反應與正常呼吸</title><desc id="aid-33-desc">左側從快昏倒到安全躺下是防止跌倒，右側把正常呼吸與無正常呼吸分流；不能因為常曾昏厥便省略重新評估。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 33 / 倒下前後都要重看反應與正常呼吸</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">姿勢需考慮傷害與呼吸；此圖不提供排除心臟或中風原因的分數。</text><ellipse cx="150" cy="130" rx="23" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M150 156V260M150 190L108 225M150 190L192 225M150 260L114 325M150 260L186 325" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 250L300 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M291.0 245.7L300 250L291.0 254.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="350" cy="285" rx="25" ry="25" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M380 285H440" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="420" font-size="19" fill="#e3e9e2" text-anchor="start">先降低跌倒風險，不急著扶站</text><rect x="490" y="115" width="310" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="645.0" y="151" font-size="20" fill="#ead68c" text-anchor="middle">持續無反應或危險徵象：119</text><rect x="490" y="245" width="310" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="645.0" y="281" font-size="20" fill="#9ac8e8" text-anchor="middle">正常呼吸：氣道、姿勢、監測</text><rect x="490" y="375" width="310" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="645.0" y="411" font-size="20" fill="#b7e89f" text-anchor="middle">無正常呼吸：CPR與AED</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>