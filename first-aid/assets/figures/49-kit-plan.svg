<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-49-title aid-49-desc"><title id="aid-49-title">物品、取得方式與家庭計畫需要配在一起</title><desc id="aid-49-desc">急救包的防護、敷料與保溫物資需要可取得和維護；家庭計畫把人員需求、聯絡與安全集合點接到物品，數量與用途依情境調整，不是買完固定清單便完成準備。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 49 / 物品、取得方式與家庭計畫需要配在一起</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="45" y="130" width="350" height="280" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><path d="M65 220H375M220 150V390" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="185" font-size="23" fill="#9ac8e8" text-anchor="middle">防護</text><text x="300" y="185" font-size="23" fill="#b7e89f" text-anchor="middle">敷料</text><text x="130" y="300" font-size="23" fill="#ead68c" text-anchor="middle">保溫</text><text x="300" y="300" font-size="23" fill="#c1b2ea" text-anchor="middle">工具</text><text x="220" y="380" font-size="18" fill="#e3e9e2" text-anchor="middle">效期／位置／開啟方式</text><path d="M410 270L455 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M446.0 265.7L455 270L446.0 274.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="475" y="130" width="330" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="640.0" y="166" font-size="19" fill="#b7e89f" text-anchor="middle">誰需要什麼協助</text><rect x="475" y="240" width="330" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="640.0" y="276" font-size="19" fill="#9ac8e8" text-anchor="middle">聯絡與安全集合點</text><rect x="475" y="350" width="330" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="640.0" y="386" font-size="19" fill="#ead68c" text-anchor="middle">替代安排與定期演練</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>