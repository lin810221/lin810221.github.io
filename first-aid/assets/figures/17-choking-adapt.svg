<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-17-title aid-17-desc"><title id="aid-17-title">胸部推壓與嬰兒支撐有特定條件</title><desc id="aid-17-desc">左側表示孕晚期或腹部無法環抱時改胸部推壓，右側嬰兒頭部較低並被支撐的概念，5拍背加5胸推而非腹部推壓。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 17 / 胸部推壓與嬰兒支撐有特定條件</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">側面為非比例支撐概念，非完整手把手示範；實作須由講師確認。</text><ellipse cx="200" cy="161.25" rx="19.5" ry="22.5" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M181.25 187.5Q132.5 198.75 136.25 270.0L158.75 337.5H241.25L263.75 270.0Q267.5 198.75 218.75 187.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 213.75V277.5" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="200" cy="250" rx="25" ry="16" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="200" y="390" font-size="18" fill="#9ac8e8" text-anchor="middle">孕晚期／無法環抱腹部</text><text x="200" y="430" font-size="20" fill="#ead68c" text-anchor="middle">5拍背＋5胸部推壓</text><path d="M425 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="535" cy="270" rx="30" ry="28" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><ellipse cx="650" cy="230" rx="75" ry="38" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M505 312L750 245" stroke="#c1b2ea" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="130" font-size="18" fill="#9ac8e8" text-anchor="middle">嬰兒：頭較低、支撐頭頸</text><text x="620" y="355" font-size="22" fill="#b7e89f" text-anchor="middle">5拍背＋5胸部推壓</text><text x="620" y="400" font-size="17" fill="#ead68c" text-anchor="middle">胸推用單掌根；不做腹部推壓</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>