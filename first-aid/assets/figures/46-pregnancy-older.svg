<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-46-title aid-46-desc"><title id="aid-46-title">人的條件會影響照護，但不延後救命行動</title><desc id="aid-46-desc">孕期無反應且無正常呼吸時仍需平躺CPR與AED，孕期的專業調整由受訓團隊處理；高齡跌倒則需保留基線、頭部撞擊與用藥資訊，不因能說話便急著扶走。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 46 / 人的條件會影響照護，但不延後救命行動</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><text x="55" y="130" font-size="21" fill="#9ac8e8" text-anchor="start">孕期情境：先分呼吸狀態</text><rect x="50" y="160" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="225.0" y="196" font-size="19" fill="#b7e89f" text-anchor="middle">無反應＋無正常呼吸</text><path d="M225 230L225 260" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M229.3 251.0L225 260L220.7 251.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="275" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="225.0" y="311" font-size="19" fill="#b7e89f" text-anchor="middle">平躺CPR／AED／119</text><text x="55" y="390" font-size="18" fill="#e3e9e2" text-anchor="start">不為胎兒評估延誤母體復甦</text><path d="M440 110V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="525" cy="140" rx="15" ry="15" stroke="#c1b2ea" fill="#17251e" stroke-width="3"/><path d="M525 157V207M525 173L501 188M525 173L549 188M525 207L503 240M525 207L547 240" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="585" y="125" width="230" height="250" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="605" y="165" font-size="21" fill="#c1b2ea" text-anchor="start">高齡跌倒資訊</text><text x="605" y="225" font-size="18" fill="#e3e9e2" text-anchor="start">平常功能與認知</text><text x="605" y="275" font-size="18" fill="#e3e9e2" text-anchor="start">撞頭、疼痛、出血</text><text x="605" y="325" font-size="18" fill="#e3e9e2" text-anchor="start">藥物與最後正常</text><text x="480" y="425" font-size="18" fill="#e3e9e2" text-anchor="start">先觀察，不強拉起身或試走。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>