<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-10-title aid-10-desc"><title id="aid-10-title">AED引導分析，不是人人都需要電擊</title><desc id="aid-10-desc">左側電極與心臟電活動的概念區分血流支持和節律分析；右側為原創使用步驟，分析與電擊時都需不觸碰傷者。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 10 / AED引導分析，不是人人都需要電擊</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">電流線只示意功能；不複製特定品牌或官方流程圖。</text><ellipse cx="200" cy="174.0" rx="20.8" ry="24.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M180.0 202.0Q128.0 214.0 132.0 290.0L156.0 362.0H244.0L268.0 290.0Q272.0 214.0 220.0 202.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 230.0V298.0" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="205" width="55" height="35" rx="4" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="235" y="280" width="55" height="35" rx="4" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><path d="M135 400L165 400L175 380L185 420L195 400H310" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="450" font-size="17" fill="#e3e9e2" text-anchor="start">不是實際心電圖，不由民眾判讀節律。</text><path d="M410 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="455" y="120" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="630.0" y="156.0" font-size="20" fill="#b7e89f" text-anchor="middle">開機、露出貼片部位</text><rect x="455" y="215" width="350" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="630.0" y="251.0" font-size="20" fill="#9ac8e8" text-anchor="middle">依圖貼片、聽裝置提示</text><rect x="455" y="310" width="350" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="630.0" y="346.0" font-size="20" fill="#ead68c" text-anchor="middle">分析／電擊：確認無人觸碰</text><text x="455" y="425" font-size="17" fill="#e3e9e2" text-anchor="start">電擊後或不需電擊：依提示立即恢復CPR。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>