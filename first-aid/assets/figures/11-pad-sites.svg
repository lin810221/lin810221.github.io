<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-11-title aid-11-desc"><title id="aid-11-title">貼片要接觸皮膚，也不能互相接觸</title><desc id="aid-11-desc">正面成人圖標示傷者右上胸及左側胸；右側用兩個小胸廓示意貼片可能互碰時依器材改前後位置與兒童模式。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 11 / 貼片要接觸皮膚，也不能互相接觸</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">器材和胸廓大小不同；前後貼法不是把兩片重疊在同一面。</text><ellipse cx="225" cy="159.5" rx="23.400000000000002" ry="27.0" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M202.5 191.0Q144.0 204.5 148.5 290.0L175.5 371.0H274.5L301.5 290.0Q306.0 204.5 247.5 191.0" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 222.5V299.0" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="220" width="58" height="35" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><rect x="265" y="293" width="58" height="35" rx="5" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="70" y="120" font-size="18" fill="#9ac8e8" text-anchor="start">成人正面：圖左是傷者右側</text><text x="55" y="420" font-size="18" fill="#ead68c" text-anchor="start">傷者右上胸</text><text x="245" y="420" font-size="18" fill="#ead68c" text-anchor="start">傷者左側胸</text><path d="M425 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="560" cy="215.25" rx="14.3" ry="16.5" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M546.25 234.5Q510.5 242.75 513.25 295.0L529.75 344.5H590.25L606.75 295.0Q609.5 242.75 573.75 234.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 253.75V300.5" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="730" cy="215.25" rx="14.3" ry="16.5" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M716.25 234.5Q680.5 242.75 683.25 295.0L699.75 344.5H760.25L776.75 295.0Q779.5 242.75 743.75 234.5" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M730 253.75V300.5" stroke="#c1b2ea" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="250" width="40" height="30" rx="4" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><rect x="710" y="250" width="40" height="30" rx="4" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="2"/><text x="560" y="380" font-size="19" fill="#b7e89f" text-anchor="middle">前側</text><text x="730" y="380" font-size="19" fill="#c1b2ea" text-anchor="middle">背側</text><text x="465" y="430" font-size="17" fill="#e3e9e2" text-anchor="start">依貼片圖示；有兒童衰減模式則使用。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>