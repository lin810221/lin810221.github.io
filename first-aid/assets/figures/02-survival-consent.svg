<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-02-title aid-02-desc"><title id="aid-02-title">存活之鏈也需要尊重與持續支持</title><desc id="aid-02-desc">上方時間線呈現立即辨識與求援、CPR及AED接到專業照護和復原；下方分開能表達意願與無法回應的情境。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 02 / 存活之鏈也需要尊重與持續支持</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">各環節相互銜接；條文與訓練資格須按當地正式規範核對。</text><path d="M65 170H795" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="100" cy="170" rx="10" ry="10" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="100" y="125" font-size="18" fill="#9ac8e8" text-anchor="middle">辨識／求援</text><ellipse cx="280" cy="170" rx="10" ry="10" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="280" y="125" font-size="18" fill="#b7e89f" text-anchor="middle">CPR／AED</text><ellipse cx="470" cy="170" rx="10" ry="10" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="470" y="125" font-size="18" fill="#ead68c" text-anchor="middle">專業照護</text><ellipse cx="690" cy="170" rx="10" ry="10" stroke="#c1b2ea" fill="#c1b2ea" stroke-width="3"/><text x="690" y="125" font-size="18" fill="#c1b2ea" text-anchor="middle">復原支持</text><path d="M740 170L805 170" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M796.0 165.7L805 170L796.0 174.3" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="270" width="340" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="225.0" y="306.0" font-size="20" fill="#9ac8e8" text-anchor="middle">有反應：說明、詢問、尊重</text><rect x="460" y="270" width="340" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="630.0" y="306.0" font-size="20" fill="#b7e89f" text-anchor="middle">無反應危急：求援與救命行動</text><text x="55" y="385" font-size="20" fill="#e3e9e2" text-anchor="start">只暴露必要部位；不拍攝、不公開個資。</text><text x="55" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">臺灣法律有適用條件，不能把任何行為都說成一律免責。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>