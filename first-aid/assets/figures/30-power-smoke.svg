<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-30-title aid-30-desc"><title id="aid-30-title">尚有電力或煙霧時，先改變接近條件</title><desc id="aid-30-desc">左側斷電與隔離界線在接觸傷者之前，右側煙霧以撤離、119及呼吸觀察連接；口罩或濕布不能使危險環境可安全進入。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 30 / 尚有電力或煙霧時，先改變接近條件</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">虛線是安全界線概念，不是可套用的固定高壓安全距離。</text><rect x="60" y="130" width="300" height="250" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M210 155L175 225H220L195 305" stroke="#ead68c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 110V435" stroke="#eda894" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="65" y="418" font-size="20" fill="#e3e9e2" text-anchor="start">斷電、隔離並確認安全</text><rect x="470" y="125" width="320" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="630.0" y="161" font-size="20" fill="#ead68c" text-anchor="middle">不貿然進入煙或高壓危害</text><rect x="470" y="235" width="320" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="630.0" y="271" font-size="20" fill="#9ac8e8" text-anchor="middle">安全撤離、119與人數位置</text><rect x="470" y="345" width="320" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="630.0" y="381" font-size="20" fill="#b7e89f" text-anchor="middle">安全後評估反應、呼吸及燒傷</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>