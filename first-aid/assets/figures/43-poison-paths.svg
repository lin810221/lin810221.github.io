<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-43-title aid-43-desc"><title id="aid-43-title">暴露途徑與安全求援需要一起整理</title><desc id="aid-43-desc">口服、皮膚與吸入等暴露途徑會影響停止暴露及資料蒐集，右側容器卡保留物質、時間與不確定量；危急時119與照護先行，不能為補完整表而等待。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 43 / 暴露途徑與安全求援需要一起整理</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="40" y="130" width="190" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="135.0" y="166" font-size="19" fill="#9ac8e8" text-anchor="middle">吞入／誤服</text><rect x="40" y="230" width="190" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="135.0" y="266" font-size="19" fill="#ead68c" text-anchor="middle">皮膚／眼部</text><rect x="40" y="330" width="190" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="135.0" y="366" font-size="19" fill="#c1b2ea" text-anchor="middle">吸入</text><path d="M240 159L325 235" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M321.2 225.8L325 235L315.4 232.2" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 259L325 259" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M316.0 254.7L325 259L316.0 263.3" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 359L325 280" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M315.4 282.9L325 280L321.4 289.3" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="228" width="190" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="435.0" y="264" font-size="19" fill="#b7e89f" text-anchor="middle">先停止危害</text><path d="M540 257L585 257" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M576.0 252.7L585 257L576.0 261.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="125" width="220" height="280" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="620" y="165" font-size="21" fill="#9ac8e8" text-anchor="start">安全求援資訊</text><text x="620" y="220" font-size="18" fill="#e3e9e2" text-anchor="start">物質與原容器</text><text x="620" y="265" font-size="18" fill="#e3e9e2" text-anchor="start">時間、途徑、量</text><text x="620" y="310" font-size="18" fill="#e3e9e2" text-anchor="start">反應與呼吸</text><text x="620" y="355" font-size="18" fill="#e3e9e2" text-anchor="start">未知就說未知</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>