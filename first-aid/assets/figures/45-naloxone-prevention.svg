<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-45-title aid-45-desc"><title id="aid-45-title">逆轉藥物與預防系統各有位置</title><desc id="aid-45-desc">納洛酮可逆轉鴉片類造成的呼吸抑制，但取得、使用和後續監測需合宜安排；圖中救命行動不因尋藥中斷，右側儲藥櫃顯示原標示、上鎖與分開存放的預防概念。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 45 / 逆轉藥物與預防系統各有位置</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="40" y="125" width="340" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="210.0" y="161" font-size="19" fill="#b7e89f" text-anchor="middle">119／呼吸支持／CPR／AED</text><path d="M210 193L210 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M214.3 221.0L210 230L205.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="245" width="340" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="210.0" y="281" font-size="19" fill="#9ac8e8" text-anchor="middle">納洛酮：可用且依指示</text><text x="50" y="350" font-size="20" fill="#9ac8e8" text-anchor="start">與急救並行，不取代急救</text><text x="50" y="410" font-size="19" fill="#e3e9e2" text-anchor="start">改善後仍需持續監測與就醫</text><rect x="480" y="115" width="310" height="290" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><path d="M635 120V400" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="170" width="70" height="130" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="555" y="215" font-size="25" fill="#9ac8e8" text-anchor="middle">原</text><text x="555" y="255" font-size="18" fill="#9ac8e8" text-anchor="middle">標示</text><rect x="680" y="170" width="70" height="130" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="715" y="215" font-size="25" fill="#ead68c" text-anchor="middle">分</text><text x="715" y="255" font-size="20" fill="#ead68c" text-anchor="middle">類</text><ellipse cx="635" cy="337" rx="20" ry="19" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><text x="635" y="344" font-size="18" fill="#b7e89f" text-anchor="middle">鎖</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>