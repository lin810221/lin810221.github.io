<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-40-title aid-40-desc"><title id="aid-40-title">疑似熱中暑：119與積極降溫並行</title><desc id="aid-40-desc">熱暴露加反應改變應立即求援與降溫，左側以冷水濕潤、通風與安全環境示意；有無出汗都不能單獨排除熱中暑。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 40 / 疑似熱中暑：119與積極降溫並行</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">冷水浸泡需要安全支援及持續氣道監測；圖不提供個人的降溫速度或停止溫度。</text><ellipse cx="100" cy="145" rx="32" ry="32" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><path d="M140.0 145.0L152.0 145.0" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M128.3 173.3L136.8 181.8" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100.0 185.0L100.0 197.0" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M71.7 173.3L63.2 181.8" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M60.0 145.0L48.0 145.0" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M71.7 116.7L63.2 108.2" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100.0 105.0L100.0 93.0" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M128.3 116.7L136.8 108.2" stroke="#ead68c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="270" cy="150" rx="23" ry="23" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M270 176V280M270 210L228 245M270 210L312 245M270 280L234 345M270 280L306 345" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 170L320 200" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.0 199.5L320 200L325.8 191.9" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M375 245L320 260" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.8 261.8L320 260L327.5 253.4" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="418" font-size="18" fill="#e3e9e2" text-anchor="start">移離熱源、脫多餘衣物、立即降溫</text><rect x="470" y="125" width="320" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="630.0" y="161" font-size="20" fill="#b7e89f" text-anchor="middle">119與降溫同時安排</text><rect x="470" y="245" width="320" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="630.0" y="281" font-size="20" fill="#9ac8e8" text-anchor="middle">反應、氣道與正常呼吸</text><rect x="470" y="365" width="320" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="630.0" y="401" font-size="20" fill="#ead68c" text-anchor="middle">不等體溫計、不以退燒藥取代</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>