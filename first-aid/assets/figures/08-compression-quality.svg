<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-08-title aid-08-desc"><title id="aid-08-title">按壓需要深度、速率與完整回彈</title><desc id="aid-08-desc">左側以胸壁示意按壓與回彈的方向，右側並列速率、成人深度、完整回彈及減少中斷，不能只追求更快或更用力。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 08 / 按壓需要深度、速率與完整回彈</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">剖面只是動作概念，非力學模型；數值屬成人2025AHA參考，不套到嬰兒。</text><path d="M65 200Q190 135 330 200M65 275Q190 210 330 275" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 135L195 240" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M199.3 231.0L195 240L190.7 231.0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 260L240 150" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.7 159.0L240 150L244.3 159.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="340" font-size="20" fill="#e3e9e2" text-anchor="start">按壓 ↓；放開後完整回彈 ↑</text><text x="70" y="395" font-size="18" fill="#e3e9e2" text-anchor="start">肩在手上方、手臂伸直、穩定支撐</text><rect x="420" y="120" width="385" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="612.5" y="156.0" font-size="20" fill="#9ac8e8" text-anchor="middle">速率：100–120次／分鐘</text><rect x="420" y="205" width="385" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="612.5" y="241.0" font-size="20" fill="#ead68c" text-anchor="middle">成人深度：至少5公分、避免超過6</text><rect x="420" y="290" width="385" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="612.5" y="326.0" font-size="20" fill="#b7e89f" text-anchor="middle">每次完整回彈、不倚壓</text><rect x="420" y="375" width="385" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="612.5" y="411.0" font-size="20" fill="#c1b2ea" text-anchor="middle">減少不必要中斷</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>