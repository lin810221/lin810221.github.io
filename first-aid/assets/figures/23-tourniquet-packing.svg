<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-23-title aid-23-desc"><title id="aid-23-title">肢體止血帶與填塞訓練各有適用位置</title><desc id="aid-23-desc">左側商用止血帶在傷口近心端且避開關節，右側把深部可填塞軟組織與胸腹眼等不同部位區分；操作必須在訓練器材上學習。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 23 / 肢體止血帶與填塞訓練各有適用位置</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">此圖不模擬止血壓力或填塞手感；未示全部器材步驟，不在真人練習。</text><rect x="70" y="160" width="300" height="78" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><ellipse cx="105" cy="199" rx="20" ry="27" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><text x="85" y="125" font-size="19" fill="#9ac8e8" text-anchor="start">身體近端 ←</text><path d="M300 163L315 185L300 208" stroke="#eda894" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="195" y="146" width="32" height="106" rx="3" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="75" y="305" font-size="20" fill="#ead68c" text-anchor="start">避開關節，傷口近心端</text><text x="75" y="348" font-size="20" fill="#e3e9e2" text-anchor="start">記錄時間；不自行鬆開</text><rect x="460" y="125" width="330" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="625.0" y="161" font-size="20" fill="#ead68c" text-anchor="middle">肢體：商用止血帶</text><rect x="460" y="235" width="330" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="625.0" y="271" font-size="20" fill="#b7e89f" text-anchor="middle">合適深部軟組織：受訓填塞</text><rect x="460" y="345" width="330" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="625.0" y="381" font-size="20" fill="#c1b2ea" text-anchor="middle">胸、腹、眼：不套用填塞</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>