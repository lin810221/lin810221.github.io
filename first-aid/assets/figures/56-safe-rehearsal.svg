<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-56-title aid-56-desc"><title id="aid-56-title">練習動作與團隊溝通都要有安全界線</title><desc id="aid-56-desc">真人同伴用於溝通和角色演練，按壓、胸腹推壓與藥物操作使用合適模型或訓練器材；右側回覆確認使任務有人承接，不靠大聲呼喊假設工作已完成。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 56 / 練習動作與團隊溝通都要有安全界線</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><ellipse cx="120" cy="150" rx="15" ry="15" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M120 167V217M120 183L96 198M120 183L144 198M120 217L98 250M120 217L142 250" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="300" font-size="20" fill="#9ac8e8" text-anchor="middle">真人同伴</text><text x="50" y="350" font-size="18" fill="#e3e9e2" text-anchor="start">只演練詢問、求援與分工</text><text x="50" y="400" font-size="18" fill="#ead68c" text-anchor="start">不試壓胸腹、不緊勒止血帶</text><path d="M430 110V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="125" width="320" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="640.0" y="161" font-size="19" fill="#9ac8e8" text-anchor="middle">指名：請拿AED</text><path d="M640 195L640 225" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M644.3 216.0L640 225L635.7 216.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="240" width="320" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="640.0" y="276" font-size="19" fill="#b7e89f" text-anchor="middle">覆誦：我去拿AED</text><path d="M640 310L640 340" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M644.3 331.0L640 340L635.7 331.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="355" width="320" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="640.0" y="391" font-size="19" fill="#ead68c" text-anchor="middle">回報：AED已到</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>