<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-18-title aid-18-desc"><title id="aid-18-title">一旦無反應，處置轉入CPR</title><desc id="aid-18-desc">左側無反應後不再站立反覆推壓，而在安全平面開始CPR；右側只取看得見的異物並接到恢復後評估與預防。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 18 / 一旦無反應，處置轉入CPR</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">只見得到才處理，不用手指深入探找，也不等待吸出器。</text><rect x="40" y="125" width="350" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="215.0" y="161.0" font-size="20" fill="#ead68c" text-anchor="middle">嚴重哽塞後無反應</text><rect x="40" y="245" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="215.0" y="281.0" font-size="20" fill="#b7e89f" text-anchor="middle">安全放下、119、開始CPR</text><path d="M210 195L210 230" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M214.3 221.0L210 230L205.7 221.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="375" font-size="18" fill="#e3e9e2" text-anchor="start">從胸外按壓開始，不花時間摸脈。</text><path d="M430 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="125" width="345" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="642.5" y="161.0" font-size="20" fill="#9ac8e8" text-anchor="middle">開氣道時：只移除可見異物</text><rect x="470" y="245" width="345" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="642.5" y="281.0" font-size="20" fill="#ead68c" text-anchor="middle">不盲掃、不延誤CPR</text><rect x="470" y="365" width="345" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="642.5" y="401.0" font-size="20" fill="#c1b2ea" text-anchor="middle">排出後：醫療評估與預防</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>