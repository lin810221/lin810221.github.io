<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-57-title aid-57-desc"><title id="aid-57-title">裝備與技能維護需要反覆回顧</title><desc id="aid-57-desc">用品效期、AED狀態和人員能力由巡檢、練習、回饋及更新構成循環；圖中的文件卡保存來源與日期，避免把查核日當成指南版本或把填表當成已完成技能評量。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 57 / 裝備與技能維護需要反覆回顧</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="65" y="130" width="240" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="185.0" y="166" font-size="19" fill="#9ac8e8" text-anchor="middle">巡檢與到期資訊</text><rect x="545" y="130" width="240" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="665.0" y="166" font-size="19" fill="#b7e89f" text-anchor="middle">演練與觀察</text><rect x="545" y="335" width="240" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="665.0" y="371" font-size="19" fill="#ead68c" text-anchor="middle">回饋與修正</text><rect x="65" y="335" width="240" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="185.0" y="371" font-size="19" fill="#c1b2ea" text-anchor="middle">更新與再確認</text><path d="M315 160L530 160" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M521.0 155.7L530 160L521.0 164.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M665 200L665 320" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M669.3 311.0L665 320L660.7 311.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M530 365L320 365" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.0 369.3L320 365L329.0 360.7" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M185 320L185 205" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M180.7 214.0L185 205L189.3 214.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="345" y="235" width="170" height="65" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="430" y="262" font-size="19" fill="#b7e89f" text-anchor="middle">版本／日期</text><text x="430" y="288" font-size="17" fill="#e3e9e2" text-anchor="middle">責任／下一步</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>