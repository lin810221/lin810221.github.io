<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-14-title aid-14-desc"><title id="aid-14-title">嬰兒2025按壓更新與呼吸原則</title><desc id="aid-14-desc">左右兩個非比例胸廓分別以單掌根與雙拇指環抱示意可用手法；下方說明一人30比2與受訓兩人15比2，不以雙指作新版主線。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 14 / 嬰兒2025按壓更新與呼吸原則</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">手與胸廓為人體模型概念，不能據此驗收力量、位置或氣道密合。</text><ellipse cx="235" cy="245" rx="125" ry="75" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><rect x="208" y="210" width="54" height="45" rx="12" stroke="#ead68c" fill="#ead68c" stroke-width="2"/><text x="235" y="355" font-size="23" fill="#ead68c" text-anchor="middle">單掌根按壓</text><ellipse cx="625" cy="245" rx="125" ry="75" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M505 230Q505 130 625 155Q745 130 745 230" stroke="#c1b2ea" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="610" cy="220" rx="13" ry="27" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><ellipse cx="640" cy="220" rx="13" ry="27" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="625" y="355" font-size="23" fill="#b7e89f" text-anchor="middle">雙拇指環抱</text><text x="50" y="425" font-size="18" fill="#e3e9e2" text-anchor="start">單人30：2；受訓兩人兒童／嬰兒15：2，呼吸以看見胸起為準。</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意；非比例。實際求援依119指導，身體操作需用人體模型與合格實體訓練。</text></g></svg>