<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-48-title aid-48-desc"><title id="aid-48-title">心理急救與事件後支持是持續連結</title><desc id="aid-48-desc">安全與需求觀察、尊重地聆聽及連結實際資源構成支持循環，事件後仍可追蹤需要；圖不要求當事人詳述創傷，也不以單次談話判斷疾病或結案。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 48 / 心理急救與事件後支持是持續連結</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="55" y="130" width="220" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="165.0" y="166" font-size="19" fill="#9ac8e8" text-anchor="middle">觀察安全與需求</text><rect x="335" y="130" width="220" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="445.0" y="166" font-size="19" fill="#b7e89f" text-anchor="middle">聆聽與尊重</text><rect x="615" y="130" width="200" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="715.0" y="166" font-size="19" fill="#ead68c" text-anchor="middle">連結實際資源</text><path d="M285 159L320 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M311.0 154.7L320 159L311.0 163.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M565 159L600 159" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M591.0 154.7L600 159L591.0 163.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M715 200V260H160V210" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="300" width="650" height="105" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="435" y="342" font-size="23" fill="#c1b2ea" text-anchor="middle">事件後：休息、支持、需要時轉介</text><text x="435" y="379" font-size="19" fill="#e3e9e2" text-anchor="middle">不強迫重述、不承諾保證、保護隱私</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>