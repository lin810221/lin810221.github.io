<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-50-title aid-50-desc"><title id="aid-50-title">不同災害的當下行動不可套用同一方向</title><desc id="aid-50-desc">地震搖晃時就近保護頭頸並抓穩掩護，與火災評估無煙安全路徑或關門待援是兩種不同情境；圖為空間概念，不是可套用到所有建築的逃生配置。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 50 / 不同災害的當下行動不可套用同一方向</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><text x="55" y="130" font-size="22" fill="#9ac8e8" text-anchor="start">地震：趴下、掩護、穩住</text><path d="M80 220H370M110 220V370M340 220V370" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="190" cy="290" rx="18" ry="18" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M210 300L265 315L290 355M205 325L165 350" stroke="#b7e89f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 280L245 260L333 255" stroke="#b7e89f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="415" font-size="18" fill="#e3e9e2" text-anchor="start">不為關火或衝出門穿越落物</text><path d="M440 110V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="150" width="265" height="230" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><path d="M650 150V380" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="210" font-size="20" fill="#b7e89f" text-anchor="middle">安全處</text><text x="710" y="215" font-size="20" fill="#ead68c" text-anchor="middle">濃煙</text><path d="M665 245q30-30 60 0M665 275q30-30 60 0" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="485" y="425" font-size="18" fill="#e3e9e2" text-anchor="start">無安全出口：關門、119報位置</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>