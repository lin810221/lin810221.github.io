<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-52-title aid-52-desc"><title id="aid-52-title">多人事件先劃安全邊界，再安排可做的工作</title><desc id="aid-52-desc">圖中人形是虛構事件參與者，不以顏色判定傷勢或救援順序；危害邊界外先向119報人數與危害，再由有能力的人處理可安全接近者並安排引導和器材。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 52 / 多人事件先劃安全邊界，再安排可做的工作</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="45" y="125" width="300" height="290" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><ellipse cx="120" cy="170" rx="15" ry="15" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M120 187V237M120 203L96 218M120 203L144 218M120 237L98 270M120 237L142 270" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="245" cy="250" rx="15" ry="15" stroke="#ead68c" fill="#17251e" stroke-width="3"/><path d="M245 267V317M245 283L221 298M245 283L269 298M245 317L223 350M245 317L267 350" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="390" font-size="18" fill="#ead68c" text-anchor="middle">未解除危害區：不進入</text><path d="M395 110V450" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><rect x="450" y="125" width="360" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="630.0" y="161" font-size="19" fill="#9ac8e8" text-anchor="middle">119：位置、危害、約略人數</text><rect x="450" y="235" width="360" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="630.0" y="271" font-size="19" fill="#b7e89f" text-anchor="middle">可安全接近者的必要急救</text><rect x="450" y="345" width="360" height="58" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><text x="630.0" y="381" font-size="19" fill="#c1b2ea" text-anchor="middle">AED、器材、引導與資訊</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>