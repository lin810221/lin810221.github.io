<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-34-title aid-34-desc"><title id="aid-34-title">抽搐時保護與求援，不是壓住或塞東西</title><desc id="aid-34-desc">左側空間與頭部軟墊示意降低碰撞，右側計時與119並行；發作停止後仍需評估正常呼吸與反應。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 34 / 抽搐時保護與求援，不是壓住或塞東西</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">人體動作只是概念；不以計時器取代當下反應、呼吸與安全判斷。</text><ellipse cx="155" cy="250" rx="27" ry="27" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M185 250H330M245 250L280 220M245 250L290 280M330 250L385 220M330 250L380 290" stroke="#9ac8e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="118" y="283" width="75" height="25" rx="4" stroke="#b7e89f" fill="#b7e89f" stroke-width="2"/><path d="M70 145H410V365H70Z" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><text x="75" y="420" font-size="18" fill="#e3e9e2" text-anchor="start">移開危險物、軟墊護頭、不限制動作</text><ellipse cx="570" cy="175" rx="38" ry="38" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M570 152V175L592 185" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="247" font-size="20" fill="#9ac8e8" text-anchor="middle">記開始與結束</text><rect x="480" y="315" width="320" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="640.0" y="351" font-size="20" fill="#ead68c" text-anchor="middle">危險情境立即119，不必等五分鐘</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>