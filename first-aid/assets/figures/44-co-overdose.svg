<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-44-title aid-44-desc"><title id="aid-44-title">危險空間與呼吸急症分開處理</title><desc id="aid-44-desc">左側一氧化碳疑似危險房間與安全區有清楚邊界，救援者不進入未知氣體空間；右側藥物急症先依反應與正常呼吸求援和照護，不等找到所有藥袋。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 44 / 危險空間與呼吸急症分開處理</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="40" y="125" width="300" height="260" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="190" y="165" font-size="22" fill="#ead68c" text-anchor="middle">疑似有害氣體區</text><text x="190" y="235" font-size="20" fill="#e3e9e2" text-anchor="middle">無色無味 ≠ 安全</text><text x="190" y="300" font-size="20" fill="#ead68c" text-anchor="middle">不貿然進入救人</text><path d="M390 105V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><ellipse cx="470" cy="155" rx="15" ry="15" stroke="#9ac8e8" fill="#17251e" stroke-width="3"/><path d="M470 172V222M470 188L446 203M470 188L494 203M470 222L448 255M470 222L492 255" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="300" font-size="20" fill="#9ac8e8" text-anchor="middle">安全處119</text><rect x="590" y="130" width="230" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="705.0" y="166" font-size="19" fill="#b7e89f" text-anchor="middle">無反應＋無正常呼吸</text><path d="M705 200L705 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M709.3 226.0L705 235L700.7 226.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="250" width="230" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="705.0" y="286" font-size="19" fill="#b7e89f" text-anchor="middle">CPR＋AED＋119</text><text x="590" y="370" font-size="17" fill="#e3e9e2" text-anchor="start">藥物包裝能取得才保留</text><text x="590" y="415" font-size="17" fill="#e3e9e2" text-anchor="start">不可為找藥而延誤照護</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>