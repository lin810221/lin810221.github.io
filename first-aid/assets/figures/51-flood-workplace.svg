<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-51-title aid-51-desc"><title id="aid-51-title">水電邊界與工作場所動線都要先確認</title><desc id="aid-51-desc">積淹水可能隱藏水流、孔洞與電力危害，圖中安全路徑不穿越水域；工作場所則預先連結AED、急救包、引導者和可通行入口，不以圖上的距離估真實救援時間。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 51 / 水電邊界與工作場所動線都要先確認</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><path d="M45 320q40-35 80 0t80 0t80 0t80 0" stroke="#9ac8e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="375" font-size="21" fill="#9ac8e8" text-anchor="start">不涉水、不駕車穿越</text><ellipse cx="80" cy="150" rx="15" ry="15" stroke="#b7e89f" fill="#17251e" stroke-width="3"/><path d="M80 167V217M80 183L56 198M80 183L104 198M80 217L58 250M80 217L102 250" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 200L350 200" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M341.0 195.7L350 200L341.0 204.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="160" font-size="18" fill="#b7e89f" text-anchor="middle">安全高處／官方指示</text><path d="M440 110V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="130" width="330" height="260" rx="12" stroke="#c1b2ea" fill="#17251e" stroke-width="2"/><rect x="505" y="160" width="120" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="565.0" y="196" font-size="19" fill="#9ac8e8" text-anchor="middle">AED</text><rect x="665" y="160" width="120" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="725.0" y="196" font-size="19" fill="#b7e89f" text-anchor="middle">急救包</text><rect x="565" y="300" width="180" height="58" rx="12" stroke="#ead68c" fill="#17251e" stroke-width="2"/><text x="655.0" y="336" font-size="19" fill="#ead68c" text-anchor="middle">入口與引導者</text><path d="M565 230V280H650V235" stroke="#c1b2ea" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="430" font-size="18" fill="#e3e9e2" text-anchor="start">入口暢通、設備可拿、角色有人</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>