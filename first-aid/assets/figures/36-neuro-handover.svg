<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-36-title aid-36-desc"><title id="aid-36-title">相似外觀仍可有不同原因，先交代可見資訊</title><desc id="aid-36-desc">三條時間線分開發作、進食用藥及反應變化，資料送到119與救護交接；未知保留，不靠單一症狀在現場下診斷。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 36 / 相似外觀仍可有不同原因，先交代可見資訊</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">線長沒有臨床時間刻度；這是資訊組織方法，不是鑑別診斷演算法。</text><text x="60" y="135" font-size="20" fill="#9ac8e8" text-anchor="start">發作／突然症狀</text><path d="M60 170H480" stroke="#9ac8e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="235" font-size="20" fill="#ead68c" text-anchor="start">進食／本人用藥</text><path d="M60 270H480" stroke="#ead68c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="335" font-size="20" fill="#c1b2ea" text-anchor="start">反應／正常呼吸</text><path d="M60 370H480" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 270L565 270" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M556.0 265.7L565 270L556.0 274.3" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="190" width="210" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="695.0" y="226" font-size="20" fill="#b7e89f" text-anchor="middle">119與交接</text><text x="580" y="355" font-size="18" fill="#e3e9e2" text-anchor="start">看到什麼？何時？</text><text x="580" y="395" font-size="18" fill="#e3e9e2" text-anchor="start">做過什麼？有何變化？</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">原創教學示意，非比例；先看安全、求援和變化，再回課文核對受訓及器材條件。</text></g></svg>