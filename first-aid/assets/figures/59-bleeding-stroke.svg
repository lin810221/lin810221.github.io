<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="aid-59-title aid-59-desc"><title id="aid-59-title">兩個獨立案例：止血與中風時間資訊</title><desc id="aid-59-desc">左側重大肢體出血需要直接加壓、119與合宜受訓止血工具，右側中風時間線分開最後正常、發現與求援，不能由這三時點自行判定治療資格。</desc><rect width="860" height="520" rx="15" fill="#111a17"/><g font-family="Microsoft JhengHei,Arial,sans-serif"><text x="30" y="39" font-size="23" fill="#b7e89f" text-anchor="start">圖 59 / 兩個獨立案例：止血與中風時間資訊</text><text x="30" y="75" font-size="14" fill="#adbcaf" text-anchor="start">原創概念示意；箭頭表示流程或資訊方向，非精密動作或技能評分。</text><rect x="45" y="130" width="350" height="58" rx="12" stroke="#9ac8e8" fill="#17251e" stroke-width="2"/><text x="220.0" y="166" font-size="19" fill="#9ac8e8" text-anchor="middle">重大出血：119與直接加壓</text><path d="M220 200L220 235" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M224.3 226.0L220 235L215.7 226.0" stroke="#b7e89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="250" width="350" height="58" rx="12" stroke="#b7e89f" fill="#17251e" stroke-width="2"/><text x="220.0" y="286" font-size="19" fill="#b7e89f" text-anchor="middle">需要時受訓商用止血帶</text><text x="55" y="365" font-size="20" fill="#e3e9e2" text-anchor="start">記錄位置、時間與反應</text><text x="55" y="415" font-size="18" fill="#ead68c" text-anchor="start">不自行鬆開已有效止血帶</text><path d="M440 110V440" stroke="#9ac8e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="485" y="135" font-size="22" fill="#c1b2ea" text-anchor="start">中風教學時間線</text><path d="M510 195V395" stroke="#c1b2ea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="510" cy="205" rx="7" ry="7" stroke="#9ac8e8" fill="#9ac8e8" stroke-width="3"/><text x="535" y="211" font-size="18" fill="#9ac8e8" text-anchor="start">08:00 最後正常</text><ellipse cx="510" cy="285" rx="7" ry="7" stroke="#ead68c" fill="#ead68c" stroke-width="3"/><text x="535" y="291" font-size="18" fill="#ead68c" text-anchor="start">08:40 發現：應立即119</text><ellipse cx="510" cy="365" rx="7" ry="7" stroke="#b7e89f" fill="#b7e89f" stroke-width="3"/><text x="535" y="371" font-size="18" fill="#b7e89f" text-anchor="start">08:50 才求援：延誤</text><text x="30" y="488" font-size="14" fill="#adbcaf" text-anchor="start">學習圖解不作即時分診；實際危急先安全求援，動作技能需合格實體訓練。</text></g></svg>