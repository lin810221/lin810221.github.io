<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv24-title cv24-desc"><title id="cv24-title">延遲的分母與計時邊界</title><desc id="cv24-desc">時間條按7毫秒讀取11毫秒前處理18毫秒模型6毫秒後處理8毫秒傳輸拆分，端到端共50毫秒。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">延遲的分母與計時邊界</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">示例數值總和為50毫秒，與任何實際模型或硬體的測量結果無關。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">同一請求的時間線：虛構毫秒示例</text><rect x="94" y="251" width="133" height="105" rx="3" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><text x="160.5" y="312" font-size="23" fill="#101919" text-anchor="middle">7 ms</text><text x="160.5" y="399" font-size="21" fill="#9ee3dc" text-anchor="middle">讀取</text><rect x="227" y="251" width="209" height="105" rx="3" stroke="#efcb8b" stroke-width="0" fill="#efcb8b"/><text x="331.5" y="312" font-size="23" fill="#101919" text-anchor="middle">11 ms</text><text x="331.5" y="399" font-size="21" fill="#efcb8b" text-anchor="middle">解碼／前處理</text><rect x="436" y="251" width="342" height="105" rx="3" stroke="#cbb7ef" stroke-width="0" fill="#cbb7ef"/><text x="607.0" y="312" font-size="23" fill="#101919" text-anchor="middle">18 ms</text><text x="607.0" y="399" font-size="21" fill="#cbb7ef" text-anchor="middle">模型</text><rect x="778" y="251" width="114" height="105" rx="3" stroke="#f2a89f" stroke-width="0" fill="#f2a89f"/><text x="835.0" y="312" font-size="23" fill="#101919" text-anchor="middle">6 ms</text><text x="835.0" y="399" font-size="21" fill="#f2a89f" text-anchor="middle">後處理</text><rect x="892" y="251" width="152" height="105" rx="3" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><text x="968.0" y="312" font-size="23" fill="#101919" text-anchor="middle">8 ms</text><text x="968.0" y="399" font-size="21" fill="#9ee3dc" text-anchor="middle">傳輸</text><path d="M95 451H1045" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="493" font-size="25" fill="#9ee3dc" text-anchor="middle">端到端 = 7 + 11 + 18 + 6 + 8 = 50 ms</text><text x="570" y="551" font-size="23" fill="#efcb8b" text-anchor="middle">只計模型18 ms，不能宣稱使用者請求只需18 ms。</text><text x="570" y="597" font-size="22" fill="#b5c7c0" text-anchor="middle">另報暖機、batch、裝置、p50／p95與throughput。</text><text x="50" y="676" font-size="23" fill="#b5c7c0" text-anchor="start">非同步GPU須在計時邊界同步；吞吐量與單一請求延遲是不同量。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>