<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv22-title cv22-desc"><title id="cv22-title">校準與正確率是不同的問題</title><desc id="cv22-desc">可靠度圖的四個點位在對角線下方表示過度自信，右側logits除以正溫度後argmax仍相同。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">校準與正確率是不同的問題</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">可靠度圖使用虛構分箱；對角線代表分箱信心與觀測正確率相符。</text><rect x="44" y="142" width="575" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">可靠度圖：分箱信心 vs 分箱正確率</text><rect x="665" y="142" width="491" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="687" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">溫度縮放保持類別排序</text><path d="M109 541 L543 541" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M532.04 536.11 L543 541 L532.04 545.89" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M109 541 L109 249" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M104.11 259.96 L109 249 L113.89 259.96" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="326.0" y="588" font-size="21" fill="#b5c7c0" text-anchor="middle">平均預測信心</text><text x="94" y="229" font-size="21" fill="#b5c7c0" text-anchor="start">實際正確率</text><path d="M109 541L543 249" stroke="#425952" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="217.5" cy="476.76" r="8" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><path d="M217.5 476.76V468.0" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="304.3" cy="450.48" r="8" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><path d="M304.3 450.48V409.6" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="391.1" cy="397.92" r="8" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><path d="M391.1 397.92V351.2" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="477.9" cy="371.64" r="8" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><path d="M477.9 371.64V292.8" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="442" y="328" font-size="23" fill="#efcb8b" text-anchor="middle">過度自信</text><text x="310" y="622" font-size="19" fill="#b5c7c0" text-anchor="middle">本圖為四個虛構分箱</text><text x="700" y="221" font-size="23" fill="#9ee3dc" text-anchor="start">原logits：[3, 1, 0]</text><text x="700" y="269" font-size="23" fill="#9ee3dc" text-anchor="start">T=2後：[1.5, 0.5, 0]</text><path d="M895 323 L895 368" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M899.89 357.04 L895 368 L890.11 357.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="714" y="388" width="392" height="68" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="910.0" y="430.0" font-size="25" fill="#efcb8b" text-anchor="middle">argmax仍是第0類</text><text x="701" y="514" font-size="22" fill="#e8efeb" text-anchor="start">同樣猜對，不代表信心相同。</text><text x="701" y="557" font-size="22" fill="#e8efeb" text-anchor="start">T由獨立驗證資料估計。</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">溫度T&gt;0時不改變argmax；校準誤差、分類正確率與拒答策略分別報告。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>