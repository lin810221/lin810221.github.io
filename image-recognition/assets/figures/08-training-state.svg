<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv08-title cv08-desc"><title id="cv08-title">從logits、損失到參數更新</title><desc id="cv08-desc">影像經CNN產生logits，與真實標籤形成損失，反向傳播回模型；下方區分train與eval加inference_mode。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">從logits、損失到參數更新</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖示單次訓練步；zero_grad、資料型別、損失輸入與驗證集邊界都必須明確。</text><rect x="44" y="142" width="1112" height="480" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">同一個模型，訓練與評估有不同狀態</text><rect x="80" y="243" width="220" height="67" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="190.0" y="284.5" font-size="22" fill="#9ee3dc" text-anchor="middle">批次影像</text><rect x="357" y="243" width="220" height="67" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="467.0" y="284.5" font-size="22" fill="#9ee3dc" text-anchor="middle">CNN logits</text><rect x="680" y="243" width="220" height="67" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="790.0" y="284.5" font-size="22" fill="#9ee3dc" text-anchor="middle">分類損失</text><path d="M310 276 L345 276" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M334.04 271.11 L345 276 L334.04 280.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M589 276 L668 276" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M657.04 271.11 L668 276 L657.04 280.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="938" y="243" width="176" height="67" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="1026.0" y="284.5" font-size="22" fill="#efcb8b" text-anchor="middle">真實標籤</text><path d="M928 276 L912 276" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M922.96 280.89 L912 276 L922.96 271.11" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M789 321V411H466V321" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M466 395 L466 325" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M461.11 335.96 L466 325 L470.89 335.96" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="449" font-size="24" fill="#cbb7ef" text-anchor="middle">backward → optimizer.step</text><text x="604" y="491" font-size="22" fill="#cbb7ef" text-anchor="middle">梯度更新模型參數</text><path d="M78 529H1112" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="572" font-size="22" fill="#9ee3dc" text-anchor="start">train()：訓練狀態</text><text x="482" y="572" font-size="22" fill="#efcb8b" text-anchor="start">eval() + inference_mode()：評估</text><text x="50" y="673" font-size="22" fill="#b5c7c0" text-anchor="start">eval()調整Dropout／BatchNorm；inference_mode()停用Autograd，兩者用途不同。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>