<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv09-title cv09-desc"><title id="cv09-title">遷移學習：凍結與微調的邊界</title><desc id="cv09-desc">一條淺中深backbone串接新分類頭，第一階段固定backbone，只更新分類頭，第二階段可解除深層凍結。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">遷移學習：凍結與微調的邊界</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">層的高低只示意深度；使用預訓練模型時另查權重來源、資料與授權。</text><rect x="44" y="142" width="1112" height="480" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">從固定特徵開始，再選擇性微調</text><rect x="85" y="243" width="145" height="140" rx="5" stroke="#425952" stroke-width="2" fill="#24403a"/><text x="157" y="425" font-size="24" fill="#9ee3dc" text-anchor="middle">淺層</text><text x="157" y="467" font-size="20" fill="#b5c7c0" text-anchor="middle">backbone</text><path d="M236 305 L275 305" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M264.04 300.11 L275 305 L264.04 309.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="285" y="201" width="145" height="182" rx="5" stroke="#425952" stroke-width="2" fill="#24403a"/><text x="357" y="425" font-size="24" fill="#9ee3dc" text-anchor="middle">中層</text><text x="357" y="467" font-size="20" fill="#b5c7c0" text-anchor="middle">backbone</text><path d="M436 305 L475 305" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M464.04 300.11 L475 305 L464.04 309.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="485" y="159" width="145" height="224" rx="5" stroke="#425952" stroke-width="2" fill="#24403a"/><text x="557" y="425" font-size="24" fill="#9ee3dc" text-anchor="middle">深層</text><text x="557" y="467" font-size="20" fill="#b5c7c0" text-anchor="middle">backbone</text><path d="M643 305 L734 305" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M723.04 300.11 L734 305 L723.04 309.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="755" y="223" width="279" height="165" rx="6" stroke="#efcb8b" stroke-width="2" fill="#3d3427"/><text x="894" y="285" font-size="28" fill="#efcb8b" text-anchor="middle">新分類頭</text><text x="894" y="334" font-size="23" fill="#efcb8b" text-anchor="middle">classes = K</text><path d="M83 503H633" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="357" y="546" font-size="23" fill="#9ee3dc" text-anchor="middle">第一階段：requires_grad=False</text><path d="M751 503H1037" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="894" y="546" font-size="23" fill="#efcb8b" text-anchor="middle">更新分類頭</text><text x="64" y="595" font-size="22" fill="#cbb7ef" text-anchor="start">第二階段：解除深層凍結，降低學習率；重新檢查optimizer與BatchNorm狀態。</text><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">凍結參數不自動凍結BatchNorm統計量；預訓練權重與其前處理必須成套記錄。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>