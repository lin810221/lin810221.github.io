<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv28-title cv28-desc"><title id="cv28-title">除錯路線：先證明資料與更新真的成立</title><desc id="cv28-desc">頂端詢問單一小批次能否過擬合，不能時檢查形狀標籤loss梯度，可以時檢查群組切分前處理與泛化切片。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">除錯路線：先證明資料與更新真的成立</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">小批次過擬合是診斷工具，不是高泛化性能的證明；隨機標籤等情境需另外解釋。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">訓練失敗時，依可檢查證據逐層排除</text><rect x="432" y="192" width="338" height="66" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="601.0" y="233.0" font-size="25" fill="#9ee3dc" text-anchor="middle">單一小批次能否過擬合？</text><path d="M435 273 L264 331" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275.95 332.11 L264 331 L272.80 322.85" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="321" y="299" font-size="22" fill="#efcb8b" text-anchor="start">不能</text><path d="M768 273 L941 331" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M932.17 322.88 L941 331 L929.06 332.16" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="866" y="299" font-size="22" fill="#cbb7ef" text-anchor="start">可以</text><rect x="82" y="348" width="365" height="70" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="264.5" y="391.0" font-size="24" fill="#efcb8b" text-anchor="middle">先檢查資料與訓練迴圈</text><rect x="754" y="348" width="365" height="70" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="936.5" y="391.0" font-size="24" fill="#cbb7ef" text-anchor="middle">檢查泛化與分布差異</text><text x="98" y="476" font-size="23" fill="#e8efeb" text-anchor="start">shape／dtype／標籤範圍</text><text x="98" y="517" font-size="23" fill="#e8efeb" text-anchor="start">同步增強／logits與loss</text><text x="98" y="558" font-size="23" fill="#e8efeb" text-anchor="start">梯度／optimizer／train狀態</text><text x="770" y="476" font-size="23" fill="#e8efeb" text-anchor="start">來源群組切分／近重複</text><text x="770" y="517" font-size="23" fill="#e8efeb" text-anchor="start">訓練與驗證前處理</text><text x="770" y="558" font-size="23" fill="#e8efeb" text-anchor="start">類別樣本數／切片錯誤</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">先保存最小失敗案例；每次只改一個可解釋變數，再用同一驗收方式比較。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>