<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv03-title cv03-desc"><title id="cv03-title">通道順序與色彩資訊</title><desc id="cv03-desc">左邊展示R240、G80、B40的像素及BGR重排；右邊用三種灰階強度說明單通道會失去色彩差異。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">通道順序與色彩資訊</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">這裡的灰階色塊是強度示意，並非RGB轉灰階的精密光度模型。</text><rect x="44" y="143" width="526" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="179" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">同一像素的通道順序</text><rect x="614" y="143" width="542" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="636" y="179" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">RGB 與灰階表示</text><rect x="81" y="230" width="132" height="112" rx="8" stroke="#f2a89f" stroke-width="2" fill="#f2a89f"/><text x="147" y="296" font-size="32" fill="#101919" text-anchor="middle">R</text><text x="147" y="390" font-size="28" fill="#f2a89f" text-anchor="middle">240</text><rect x="234" y="230" width="132" height="112" rx="8" stroke="#9ee3dc" stroke-width="2" fill="#9ee3dc"/><text x="300" y="296" font-size="32" fill="#101919" text-anchor="middle">G</text><text x="300" y="390" font-size="28" fill="#9ee3dc" text-anchor="middle">80</text><rect x="387" y="230" width="132" height="112" rx="8" stroke="#cbb7ef" stroke-width="2" fill="#cbb7ef"/><text x="453" y="296" font-size="32" fill="#101919" text-anchor="middle">B</text><text x="453" y="390" font-size="28" fill="#cbb7ef" text-anchor="middle">40</text><text x="306" y="211" font-size="24" fill="#9ee3dc" text-anchor="middle">RGB = [240, 80, 40]</text><path d="M147 439H453" stroke="#425952" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M148 465 L453 465" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M442.04 460.11 L453 465 L442.04 469.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="306" y="513" font-size="24" fill="#efcb8b" text-anchor="middle">BGR = [40, 80, 240]</text><text x="306" y="585" font-size="21" fill="#b5c7c0" text-anchor="middle">交換的是排列；不是讓照片變藍。</text><rect x="652" y="241" width="128" height="128" rx="5" stroke="#425952" stroke-width="2" fill="#222222"/><text x="716" y="408" font-size="23" fill="#b5c7c0" text-anchor="middle">0</text><rect x="803" y="241" width="128" height="128" rx="5" stroke="#425952" stroke-width="2" fill="#777777"/><text x="867" y="408" font-size="23" fill="#b5c7c0" text-anchor="middle">128</text><rect x="954" y="241" width="128" height="128" rx="5" stroke="#425952" stroke-width="2" fill="#dddddd"/><text x="1018" y="408" font-size="23" fill="#b5c7c0" text-anchor="middle">255</text><text x="886" y="214" font-size="24" fill="#efcb8b" text-anchor="middle">灰階只有一個強度通道</text><text x="645" y="474" font-size="22" fill="#e8efeb" text-anchor="start">彩色轉灰階會損失色彩差異。</text><text x="645" y="516" font-size="22" fill="#e8efeb" text-anchor="start">灰階複製成三通道不會恢復資訊。</text><text x="645" y="558" font-size="22" fill="#e8efeb" text-anchor="start">色彩空間轉換要記錄其定義。</text><text x="52" y="675" font-size="21" fill="#b5c7c0" text-anchor="start">OpenCV 的常見 BGR 輸入與 RGB 教材必須明確銜接；不可只憑畫面看似正常。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>