<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv07-title cv07-desc"><title id="cv07-title">卷積層：局部運算與參數共享</title><desc id="cv07-desc">左側三乘三輸入與邊緣kernel逐項相乘得到負二，右側三乘三視窗在五乘五影像上滑動得到三乘三輸出。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">卷積層：局部運算與參數共享</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖中只有一個輸入／輸出通道；實際Conv2d還會跨輸入通道累加並加bias。</text><rect x="44" y="142" width="514" height="484" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">3 × 3 感受野：逐項乘、再加總</text><rect x="612" y="142" width="544" height="484" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="634" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">共享 kernel 滑動產生特徵圖</text><rect x="78" y="236" width="53" height="53" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="104.5" y="269.5" font-size="20" fill="#e8efeb" text-anchor="middle">1</text><rect x="131" y="236" width="53" height="53" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="157.5" y="269.5" font-size="20" fill="#e8efeb" text-anchor="middle">0</text><rect x="184" y="236" width="53" height="53" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="210.5" y="269.5" font-size="20" fill="#e8efeb" text-anchor="middle">2</text><rect x="78" y="289" width="53" height="53" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="104.5" y="322.5" font-size="20" fill="#e8efeb" text-anchor="middle">2</text><rect x="131" y="289" width="53" height="53" rx="0" stroke="#425952" stroke-width="1" fill="#172524"/><text x="157.5" y="322.5" font-size="20" fill="#e8efeb" text-anchor="middle">1</text><rect x="184" y="289" width="53" height="53" rx="0" 