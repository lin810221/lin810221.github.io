<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv10-title cv10-desc"><title id="cv10-title">類別不平衡與決策閾值</title><desc id="cv10-desc">兩種樣本分數分布與可移動閾值，旁側指出提高閾值會減少陽性預測與Recall，Precision不保證單調。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">類別不平衡與決策閾值</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">平滑分布為原創概念示意，非實際估計；固定模型下移動閾值不會重新訓練模型。</text><rect x="44" y="142" width="566" height="486" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">少數類的分數分布：示意</text><rect x="652" y="142" width="504" height="486" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="674" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">移動決策閾值</text><path d="M93 502 L542 502" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M531.04 497.11 L542 502 L531.04 506.89" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M93 502 L93 242" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M88.11 252.96 L93 242 L97.89 252.96" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="317.5" y="549" font-size="21" fill="#b5c7c0" text-anchor="middle">模型分數</text><text x="78" y="222" font-size="21" fill="#b5c7c0" text-anchor="start">樣本數</text><path d="M99 500C132 468 135 299 210 289C275 299 288 464 343 500" stroke="#9ee3dc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M199 500C286 497 311 372 391 362C467 364 490 454 532 500" stroke="#efcb8b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 223V502" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="330" y="202" font-size="24" fill="#cbb7ef" text-anchor="middle">閾值 t</text><rect x="113" y="559" width="18" height="18" rx="2" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><text x="143" y="575" font-size="20" fill="#b5c7c0" text-anchor="start">陰性類</text><rect x="113" y="593" width="18" height="18" rx="2" stroke="#efcb8b" stroke-width="0" fill="#efcb8b"/><text x="143" y="609" font-size="20" fill="#b5c7c0" text-anchor="start">陽性少數類</text><path d="M752 289 L1027 289" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1016.04 284.11 L1027 289 L1016.04 293.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="890" y="251" font-size="27" fill="#efcb8b" text-anchor="middle">閾值提高</text><text x="692" y="367" font-size="23" fill="#e8efeb" text-anchor="start">預測為陽性的樣本通常變少</text><text x="692" y="412" font-size="23" fill="#e8efeb" text-anchor="start">Recall 不會提高</text><text x="692" y="457" font-size="23" fill="#e8efeb" text-anchor="start">Precision 未必單調提高</text><path d="M692 481H1118" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="692" y="532" font-size="21" fill="#cbb7ef" text-anchor="start">類別權重／重抽樣：改變學習</text><text x="692" y="571" font-size="21" fill="#cbb7ef" text-anchor="start">閾值選擇：改變決策</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">只用驗證資料選閾值；報告少數類Recall、Precision及錯誤成本，勿只看Accuracy。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>