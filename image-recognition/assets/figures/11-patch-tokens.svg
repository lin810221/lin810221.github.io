<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv11-title cv11-desc"><title id="cv11-title">ViT：從二維影像到token序列</title><desc id="cv11-desc">十六個編號patch經共享線性投影變成token列，列中包含可選CLS及位置資訊。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">ViT：從二維影像到token序列</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">每個格子是一個patch而非單一像素；示例假設H、W都能被patch邊長P整除。</text><rect x="44" y="142" width="1112" height="486" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">把影像切成patch，再投影成token序列</text><rect x="86" y="225" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="144" y="225" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="202" y="225" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="260" y="225" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="86" y="283" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="144" y="283" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="202" y="283" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="260" y="283" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="86" y="341" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="144" y="341" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="202" y="341" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="260" y="341" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="86" y="399" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="144" y="399" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="202" y="399" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><rect x="260" y="399" width="58" height="58" rx="0" stroke="#9ee3dc" stroke-width="1" fill="#172524"/><text x="115.0" y="261.0" font-size="21" fill="#9ee3dc" text-anchor="middle">0</text><text x="173.0" y="261.0" font-size="21" fill="#9ee3dc" text-anchor="middle">1</text><text x="231.0" y="261.0" font-size="21" fill="#9ee3dc" text-anchor="middle">2</text><text x="289.0" y="261.0" font-size="21" fill="#9ee3dc" text-anchor="middle">3</text><text x="115.0" y="319.0" font-size="21" fill="#9ee3dc" text-anchor="middle">4</text><text x="173.0" y="319.0" font-size="21" fill="#9ee3dc" text-anchor="middle">5</text><text x="231.0" y="319.0" font-size="21" fill="#9ee3dc" text-anchor="middle">6</text><text x="289.0" y="319.0" font-size="21" fill="#9ee3dc" text-anchor="middle">7</text><text x="115.0" y="377.0" font-size="21" fill="#9ee3dc" text-anchor="middle">8</text><text x="173.0" y="377.0" font-size="21" fill="#9ee3dc" text-anchor="middle">9</text><text x="231.0" y="377.0" font-size="21" fill="#9ee3dc" text-anchor="middle">10</text><text x="289.0" y="377.0" font-size="21" fill="#9ee3dc" text-anchor="middle">11</text><text x="115.0" y="435.0" font-size="21" fill="#9ee3dc" text-anchor="middle">12</text><text x="173.0" y="435.0" font-size="21" fill="#9ee3dc" text-anchor="middle">13</text><text x="231.0" y="435.0" font-size="21" fill="#9ee3dc" text-anchor="middle">14</text><text x="289.0" y="435.0" font-size="21" fill="#9ee3dc" text-anchor="middle">15</text><path d="M344 340 L454 340" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M443.04 335.11 L454 340 L443.04 344.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="476" y="291" width="237" height="93" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="594.5" y="345.5" font-size="25" fill="#efcb8b" text-anchor="middle">共享線性投影</text><path d="M729 340 L793 340" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M782.04 335.11 L793 340 L782.04 344.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="820" y="235" width="38" height="209" rx="4" stroke="#cbb7ef" stroke-width="2" fill="#3b3349"/><text x="839" y="480" font-size="19" fill="#cbb7ef" text-anchor="middle">CLS</text><rect x="871" y="235" width="38" height="209" rx="4" stroke="#cbb7ef" stroke-width="2" fill="#3b3349"/><text x="890" y="480" font-size="19" fill="#cbb7ef" text-anchor="middle">0</text><rect x="922" y="235" width="38" height="209" rx="4" stroke="#cbb7ef" stroke-width="2" fill="#3b3349"/><text x="941" y="480" font-size="19" fill="#cbb7ef" text-anchor="middle">1</text><rect x="973" y="235" width="38" height="209" rx="4" stroke="#cbb7ef" stroke-width="2" fill="#3b3349"/><text x="992" y="480" font-size="19" fill="#cbb7ef" text-anchor="middle">2</text><rect x="1024" y="235" width="38" height="209" rx="4" stroke="#cbb7ef" stroke-width="2" fill="#3b3349"/><text x="1043" y="480" font-size="19" fill="#cbb7ef" text-anchor="middle">3</text><text x="955" y="528" font-size="23" fill="#cbb7ef" text-anchor="middle">位置資訊＋token特徵</text><text x="86" y="540" font-size="24" fill="#9ee3dc" text-anchor="start">N = (H/P) × (W/P)</text><text x="86" y="583" font-size="22" fill="#e8efeb" text-anchor="start">本例4×4 patch → 16個影像token</text><text x="51" y="677" font-size="22" fill="#b5c7c0" text-anchor="start">patch大小控制序列長度；此圖只畫出部分token，CLS是否使用依架構而定。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>