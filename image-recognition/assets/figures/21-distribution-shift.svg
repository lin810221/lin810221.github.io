<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv21-title cv21-desc"><title id="cv21-title">分布偏移與切片評估</title><desc id="cv21-desc">左側明亮固定視角的人物幾何圖與右側低光斜角圖對照，下方指出需依相機光線距離切片並檢查樣本數。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">分布偏移與切片評估</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">照片為原創幾何示意；光線、角度、來源改變不一定產生相同程度的性能變化。</text><rect x="44" y="142" width="534" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">訓練分布：明亮、固定相機</text><rect x="622" y="142" width="534" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="644" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">部署分布：低光、不同角度</text><rect x="81" y="232" width="128" height="151" rx="5" stroke="#425952" stroke-width="2" fill="#9db1a1"/><circle cx="145" cy="290" r="29" stroke="#9ee3dc" stroke-width="3" fill="#466e5b"/><rect x="119" y="319" width="52" height="40" rx="4" stroke="#9ee3dc" stroke-width="2" fill="#466e5b"/><rect x="659" y="232" width="128" height="151" rx="5" stroke="#425952" stroke-width="2" fill="#27332f"/><path d="M691 344L704 267L746 280L760 350Z" stroke="#cbb7ef" stroke-width="3" fill="#314b3f" stroke-linecap="round" stroke-linejoin="round"/><rect x="238" y="232" width="128" height="151" rx="5" stroke="#425952" stroke-width="2" fill="#9db1a1"/><circle cx="302" cy="290" r="29" stroke="#9ee3dc" stroke-width="3" fill="#466e5b"/><rect x="276" y="319" width="52" height="40" rx="4" stroke="#9ee3dc" stroke-width="2" fill="#466e5b"/><rect x="816" y="232" width="128" height="151" rx="5" stroke="#425952" stroke-width="2" fill="#15211e"/><path d="M848 344L861 267L903 280L917 350Z" stroke="#cbb7ef" stroke-width="3" fill="#314b3f" stroke-linecap="round" stroke-linejoin="round"/><rect x="395" y="232" width="128" height="151" rx="5" stroke="#425952" stroke-width="2" fill="#9db1a1"/><circle cx="459" cy="290" r="29" stroke="#9ee3dc" stroke-width="3" fill="#466e5b"/><rect x="433" y="319" width="52" height="40" rx="4" stroke="#9ee3dc" stroke-width="2" fill="#466e5b"/><rect x="973" y="232" width="128" height="151" rx="5" stroke="#425952" stroke-width="2" fill="#3b3731"/><path d="M1005 344L1018 267L1060 280L1074 350Z" stroke="#cbb7ef" stroke-width="3" fill="#314b3f" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="450" font-size="22" fill="#9ee3dc" text-anchor="middle">影像來源、光線、背景較一致</text><text x="887" y="450" font-size="22" fill="#efcb8b" text-anchor="middle">外觀改變；標籤語意也要確認</text><text x="76" y="515" font-size="22" fill="#e8efeb" text-anchor="start">整體平均良好，仍可能在夜間失敗。</text><text x="76" y="557" font-size="22" fill="#e8efeb" text-anchor="start">依相機、光線、距離與族群切片。</text><text x="655" y="515" font-size="22" fill="#e8efeb" text-anchor="start">先量測切片樣本數與不確定性。</text><text x="655" y="557" font-size="22" fill="#e8efeb" text-anchor="start">不能只用單一漂移分數宣告失效。</text><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">資料漂移 ≠ 必然性能下降；需要有標籤的追蹤評估、錯誤案例與應用成本證據。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>