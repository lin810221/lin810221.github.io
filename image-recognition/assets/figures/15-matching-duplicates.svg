<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv15-title cv15-desc"><title id="cv15-title">偵測評估：一對一配對與重複框</title><desc id="cv15-desc">一個真值框旁有兩個重疊預測和一個遠離預測，按分數先配A為TP、B因重複為FP、C無配對為FP。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">偵測評估：一對一配對與重複框</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">固定IoU閾值0.50、單一類別；完整COCO還有ignore、crowd、面積與maxDets等規則。</text><rect x="44" y="142" width="552" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">同一類別、同一張影像</text><rect x="644" y="142" width="512" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="666" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">依分數排序，真值只能配一次</text><rect x="97" y="239" width="210" height="198" rx="0" stroke="#9ee3dc" stroke-width="4" fill="#24473d"/><rect x="117" y="258" width="205" height="185" rx="0" stroke="#efcb8b" stroke-width="3" fill="none"/><rect x="134" y="278" width="208" height="177" rx="0" stroke="#cbb7ef" stroke-width="3" fill="none"/><rect x="380" y="400" width="110" height="107" rx="0" stroke="#f2a89f" stroke-width="3" fill="none"/><rect x="90" y="519" width="18" height="18" rx="2" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><text x="120" y="535" font-size="20" fill="#b5c7c0" text-anchor="start">真值GT</text><rect x="90" y="553" width="18" height="18" rx="2" stroke="#efcb8b" stroke-width="0" fill="#efcb8b"/><text x="120" y="569" font-size="20" fill="#b5c7c0" text-anchor="start">預測A / B / C</text><rect x="677" y="226" width="445" height="79" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="700" y="274" font-size="22" fill="#efcb8b" text-anchor="start">A   0.95   IoU>=0.50   TP</text><rect x="677" y="346" width="445" height="79" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="700" y="394" font-size="22" fill="#cbb7ef" text-anchor="start">B   0.90   重複框       FP</text><rect x="677" y="466" width="445" height="79" rx="12" stroke="#f2a89f" stroke-width="2" fill="#172524"/><text x="700" y="514" font-size="22" fill="#f2a89f" text-anchor="start">C   0.60   無配對       FP</text><path d="M796 309V333" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M796 429V453" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">此為無crowd／ignore的教學例。IoU達標仍可能因真值已配對而成為重複偵測FP。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>