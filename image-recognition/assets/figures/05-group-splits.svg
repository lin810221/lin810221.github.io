<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv05-title cv05-desc"><title id="cv05-title">影像資料的切分邊界</title><desc id="cv05-desc">三個來源群組各有三張近似影像，分別完整進入訓練驗證測試，紅色虛線指出同來源跨組的洩漏。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">影像資料的切分邊界</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖中的A、B、C是來源群組示例；真實切分還需兼顧類別、時間與應用情境。</text><rect x="44" y="142" width="1112" height="485" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">切分單位：先分來源群組，再產生增強樣本</text><rect x="87" y="205" width="265" height="53" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="219.5" y="239.5" font-size="22" fill="#9ee3dc" text-anchor="middle">病人／商品 A</text><rect x="105" y="297" width="58" height="76" rx="5" stroke="#9ee3dc" stroke-width="2" fill="#273832"/><text x="134" y="344" font-size="23" fill="#9ee3dc" text-anchor="middle">1</text><rect x="178" y="297" width="58" height="76" rx="5" stroke="#9ee3dc" stroke-width="2" fill="#273832"/><text x="207" y="344" font-size="23" fill="#9ee3dc" text-anchor="middle">2</text><rect x="251" y="297" width="58" height="76" rx="5" stroke="#9ee3dc" stroke-width="2" fill="#273832"/><text x="280" y="344" font-size="23" fill="#9ee3dc" text-anchor="middle">3</text><path d="M219 385 L219 455" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M223.89 444.04 L219 455 L214.11 444.04" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="87" y="470" width="265" height="57" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="219.5" y="506.5" font-size="22" fill="#9ee3dc" text-anchor="middle">訓練組</text><rect x="457" y="205" width="265" height="53" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="589.5" y="239.5" font-size="22" fill="#efcb8b" text-anchor="middle">病人／商品 B</text><rect x="475" y="297" width="58" height="76" rx="5" stroke="#efcb8b" stroke-width="2" fill="#273832"/><text x="504" y="344" font-size="23" fill="#efcb8b" text-anchor="middle">1</text><rect x="548" y="297" width="58" height="76" rx="5" stroke="#efcb8b" stroke-width="2" fill="#273832"/><text x="577" y="344" font-size="23" fill="#efcb8b" text-anchor="middle">2</text><rect x="621" y="297" width="58" height="76" rx="5" stroke="#efcb8b" stroke-width="2" fill="#273832"/><text x="650" y="344" font-size="23" fill="#efcb8b" text-anchor="middle">3</text><path d="M589 385 L589 455" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M593.89 444.04 L589 455 L584.11 444.04" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="457" y="470" width="265" height="57" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="589.5" y="506.5" font-size="22" fill="#efcb8b" text-anchor="middle">驗證組</text><rect x="827" y="205" width="265" height="53" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="959.5" y="239.5" font-size="22" fill="#cbb7ef" text-anchor="middle">病人／商品 C</text><rect x="845" y="297" width="58" height="76" rx="5" stroke="#cbb7ef" stroke-width="2" fill="#273832"/><text x="874" y="344" font-size="23" fill="#cbb7ef" text-anchor="middle">1</text><rect x="918" y="297" width="58" height="76" rx="5" stroke="#cbb7ef" stroke-width="2" fill="#273832"/><text x="947" y="344" font-size="23" fill="#cbb7ef" text-anchor="middle">2</text><rect x="991" y="297" width="58" height="76" rx="5" stroke="#cbb7ef" stroke-width="2" fill="#273832"/><text x="1020" y="344" font-size="23" fill="#cbb7ef" text-anchor="middle">3</text><path d="M959 385 L959 455" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M963.89 444.04 L959 455 L954.11 444.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="827" y="470" width="265" height="57" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="959.5" y="506.5" font-size="22" fill="#cbb7ef" text-anchor="middle">測試組</text><path d="M178 548L548 568" stroke="#f2a89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M537 545L560 568L537 591" stroke="#f2a89f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="612" font-size="23" fill="#f2a89f" text-anchor="start">禁止：同一來源的不同照片跨到另一組</text><text x="54" y="677" font-size="22" fill="#b5c7c0" text-anchor="start">先保存 group_id 與 split，再對訓練組增強；近重複與影片相鄰影格也可能洩漏。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>