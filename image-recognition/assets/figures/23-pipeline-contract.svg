<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv23-title cv23-desc"><title id="cv23-title">部署契約：前處理、模型與後處理一起保存</title><desc id="cv23-desc">前處理模型後處理三段依序串接，下方manifest包含輸入契約類別順序正規化座標版本校驗值測試樣本。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">部署契約：前處理、模型與後處理一起保存</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">方塊表示處理順序；特定模型可能把部分前後處理納入計算圖，需在manifest註明。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">交付的是完整管線，不只是一個權重檔</text><rect x="78" y="227" width="307" height="164" rx="8" stroke="#9ee3dc" stroke-width="2" fill="#20312c"/><text x="231" y="278" font-size="29" fill="#9ee3dc" text-anchor="middle">前處理</text><text x="231" y="337" font-size="21" fill="#e8efeb" text-anchor="middle">通道／尺寸／值域</text><path d="M394 308 L421 308" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M410.04 303.11 L421 308 L410.04 312.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="431" y="227" width="307" height="164" rx="8" stroke="#efcb8b" stroke-width="2" fill="#20312c"/><text x="584" y="278" font-size="29" fill="#efcb8b" text-anchor="middle">模型</text><text x="584" y="337" font-size="21" fill="#e8efeb" text-anchor="middle">架構／權重／類別</text><path d="M747 308 L774 308" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M763.04 303.11 L774 308 L763.04 312.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="784" y="227" width="307" height="164" rx="8" stroke="#cbb7ef" stroke-width="2" fill="#20312c"/><text x="937" y="278" font-size="29" fill="#cbb7ef" text-anchor="middle">後處理</text><text x="937" y="337" font-size="21" fill="#e8efeb" text-anchor="middle">閾值／NMS／反投影</text><path d="M97 440H1093V573H97Z" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="482" font-size="24" fill="#9ee3dc" text-anchor="start">artifact manifest</text><text x="122" y="529" font-size="23" fill="#e8efeb" text-anchor="start">版本、輸入契約、classes順序、標準化、座標、校驗值、測試樣本</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">同一張輸入圖：訓練端、Python推論端與部署引擎必須用可比較的前後處理。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>