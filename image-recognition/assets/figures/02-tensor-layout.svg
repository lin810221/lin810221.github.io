<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv02-title cv02-desc"><title id="cv02-title">HWC 與 CHW：軸順序和數值範圍是兩件事</title><desc id="cv02-desc">三色通道由HWC影像陣列重排成CHW三個平面，並分開標註uint8和float32範圍，批次後為NCHW。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">HWC 與 CHW：軸順序和數值範圍是兩件事</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖中縮小格數只是示意；通道軸不是寬度，批次軸不是第四種顏色。</text><rect x="44" y="142" width="510" height="480" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">影像陣列 H × W × C</text><rect x="622" y="142" width="534" height="480" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="644" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">模型張量 C × H × W</text><rect x="108" y="234" width="21" height="42" rx="2" stroke="#f2a89f" stroke-width="0" fill="#f2a89f"/><rect x="131" y="234" width="21" height="42" rx="2" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><rect x="154" y="234" width="21" height="42" rx="2" stroke="#cbb7ef" stroke-width="0" fill="#cbb7ef"/><rect x="191" y="234" width="21" height="42" rx="2" stroke="#f2a89f" stroke-width="0" fill="#f2a89f"/><rect x="214" y="234" width="21" height="42" rx="2" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><rect x="237" y="234" width="21" height="42" rx="2" stroke="#cbb7ef" stroke-width="0" fill="#cbb7ef"/><rect x="274" y="234" width="21" height="42" rx="2" stroke="#f2a89f" stroke-width="0" fill="#f2a89f"/><rect x="297" y="234" width="21" height="42" rx="2" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><rect x="320" y="234" width="21" height="42" rx="2" stroke="#cbb7ef" stroke-width="0" fill="#cbb7ef"/><rect x="357" y="234" width="21" height="42" rx="2" stroke=