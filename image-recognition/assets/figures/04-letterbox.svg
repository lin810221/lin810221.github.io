<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv04-title cv04-desc"><title id="cv04-title">等比例縮放、補邊與框座標</title><desc id="cv04-desc">左圖400乘200的影像含100,50到260,140框，右圖縮放0.75並上下補75後新框75,112.5到195,180。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">等比例縮放、補邊與框座標</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">本例把400×200縮進300×300；保留寬高比並在上、下各補75像素。</text><rect x="44" y="142" width="482" height="480" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">原圖：W=400、H=200</text><rect x="578" y="142" width="578" height="480" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="600" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">目標：300 × 300</text><rect x="85" y="250" width="400" height="200" rx="0" stroke="#9ee3dc" stroke-width="2" fill="#243a34"/><rect x="185" y="300" width="160" height="90" rx="0" stroke="#efcb8b" stroke-width="3" fill="none"/><text x="100" y="487" font-size="22" fill="#e8efeb" text-anchor="start">框：[100, 50, 260, 140]</text><text x="100" y="532" font-size="21" fill="#b5c7c0" text-anchor="start">XYXY 使用影像邊界座標</text><path d="M534 360 L565 360" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M554.04 355.11 L565 360 L554.04 364.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="704" y="210" width="300" height="300" rx="0" stroke="#425952" stroke-width="2" fill="#34343d"/><rect x="704" y="285" width="300" height="150" rx="0" stroke="#9ee3dc" stroke-width="2" fill="#243a34"/><rect x="779" y="322.5" width="120" height="67.5" rx="0" stroke="#efcb8b" stroke-width="3" fill="none"/><text x="1019" y="260" font-size="21" fill="#cbb7ef" text-anchor="start">上補 75</text><text x="1019" y="482" font-size="21" fill="#cbb7ef" text-anchor="start">下補 75</text><text x="614" y="560" font-size="23" fill="#efcb8b" text-anchor="start">縮放 r=0.75；dx=0、dy=75</text><text x="614" y="596" font-size="22" fill="#e8efeb" text-anchor="start">新框：[75, 112.5, 195, 180]</text><text x="50" y="666" font-size="23" fill="#b5c7c0" text-anchor="start">x′=r·x+dx；y′=r·y+dy。反投影必須保存縮放率與補邊位移。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>