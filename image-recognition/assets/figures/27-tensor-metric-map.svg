<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv27-title cv27-desc"><title id="cv27-title">張量、損失與評估指標的對照</title><desc id="cv27-desc">分類偵測分割三欄分別對應logits boxes或像素張量，並列出相關損失和F1 AP IoU Dice評估路徑。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">張量、損失與評估指標的對照</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">M表示影像內物件數；K為類別數。多標籤分類與實例mask另有輸出契約。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">先辨識資料物件，再選對數學運算</text><rect x="76" y="217" width="304" height="339" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="228" y="265" font-size="28" fill="#9ee3dc" text-anchor="middle">分類</text><text x="96" y="337" font-size="21" fill="#e8efeb" text-anchor="start">logits：N × K</text><text x="96" y="408" font-size="21" fill="#e8efeb" text-anchor="start">Cross entropy</text><text x="96" y="479" font-size="21" fill="#e8efeb" text-anchor="start">混淆矩陣 → F1</text><rect x="446" y="217" width="304" height="339" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="598" y="265" font-size="28" fill="#efcb8b" text-anchor="middle">偵測</text><text x="466" y="337" font-size="21" fill="#e8efeb" text-anchor="start">boxes：M × 4</text><text x="466" y="408" font-size="21" fill="#e8efeb" text-anchor="start">交集／聯集 → IoU</text><text x="466" y="479" font-size="21" fill="#e8efeb" text-anchor="start">分數排序 → PR／AP</text><rect x="816" y="217" width="304" height="339" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="968" y="265" font-size="28" fill="#cbb7ef" text-anchor="middle">分割</text><text x="836" y="337" font-size="21" fill="#e8efeb" text-anchor="start">logits：N×K×H×W</text><text x="836" y="408" font-size="21" fill="#e8efeb" text-anchor="start">逐像素損失</text><text x="836" y="479" font-size="21" fill="#e8efeb" text-anchor="start">像素交集 → IoU／Dice</text><text x="600" y="600" font-size="21" fill="#b5c7c0" text-anchor="middle">同名IoU：框用幾何面積；mask用像素集合。聚合分母與空類別規則也要一致。</text><text x="50" y="676" font-size="23" fill="#b5c7c0" text-anchor="start">看見一個指標時，先問：它對哪個物件、哪個單位、哪個集合計算？</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>