<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv17-title cv17-desc"><title id="cv17-title">像素標籤與物件身分</title><desc id="cv17-desc">三個相同雙人物場景分別顯示同類同色語意分割、人物各色實例分割和帶背景區域的全景分割。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">像素標籤與物件身分</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">顏色只是可視化ID；訓練目標通常是整數標籤或二元mask，並非這張彩色渲染圖。</text><rect x="44" y="143" width="356" height="485" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="179" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">語意分割</text><rect x="79" y="240" width="286" height="205" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><rect x="80" y="373.25" width="284" height="70.75" rx="0" stroke="#425952" stroke-width="0" fill="#4f485f"/><circle cx="173.38" cy="328.15" r="30.75" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><rect x="149.805" y="356.84999999999997" width="47.15" height="47.15" rx="4" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><circle cx="276.34" cy="330.2" r="30.75" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><rect x="252.765" y="358.9" width="47.15" height="47.15" rx="4" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="70" y="510" font-size="21" fill="#e8efeb" text-anchor="start">同類人物共用類別ID</text><text x="70" y="551" font-size="21" fill="#e8efeb" text-anchor="start">每個像素都有類別</text><rect x="422" y="143" width="356" height="485" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="444" y="179" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">實例分割</text><rect x="457" y="240" width="286" height="205" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><path d="M458 373.25 H742" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="551.38" cy="328.15" r="30.75" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><rect x="527.805" y="356.84999999999997" width="47.15" height="47.15" rx="4" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="551.38" y="434.75" font-size="20" fill="#9ee3dc" text-anchor="middle">A</text><circle cx="654.3399999999999" cy="330.2" r="30.75" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><rect x="630.7649999999999" y="358.9" width="47.15" height="47.15" rx="4" stroke="#efcb8b" stroke-width="1" fill="#efcb8b"/><text x="654.3399999999999" y="434.75" font-size="20" fill="#efcb8b" text-anchor="middle">B</text><text x="448" y="510" font-size="21" fill="#e8efeb" text-anchor="start">人物A、B各有mask</text><text x="448" y="551" font-size="21" fill="#e8efeb" text-anchor="start">重點是分開個體</text><rect x="800" y="143" width="356" height="485" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="822" y="179" font-size="25" fill="#cbb7ef" text-anchor="start" font-weight="600">全景分割</text><rect x="835" y="240" width="286" height="205" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><path d="M836 373.25 H1120" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="929.38" cy="328.15" r="30.75" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><rect x="905.805" y="356.84999999999997" width="47.15" height="47.15" rx="4" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="929.38" y="434.75" font-size="20" fill="#9ee3dc" text-anchor="middle">A</text><circle cx="1032.34" cy="330.2" r="30.75" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><rect x="1008.7649999999999" y="358.9" width="47.15" height="47.15" rx="4" stroke="#efcb8b" stroke-width="1" fill="#efcb8b"/><text x="1032.34" y="434.75" font-size="20" fill="#efcb8b" text-anchor="middle">B</text><rect x="836" y="420.4" width="284" height="21.55" rx="0" stroke="#cbb7ef" stroke-width="0" fill="#4f485f"/><text x="826" y="510" font-size="21" fill="#e8efeb" text-anchor="start">類別＋個體ID共同表示</text><text x="826" y="551" font-size="21" fill="#e8efeb" text-anchor="start">同時處理thing與stuff</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">背景是否為類別、ignore_index是什麼、重疊mask怎麼處理，都屬於資料與評估契約。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>