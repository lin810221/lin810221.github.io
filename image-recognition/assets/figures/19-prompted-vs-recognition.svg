<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv19-title cv19-desc"><title id="cv19-title">分得出區域，不代表已認得類別</title><desc id="cv19-desc">左側在人物上加點提示產生區域mask，右側兩個實例已分開但類別仍是另一個需要驗證的輸出。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">分得出區域，不代表已認得類別</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">原創雙人物示意；提示點、mask與類別分數具有不同意義。</text><rect x="44" y="142" width="532" height="491" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">提示式分割：指示「哪個區域」</text><rect x="624" y="142" width="532" height="491" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="646" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">辨識：判斷「屬於哪一類」</text><rect x="105" y="249" width="410" height="230" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><path d="M106 398.5 H514" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240.3" cy="347.9" r="34.5" stroke="#79948b" stroke-width="3" fill="#79948b"/><rect x="213.85000000000002" y="380.09999999999997" width="52.900000000000006" height="52.900000000000006" rx="4" stroke="#79948b" stroke-width="1" fill="#79948b"/><circle cx="387.9" cy="350.2" r="34.5" stroke="#79948b" stroke-width="3" fill="#79948b"/><rect x="361.45" y="382.4" width="52.900000000000006" height="52.900000000000006" rx="4" stroke="#79948b" stroke-width="1" fill="#79948b"/><circle cx="241" cy="348" r="13" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><text x="122" y="213" font-size="23" fill="#9ee3dc" text-anchor="start">點提示 ＋／- 或框提示</text><path d="M324 498 L324 544" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M328.89 533.04 L324 544 L319.11 533.04" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="137" y="560" width="373" height="50" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="323.5" y="593.0" font-size="23" fill="#9ee3dc" text-anchor="middle">輸出：候選物件mask</text><rect x="685" y="249" width="410" height="230" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><path d="M686 398.5 H1094" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="820.3" cy="347.9" r="34.5" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><rect x="793.8499999999999" y="380.09999999999997" width="52.900000000000006" height="52.900000000000006" rx="4" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="820.3" y="467.5" font-size="20" fill="#9ee3dc" text-anchor="middle">A</text><circle cx="967.9" cy="350.2" r="34.5" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><rect x="941.4499999999999" y="382.4" width="52.900000000000006" height="52.900000000000006" rx="4" stroke="#efcb8b" stroke-width="1" fill="#efcb8b"/><text x="967.9" y="467.5" font-size="20" fill="#efcb8b" text-anchor="middle">B</text><rect x="750" y="327" width="271" height="60" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="885.5" y="365.0" font-size="23" fill="#efcb8b" text-anchor="middle">類別？ 需要另判斷</text><text x="673" y="213" font-size="21" fill="#efcb8b" text-anchor="start">區域已分出，身分仍需任務定義</text><text x="661" y="538" font-size="21" fill="#b5c7c0" text-anchor="start">mask品質分數 ≠ 語意類別機率</text><text x="661" y="580" font-size="21" fill="#b5c7c0" text-anchor="start">類別詞表／文字提示有獨立限制</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">SAM類模型主要提供可提示mask；開放詞彙偵測與圖文匹配另有模型、詞彙及評估設計。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>