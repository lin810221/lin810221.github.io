<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv14-title cv14-desc"><title id="cv14-title">偵測器的設計家族</title><desc id="cv14-desc">三列並排流程分別展示候選區域兩階段、密集位置單階段與object queries集合預測，最後的重複處理方式不同。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">偵測器的設計家族</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">這是架構地圖，不是速度排名；anchor、anchor-free、one-stage與Transformer不是互斥同義詞。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">三種偵測路徑：輸出都是框與類別，但訓練契約不同</text><text x="73" y="248" font-size="24" fill="#9ee3dc" text-anchor="start">Two-stage</text><rect x="345" y="215" width="198" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="444.0" y="257.0" font-size="22" fill="#9ee3dc" text-anchor="middle">候選區域</text><path d="M558 249 L620 249" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M609.04 244.11 L620 249 L609.04 253.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="638" y="215" width="200" height="68" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="738.0" y="257.0" font-size="22" fill="#9ee3dc" text-anchor="middle">區域分類／回歸</text><path d="M852 249 L905 249" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M894.04 244.11 L905 249 L894.04 253.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="931" y="239" font-size="22" fill="#9ee3dc" text-anchor="start">常見NMS</text><text x="931" y="273" font-size="20" fill="#b5c7c0" text-anchor="start">如Faster R-CNN</text><text x="73" y="388" font-size="24" fill="#efcb8b" text-anchor="start">Dense one-stage</text><rect x="345" y="355" width="198" height="68" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="444.0" y="397.0" font-size="22" fill="#efcb8b" text-anchor="middle">密集位置</text><path d="M558 389 L620 389" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M609.04 384.11 L620 389 L609.04 393.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="638" y="355" width="200" height="68" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="738.0" y="397.0" font-size="22" fill="#efcb8b" text-anchor="middle">分類／框回歸</text><path d="M852 389 L905 389" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M894.04 384.11 L905 389 L894.04 393.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="931" y="379" font-size="22" fill="#efcb8b" text-anchor="start">常見NMS</text><text x="931" y="413" font-size="20" fill="#b5c7c0" text-anchor="start">依架構而定</text><text x="73" y="528" font-size="24" fill="#cbb7ef" text-anchor="start">Set prediction</text><rect x="345" y="495" width="198" height="68" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="444.0" y="537.0" font-size="22" fill="#cbb7ef" text-anchor="middle">object queries</text><path d="M558 529 L620 529" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M609.04 524.11 L620 529 L609.04 533.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="638" y="495" width="200" height="68" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="738.0" y="537.0" font-size="22" fill="#cbb7ef" text-anchor="middle">集合解碼</text><path d="M852 529 L905 529" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M894.04 524.11 L905 529 L894.04 533.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="931" y="519" font-size="22" fill="#cbb7ef" text-anchor="start">集合匹配</text><text x="931" y="553" font-size="20" fill="#b5c7c0" text-anchor="start">如原始DETR</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">原始DETR以集合預測處理重複；不能把「每個偵測器都要NMS」當成通則。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>