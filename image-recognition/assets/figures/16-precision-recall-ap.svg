<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv16-title cv16-desc"><title id="cv16-title">從排序、Precision／Recall到AP</title><desc id="cv16-desc">兩個GT和TPFP TP排序產生Recall0.5,0.5,1及Precision1,0.5,2/3，插值面積為1/2加1/3等於5/6。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">從排序、Precision／Recall到AP</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">彩色面積是這個案例的所有點插值積分；不是COCO 101點採樣算法的完整重現。</text><rect x="44" y="142" width="615" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">教學例：2個GT，預測順序 TP、FP、TP</text><rect x="698" y="142" width="458" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="720" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">此圖使用所有點插值AP</text><path d="M110 529 L578 529" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M567.04 524.11 L578 529 L567.04 533.89" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 529 L110 237" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M105.11 247.96 L110 237 L114.89 247.96" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="344.0" y="576" font-size="21" fill="#b5c7c0" text-anchor="middle">Recall</text><text x="95" y="217" font-size="21" fill="#b5c7c0" text-anchor="start">Precision</text><text x="110" y="562" font-size="19" fill="#b5c7c0" text-anchor="middle">0</text><text x="344" y="562" font-size="19" fill="#b5c7c0" text-anchor="middle">0.5</text><text x="578" y="562" font-size="19" fill="#b5c7c0" text-anchor="middle">1</text><text x="92" y="536" font-size="19" fill="#b5c7c0" text-anchor="end">0</text><text x="92" y="390" font-size="19" fill="#b5c7c0" text-anchor="end">0.5</text><text x="92" y="244" font-size="19" fill="#b5c7c0" text-anchor="end">1</text><rect x="111" y="238" width="233" height="291" rx="0" stroke="#9ee3dc" stroke-width="0" fill="#224239"/><rect x="344" y="334.3" width="233" height="194.7" rx="0" stroke="#efcb8b" stroke-width="0" fill="#3a3426"/><path d="M110 237H344V334.3H578" stroke="#9ee3dc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M344 237V383L578 334.3" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><circle cx="344" cy="237" r="7" stroke="#cbb7ef" stroke-width="3" fill="#cbb7ef"/><circle cx="344" cy="383" r="7" stroke="#cbb7ef" stroke-width="3" fill="#cbb7ef"/><circle cx="578" cy="334.3" r="7" stroke="#cbb7ef" stroke-width="3" fill="#cbb7ef"/><text x="219" y="293" font-size="22" fill="#9ee3dc" text-anchor="middle">面積 1/2</text><text x="460" y="411" font-size="22" fill="#efcb8b" text-anchor="middle">面積 1/3</text><rect x="733" y="214" width="18" height="18" rx="2" stroke="#cbb7ef" stroke-width="0" fill="#cbb7ef"/><text x="763" y="230" font-size="20" fill="#b5c7c0" text-anchor="start">實際PR採樣點</text><rect x="733" y="248" width="18" height="18" rx="2" stroke="#9ee3dc" stroke-width="0" fill="#9ee3dc"/><text x="763" y="264" font-size="20" fill="#b5c7c0" text-anchor="start">向右取最大值後的包絡</text><text x="731" y="350" font-size="23" fill="#efcb8b" text-anchor="start">AP = 1/2 × 1 + 1/2 × 2/3</text><text x="731" y="398" font-size="23" fill="#efcb8b" text-anchor="start">      = 5/6 約 0.8333</text><text x="731" y="478" font-size="21" fill="#b5c7c0" text-anchor="start">固定一個類別與IoU閾值</text><text x="731" y="515" font-size="21" fill="#b5c7c0" text-anchor="start">COCO另用101點插值</text><text x="731" y="552" font-size="21" fill="#b5c7c0" text-anchor="start">以及多個IoU閾值平均</text><text x="50" y="675" font-size="22" fill="#b5c7c0" text-anchor="start">PR曲線先依分數掃描得到；教學AP=0.8333不等同完整COCOeval報告。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>