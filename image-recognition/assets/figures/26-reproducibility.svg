<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv26-title cv26-desc"><title id="cv26-title">專題交付：讓下一個人能檢查每一步</title><desc id="cv26-desc">六張卡片沿流程列出資料manifest訓練設定模型artifact部署測試失敗案例評估證據並用箭頭相連。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">專題交付：讓下一個人能檢查每一步</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">六份交付物是一個最小可審查範例；依實際任務補充變更紀錄、存取權與回滾方式。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">從可追溯資料到可重現交付</text><rect x="78" y="217" width="300" height="128" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="228" y="262" font-size="27" fill="#9ee3dc" text-anchor="middle">資料manifest</text><text x="228" y="310" font-size="21" fill="#e8efeb" text-anchor="middle">來源／授權／group_id</text><rect x="450" y="217" width="300" height="128" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="600" y="262" font-size="27" fill="#efcb8b" text-anchor="middle">訓練設定</text><text x="600" y="310" font-size="21" fill="#e8efeb" text-anchor="middle">split／seed／版本</text><rect x="822" y="217" width="300" height="128" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="972" y="262" font-size="27" fill="#cbb7ef" text-anchor="middle">模型artifact</text><text x="972" y="310" font-size="21" fill="#e8efeb" text-anchor="middle">權重hash／classes</text><rect x="78" y="445" width="300" height="128" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="228" y="490" font-size="27" fill="#9ee3dc" text-anchor="middle">評估證據</text><text x="228" y="538" font-size="21" fill="#e8efeb" text-anchor="middle">協定／樣本數／切片</text><rect x="450" y="445" width="300" height="128" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="600" y="490" font-size="27" fill="#efcb8b" text-anchor="middle">失敗案例</text><text x="600" y="538" font-size="21" fill="#e8efeb" text-anchor="middle">原圖ID／預測／原因</text><rect x="822" y="445" width="300" height="128" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="972" y="490" font-size="27" fill="#cbb7ef" text-anchor="middle">部署測試</text><text x="972" y="538" font-size="21" fill="#e8efeb" text-anchor="middle">輸入契約／parity</text><path d="M389 281 L439 281" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M428.04 276.11 L439 281 L428.04 285.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M761 281 L811 281" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M800.04 276.11 L811 281 L800.04 285.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M972 359 L972 431" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M976.89 420.04 L972 431 L967.11 420.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M811 509 L761 509" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M771.96 513.89 L761 509 L771.96 504.11" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M439 509 L389 509" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M399.96 513.89 L389 509 L399.96 504.11" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">固定seed只是其中一項；軟硬體、資料順序、算子與套件版本也影響可重現性。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>