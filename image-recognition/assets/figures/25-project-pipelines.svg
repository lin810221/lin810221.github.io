<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv25-title cv25-desc"><title id="cv25-title">把分類、偵測與分割各做成一個專題</title><desc id="cv25-desc">商品分類使用整張類別和混淆矩陣，偵測使用框類別和AP，表面分割使用像素類別和IoU Dice。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">把分類、偵測與分割各做成一個專題</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">示例是課內專題設計，不宣稱合成影像可以代表工業、醫學或公共場域性能。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">相同的資料邊界，三種任務需要不同標註與驗收</text><rect x="79" y="200" width="154" height="104" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><path d="M80 267.6 H232" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="129.82" cy="244.72" r="15.6" stroke="#79948b" stroke-width="3" fill="#79948b"/><rect x="117.85999999999999" y="259.28" width="23.92" height="23.92" rx="4" stroke="#79948b" stroke-width="1" fill="#79948b"/><circle cx="185.26" cy="245.76" r="15.6" stroke="#79948b" stroke-width="3" fill="#79948b"/><rect x="173.29999999999998" y="260.32" width="23.92" height="23.92" rx="4" stroke="#79948b" stroke-width="1" fill="#79948b"/><text x="264" y="261" font-size="25" fill="#9ee3dc" text-anchor="start">商品分類</text><path d="M414 249 L450 249" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M439.04 244.11 L450 249 L439.04 253.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="472" y="215" width="270" height="72" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="607.0" y="259.0" font-size="22" fill="#9ee3dc" text-anchor="middle">整張影像類別</text><path d="M755 249 L798 249" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M787.04 244.11 L798 249 L787.04 253.89" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="817" y="215" width="298" height="72" rx="12" stroke="#9ee3dc" stroke-width="2" fill="#172524"/><text x="966.0" y="259.0" font-size="21" fill="#9ee3dc" text-anchor="middle">混淆矩陣／macro F1</text><rect x="79" y="340" width="154" height="104" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><path d="M80 407.6 H232" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="129.82" cy="384.72" r="15.6" stroke="#79948b" stroke-width="3" fill="#79948b"/><rect x="117.85999999999999" y="399.28000000000003" width="23.92" height="23.92" rx="4" stroke="#79948b" stroke-width="1" fill="#79948b"/><rect x="109.02" y="361.84000000000003" width="41.6" height="65.52" rx="2" stroke="#9ee3dc" stroke-width="3" fill="none"/><circle cx="185.26" cy="385.76" r="15.6" stroke="#79948b" stroke-width="3" fill="#79948b"/><rect x="173.29999999999998" y="400.32" width="23.92" height="23.92" rx="4" stroke="#79948b" stroke-width="1" fill="#79948b"/><rect x="164.45999999999998" y="362.88" width="41.6" height="65.52" rx="2" stroke="#efcb8b" stroke-width="3" fill="none"/><text x="264" y="401" font-size="25" fill="#efcb8b" text-anchor="start">物件偵測</text><path d="M414 389 L450 389" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M439.04 384.11 L450 389 L439.04 393.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="472" y="355" width="270" height="72" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="607.0" y="399.0" font-size="22" fill="#efcb8b" text-anchor="middle">每個物件框與類別</text><path d="M755 389 L798 389" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M787.04 384.11 L798 389 L787.04 393.89" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="817" y="355" width="298" height="72" rx="12" stroke="#efcb8b" stroke-width="2" fill="#172524"/><text x="966.0" y="399.0" font-size="21" fill="#efcb8b" text-anchor="middle">AP協定／漏檢切片</text><rect x="79" y="480" width="154" height="104" rx="3" stroke="#425952" stroke-width="2" fill="#21312d"/><rect x="80" y="547.6" width="152" height="35.4" rx="0" stroke="#425952" stroke-width="0" fill="#4f485f"/><circle cx="129.82" cy="524.72" r="15.6" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><rect x="117.85999999999999" y="539.28" width="23.92" height="23.92" rx="4" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><circle cx="185.26" cy="525.76" r="15.6" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><rect x="173.29999999999998" y="540.3199999999999" width="23.92" height="23.92" rx="4" stroke="#9ee3dc" stroke-width="1" fill="#9ee3dc"/><text x="264" y="541" font-size="25" fill="#cbb7ef" text-anchor="start">表面分割</text><path d="M414 529 L450 529" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M439.04 524.11 L450 529 L439.04 533.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="472" y="495" width="270" height="72" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="607.0" y="539.0" font-size="22" fill="#cbb7ef" text-anchor="middle">像素類別／ignore</text><path d="M755 529 L798 529" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M787.04 524.11 L798 529 L787.04 533.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="817" y="495" width="298" height="72" rx="12" stroke="#cbb7ef" stroke-width="2" fill="#172524"/><text x="966.0" y="539.0" font-size="21" fill="#cbb7ef" text-anchor="middle">IoU／Dice／邊界案例</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">三個專題都先建立來源群組切分、簡單baseline、測試集保留與錯誤案例記錄。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>