<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv13-title cv13-desc"><title id="cv13-title">Bounding box：座標格式必須寫清楚</title><desc id="cv13-desc">一個位在400乘240影像中的框，XYXY100,60,300,180，改寫為XYWH100,60,200,120及中心正規化0.5四次。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">Bounding box：座標格式必須寫清楚</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">圖中座標數值為定義；畫面因留白與標籤簡化，不使用格線當成精密像素比例。</text><rect x="44" y="142" width="580" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">連續邊界座標：XYXY</text><rect x="666" y="142" width="490" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="688" y="178" font-size="25" fill="#efcb8b" text-anchor="start" font-weight="600">同一個框的其他表示</text><path d="M103 225 L547 225" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M536.04 220.11 L547 225 L536.04 229.89" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 225 L103 489" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M107.89 478.04 L103 489 L98.11 478.04" stroke="#b5c7c0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="552" y="232" font-size="23" fill="#b5c7c0" text-anchor="start">x</text><text x="94" y="524" font-size="23" fill="#b5c7c0" text-anchor="start">y</text><rect x="213" y="291" width="220" height="132" rx="0" stroke="#9ee3dc" stroke-width="3" fill="#24473d"/><circle cx="213" cy="291" r="6" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><circle cx="433" cy="423" r="6" stroke="#cbb7ef" stroke-width="3" fill="#cbb7ef"/><text x="150" y="272" font-size="21" fill="#efcb8b" text-anchor="start">(x1,y1)=(100,60)</text><text x="268" y="476" font-size="21" fill="#cbb7ef" text-anchor="start">(x2,y2)=(300,180)</text><text x="323" y="333" font-size="24" fill="#9ee3dc" text-anchor="middle">w = 200</text><text x="323" y="389" font-size="24" fill="#9ee3dc" text-anchor="middle">h = 120</text><text x="335" y="588" font-size="22" fill="#b5c7c0" text-anchor="middle">影像W=400、H=240</text><text x="698" y="221" font-size="23" fill="#efcb8b" text-anchor="start">XYWH（左上＋寬高）</text><text x="698" y="264" font-size="23" fill="#efcb8b" text-anchor="start">[100, 60, 200, 120]</text><path d="M696 295H1124" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="698" y="347" font-size="22" fill="#cbb7ef" text-anchor="start">CXCYWH（中心＋寬高）</text><text x="698" y="390" font-size="22" fill="#cbb7ef" text-anchor="start">[200, 120, 200, 120]</text><path d="M696 421H1124" stroke="#425952" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="698" y="470" font-size="23" fill="#9ee3dc" text-anchor="start">正規化CXCYWH</text><text x="698" y="513" font-size="23" fill="#9ee3dc" text-anchor="start">[0.5, 0.5, 0.5, 0.5]</text><text x="50" y="675" font-size="23" fill="#b5c7c0" text-anchor="start">寬除W、高除H；框面積=(x2-x1)(y2-y1)。本課此慣例不加1。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>