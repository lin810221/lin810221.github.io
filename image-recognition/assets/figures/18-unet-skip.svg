<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv18-title cv18-desc"><title id="cv18-title">U-Net：空間尺度、skip與像素輸出</title><desc id="cv18-desc">五層U形路徑顯示H W縮到二分之一與四分之一後再回升，上方skip跳接對應解析度並concat。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">U-Net：空間尺度、skip與像素輸出</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">方塊寬度未代表實際通道數；此處刻意區分教學same-padding變體與原論文裁切設計。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">Encoder縮小空間，Decoder恢復解析度，skip保留定位資訊</text><rect x="96" y="268" width="126" height="244" rx="5" stroke="#9ee3dc" stroke-width="2" fill="#253a33"/><text x="159.0" y="558" font-size="20" fill="#9ee3dc" text-anchor="middle">H × W</text><rect x="321" y="350" width="126" height="164" rx="5" stroke="#9ee3dc" stroke-width="2" fill="#253a33"/><text x="384.0" y="558" font-size="20" fill="#9ee3dc" text-anchor="middle">H/2 × W/2</text><rect x="537" y="432" width="126" height="82" rx="5" stroke="#cbb7ef" stroke-width="2" fill="#253a33"/><text x="600.0" y="558" font-size="20" fill="#cbb7ef" text-anchor="middle">H/4 × W/4</text><rect x="753" y="350" width="126" height="164" rx="5" stroke="#efcb8b" stroke-width="2" fill="#253a33"/><text x="816.0" y="558" font-size="20" fill="#efcb8b" text-anchor="middle">H/2 × W/2</text><rect x="978" y="268" width="126" height="244" rx="5" stroke="#efcb8b" stroke-width="2" fill="#253a33"/><text x="1041.0" y="558" font-size="20" fill="#efcb8b" text-anchor="middle">H × W</text><path d="M231 396 L309 432" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M301.10 422.97 L309 432 L297.00 431.85" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M458 447 L526 474" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M517.62 465.41 L526 474 L514.01 474.50" stroke="#9ee3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M674 474 L743 447" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M731.01 446.44 L743 447 L734.58 455.55" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M889 432 L968 396" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M956.00 396.09 L968 396 L960.06 405.00" stroke="#efcb8b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M159 255V226H1041V255" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1041 236 L1041 258" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1045.89 247.04 L1041 258 L1036.11 247.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="213" font-size="23" fill="#cbb7ef" text-anchor="middle">skip：對齊空間尺寸，再concat</text><path d="M384 338V314H816V338" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M816 320 L816 342" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M820.89 331.04 L816 342 L811.11 331.04" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="609" font-size="22" fill="#b5c7c0" text-anchor="middle">本圖是same-padding教學變體；原始U-Net使用crop來對齊skip。</text><text x="50" y="676" font-size="23" fill="#b5c7c0" text-anchor="start">輸出logits常為N × K × H × W；target常為N × H × W整數類別索引。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>