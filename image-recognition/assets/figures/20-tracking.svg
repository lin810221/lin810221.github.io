<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="cv20-title cv20-desc"><title id="cv20-title">影片追蹤：框是位置，ID是跨幀關係</title><desc id="cv20-desc">連續三幀裡兩個人物框移動，青色ID7和黃色ID9保持一致，下方軌跡展示跨幀關聯。</desc><rect width="1200" height="780" rx="18" fill="#101919"/><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><text x="44" y="55" font-size="34" fill="#9ee3dc" text-anchor="start" font-weight="650">影片追蹤：框是位置，ID是跨幀關係</text><text x="44" y="98" font-size="21" fill="#b5c7c0" text-anchor="start">本圖兩個目標移動但未遮擋；真實追蹤還需要缺失、遮擋、出生與結束規則。</text><rect x="44" y="142" width="1112" height="490" rx="12" stroke="#425952" stroke-width="2" fill="#172524"/><text x="66" y="178" font-size="25" fill="#9ee3dc" text-anchor="start" font-weight="600">先偵測每一幀，再用運動與外觀連結身分</text><rect x="82" y="218" width="280" height="220" rx="5" stroke="#425952" stroke-width="2" fill="#20322c"/><text x="222" y="206" font-size="22" fill="#9ee3dc" text-anchor="middle">影格 t</text><rect x="123" y="240" width="58" height="85" rx="3" stroke="#9ee3dc" stroke-width="3" fill="none"/><circle cx="152" cy="261" r="12" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><text x="152" y="352" font-size="22" fill="#9ee3dc" text-anchor="middle">ID 7</text><rect x="258" y="321" width="58" height="85" rx="3" stroke="#efcb8b" stroke-width="3" fill="none"/><circle cx="287" cy="342" r="12" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><text x="287" y="433" font-size="22" fill="#efcb8b" text-anchor="middle">ID 9</text><path d="M371 327 L447 327" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M436.04 322.11 L447 327 L436.04 331.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="218" width="280" height="220" rx="5" stroke="#425952" stroke-width="2" fill="#20322c"/><text x="600" y="206" font-size="22" fill="#9ee3dc" text-anchor="middle">影格 t+1</text><rect x="527" y="249" width="58" height="85" rx="3" stroke="#9ee3dc" stroke-width="3" fill="none"/><circle cx="556" cy="270" r="12" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><text x="556" y="361" font-size="22" fill="#9ee3dc" text-anchor="middle">ID 7</text><rect x="606" y="313" width="58" height="85" rx="3" stroke="#efcb8b" stroke-width="3" fill="none"/><circle cx="635" cy="334" r="12" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><text x="635" y="425" font-size="22" fill="#efcb8b" text-anchor="middle">ID 9</text><path d="M749 327 L825 327" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M814.04 322.11 L825 327 L814.04 331.89" stroke="#cbb7ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="838" y="218" width="280" height="220" rx="5" stroke="#425952" stroke-width="2" fill="#20322c"/><text x="978" y="206" font-size="22" fill="#9ee3dc" text-anchor="middle">影格 t+2</text><rect x="931" y="258" width="58" height="85" rx="3" stroke="#9ee3dc" stroke-width="3" fill="none"/><circle cx="960" cy="279" r="12" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><text x="960" y="370" font-size="22" fill="#9ee3dc" text-anchor="middle">ID 7</text><rect x="954" y="305" width="58" height="85" rx="3" stroke="#efcb8b" stroke-width="3" fill="none"/><circle cx="983" cy="326" r="12" stroke="#efcb8b" stroke-width="3" fill="#efcb8b"/><text x="983" y="417" font-size="22" fill="#efcb8b" text-anchor="middle">ID 9</text><path d="M152 489L558 489L960 489" stroke="#9ee3dc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="489" r="7" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><circle cx="558" cy="489" r="7" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><circle cx="960" cy="489" r="7" stroke="#9ee3dc" stroke-width="3" fill="#9ee3dc"/><text x="596" y="537" font-size="23" fill="#9ee3dc" text-anchor="middle">同一個ID沿時間延續；不是每幀重新從1編號</text><text x="596" y="588" font-size="23" fill="#efcb8b" text-anchor="middle">遮擋、交會與離開畫面可能造成ID switch或軌跡中斷。</text><text x="50" y="676" font-size="22" fill="#b5c7c0" text-anchor="start">單張影像AP不能評估身分穩定性；影片切分要避免相鄰影格跨訓練與測試。</text><path d="M44 710H1156" stroke="#425952" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="749" font-size="19" fill="#b5c7c0" text-anchor="start">原創教學示意 · 幾何／數值為圖中所定案例 · 不代表真實資料效能</text></g></svg>