<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">從文件到資料，保留可回查的證據鏈</title><desc id="desc">沿來源雜湊、頁面與區域走到欄位，再找到引用如何回到原文件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">從文件到資料，保留可回查的證據鏈</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70.0" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="189.375" y="307.5" fill="#95c9ef" font-size="23" text-anchor="middle">來源位元組</text><text x="189.375" y="338.5" fill="#95c9ef" font-size="23" text-anchor="middle">SHA-256</text><path d="M308.75 315L337.75 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="343.75" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="463.125" y="307.5" fill="#a9dece" font-size="23" text-anchor="middle">頁面與區域</text><text x="463.125" y="338.5" fill="#a9dece" font-size="23" text-anchor="middle">座標契約</text><path d="M582.5 315L611.5 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="617.5" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="736.875" y="307.5" fill="#eac98d" font-size="23" text-anchor="middle">欄位與驗證</text><text x="736.875" y="338.5" fill="#eac98d" font-size="23" text-anchor="middle">原文引用</text><path d="M856.25 315L885.25 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="891.25" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#efa7b3" stroke-width="2"/><text x="1010.625" y="307.5" fill="#efa7b3" font-size="23" text-anchor="middle">版本化交付</text><text x="1010.625" y="338.5" fill="#efa7b3" font-size="23" text-anchor="middle">回讀檢查</text><path d="M1000 430L210 515" stroke="#95c9ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="600" y="565" fill="#95c9ef" font-size="26" text-anchor="middle">資料值 → 頁碼 → 區域 → 同一份原始文件</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">JSON格式正確只是第一道門；內容仍須驗證。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>