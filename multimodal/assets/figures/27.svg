<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">音訊取樣與逐字稿時間是兩層資料</title><desc id="desc">在1500毫秒找唯一有效區間，說明WAV取樣數、轉錄文字、說話者與語言是不同驗證項目。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">音訊取樣與逐字稿時間是兩層資料</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><path d="M100 310L1100 310" stroke="#adbbb4" stroke-width="2" fill="none"/><path d="M600 235L600 500" stroke="#eac98d" stroke-width="2" fill="none"/><rect x="100" y="220" width="500" height="80" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="350.0" y="268.0" fill="#95c9ef" font-size="23" text-anchor="middle">人工逐字稿A：[0,1500)</text><rect x="600" y="350" width="500" height="80" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="850.0" y="398.0" fill="#a9dece" font-size="23" text-anchor="middle">人工逐字稿B：[1500,3000)</text><text x="130" y="535" fill="#a9dece" font-size="28" text-anchor="start">16,000 samples/s × 3 s = 48,000 samples</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">範例音訊是合成純音，逐字稿為人工fixture，未執行ASR。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>