<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">表單欄位與印刷文字是不同來源</title><desc id="desc">比較視覺鍵值配對和PDF互動欄位，指出為何不能因為欄位物件有值，就省略可見頁面核對。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">表單欄位與印刷文字是不同來源</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="90" y="205" width="420" height="150" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="300.0" y="272.5" fill="#95c9ef" font-size="23" text-anchor="middle">印刷標籤 Vendor</text><text x="300.0" y="303.5" fill="#95c9ef" font-size="23" text-anchor="middle">候選值 Harbor Labs</text><path d="M510 280L650 280" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="690" y="205" width="420" height="150" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="900.0" y="272.5" fill="#a9dece" font-size="23" text-anchor="middle">位置／語意配對</text><text x="900.0" y="303.5" fill="#a9dece" font-size="23" text-anchor="middle">需要證據與歧義處理</text><rect x="170" y="440" width="870" height="100" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="605.0" y="498.0" fill="#eac98d" font-size="23" text-anchor="middle">AcroForm：field_name=vendor，/V=Harbor Labs</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">數位簽章、checkbox與XFA不能直接當作普通文字框。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>