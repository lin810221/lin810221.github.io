<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">文字、欄位、定位和文件成功率分開量測</title><desc id="desc">選一個錯誤案例，指出它會影響哪個分數，並說明為何一個平均分數無法代表整份文件可自動交付。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">文字、欄位、定位和文件成功率分開量測</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="100" y="200" width="240" height="52" fill="#20382f" stroke="#52665e"/><text x="112" y="234" fill="#a9dece" font-size="21" text-anchor="start">層次</text><rect x="340" y="200" width="360" height="52" fill="#20382f" stroke="#52665e"/><text x="352" y="234" fill="#a9dece" font-size="21" text-anchor="start">檢查對象</text><rect x="700" y="200" width="460" height="52" fill="#20382f" stroke="#52665e"/><text x="712" y="234" fill="#a9dece" font-size="21" text-anchor="start">反例</text><rect x="100" y="252" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="112" y="286" fill="#e7eee9" font-size="21" text-anchor="start">文字</text><rect x="340" y="252" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="352" y="286" fill="#e7eee9" font-size="21" text-anchor="start">CER／編輯距離</text><rect x="700" y="252" width="460" height="52" fill="#141f1b" stroke="#52665e"/><text x="712" y="286" fill="#e7eee9" font-size="21" text-anchor="start">47.25 被讀成 47.2S</text><rect x="100" y="304" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="112" y="338" fill="#e7eee9" font-size="21" text-anchor="start">欄位</text><rect x="340" y="304" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="352" y="338" fill="#e7eee9" font-size="21" text-anchor="start">精確值／F1</text><rect x="700" y="304" width="460" height="52" fill="#141f1b" stroke="#52665e"/><text x="712" y="338" fill="#e7eee9" font-size="21" text-anchor="start">值對但幣別錯</text><rect x="100" y="356" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="112" y="390" fill="#e7eee9" font-size="21" text-anchor="start">定位</text><rect x="340" y="356" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="352" y="390" fill="#e7eee9" font-size="21" text-anchor="start">IoU與引用支持</text><rect x="700" y="356" width="460" height="52" fill="#141f1b" stroke="#52665e"/><text x="712" y="390" fill="#e7eee9" font-size="21" text-anchor="start">答案對但框錯頁</text><rect x="100" y="408" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="112" y="442" fill="#e7eee9" font-size="21" text-anchor="start">整份文件</text><rect x="340" y="408" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="352" y="442" fill="#e7eee9" font-size="21" text-anchor="start">全部必要欄位通過</text><rect x="700" y="408" width="460" height="52" fill="#141f1b" stroke="#52665e"/><text x="712" y="442" fill="#e7eee9" font-size="21" text-anchor="start">平均很高但一筆總額錯</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">先定義正規化、缺值、分母與文件級切分，再計算指標。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>