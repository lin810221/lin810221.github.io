<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">圖文對比學習的正配對在對角線</title><desc id="desc">找出兩個方向的正例與負例，說明batch內重複語意為何可能形成假負例。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">圖文對比學習的正配對在對角線</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="160" y="200" width="250" height="52" fill="#20382f" stroke="#52665e"/><text x="172" y="234" fill="#a9dece" font-size="21" text-anchor="start">圖／文</text><rect x="410" y="200" width="300" height="52" fill="#20382f" stroke="#52665e"/><text x="422" y="234" fill="#a9dece" font-size="21" text-anchor="start">文字A</text><rect x="710" y="200" width="300" height="52" fill="#20382f" stroke="#52665e"/><text x="722" y="234" fill="#a9dece" font-size="21" text-anchor="start">文字B</text><rect x="160" y="252" width="250" height="52" fill="#141f1b" stroke="#52665e"/><text x="172" y="286" fill="#e7eee9" font-size="21" text-anchor="start">圖片A</text><rect x="410" y="252" width="300" height="52" fill="#141f1b" stroke="#52665e"/><text x="422" y="286" fill="#e7eee9" font-size="21" text-anchor="start">1.0 正配對</text><rect x="710" y="252" width="300" height="52" fill="#141f1b" stroke="#52665e"/><text x="722" y="286" fill="#e7eee9" font-size="21" text-anchor="start">0.0 負配對</text><rect x="160" y="304" width="250" height="52" fill="#141f1b" stroke="#52665e"/><text x="172" y="338" fill="#e7eee9" font-size="21" text-anchor="start">圖片B</text><rect x="410" y="304" width="300" height="52" fill="#141f1b" stroke="#52665e"/><text x="422" y="338" fill="#e7eee9" font-size="21" text-anchor="start">0.0 負配對</text><rect x="710" y="304" width="300" height="52" fill="#141f1b" stroke="#52665e"/><text x="722" y="338" fill="#e7eee9" font-size="21" text-anchor="start">1.0 正配對</text><text x="160" y="475" fill="#a9dece" font-size="28" text-anchor="start">圖找文與文找圖：兩個方向共同學習對應</text><text x="160" y="545" fill="#eac98d" font-size="25" text-anchor="start">溫度改變softmax集中程度；不是新增證據</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">範例用手工矩陣演算損失，不冒稱訓練出CLIP。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>