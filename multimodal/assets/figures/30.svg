<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">不可變產物與目前指標分開提交</title><desc id="desc">在manifest已驗證但current尚未替換時中斷，說明讀者仍看到舊狀態以及重跑如何完成切換。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">不可變產物與目前指標分開提交</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70.0" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="189.375" y="307.5" fill="#95c9ef" font-size="23" text-anchor="middle">寫版本目錄</text><text x="189.375" y="338.5" fill="#95c9ef" font-size="23" text-anchor="middle">保留原始PDF</text><path d="M308.75 315L337.75 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="343.75" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="463.125" y="307.5" fill="#a9dece" font-size="23" text-anchor="middle">驗證schema</text><text x="463.125" y="338.5" fill="#a9dece" font-size="23" text-anchor="middle">引用與雜湊</text><path d="M582.5 315L611.5 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="617.5" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="736.875" y="307.5" fill="#eac98d" font-size="23" text-anchor="middle">manifest完整</text><text x="736.875" y="338.5" fill="#eac98d" font-size="23" text-anchor="middle">可安全重用</text><path d="M856.25 315L885.25 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="891.25" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#efa7b3" stroke-width="2"/><text x="1010.625" y="307.5" fill="#efa7b3" font-size="23" text-anchor="middle">替換current</text><text x="1010.625" y="338.5" fill="#efa7b3" font-size="23" text-anchor="middle">讀者才可見</text><text x="150" y="505" fill="#efa7b3" font-size="27" text-anchor="start">中斷位置：manifest後、current前 → 下次驗證後重試</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">原子替換是本機程序層的邊界，不等同跨服務或斷電保證。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>