<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">高分不能越過證據與業務規則</title><desc id="desc">逐列比較unknown、review、accept的差異；指出一個高分但引用錯頁的值應走哪條路。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">高分不能越過證據與業務規則</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="80" y="195" width="320" height="52" fill="#20382f" stroke="#52665e"/><text x="92" y="229" fill="#a9dece" font-size="21" text-anchor="start">欄位狀態</text><rect x="400" y="195" width="240" height="52" fill="#20382f" stroke="#52665e"/><text x="412" y="229" fill="#a9dece" font-size="21" text-anchor="start">引用</text><rect x="640" y="195" width="180" height="52" fill="#20382f" stroke="#52665e"/><text x="652" y="229" fill="#a9dece" font-size="21" text-anchor="start">對帳</text><rect x="820" y="195" width="330" height="52" fill="#20382f" stroke="#52665e"/><text x="832" y="229" fill="#a9dece" font-size="21" text-anchor="start">決策</text><rect x="80" y="247" width="320" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="281" fill="#e7eee9" font-size="21" text-anchor="start">缺少來源內容</text><rect x="400" y="247" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="412" y="281" fill="#e7eee9" font-size="21" text-anchor="start">沒有</text><rect x="640" y="247" width="180" height="52" fill="#141f1b" stroke="#52665e"/><text x="652" y="281" fill="#e7eee9" font-size="21" text-anchor="start">不適用</text><rect x="820" y="247" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="832" y="281" fill="#e7eee9" font-size="21" text-anchor="start">unknown</text><rect x="80" y="299" width="320" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="333" fill="#e7eee9" font-size="21" text-anchor="start">有值且分數很高</text><rect x="400" y="299" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="412" y="333" fill="#e7eee9" font-size="21" text-anchor="start">錯頁</text><rect x="640" y="299" width="180" height="52" fill="#141f1b" stroke="#52665e"/><text x="652" y="333" fill="#e7eee9" font-size="21" text-anchor="start">通過</text><rect x="820" y="299" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="832" y="333" fill="#e7eee9" font-size="21" text-anchor="start">review</text><rect x="80" y="351" width="320" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="385" fill="#e7eee9" font-size="21" text-anchor="start">有值</text><rect x="400" y="351" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="412" y="385" fill="#e7eee9" font-size="21" text-anchor="start">正確區域</text><rect x="640" y="351" width="180" height="52" fill="#141f1b" stroke="#52665e"/><text x="652" y="385" fill="#e7eee9" font-size="21" text-anchor="start">失敗</text><rect x="820" y="351" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="832" y="385" fill="#e7eee9" font-size="21" text-anchor="start">review</text><rect x="80" y="403" width="320" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="437" fill="#e7eee9" font-size="21" text-anchor="start">有值</text><rect x="400" y="403" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="412" y="437" fill="#e7eee9" font-size="21" text-anchor="start">正確區域</text><rect x="640" y="403" width="180" height="52" fill="#141f1b" stroke="#52665e"/><text x="652" y="437" fill="#e7eee9" font-size="21" text-anchor="start">通過</text><rect x="820" y="403" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="832" y="437" fill="#e7eee9" font-size="21" text-anchor="start">達門檻才accept</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">分數門檻是政策；校準和漏失成本必須另行評估。</text><tex