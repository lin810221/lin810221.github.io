<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">內容快取不能忽略處理配方與租戶</title><desc id="desc">逐列決定是否可重用結果，指出相同文件雜湊為何不能取代授權檢查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">內容快取不能忽略處理配方與租戶</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="90" y="200" width="240" height="52" fill="#20382f" stroke="#52665e"/><text x="102" y="234" fill="#a9dece" font-size="21" text-anchor="start">來源hash</text><rect x="330" y="200" width="360" height="52" fill="#20382f" stroke="#52665e"/><text x="342" y="234" fill="#a9dece" font-size="21" text-anchor="start">recipe</text><rect x="690" y="200" width="450" height="52" fill="#20382f" stroke="#52665e"/><text x="702" y="234" fill="#a9dece" font-size="21" text-anchor="start">結果</text><rect x="90" y="252" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="102" y="286" fill="#e7eee9" font-size="21" text-anchor="start">相同</text><rect x="330" y="252" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="342" y="286" fill="#e7eee9" font-size="21" text-anchor="start">相同</text><rect x="690" y="252" width="450" height="52" fill="#141f1b" stroke="#52665e"/><text x="702" y="286" fill="#e7eee9" font-size="21" text-anchor="start">驗證並重用同一版本</text><rect x="90" y="304" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="102" y="338" fill="#e7eee9" font-size="21" text-anchor="start">不同</text><rect x="330" y="304" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="342" y="338" fill="#e7eee9" font-size="21" text-anchor="start">相同</text><rect x="690" y="304" width="450" height="52" fill="#141f1b" stroke="#52665e"/><text x="702" y="338" fill="#e7eee9" font-size="21" text-anchor="start">建立新來源版本</text><rect x="90" y="356" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="102" y="390" fill="#e7eee9" font-size="21" text-anchor="start">相同</text><rect x="330" y="356" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="342" y="390" fill="#e7eee9" font-size="21" text-anchor="start">DPI／schema／模型不同</text><rect x="690" y="356" width="450" height="52" fill="#141f1b" stroke="#52665e"/><text x="702" y="390" fill="#e7eee9" font-size="21" text-anchor="start">建立新處理版本</text><rect x="90" y="408" width="240" height="52" fill="#141f1b" stroke="#52665e"/><text x="102" y="442" fill="#e7eee9" font-size="21" text-anchor="start">租戶不同</text><rect x="330" y="408" width="360" height="52" fill="#141f1b" stroke="#52665e"/><text x="342" y="442" fill="#e7eee9" font-size="21" text-anchor="start">同內容</text><rect x="690" y="408" width="450" height="52" fill="#141f1b" stroke="#52665e"/><text x="702" y="442" fill="#e7eee9" font-size="21" text-anchor="start">權限仍須分開</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">產物雜湊是損壞偵測；不能取代可信寫入者或數位簽章。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>