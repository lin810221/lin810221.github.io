<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">point、pixel與正規化座標</title><desc id="desc">找出左上原點與區域的兩個角；計算144 DPI時座標如何縮放，說明正規化值仍需附座標系。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">point、pixel與正規化座標</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="100" y="180" width="390" height="350" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><path d="M100 180L530 180" stroke="#95c9ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M100 180L100 565" stroke="#95c9ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="120" y="215" fill="#95c9ef" font-size="23" text-anchor="start">左上原點 (0,0)</text><rect x="180" y="285" width="170" height="85" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="195" y="335" fill="#a9dece" font-size="25" text-anchor="start">欄位區域</text><text x="600" y="260" fill="#e7eee9" font-size="27" text-anchor="start">PDF：72 point = 1 inch</text><text x="600" y="335" fill="#a9dece" font-size="27" text-anchor="start">144 DPI：1 point → 2 pixel</text><text x="600" y="410" fill="#eac98d" font-size="25" text-anchor="start">正規化：各軸除以頁面大小</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">本圖是未旋轉頁面的左上座標；PDF底層座標不可直接混用。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>