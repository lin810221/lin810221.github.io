<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">PDF頁面是物件與圖層，不是普通文字檔</title><desc id="desc">比較可見畫面、文字物件和影像，指出複製文字成功仍無法證明欄位順序正確。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">PDF頁面是物件與圖層，不是普通文字檔</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="90" y="180" width="270" height="350" rx="6" fill="#e7eee9" stroke="#a1b9ae" stroke-width="2"/><text x="105" y="220" fill="#16352d" font-size="21" text-anchor="start">INVOICE</text><text x="105" y="275" fill="#16352d" font-size="21" text-anchor="start">DW-2026-001</text><text x="105" y="330" fill="#16352d" font-size="21" text-anchor="start">USD</text><text x="105" y="385" fill="#16352d" font-size="21" text-anchor="start">Total: 47.25</text><rect x="440" y="200" width="610" height="80" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="745.0" y="248.0" fill="#95c9ef" font-size="23" text-anchor="middle">可見頁面：人眼看到排版</text><rect x="440" y="320" width="610" height="80" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="745.0" y="368.0" fill="#a9dece" font-size="23" text-anchor="middle">文字物件：內容流順序未必等於閱讀順序</text><rect x="440" y="440" width="610" height="80" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="745.0" y="488.0" fill="#eac98d" font-size="23" text-anchor="middle">影像物件：掃描或照片，可能沒有字元</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">保留原頁並以區域回查，避免把扁平字串當完整文件。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>