<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">全頁有答案，不代表這個引用框就有效</title><desc id="desc">比較總額區與錯誤上方區域，檢查quote必須來自框內文字，不能只做全頁子字串搜尋。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">全頁有答案，不代表這個引用框就有效</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="90" y="180" width="300" height="365" rx="6" fill="#e7eee9" stroke="#a1b9ae" stroke-width="2"/><text x="105" y="220" fill="#16352d" font-size="21" text-anchor="start">INVOICE</text><text x="105" y="275" fill="#16352d" font-size="21" text-anchor="start">DW-2026-001</text><text x="105" y="330" fill="#16352d" font-size="21" text-anchor="start">USD</text><text x="105" y="385" fill="#16352d" font-size="21" text-anchor="start">Total: 47.25</text><rect x="104" y="360" width="262" height="37" rx="6" fill="none" stroke="#a9dece" stroke-width="2"/><rect x="104" y="225" width="262" height="37" rx="6" fill="none" stroke="#efa7b3" stroke-width="2"/><rect x="570" y="230" width="520" height="100" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="830.0" y="288.0" fill="#a9dece" font-size="23" text-anchor="middle">正確頁碼 + 正確區域 + 對應quote</text><rect x="570" y="420" width="520" height="100" rx="6" fill="#172620" stroke="#efa7b3" stroke-width="2"/><text x="830.0" y="478.0" fill="#efa7b3" font-size="23" text-anchor="middle">錯誤區域：即使全頁找得到47.25也拒絕</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">旋轉頁與OCR多邊形還需轉回同一個座標契約。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>