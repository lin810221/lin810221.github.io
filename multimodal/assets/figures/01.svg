<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">PDF副檔名沒有告訴你頁面是哪一種</title><desc id="desc">逐列比較文字層與影像，決定先解析還是OCR；說明同一PDF內為何仍要逐頁檢查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">PDF副檔名沒有告訴你頁面是哪一種</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="80" y="190" width="210" height="52" fill="#20382f" stroke="#52665e"/><text x="92" y="224" fill="#a9dece" font-size="21" text-anchor="start">輸入</text><rect x="290" y="190" width="170" height="52" fill="#20382f" stroke="#52665e"/><text x="302" y="224" fill="#a9dece" font-size="21" text-anchor="start">文字層</text><rect x="460" y="190" width="170" height="52" fill="#20382f" stroke="#52665e"/><text x="472" y="224" fill="#a9dece" font-size="21" text-anchor="start">影像</text><rect x="630" y="190" width="500" height="52" fill="#20382f" stroke="#52665e"/><text x="642" y="224" fill="#a9dece" font-size="21" text-anchor="start">優先路徑</text><rect x="80" y="242" width="210" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="276" fill="#e7eee9" font-size="21" text-anchor="start">數位PDF</text><rect x="290" y="242" width="170" height="52" fill="#141f1b" stroke="#52665e"/><text x="302" y="276" fill="#e7eee9" font-size="21" text-anchor="start">有</text><rect x="460" y="242" width="170" height="52" fill="#141f1b" stroke="#52665e"/><text x="472" y="276" fill="#e7eee9" font-size="21" text-anchor="start">可能有</text><rect x="630" y="242" width="500" height="52" fill="#141f1b" stroke="#52665e"/><text x="642" y="276" fill="#e7eee9" font-size="21" text-anchor="start">原生解析與視覺核對</text><rect x="80" y="294" width="210" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="328" fill="#e7eee9" font-size="21" text-anchor="start">掃描PDF</text><rect x="290" y="294" width="170" height="52" fill="#141f1b" stroke="#52665e"/><text x="302" y="328" fill="#e7eee9" font-size="21" text-anchor="start">沒有</text><rect x="460" y="294" width="170" height="52" fill="#141f1b" stroke="#52665e"/><text x="472" y="328" fill="#e7eee9" font-size="21" text-anchor="start">整頁</text><rect x="630" y="294" width="500" height="52" fill="#141f1b" stroke="#52665e"/><text x="642" y="328" fill="#e7eee9" font-size="21" text-anchor="start">OCR與區域定位</text><rect x="80" y="346" width="210" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="380" fill="#e7eee9" font-size="21" text-anchor="start">混合PDF</text><rect x="290" y="346" width="170" height="52" fill="#141f1b" stroke="#52665e"/><text x="302" y="380" fill="#e7eee9" font-size="21" text-anchor="start">逐頁不同</text><rect x="460" y="346" width="170" height="52" fill="#141f1b" stroke="#52665e"/><text x="472" y="380" fill="#e7eee9" font-size="21" text-anchor="start">有</text><rect x="630" y="346" width="500" height="52" fill="#141f1b" stroke="#52665e"/><text x="642" y="380" fill="#e7eee9" font-size="21" text-anchor="start">依頁面分流</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">空的原生文字結果不代表空白頁，也不能直接補出欄位。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>