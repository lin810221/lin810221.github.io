<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">文件檢索保留頁面與權限層級</title><desc id="desc">沿文件、頁面到區域chunk追蹤來源與租戶標記，指出權限過濾應在排序前還是排序後。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">文件檢索保留頁面與權限層級</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70" y="245" width="260" height="130" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="200.0" y="302.5" fill="#95c9ef" font-size="23" text-anchor="middle">tenant + document</text><text x="200.0" y="333.5" fill="#95c9ef" font-size="23" text-anchor="middle">來源雜湊</text><path d="M330 310L410 310" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="440" y="245" width="260" height="130" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="570.0" y="302.5" fill="#a9dece" font-size="23" text-anchor="middle">page 0 / page 1</text><text x="570.0" y="333.5" fill="#a9dece" font-size="23" text-anchor="middle">頁面表示</text><path d="M700 310L780 310" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="810" y="245" width="300" height="130" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="960.0" y="302.5" fill="#eac98d" font-size="23" text-anchor="middle">文字／區域chunk</text><text x="960.0" y="333.5" fill="#eac98d" font-size="23" text-anchor="middle">頁碼與bbox</text><text x="150" y="510" fill="#a9dece" font-size="27" text-anchor="start">先過濾可見資料，再檢索、排序、生成與引用。</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">只在最後隱藏卡片，無法撤回已送進模型的私人內容。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>