<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">原生文字與OCR採不同的取證路線</title><desc id="desc">辨認兩條路線的共同輸出是附座標的文字，再指出OCR多出來的辨識與品質責任。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">原生文字與OCR採不同的取證路線</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70" y="210" width="250" height="80" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="195.0" y="258.0" fill="#95c9ef" font-size="23" text-anchor="middle">原生文字頁</text><path d="M320 250L500 250" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="540" y="210" width="560" height="80" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="820.0" y="258.0" fill="#a9dece" font-size="23" text-anchor="middle">文字物件 → 字詞與原頁座標</text><rect x="70" y="410" width="250" height="80" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="195.0" y="458.0" fill="#eac98d" font-size="23" text-anchor="middle">只有影像的頁</text><path d="M320 450L500 450" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="540" y="410" width="560" height="80" rx="6" fill="#172620" stroke="#efa7b3" stroke-width="2"/><text x="820.0" y="458.0" fill="#efa7b3" font-size="23" text-anchor="middle">影像 → 偵測 → 辨識 → 文字與框</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">文字層可有錯誤或過期OCR，仍需抽樣視覺核對。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>