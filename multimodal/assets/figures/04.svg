<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">裁切與旋轉需要保留反向變換</title><desc id="desc">追蹤原頁區域到裁切圖，再將局部框還原；指出只儲存小圖座標會失去哪個定位資訊。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">裁切與旋轉需要保留反向變換</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="100" y="185" width="270" height="340" rx="6" fill="#e7eee9" stroke="#a1b9ae" stroke-width="2"/><text x="115" y="225" fill="#16352d" font-size="21" text-anchor="start">INVOICE</text><text x="115" y="280" fill="#16352d" font-size="21" text-anchor="start">DW-2026-001</text><text x="115" y="335" fill="#16352d" font-size="21" text-anchor="start">USD</text><text x="115" y="390" fill="#16352d" font-size="21" text-anchor="start">Total: 47.25</text><rect x="145" y="290" width="155" height="100" rx="6" fill="none" stroke="#efa7b3" stroke-width="2"/><path d="M410 350L570 350" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="250" width="430" height="160" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="835.0" y="307.0" fill="#a9dece" font-size="23" text-anchor="middle">裁切原點 (100,200)</text><text x="835.0" y="338.0" fill="#a9dece" font-size="23" text-anchor="middle">輸入放大2倍</text><text x="835.0" y="369.0" fill="#a9dece" font-size="23" text-anchor="middle">回原頁先除2再平移</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">旋轉後頁面寬高也會互換；不是只改一個角度欄位。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>