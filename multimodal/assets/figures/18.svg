<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">直接送PDF與逐頁送圖有不同責任</title><desc id="desc">比較頁面視覺、文字層與自己產生影像兩條輸入，指出使用者設定解析度後仍要核對哪些限制。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">直接送PDF與逐頁送圖有不同責任</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="100" y="190" width="250" height="330" rx="6" fill="#e7eee9" stroke="#a1b9ae" stroke-width="2"/><text x="115" y="230" fill="#16352d" font-size="21" text-anchor="start">INVOICE</text><text x="115" y="285" fill="#16352d" font-size="21" text-anchor="start">DW-2026-001</text><text x="115" y="340" fill="#16352d" font-size="21" text-anchor="start">USD</text><text x="115" y="395" fill="#16352d" font-size="21" text-anchor="start">Total: 47.25</text><path d="M370 350L500 350" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="540" y="205" width="540" height="95" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="810.0" y="260.5" fill="#95c9ef" font-size="23" text-anchor="middle">原生PDF：文字與頁面視覺處理依服務</text><rect x="540" y="385" width="540" height="95" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="810.0" y="440.5" fill="#a9dece" font-size="23" text-anchor="middle">逐頁影像：自行負責DPI、裁切與頁碼</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">本課inline上限為2MB，是教材預算，不是供應商最大值。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>