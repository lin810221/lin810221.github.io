<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">視覺編碼器、連接層與語言模型</title><desc id="desc">沿影像patch走到視覺token與語言輸出，指出OCR文字在哪裡可作補充，以及生成仍可能幻覺。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">視覺編碼器、連接層與語言模型</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70.0" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="189.375" y="307.5" fill="#95c9ef" font-size="23" text-anchor="middle">影像patch</text><text x="189.375" y="338.5" fill="#95c9ef" font-size="23" text-anchor="middle">視覺編碼器</text><path d="M308.75 315L337.75 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="343.75" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="463.125" y="307.5" fill="#a9dece" font-size="23" text-anchor="middle">投影／連接</text><text x="463.125" y="338.5" fill="#a9dece" font-size="23" text-anchor="middle">視覺token</text><path d="M582.5 315L611.5 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="617.5" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="736.875" y="307.5" fill="#eac98d" font-size="23" text-anchor="middle">文字與視覺</text><text x="736.875" y="338.5" fill="#eac98d" font-size="23" text-anchor="middle">語言模型</text><path d="M856.25 315L885.25 315" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="891.25" y="260" width="238.75" height="110" rx="6" fill="#172620" stroke="#efa7b3" stroke-width="2"/><text x="1010.625" y="307.5" fill="#efa7b3" font-size="23" text-anchor="middle">答案與結構</text><text x="1010.625" y="338.5" fill="#efa7b3" font-size="23" text-anchor="middle">外部驗證</text><text x="150" y="500" fill="#eac98d" font-size="28" text-anchor="start">讀圖、識字、推理與可靠引用是不同能力。</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">此為架構圖；不代表各供應商公開了相同內部實作。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>