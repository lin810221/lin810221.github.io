<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">閱讀順序不能只按全頁縱座標排序</title><desc id="desc">對照左右兩欄與跨欄錯誤箭頭，說明先分區再讀的前提，以及標題跨欄時要另外處理。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">閱讀順序不能只按全頁縱座標排序</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="80" y="180" width="1040" height="370" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><rect x="140" y="215" width="380" height="65" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="330.0" y="255.5" fill="#a9dece" font-size="23" text-anchor="middle">A 第一段</text><rect x="140" y="315" width="380" height="65" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="330.0" y="355.5" fill="#a9dece" font-size="23" text-anchor="middle">B 第二段</text><rect x="140" y="415" width="380" height="65" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="330.0" y="455.5" fill="#a9dece" font-size="23" text-anchor="middle">C 第三段</text><rect x="660" y="215" width="380" height="65" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="850.0" y="255.5" fill="#eac98d" font-size="23" text-anchor="middle">D 右欄首段</text><rect x="660" y="315" width="380" height="65" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="850.0" y="355.5" fill="#eac98d" font-size="23" text-anchor="middle">E 右欄次段</text><rect x="660" y="415" width="380" height="65" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="850.0" y="455.5" fill="#eac98d" font-size="23" text-anchor="middle">F 右欄末段</text><path d="M535 245L640 245" stroke="#efa7b3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="400" y="595" fill="#a9dece" font-size="26" text-anchor="start">先按欄讀：A → B → C，再 D → E → F</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">本課雙欄規則只適用合成版型；不是通用版面模型。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>