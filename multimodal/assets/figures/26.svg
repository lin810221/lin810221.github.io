<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">黑色方塊與真正移除內容是不同操作</title><desc id="desc">比較覆蓋畫面後仍可擷取的文字，和移除文字物件後的結果；指出其他圖層與metadata仍要另驗證。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">黑色方塊與真正移除內容是不同操作</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="80" y="215" width="450" height="240" rx="6" fill="#172620" stroke="#efa7b3" stroke-width="2"/><text x="305.0" y="312.0" fill="#efa7b3" font-size="23" text-anchor="middle">只畫黑塊</text><text x="305.0" y="343.0" fill="#efa7b3" font-size="23" text-anchor="middle">畫面看不到</text><text x="305.0" y="374.0" fill="#efa7b3" font-size="23" text-anchor="middle">文字物件可能仍存在</text><rect x="660" y="215" width="450" height="240" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="885.0" y="312.0" fill="#a9dece" font-size="23" text-anchor="middle">apply_redactions</text><text x="885.0" y="343.0" fill="#a9dece" font-size="23" text-anchor="middle">移除目標文字</text><text x="885.0" y="374.0" fill="#a9dece" font-size="23" text-anchor="middle">重新解析核對</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">本課只驗證合成PDF的指定欄位；不是任意檔案的匿名化認證。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>