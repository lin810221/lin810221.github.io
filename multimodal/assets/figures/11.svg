<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">表格的列、欄與金額是一個共同契約</title><desc id="desc">從Cable列追蹤數量、單價與列金額，再核對小計；說明只擷取所有數字仍無法重建表格關係。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">表格的列、欄與金額是一個共同契約</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="80" y="200" width="330" height="52" fill="#20382f" stroke="#52665e"/><text x="92" y="234" fill="#a9dece" font-size="21" text-anchor="start">Item</text><rect x="410" y="200" width="160" height="52" fill="#20382f" stroke="#52665e"/><text x="422" y="234" fill="#a9dece" font-size="21" text-anchor="start">Qty</text><rect x="570" y="200" width="230" height="52" fill="#20382f" stroke="#52665e"/><text x="582" y="234" fill="#a9dece" font-size="21" text-anchor="start">Unit</text><rect x="800" y="200" width="270" height="52" fill="#20382f" stroke="#52665e"/><text x="812" y="234" fill="#a9dece" font-size="21" text-anchor="start">Amount</text><rect x="80" y="252" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="286" fill="#e7eee9" font-size="21" text-anchor="start">Cable</text><rect x="410" y="252" width="160" height="52" fill="#141f1b" stroke="#52665e"/><text x="422" y="286" fill="#e7eee9" font-size="21" text-anchor="start">2</text><rect x="570" y="252" width="230" height="52" fill="#141f1b" stroke="#52665e"/><text x="582" y="286" fill="#e7eee9" font-size="21" text-anchor="start">12.50</text><rect x="800" y="252" width="270" height="52" fill="#141f1b" stroke="#52665e"/><text x="812" y="286" fill="#e7eee9" font-size="21" text-anchor="start">25.00</text><rect x="80" y="304" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="92" y="338" fill="#e7eee9" font-size="21" text-anchor="start">Adapter</text><rect x="410" y="304" width="160" height="52" fill="#141f1b" stroke="#52665e"/><text x="422" y="338" fill="#e7eee9" font-size="21" text-anchor="start">1</text><rect x="570" y="304" width="230" height="52" fill="#141f1b" stroke="#52665e"/><text x="582" y="338" fill="#e7eee9" font-size="21" text-anchor="start">20.00</text><rect x="800" y="304" width="270" height="52" fill="#141f1b" stroke="#52665e"/><text x="812" y="338" fill="#e7eee9" font-size="21" text-anchor="start">20.00</text><text x="130" y="465" fill="#95c9ef" font-size="28" text-anchor="start">逐列驗證：數量 × 單價 = 列金額</text><text x="130" y="530" fill="#a9dece" font-size="28" text-anchor="start">兩列金額相加：25.00 + 20.00 = 45.00</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">主線使用明確框線；無框表、合併欄位與跨頁需另驗證。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>