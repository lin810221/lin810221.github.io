<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">三種API保留各自的請求契約</title><desc id="desc">逐列辨認PDF輸入和結構化輸出所在位置，不要把某家JSON鍵直接貼到另一家。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">三種API保留各自的請求契約</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70" y="195" width="350" height="52" fill="#20382f" stroke="#52665e"/><text x="82" y="229" fill="#a9dece" font-size="21" text-anchor="start">服務</text><rect x="420" y="195" width="330" height="52" fill="#20382f" stroke="#52665e"/><text x="432" y="229" fill="#a9dece" font-size="21" text-anchor="start">文件輸入</text><rect x="750" y="195" width="380" height="52" fill="#20382f" stroke="#52665e"/><text x="762" y="229" fill="#a9dece" font-size="21" text-anchor="start">結構化參數</text><rect x="70" y="247" width="350" height="52" fill="#141f1b" stroke="#52665e"/><text x="82" y="281" fill="#e7eee9" font-size="21" text-anchor="start">OpenAI Responses</text><rect x="420" y="247" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="432" y="281" fill="#e7eee9" font-size="21" text-anchor="start">input_file</text><rect x="750" y="247" width="380" height="52" fill="#141f1b" stroke="#52665e"/><text x="762" y="281" fill="#e7eee9" font-size="21" text-anchor="start">text.format</text><rect x="70" y="299" width="350" height="52" fill="#141f1b" stroke="#52665e"/><text x="82" y="333" fill="#e7eee9" font-size="21" text-anchor="start">Gemini Interactions</text><rect x="420" y="299" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="432" y="333" fill="#e7eee9" font-size="21" text-anchor="start">document content</text><rect x="750" y="299" width="380" height="52" fill="#141f1b" stroke="#52665e"/><text x="762" y="333" fill="#e7eee9" font-size="21" text-anchor="start">response_format</text><rect x="70" y="351" width="350" height="52" fill="#141f1b" stroke="#52665e"/><text x="82" y="385" fill="#e7eee9" font-size="21" text-anchor="start">Claude Messages</text><rect x="420" y="351" width="330" height="52" fill="#141f1b" stroke="#52665e"/><text x="432" y="385" fill="#e7eee9" font-size="21" text-anchor="start">document source</text><rect x="750" y="351" width="380" height="52" fill="#141f1b" stroke="#52665e"/><text x="762" y="385" fill="#e7eee9" font-size="21" text-anchor="start">output_config.format</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">Gemini範例使用穩定v1；模型ID由使用者明確指定。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>