<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">文件中介表示保留層級與來源身分</title><desc id="desc">從文件走到頁面和字詞，再找出欄位引用需要哪四個資訊；指出頁碼相同不代表來源相同。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">文件中介表示保留層級與來源身分</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70" y="260" width="210" height="100" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="175.0" y="302.5" fill="#95c9ef" font-size="23" text-anchor="middle">document</text><text x="175.0" y="333.5" fill="#95c9ef" font-size="23" text-anchor="middle">hash</text><path d="M280 310L370 310" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="390" y="260" width="210" height="100" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="495.0" y="302.5" fill="#a9dece" font-size="23" text-anchor="middle">page</text><text x="495.0" y="333.5" fill="#a9dece" font-size="23" text-anchor="middle">index + size</text><path d="M600 310L690 310" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="710" y="260" width="210" height="100" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="815.0" y="302.5" fill="#eac98d" font-size="23" text-anchor="middle">block → line</text><text x="815.0" y="333.5" fill="#eac98d" font-size="23" text-anchor="middle">word + bbox</text><text x="150" y="480" fill="#a9dece" font-size="27" text-anchor="start">欄位證據：document hash + page index + bbox + quote</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">圖形、表格與欄位可增加節點型別，不要只拼接成字串。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>