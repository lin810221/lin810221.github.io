<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">OCR是定位、方向與辨識的組合</title><desc id="desc">指出偵測框、方向分類與字串各自可能出錯的位置；區分辨識分數與經校準的正確機率。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">OCR是定位、方向與辨識的組合</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70.0" y="245" width="238.75" height="110" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><text x="189.375" y="292.5" fill="#95c9ef" font-size="23" text-anchor="middle">文字區域偵測</text><text x="189.375" y="323.5" fill="#95c9ef" font-size="23" text-anchor="middle">四邊形或框</text><path d="M308.75 300L337.75 300" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="343.75" y="245" width="238.75" height="110" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="463.125" y="292.5" fill="#a9dece" font-size="23" text-anchor="middle">文字方向</text><text x="463.125" y="323.5" fill="#a9dece" font-size="23" text-anchor="middle">必要時旋轉</text><path d="M582.5 300L611.5 300" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="617.5" y="245" width="238.75" height="110" rx="6" fill="#172620" stroke="#eac98d" stroke-width="2"/><text x="736.875" y="292.5" fill="#eac98d" font-size="23" text-anchor="middle">文字行辨識</text><text x="736.875" y="323.5" fill="#eac98d" font-size="23" text-anchor="middle">47.25</text><path d="M856.25 300L885.25 300" stroke="#adbbb4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="891.25" y="245" width="238.75" height="110" rx="6" fill="#172620" stroke="#efa7b3" stroke-width="2"/><text x="1010.625" y="292.5" fill="#efa7b3" font-size="23" text-anchor="middle">區域與分數</text><text x="1010.625" y="323.5" fill="#efa7b3" font-size="23" text-anchor="middle">保留版本</text><text x="120" y="490" fill="#eac98d" font-size="27" text-anchor="start">偵測漏掉一行，辨識器就沒有機會讀到它。</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">主線真實執行PP-OCRv6；手寫與繁中精度需另做目標測試。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>