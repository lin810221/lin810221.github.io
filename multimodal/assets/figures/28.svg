<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">影片抽幀保留時間，不能只保留圖片</title><desc id="desc">讀四個時間戳並推測中間未取樣的區段，說明事件召回率與取樣間隔的關係。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#adbbb4"/></marker></defs><rect width="1200" height="720" fill="#101713"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="60" y="70" fill="#a9dece" font-size="31" text-anchor="start">影片抽幀保留時間，不能只保留圖片</text><text x="60" y="118" fill="#adbbb4" font-size="20" text-anchor="start">原創中文圖解 · 教學合成資料；依標籤追蹤座標、證據與處理邊界</text><rect x="70" y="220" width="235" height="160" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><rect x="90" y="280" width="50" height="45" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="185" y="435" fill="#a9dece" font-size="25" text-anchor="middle">0 ms</text><rect x="345" y="220" width="235" height="160" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><rect x="390" y="280" width="50" height="45" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="460" y="435" fill="#a9dece" font-size="25" text-anchor="middle">500 ms</text><rect x="620" y="220" width="235" height="160" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><rect x="690" y="280" width="50" height="45" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="735" y="435" fill="#a9dece" font-size="25" text-anchor="middle">1000 ms</text><rect x="895" y="220" width="235" height="160" rx="6" fill="#172620" stroke="#95c9ef" stroke-width="2"/><rect x="990" y="280" width="50" height="45" rx="6" fill="#172620" stroke="#a9dece" stroke-width="2"/><text x="1010" y="435" fill="#a9dece" font-size="25" text-anchor="middle">1500 ms</text><text x="150" y="540" fill="#eac98d" font-size="27" text-anchor="start">事件若只出現在900ms，均勻抽幀可能沒有直接看到。</text><text x="60" y="635" fill="#eac98d" font-size="20" text-anchor="start">可執行範例解碼動畫GIF；MP4與聲畫同步另需FFmpeg或模型驗證。</text><text x="60" y="684" fill="#adbbb4" font-size="19" text-anchor="start">2026-11-27 · 多模態與文件AI · 機制示意，非產品效能或精度承諾</text></g></svg>